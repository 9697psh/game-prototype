document.addEventListener("keydown",e=>{
  if(!run||view==="title"||view==="over"||view==="clear") return;
  if(e.key==="t"||e.key==="T"){
    if(view==="text"){ view=run.txtBack||"map" } else { run.txtBack=view; view="text" }
    render(); return;
  }
  if(e.key==="b"||e.key==="B"){
    if(view==="bag"){ view=run.bagBack||"map" } else { run.bagBack=view; view="bag" }
    render(); return;
  }
});
document.addEventListener("keydown",e=>{
  if(view!=="battle") return;
  if(e.key==="Escape"){ sel=null; render(); return }
  if(e.key==="Enter"){ endTurn(); return }
  const n=parseInt(e.key,10); if(isNaN(n)||n<1||n>9) return;
  e.preventDefault();
  if(!sel){ pickUnit(n); return }
  if(sel.step===2){ if(n<=4) pickSkill(n-1,null); return }
  if(sel.step===3){ pickCount(n); return }
  if(sel.step===4){ if(n<=SLOTS) doSkill(n); return }
  if(sel.step===5){ if(n<=SLOTS) shadowGoTo(n) }
});

/* ─ 드래그 소환 ─ */
function startDrag(card,i){
  card.addEventListener("pointerdown",e=>{
    if(B.over) return;
    e.preventDefault();
    const c=B.hand[i]; const g=el(`<div class="ghost">${card.outerHTML}</div>`);
    document.body.appendChild(g); card.style.opacity=".35";
    const move=ev=>{
      g.style.left=ev.clientX+"px"; g.style.top=ev.clientY+"px";
      document.querySelectorAll("#mySide .slot").forEach(s=>{
        const r=s.getBoundingClientRect();
        s.classList.toggle("drop", ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom);
      });
    };
    const up=ev=>{
      document.removeEventListener("pointermove",move);
      document.removeEventListener("pointerup",up);
      g.remove(); card.style.opacity="";
      let hit=null, side="mine";
      document.querySelectorAll("#mySide .slot,#foeSide .slot").forEach(s=>{
        const r=s.getBoundingClientRect();
        if(ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom){
          hit=+s.dataset.slot; side=s.closest("#foeSide")?"foe":"mine";
        }
        s.classList.remove("drop");
      });
      if(hit) playCard(i,hit,side);
    };
    document.addEventListener("pointermove",move);
    document.addEventListener("pointerup",up);
    move(e);
  });
}
/* 배치 여부와 무관한 아군 전원 (기절한 대원 제외) + 전장의 소환물 */
function allAllies(){
  return run.heroes.filter(x=>!x.down).concat(liveMins());
}
function onSummon(h){
  const t=h.tag;
  /* ── 영웅을 배치할 때마다 (라운드마다 다시) ── */
  if(t.startStorm){ say("폭풍 — 전장의 모든 적이 떠오릅니다.","t1");
    B.foes.filter(f=>f.alive).forEach(f=>airborne(h,f)) }
  if(t.startBlade){ say("전장의 칼날 — 첫 일격이 전장을 훑습니다.","t1");
    B.foes.filter(f=>f.alive).forEach(f=>hurt(f,t.startBlade,"전장의 칼날","slash")) }
  /* ── 아래는 전투 시작 효과 : 그 전투에서 처음 나설 때 한 번만 ── */
  if(h.summoned) return;
  h.summoned=1;
  if(t.startHeal){ healUp(h,t.startHeal);
    fx({side:"mine",slot:h.slot,s:"heal",txt:"+"+t.startHeal,cls:"heal",gap:60});
    say(`한숨 돌리기 — ${h.name} 체력 +${t.startHeal}`,"t2") }
  if(t.startGold){ run.gold+=t.startGold; say(`관객의 응원 — 금화 +${t.startGold}`,"t2") }
  if(t.gearShield){ allAllies().forEach(a=>{ a.shield+=t.gearShield });
    say(`튼튼한 방어구 — 모든 아군 보호막 +${t.gearShield}`,"t2") }
  if(t.gearPlus) for(let q=0;q<t.gearPlus;q++) giveArmor(h,rnd(t.armors||["강철 갑옷"]));
  { const ev=itemBt(h,"startEvade"); if(ev){ h.evade+=ev; say(`${h.name} 회피 +${ev} (장비)`,"t2") } }
  if(itemBt(h,"startHide")){ h.hide=1; hideFX(h.slot); say(`${h.name}${jo(h.name,"ig")} 그림자에 숨습니다.`,"t2") }
  { const dd=itemBt(h,"startDefDn");
    if(dd) B.foes.filter(f=>f.alive).forEach(f=>addDeb(f,"defDn",dd,h)) }
  if(itemBt(h,"startMark")){
    const f=B.foes.filter(x=>x.alive).sort((a,b)=>a.hp-b.hp)[0];
    if(f){ f.mark=(f.mark||0)+1; f.markBy=h.name;
      fx({side:"foe",slot:f.slot,ring:"#6aa8e0",txt:"표식",cls:"mag",gap:70});
      say(`현자의 눈 — ${f.name}에게 표식`,"t2") } }
  { const ab=itemBt(h,"allyBuff");
    if(ab) allAllies().forEach(a=>{ if(a!==h){ bumpTmp(a,"mag",ab); bumpTmp(a,"def",ab) } }) }
  if(t.startMom){ h.mom+=t.startMom; say(`${h.name} 추진력 +${t.startMom} (눈보다 빠르게)`,"t2") }
  if(t.startEvade){ h.evade+=t.startEvade; say(`${h.name} 회피 +${t.startEvade} (자취 감추기)`,"t2") }
  const es=itemBt(h,"eshield")+(t.eshield||0);
  if(es){ h.eshield+=es; say(`${h.name} 에너지 보호막 +${es}`,"t2") }
  if(itemBt(h,"alwaysTaunt")){ h.taunt=99; h.permaTaunt=1 }
  const hm=itemBt(h,"hpMag"); if(hm) bumpTmp(h,"mag",Math.floor(h.hp*hm/100));
  const da=itemBt(h,"defAura"); if(da){ h.eshield+=h.def*da;
    say(`수호의 각인 — ${h.name} 에너지 보호막 +${h.def*da}`,"t2") }
  if(t.startAura){
    allAllies().forEach(a=>{ a.eshield=(a.eshield||0)+t.startAura;
      if(a.slot>0) fx({side:"mine",slot:a.slot,ring:"#e07b28",txt:"◆+"+t.startAura,cls:"shd",gap:60}) });
    say(`전장의 방패 — 모든 아군 에너지 보호막 +${t.startAura}`,"t2") }
  const sm=itemBt(h,"startMom"), ss=itemBt(h,"startShield")+(t.startShield||0);
  if(sm){ h.mom+=sm; say(`${h.name} 추진력 +${sm} (장비)`,"t2") }
  if(ss){ h.shield+=ss; say(`${h.name} 보호막 +${ss}`,"t2") }
  if(h.name==="도미니코"){
    const dm=B.foes.filter(f=>f.alive&&f.demon).length;
    if(dm){ bumpTmp(h,"def",dm*2); say(`악마 혐오 — ${h.name} 이번 전투 동안 보호력 +${dm*2}`,"t2") }
  }
}
/* 그 턴에만 붙는 능력치 — 내 턴이 시작될 때 걷힌다 */
function bumpTurn(h,key,v){
  h.turnTmp=h.turnTmp||{};
  h.turnTmp[key]=(h.turnTmp[key]||0)+v;
  h[key]=(h[key]||0)+v;
}
function clearTurnTmp(h){
  if(!h.turnTmp) return;
  for(const k in h.turnTmp) h[k]=(h[k]||0)-h.turnTmp[k];
  h.turnTmp=null;
}
function bumpTmp(h,key,v){
  h.tmp=h.tmp||{};
  h.tmp[key]=(h.tmp[key]||0)+v;
  h[key]=(h[key]||0)+v;
  if(key==="maxHp") h.hp+=v;
}
function clearTmp(h){
  if(!h.tmp) return;
  for(const k in h.tmp) h[k]=(h[k]||0)-h.tmp[k];
  if(h.tmp.maxHp) h.hp=Math.min(h.hp,h.maxHp);
  if(h.hp<1&&h.maxHp>0) h.hp=Math.max(0,Math.min(h.hp,h.maxHp));
  h.tmp=null;
}
function gainScale(h,n){
  if(!n) return;
  h.scale=(h.scale||0)+n; h.scaleTurn=(h.scaleTurn||0)+n;
  fx({side:"mine",slot:h.slot,ring:"#9ad06a",txt:"비늘+"+n,cls:"shd",gap:60});
}
function singTune(h,t){
  if(t==="guard"){ const v=1+h.def;
    allUnits().forEach(a=>{ a.shield+=v; fx({side:"mine",slot:a.slot,ring:"#e0c85a",txt:"+"+v,cls:"shd",gap:60}) });
    say(`보호의 음율 — 모든 아군 보호막 +${v}`) }
  if(t==="life"){ const a=allUnits().sort((x,y)=>x.hp/x.maxHp-y.hp/y.maxHp)[0];
    if(a){ healUp(a,3);
      fx({side:"mine",slot:a.slot,s:"heal",txt:"+3",cls:"heal",gap:60});
      say(`생명의 음율 — ${a.name} 체력 +3`) } }
  if(t==="edge"){ const v=1+h.mag;
    B.foes.filter(f=>f.alive).forEach(f=>hurt(f,v,"날카로운 음율","mag")) }
  if(t==="shock"){ const f=nearestFoe(h);
    if(f){ addDeb(f,"stun",1); say(`충격의 음율 — ${f.name} 기절`) } }
}
function endShield(h,v){
  if(!v) return;
  h.shield+=v;
}
function veilCheck(h){
  if(h.name!=="카제") return;
  const need=Math.max(1,h.tag.veilNeed||8);
  const done=h.veilDone||0;
  if((h.acts||0)<need*(done+1)) return;
  h.veilDone=done+1;
  const v=(h.tag.veilAmt||6)+h.def;
  h.shield+=v;
  pulseFX("mine",h.slot,"#5fd8cf",3);
  edgeGlow("rgba(95,216,207,.34)");
  fx({side:"mine",slot:h.slot,s:"shield",ring:"#5fd8cf",txt:"+"+v,cls:"shd",gap:160});
  say(`회오리 장막 — ${h.name} 보호막 +${v}`,"t1");
  if(h.tag.veilAll) run.heroes.forEach(a=>{
    if(a!==h&&a.slot>0&&a.hp>0){ a.shield+=v;
      fx({side:"mine",slot:a.slot,ring:"#5fd8cf",txt:"+"+v,cls:"shd"}) } });
}
function playCard(i,slot,side){
  const c=B.hand[i]; if(!c) return;
  const wantFoe=!!(c.stock&&CARD_LIB[c.stock]&&CARD_LIB[c.stock].foe)||!!c.foe;
  if(wantFoe){
    if(side!=="foe"){ say(`${c.name}${jo(c.name,"eun")} 적의 칸에 던져야 합니다.`,"t2"); return }
    const f=foeAt(slot);
    if(!f){ say("그 칸에는 적이 없습니다.","t2"); return }
    B.lastAttacker=null;     /* 카드는 되받아칠 사람이 없다 */
    c.use(f);
    if(c.stock){ useCard(c.stock);
      const e=(run.cards||[]).find(x=>x.n===c.stock);
      if(e){ c.d=CARD_LIB[c.stock].d+` (보유 ${e.c})` } else B.hand.splice(i,1);
    } else B.hand.splice(i,1);
    checkEnd(); render(); return;
  }
  if(side==="foe"){ say("아군 칸에 놓아야 합니다.","t2"); return }
  if(c.type==="summon"){
    if(unitAt(slot)){ say("그 칸에는 이미 누군가 있습니다.","t2"); return }
    const m=makeMin(c.name,slot);
    B.mins.push(m); B.hand.splice(i,1);
    fx({side:"mine",slot:slot,s:"summon",ring:"#a06ae0",glow:1,txt:"소환",cls:"shd",gap:60});
    say(`${c.name}${jo(c.name,"ig")} ${slot}번 칸에 소환됩니다.`,"t1");
    rollIntents(); render(); return;
  }
  if(c.type==="hero"){
    if(unitAt(slot)){ say("그 칸에는 이미 누군가 있습니다.","t2"); return }
    c.hero.slot=slot; B.hand.splice(i,1);
    fx({side:"mine",slot:slot,s:"summon",ring:"#7fd39a",glow:1,gap:60});
    onSummon(c.hero);
    bark(c.hero,"in");
    wanderCheck();
    rollIntents();
    say(`${c.hero.name}${jo(c.hero.name,"ig")} ${slot}번 칸에 자리를 잡습니다.`,"t1");
  }else{
    const h=unitAt(slot);
    if(!h){ say("카드를 쓸 아군이 없는 칸입니다.","t2"); return }
    c.use(h);
    if(!c.stock||!CARD_LIB[c.stock]) SFX.play("shield");
    if(c.stock){ useCard(c.stock);
      const e=(run.cards||[]).find(x=>x.n===c.stock);
      if(e){ c.d=CARD_LIB[c.stock].d+` (보유 ${e.c})` } else B.hand.splice(i,1);
    } else B.hand.splice(i,1);
  }
  render();
}

/* ─ 전투 처리 ─ */
/* 관통 — 값이 true 면 100%, 숫자면 그 비율(%)만큼 체력에 곧바로 들어간다 */
function pierceRate(p){ return p===true?100:Math.max(0,Math.min(100,+p||0)) }
function hurt(f,amt,tag,art,pierce,crit){
  let d=amt,s=0;
  const pr=pierceRate(pierce);
  const thru=Math.round(amt*pr/100);       /* 보호막을 무시하고 체력으로 */
  let rest=amt-thru;
  if(rest>0){ s=Math.min(f.shield,rest); f.shield-=s; rest-=s }
  d=thru+rest;
  /* 적의 회피 */
  if(f.evade>0){ f.evade--; d=0; s=0;
    fx({side:"foe",slot:f.slot,s:"miss",txt:"회피",cls:"miss",gap:60});
    say(`${f.name}${jo(f.name,"ig")} ${tag}${jo(tag,"eul")} 피했습니다.`,"t2"); return }
  f.hp-=d;
  if(crit) FXQ.push({crit:1,side:"foe",slot:f.slot});
  fx({side:"foe",slot:f.slot,hit:1,art:art||"slash",txt:"-"+amt,
      cls:crit?"critbig":(art==="mag"?"mag":(amt>=15?"crit":"dmg")),
      gap:crit?170:undefined,
      s:crit?null:(pr>=50?"pierce":art==="wind"?"gust":art==="mag"?"mag":
                   art==="boom"?"boom":art==="claw"?"slash2":amt>=12?"blunt":"slash")});
  say(`${tag} → ${f.name}(${f.slot}번) ${crit?"치명타 ":""}피해 ${amt}${
    pr?` (관통 ${pr}%${pr<100?` · 체력 ${thru}`:""})`:""}${s?` (보호막 ${s})`:""} · 남은 ${Math.max(0,f.hp)}`,crit?"t1":undefined);
  if(f.thorn&&f.alive&&d>0&&!f.thornBusy){
    const src=B.lastAttacker;
    if(src&&src.hp>0&&src.slot>0&&!src.isFoe){
      f.thornBusy=1;                 /* 가시끼리 무한히 주고받지 않게 */
      hurtAlly(f,src,f.thorn,`${f.name}의 가시`);
      f.thornBusy=0;
    } }
  if(f.hp>0&&d>0) bark(f,"hurt");
  if(f.hp<=0&&f.alive){ f.alive=0; bark(f,"down",1);
    fx({side:"foe",slot:f.slot,s:"die",txt:"처치",cls:"crit",gap:170});
    say(`${f.name} 처치.`,"t1");
    if(f.isPhantom){
      const src=B.foes.find(x=>x.id===f.phantomOf&&x.alive);
      if(src) hurt(src,f.backlash||4,"환영의 반동","mag");
    }
    /* 원래 적이 죽으면 그 환영도 함께 사라진다 */
    B.foes.filter(x=>x.alive&&x.isPhantom&&x.phantomOf===f.id).forEach(x=>{
      x.alive=0; say(`${x.name}${jo(x.name,"ig")} 흩어집니다.`,"t2") });
    (B.mins||[]).filter(m=>m.alive&&m.phantomOf===f.id).forEach(m=>{
      m.alive=0; m.slot=0; say(`환영이 흩어집니다.`,"t2") });
    onDeath("foe",f) }
}
function onDeath(kind,who){
  /* 쿠렘타이 영혼 수확 */
  if(run.heroes.some(h=>h.name==="쿠렘타이")){
    let g=0;
    if(kind==="foe") g=(who&&who.isPhantom)?1:(who&&who.boss?10:(B&&B.kind==="elite"?5:1));
    else if(kind==="min") g=1;
    else if(kind==="ally") g=5;
    if(who&&(who.isPhantom||who.of)) g=1;
    if(g){ run.souls=(run.souls||0)+g;
      const k=run.heroes.find(h=>h.name==="쿠렘타이");
      const want=Math.floor(run.souls/40);
      if(k&&(k.soulMag||0)<want){ const add=want-(k.soulMag||0); k.soulMag=want; k.mag+=add;
        say(`영혼 수확 — ${k.name}의 마법력이 ${add} 올랐습니다. (영혼 ${run.souls})`,"t1") }
    }
  }
  if(kind==="foe"){
    run.heroes.forEach(h=>{
      if(h.name==="보아"&&h.slot>0&&h.venom) gainScale(h,10);
      if(h.name==="데린저"&&who&&h.aimAt!=null&&h.aimAt===who.id){ h.aimAt=null;
        if(h.deb) h.deb.bind=0; say(`${h.name} 조준이 풀립니다.`,"t2") }
    });
  }
  run.heroes.forEach(h=>{
    if(kind!=="min"&&h.name==="굴라"&&h.slot>0&&h.greed<(h.tag.greedCap||3)){ h.greed++; h.maxHp++; h.hp++ }
    if(kind==="foe"&&h.name==="인비디아"&&h.slot>0&&h.hp>0){
      const got=[];
      if(Math.random()<0.25){ bumpTmp(h,"atk",1); got.push("공격력") }
      if(Math.random()<0.25){ bumpTmp(h,"mag",1); got.push("마법력") }
      if(Math.random()<0.25){ bumpTmp(h,"def",1); got.push("보호력") }
      if(Math.random()<0.25){ bumpTmp(h,"maxHp",4); got.push("최대 체력") }
      if(got.length) say(`재능 시기 — ${h.name}${jo(h.name,"ig")} 이번 전투 동안 ${got.join("·")}${jo(got[got.length-1],"eul")} 흡수합니다.`,"t1");
    }
  });
}
function airborne(h,f){

function doSkill(target){
  const h=sel.hero,i=sel.skill,n=sel.count,s0=h.sk[i];
  if(isMoveSkill(s0)){
    const why=moveBlock(h,s0,target);
    if(why){ say(why,"t2"); render(); return }
  }
  if(s0.tg==="foe"){
    if(!foeAt(target)){ say("그 칸에는 적이 없습니다.","t2"); return }
    { const why=foeBlockReason(foeAt(target));
      if(why){ say(why,"t2"); return } }
    if(!inReach(h,s0,target)){
      const r=reachOf(h,s0);
      fx({side:"foe",slot:target,s:"miss",txt:"사거리 "+r,cls:"miss"});
      say(`사거리 ${r} 밖입니다. 다른 대상을 고르세요.`,"t2"); render(); return;
    }
    const pin=pinnedFoe(h,s0);
    if(pin&&pin.slot!==target){
      say(`${s0.n}${jo(s0.n,"eun")} 가장 ${s0.farshot?"멀리":"가까이"} 있는 적(${pin.slot}번)만 겨눌 수 있습니다.`,"t2");
      render(); return;
    }
  }
  if(s0.shadow&&!h.shadowAt&&sel.moveTo==null){
    sel.target=target; sel.step=5; SFX.play("click"); render(); return;
  }
  h.shadowGo=(sel.moveTo!=null?sel.moveTo:0);
  bark(h,"atk");
  say(`▸ ${h.name} — ${s0.n} ×${n}`,"t1");
  for(let k=0;k<n;k++){
    if(B.over||h.hp<=0) break;
    const s=h.sk[i];
    if(deb(h,"fear")&&(s.tg==="foe"||s.tg==="any")){
      const tg2=foeAt(Math.abs(target));
      if(tg2&&uid(tg2)===h.fearSrc){
        say(`${h.name}${jo(h.name,"eun")} ${tg2.name}${jo(tg2.name,"eul")} 마주 볼 수 없습니다. 다른 적을 노리세요.`,"t3");
        break }
    }
    /* 전환(방패 막기 ↔ 방패 밀치기)처럼 도중에 대상 종류가 바뀌면 겨눌 적을 다시 고른다 */
    if(s.tg==="foe"&&(target==null||!foeAt(target)||!inReach(h,s,target))){
      const re=pinnedFoe(h,s)
        || openFoes().filter(f=>inReach(h,s,f.slot))
                     .sort((a,b)=>dist(h.slot,a.slot)-dist(h.slot,b.slot))[0];
      if(!re){ say(`${s.n} — 사거리 안에 적이 없어 중단합니다.`,"t2"); break }
      if(re.slot!==target){ target=re.slot;
        say(`${s.n}${jo(s.n,"eun")} ${re.name}(${re.slot}번)에게 나갑니다.`,"t2") }
    }
    { const pn=pinnedFoe(h,s); if(pn) target=pn.slot; else if(s.farshot||s.nearest) break }
    if(!canPay(h,i,1)){ say("자원이 부족해 중단합니다.","t2"); break }
    /* 비용 지불 */
    if(s.costType==="scale"){ h.scale-=s.cost }
    else if(s.costType==="mom"){
      if(s.rise){ h.mom-=s.cost+h.airUp; h.airUp++ } else h.mom-=s.cost; }
    else if(h.name==="카제"&&i===1&&h.free>0){ h.free-- }
    else if(h.tag.freeCut&&i===0&&h.guarded){ h.guarded=0 }
    else { h.mana-=s.cost; h.manaUsed=(h.manaUsed||0)+s.cost;
      if(s.cost){
        const mm=itemBt(h,"manaMom"); if(mm) h.mom+=s.cost*mm;
        const ms2=itemBt(h,"manaShield"); if(ms2) h.shield+=s.cost*ms2;
        (h.items||[]).forEach(it=>{ const k=it.bt&&it.bt.manaBolt; if(!k) return;
          const list=B.foes.filter(f=>f.alive);
          if(!list.length) return;
          const t2=(k==="mag")?list.reduce((a,b)=>a.slot>=b.slot?a:b)
                              :list.reduce((a,b)=>a.slot<=b.slot?a:b);
          hurt(t2,s.cost+(k==="mag"?h.mag:h.atk),k==="mag"?"마나 첨탑":"마나 도검",k==="mag"?"mag":"slash") });
      }
      if(h.name==="이테리오"&&s.cost) bumpTurn(h,"mag",s.cost); }
    if(s.ammo){ h.ammo=Math.max(0,(h.ammo||0)-1) }
    if(s.limit) h.limitUsed[i]=(h.limitUsed[i]||0)+1;
    if(s.lock) h.lock[i]=s.lock+1;
    if(deb(h,"chill")){ const v=h.deb.chill;
      h.hp-=v; fx({side:"mine",slot:h.slot,hit:1,txt:"-"+v,cls:"dmg",gap:70});
      say(`${h.name} 냉각 피해 ${v}`,"t3") }
    if(deb(h,"stun")){ h.deb.stun--;
      fx({side:"mine",slot:h.slot,txt:"기절",cls:"miss",gap:70});
      say(`${h.name}${jo(h.name,"eun")} 기절해 ${s.n}${jo(s.n,"ig")} 불발됩니다.`,"t3");
      continue }
    runEffect(h,i,s,target);
    if(s.read) addRead(h,s.read);
    if(h.mobile&&!s.jumpback){
      const back=h.slot-1;
      if(back>=1&&!unitAt(back)) moveTo(h,back);
      else { const v=1+h.mag; h.eshield=(h.eshield||0)+v;
        fx({side:"mine",slot:h.slot,ring:"#e07b28",txt:"◆+"+v,cls:"shd",gap:60}) }
    }
    if(s.alt){
      const back=Object.assign({},s); const nx=Object.assign({},s.alt);
      back.mods=s.mods; nx.mods=s.alt.mods;
      delete back.alt; nx.alt=back; h.sk[i]=nx;
      say(`${s.n} → ${nx.n}${jo(nx.n,"eu")}로 전환됩니다.`,"t2");
    }
    if(h.name==="카제"&&(s.el==="이동"||s.dmg!=null)){ h.acts=(h.acts||0)+1; veilCheck(h) }
    if(h.name==="나이코스"&&i===0&&h.tag.chargeCut){
      const fr=h.slot+1<=SLOTS?h.slot+1:h.slot-1;
      if(fr>=1&&fr<=SLOTS&&fr!==h.slot) moveTo(h,fr);
      h.mom=(h.mom||0)+1;
      if(h.mom>=6){ h.mom=0; h.sk[0].twice=1; h.chargeArmed=1;
        say("돌격 베기 — 다음 베기가 두 번 나갑니다.","t1") }
      else if(h.chargeArmed){ h.chargeArmed=0; if(!h.tag.twicePerm) h.sk[0].twice=0 }
    }
    if(s.tg==="foe"&&!foeAt(target)&&k<n-1){
      const _s=h.sk[i];
      const alt=pinnedFoe(h,_s)
        || openFoes().filter(f=>inReach(h,_s,f.slot))
                     .sort((a,b)=>dist(h.slot,a.slot)-dist(h.slot,b.slot))[0];
      if(!alt) break;
      target=alt.slot; say(`대상이 쓰러져 ${alt.name}(${alt.slot}번)으로 옮깁니다.`,"t2");
    }
  }
  sel=null; checkEnd(); render();
}
/* ═══ 이동 기술의 목적지 판정 ═══
   '이동' 속성으로 칸을 고르는 기술은, 특별한 예외가 없는 한
   지금 서 있는 칸을 고를 수 없다. */
function isMoveSkill(sk){ return !!(sk&&sk.el==="이동"&&sk.tg==="ally") }
/* 예외 — 카제의 '제자리바람' 특성은 움직이지 않고도 쓸 수 있게 해 준다 */
function moveStayOk(h,sk){ return !!(h&&h.tag&&h.tag.gustStay&&sk&&sk.el==="이동") }
/* 고를 수 있는 거리 — 산들바람은 방향만 고르면 알아서 한 칸 나아간다 */
function movePickRange(sk){ return (sk&&(sk.jumpback||sk.soothe))?2:SLOTS }
/* 못 고르는 칸이면 그 이유를 돌려준다 */
function moveBlock(h,sk,to){
  if(!isMoveSkill(sk)||to==null) return "";
  if(to===h.slot&&!moveStayOk(h,sk))
    return `${sk.n}${jo(sk.n,"eun")} 지금 서 있는 칸으로는 갈 수 없습니다. 다른 칸을 고르세요.`;
  const r=movePickRange(sk);
  if(Math.abs(to-h.slot)>r)
    return `${sk.n}${jo(sk.n,"eun")} ${r}칸까지만 움직입니다.`;
  return "";
}
function shadowGoTo(slot){
  if(!sel||sel.step!==5) return;

function emptyOkAny(sk){ return !!(sk&&(sk.phantom||sk.minion)) }
/* 흡수 — 피해를 줬다면 최소 1은 회복한다 */

function moveTo(h,to){

  { const ms=itemBt(h,"moveShield"); if(ms) h.shield+=ms;

  if(deb(h,"shock")){ const v=h.deb.shock;
    h.hp-=v; fx({side:"mine",slot:h.slot,hit:1,txt:"-"+v,cls:"dmg",gap:70});

function infectFoe(f,n){
  if(!f.alive) return;
  { const src=B.lastAttacker;
    if(src&&src.slot>0){ const a=ctrOf("mine",src.slot), b=ctrOf("foe",f.slot);
      if(a&&b) beamFX(a,b,"#8f5fd0",4) } }
  f.infect=(f.infect||0)+n;
  fx({side:"foe",slot:f.slot,ring:"#8f5fd0",txt:"감염"+f.infect,cls:"mag",gap:80});
}
function addRead(h,n){
  if(h.name!=="도미니코") return;
  h.read=(h.read||0)+n+(h.tag.readPlus||0);
  const need=h.tag.readNeed||10;
  if(h.read>=need&&!h.blessed){ h.read-=need; h.blessed=1;
    pulseFX("mine",h.slot,"#c9a227",3);
    veil("radial-gradient(circle,rgba(201,162,39,.22),transparent 70%)");
    fx({side:"mine",slot:h.slot,s:"summon",ring:"#c9a227",txt:"축복",cls:"crit"});
    say(`${h.name} 축복 상태 — 다음 기술이 강화됩니다.`,"t1") }
}
function runEffect(h,i,s,target){
  B.lastAttacker=h;          /* 가시가 되받아칠 상대 */
  const tgt=foeAt(target);
  /* ── 쿠렘타이 ── */
  if(s.drain){
    const t0=foeAt(target); if(!t0){ say("그 칸에는 적이 없습니다.","t2"); return }
    const so=run.souls||0;
    const list=[t0];

        demon:0,boss:0,shield:0,air:0,alive:1,id:B.foes.length+100,infect:0,stun:0,weak:0,

    const f=B.foes.filter(x=>x.alive).sort((a,b)=>dist(h.slot,b.slot)-dist(h.slot,a.slot))[0];
    if(!f){ say("적이 없습니다.","t2"); return }
    fx({side:"foe",slot:f.slot,streak:{side:"mine",slot:h.slot},s:"arrow",gap:120});
    hurt(f,s.dmg+mod(s,"dmg")+h.atk,"페일노트","slash"); return;
  }
  if(s.armorUp){
    h.armor=(h.armor||0)+1+(h.tag.armorPlus||0);
    fx({side:"mine",slot:h.slot,s:"shield",ring:"#e0c85a",txt:"갑피"+h.armor,cls:"shd"});
    say(`${h.name} 갑피 ${h.armor}`); return;
  }
  /* ── 인비디아 ── */
  if(s.nearest){
    const f=foeAt(target)||nearestFoe(h);
    if(!f){ say("적이 없습니다.","t2"); return }
    if((f.infect||0)>=3){ healUp(h,4);
      fx({side:"mine",slot:h.slot,s:"heal",txt:"+4",cls:"heal"}); say(`${h.name} 체력 +4`) }
    hurt(f,s.dmg+mod(s,"dmg")+h.mag,"죄악의 기침","mag");
    infectFoe(f,h.tag.infectPlus||1);
    return;
  }
  if(s.spread){
    B.foes.filter(f=>f.alive&&f.infect>0).forEach(f=>pulseFX("foe",f.slot,"#8f5fd0",2));
    const t2=foeAt(target); if(!t2){ say("그 칸에는 적이 없습니다.","t2"); return }
    const r=h.tag.spreadRange||1;
    B.foes.filter(f=>f.alive&&f.infect>0).forEach(f=>{ f.weak=(f.weak||0)+1 });
    infectFoe(t2,1);
    B.foes.filter(f=>f.alive&&f!==t2&&Math.abs(f.slot-t2.slot)<=r).forEach(f=>infectFoe(f,1));
    say("확산 — 감염이 번집니다.","t1"); return;
  }
  if(s.burst){
    B.foes.filter(f=>f.alive&&f.infect>0).forEach((f,k)=>
      setTimeout(()=>{ pulseFX("foe",f.slot,"#c58fb0",3);
        fx({side:"foe",slot:f.slot,art:"boom",s:"boom",gap:0}); flushFX() },k*90));
    const x=h.tag.burstX||2;
    fx({side:"mine",slot:h.slot,quake:1,s:"boom",gap:200});
    B.foes.filter(f=>f.alive).forEach(f=>{
      const d=3+h.mag+(f.infect||0)*x; f.infect=0; hurt(f,d,"숙주 폭발","mag") });
    return;
  }
  if(s.frontal){
    const list=B.foes.filter(f=>f.alive&&(f.infect||0)>=3);
    if(!list.length){ say("감염이 깊은 적이 없습니다.","t2"); return }
    list.forEach(f=>{ infectFoe(f,1); f.forceDef=1 });
    say("전두엽 감염 — 감염이 깊은 적들이 움츠러듭니다.","t1"); return;
  }
  /* ── 도미니코 ── */
  if(s.wand){
    const v=1+(h.tag.wandPlus||0);
    if(target<0){
      const a=allyAt(-target); if(!a){ say("그 칸에는 아군이 없습니다.","t2"); return }
      healUp(a,v);
      fx({side:"mine",slot:a.slot,s:"heal",txt:"+"+v,cls:"heal"}); say(`${a.name} 체력 +${v}`);
    }else{
      const f=foeAt(target); if(!f){ say("그 칸에는 적이 없습니다.","t2"); return }
      hurt(f,1+v+h.def,"라이티늄 지팡이","mag");
    }
    if(h.blessed){ h.blessed=0; h.evade++; say("축복 — 회피 +1","t1") }
    return;
  }
  if(s.weaken){
    const f=foeAt(target); if(!f){ say("그 칸에는 적이 없습니다.","t2"); return }
    f.weakAtk=(f.weakAtk||0)+3;
    if(h.blessed){ h.blessed=0; f.weak=(f.weak||0)+3; say("축복 — 보호력도 약화","t1") }
    fx({side:"foe",slot:f.slot,ring:"#8f5fd0",txt:"약화",cls:"miss"});
    say(`${f.name} 다음 턴 공격력 -3`); return;
  }
  if(s.shackle){
    { const near0=B.foes.filter(x=>x.alive).sort((a,b)=>dist(h.slot,a.slot)-dist(h.slot,b.slot))[0];
      if(near0) chainFX({side:"mine",slot:h.slot},{side:"foe",slot:near0.slot},"#c9a227") }
    const gain=h.atk+h.mag;
    bumpTmp(h,"def",gain); bumpTmp(h,"atk",-h.atk); bumpTmp(h,"mag",-h.mag);
    if(gain) say(`영광의 족쇄 — 공격력·마법력 ${gain}을 보호력으로 전환`);
    const alive=B.foes.filter(f=>f.alive);
    const list=h.blessed?alive:alive.sort((a,b)=>dist(h.slot,a.slot)-dist(h.slot,b.slot)).slice(0,1);
    if(h.blessed){ h.blessed=0; say("축복 — 모든 적을 기절","t1") }
    list.forEach(f=>{ f.stun=1; hurt(f,8+h.def+(h.tag.shacklePlus||0),"영광의 족쇄","mag") });
    return;
  }
  if(s.penance){
    const rounds=h.tag.penanceTwice?2:1;
    for(let r=0;r<rounds;r++){
      let v=1+h.def;
      for(let q=1;q<=SLOTS;q++){ const a=allyAt(q); if(a){ a.shield+=v;
        fx({side:"mine",slot:q,ring:"#c9a227",txt:"+"+v,cls:"shd",gap:70}); v++ } }
      for(let q=1;q<=SLOTS;q++){ const f=foeAt(q); if(f){ hurt(f,v,"참회의 기류","mag"); v++ } }
      for(let q=SLOTS;q>=1;q--){ const f=foeAt(q); if(f){ hurt(f,v,"참회의 기류","mag"); v++ } }
    }
    const fars=B.foes.filter(f=>f.alive);
    if(fars.length){ const far=fars.reduce((a,b)=>a.slot>=b.slot?a:b);
      fx({side:"foe",slot:far.slot,sweep:{side:"mine",slot:h.slot},s:"tornado",gap:240});
      fx({side:"mine",slot:h.slot,sweep:{side:"foe",slot:far.slot},gap:240}); }
    say("참회의 기류가 오갑니다.","t1"); return;
  }
  if(s.el==="이동"){
    const reach=h.tag.gustRange||1;
    if(target&&target!==h.slot&&!h.tag.gustStayOnly){
      const step=target>h.slot?1:-1;
      let to=h.slot;
      for(let q=0;q<reach;q++){
        const nx=to+step;
        if(nx<1||nx>SLOTS) break;
        to=nx;
        if(nx===target) break;
      }
      if(to!==h.slot) moveTo(h,to);
      else say("그쪽으로는 움직일 수 없습니다.","t2");
    } else if(h.tag.gustStay||h.name!=="카제"){
      fx({side:"mine",slot:h.slot,s:"step",ring:"#5fd8cf",gap:90});
      say(`${h.name} 제자리에서 바람을 모읍니다.`);
    } else { say("이동할 칸을 골라야 합니다.","t2"); return }
    h.mom+=itemBt(h,"moveMom");
    const m=1+(h.tag.momPlus||0);
    h.mom+=m; h.windBuff+=1+(h.tag.gustPlus||0);
    say(`${h.name} 추진력 +${m} · 다음 진선풍도의 거리와 피해량 +${1+(h.tag.gustPlus||0)}`);
    return;
  }
  /* 공통 : 보호막 · 회복 */
  if(s.shield){ let v=s.shield+mod(s,"shield")+h.def;
    if(h.name==="나이코스"&&i===1&&h.tag.firstGuard&&h.first.guard!==1){
      v+=h.tag.firstGuard+h.def; h.first.guard=1 }
    if(deb(h,"defDn")) v=Math.ceil(v*0.5); if(i===1&&h.first.guard!==1&&h.tag.firstGuard){v+=h.tag.firstGuard;h.first.guard=1}
    h.shield+=v;
    fx({side:"mine",slot:h.slot,s:"shield",ring:"#e0c85a",glow:1,txt:"+"+v,cls:"shd"});
    say(`${h.name} 보호막 +${v}`) }
  if(s.taunt){ h.taunt=s.taunt }
  if(s.evade){ h.evade+=s.evade;
    if(h.tag.flowShield){ h.shield+=h.tag.flowShield; say(`${h.name} 보호막 +${h.tag.flowShield}`) }
    fx({side:"mine",slot:h.slot,s:"wind",ring:"#5fd8cf",txt:"회피",cls:"shd"});
    say(`${h.name} 회피 +${s.evade}`) }
  if(s.potential){ h.potential=1; h.free+=4+(h.tag.freePlus||0);
    pulseFX("mine",h.slot,"#5fd8cf",4);
    rainFX("#a8f0ea",22);
    edgeGlow("rgba(95,216,207,.55)");
    punchIn("mine",h.slot);
    fx({side:"mine",slot:h.slot,art:"wind",s:"tornado",glow:1,txt:"각성",cls:"crit",gap:220});
    say("잠재력 활성 — 이번 턴 진선풍도가 전체를 칩니다.","t1") }
  if(s.card||s.allArmor){
    const times=(h.tag.armorTwice?2:1)*(s.allArmor?0:1);
    if(s.allArmor){ h.tag.armors.forEach(nm=>giveArmor(h,nm));
      say("중무장 — 모든 방어구 카드를 얻었습니다.","t1"); }
    else for(let q=0;q<times;q++){
      if(h.tag.armorPick){
        const pick=[]; const pool=h.tag.armors.slice();
        for(let z=0;z<3&&pool.length;z++) pick.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
        pick.forEach(nm=>giveArmor(h,nm));
        say(`갑옷 고르기 — ${pick.join(" / ")} 중 쓸 것을 고르세요.`,"t2");
      } else giveArmor(h,rnd(h.tag.armors));
    }
    if(h.tag.armorShield){ const v=h.tag.armorShield;
      h.shield+=v; fx({side:"mine",slot:h.slot,ring:"#e0c85a",txt:"+"+v,cls:"shd",gap:60});
      say(`갑옷 장착 — 보호막 +${v}`) }
  }
  if(s.thrust){
    const v=(h.cutSum||0)*3;
    if(!v){ say("이번 턴에 벤 적이 없습니다.","t2"); return }
    const t2=foeAt(target); if(!t2){ say("그 칸에는 적이 없습니다.","t2"); return }
    hurt(t2,v,"찌르기","slash");
    return;
  }
  if(s.bomb){ h.bomb=2;
    pulseFX("mine",h.slot,"#e0705a",3);
    say("몸이 부풀어 오릅니다. 2턴 뒤 터집니다.","t3"); }
  if(s.fuse){
    liveMins().filter(m=>m.owner===h.name).forEach(m=>
      soulFX({side:"mine",slot:m.slot},{side:"mine",slot:h.slot},"#e0705a",5));
    const list=liveMins().filter(m=>m.owner===h.name);
    const g=list.length; if(!g){ say("전장에 삼킬 소환물이 없습니다.","t2"); return }
    const mul=h.tag.fuseX||1;
    list.forEach(m=>{
      healUp(h,m.hp);
      fx({side:"mine",slot:m.slot,art:"mag",s:"summon",txt:"흡수",cls:"heal",gap:90});
      m.alive=0; m.slot=0;
    });
    bumpTmp(h,"atk",3*g*mul); bumpTmp(h,"mag",3*g*mul); bumpTmp(h,"def",3*g*mul);
    fx({side:"mine",slot:h.slot,art:"mag",s:"summon",glow:1,txt:"융합",cls:"crit"});
    say(`융합 — 소환물 ${g}을 삼켜 이번 전투 동안 능력치가 크게 오릅니다.`,"t1");
  }
  if(s.minion){
    const side=target<0?"mine":"foe", slot=Math.abs(target);
    const ex=B.portals.find(p=>p.side===side&&p.slot===slot);
    if(ex){
      B.hand.push({type:"summon",name:"악마 하수인"});
      fx({side:side,slot:slot,art:"mag",s:"summon",txt:"하수인",cls:"crit"});
      say("차원문 재사용 — 악마 하수인 카드를 얻습니다. 빈 칸에 끌어다 소환하세요.","t1");
    }else{
      B.portals.push({side:side,slot:slot,dmg:s.dmg+mod(s,"dmg")+h.mag,shield:3+h.def});
      fx({side:side,slot:slot,art:"mag",s:"mag",ring:"#a06ae0",txt:"차원문",cls:"mag"});
      say(`${side==="mine"?"아군":"적"} ${slot}번 칸에 차원문이 열립니다.`,"t1");
    }
    return;
  }
  if(s.heal){ let v=s.heal+mod(s,"heal");
    if(deb(h,"defDn")) v=Math.ceil(v*0.5);
    healUp(h,v);
    fx({side:"mine",slot:h.slot,s:"heal",txt:"+"+v,cls:"heal",ring:"#7fd39a"});
    say(`${h.name} 체력 +${v}`) }
  /* 피해 */
  if(s.dmg!=null){
    if(h.name==="카제"&&i===0){
      h.windUses++;
      const every=(h.potential&&h.tag.potentialEvery)||h.tag.windEvery||3;
      const strong=h.tag.alwaysStrong||(h.windUses%every===0);
      const bonus=h.windBuff;
      const reach=h.tag.noRange?99:(strong?3:s.rng)+bonus;
      let dmg=s.dmg+mod(s,"dmg")+bonus+h.atk;
      if(h.tag.firstWind&&h.first.wind!==1){ dmg+=h.tag.firstWind; h.first.wind=1 }
      let list = strong||h.potential
        ? B.foes.filter(f=>f.alive&&dist(h.slot,f.slot)<=reach)
        : (tgt&&dist(h.slot,tgt.slot)<=reach?[tgt]:[]);
      if(!list.length) say(`사거리 ${reach} 안에 적이 없습니다.`,"t2");
      if(strong&&list.length){
        const far=list.reduce((a,b)=>dist(h.slot,a.slot)>=dist(h.slot,b.slot)?a:b);
        fx({side:"foe",slot:far.slot,sweep:{side:"mine",slot:h.slot},s:"tornado",gap:260});
        say("회오리가 전장을 훑고 지나갑니다.","t1");
      }
      list.forEach(f=>hurt(f,dmg,`진선풍도${strong?"(강화)":""}`,"wind"));
      if(strong&&list.length){
        const alive=list.filter(f=>f.alive);
        const last=alive.length
          ? alive.reduce((a,b)=>dist(h.slot,a.slot)>=dist(h.slot,b.slot)?a:b) : null;
        (h.potential?alive:(last?[last]:[])).forEach(f=>airborne(h,f));
      }
      h.windBuff=0; return;
    }
    if(!tgt) return;
    if(s.rng&&dist(h.slot,tgt.slot)>s.rng) return;
    let dmg=s.dmg+mod(s,"dmg")+(s.el==="마법"?h.mag:h.atk*(s.n==="방패 밀치기"?(h.tag.pushAtkX||1):1));
    if(s.el==="마법"&&deb(h,"magDn")) dmg=Math.ceil(dmg*0.5);
    else if(s.el!=="마법"&&deb(h,"atkDn")) dmg=Math.ceil(dmg*0.5);
    let CRIT=0;
    /* 이테리오 정밀 타격 : 표식이 있는 적에게 공격 피해는 치명타 */
    if(h.name==="이테리오"&&s.el!=="마법"&&(tgt.mark||0)>0){
      dmg*=2; tgt.mark--; CRIT=1; say(`정밀 표식 — 치명타!`,"t1");
    }
    /* 그슨대 급습 */
    if(h.name==="그슨대"&&h.hide&&s.el==="공격"){ dmg*=2; h.hide=0; CRIT=1; say("급습 — 치명타!","t1") }
    /* 데린저 조준 · 헤드샷 */
    if(h.name==="데린저"){
      if(h.aimAt!=null){ if(tgt.id===h.aimAt){ dmg*=2; CRIT=1 } else dmg=0 }
      if(s.ammo&&h.tag.headshot&&!h.headshotUsed){
        h.headshotUsed=1;
        const add=8+h.atk;
        dmg=(h.aimAt!=null&&tgt.id===h.aimAt) ? Math.round((dmg/2+add)*3) : dmg+add;
        say("헤드샷!","t1");
      }
    }
    if(!dmg){ say(`${tgt.name}${jo(tgt.name,"eun")} 조준 밖이라 상처 하나 없습니다.`,"t2"); return }
    if(s.n==="방패 밀치기"&&h.tag.pushAll){
      B.foes.filter(f=>f.alive).forEach(f=>hurt(f,dmg,s.n,"slash"));
      return;
    }
    if(h.name==="나이코스"&&i===0){
      if(h.tag.nearHit&&dist(h.slot,tgt.slot)===1) dmg+=h.tag.nearHit;
      if(h.tag.firstCut&&h.first.cut!==1){ dmg+=h.tag.firstCut+h.atk; h.first.cut=1 }
      if(h.tag.guardThen&&h.guarded) dmg+=h.tag.guardThen;
      dmg+=(h.cutGrow||0);
      if(h.tag.cutHeal){ healUp(h,h.tag.cutHeal) }
      h.cutSum=(h.cutSum||0)+dmg;
    }
    const times=(h.name==="나이코스"&&i===0&&h.sk[0].twice)?2:1;
    for(let t=0;t<times;t++){
      if(s.markKill||s.pierce)
        fx({side:"foe",slot:tgt.slot,streak:{side:"mine",slot:h.slot},s:"arrow",gap:130});
      const was=tgt.alive;
      let PR=0;
      if(s.pierce===true||h.pierceNext) PR=Math.max(PR,50);
      else if(s.pierce) PR=Math.max(PR,+s.pierce);
      if(s.el!=="마법"){
        PR+=itemBt(h,"pierce");
        if(tgt.taunt) PR+=itemBt(h,"tauntPierce");
      }
      hurt(tgt,dmg,s.n,s.el==="마법"?"mag":(h.name==="굴라"?"claw":"slash"),PR,CRIT);
      applyLeech(h,dmg);
      if(h.name==="이테리오"&&s.mark&&tgt.alive){ tgt.mark=(tgt.mark||0)+1;
        fx({side:"foe",slot:tgt.slot,ring:"#6aa8e0",txt:"표식",cls:"mag",gap:60}) }
      if(was&&!tgt.alive){
        bark(h,"kill");
        if(!tgt.isPhantom){
          const ke=itemBt(h,"killEsh");
          if(ke){ h.eshield=(h.eshield||0)+ke;
            fx({side:"mine",slot:h.slot,ring:"#e07b28",txt:"◆+"+ke,cls:"shd",gap:60}) }
          const ks=itemBt(h,"killStat");
          if(ks){ bumpTmp(h,"atk",ks); bumpTmp(h,"mag",ks) }
        }
        if(h.arenaHeal&&!tgt.isPhantom){ healUp(h,h.arenaHeal);
          fx({side:"mine",slot:h.slot,s:"heal",txt:"+"+h.arenaHeal,cls:"heal",gap:60});
          say(`피의 투기장 — ${h.name} 체력 +${h.arenaHeal}`,"t2") }
        if(h.name==="나이코스"&&i===0){
          if(h.tag.killGrow){ h.cutGrow=(h.cutGrow||0)+h.tag.killGrow;
            say(`늘어가는 실력 — 이번 전투 베기 피해 +${h.cutGrow}`,"t1") }
          if(h.tag.killShield){ h.shield+=h.tag.killShield;
            fx({side:"mine",slot:h.slot,ring:"#e0c85a",txt:"+"+h.tag.killShield,cls:"shd",gap:60});
            say(`아드레날린 분비 — 보호막 +${h.tag.killShield}`) }
        }
        if(s.markKill){ h.sk[1].limit++;
          pillarFX("foe",tgt.slot,"rgba(224,200,90,.9)");
          say("명중 — 피부 강화의 사용한도가 늘어납니다.","t1") }
        if(s.exec){ const v=1+(h.tag.execPlus||0);
          pillarFX("foe",tgt.slot,"rgba(201,162,39,.9)");
          addMod(h,"베기","dmg",v,"승리의 일격"); say(`승리의 일격 — 베기가 영구히 ${v} 강해집니다.`,"t1") }
        if(h.tag.killShield&&i===0){ h.shield+=h.tag.killShield }
        break;
      }
    }
  }
  if(h.name==="나이코스"&&i===1) h.guarded=1;
}

/* ─ 턴 ─ */
function battleLost(){
  run.heroes.forEach(clearTmp);
  run.heroes.forEach(h=>{ if(h.hp<=0){ h.hp=0; h.down=1; h.slot=0 } });
  fx({s:"down",gap:0});
  veil("radial-gradient(circle,rgba(142,43,43,.5),transparent 70%)");
  run.dun=null; run.pendingEnter=null;
  const standing=run.heroes.filter(h=>!h.down).length;
  if(!standing){
    say("모두 쓰러졌습니다. 일으켜 줄 사람이 남지 않았습니다.","t3");
    setTimeout(()=>lose("대원이 모두 쓰러졌습니다. 주둔지로 데려갈 사람이 남지 않았습니다."),1300);
    return;
  }
  addTaint(30);
  say("물러납니다. 오염도가 30 올랐습니다.","t3");
  setTimeout(()=>{ toast(`쓰러진 대원은 주둔지 치료소에서 일으킬 수 있습니다. (성한 대원 ${standing}명)`);
    if(view!=="over"){ view="map"; render() } },1200);
}
function critAlly(t){ FXQ.push({crit:1,side:"mine",slot:t.slot}); flushFX() }
function hurtAlly(f,t,raw,label){
  /* 갑피 : 한 번에 받는 피해를 그 수치까지로 잘라낸다 (보호막에 들어가는 몫까지 포함) */
  if(t.armor>0&&raw>t.armor){
    fx({side:"mine",slot:t.slot,ring:"#e0c85a",txt:"갑피"+t.armor,cls:"shd",gap:60});
    raw=t.armor;
  }
  if(t.evade>0){ t.evade--;
    fx({side:"mine",slot:t.slot,s:"miss",txt:"회피",cls:"miss"});
    say(`${label} — ${t.name} 회피!`,"t2"); return }
  let d=raw;
  const eh=Math.min(t.eshield||0,d); if(eh){ t.eshield-=eh; d-=eh }
  let sh=Math.min(t.shield,d); t.shield-=sh; d-=sh;
  if(!t.deathSaveUsed&&itemBt(t,"deathSave")&&d>=t.hp){
    t.deathSaveUsed=1; d=0; raw=0;
    healUp(t,Math.round(t.maxHp*itemBt(t,"deathSave")/100));
    fx({side:"mine",slot:t.slot,ring:"#7fd39a",txt:"버팀",cls:"crit",gap:80});
    say(`불굴의 맹세 — ${t.name}${jo(t.name,"ig")} 쓰러지지 않습니다.`,"t1");
  }
  else if(t.gloryGuard&&d>=t.hp){ t.gloryGuard=0; d=0; raw=0;
    fx({side:"mine",slot:t.slot,ring:"#c9a227",txt:"버팀",cls:"crit",gap:80});
    say(`영광 숭배자 — ${t.name}${jo(t.name,"ig")} 치명적인 일격을 한 번 흘려냅니다.`,"t1") }
  t.hp-=d;
  sh+=eh;
  if(t.tag&&itemBt(t,"lastStand")&&!t.lastStandUsed&&t.hp<=t.maxHp*0.5){
    t.lastStandUsed=1; const v=itemBt(t,"lastStand");
    t.eshield=(t.eshield||0)+v*4; bumpTmp(t,"atk",v);
    say(`애곤의 발톱 — ${t.name}${jo(t.name,"ig")} 이를 악뭅니다.`,"t1");
  }
  fx({side:"mine",slot:t.slot,hit:1,art:"claw",s:"hit",txt:"-"+raw,cls:"dmg",gap:170});
  say(`${f.name} → ${t.name} ${label} 피해 ${raw}${sh?` (보호막 ${sh})`:""} · ${Math.max(0,t.hp)}/${t.maxHp}`);
  if(t.tag&&t.tag.thorn&&f.alive&&!t.thornBusy){
    t.thornBusy=1; hurt(f,t.tag.thorn,`${t.name}의 가시`,"slash"); t.thornBusy=0; }
  if(t.name==="그슨대"&&raw>0){
    t.dark=(t.dark||0)+1;
    if(t.dark%3===0){ bumpTmp(t,"atk",1); say(`커져가는 악몽 — ${t.name} 공격력 +1`,"t1") }
    if(t.stance==="nightmare") B.foes.filter(x=>x.alive).forEach(x=>hurt(x,4+t.atk,"악몽 태세","slash"));
    if(t.stance==="terror") B.foes.filter(x=>x.alive).forEach(x=>{ addDeb(x,"fear",1,t); addDeb(x,"atkDn",1) });
  }
  if(t.hp<=0) unitDown(t); else if(raw>0) bark(t,"hurt");
}
function unitDown(t){
  fx({side:"mine",slot:t.slot,s:"down",txt:t.isMin?"파괴":"쓰러짐",cls:"miss",gap:180});
  if(t.isMin){
    say(`${t.name}${jo(t.name,"ig")} 부서졌습니다.`,"t3");
    if(t.phantomOf!=null){
      const src=B.foes.find(f=>f.id===t.phantomOf&&f.alive);
      if(src) hurt(src,t.backlash||4,"환영의 반동","mag");
    }
    if(t.curseOnDeath) B.foes.filter(x=>x.alive&&dist(t.slot,x.slot)<=1)
      .forEach(x=>{ x.weak=(x.weak||0)+t.curseOnDeath;
        fx({side:"foe",slot:x.slot,ring:"#8f5fd0",txt:"약화",cls:"miss",gap:80}) });
    t.alive=0; t.slot=0; onDeath("min",t); return;
  }
  bark(t,"down",1);
  say(`${t.name} 쓰러짐.`,"t3"); t.slot=0; t.down=1; onDeath("ally");
  if(t.name==="트리스탄"&&!B.corpseUsed){
    B.corpseUsed=1; B.hand.push({type:"summon",name:"망자의 육체"});
    say("저주받은 육체 — 망자의 육체 카드를 얻습니다.","t1");
  }
  /* 전장에 설 수 있는 아군이 하나도 남지 않으면 그 자리에서 끝난다 */
  if(!B.over&&!liveMins().length&&!run.heroes.some(h=>h.hp>0)){
    B.over=1; battleLost(); render();
  }
}
function endTurn(){

  }
  if(!allUnits().length){ say("전장에 아군이 없습니다. 먼저 영웅을 소환하세요.","t3"); return }
  allUnits().forEach(tickDebEnd);
  liveMins().forEach(m=>{ if(m.perma) m.taunt=1 });
  onField().forEach(h=>{
    { const en=itemBt(h,"endNeg"); if(en) h.negShield=(h.negShield||0)+en;
      const mn=itemBt(h,"momNeg");
      if(mn&&h.mom>0){ const use=Math.min(5,h.mom); h.mom-=use; h.negShield=(h.negShield||0)+use }
      const em=itemBt(h,"endMag");
      if(em){ h.endCount=(h.endCount||0)+1;
        if(h.endCount%2===0){ bumpTmp(h,"mag",1); say(`사색의 등 — ${h.name} 마법력 +1`,"t2") } } }
    const es=itemBt(h,"endShield");
    if(es){ const add=es+(itemBt(h,"endShieldDef")?h.def:0);
      endShield(h,add); fx({side:"mine",slot:h.slot,ring:"#e0c85a",txt:"+"+add,cls:"shd",gap:70}) }
    const ms=itemBt(h,"manaShield");
    if(ms&&h.manaUsed){ endShield(h,h.manaUsed*ms); h.manaUsed=0 }
    const qs=itemBt(h,"momShield");
    if(qs&&h.mom>0){ const use=Math.min(6,h.mom); h.mom-=use; endShield(h,use*qs) }
    if(h.name==="오토"){ const conv=Math.min(5,h.shield);
      if(conv){ h.shield-=conv; h.eshield=(h.eshield||0)+conv;

    if(h.tag.dashMul&&h.mom>0){
      const use=Math.min(h.tag.dashMax||3,h.mom); h.mom-=use;
      const v=use*h.tag.dashMul; h.eshield=(h.eshield||0)+v;
      fx({side:"mine",slot:h.slot,ring:"#e07b28",txt:"◆+"+v,cls:"shd",gap:70});
      say(`달리기 — ${h.name} 에너지 보호막 +${v}`) }
    const eb=itemBt(h,"endBurnRange");
    if(eb) B.foes.filter(f=>f.alive&&dist(h.slot,f.slot)<=2).forEach(f=>hurt(f,eb,"불타는 호각","slash"));
    if(h.name==="헥토"){
      const v=(h.tag.allyShield||2)+h.def;
      allUnits().forEach(a=>{ if(a!==h){ endShield(a,v);
        fx({side:"mine",slot:a.slot,ring:"#8fa2c9",txt:"+"+v,cls:"shd",gap:70}) } });

    else if(f.intent.t==="atk"){

        fx({side:"foe",slot:m.slot,s:"heal",txt:"+"+f.intent.v,cls:"heal"});
        say(`${f.name} → ${m.name} 체력 +${f.intent.v}`,"t3") }

    else if(f.intent.t==="deb"){

  /* ── 적의 행동이 모두 끝났다. 남은 보호막은 여기서 걷힌다 ──

  run.heroes.forEach(h=>{ if(h.hp>0){ h.shield=0; h.keepShield=0 } });

    if(f.thornTurn>0&&--f.thornTurn<=0){ f.thorn=0;

      if(!f.deb.fear){ f.fearSrc=null; f.fearName=null } }

  (B.portals||[]).forEach(p=>{
    if(p.side!=="mine") return;
    const a=unitAt(p.slot);
    if(a){ a.shield+=p.shield;
      fx({side:"mine",slot:p.slot,ring:"#a06ae0",txt:"+"+p.shield,cls:"shd",gap:70}) }
  });
  /* 회오리 장막의 누적은 전투 내내 이어진다 — 턴마다 지우지 않는다 */
  run.heroes.forEach(h=>{
    if(h.name==="헥토"&&h.tag.allyTwice&&h.slot>0){
      const v=(h.tag.allyShield||2)+h.def;
      onField().forEach(a=>{ if(a!==h) a.shield+=v });
    } });
  rollIntents(); sel=null;
  say(`— ${B.turn}턴 시작 —`,"t1");
  checkEnd(); render();
}
function checkEnd(){
  if(run&&run.sandbox) return;
  if(B.over) return;
  if(!B.foes.some(f=>f.alive)){
    B.over=1;
    const exp=B.foes.reduce((a,f)=>a+f.exp,0);
    fx({s:"win",gap:0});
    veil("radial-gradient(circle,rgba(201,162,39,.4),transparent 70%)");
    say(`승리! 경험치 ${exp}`,"t1");
    liveMins().filter(m=>m.revive).forEach(m=>{
      const t=run.heroes.find(x=>x.name===m.owner);
      if(t&&t.hp<=0){ t.hp=t.maxHp; t.down=0;
        say(`망자의 육체 — ${t.name}${jo(t.name,"ig")} 되살아납니다.`,"t1") }
    });
    B.mins=[];
    run.heroes.forEach(clearTmp);
    run.heroes.forEach(h=>{
      if(h.name!=="나이코스") return;
      const cap=h.tag.winCap||2;
      if(h.tag.winGold) run.gold+=h.tag.winGold;
      if(h.wins<cap){ h.wins++; h.atk++ }
      else { run.gold+=1; say("전장의 승자 — 넘친 몫이 금화 1로 바뀝니다.","t2") }
    });
    giveExp(exp,run.heroes.filter(h=>h.slot>0&&h.hp>0));
    setTimeout(afterWave,800);
  }
}
function afterWave(){
  const d=run.dun;
  if(!d){ backToMap(); return }
  if(d.wave<d.waves){ view="wavegap"; render(); return }
  dungeonCleared();
}

function drawReward(app){
  if(pending.free){
    if(!pending.hero && run.heroes.length>1){
      app.appendChild(el(`<div class="center"><div class="title" style="font-size:20px">누가 받을까요</div>
        <div class="sub">대원을 고르세요</div></div>`));
      const row=el(`<div class="picks"></div>`);
      run.heroes.forEach(h=>{
        const c=el(`<div class="pick" style="width:200px"><div class="art">${figure(h.name)}</div>
          <h3>${esc(h.name)}</h3><p>Lv.${h.lv} · ${ic("hp")}${h.hp}/${h.maxHp}</p></div>`);
        c.onclick=()=>{ pending.hero=h; render() };
        row.appendChild(c);
      });
      app.querySelector(".center").appendChild(row);
      return;
    }
    if(!pending.hero) pending.hero=run.heroes[0];
    const back=pending.back;
    app.appendChild(el(`<div class="center"><div class="title" style="font-size:20px">${esc(pending.grade)} 보상</div>
      <div class="sub">${esc(pending.hero.name)}에게 줄 것을 고르세요</div></div>`));
    offerCards(app,pending.hero,pending.grade,
      ()=>{ if(back==="shop"){ view="shop"; render() } else afterChest() });
    app.appendChild(heroPanel(pending.hero));
    return;
  }
  const cur=pending.queue[pending.idx];
  SFX.play("level");
  app.classList.add("withpanel");
  app.appendChild(el(`<div class="center"><div class="title" style="font-size:20px">레벨 업</div>
    <div class="sub">${esc(cur.hero.name)} — Lv.${cur.lv} · ${LV_GRADE[cur.lv]||"하급"} 보상</div>
    </div>`));
  const unIdx = cur.lv===UNLOCK[2]?2 : cur.lv===UNLOCK[3]?3 : -1;
  if(unIdx>=0) app.querySelector(".center").appendChild(unlockBanner(cur.hero,unIdx));
  offerCards(app,cur.hero,LV_GRADE[cur.lv]||"하급",()=>{
    pending.idx++;
    if(pending.idx>=pending.queue.length){ afterChest() } else render();
  });
  app.appendChild(heroPanel(cur.hero));
}

  const back=pending.back;

}

function flyToBag(){
  const from=document.querySelector(".gotit .ub-i")||document.querySelector(".gotit");
  const to=document.querySelector(".bagbtn");
  if(!from||!to) return;
  const a=from.getBoundingClientRect(), b=to.getBoundingClientRect();
  const nd=spawn('<div class="bagfly"></div>');
  if(!nd) return;
  nd.innerHTML=from.innerHTML;
  nd.style.left=(a.left+a.width/2)+"px"; nd.style.top=(a.top+a.height/2)+"px";
  void nd.offsetWidth;
  nd.style.transition="left .5s cubic-bezier(.5,-0.1,.6,1),top .5s cubic-bezier(.3,.6,.4,1),transform .5s,opacity .45s";
  nd.style.left=(b.left+b.width/2)+"px"; nd.style.top=(b.top+b.height/2)+"px";
  nd.style.transform="translate(-50%,-50%) scale(.28)"; nd.style.opacity=".2";
  to.classList.remove("pop"); void to.offsetWidth; setTimeout(()=>to.classList.add("pop"),420);
  SFX.play("click");
}

function pickWeighted(pool,n){
  const out=[], p=pool.slice();
  while(out.length<n&&p.length){
    const tot=p.reduce((a,r)=>a+(r.w==null?1:r.w),0);
    let x=Math.random()*tot, k=0;
    for(;k<p.length;k++){ x-=(p[k].w==null?1:p[k].w); if(x<=0) break }
    if(k>=p.length) k=p.length-1;
    out.push(p.splice(k,1)[0]);
  }
  return out;
}
function rewardIcon(r){
  if(r&&r.g&&PX_ITEM&&(r.st||r.bt||r.rc||["파편","일반","희귀","특수","전설"].indexOf(r.g)>=0))
    return itemIcon(r);
  return rewardIcon0(r);
}

   star:'<path d="M32 8 L40 26 L60 28 L45 42 L49 60 L32 50 L15 60 L19 42 L4 28 L24 26 Z" fill="@"/>'

}
/* 전투 밖에서도 쓸 수 있는 수치 요약 */
function valueLinesStatic(h,sk){
  const L=[];
  if(sk.dmg!=null&&!sk.justice) L.push(`피해 ${numHtml(h,sk,"dmg")}`);
  if(sk.shield) L.push(`보호막 ${numHtml(h,sk,"shield")}`);
  if(sk.heal) L.push(`회복 ${numHtml(h,sk,"heal")}`);
  return L;
}
/* 보상 카드를 고를 때 — 등급이 높을수록 요란하게 */
function pickBurst(card,grade){
  const lv={"하급":1,"중급":2,"상급":3}[grade]||1;
  SFX.play("pick"+lv);
  card.classList.add("taken","g"+lv);
  const r=card.getBoundingClientRect();
  const p={x:r.left+r.width/2, y:r.top+r.height/2};
  const col={1:"#9c8d77",2:"#e0a86a",3:"#e0705a"}[lv];
  at(spawn('<div class="ring" style="border-color:'+col+'"></div>'),p);
  sparks(p,col,6+lv*7);
  if(lv>=2) setTimeout(()=>{
    at(spawn('<div class="ring" style="border-color:#ffd45e"></div>'),p); sparks(p,"#ffe08a",8);
  },140);
  if(lv>=3){
    veil("radial-gradient(circle,rgba(224,112,90,.34),transparent 70%)");
    const f=document.querySelector(".rewards");
    if(f){ f.classList.remove("shakeall"); void f.offsetWidth; f.classList.add("shakeall") }
    for(let i=0;i<10;i++) setTimeout(()=>{
      const a2=Math.random()*Math.PI*2, d=60+Math.random()*70;
      const sp=spawn('<div class="spark" style="background:#ffd45e;width:5px;height:5px"></div>');
      if(sp){ at(sp,p); sp.style.setProperty("--dx",(Math.cos(a2)*d)+"px");
              sp.style.setProperty("--dy",(Math.sin(a2)*d)+"px") }
    },i*32);
  }
  const w=spawn('<div class="pickword" style="color:'+col+'">'+esc(grade)+' 획득</div>');
  if(w){ w.style.left=p.x+"px"; w.style.top=(p.y-14)+"px" }
}
/* 이 보상 자리가 '판 자원 보상을 빼야 하는' 자리인가 */
function noRunRes(){
  if(!pending) return false;
  if(pending.noRun) return true;
  const cur=pending.queue&&pending.queue[pending.idx];
  return !!(cur&&cur.noRun);
}
function offerCards(app,hero,grade,done){
  const own=(HERO_REWARDS[hero.name]||[]).filter(r=>r.g===grade&&!(hero.tag.taken||[]).includes(r.n));
  let com=COMMON.filter(r=>r.g===grade);
  if(noRunRes()){
    const cut=com.filter(r=>!r.rr);
    /* 걸러내고도 고를 게 남아 있을 때만 걸러 준다 */
    if(own.length+cut.length>=3) com=cut;
  }
  const pool=own.concat(com);
  const picks=pickWeighted(pool,3);
  const row=el(`<div class="rewards"></div>`);
  picks.forEach(r=>{
    const c=el(`<div class="rw${gcls(r.g)}"><div class="rwi">${rewardIcon(r)}</div>
      <div class="g">${esc(r.g)} · ${own.includes(r)?"전용":"공용"}</div>
      <b>${esc(r.n)}</b><p>${rich(r.d)}</p></div>`);
    c.onclick=()=>{
      if(c.classList.contains("taken")) return;
      pickBurst(c,r.g);
      row.querySelectorAll(".rw").forEach(x=>{ if(x!==c) x.classList.add("faded") });
      r.fx(hero,r.n); hero.tag.taken=(hero.tag.taken||[]).concat(r.n);
      const pts={"하급":1,"중급":3,"상급":5}[r.g]||0;
      if(pts&&run.heroes.some(x=>x.name==="데린저")){
        run.treasure=(run.treasure||0)+pts;
        const d=run.heroes.find(x=>x.name==="데린저");
        const want=Math.floor(run.treasure/5);
        if((d.treaAtk||0)<want){ const add=want-(d.treaAtk||0); d.treaAtk=want; d.atk+=add;
          toast(`보물 사냥꾼 — ${d.name}의 공격력이 ${add} 올랐습니다.`) }
      }
      setTimeout(done,grade==="상급"?820:grade==="중급"?600:460);
    };
    row.appendChild(c);
  });
  app.querySelector(".center").appendChild(row);
  const skip=el(`<div style="text-align:center;margin-top:18px"><button>건너뛰기</button></div>`);
  skip.querySelector("button").onclick=done;
  app.appendChild(skip);
}
txtApply();
render();
</script>
