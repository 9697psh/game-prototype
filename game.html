<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>균열 — 시험판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&display=swap">
<style>
:root{
  --ink:#14110e; --panel:#1c1815; --raise:#252019; --rule:#3a3128; --rule2:#4a3e31;
  --fg:#e7dcc8; --dim:#9c8d77; --faint:#6d6252;
  --brass:#c9a227; --blood:#8e2b2b;
  --atk:#e0705a; --mag:#6aa8e0; --def:#e0c85a; --hp:#7fd39a; --move:#5fd8cf; --mana:#5f8fe0;
  --warn:#e0a86a; --serif:"Noto Serif KR",serif;
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--sans);font-size:14px;
  line-height:1.6;-webkit-user-select:none;user-select:none}
button{font-family:inherit;font-size:inherit;color:var(--fg);background:var(--raise);
  border:1px solid var(--rule);border-radius:3px;padding:7px 13px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--brass);color:var(--brass)}
button:disabled{opacity:.35;cursor:default}
button.go{background:var(--brass);color:#17130f;border-color:var(--brass);font-weight:700}
button.go:hover{color:#17130f;filter:brightness(1.1)}
.ic{width:1.05em;height:1.05em;vertical-align:-.18em;fill:currentColor}
.grow{flex:1}

header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:9px 16px;
  background:var(--panel);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:30}
h1{font-family:var(--serif);font-size:15px;letter-spacing:.16em;color:var(--brass);margin:0;white-space:nowrap}
.stat{display:inline-flex;align-items:center;gap:5px;font-size:13px}
.wrap{max-width:1240px;margin:0 auto;padding:16px}

/* ── 전장 ── */
.field{display:flex;justify-content:center;align-items:stretch;gap:10px;
  overflow-x:auto;padding-bottom:4px}
.side{display:flex;gap:6px;flex:0 0 auto}
/* 아군·적군 모두 왼쪽에서부터 1~5 */
.mid{width:2px;background:var(--rule);align-self:stretch;min-height:230px;flex:0 0 auto}
.slot{width:100px;flex:0 0 100px;min-width:0;overflow:hidden;border:1px solid var(--rule);border-radius:5px;background:var(--panel);
  padding:7px;display:flex;flex-direction:column;gap:5px;position:relative;min-height:176px}
.slot.empty{background:#181512;border-style:dashed;opacity:.55}
.slot.pick{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.slot.drop{border-color:var(--hp);box-shadow:0 0 0 1px var(--hp) inset;opacity:1}
.slot.far{opacity:.3;filter:grayscale(.7);cursor:default}
.slot.far .no{color:var(--faint)}
.reach{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:9.5px;
  color:var(--faint);pointer-events:none}
.slot.pick .reach{color:var(--brass)}
.slot .no{position:absolute;top:-9px;left:7px;background:var(--ink);border:1px solid var(--rule);
  border-radius:3px;font-size:10px;padding:0 6px;color:var(--faint)}
.slot.pick .no{color:var(--brass);border-color:var(--brass)}
.res{display:flex;gap:4px;align-items:center;justify-content:center;min-height:13px;flex-wrap:wrap}
.pips{display:inline-flex;gap:3px;align-items:center}
.pips i{width:7px;height:7px;border-radius:50%;border:1px solid var(--rule2);display:inline-block}
.pips i.on{background:var(--mana);border-color:#8fb4ef;box-shadow:0 0 5px rgba(95,143,224,.75)}
.res .rr{font-size:10px;color:var(--move);display:inline-flex;align-items:center;gap:2px}
.res .rr.es{color:var(--def)}
.res .rr.mn2{color:var(--mana)}
.art{height:56px;display:flex;align-items:flex-end;justify-content:center}
.art svg{height:56px;width:auto}
.nm{font-size:12px;font-weight:700;line-height:1.25;word-break:keep-all;text-align:center}
.bar{height:5px;background:#0f0d0b;border-radius:3px;overflow:hidden}
.bar{position:relative}
.bar > i{display:block;height:100%;background:var(--hp);transition:width .18s}
.bar.mn > i{background:var(--mana)}
.bar > u{position:absolute;top:0;right:0;height:100%;background:var(--def);opacity:.9;
  border-left:1px solid var(--panel);transition:width .18s}
.shd{color:var(--def);font-weight:700;white-space:nowrap}
.mini{font-size:10.5px;color:var(--dim);display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center}
.chip{font-size:10px;border:1px solid var(--rule2);border-radius:2px;padding:0 4px;color:var(--dim)}
.chip.on{color:var(--brass);border-color:#5c4a1f}
.chip.deb{color:#e08a8a;border-color:#5a3030}
.chip.itm2{color:#9ecbf5;border-color:#33506b}
.intent{font-size:11px;display:inline-flex;align-items:center;gap:3px;border:1px solid var(--rule2);
  border-radius:3px;padding:0 5px;background:var(--raise)}

.skwrap{margin-top:12px;background:var(--panel);border:1px solid var(--brass);border-radius:6px;padding:10px}
.skhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.skhead b{font-family:var(--serif);font-size:14px;color:var(--brass)}
.skills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sk{display:flex;gap:7px;align-items:flex-start;min-width:0;padding:8px 9px;border-radius:4px;
  border:1px solid var(--rule);background:var(--raise);cursor:pointer}
.sk:hover{border-color:var(--brass)}
.sk.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.sk.off{opacity:.4;cursor:default}
.sk.off:hover{border-color:var(--rule)}
.sk .k{font-size:10px;color:#17130f;background:var(--rule2);border-radius:2px;padding:0 5px;
  font-weight:700;flex:none;margin-top:2px}
.sk.on .k{background:var(--brass)}
.sk .t{flex:1;min-width:0}
.sk .t b{font-size:12.5px}
.sk .xn{margin-left:5px;background:var(--brass);color:#17130f;border-radius:3px;padding:0 6px;font-size:11.5px;font-weight:700}
.sk .t .val{display:block;font-size:11.5px;color:var(--fg);margin-top:3px;line-height:1.5}
.sk .t .val .big{color:var(--brass);font-size:13px}
.sk .t .brk{color:var(--faint);font-size:10px}
.sk .t small{display:block;color:var(--dim);font-size:10.5px;line-height:1.45;margin-top:4px;word-break:keep-all;overflow-wrap:anywhere}
.counts{display:flex;gap:4px;flex-wrap:wrap;padding-top:9px;margin-top:9px;
  border-top:1px solid var(--rule);align-items:center}
.counts button{padding:2px 10px;font-size:12px}
.prog{margin-top:4px}
.prog .pl{font-size:9.5px;color:var(--faint);display:flex;justify-content:space-between;gap:4px;white-space:nowrap;overflow:hidden}
.prog .pl span:first-child{overflow:hidden;text-overflow:ellipsis;min-width:0}
.prog .pl span:last-child{flex:0 0 auto}
.prog .pb{height:4px;background:#0f0d0b;border-radius:2px;overflow:hidden;margin-top:1px}
.prog .pb>i{display:block;height:100%;background:var(--brass);transition:width .2s}
.prog.done .pl{color:var(--hp)}
.prog.done .pb>i{background:var(--hp)}
.passes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:9px}
.pass{background:#1a1713;border:1px solid var(--rule);border-radius:4px;padding:8px 10px}
.pass .pn{font-size:11.5px;font-weight:700;color:var(--brass)}
.pass .pd{font-size:10.5px;color:var(--dim);line-height:1.5;margin-top:3px;word-break:keep-all}
.pass .pd b{color:var(--fg);font-size:12px}
.pass .pd span.brk{color:var(--faint);font-size:10px}
@media(max-width:760px){ .passes{grid-template-columns:1fr} }
.stats{font-size:10.5px;color:var(--dim);display:flex;flex-wrap:wrap;gap:5px;justify-content:center}

/* ── 손패 ── */
.hand{margin-top:14px;display:flex;gap:9px;flex-wrap:wrap;align-items:flex-start;min-height:10px}
.card{width:118px;border:1px solid var(--rule2);border-radius:6px;background:var(--panel);
  padding:8px;cursor:grab;touch-action:none;position:relative}
.card:hover{border-color:var(--brass)}
.card.hero{border-color:#3d7a72}
.card .ct{font-size:11.5px;font-weight:700;text-align:center;margin-bottom:4px}
.card .cd{font-size:10.5px;color:var(--faint);line-height:1.4}
.card .art{height:44px}
.card .art svg{height:44px}
.ghost{position:fixed;z-index:999;pointer-events:none;opacity:.9;transform:translate(-50%,-50%)}

.prompt{margin-top:14px;background:var(--panel);border:1px solid var(--rule);border-radius:5px;
  padding:9px 13px;font-size:13px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.step{font-size:11px;border:1px solid var(--rule2);border-radius:99px;padding:1px 9px;color:var(--faint)}
.step.on{color:#17130f;background:var(--brass);border-color:var(--brass);font-weight:700}
.hint{color:var(--dim);font-size:12.5px}
.log{margin-top:12px;background:var(--panel);border:1px solid var(--rule);border-radius:5px;
  padding:9px 13px;height:168px;overflow:auto;font-size:12.5px;line-height:1.65}
.log div{border-bottom:1px solid #241f19;padding:1px 0}
.log .t1{color:var(--brass)} .log .t2{color:var(--dim)} .log .t3{color:var(--warn)}

/* ── 화면 ── */
.center{max-width:900px;margin:40px auto;text-align:center}
.title{font-family:var(--serif);font-size:30px;color:var(--brass);letter-spacing:.2em}
.sub{color:var(--dim);margin-top:6px}
.picks{display:flex;gap:14px;justify-content:center;margin-top:28px;flex-wrap:wrap}
.pick{width:230px;background:var(--panel);border:1px solid var(--rule);border-radius:7px;
  padding:14px;cursor:pointer;text-align:left}
.pick:hover{border-color:var(--brass)}
.pick .art{height:78px} .pick .art svg{height:78px}
.pick h3{margin:8px 0 2px;font-size:15px;font-family:var(--serif)}
.pick .role{color:var(--brass);font-size:11.5px;letter-spacing:.06em}
.pick p{color:var(--dim);font-size:12px;margin:8px 0 0;line-height:1.55}

.mapwrap{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.node{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--rule);
  border-radius:6px;padding:11px 14px}
.node.now{border-color:var(--brass)}
.node.done{opacity:.45}
.node .tag{font-size:11px;border:1px solid var(--rule2);border-radius:3px;padding:1px 7px;color:var(--dim);flex:none}
.node .tag.b{color:var(--atk);border-color:#5a3030}
.roster{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px}
.rost{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;
  display:flex;gap:9px;align-items:center;min-width:186px}
.rost .art{height:44px} .rost .art svg{height:44px}
.rost b{font-size:12.5px}
.rost small{display:block;color:var(--dim);font-size:11px}
.rewards{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.rw{width:196px;min-height:250px;background:linear-gradient(180deg,#221c2e,#191622);
  border:1px solid #4a3f63;border-radius:10px;padding:16px 14px;cursor:pointer;
  text-align:center;display:flex;flex-direction:column;align-items:center;
  box-shadow:0 6px 18px rgba(0,0,0,.4)}
.rw:hover{border-color:#a88fe0;box-shadow:0 6px 22px rgba(140,110,220,.28)}
.rw.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.rw .rwi{width:76px;height:76px;margin:2px auto 10px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,#332b47,transparent 70%);border-radius:50%}
.rw .rwi svg{width:56px;height:56px}
.rw b{font-size:14px;font-family:var(--serif);letter-spacing:.02em}
.rw p{color:var(--dim);font-size:11.5px;margin:8px 0 0;line-height:1.6;word-break:keep-all}
.rw .g{font-size:10.5px;color:#b9a2ea;letter-spacing:.06em;margin-bottom:2px}
.rw .rcp{font-size:10px;color:#8f86a8;margin:7px 0 0;line-height:1.5;
  border-top:1px solid #372f4d;padding-top:6px;width:100%;word-break:keep-all}
.rcp:nth-of-type(n+2){border-top:0;padding-top:2px}
.gearwrap{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.gearhero{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:12px;width:250px}
.gearhero .gh{display:flex;gap:10px;align-items:center;text-align:left}
.gearhero .gh .art{height:44px} .gearhero .gh .art svg{height:44px}
.gearhero .gh b{font-size:13px}
.gearhero .gh small{display:block;color:var(--dim);font-size:11px}
.gslots{display:flex;gap:6px;margin-top:10px}
.gslot{flex:1;min-width:0;background:var(--raise);border:1px solid var(--rule);border-radius:5px;
  padding:8px 4px;text-align:center;cursor:pointer;min-height:78px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.gslot:hover{border-color:var(--brass)}
.gslot.empty{border-style:dashed;color:var(--faint)}
.gslot.empty span{font-size:10.5px}
.gslot.drop{border-color:var(--hp)}
.gslot.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.gslot .gi{width:30px;height:30px} .gslot .gi svg{width:30px;height:30px}
.gslot b{font-size:10px;line-height:1.25;word-break:keep-all}
.gslot .gg{font-size:9.5px;color:var(--faint)}
.bagwrap{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.bagwrap .gslot{width:104px;flex:0 0 104px}
.rcbook{margin-top:26px;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:14px 16px}
.rcbook h4{margin:0 0 8px;font-family:var(--serif);font-size:13px;color:var(--brass);letter-spacing:.06em}
.rcrow{display:grid;grid-template-columns:150px 1fr 76px;gap:8px;font-size:11.5px;
  padding:4px 0;border-top:1px solid #241f19;align-items:center}
.rcrow b{color:var(--fg)}
.rcrow span{color:var(--dim)}
.rcrow i{color:var(--brass);font-style:normal;text-align:right}
.rw.no{opacity:.4;cursor:default}
.rw.no:hover{border-color:#4a3f63;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.rw.ro{cursor:default;min-height:170px;justify-content:center}
.rw.ro:hover{border-color:#4a3f63;box-shadow:0 6px 18px rgba(0,0,0,.4)}
/* ── 이펙트 ── */
#fx{position:fixed;inset:0;pointer-events:none;z-index:900;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font-family:var(--serif);font-weight:700;
  font-size:21px;text-shadow:0 2px 4px #000,0 0 10px #000;animation:pop .95s ease-out forwards}
.pop.dmg{color:var(--atk)} .pop.mag{color:var(--mag)} .pop.heal{color:var(--hp)}
.pop.shd{color:var(--def)} .pop.miss{color:var(--dim);font-size:16px}
.pop.crit{color:#ffd45e;font-size:27px}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}
  18%{opacity:1;transform:translate(-50%,-70%) scale(1.12)}
  32%{transform:translate(-50%,-72%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-150%) scale(.95)}}
.slash{position:absolute;transform:translate(-50%,-50%);width:96px;height:96px;animation:slashA .38s ease-out forwards}
@keyframes slashA{0%{opacity:0;transform:translate(-50%,-50%) rotate(-38deg) scale(.55)}
  25%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-50%) rotate(22deg) scale(1.25)}}
.swirl{position:absolute;transform:translate(-50%,-50%);width:112px;height:112px;animation:swirlA .6s linear forwards}
@keyframes swirlA{0%{opacity:0;transform:translate(-50%,-50%) rotate(0) scale(.5)}
  30%{opacity:.95}
  100%{opacity:0;transform:translate(-50%,-50%) rotate(340deg) scale(1.5)}}
.ring{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:2px solid;
  width:22px;height:22px;animation:ringA .55s ease-out forwards}
@keyframes ringA{0%{opacity:.95;width:22px;height:22px}100%{opacity:0;width:128px;height:128px}}
.spark{position:absolute;width:4px;height:4px;border-radius:50%;animation:sparkA .5s ease-out forwards}
@keyframes sparkA{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3)}}
/* ── 필드 격자 ── */
.gridmap{display:grid;gap:4px;margin-top:14px;max-width:640px}
.cell{position:relative;aspect-ratio:1;border:1px solid var(--rule);border-radius:4px;
  background:var(--panel);display:flex;align-items:center;justify-content:center;
  padding:12%;cursor:default;transition:border-color .12s,background .12s}
.cell svg{width:100%;height:100%}
.cell.emp{background:#181512;border-style:dashed;opacity:.45}
.cell.done{opacity:.28}
.cell.adj{cursor:pointer;border-color:var(--rule2);background:#211d17}
.cell.adj:hover{border-color:var(--brass);background:var(--raise)}
.cell.here{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset;opacity:1}
.cell.risk{border-color:#6b2b2b;background:#241416;opacity:.8}
.cell.risk:hover{border-color:var(--blood);background:#301a1c}
.cell.risk::after{content:"";position:absolute;inset:0;border-radius:4px;
  background:radial-gradient(circle at 50% 50%,rgba(142,43,43,.35),transparent 70%)}
.cell .you{position:absolute;bottom:-2px;right:2px;color:var(--brass);font-size:11px}
.cell .cl{position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  font-size:8.5px;background:var(--ink);border:1px solid var(--rule);border-radius:3px;
  padding:0 4px;color:var(--dim);white-space:nowrap;opacity:0;transition:opacity .12s}
.cell:hover .cl{opacity:1;z-index:5}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:16px;height:16px;display:inline-block}
.legend i svg{width:16px;height:16px}
.toast{background:var(--raise);border:1px solid var(--rule2);border-left:3px solid var(--brass);
  border-radius:4px;padding:9px 14px;margin:0 0 12px;font-size:13px}
.rost.down{opacity:.5}
/* ── NPC 화면 (상점 · 미지의 구역) ── */
.npcbox{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start;margin-top:12px}
.npc{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:16px;text-align:center}
.npcface{width:150px;height:150px;margin:0 auto 10px;border-radius:50%;
  background:radial-gradient(circle at 50% 35%,#2b251d,#15120f);
  border:1px solid var(--rule2);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.npcface svg{height:120px;width:auto;margin-bottom:6px}
.npc b{font-family:var(--serif);font-size:15px;color:var(--brass)}
.npc p{font-size:12px;color:var(--dim);line-height:1.6;margin:8px 0 0;word-break:keep-all}
.shelf .shelfrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:8px}
.choices{display:flex;flex-direction:column;gap:9px;margin-top:8px}
.choice{background:var(--panel);border:1px solid var(--rule);border-radius:6px;
  padding:13px 16px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.choice:hover{border-color:var(--brass)}
.choice b{font-size:13.5px}
.choice span{font-size:11.5px;color:var(--dim)}
.choice.go2{align-items:center;color:var(--brass);border-color:var(--brass);font-weight:700}
.evres{display:flex;gap:14px;align-items:center;background:linear-gradient(180deg,#221c2e,#191622);
  border:1px solid #4a3f63;border-radius:8px;padding:16px 18px;margin-bottom:4px}
.evres .evi{width:52px;height:52px;flex:none} .evres .evi svg{width:52px;height:52px}
.evres b{font-size:11px;color:#b9a2ea;letter-spacing:.08em}
.evres p{margin:4px 0 0;font-size:13.5px;line-height:1.6;word-break:keep-all}
.wheel{border:1px solid var(--rule);border-radius:7px;padding:8px 12px;background:var(--panel)}
.wr{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--faint);padding:3px 0}
.wr i{width:12px;font-style:normal;color:var(--brass)}
.wr.hit{color:var(--brass);font-weight:700}
@media(max-width:800px){ .npcbox{grid-template-columns:1fr} }
.trail{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:12px}
.dot{font-size:10.5px;border:1px solid var(--rule2);border-radius:99px;padding:1px 9px;color:var(--faint)}
.dot.b{color:var(--atk);border-color:#5a3030}
.dot.cur{color:var(--brass);border-color:var(--brass);font-weight:700}
.nart{height:52px;display:flex;align-items:center;justify-content:center}
.nart svg{height:52px;width:52px}
.portal{position:absolute;right:3px;top:3px;width:20px;height:20px;opacity:.95}
.slots{display:flex;gap:3px;margin-top:3px;justify-content:center}
.sq{width:12px;height:12px;border:1px solid var(--rule2);border-radius:2px}
.sq.on{background:#6aa8e0;border-color:#6aa8e0}
.itm{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--dim)}
.rw.no{opacity:.4;cursor:default}
.rw.no:hover{border-color:var(--rule)}
/* ── 시그니처 연출 ── */
.sweep{position:absolute;transform:translate(-50%,-50%);width:118px;height:118px;
  opacity:.95;transition:opacity .18s}
.sweep .spin{width:100%;height:100%;animation:spin .32s linear infinite}
.sweep .spin svg{width:100%;height:100%}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.wake{position:absolute;transform:translate(-50%,-50%);width:52px;height:52px;
  animation:wakeA .5s ease-out forwards;opacity:.7}
.wake svg{width:100%;height:100%}
@keyframes wakeA{0%{opacity:.75;transform:translate(-50%,-50%) scale(.6) rotate(0)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.5) rotate(200deg)}}
.shockw{position:absolute;transform:translate(-50%,-50%);border-radius:50%;
  border:3px solid #e0c85a;width:20px;height:20px;animation:shockA .55s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes shockA{0%{opacity:.95;width:20px;height:20px;border-width:5px}
  100%{opacity:0;width:260px;height:150px;border-width:1px}}
.dust{position:absolute;width:5px;height:5px;border-radius:50%;background:#9c8d77;
  animation:dustA .6s ease-out forwards}
@keyframes dustA{0%{opacity:.9;transform:translate(-50%,-50%)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% - var(--dy))) scale(.4)}}
.streak{position:absolute;height:3px;transform-origin:0 50%;border-radius:2px;
  background:linear-gradient(90deg,transparent,#fff6e0,#e0c85a);
  animation:strA .34s ease-out forwards}
@keyframes strA{0%{opacity:0;transform:scaleX(0)}
  25%{opacity:1}100%{opacity:0;transform:scaleX(1)}}
.field.quake{animation:qk .5s}
@keyframes qk{0%,100%{transform:translate(0,0)}
  12%{transform:translate(-4px,3px)}28%{transform:translate(5px,-2px)}
  46%{transform:translate(-3px,4px)}64%{transform:translate(4px,-3px)}
  82%{transform:translate(-2px,1px)}}
.slot.leap{animation:leapA .5s cubic-bezier(.3,-0.4,.5,1.6)}
@keyframes leapA{0%{transform:translateY(-42px)}
  62%{transform:translateY(4px)}78%{transform:translateY(-3px)}100%{transform:translateY(0)}}
.shake{animation:shk .28s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}
  45%{transform:translateX(5px)}70%{transform:translateX(-3px)}}
.flashd{animation:fld .3s} @keyframes fld{0%,100%{filter:none}30%{filter:brightness(2.4) saturate(.4)}}
.flashg{animation:flg .5s} @keyframes flg{0%,100%{box-shadow:none}
  40%{box-shadow:0 0 0 2px var(--brass) inset,0 0 22px rgba(201,162,39,.5)}}
.veil{position:fixed;inset:0;pointer-events:none;animation:vl .5s ease-out forwards}
@keyframes vl{0%{opacity:.5}100%{opacity:0}}
@media(max-width:960px){
  .field{flex-direction:column;gap:8px} .mid{display:none} .side{flex-wrap:wrap}
  .skills{grid-template-columns:repeat(2,minmax(0,1fr))}
  .skills{position:static;width:auto;margin-top:6px}
}
</style>

<body>
<header>
  <h1>균열</h1>
  <span class="stat" id="hRun"></span>
  <span class="grow"></span>
  <span id="hBtns"></span>
</header>
<div class="wrap" id="app"></div>
<div id="fx"></div>

<script>
/* ═══════════ 아이콘 · 유틸 ═══════════ */
const ICON={
 atk:'M12 1.5 L15.2 7.4 V13.2 H8.6 V7.4 Z M4.8 13.2 H18.8 V15.6 H5.2 Z M10.7 15.6 H13.3 V19.4 H10.7 Z',
 def:'M12 1.7 L20.6 4.9 V11.4 C20.6 16.6 17.1 20.8 12 22.3 C6.9 20.8 3.4 16.6 3.4 11.4 V4.9 Z',
 hp :'M12 21.4 C12 21.4 2.4 15.3 2.4 8.8 C2.4 5.5 4.9 3 8.1 3 C10 3 11.3 4 12 5.2 C12.7 4 14 3 15.9 3 C19.1 3 21.6 5.5 21.6 8.8 C21.6 15.3 12 21.4 12 21.4 Z',
 mana:'M12 1.8 C12 1.8 4.3 10.4 4.3 15.2 A7.7 7.7 0 0 0 19.7 15.2 C19.7 10.4 12 1.8 12 1.8 Z',
 move:'M4.2 4.2 L12 12 L4.2 19.8 L1.4 17 L6.4 12 L1.4 7 Z M14.6 4.2 L22.4 12 L14.6 19.8 L11.8 17 L16.8 12 L11.8 7 Z',
 mag :'M12 1.2 C13.05 7.6 16.4 10.95 22.6 12 C16.4 13.05 13.05 16.4 12 22.6 C10.95 16.4 7.6 13.05 1.4 12 C7.6 10.95 10.95 7.6 12 1.2 Z',
 exp :'M12 1.8 L21.6 11.4 H16.4 V22.2 H7.6 V11.4 H2.4 Z'
};
const ic=(k,c)=>`<svg class="ic" viewBox="0 0 24 24" style="color:var(--${c||k})"><path fill="currentColor" d="${ICON[k]}"/></svg>`;
function icoify(html){
  return String(html)
    .split("공격력").join(ic("atk"))
    .split("마법력").join(ic("mag"))
    .split("보호력").join(ic("def"));
}
const rich=t=>icoify(esc(t));
const esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function jo(w,p){const c=String(w||"").trim().slice(-1).charCodeAt(0);
  const h=(c>=0xAC00&&c<=0xD7A3)?((c-0xAC00)%28)!==0:false;
  return ({ig:["이","가"],eul:["을","를"],eun:["은","는"],gwa:["과","와"],eu:["으",""]})[p][h?0:1];}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const el=s=>{const t=document.createElement("template");t.innerHTML=s.trim();return t.content.firstElementChild};

/* ═══════ 소리 ═══════ */
const SFX=(()=>{
  let ac=null, on=true;
  function ctx(){
    if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)() }catch(e){ on=false; return null } }
    if(ac.state==="suspended") ac.resume();
    return ac;
  }
  function tone(o){
    const a=ctx(); if(!a) return;
    const t=a.currentTime+(o.at||0), dur=o.d||0.2, v=(o.v==null?0.16:o.v);
    const g=a.createGain(); g.connect(a.destination);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(v,t+(o.atk||0.008));
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    let src;
    if(o.noise){
      const len=Math.max(1,Math.floor(a.sampleRate*dur));
      const buf=a.createBuffer(1,len,a.sampleRate), ch=buf.getChannelData(0);
      for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*Math.pow(1-i/len,o.decay||1.5);
      src=a.createBufferSource(); src.buffer=buf;
      const f=a.createBiquadFilter(); f.type=o.ftype||"bandpass";
      f.frequency.setValueAtTime(o.f||1200,t);
      if(o.f2) f.frequency.exponentialRampToValueAtTime(o.f2,t+dur);
      f.Q.value=o.q||1.2;
      src.connect(f); f.connect(g);
    }else{
      src=a.createOscillator(); src.type=o.w||"triangle";
      src.frequency.setValueAtTime(o.f||440,t);
      if(o.f2) src.frequency.exponentialRampToValueAtTime(o.f2,t+dur);
      src.connect(g);
    }
    src.start(t); src.stop(t+dur+0.03);
  }
  const seq=a=>a.forEach(tone);
  const K={
   click :()=>tone({w:"square",f:520,f2:700,d:0.05,v:0.05}),
   pick  :()=>seq([{w:"square",f:440,d:0.06,v:0.07},{w:"square",f:660,d:0.09,v:0.06,at:0.05}]),
   slash :()=>seq([{noise:1,f:2600,f2:600,d:0.16,q:0.8,v:0.2},{w:"sawtooth",f:320,f2:110,d:0.1,v:0.09}]),
   hit   :()=>seq([{noise:1,f:900,f2:180,d:0.14,q:0.6,v:0.18},{w:"square",f:150,f2:60,d:0.12,v:0.12}]),
   wind  :()=>seq([{noise:1,f:700,f2:2600,d:0.32,q:2.2,v:0.16},{w:"sine",f:520,f2:960,d:0.26,v:0.06}]),
   mag   :()=>seq([{w:"sine",f:330,f2:880,d:0.26,v:0.11},{w:"triangle",f:660,f2:1320,d:0.22,v:0.06,at:0.04}]),
   shield:()=>seq([{w:"triangle",f:220,f2:440,d:0.2,v:0.12},{w:"sine",f:880,d:0.24,v:0.06,at:0.06}]),
   heal  :()=>seq([{w:"sine",f:523,d:0.14,v:0.09},{w:"sine",f:784,d:0.2,v:0.08,at:0.1}]),
   guard :()=>tone({noise:1,f:400,d:0.12,q:0.7,v:0.13}),
   miss  :()=>tone({noise:1,f:3000,f2:1400,d:0.13,q:1.5,v:0.09}),
   die   :()=>seq([{w:"sawtooth",f:260,f2:55,d:0.5,v:0.14},{noise:1,f:600,f2:120,d:0.4,v:0.1}]),
   down  :()=>tone({w:"sawtooth",f:180,f2:45,d:0.7,v:0.18}),
   summon:()=>seq([{w:"sine",f:180,f2:520,d:0.3,v:0.13},{w:"triangle",f:360,f2:1040,d:0.34,v:0.07,at:0.06}]),
   step  :()=>tone({noise:1,f:520,f2:220,d:0.12,q:0.9,v:0.1}),
   turn  :()=>seq([{w:"triangle",f:330,d:0.12,v:0.09},{w:"triangle",f:440,d:0.16,v:0.09,at:0.1}]),
   level :()=>seq([{w:"triangle",f:523,d:0.14,v:0.12},{w:"triangle",f:659,d:0.14,v:0.12,at:0.12},
                   {w:"triangle",f:784,d:0.14,v:0.12,at:0.24},{w:"triangle",f:1046,d:0.36,v:0.12,at:0.36}]),
   win   :()=>seq([{w:"square",f:523,d:0.12,v:0.09},{w:"square",f:784,d:0.12,v:0.09,at:0.11},
                   {w:"square",f:1046,d:0.4,v:0.1,at:0.22}]),
   boom  :()=>seq([{noise:1,f:220,f2:60,d:0.6,q:0.5,v:0.26,decay:2.2},{w:"sawtooth",f:110,f2:35,d:0.42,v:0.14}]),
   tornado:()=>seq([{noise:1,f:300,f2:2800,d:0.5,q:3.2,v:0.2},
                    {noise:1,f:2400,f2:400,d:0.55,q:2.4,v:0.18,at:0.34},
                    {w:"sine",f:180,f2:520,d:0.7,v:0.09},
                    {w:"triangle",f:740,f2:300,d:0.5,v:0.06,at:0.3}]),
   quake  :()=>seq([{noise:1,ftype:"lowpass",f:180,f2:50,d:0.8,q:0.4,v:0.3,decay:1.1},
                    {w:"sine",f:70,f2:32,d:0.6,v:0.28},
                    {w:"sawtooth",f:140,f2:45,d:0.28,v:0.12}]),
   arrow  :()=>seq([{noise:1,f:1800,f2:5200,d:0.14,q:4,v:0.16},
                    {noise:1,f:900,f2:200,d:0.12,q:0.8,v:0.2,at:0.14},
                    {w:"square",f:200,f2:70,d:0.1,v:0.12,at:0.14}])
  };
  return { play(k){ if(on&&K[k]){ try{ K[k]() }catch(e){} } },
           toggle(){ on=!on; if(on) ctx(); return on },
           get on(){ return on } };
})();
document.addEventListener("pointerdown",e=>{
  const b=e.target.closest && e.target.closest("button,.pick,.rw,.card,.sk");
  if(b && !b.classList.contains("off")) SFX.play("click");
},true);

/* ═══════ 이펙트 ═══════ */
const FXQ=[];
const fx=o=>{ FXQ.push(o) };
function ctrOf(side,slot){
  const box=document.getElementById(side==="foe"?"foeSide":"mySide");
  if(!box) return null;
  const e=box.querySelector('.slot[data-slot="'+slot+'"]');
  if(!e) return null;
  const r=e.getBoundingClientRect();
  return {x:r.left+r.width/2, y:r.top+r.height/2, e:e};
}
function spawn(html){
  const l=document.getElementById("fx"); if(!l) return null;
  const nd=el(html); l.appendChild(nd); setTimeout(()=>nd.remove(),1300); return nd;
}
function at(nd,p){ if(nd){ nd.style.left=p.x+"px"; nd.style.top=p.y+"px" } }
function popText(p,cls,txt){
  const nd=spawn('<div class="pop '+cls+'">'+esc(txt)+'</div>');
  if(nd){ nd.style.left=(p.x+(Math.random()*20-10))+"px"; nd.style.top=(p.y-12)+"px" }
}
function sparks(p,color,cnt){
  for(let i=0;i<cnt;i++){
    const a=Math.random()*Math.PI*2, d=16+Math.random()*32;
    const sp=spawn('<div class="spark" style="background:'+color+'"></div>');
    if(!sp) continue;
    at(sp,p);
    sp.style.setProperty("--dx",(Math.cos(a)*d)+"px");
    sp.style.setProperty("--dy",(Math.sin(a)*d)+"px");
  }
}
const ART={
 slash:'<svg viewBox="0 0 100 100"><path d="M14 78 Q50 8 88 26" stroke="#fff6e0" stroke-width="7" fill="none" stroke-linecap="round" opacity=".95"/><path d="M20 86 Q54 22 92 36" stroke="#e0705a" stroke-width="3" fill="none" stroke-linecap="round" opacity=".85"/></svg>',
 wind :'<svg viewBox="0 0 100 100"><path d="M50 10 A40 40 0 1 1 10 50" stroke="#5fd8cf" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M50 28 A22 22 0 1 0 72 50" stroke="#c6f5f1" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/></svg>',
 mag  :'<svg viewBox="0 0 100 100"><path d="M50 6 C56 34 66 44 94 50 C66 56 56 66 50 94 C44 66 34 56 6 50 C34 44 44 34 50 6 Z" fill="#6aa8e0" opacity=".85"/></svg>',
 claw :'<svg viewBox="0 0 100 100"><path d="M18 20 Q46 52 30 88 M42 14 Q66 48 52 86 M66 18 Q88 50 74 84" stroke="#e0705a" stroke-width="5" fill="none" stroke-linecap="round"/></svg>',
 boom :'<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="#e0a86a" opacity=".55"/><path d="M50 2 L60 38 L96 50 L60 62 L50 98 L40 62 L4 50 L40 38 Z" fill="#e0705a" opacity=".8"/></svg>'
};
function playFX(o){
  if(o.s) SFX.play(o.s);
  const p=ctrOf(o.side,o.slot); if(!p) return;
  if(o.sweep){ const q=ctrOf(o.sweep.side,o.sweep.slot); if(q) sweepFX(q,p) }
  if(o.streak){ const q=ctrOf(o.streak.side,o.streak.slot); if(q) streakFX(q,p) }
  if(o.quake) quakeFX(p);
  if(o.leap){ p.e.classList.remove("leap"); void p.e.offsetWidth; p.e.classList.add("leap") }
  if(o.hit){ p.e.classList.remove("shake","flashd"); void p.e.offsetWidth; p.e.classList.add("shake","flashd"); }
  if(o.glow){ p.e.classList.remove("flashg"); void p.e.offsetWidth; p.e.classList.add("flashg"); }
  if(o.art&&ART[o.art]){
    at(spawn('<div class="'+(o.art==="wind"||o.art==="boom"?"swirl":"slash")+'">'+ART[o.art]+'</div>'),p);
    sparks(p, o.art==="wind"?"#a8f0ea":(o.art==="mag"?"#9ecbf5":"#ffd9a0"), 7);
  }
  if(o.ring) at(spawn('<div class="ring" style="border-color:'+o.ring+'"></div>'),p);
  if(o.txt) popText(p,o.cls||"dmg",o.txt);
}
function sweepFX(from,to){
  const nd=spawn('<div class="sweep"><div class="spin">'+ART.wind+'</div></div>');
  if(!nd) return;
  nd.style.left=from.x+"px"; nd.style.top=from.y+"px";
  void nd.offsetWidth;
  nd.style.transition="left .6s cubic-bezier(.25,.7,.35,1), top .6s ease-in-out, opacity .2s";
  nd.style.left=to.x+"px"; nd.style.top=to.y+"px";
  setTimeout(()=>{ nd.style.opacity=0 },520);
  for(let i=1;i<=5;i++) setTimeout(()=>{
    const t=i/6, w=spawn('<div class="wake">'+ART.wind+'</div>');
    if(w){ w.style.left=(from.x+(to.x-from.x)*t)+"px";
           w.style.top=(from.y+(to.y-from.y)*t-6+Math.sin(i)*8)+"px" }
  }, i*80);
}
function quakeFX(p){
  const f=document.querySelector(".field");
  if(f){ f.classList.remove("quake"); void f.offsetWidth; f.classList.add("quake") }
  at(spawn('<div class="shockw"></div>'),p);
  for(let i=0;i<12;i++){
    const d=spawn('<div class="dust"></div>');
    if(!d) continue;
    d.style.left=(p.x+(Math.random()*70-35))+"px"; d.style.top=(p.y+26)+"px";
    d.style.setProperty("--dx",(Math.random()*70-35)+"px");
    d.style.setProperty("--dy",(14+Math.random()*26)+"px");
  }
}
function streakFX(from,to){
  const nd=spawn('<div class="streak"></div>');
  if(!nd) return;
  const dx=to.x-from.x, dy=to.y-from.y;
  nd.style.left=from.x+"px"; nd.style.top=from.y+"px";
  nd.style.width=Math.sqrt(dx*dx+dy*dy)+"px";
  nd.style.transform="rotate("+Math.atan2(dy,dx)+"rad)";
  nd.style.transformOrigin="0 50%";
}
function flushFX(){
  let t=0;
  while(FXQ.length){
    const o=FXQ.shift();
    setTimeout(()=>playFX(o),t);
    t+=(o.gap==null?110:o.gap);
  }
}
function veil(color){
  const v=el('<div class="veil" style="background:'+color+'"></div>');
  document.body.appendChild(v); setTimeout(()=>v.remove(),620);
}

</svg>`;
function figure(name){
  if(name==="성벽"||name==="저주받은 성벽") return WALL_SVG;
  const L=LOOK[name]||LOOK["작은 죄수"];
  const W={small:9,slim:10,wide:13,huge:15}[L.build];
  const H={small:15,slim:17,wide:18,huge:19}[L.build];
  const cy=52-H, hr={small:5,slim:5.5,wide:6,huge:6.5}[L.build];
  let arm="";
  if(L.arm==="sword") arm=`<path d="M${20+W+1} ${cy-9} l3 0 l0 16 l-3 0 z" fill="#cfd4d8"/>
      <rect x="${20+W-1}" y="${cy+6}" width="7" height="2.4" fill="${L.dark}"/>`;
  if(L.arm==="blade") arm=`<path d="M${20+W} ${cy-11} l2 0 l0 19 l-2 0 z" fill="#dfeeee"/>
      <path d="M${20+W-8} ${cy-13} q9 5 6 14" stroke="${L.cloth}" stroke-width="1.6" fill="none" opacity=".8"/>`;
  if(L.arm==="claw") arm=`<path d="M${20+W} ${cy+4} l6 4 M${20+W} ${cy+7} l6 4 M${20+W} ${cy+10} l6 4"
      stroke="${L.skin}" stroke-width="2" stroke-linecap="round" fill="none"/>`;
  if(L.arm==="shield") arm=`<path d="M${20+W} ${cy-1} l8 3 v6 c0 4-4 7-8 8 c-4-1-8-4-8-8 v-6 z" fill="${L.cloth}" opacity=".95"/>`;
  if(L.arm==="fist") arm=`<circle cx="${20+W+3}" cy="${cy+9}" r="2.6" fill="${L.skin}"/>`;
  if(L.arm==="bow") arm=`<path d="M${20+W+2} ${cy-10} q7 11 0 22" stroke="${L.dark}" stroke-width="2.4" fill="none"/>
      <path d="M${20+W+2} ${cy-10} L${20+W+2} ${cy+12}" stroke="#e8e0cc" stroke-width="1"/>`;
  if(L.arm==="staff") arm=`<path d="M${20+W+2} ${cy-12} L${20+W+2} ${cy+14}" stroke="${L.dark}" stroke-width="2.6"/>
      <circle cx="${20+W+2}" cy="${cy-13}" r="3.4" fill="${L.cloth}"/>`;
  const horn=L.horn?`<path d="M${20-hr+1} ${cy-hr-3} l-3 -6 l5 3 z M${20+hr-1} ${cy-hr-3} l3 -6 l-5 3 z" fill="${L.dark}"/>`:"";
  return `<svg viewBox="0 0 40 52" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="20" cy="50" rx="${W}" ry="2.6" fill="#000" opacity=".35"/>
    ${arm}
    <rect x="${20-W*0.55}" y="${52-9}" width="${W*0.45}" height="9" fill="${L.dark}"/>
    <rect x="${20+W*0.1}" y="${52-9}" width="${W*0.45}" height="9" fill="${L.dark}"/>
    <path d="M${20-W} ${cy+2} q0 -5 ${W} -5 q${W} 0 ${W} 5 l${W*0.15} ${H-4} q${-W} 3 ${-2*W-W*0.3} 0 z" fill="${L.cloth}"/>
    <circle cx="20" cy="${cy-hr}" r="${hr}" fill="${L.skin}"/>
    ${horn}
    <rect x="${20-hr}" y="${cy-hr-1}" width="${hr*2}" height="2.2" fill="${L.dark}" opacity=".75"/>
  </svg>`;
}

function addMod(h,skName,key,v,label){

}

function recipeLines(it){
  const L=[];
  if(it.rc) L.push("재료 : "+it.rc.join(" + ")+" · 제련석 "+it.cost);
  const into=ITEMS.filter(x=>x.rc&&x.rc.indexOf(it.n)>=0);
  if(into.length) L.push("쓰임 : "+into.map(x=>x.n).join(", "));
  if(!L.length) L.push("제련과는 관계없는 아이템입니다.");
  return L;
}
function recipeHtml(it){
  return recipeLines(it).map(t=>`<p class="rcp">${rich(t)}</p>`).join("");
}
function itemTip(it){ return it.n+" — "+it.d+"\n"+recipeLines(it).join("\n") }
function findRecipe(a,b){
  const key=[a,b].sort().join("|");
  return ITEMS.find(it=>it.rc&&it.rc.slice().sort().join("|")===key)||null;
}
const ITEM_MAX=3;
function equip(h,it){
  h.items.push(it);
  if(it.st) for(const k in it.st){ h[k]+=it.st[k]; if(k==="maxHp") h.hp+=it.st[k] }
}
function unequip(h,idx){
  const it=h.items.splice(idx,1)[0];
  if(it&&it.st) for(const k in it.st){ h[k]-=it.st[k]; if(k==="maxHp") h.hp=Math.min(h.hp,h.maxHp) }
  return it;
}
function itemBt(h,key){ return (h.items||[]).reduce((a,i)=>a+((i.bt&&i.bt[key])||0),0) }
function itemSlots(h){
  let out='<div class="slots">';
  for(let i=0;i<ITEM_MAX;i++) out+='<span class="sq '+(h.items[i]?"on":"")+'" title="'+
    (h.items[i]?esc(itemTip(h.items[i])):"빈 칸")+'"></span>';
  return out+'</div>';
}

function addDeb(u,k,n){
  if(!u) return;
  u.deb=u.deb||{};

  if(u.negShield>0){ u.negShield--;

    if(u.tag&&u.tag.negHeal){ u.hp=Math.min(u.maxHp,u.hp+u.tag.negHeal) }
    return;
  }
  u.deb[k]=(u.deb[k]||0)+n;
  fx({side:u.isFoe?"foe":"mine",slot:u.slot,ring:DEBUFF[k].c,txt:DEBUFF[k].n+u.deb[k],cls:"miss",gap:80});
  say(`${u.name} ${DEBUFF[k].n} ${u.deb[k]}`,"t3");

function tickDebEnd(u){
  if(!u.deb) return;
  if(u.deb.burn>0){
    const v=u.deb.burn;
    let d=v; const sh=Math.min(u.shield||0,d); u.shield-=sh; d-=sh; u.hp-=d;
    fx({side:"mine",slot:u.slot,hit:1,txt:"-"+v,cls:"dmg",gap:80});
    say(`${u.name} 화상 피해 ${v}`,"t3");
    u.deb.burn--;
  }
  ["atkDn","magDn","defDn","bind"].forEach(k=>{ if(u.deb[k]>0) u.deb[k]-- });
  u.deb.shock=0; u.deb.chill=0; u.deb.stun=0; u.deb.fear=0;
}

   event  :'<path d="M24 22 a8 8 0 1 1 10 12 v6" stroke="@" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="34" cy="50" r="4" fill="@"/>'
  }[t]||"";
  return g?'<svg viewBox="0 0 64 64">'+g.split("@").join(c)+'</svg>':"";
}
function buildGrid(fi){
  const S=FIELDS[fi].size, g=[], mid=Math.floor(S/2);
  for(let r=0;r<S;r++){ const row=[]; for(let c=0;c<S;c++) row.push({t:"empty"}); g.push(row) }
  g[S-1][mid]={t:"camp"};
  g[0][mid]={t:"boss"};
  const free=[];
  for(let r=0;r<S;r++) for(let c=0;c<S;c++) if(g[r][c].t==="empty") free.push([r,c]);
  const put=(t,n,mk)=>{
    for(let i=0;i<n&&free.length;i++){
      const k=Math.floor(Math.random()*free.length), rc=free.splice(k,1)[0];
      g[rc[0]][rc[1]]=Object.assign({t:t},mk?mk():{});
    }
  };
  const sc=S/7;
  const dun=()=>({waves:1+Math.floor(Math.random()*3),style:rnd(DUN_STYLE),loot:rnd(DUN_LOOT)});
  put("dungeon",Math.round(10*sc),dun);
  put("elite",Math.round(3*sc),()=>({waves:1+Math.floor(Math.random()*2),style:rnd(DUN_STYLE),loot:rnd(DUN_LOOT)}));
  put("shop",2); put("rest",2); put("event",5);
  return g;
}
/* 이미 들른 상점·휴식소·미지의 구역은 다른 날 다른 자리에 다시 나타난다 */
function respawn(){
  const S=run.size, free=[];
  for(let r=0;r<S;r++) for(let c=0;c<S;c++) if(run.grid[r][c].t==="empty") free.push([r,c]);
  ["shop","rest","event"].forEach(t=>{
    const want={shop:2,rest:2,event:5}[t];
    let have=0;
    for(let r=0;r<S;r++) for(let c=0;c<S;c++) if(run.grid[r][c].t===t) have++;
    for(let i=have;i<want&&free.length;i++){
      if(Math.random()<0.45) continue;              /* 7일에 걸쳐 조금씩 */
      const k=Math.floor(Math.random()*free.length), rc=free.splice(k,1)[0];
      run.grid[rc[0]][rc[1]]={t:t};
    }
  });
  /* 던전을 모두 정복하면 새 던전이 생긴다 */
  let left=0;
  for(let r=0;r<S;r++) for(let c=0;c<S;c++){ const x=run.grid[r][c];
    if(x.t==="dungeon"||x.t==="elite") left++ }
  if(!left){
    const n=4+Math.floor(Math.random()*3);
    for(let i=0;i<n&&free.length;i++){
      const k=Math.floor(Math.random()*free.length), rc=free.splice(k,1)[0];
      run.grid[rc[0]][rc[1]]={t:i<2?"elite":"dungeon",waves:1+Math.floor(Math.random()*3),
        style:rnd(DUN_STYLE),loot:rnd(DUN_LOOT)};
    }
    if(n) toast("정복하지 않은 던전이 사라지고, 새 던전이 나타났습니다.");
  }
}

/* ═══════════ 영웅 · 원정 ═══════════ */
function makeHero(name){
  const d=HEROES[name];
  return {name:name,title:d.title,maxHp:d.hp,hp:d.hp,maxMana:d.mana,hpLv:d.hpLv,
    atk:0,mag:0,def:0, lv:1, exp:0,
    sk:d.skills.map(s=>Object.assign({},s)),
    passive:d.passive,
    tag:{armors:["강철 갑옷","강철 각반","강철 군화","마법 부여 보호구","영광의 휘장"]},
    wins:0, items:[], down:0};
}
function needExp(lv){ return 5+(lv-1)*2 }

let startPicks=null, startPacks=null, pendingHero=null;
function rollStart(){
  const pool=HERO_POOL.slice(); startPicks=[];
  while(startPicks.length<3&&pool.length)
    startPicks.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  const pk=PACKS.slice(); startPacks=[];
  while(startPacks.length<3&&pk.length)
    startPacks.push(pk.splice(Math.floor(Math.random()*pk.length),1)[0]);
}
function newRun(name,pack){
  const f=FIELDS[0], S=f.size, mid=Math.floor(S/2);
  run={heroes:[makeHero(name)], gold:0, stone:0, cards:[], bag:[],
       field:0, size:S, grid:buildGrid(0),
       pos:{r:S-1,c:mid}, day:1, time:6, act:f.act, actMax:f.act,
       taint:0, night:0, campDone:0, bonusLv:null};
  if(pack) pack.fx(run);
  const q=run.bonusLv; run.bonusLv=null;
  view="map";
  if(q&&q.length){ pending={queue:q,idx:0}; view="reward" }
  render();
}

/* ═══════════ 시간 · 오염도 ═══════════ */
function clock(){
  const t=Math.max(0,run.time), h=Math.floor(t)%24, m=(t%1)?"30":"00";
  return (h<10?"0":"")+h+":"+m;
}
function spend(hours,act){
  const tired=run.act<=0;
  if(act){ run.act=Math.max(0,run.act-act) }
  run.time+=(tired&&act)?hours*2:hours;
  if(run.time>=18&&!run.night){ run.night=1;
    toast("해가 집니다. 밤길에는 무엇이 튀어나올지 모릅니다.") }
  if(run.time>=30){ toast("길에서 밤을 지새웠습니다."); nextDay() }
}
function addTaint(v){
  run.taint=Math.max(0,Math.min(100,run.taint+v));
  if(run.taint>=100) lose("균열의 오염이 100에 달했습니다. 세상이 갈라집니다.");
}
function nextDay(){
  run.day++;
  if(run.day>FIELDS[run.field].days){
    lose(`${FIELDS[run.field].days}일이 지나도록 우두머리를 넘지 못했습니다.`); return;
  }
  run.time=6; run.act=run.actMax; run.night=0; run.campDone=0;
  addTaint(10);
  respawn();
  toast(`${run.day}일차 아침이 밝았습니다.`);
}
function lose(msg){ run.lost=msg; view="over"; render() }
let TOAST="";
function toast(t){ TOAST=t }

function nextField(){
  run.field++;
  if(run.field>=FIELDS.length){ view="clear"; render(); return }
  const f=FIELDS[run.field], S=f.size, mid=Math.floor(S/2);
  run.size=S; run.grid=buildGrid(run.field);
  run.pos={r:S-1,c:mid};
  run.day=1; run.time=6; run.actMax=f.act; run.act=f.act;
  run.night=0; run.taint=0; run.campDone=0;
  run.heroes.forEach(h=>{ h.hp=h.maxHp; h.down=0 });
  toast(`${f.n}에 들어섭니다. 대원 전원이 회복되었습니다.`);
  view="map"; render();
}

/* ═══════════ 필드 지도 ═══════════ */
const near=(a,b)=>Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1;
function drawMap(app){
  const f=FIELDS[run.field], S=run.size;
  app.appendChild(el(`<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
    <div class="title" style="font-size:20px">${esc(f.n)}</div>
    <div class="hint">${run.night?`밤입니다. 빈 칸을 지날 때 습격당할 확률 ${Math.round(Math.min(85,45+nightDepth()*5))}% · 표시된 칸은 ${Math.round(Math.min(85,12+nightDepth()*5))}%`:run.act<=0?"활동량이 바닥났습니다. 이제 한 칸에 2시간이 걸립니다.":"인접한 칸을 눌러 이동합니다. 한 칸에 활동량 1 · 1시간 · 오염도 7."}</div></div>`));
  const g=el(`<div class="gridmap" style="grid-template-columns:repeat(${S},1fr)"></div>`);
  for(let r=0;r<S;r++) for(let c=0;c<S;c++){
    const cell=run.grid[r][c], here=(run.pos.r===r&&run.pos.c===c);
    const adj=near(run.pos,{r:r,c:c});
    const risky=run.night&&cell.t==="empty"&&adj;
    const d=el(`<div class="cell ${cell.t==="empty"?"emp":""} ${here?"here":""} ${adj?"adj":""} ${cell.done?"done":""} ${risky?"risk":""}">
      ${nodeArt(cell.t)}
      ${here?`<span class="you">●</span>`:""}
      ${cell.t!=="empty"&&!cell.done?`<span class="cl">${esc(NODE[cell.t].label)}</span>`:""}
    </div>`);
    if(cell.t==="dungeon"||cell.t==="elite")
      d.title=`적 강화 +${Math.round((foeScale(cell.t).m-1)*100)}%
${NODE[cell.t].label} · ${cell.waves}차 전투\n${cell.style}\n${cell.loot}`;
    if(adj) d.onclick=()=>moveTo2(r,c);
    else if(here&&cell.t==="camp") d.onclick=()=>{ view="camp"; render() };
    g.appendChild(d);
  }
  app.appendChild(g);
  const legend=el(`<div class="legend"></div>`);
  ["camp","dungeon","elite","shop","rest","event","boss"].forEach(t=>
    legend.appendChild(el(`<span><i>${nodeArt(t)}</i>${esc(NODE[t].label)}</span>`)));
  app.appendChild(legend);
  if(run.grid[run.pos.r][run.pos.c].t==="camp"){
    const b=el(`<div style="margin-top:12px"><button class="go">주둔지로 들어간다</button></div>`);
    b.querySelector("button").onclick=()=>{ view="camp"; render() };
    app.appendChild(b);
  }
  app.appendChild(el(`<div style="margin-top:20px" class="hint">대원${(run.bag||[]).length?` · 가방에 아이템 ${run.bag.length}개 (주둔지에서 정리)`:""}</div>`));
  const rs=el(`<div class="roster"></div>`);
  run.heroes.forEach(h=>rs.appendChild(el(`<div class="rost ${h.down?"down":""}">
    <div class="art">${figure(h.name)}</div>
    <div><b>${esc(h.name)}</b>${h.down?`<span class="chip on">기절</span>`:""}
      <small>Lv.${h.lv} · 경험치 ${h.exp}/${needExp(h.lv)}</small>
      <small>${ic("hp")}${h.hp}/${h.maxHp} ${ic("atk")}${h.atk} ${ic("mag")}${h.mag} ${ic("def")}${h.def}</small>
      ${itemSlots(h)}
    </div></div>`)));
  app.appendChild(rs);
}
function nightDepth(){ return run.night?Math.max(0,run.time-18):0 }
function ambushChance(cell){
  if(!run.night) return 0;
  const base=(cell.t==="empty")?0.45:0.12;
  return Math.min(0.85, base+nightDepth()*0.05);
}
function moveTo2(r,c){
  const cell=run.grid[r][c];
  run.pos={r:r,c:c};
  spend(1,1); addTaint(7);
  if(run.taint>=100) return;
  if(cell.t!=="camp"&&Math.random()<ambushChance(cell)){
    toast(cell.t==="empty"
      ? "인기척 하나 없는 자리입니다. 어둠 속에서 무언가 달려듭니다."
      : "발을 들이기도 전에 무언가 달려듭니다.");
    if(cell.t!=="empty") run.pendingEnter={r:r,c:c};   /* 이기면 원래 볼일을 본다 */
    startDungeon({t:"ambush",waves:1},null,null); return;
  }
  enterCell(r,c);
}
function enterCell(r,c){
  const cell=run.grid[r][c];
  if(cell.done||cell.t==="empty"){ view="map"; render(); return }
  if(cell.t==="camp"){ view="camp"; render(); return }
  if(cell.t==="shop"||cell.t==="rest"||cell.t==="event"){
    spend(0.5,0);
    run.here={r:r,c:c};
    run.grid[r][c]={t:"empty"};      /* 한 번 들르면 사라진다 */
    if(cell.t==="shop"){ makeShop(); view="shop" }
    else if(cell.t==="rest"){ view="rest" }
    else { run.ev=rnd(EVENTS); run.evMsg=null; view="relic" }
    render(); return;
  }
  if(cell.t==="dungeon"||cell.t==="elite"||cell.t==="boss"){ startDungeon(cell,r,c); return }
  view="map"; render();
}

/* ═══════════ 주둔지 ═══════════ */
function campAct(key,label,desc,ok,fx){
  return {k:key,n:label,d:desc,ok:ok,fx:fx};

function trainExp(){
  const pool=run.heroes.filter(h=>!h.down);
  if(!pool.length) return 4;
  const lv=pool.reduce((a,h)=>a+h.lv,0)/pool.length;
  return Math.max(4,Math.round(4+(lv-1)*1.2));
}

function drawForge(app){
  run.forgePick=run.forgePick||[];
  const picked=run.forgePick.map(k=>{
    const p=k.split(":");
    if(p[0]==="B") return {bag:1,i:+p[1],it:(run.bag||[])[+p[1]]};
    return {h:run.heroes[+p[0]],i:+p[1],it:run.heroes[+p[0]].items[+p[1]]};
  }).filter(x=>x.it);
  const made=picked.length===2?findRecipe(picked[0].it.n,picked[1].it.n):null;
  app.appendChild(el(`<div class="center"><div class="title" style="font-size:20px">제 련</div>
    <div class="sub">조합법이 있는 아이템 둘을 골라 하나로 만듭니다 · 제련석 ${run.stone||0}개 보유</div></div>`));
  const wrap=app.querySelector(".center");
  const row=el(`<div class="rewards"></div>`);
  let any=0;
  run.heroes.forEach((h,hi)=>h.items.forEach((it,ii)=>{
    if(it.g!=="파편"&&it.g!=="일반") return;      /* 재료가 될 수 있는 등급만 */
    any=1;
    const key=hi+":"+ii, on=run.forgePick.indexOf(key)>=0;
    const c=el(`<div class="rw ${on?"on":""}"><div class="rwi">${rewardIcon(it)}</div>
      <div class="g">${esc(h.name)} · ${esc(it.g)}</div>
      <b>${esc(it.n)}</b><p>${rich(it.d)}</p>${recipeHtml(it)}</div>`);
    c.onclick=()=>{
      const i=run.forgePick.indexOf(key);
      if(i>=0) run.forgePick.splice(i,1); else if(run.forgePick.length<2) run.forgePick.push(key);
      render();
    };
    row.appendChild(c);
  }));
  (run.bag||[]).forEach((it,bi)=>{
    if(it.g!=="파편"&&it.g!=="일반") return;
    any=1;
    const key="B:"+bi, on=run.forgePick.indexOf(key)>=0;
    const c=el(`<div class="rw ${on?"on":""}"><div class="rwi">${rewardIcon(it)}</div>
      <div class="g">가방 · ${esc(it.g)}</div>
      <b>${esc(it.n)}</b><p>${rich(it.d)}</p>${recipeHtml(it)}</div>`);
    c.onclick=()=>{
      const i=run.forgePick.indexOf(key);
      if(i>=0) run.forgePick.splice(i,1); else if(run.forgePick.length<2) run.forgePick.push(key);
      render();
    };
    row.appendChild(c);
  });
  if(!any) wrap.appendChild(el(`<p class="hint" style="margin-top:20px">제련할 수 있는 재료가 없습니다.</p>`));
  wrap.appendChild(row);
  /* 결과 안내 */
  let msg="", ok=false;
  if(picked.length<2) msg="재료 두 개를 고르세요.";
  else if(!made) msg=`${picked[0].it.n} + ${picked[1].it.n} 은(는) 조합법이 없습니다.`;
  else if((run.stone||0)<made.cost) msg=`${made.n}을(를) 만들려면 제련석 ${made.cost}개가 필요합니다. (지금 ${run.stone||0}개)`;
  else { msg=`${made.n} 완성 · 제련석 ${made.cost} 소모`; ok=true }
  wrap.appendChild(el(`<p style="margin-top:18px;color:${ok?"var(--brass)":"var(--dim)"}">${rich(msg)}</p>`));
  if(made) wrap.appendChild(el(`<div class="rewards" style="margin-top:10px">
    <div class="rw ${ok?"":"no"}"><div class="rwi">${rewardIcon(made)}</div>
      <div class="g">${esc(made.g)} · 결과물</div>
      <b>${esc(made.n)}</b><p>${rich(made.d)}</p>${recipeHtml(made)}</div></div>`));
  const go=el(`<div style="margin-top:18px"><button class="go">제련한다</button></div>`);
  go.querySelector("button").disabled=!ok;
  go.querySelector("button").onclick=()=>{
    run.stone-=made.cost;
    const bags=picked.filter(p=>p.bag).sort((a,b)=>b.i-a.i);
    const eqs =picked.filter(p=>!p.bag).sort((a,b)=>b.i-a.i);
    bags.forEach(p=>run.bag.splice(p.i,1));
    eqs.forEach(p=>unequip(p.h,p.i));
    const owner=(eqs[0]&&eqs[0].h)||run.heroes[0];
    run.forgePick=[];
    SFX.play("summon");
    toast(`${made.n}${jo(made.n,"eul")} 제련했습니다.`);
    pending={stage:"hero",list:[],item:made,hero:owner,back:"map"};
    if(owner.items.length>=ITEM_MAX){ pending.stage="swap" } else { equip(owner,made); itemDone(); return }
    view="item"; render();
  };
  wrap.appendChild(go);
  const back=el(`<div style="margin-top:12px"><button>그만둔다</button></div>`);
  back.querySelector("button").onclick=()=>{ run.forgePick=[]; run.campDone=0; view="camp"; render() };
  wrap.appendChild(back);
  app.appendChild(recipeBook());
}
function recipeBook(){
  const box=el(`<div class="rcbook"><h4>조 합 표</h4></div>`);
  const have=n=>run.heroes.some(h=>h.items.some(i=>i.n===n));
  ["일반","희귀"].forEach(g=>{
    box.appendChild(el(`<div class="hint" style="margin-top:10px">${g} 아이템</div>`));
    ITEMS.filter(i=>i.g===g&&i.rc).forEach(it=>{
      const ok=it.rc.every(n=>have(n));
      box.appendChild(el(`<div class="rcrow" style="${ok?"color:var(--fg)":""}">
        <b>${esc(it.n)}</b>
        <span>${it.rc.map(n=>`<span style="color:${have(n)?"var(--hp)":"var(--faint)"}">${esc(n)}</span>`).join(" + ")}</span>
        <i>제련석 ${it.cost}</i></div>`));
    });
  });
  return box;
}

function startDungeon(cell,r,c){
  run.dun={cell:cell,r:r,c:c,wave:0,waves:cell.waves||1,
           kind:cell.t==="boss"?"boss":cell.t==="elite"?"elite":cell.t==="ambush"?"ambush":"battle"};
  nextWave();
}
function nextWave(){
  run.dun.wave++;
  spend(1,0);
  startBattle(run.dun.kind);
}
function dungeonCleared(){
  const d=run.dun;
  if(d.kind!=="ambush"&&d.r!=null&&run.grid[d.r]&&run.grid[d.r][d.c])
    run.grid[d.r][d.c]={t:"empty"};
  addTaint(d.kind==="ambush"?-10:-20);
  if(d.kind==="boss") run.bossDone=1;
  openChest(d.kind);
}

function rollChest(kind){
  const T=[CHEST,CHEST2,CHEST3][Math.min(run.field,2)][kind]||CHEST.battle;
  const out=[];
  T.forEach(row=>{
    const type=row[0], lo=row[1], hi=row[2], p=row[3];
    let n=0;
    if(p>=1) n=Math.floor(p); else if(Math.random()<p) n=1;
    for(let i=0;i<n;i++){
      if(type==="금화") out.push({t:"금화",v:lo+Math.floor(Math.random()*(hi-lo+1))});
      else if(type==="경험치") out.push({t:"경험치",v:lo+Math.floor(Math.random()*(hi-lo+1))});
      else out.push({t:type});
    }
  });
  return out;
}
function openChest(kind){
  run.chest={kind:kind,list:rollChest(kind),idx:0,opened:0};
  view="chest"; render();
}
function chestIcon(t){
  const c={"금화":"#c9a227","경험치":"#7fd39a","파편":"#6aa8e0","일반":"#6aa8e0",
           "하급":"#9c8d77","중급":"#e0a86a","상급":"#e0705a","동료":"#5fd8cf"}[t]||"#c9a227";
  const g=(t==="금화")?'<circle cx="32" cy="34" r="17" fill="none" stroke="@" stroke-width="5"/><path d="M32 24v20M26 30h12" stroke="@" stroke-width="4"/>'
    :(t==="경험치")?'<path d="M32 12 L52 34 H42 V54 H22 V34 H12 Z" fill="@"/>'
    :(t==="파편"||t==="일반")?'<path d="M32 12 L50 24 v18 L32 54 L14 42 V24 Z" fill="none" stroke="@" stroke-width="5"/>'
    :(t==="동료")?'<circle cx="32" cy="22" r="10" fill="@"/><path d="M13 54 q19 -21 38 0 z" fill="@"/>'
    :'<path d="M32 10 L40 26 L58 28 L45 40 L48 56 L32 48 L16 56 L19 40 L6 28 L24 26 Z" fill="@"/>';
  return '<svg viewBox="0 0 64 64">'+g.split("@").join(c)+'</svg>';
}
function drawChest(app){
  const ch=run.chest;
  const nm={battle:"던전 보상 상자",elite:"정예 던전 보상 상자",boss:"우두머리 보상 상자",ambush:"밤길의 전리품"}[ch.kind];
  app.appendChild(el(`<div class="center"><div class="title" style="font-size:22px">${esc(nm)}</div>
    <div class="sub">${ch.opened?"이번 던전에서 얻은 것":"상자를 열어 봅니다"}</div></div>`));
  const wrap=app.querySelector(".center");
  if(!ch.opened){
    const b=el(`<div style="margin-top:26px"><button class="go" style="font-size:16px;padding:12px 30px">상자를 연다</button></div>`);
    b.querySelector("button").onclick=()=>{ ch.opened=1; SFX.play("summon"); render() };
    wrap.appendChild(b);
    return;
  }
  const row=el(`<div class="rewards"></div>`);
  ch.list.forEach(x=>{
    const label=x.t==="금화"?`금화 ${x.v}`:x.t==="경험치"?`경험치 ${x.v}`
      :x.t==="파편"?"무작위 파편 아이템":x.t==="일반"?"무작위 일반 아이템"
      :x.t==="동료"?"새로운 동료 영입":`${x.t} 보상 선택`;
    row.appendChild(el(`<div class="rw ro"><div class="rwi">${chestIcon(x.t)}</div>
      <b>${esc(label)}</b></div>`));
  });
  wrap.appendChild(row);
  const b=el(`<div style="margin-top:24px"><button class="go">전부 챙긴다</button></div>`);
  b.querySelector("button").onclick=takeChest;
  wrap.appendChild(b);
}
function takeChest(){
  const ch=run.chest, later=[];
  let exp=0;
  ch.list.forEach(x=>{
    if(x.t==="금화") run.gold+=x.v;
    else if(x.t==="경험치") exp+=x.v;
    else if(x.t==="파편"||x.t==="일반") later.push({item:rnd(ITEMS.filter(i=>i.g===x.t))});
    else if(x.t==="동료") later.push({recruit:1});
    else later.push({grade:x.t});
  });
  run.chest=null;
  run.after=later;
  if(exp) giveExp(exp,run.heroes.filter(h=>!h.down&&h.joined!==0));
  afterChest();
}
function afterChest(){
  const q=run.after||[];
  if(!q.length){ run.after=null; backToMap(); return }
  const nx=q.shift();
  if(nx.item){ pending={stage:"hero",list:[],item:nx.item,hero:null,back:"chain"}; view="item"; render(); return }
  if(nx.recruit){
    const owned=run.heroes.map(x=>x.name);
    const pool=HERO_POOL.filter(n=>!owned.includes(n));
    run.heroOffer=[];
    while(run.heroOffer.length<3&&pool.length)
      run.heroOffer.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
    view="recruit"; render(); return;
  }
  pending={hero:null,grade:nx.grade,free:1,back:"chain"}; view="reward"; render();
}
function backToMap(){
  if(run.pendingLv&&run.pendingLv.length){
    const q=run.pendingLv; run.pendingLv=null;
    pending={queue:q,idx:0}; view="reward"; render(); return;
  }
  if(run.bossDone){ run.bossDone=0; run.dun=null; nextField(); return }
  run.dun=null;
  if(run.pendingEnter){
    const e=run.pendingEnter; run.pendingEnter=null;
    toast("습격을 물리치고 다시 걸음을 옮깁니다.");
    enterCell(e.r,e.c); return;
  }
  view="map"; render();
}

              use:a=>{ a.hp=Math.min(a.maxHp,a.hp+5); a.stun=(a.stun||0)+1;
                       say(`맥주 — ${a.name} 체력 +5, 기절 1`) }},

function addCard(r,name,n){
  const e=(r.cards=r.cards||[]).find(x=>x.n===name);
  if(e) e.c=Math.min(10,e.c+n); else if(r.cards.length<10) r.cards.push({n:name,c:Math.min(10,n)});
}
function useCard(name){
  const e=(run.cards||[]).find(x=>x.n===name);
  if(!e) return;
  e.c--; if(e.c<=0) run.cards.splice(run.cards.indexOf(e),1);
}

/* ═══════════ 경험치 ═══════════ */
function giveExp(exp,pool,each){
  pool=(pool&&pool.length)?pool:run.heroes.filter(h=>!h.down);
  if(!pool.length) pool=run.heroes.slice();
  if(each){
    const q0=run.pendingLv||[];
    pool.forEach(h=>{
      h.exp+=exp;
      while(h.lv<30&&h.exp>=needExp(h.lv)){
        h.exp-=needExp(h.lv); h.lv++;
        h.maxHp+=h.hpLv; h.hp+=h.hpLv;
        if(h.name==="트리스탄") h.atk++;
        q0.push({hero:h,lv:h.lv});
      }
    });
    run.pendingLv=q0;
    toast(`경험치 — ${pool.map(h=>h.name).join(" · ")} 각각 +${exp}`);
    return;
  }
  const w=pool.map(h=>1/Math.max(1,h.lv));
  const sum=w.reduce((a,b)=>a+b,0);
  const raw=w.map(x=>exp*x/sum);
  const got=raw.map(x=>Math.floor(x));
  let left=exp-got.reduce((a,b)=>a+b,0);
  raw.map((x,i)=>({i:i,f:x-Math.floor(x)})).sort((a,b)=>b.f-a.f)
     .forEach(o=>{ if(left>0){ got[o.i]++; left-- } });
  if(exp>0) got.forEach((g,i)=>{ if(g<1) got[i]=1 });
  const q=run.pendingLv||[];
  pool.forEach((h,i)=>{
    h.exp+=got[i];
    while(h.lv<30&&h.exp>=needExp(h.lv)){
      h.exp-=needExp(h.lv); h.lv++;
      h.maxHp+=h.hpLv; h.hp+=h.hpLv;
      if(h.name==="트리스탄") h.atk++;
      q.push({hero:h,lv:h.lv});
    }
  });
  run.pendingLv=q;
  toast(`경험치 — ${pool.map((h,i)=>h.name+" +"+got[i]).join(" · ")}`);
}

function makeShop(){
  const st=run.field;
  const pool=SHOP_STOCK.filter(g=>(g.stage||0)<=st).slice();
  /* 특정 파편 아이템 : 무엇인지 보이는 대신 조금 비싸다 */
  const named=rnd(ITEMS.filter(i=>i.g==="파편"));
  pool.push({n:named.n,d:named.d,p:[10,20],q:[1,st>=2?3:1],k:"named",item:named});
  const goods=[], n=4+Math.floor(Math.random()*5);
  while(goods.length<n&&pool.length){
    const g=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    const qr=(st>=2&&g.s3q)?g.s3q:(st>=1&&g.s2q)?g.s2q:g.q;
    goods.push({n:g.n,d:g.d,k:g.k,card:g.card,item:g.item,
                cost:rr(g.p), left:rr(qr)});
  }
  run.shop={npc:rnd(SHOP_NPC),goods:goods};
}

function drawShop(app){
  const sh=run.shop;
  const box=el(`<div class="npcbox">
    <div class="npc"><div class="npcface">${figure("도미니코")}</div>
      <b>${esc(sh.npc)}</b>
      <p>"필요한 게 있으면 골라 보시오. 값은 그때그때 다르니."</p>
      <p style="color:var(--brass)">가진 금화 ${run.gold}</p></div>
    <div class="shelf"><div class="hint">진열대</div><div class="shelfrow" id="shelf"></div></div>
  </div>`);
  app.appendChild(box);
  const row=box.querySelector("#shelf");
  sh.goods.forEach(g=>{
    const off=g.left<=0||run.gold<g.cost;
    const c=el(`<div class="rw ${off?"no":""}">
      <div class="rwi">${shopIcon(g.k)}</div>
      <div class="g">${g.left<=0?"품절":g.cost+" 금화 · 남은 "+g.left}</div>
      <b>${esc(g.n)}</b><p>${rich(g.d)}</p>${g.item?recipeHtml(g.item):""}</div>`);
    if(!off) c.onclick=()=>buy(g);
    row.appendChild(c);
  });
  const out=el(`<div style="text-align:center;margin-top:22px"><button class="go">상점을 떠난다</button></div>`);
  out.querySelector("button").onclick=leaveNode;
  app.appendChild(out);
}
function buy(g){
  if(run.gold<g.cost||g.left<=0) return;
  run.gold-=g.cost; g.left--;
  SFX.play("summon");
  if(g.k==="card"){ addCard(run,g.card,1); toast(`${g.card} 카드를 얻었습니다.`); render(); return }
  if(g.k==="stone"){ run.stone=(run.stone||0)+1; render(); return }
  if(g.k==="act"){ run.act=Math.round(run.act)+4; toast("활동량을 4 얻었습니다."); render(); return }
  if(g.k==="taint"){ addTaint(-20); toast("오염도가 20 낮아졌습니다."); render(); return }
  if(g.k==="shard"||g.k==="normal"||g.k==="named"){
    const it=g.item||rnd(ITEMS.filter(i=>i.g===(g.k==="normal"?"일반":"파편")));
    pending={stage:"hero",list:[],item:it,hero:null,back:"shop"};
    view="item"; render(); return;
  }
  pending={hero:null,grade:g.k,free:1,back:"shop"}; view="reward"; render();
}

/* ═══════════ 전투 ═══════════ */
const SLOTS=5;
const UNLOCK=[1,1,7,15];   // 3번 기술 7레벨, 궁극기 15레벨 (기획노트)
const dist=(a,e)=>(SLOTS-a)+e;   /* 아군 a번, 적 e번 · 아군 5번과 적 1번이 거리 1 */
function foeSet(kind){
  const f=Math.min(run.field,2), pool=FIELD_FOES[f], out=[];
  const n=run.heroes.length;
  if(kind==="boss"){
    out.push([BOSSES[f],1]);
    const extra=Math.min(2,Math.max(0,n-1));
    for(let i=0;i<extra;i++) out.push([rnd(pool),2+i]);
    return out;
  }
  if(kind==="elite"){
    /* 정예는 대원 수 제한을 덜 받고, 앞자리에 가장 단단한 놈이 선다 */
    const k=Math.max(3,Math.min(5,n+2));
    const lead=pool.slice().sort((a,b)=>FOE[b].hp-FOE[a].hp)[0];
    out.push([lead,1]);
    for(let i=2;i<=k;i++) out.push([rnd(pool),i]);
    return out;
  }
  const base=2+Math.floor(Math.random()*2);
  const k=Math.max(1,Math.min(base,n+1));
  for(let i=1;i<=k;i++) out.push([rnd(pool),i]);
  return out;
}
/* 대원이 강해진 만큼 적도 따라온다 */
function partyPower(){
  if(!run||!run.heroes.length) return 1;
  const n=run.heroes.length;
  const lv=run.heroes.reduce((a,h)=>a+h.lv,0)/n;
  const st=run.heroes.reduce((a,h)=>a+h.atk+h.mag+h.def,0)/n;
  const hp=run.heroes.reduce((a,h)=>a+h.maxHp,0)/n;
  return 1+(lv-1)*0.11+st*0.012+Math.max(0,hp-22)*0.006;
}
function foeScale(kind){
  const f=run.field, l=(run.day-1)+(run.dun?run.dun.wave-1:0), n=Math.min(run.heroes.length,5);
  let m=(1+f*0.85)*(1+l*0.05)*partyPower();
  if(kind==="elite")  m*=1.5;
  if(kind==="boss")   m*=1.45;
  if(kind==="ambush") m*=1.3+nightDepth()*0.08;
  /* 대원이 적을수록 적도 약해진다 */
  const hpP =[0,0.68,0.86,1,1.08,1.15][n];
  const atkP=[0,0.58,0.82,1,1.06,1.12][n];
  const defP=[0,0.7 ,0.88,1,1.05,1.1 ][n];
  return {m:m, hpP:hpP, atkP:atkP, defP:defP,
          hpAdd:Math.round((f*3+l)*hpP), atkAdd:Math.floor(f*1.2*atkP), defAdd:Math.round(f*2*defP)};
}
function startBattle(kind){
  const _k=kind;
  B={kind,turn:1,over:0,log:[],hand:[],units:[],foes:[],drag:null};
  run.heroes.forEach(clearTmp);
  run.heroes.forEach(h=>{
    if(h.hp<=0) h.hp=1;
    h.mana=h.maxMana; h.shield=0; h.mom=0; h.evade=0; h.slot=0;
    h.acts=0; h.veilDone=0; h.armor=0; h.read=0; h.blessed=0;
    h.deb={}; h.negShield=itemBt(h,'negShield')+(h.tag.negShield||0);
    h.eshield=0; h.manaUsed=0; h.lastStandUsed=0;
    const hpl=itemBt(h,'hpPerLv'); if(hpl){ h.hp+=hpl*h.lv }
    h.mana=h.maxMana+itemBt(h,"firstMana")+(h.tag.firstMana||0);
    h.windUses=0; h.windBuff=0; h.free=0; h.potential=0; h.lock={}; h.airUp=0;
    h.greed=0; h.portal=null; h.bomb=0; h.minions=[]; h.first={}; h.limitUsed={};
    B.hand.push({type:"hero",hero:h});
  });
  const sc=foeScale(kind);
  foeSet(kind).forEach(([n,s],i)=>{
    const d=FOE[n];
    const lead=(kind==="elite"&&s===1)?1.35:1;
    const hp=Math.round(d.hp*sc.m*sc.hpP*lead)+sc.hpAdd;
    B.foes.push({name:n,slot:s,maxHp:hp,hp:hp,
      atk:Math.max(1,Math.round(d.atk*(1+(sc.m-1)*0.5)*sc.atkP*lead))+sc.atkAdd,
      def:Math.round(d.def*(1+(sc.m-1)*0.55)*sc.defP*(lead>1?1.15:1))+sc.defAdd,
      rng:d.rng,exp:d.exp+run.field*3+Math.floor(run.day/2),demon:d.demon||0,boss:d.boss||0,
      shield:0,air:0,alive:1,id:i,infect:0,stun:0,weak:0});
  });
  B.portals=[]; B.mins=[]; B.corpseUsed=0;
  (run.cards||[]).forEach(cd=>{
    const L=CARD_LIB[cd.n];
    if(!L) return;
    B.hand.push({type:"item",name:cd.n,d:L.d+` (보유 ${cd.c})`,stock:cd.n,use:L.use});
  });
  say(`${FIELDS[run.field].n} — ${kind==="boss"?"우두머리":kind==="elite"?"정예":"교전"} 시작`,"t1");
  say("손패의 영웅 카드를 원하는 칸으로 끌어다 놓으세요.","t2");
  rollIntents(); sel=null; view="battle"; render();
}
function say(t,c){ t=icoify(t); B.log.push({t,c}); const l=document.getElementById("log");
  if(l){ l.insertAdjacentHTML("beforeend",`<div class="${c||""}">${t}</div>`); l.scrollTop=l.scrollHeight } }
const onField=()=>run.heroes.filter(h=>h.slot>0&&h.hp>0);
const foeAt=s=>B.foes.find(f=>f.alive&&f.slot===s);
const allyAt=s=>run.heroes.find(h=>h.slot===s&&h.hp>0);
const minAt=s=>(B.mins||[]).find(m=>m.alive&&m.slot===s);
const unitAt=s=>allyAt(s)||minAt(s);
const liveMins=()=>(B.mins||[]).filter(m=>m.alive);
const allUnits=()=>onField().concat(liveMins());
function makeMin(name,slot){
  const d=SUMMONS[name];
  return {name:name,slot:slot,isMin:1,alive:1,lv:99,
    maxHp:d.hp,hp:d.hp,maxMana:d.mana,mana:d.mana,
    sk:(d.sk||[]).map(x=>Object.assign({},x)),
    taunt:d.taunt?1:0, perma:d.taunt?1:0, noMove:d.noMove?1:0,
    owner:d.owner, revive:d.revive?1:0, curseOnDeath:d.curseOnDeath||0,
    atk:0,mag:0,def:0,shield:0,evade:0,armor:0,mom:0,free:0,windBuff:0,
    lock:{},limitUsed:{},tag:{},items:[],first:{},minions:[]};
}

function defVal(f){ return Math.max(0,f.def-(f.weak||0)) }
function rollIntents(){
  const allies=allUnits();
  B.foes.forEach(f=>{
    if(!f.alive) return;
    if(!allies.length){ f.intent={t:"wait"}; return }
    if(f.forceDef){ f.forceDef=0; f.intent={t:"def",v:defVal(f)}; return }
    const inR=allies.filter(a=>dist(a.slot,f.slot)<=f.rng);
    if(!inR.length){
      if(f.slot>1&&!foeAt(f.slot-1)){ f.intent={t:"move"}; return }
      /* 더 다가갈 수 없다면 웅크리기만 하지 말고 판을 준비한다 */
      const idle=[], put=(o,w)=>{ for(let q=0;q<w;q++) idle.push(o) };
      if((f.buffs||0)<3) put({t:"buff",v:Math.max(1,Math.round(f.atk*0.35))},3);
      put({t:"curse"},2);
      const m0=B.foes.filter(x=>x.alive&&x!==f&&x.hp<x.maxHp)[0];
      if(m0) put({t:"heal",v:Math.max(2,Math.round(f.def*0.8)),to:m0.id},3);
      put({t:"def",v:defVal(f)},4);
      const t0=allies[0];
      if(t0) put({t:"deb",k:"burn",to:t0.slot,v:2},1);
      f.intent=rnd(idle); return;
    }
    /* 원거리형은 붙으면 물러선다 */
    if(f.rng>=3&&dist(inR[0].slot,f.slot)<=1&&f.slot<SLOTS&&!foeAt(f.slot+1)&&Math.random()<0.3){
      f.intent={t:"back"}; return;
    }
    const pool=[], add=(o,w)=>{ for(let q=0;q<w;q++) pool.push(o) };
    const near=inR.reduce((a,b)=>dist(a.slot,f.slot)<=dist(b.slot,f.slot)?a:b);
    const weak=inR.reduce((a,b)=>a.hp<=b.hp?a:b);
    const back=inR.reduce((a,b)=>a.slot>=b.slot?a:b);
    const any =rnd(inR);
    add({t:"atk",v:f.atk,to:near.slot,pat:"내려찍기"},8);
    add({t:"atk",v:Math.round(f.atk*1.35),to:weak.slot,pat:"약점 노리기"},4);
    add({t:"atk",v:f.atk,to:back.slot,pat:"후방 급습"},f.rng>=3?4:2);
    add({t:"atk",v:f.atk,to:any.slot,pat:"난타"},2);
    add({t:"def",v:defVal(f)},1);
    if(f.rng>=3||f.boss) add({t:"volley",v:Math.max(1,Math.round(f.atk*0.6))},2);
    if((f.def>=6||f.boss)&&(f.buffs||0)<3) add({t:"buff",v:Math.max(1,Math.round(f.atk*0.35))},1);
    const mate=B.foes.filter(x=>x.alive&&x!==f&&x.hp<x.maxHp*0.6)[0];
    if(mate) add({t:"heal",v:Math.max(2,Math.round(f.def*0.8)),to:mate.id},2);
    add({t:"curse"},1);
    /* 상태 이상은 양념 정도로 */
    add({t:"deb",k:"burn", to:near.slot,v:2},1);
    add({t:"deb",k:"bind", to:near.slot,v:2},1);
    add({t:"deb",k:"stun", to:weak.slot,v:1},1);
    if(f.rng>=3) add({t:"deb",k:"shock",to:back.slot,v:3},1);
    if(f.boss||f.rng>=3) add({t:"deb",k:"fear", to:any.slot, v:1},1);
    if(f.boss) add({t:"deb",k:"atkDn",to:near.slot,v:2},1);
    if(f.boss) add({t:"deb",k:"chill",to:any.slot,v:3},1);
    f.intent=rnd(pool);
  });
}
function intentHtml(f){
  if(!f.alive||!f.intent) return "";
  const I=f.intent;
  if(I.t==="move")  return `<span class="intent">${ic("move")} 전진</span>`;
  if(I.t==="back")  return `<span class="intent">${ic("move")} 후퇴</span>`;
  if(I.t==="def")   return `<span class="intent">${ic("def")}<b>${I.v}</b></span>`;
  if(I.t==="buff")  return `<span class="intent" title="자기 강화">${ic("atk")}<b>+${I.v}</b> 강화</span>`;
  if(I.t==="heal")  return `<span class="intent" title="동료 치료">${ic("hp")}<b>+${I.v}</b> 치료</span>`;
  if(I.t==="curse") return `<span class="intent" title="다음 턴 마나 -1">${ic("mag")} 저주</span>`;
  if(I.t==="deb")   return `<span class="intent" title="${esc(DEBUFF[I.k].d)}" style="color:${DEBUFF[I.k].c}">${esc(DEBUFF[I.k].n)} ${I.v} → ${I.to}번</span>`;
  if(I.t==="volley")return `<span class="intent" title="아군 전체">${ic("atk")}<b>${I.v}</b> 전체</span>`;
  if(I.t==="atk")   return `<span class="intent" title="${esc(I.pat||"")}">${ic("atk")}<b>${I.v}</b> → ${I.to}번</span>`;
  return `<span class="intent">대기</span>`;
}

function breakdown(h,sk,key){
  let total=sk[key]||0;
  const parts=[];
  modParts(sk,key).forEach(m=>{ total+=m.v; parts.push({n:m.n,v:m.v}) });
  if(key==="dmg"){
    if(sk.n==="진선풍도"&&h.windBuff){ total+=h.windBuff; parts.push({n:"산들바람",v:h.windBuff}) }
    const st=(sk.el==="마법")?{v:h.mag,n:"추가 마법력"}:{v:h.atk,n:"추가 공격력"};
    if(st.v){ total+=st.v; parts.push(st) }
  }
  if(key==="shield"&&h.def){ total+=h.def; parts.push({n:"추가 보호력",v:h.def}) }
  return {total:total,parts:parts};
}

/* ─ 비용 ─ */
function reachOf(h,sk){
  if(!sk) return null;
  if(h.name==="카제"&&sk.n==="진선풍도"){
    if(h.tag.noRange) return null;
    const every=(h.potential&&h.tag.potentialEvery)||h.tag.windEvery||3;
    const strong=h.tag.alwaysStrong||(h.potential&&!h.tag.potentialEvery)
                 ||(((h.windUses||0)+1)%every===0);
    return (strong?3:sk.rng)+(h.windBuff||0);
  }
  return sk.rng||null;
}
function inReach(h,sk,slot){
  const r=reachOf(h,sk);
  return r==null || dist(h.slot,slot)<=r;
}
function farthestFoe(h){
  return B.foes.filter(f=>f.alive).sort((a,b)=>dist(h.slot,b.slot)-dist(h.slot,a.slot))[0];
}
function nearestFoe(h){
  return B.foes.filter(f=>f.alive).sort((a,b)=>dist(h.slot,a.slot)-dist(h.slot,b.slot))[0];
}
function pinnedFoe(h,sk){
  if(!sk) return null;
  if(sk.farshot) return farthestFoe(h);
  if(sk.nearest) return nearestFoe(h);
  return null;
}
function validTarget(h,sk,slot){
  if(!inReach(h,sk,slot)) return false;
  const p=pinnedFoe(h,sk);
  if(p) return p.slot===slot;
  return true;
}
function payCost(h,i){
  const s=h.sk[i];
  if(h===0) return s.cost;
  if(s.costType==="mom") return s.cost+h.airUp;
  if(h.name==="카제"&&i===1&&h.free>0) return 0;
  if(h.tag.freeCut&&i===0&&h.guarded) return 0;
  return s.cost;
}
function canPay(h,i,n){
  const s=h.sk[i];
  if(s.limit&&(h.limitUsed[i]||0)+n>s.limit) return false;
  if(s.costType==="mom"){ let need=0,up=h.airUp; for(let k=0;k<n;k++){need+=s.cost+up;up++} return h.mom>=need }
  let need=0,free=h.free,guard=h.guarded;
  for(let k=0;k<n;k++){
    if(h.name==="카제"&&i===1&&free>0){ free--; continue }
    if(h.tag.freeCut&&i===0&&guard){ guard=0; continue }
    need+=s.cost;
  }
  return h.mana>=need;
}
