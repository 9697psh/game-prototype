<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>균열 — 시험판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&display=swap">
<style>
:root{
  --ink:#14110e; --panel:#1c1815; --raise:#252019; --rule:#3a3128; --rule2:#4a3e31;
  --fg:#e7dcc8; --dim:#9c8d77; --faint:#6d6252;
  --brass:#c9a227; --blood:#8e2b2b;
  --atk:#e0705a; --mag:#6aa8e0; --def:#e0c85a; --hp:#7fd39a; --move:#5fd8cf; --mana:#5f8fe0;
  --warn:#e0a86a;
  /* 자원 — 종류마다 다른 색 */
  --r-day:#c9a227; --r-time:#8fa2c9; --r-night:#6a5f9c;
  --r-act:#5fd8cf; --r-taint:#a06ae0; --r-gold:#e0c85a; --r-stone:#9c8d77;
  /* 등급 */
  --g-low:#9c8d77; --g-mid:#e0a86a; --g-high:#e0705a; --g-rare:#a06ae0;
  /* 위험 단계 */
  --ok:#7fd39a; --caution:#e0a86a; --danger:#c9503f;
  /* 간격 · 굴림 */
  --sp1:4px; --sp2:8px; --sp3:14px; --sp4:22px;
  --rd:5px; --rd2:9px; --serif:"Noto Serif KR",serif;
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--sans);font-size:14px;
  line-height:1.6;-webkit-user-select:none;user-select:none}
button{font-family:inherit;font-size:inherit;color:var(--fg);background:var(--raise);
  border:1px solid var(--rule);border-radius:3px;padding:7px 13px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--brass);color:var(--brass)}
button:disabled{opacity:.35;cursor:default}
button.go{background:var(--brass);color:#17130f;border-color:var(--brass);font-weight:700}
button.go:hover{color:#17130f;filter:brightness(1.1)}
.ic{width:1.05em;height:1.05em;vertical-align:-.18em;fill:currentColor}
.grow{flex:1}

header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:9px 16px;
  background:var(--panel);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:30}
h1{font-family:var(--serif);font-size:15px;letter-spacing:.16em;color:var(--brass);margin:0;white-space:nowrap}
.stat{display:inline-flex;align-items:center;gap:5px;font-size:13px}
.wrap{max-width:1240px;margin:0 auto;padding:16px}

/* ── 전장 ── */
.field{display:flex;justify-content:center;align-items:stretch;gap:10px;
  overflow-x:auto;padding-bottom:4px}
.side{display:flex;gap:6px;flex:0 0 auto}
/* 아군·적군 모두 왼쪽에서부터 1~5 */
.mid{width:2px;background:var(--rule);align-self:stretch;min-height:230px;flex:0 0 auto}
.slot{width:104px;flex:0 0 104px;min-width:0;overflow:visible;border:1px solid var(--rule);border-radius:var(--rd2);
  background:linear-gradient(180deg,var(--raise),var(--panel) 40%);
  padding:7px;display:flex;flex-direction:column;gap:5px;position:relative;min-height:176px}
.slot.empty{background:transparent;border-style:dashed;border-color:rgba(74,62,49,.5);opacity:.5;
  min-height:96px;align-self:center}
.slot.empty .no{opacity:.5}
.slot.empty.pick{opacity:1;border-color:var(--brass);background:rgba(201,162,39,.07)}
.slot.pick{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.slot.drop{border-color:var(--hp);box-shadow:0 0 0 1px var(--hp) inset;opacity:1}
.slot.far{opacity:.3;filter:grayscale(.7);cursor:default}
.slot.far .no{color:var(--faint)}
.reach{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:9.5px;
  color:var(--faint);pointer-events:none}
.slot.pick .reach{color:var(--brass)}
.slot .no{position:absolute;top:-9px;left:7px;background:var(--ink);border:1px solid var(--rule);
  border-radius:3px;font-size:10px;padding:0 6px;color:var(--faint)}
.slot.pick .no{color:var(--brass);border-color:var(--brass)}
.res{display:flex;gap:4px;align-items:center;justify-content:center;min-height:13px;flex-wrap:wrap}
.pips{display:inline-flex;gap:3px;align-items:center}
.pips i{width:7px;height:7px;border-radius:50%;border:1px solid var(--rule2);display:inline-block}
.pips i.on{background:var(--mana);border-color:#8fb4ef;box-shadow:0 0 5px rgba(95,143,224,.75)}
.res .rr{font-size:10px;color:var(--move);display:inline-flex;align-items:center;gap:2px}
.res .rr.es{color:var(--def)}
.res .rr.mn2{color:var(--mana)}
.res .rr.am{color:#e0a86a} .res .rr.sc{color:#9ad06a} .res .rr.dk{color:#a06ae0}
.res .rr.tn{color:#e08ac0} .res .rr.so{color:#8fb4ef}
.art{height:62px;display:flex;align-items:flex-end;justify-content:center;position:relative}
.art svg{filter:drop-shadow(0 2px 0 rgba(0,0,0,.55))}
.slot .art::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:52px;height:7px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(2px);z-index:-1}
.art svg{height:56px;width:auto}
.nm{font-size:12.5px;font-weight:700;line-height:1.25;word-break:keep-all;text-align:center;
  text-shadow:0 1px 0 rgba(0,0,0,.6)}
.bar{height:9px;background:#0c0a09;border:1px solid rgba(0,0,0,.6);border-radius:4px;
  overflow:hidden;position:relative;box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.slot.foe .bar > i{background:linear-gradient(180deg,#d4685a,#a8402f)}
.slot.foe{background:linear-gradient(180deg,#2a1a19,#170f0e 46%);
  border-color:#4a2e2b}
.slot.foe::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(90% 50% at 50% 105%,rgba(142,43,43,.28),transparent 70%)}
/* 격 표시 띠 */
.intent.purge{color:#e0c85a;border-color:#7a6742;background:rgba(224,200,90,.1);font-weight:800}
.slot .tier{display:flex;align-items:center;justify-content:center;gap:3px;
  font-size:9.5px;font-weight:800;letter-spacing:.1em;margin:-2px 0 2px;
  text-transform:none;text-shadow:0 1px 0 rgba(0,0,0,.7)}
.slot .tier svg{width:11px;height:11px}
/* 일반 */
.slot.t-norm{border-color:#4a2e2b}
/* 정예 — 황금 테두리와 모서리 장식 */
.slot.t-elite{border-color:#c98a3a;box-shadow:0 0 0 1px rgba(201,138,58,.35),0 0 16px -6px #e0a86a}
.slot.t-elite .tier{color:#e0a86a}
.slot.t-elite .nm{color:#f0cf9a}
.slot.t-elite::after{content:"";position:absolute;inset:2px;border-radius:6px;pointer-events:none;
  border:1px solid rgba(224,168,106,.28)}
/* 우두머리 — 핏빛 테두리, 맥동, 뿔 장식 */
.slot.t-boss{border-color:#a83b32;
  box-shadow:0 0 0 1px rgba(168,59,50,.5),0 0 26px -6px #c9503f;
  animation:bossAura 2.6s ease-in-out infinite}
@keyframes bossAura{0%,100%{box-shadow:0 0 0 1px rgba(168,59,50,.5),0 0 22px -8px #c9503f}
  50%{box-shadow:0 0 0 1px rgba(200,80,66,.75),0 0 34px -4px #c9503f}}
.slot.t-boss .tier{color:#e0705a}
.slot.t-boss .nm{color:#f0b7a8;font-size:13.5px}
.slot.t-boss::after{content:"";position:absolute;inset:2px;border-radius:6px;pointer-events:none;
  border:1px solid rgba(224,112,90,.3)}
.slot.t-boss .bar{height:11px}
/* 밤의 습격 */
.slot.t-ambush{border-color:#6a5f9c;box-shadow:0 0 0 1px rgba(106,95,156,.35)}
.slot.t-ambush .tier{color:#9c8fd0}
.slot.foe .nm{color:#e8c8bd}
.synbar{margin-top:10px}
.turnrow{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 4px}
.turnrow #turnend{font-size:15px;padding:10px 30px;letter-spacing:.02em;
  box-shadow:0 4px 0 rgba(0,0,0,.45),0 0 18px -6px var(--brass)}
.turnrow #turnend i{font-style:normal;font-size:11.5px;opacity:.6;margin-left:5px}
.turnrow #turnend:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.45)}
.syn{font-size:11.5px;padding:3px 10px}
.bar::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 11px,rgba(0,0,0,.45) 11px 12px)}
.bar > i{display:block;height:100%;background:var(--hp);transition:width .18s;position:relative;z-index:2}
/* 잔상 — 줄어든 몫이 뒤늦게 따라 내려간다 */
.bar > em.gh{position:absolute;left:0;top:0;height:100%;display:block;z-index:1;
  background:linear-gradient(180deg,#ffe9bd,#ff7a52);
  box-shadow:0 0 8px rgba(255,140,90,.7);
  transition:width .72s cubic-bezier(.22,.72,.24,1) .16s;pointer-events:none}
.bar.healed > em.gh{background:linear-gradient(180deg,#dcffe8,#4fd08a);
  box-shadow:0 0 8px rgba(90,220,150,.7)}
/* 깜박임 */
.bar.hurt{animation:hpHurt .62s ease-out}
@keyframes hpHurt{
  0%  {filter:brightness(2.6) saturate(.5);box-shadow:0 0 0 2px rgba(255,130,95,.95),0 0 16px rgba(224,80,60,.9)}
  16% {filter:brightness(1);      box-shadow:0 0 0 1px rgba(255,130,95,.3)}
  34% {filter:brightness(2.3) saturate(.6);box-shadow:0 0 0 2px rgba(255,130,95,.8),0 0 13px rgba(224,80,60,.7)}
  52% {filter:brightness(1);      box-shadow:0 0 0 1px rgba(255,130,95,.2)}
  70% {filter:brightness(1.7);    box-shadow:0 0 0 1px rgba(255,130,95,.5)}
  100%{filter:brightness(1);      box-shadow:0 1px 0 rgba(255,255,255,.04) inset}}
.bar.healed{animation:hpHeal .62s ease-out}
@keyframes hpHeal{
  0%  {filter:brightness(2.3) saturate(.6);box-shadow:0 0 0 2px rgba(127,211,154,.95),0 0 16px rgba(80,200,140,.85)}
  20% {filter:brightness(1);      box-shadow:0 0 0 1px rgba(127,211,154,.3)}
  42% {filter:brightness(2);      box-shadow:0 0 0 2px rgba(127,211,154,.75),0 0 12px rgba(80,200,140,.6)}
  66% {filter:brightness(1);      box-shadow:0 0 0 1px rgba(127,211,154,.2)}
  100%{filter:brightness(1);      box-shadow:0 1px 0 rgba(255,255,255,.04) inset}}
@media (prefers-reduced-motion: reduce){
  .bar.hurt,.bar.healed{animation:none}
  .bar > em.gh{transition:none}}
.bar.mn > i{background:var(--mana)}
.bar > u{position:absolute;top:0;right:0;height:100%;background:var(--def);opacity:.9;z-index:3;
  border-left:1px solid var(--panel);transition:width .18s,right .18s}
.bar > u.es{background:#e07b28;opacity:.95;box-shadow:0 0 6px rgba(224,123,40,.6)}
.synbar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.syn{font-size:11px;padding:3px 9px;border-radius:11px;border:1px solid var(--line);
  color:var(--faint);cursor:help}
.syn.on{color:#0f0d0a;background:var(--brass);border-color:var(--brass);font-weight:700}
.syn b{font-weight:inherit}
.hits{color:#e0705a;font-weight:800;font-size:10.5px;margin-left:1px}
.shd{color:var(--def);font-weight:700;white-space:nowrap}
.esh{color:#e07b28;font-weight:700;white-space:nowrap}
.mini{font-size:11px;color:var(--dim);display:flex;flex-wrap:wrap;gap:4px;align-items:center;
  justify-content:center;font-variant-numeric:tabular-nums}
.chip{font-size:10px;border:1px solid var(--rule2);border-radius:2px;padding:0 4px;color:var(--dim)}
.chip.on{color:var(--brass);border-color:#5c4a1f}
.chip.deb{color:#e08a8a;border-color:#5a3030}
.chip.itm2{color:#9ecbf5;border-color:#33506b}
.ipx{width:100%;height:100%;image-rendering:pixelated;display:block}
.cimg{width:42px;height:42px;margin:0 auto 5px}
.cimg .ipx{width:42px;height:42px}
.gear{display:flex;gap:3px;justify-content:center;margin:0 0 4px}
.gs{--fr:#4a3e31;position:relative;width:26px;height:26px;flex:0 0 26px;
  border:2px solid var(--fr);border-radius:4px;background:#0f0d0b;
  box-shadow:0 0 0 1px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;
  overflow:hidden;opacity:.42}
.gs::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(150deg,rgba(255,255,255,.16),transparent 46%)}
.gs.on{opacity:1;cursor:help;
  background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--fr) 34%,#12100d),#0f0d0b 78%);
  box-shadow:0 0 0 1px rgba(0,0,0,.7),0 0 8px -2px var(--fr)}
.gs .ipx{width:20px;height:20px}
.intentbar{display:flex;justify-content:center;min-height:20px;margin:-3px 0 3px}
.intent{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;
  border:1px solid var(--rule2);
  border-radius:3px;padding:0 5px;background:var(--raise)}

.skwrap{margin-top:12px;background:var(--panel);border:1px solid var(--brass);border-radius:6px;padding:10px}
.skhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.skhead b{font-family:var(--serif);font-size:14px;color:var(--brass)}
.skills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sk{position:relative;display:flex;gap:8px;align-items:flex-start;min-width:0;
  padding:9px 10px 9px 12px;border-radius:var(--rd);
  border:1px solid var(--rule);background:linear-gradient(180deg,var(--raise),var(--panel));
  cursor:pointer;transition:transform .11s,border-color .11s}
.sk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--rule2);border-radius:var(--rd) 0 0 var(--rd)}
.sk[data-el="공격"]::before{background:var(--atk)}
.sk[data-el="마법"]::before{background:var(--mag)}
.sk[data-el="보호"]::before{background:var(--def)}
.sk[data-el="이동"]::before{background:var(--move)}
.sk[data-el="집중"]::before{background:var(--brass)}
.sk[data-el="지속"]::before{background:var(--dim)}
.sk:hover{border-color:var(--brass);transform:translateY(-2px)}
.sk.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.sk.off{opacity:.4;cursor:default}
.sk.off:hover{border-color:var(--rule)}
.sk .k{font-size:11px;color:#17130f;background:var(--rule2);border-radius:3px;padding:1px 6px;
  font-weight:800;flex:none;margin-top:2px;font-variant-numeric:tabular-nums}
.sk.on .k{background:var(--brass)}
.sk .t{flex:1;min-width:0}
.sk .t b{font-size:12.5px}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.opt .ogo{margin-top:6px;align-self:flex-start}
.opt{background:#221d16;border:1px solid var(--rule2);border-radius:5px;padding:8px 10px;cursor:pointer}
.opt:hover{border-color:var(--brass);background:var(--raise)}
.opt.on{border-color:var(--brass)}
.opt b{font-size:12px}
.opt span{font-size:10px;color:var(--faint);margin-left:5px}
.opt small{display:block;font-size:10.5px;color:var(--dim);line-height:1.45;margin-top:3px;word-break:keep-all}
.chip.pk{color:#a8f0ea;border-color:#2f5c58}
.sk .xn{margin-left:5px;background:var(--brass);color:#17130f;border-radius:3px;padding:0 6px;font-size:11.5px;font-weight:700}
.sk .t .val{display:block;font-size:11.5px;color:var(--fg);margin-top:3px;line-height:1.5}
.sk .t .val .big{color:var(--brass);font-size:13px}
.sk .t .brk{color:var(--faint);font-size:10px}
.fullx{margin-top:6px;padding:6px 8px;background:#191612;border:1px solid var(--rule);
  border-left:2px solid var(--brass);border-radius:4px;font-size:10.5px;color:var(--dim);
  line-height:1.6;white-space:pre-wrap;word-break:keep-all}
.kw{font-weight:600}
.fullx u{text-decoration:underline;text-underline-offset:2px}
.fullx i{font-style:italic}
.fullx span.kw{display:inline;font-size:inherit;letter-spacing:0;margin:0}
.fullx span{display:block;font-size:9px;letter-spacing:.14em;color:var(--faint);margin-bottom:3px}
button.dtl{padding:3px 10px;font-size:11.5px}
.sk .t small{display:block;color:var(--dim);font-size:10.5px;line-height:1.45;margin-top:4px;word-break:keep-all;overflow-wrap:anywhere}
.counts{display:flex;gap:4px;flex-wrap:wrap;padding-top:9px;margin-top:9px;
  border-top:1px solid var(--rule);align-items:center}
.counts button{padding:2px 10px;font-size:12px}
.prog{margin-top:4px}
.prog .pl{font-size:9.5px;color:var(--faint);display:flex;justify-content:space-between;gap:4px;white-space:nowrap;overflow:hidden}
.prog .pl span:first-child{overflow:hidden;text-overflow:ellipsis;min-width:0}
.prog .pl span:last-child{flex:0 0 auto}
.prog .pb{height:4px;background:#0f0d0b;border-radius:2px;overflow:hidden;margin-top:1px}
.prog .pb>i{display:block;height:100%;background:var(--brass);transition:width .2s}
.prog.done .pl{color:var(--hp)}
.prog.done .pb>i{background:var(--hp)}
.passes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:9px}
.pass{background:#1a1713;border:1px solid var(--rule);border-radius:4px;padding:8px 10px}
.pass .pn{font-size:11.5px;font-weight:700;color:var(--brass)}
.pass .pd{font-size:10.5px;color:var(--dim);line-height:1.5;margin-top:3px;word-break:keep-all}
.pass .pd b{color:var(--fg);font-size:12px}
.pass .pd span.brk{color:var(--faint);font-size:10px}
@media(max-width:760px){ .passes{grid-template-columns:1fr} }
.stats{font-size:10.5px;color:var(--dim);display:flex;flex-wrap:wrap;gap:5px;justify-content:center}

/* ── 손패 ── */
.hand{margin-top:14px;display:flex;gap:9px;flex-wrap:wrap;align-items:flex-start;min-height:10px}
.card{width:120px;border:1px solid var(--rule2);border-radius:var(--rd2);
  background:linear-gradient(180deg,var(--raise),var(--panel) 60%);
  box-shadow:0 4px 12px rgba(0,0,0,.4);transition:transform .12s,border-color .12s;
  padding:8px;cursor:grab;touch-action:none;position:relative}
.card:hover{border-color:var(--brass)}
.card.hero{border-color:#3d7a72}
.card .ct{font-size:11.5px;font-weight:700;text-align:center;margin-bottom:4px}
.card .cd{font-size:10.5px;color:var(--faint);line-height:1.4}
.card .art{height:44px}
.card .art svg{height:44px}
.ghost{position:fixed;z-index:999;pointer-events:none;opacity:.9;transform:translate(-50%,-50%)}

.prompt{margin-top:14px;background:var(--panel);border:1px solid var(--rule);border-radius:5px;
  padding:9px 13px;font-size:13px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.step{font-size:11px;border:1px solid var(--rule2);border-radius:99px;padding:1px 9px;color:var(--faint)}
.step.on{color:#17130f;background:var(--brass);border-color:var(--brass);font-weight:700}
.hint{color:var(--dim);font-size:12.5px}
.log{margin-top:12px;background:var(--panel);border:1px solid var(--rule);border-radius:5px;
  padding:9px 13px;height:168px;overflow:auto;font-size:12.5px;line-height:1.65}
.log div{border-bottom:1px solid #241f19;padding:1px 0}
.log .t1{color:var(--brass)} .log .t2{color:var(--dim)} .log .t3{color:var(--warn)}

/* ── 화면 ── */
.center{max-width:900px;margin:40px auto;text-align:center}
.title{font-family:var(--serif);font-size:30px;color:var(--brass);letter-spacing:.2em}
.sub{color:var(--dim);margin-top:6px}
.picks{display:flex;gap:14px;justify-content:center;margin-top:28px;flex-wrap:wrap}
.pick{width:230px;background:var(--panel);border:1px solid var(--rule);border-radius:7px;
  padding:14px;cursor:pointer;text-align:left}
.pick:hover{border-color:var(--brass)}
.pick .art{height:96px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 60%,rgba(201,162,39,.1),transparent 68%);border-radius:var(--rd)}

  const esc2=x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const parts=["_[^_]+_","\\*[^*]+\\*"].concat(KW_NAMES.map(esc2));
  KW_RE=new RegExp(parts.join("|"),"g");

/* 한 번만 훑어서 강조·아이콘·키워드를 모두 처리한다 */
function icoify(html){
  return String(html).replace(kwRegex(),m=>{
    if(m.charAt(0)==="_"&&m.length>2) return '<u>'+m.slice(1,-1)+'</u>';
    if(m.charAt(0)==="*"&&m.length>2) return '<i>'+m.slice(1,-1)+'</i>';
    const st={"공격력":"atk","마법력":"mag","보호력":"def"}[m];

    return '<b class="kw'+(d?' kwq':'')+'" style="color:'+c+'"'
      +(d?' data-kw="'+esc(m)+'"':'')+'>'+m+'</b>';
  });
}

    const a=ctx(); if(!a) return;

    g.gain.setValueAtTime(0.0001,t);

      if(o.f2) src.frequency.exponentialRampToValueAtTime(o.f2,t+dur);

function ctrOf(side,slot){
  const box=document.getElementById(side==="foe"?"foeSide":"mySide");
  if(!box) return null;
  const e=box.querySelector('.slot[data-slot="'+slot+'"]');
  if(!e) return null;
  const r=e.getBoundingClientRect();
  return {x:r.left+r.width/2, y:r.top+r.height/2, e:e};
}
function spawn(html){
  const l=document.getElementById("fx"); if(!l) return null;
  const nd=el(html); l.appendChild(nd); setTimeout(()=>nd.remove(),1300); return nd;
}
function at(nd,p){ if(nd){ nd.style.left=p.x+"px"; nd.style.top=p.y+"px" } }

function sparks(p,color,cnt){
  const n=Math.round(cnt*1.9);
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, d=26+Math.random()*66;
    const big=Math.random()<0.3;
    const sp=spawn('<div class="spark'+(big?" big":"")+'" style="background:'+color+'"></div>');
    if(!sp) continue;
    at(sp,p);
    sp.style.setProperty("--dx",(Math.cos(a)*d)+"px");
    sp.style.setProperty("--dy",(Math.sin(a)*d)+"px");
    sp.style.animationDelay=(Math.random()*90)+"ms";
  }
  /* 바닥으로 흩어지는 잔해 */
  for(let i=0;i<Math.round(cnt*0.6);i++){
    const d=spawn('<div class="grit" style="background:'+color+'"></div>');
    if(!d) continue; at(d,p);

    d.style.setProperty("--dy",(28+Math.random()*44)+"px");
    d.style.animationDelay=(Math.random()*120)+"ms";
  }
}

function playFX(o){

  if(o.s) SFX.play(o.s);
  const p=ctrOf(o.side,o.slot); if(!p) return;
  if(o.sweep){ const q=ctrOf(o.sweep.side,o.sweep.slot); if(q) sweepFX(q,p) }
  if(o.streak){ const q=ctrOf(o.streak.side,o.streak.slot); if(q) streakFX(q,p) }
  if(o.quake) quakeFX(p);
  if(o.leap){ p.e.classList.remove("leap"); void p.e.offsetWidth; p.e.classList.add("leap") }
  if(o.hit){ p.e.classList.remove("shake","flashd"); void p.e.offsetWidth; p.e.classList.add("shake","flashd"); }
  if(o.glow){ p.e.classList.remove("flashg"); void p.e.offsetWidth; p.e.classList.add("flashg"); }
  if(o.art&&ART[o.art]){
    at(spawn('<div class="'+(o.art==="wind"||o.art==="boom"?"swirl":"slash")+'">'+ART[o.art]+'</div>'),p);
    sparks(p, o.art==="wind"?"#a8f0ea":(o.art==="mag"?"#9ecbf5":"#ffd9a0"), 7);
  }

    at(spawn('<div class="ring" style="border-color:'+o.ring+'"></div>'),p);

    const d=spawn('<div class="rainbit" style="background:'+color+'"></div>');
    if(!d) return;
    d.style.left=(Math.random()*w)+"px"; d.style.top="-20px";
    d.style.setProperty("--fall",(innerHeight*0.75+Math.random()*120)+"px");
  }, i*34);
}
/* 대상 칸을 크게 확대했다 되돌린다 */
function punchIn(side,slot){
  const p=ctrOf(side,slot); if(!p||!p.e) return;
  p.e.classList.remove("punch"); void p.e.offsetWidth; p.e.classList.add("punch");
}
/* ═══════════ 체력바 연출 ═══════════
   체력이 달라졌으면 바가 깜박이면서 천천히 줄거나 찬다.
   잔상(em.gh)이 한 박자 늦게 따라와 얻어맞은 몫을 보여 준다. */
let HKSEQ=0, HPMEM={};
function hpKey(u){ if(!u) return ""; if(!u._hk) u._hk="U"+(++HKSEQ); return u._hk }
function hpAnim(){
  document.querySelectorAll(".bar[data-hpk]").forEach(bar=>{
    const k=bar.dataset.hpk, now=parseFloat(bar.dataset.hpv)||0;
    const fill=bar.querySelector("i"), gh=bar.querySelector("em.gh");
    const prev=HPMEM[k];
    HPMEM[k]=now;
    if(!fill||!gh) return;
    if(prev==null||Math.abs(prev-now)<0.05){ gh.style.width=now+"%"; return }
    const hurt=(now<prev);
    /* 시작점에 세워 둔다 */
    gh.style.transition="none";   gh.style.width=prev+"%";
    fill.style.transition="none"; fill.style.width=prev+"%";
    bar.classList.remove("hurt","healed");
    void bar.offsetWidth;                       /* 애니메이션을 다시 물린다 */
    bar.classList.add(hurt?"hurt":"healed");
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      fill.style.transition="width .46s cubic-bezier(.24,.74,.28,1)";
      fill.style.width=now+"%";
      gh.style.transition="";                   /* CSS 쪽 느린 전환으로 되돌린다 */
      gh.style.width=now+"%";
    }));
    setTimeout(()=>{ bar.classList.remove("hurt","healed") },660);
  });
}
function flushFX(){
  let t=0;
  while(FXQ.length){
    const o=FXQ.shift();
    setTimeout(()=>playFX(o),t);
    t+=(o.gap==null?110:o.gap);
  }
}
function veil(color){
  const v=el('<div class="veil" style="background:'+color+'"></div>');
  document.body.appendChild(v); setTimeout(()=>v.remove(),620);
}

function shade(hex,f){
  const n=parseInt(String(hex).slice(1),16);
  const r=Math.max(0,Math.min(255,Math.round(((n>>16)&255)*f)));
  const g=Math.max(0,Math.min(255,Math.round(((n>>8)&255)*f)));
  const b=Math.max(0,Math.min(255,Math.round((n&255)*f)));
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

function phantomFigure(of){
  const key="__ph_"+of;

  const L=LOOK[of]||LOOK["작은 죄수"];
  const grid=PX_BODY.wisp.map(r=>r.split(""));
  const P={".":null,"O":"#0a0809","S":shade(L.skin,0.72),"s":shade(L.skin,0.5),
           "C":shade(L.cloth,1.05),"c":shade(L.cloth,0.72),"d":shade(L.cloth,0.55),
           "L":shade(L.cloth,1.35),"D":L.dark,"N":"#c5bdb2",
           "M":"#a9a29a","m":"#6e6862","A":"#9ecbf5","E":"#12101a",
           "H":shade(L.dark,0.9),"h":shade(L.dark,0.62),"W":"#d6cec1","w":"#8a837a"};
  let out='<svg class="pxs ph" viewBox="0 0 32 32" shape-rendering="crispEdges">';
  for(let y=0;y<grid.length;y++){
    let x=0;
    while(x<PXW){
      const ch=grid[y][x];
      if(!ch||ch==="."||!P[ch]){ x++; continue }
      let w=1; while(x+w<PXW&&grid[y][x+w]===ch) w++;
      out+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="1" fill="'+P[ch]+'"/>';
      x+=w;
    }
  }
  out+="</svg>";
  PXCACHE[key]=out;
  return out;
}

function pxFigure(name){
  if(PXCACHE[name]) return PXCACHE[name];

  const K=PX_KIT[name]||{b:(L.build==="huge"?"hulk":L.build==="small"?"runt":L.build==="wide"?"armor":"cloak"),
                         h:L.horn?"horn":"none", a:PX_ARM[L.arm]?L.arm:"none"};
  const grid=(PX_BODY[K.b]||PX_BODY.cloak).map(r=>r.split(""));
  const put=list=>(list||[]).forEach(([y,x,c])=>{ if(grid[y]&&x>=0&&x<PXW) grid[y][x]=c });
  put(PX_HEAD[K.h]); put(PX_ARM[K.a]);
  const P={

    P["A"]=shade(L.acc||"#8e2b2b",0.9);
    if(isBoss){ P["E"]="#ff3b26"; P["O"]="#1c0507"; P["A"]=shade(L.acc||"#c9a227",1.05) }
  }
  let out='<svg class="pxs'+(isFoe?" foe":" hero")+'" viewBox="0 0 32 32" shape-rendering="crispEdges">';
  for(let y=0;y<grid.length;y++){
    let x=0;

      x+=w;
    }
  }
  out+="</svg>";
  PXCACHE[name]=out;
  return out;
}

function synHtml(){
  const A=synActive().filter(x=>x.on||x.next);
  if(!A.length) return `<div class="hint"></div>`;
  A.sort((a,b)=>(b.on?1:0)-(a.on?1:0));
  return `<div class="synbar">${A.map(x=>`<span class="syn ${x.on?"on":""}"
    title="${esc(x.k+" · "+(x.on?x.on.d:"아직 켜지지 않음")+(x.next?`
다음 ${x.next.c}명: ${x.next.d}`:""))}">
    <b>${esc(x.n)}</b> ${x.c}${x.next?`/${x.next.c}`:""}</span>`).join("")}</div>`;
}

function synCount(t){ return run?run.heroes.filter(h=>!h.down&&hasTag(h,t)).length:0 }
/* 지금 켜져 있는 조합 — [{n,k,c,need,d}] */
function synActive(){
  const out=[];
  SYNERGY.forEach(sy=>{
    const c=synCount(sy.n); if(!c) return;
    let best=null;
    sy.t.forEach(x=>{ if(c>=x.c&&(!best||x.c>best.c)) best=x });
    out.push({n:sy.n,k:sy.k,c:c,on:best,next:sy.t.find(x=>x.c>c)||null});
  });
  return out;
}
/* 전투 시작에 능력치 조합을 걸어 준다 (전투 단위, clearTmp 로 함께 풀림) */
function applySynergy(){
  const A=synActive(); run.synOn=A;
  const has=(n,c)=>A.some(x=>x.n===n&&x.c>=c);
  const each=(t,fn)=>run.heroes.forEach(h=>{ if(!h.down&&hasTag(h,t)) fn(h) });
  if(has("전투가",2)) each("전투가",h=>bumpTmp(h,"atk",2));
  if(has("마법사",2)) each("마법사",h=>bumpTmp(h,"mag",2));
  if(has("수호자",3)) each("수호자",h=>bumpTmp(h,"def",5));
  else if(has("수호자",2)) each("수호자",h=>bumpTmp(h,"def",2));
  if(has("영광 숭배자",2)) each("영광 숭배자",h=>{ h.gloryGuard=1 });
  if(has("피의 투기장",2)) each("피의 투기장",h=>{ h.arenaHeal=3 });
  const sup=synCount("지원가");
  run.synSupport=sup>=3?8:sup>=2?4:sup>=1?2:0;
}
/* 방랑자는 전장 상황을 보므로 배치될 때마다 다시 잰다 */
function wanderCheck(){
  const on=onField();
  run.heroes.forEach(h=>{
    if(!hasTag(h,"방랑자")) return;
    const solo=(run.field>=1)?5:0;      /* 홀로 서는 보너스는 2구역부터 */
    const want=(on.length>=3&&on.every(a=>hasTag(a,"방랑자")))?10
              :(on.length===1&&on[0]===h)?solo:0;
    const cur=h.wanderBonus||0;
    if(want===cur) return;
    const d=want-cur;
    bumpTmp(h,"atk",d); bumpTmp(h,"mag",d); bumpTmp(h,"def",d);
    h.wanderBonus=want;
    if(want>cur) say(`방랑자 — ${h.name}의 능력치가 ${want} 올랐습니다.`,"t1");
  });
}

function addMod(h,skName,key,v,label){
  const put=t=>{
    if(!t||t.n!==skName) return;
    t.mods=t.mods||[];
    const e=t.mods.find(m=>m.k===key&&m.n===label);
    if(e) e.v+=v; else t.mods.push({k:key,v:v,n:label});
  };
  h.sk.forEach(k=>{ put(k); put(k.alt) });
}
function mod(sk,key){ return (sk.mods||[]).filter(m=>m.k===key).reduce((a,m)=>a+m.v,0) }
function modParts(sk,key){ return (sk.mods||[]).filter(m=>m.k===key) }
function bump(h,name,key,v,label){ addMod(h,name,key,v,label||"강화") }

   설명 순서 : 마나 / 최대 체력 / 공격력 / 마법력 / 보호력 /
              내 턴 종료시 보호막 / 영웅 배치 시 부정 보호막 / 내 턴에 이동시 추진력 */
const ITEM_ORDER=["maxMana","firstMana","maxHp","atk","mag","def","endShield","negShield","moveMom"];
const ITEM_LINE={
 maxMana:v=>`최대 마나 +${v}`, firstMana:v=>`첫 턴의 최대 마나 +${v}`,
 maxHp:v=>`최대 체력 +${v}`, atk:v=>`공격력 +${v}`, mag:v=>`마법력 +${v}`, def:v=>`보호력 +${v}`,
 endShield:v=>`내 턴 종료시 보호막 +${v}`, negShield:v=>`영웅 배치 시 부정 보호막 +${v}`,
 moveMom:v=>`내 턴에 이동시 추진력 +${v}`
};
function itemDesc(it){
  const out=[];
  ITEM_ORDER.forEach(k=>{
    const v=(it.st&&it.st[k])||(it.bt&&it.bt[k])||0;
    if(v) out.push(ITEM_LINE[k](v));
  });
  if(it.x) out.push(it.x);
  return out.join("\n");
}
const IT=(n,g,rc,cost,st,bt,x)=>{
  const o={n:n,g:g,cost:cost,st:st||{},bt:bt||{},x:x||""};
  if(rc) o.rc=rc;
  o.d=itemDesc(o);
  return o;
};

function recipeLines(it){
  const L=[];
  if(it.rc) L.push("재료 : "+it.rc.join(" + ")+" · 제련석 "+it.cost);
  const into=ITEMS.filter(x=>x.rc&&x.rc.indexOf(it.n)>=0);
  if(into.length) L.push("쓰임 : "+into.map(x=>x.n).join(", "));
  if(!L.length) L.push("제련과는 관계없는 아이템입니다.");
  return L;
}
function recipeHtml(it){
  return recipeLines(it).map(t=>`<p class="rcp">${rich(t)}</p>`).join("");
}
function itemTip(it){ return it.n+" — "+it.d+"\n"+recipeLines(it).join("\n") }
function findRecipe(a,b){
  const key=[a,b].sort().join("|");
  return ITEMS.find(it=>it.rc&&it.rc.slice().sort().join("|")===key)||null;
}
const ITEM_MAX=3;
function equip(h,it){
  SFX.play("equip");
  h.items.push(it);
  if(it.st) for(const k in it.st){ h[k]+=it.st[k]; if(k==="maxHp") h.hp+=it.st[k] }
}
function unequip(h,idx,force){
  if(!force&&h.items[idx]&&h.items[idx].bind){ return null }
  const it=h.items.splice(idx,1)[0];
  if(it&&it.st) for(const k in it.st){ h[k]-=it.st[k]; if(k==="maxHp") h.hp=Math.min(h.hp,h.maxHp) }
  return it;
}
function itemBt(h,key){ return (h.items||[]).reduce((a,i)=>a+((i.bt&&i.bt[key])||0),0) }
/* 회복 — 전투 중 회복이 막힌 대상은 여기서 걸러진다 */
function healUp(u,v,quiet){
  if(!u||v<=0) return 0;
  if(view==="battle"&&itemBt(u,"noHeal")){
    if(!quiet&&typeof say==="function"&&B&&!B.over){
      const it=(u.items||[]).find(x=>x.bt&&x.bt.noHeal);
      say(`${it?it.n:"저주"} — ${u.name}${jo(u.name,"eun")} 전투 중 회복할 수 없습니다.`,"t3");
    }
    return 0;
  }
  const got=Math.min(v,u.maxHp-u.hp);
  u.hp+=got;
  return got;
}
/* 강제 착용 — 칸이 없으면 가방으로 가지 않고 기존 것을 밀어낸다 */
function forceEquip(h,it){
  if(!h) return null;
  h.items=h.items||[];
  if(h.items.length>=ITEM_MAX){
    let idx=-1;
    for(let i=h.items.length-1;i>=0;i--) if(!h.items[i].bind){ idx=i; break }
    if(idx<0) return null;              /* 전부 저주받은 물건이면 채우지 않는다 */
    const out=unequip(h,idx);
    (run.bag=run.bag||[]).push(out);
    equip(h,it);
    return out;
  }
  equip(h,it);
  return null;
}

function itemFace(it){
  if(!it) return {g:"jade",c:"#9c8d77"};
  if(it.g==="특수"||it.g==="전설") return {g:"neck",c:"#c58fb0"};
  /* 희귀는 두 번째 재료를 얼굴로 — 무엇이 되었는지가 더 중요하다 */
  const src=(it.rc&&it.rc.length)?(it.rc[1]||it.rc[0]):it.n;
  for(const [key,g,c] of IT_ROOT) if(String(src).indexOf(key)>=0) return {g:g,c:c};
  for(const [key,g,c] of IT_ROOT) if(String(it.n).indexOf(key)>=0) return {g:g,c:c};
  return {g:"jade",c:"#9c8d77"};
}

/* ═══════════ 픽셀 시계 ═══════════ */
function clockFace(px){
  const N=24, C=11.5;
  const g=[]; for(let y=0;y<N;y++) g.push(new Array(N).fill("."));
  const put=(x,y,ch)=>{ x=Math.round(x); y=Math.round(y);
    if(x>=0&&x<N&&y>=0&&y<N) g[y][x]=ch };
  /* 테두리 — 두 겹 원 */
  for(let a=0;a<360;a+=2){
    const r=a*Math.PI/180;
    put(C+Math.cos(r)*10.6, C+Math.sin(r)*10.6, "O");
    put(C+Math.cos(r)*9.4,  C+Math.sin(r)*9.4,  "F");
  }
  /* 눈금 — 12·3·6·9 는 길게, 나머지는 점 */
  for(let h=0;h<12;h++){
    const r=(h/12)*Math.PI*2-Math.PI/2;
    const long=(h%3===0);
    for(let k=0;k<(long?3:1);k++){
      const d=8.2-k*0.9;
      put(C+Math.cos(r)*d, C+Math.sin(r)*d, long?"T":"t");
    }
  }
  /* 바늘 — 브레젠험으로 픽셀을 찍는다 */
  /* 바늘 — 두 줄로 그어 굵게 */
  const line=(ang,len,ch,thick)=>{
    const nx=-Math.sin(ang), ny=Math.cos(ang);
    for(let d=1;d<=len;d+=0.4){
      const x=C+Math.cos(ang)*d, y=C+Math.sin(ang)*d;
      put(x,y,ch);
      if(thick){ put(x+nx*0.9,y+ny*0.9,ch); put(x-nx*0.9,y-ny*0.9,ch) }
    }
  };
  const t=((run?run.time:6)%24+24)%24;
  const hAng=((t%12)/12)*Math.PI*2-Math.PI/2;
  const mAng=((t%1))*Math.PI*2-Math.PI/2;
  line(mAng,8.0,"M",0);   /* 분침 — 가늘고 길게 */
  line(hAng,5.0,"H",1);   /* 시침 — 굵고 짧게 */
  put(C,C,"P"); put(C+1,C,"P"); put(C,C+1,"P"); put(C+1,C+1,"P");
  put(C-1,C,"P"); put(C,C-1,"P"); put(C+2,C+1,"P"); put(C+1,C+2,"P");
  const night=run&&run.night;
  const P={
    "O":"#0a0809",
    "F":night?"#5b52a0":"#7a6742",
    "T":night?"#c9c0f0":"#e8dfc8",
    "t":night?"#9a92d8":"#bda98a",
    "H":night?"#e0d8ff":"#f0e6cf",
    "M":night?"#c9bdf5":"#e8c24a",
    "P":night?"#e0d8ff":"#f0e6cf"
  };
  /* 배경 원 */
  let bg='<circle cx="12" cy="12" r="10.2" fill="'+(night?"#171430":"#241d14")+'"/>';
  let out='<svg class="clkpx" viewBox="0 0 24 24" shape-rendering="crispEdges"'
    +(px?' style="width:'+px+'px;height:'+px+'px"':'')+'>'+bg;
  for(let y=0;y<N;y++){
    let x=0;
    while(x<N){
      const ch=g[y][x];
      if(ch==="."||!P[ch]){ x++; continue }
      let w=1; while(x+w<N&&g[y][x+w]===ch) w++;
      out+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="1" fill="'+P[ch]+'"/>';
      x+=w;
    }
  }
  return out+"</svg>";
}

function buildGrid(fi){
  const S=FIELDS[fi].size, g=[], mid=Math.floor(S/2);
  for(let r=0;r<S;r++){ const row=[]; for(let c=0;c<S;c++) row.push({t:"empty"}); g.push(row) }
  g[S-1][mid]={t:"camp"};
  g[0][mid]={t:"boss"};
  const free=[];
  for(let r=0;r<S;r++) for(let c=0;c<S;c++) if(g[r][c].t==="empty") free.push([r,c]);
  const put=(t,n,mk)=>{
    for(let i=0;i<n&&free.length;i++){
      const k=Math.floor(Math.random()*free.length), rc=free.splice(k,1)[0];
      g[rc[0]][rc[1]]=Object.assign({t:t},mk?mk():{});
    }
  };
  const dun=()=>({waves:1+Math.floor(Math.random()*3),style:rnd(DUN_STYLE),loot:rnd(DUN_LOOT)});
  put("dungeon",nodeCount("dungeon",fi),dun);
  put("elite",nodeCount("elite",fi),()=>({waves:1,style:rnd(DUN_STYLE),loot:rnd(DUN_LOOT)}));
  put("shop",nodeCount("shop",fi));
  put("rest",nodeCount("rest",fi));
  put("event",nodeCount("event",fi));
  return g;
}
/* 구역이 넓어질수록 칸도 함께 늘어난다 (7x7 / 9x9 / 11x11) */
const NODE_N={dungeon:[10,16,22], elite:[3,5,7], shop:[2,3,4], rest:[2,4,6], event:[5,9,13]};
function nodeCount(t,fi){
  const a=NODE_N[t]; if(!a) return 0;
  return a[Math.min(fi==null?(run?run.field:0):fi, a.length-1)];
}
/* 이미 들른 상점·휴식소·미지의 구역은 다른 날 다른 자리에 다시 나타난다 */
function respawn(){
  const S=run.size, free=[];
  for(let r=0;r<S;r++) for(let c=0;c<S;c++) if(run.grid[r][c].t==="empty") free.push([r,c]);
  ["shop","rest","event"].forEach(t=>{
    const want=nodeCount(t,run.field);
    let have=0;
    for(let r=0;r<S;r++) for(let c=0;c<S;c++) if(run.grid[r][c].t===t) have++;
    for(let i=have;i<want&&free.length;i++){
      if(Math.random()<0.45) continue;              /* 7일에 걸쳐 조금씩 */
      const k=Math.floor(Math.random()*free.length), rc=free.splice(k,1)[0];
      run.grid[rc[0]][rc[1]]={t:t};
    }
  });
  /* 전투 칸을 모두 정복하면 새 전투 칸이 생긴다 */
  let left=0;
  for(let r=0;r<S;r++) for(let c=0;c<S;c++){ const x=run.grid[r][c];
    if(x.t==="dungeon"||x.t==="elite") left++ }
  if(!left){
    const n=4+Math.floor(Math.random()*3)+run.field*2;
    for(let i=0;i<n&&free.length;i++){
      const k=Math.floor(Math.random()*free.length), rc=free.splice(k,1)[0];
      run.grid[rc[0]][rc[1]]={t:i<2?"elite":"dungeon",
        waves:i<2?1:1+Math.floor(Math.random()*3),
        style:rnd(DUN_STYLE),loot:rnd(DUN_LOOT)};
    }
    if(n) toast("정복하지 않은 전투 칸이 사라지고, 새 전투 칸이 나타났습니다.");
  }
}

function clock(){
  const t=Math.max(0,run.time), h=Math.floor(t)%24, m=(t%1)?"30":"00";
  return (h<10?"0":"")+h+":"+m;
}
function spend(hours,act){
  const tired=run.act<=0;
  if(act){ run.act=Math.max(0,run.act-act) }
  run.time+=(tired&&act)?hours*2:hours;
  if(run.time>=18&&!run.night){ run.night=1;
    toast("해가 집니다. 밤길에는 무엇이 튀어나올지 모릅니다.") }
  if(run.time>=30){ toast("길에서 밤을 지새웠습니다."); nextDay() }
}
function addTaint(v){
  run.taint=Math.max(0,Math.min(100,run.taint+v));

}
function nextDay(){
  run.day++;

    lose(`${FIELDS[run.field].days}일이 지나도록 우두머리를 넘지 못했습니다.`); return;
  }
  run.time=6; run.act=run.actMax; run.night=0; run.campDone=0;
  addTaint(10);
  respawn();
  const left=FIELDS[run.field].days-run.day;
  dayBreak(run.day, left>0?`${FIELDS[run.field].n} · 남은 날 ${left}일`:`${FIELDS[run.field].n} · 마지막 날`);
  toast(`${run.day}일차 아침이 밝았습니다.`);
}

    add("미지의 구역","ev:"+e.n+":t",e.n+" — 상황 문구",()=>e.t,v=>e.t=v,true);
    e.o.forEach((o,i)=>{
      add("미지의 구역","ev:"+e.n+":o"+i+":t",e.n+" ▸ 선택지 "+(i+1)+" 이름",()=>o.t,v=>o.t=v);
      add("미지의 구역","ev:"+e.n+":o"+i+":d",e.n+" ▸ 선택지 "+(i+1)+" 설명",()=>o.d,v=>o.d=v,true);
    });
  });
  SHOP_STOCK.forEach(g=>add("상점","shop:"+g.n,g.n,()=>g.d,v=>g.d=v,true));
  /* 대사 — 한 줄이 대사 하나 */
  const BCAT=[["in","전장에 설 때"],["atk","기술을 쓸 때"],["hurt","맞을 때"],
              ["kill","처치할 때"],["down","쓰러질 때"]];
  const barkOwner=n=>{
    const foe=!!FOE_NAMES[n];
    return "대사 · "+(foe?"적":"영웅")+" · "+n;
  };
  Object.keys(BARK).forEach(n=>{
    BCAT.forEach(([k,label])=>{
      add(barkOwner(n),"bark:"+n+":"+k,n+" ▸ "+label,
        ()=>(BARK[n][k]||[]).join("\n"),
        v=>{ BARK[n][k]=String(v).split("\n").map(x=>x.trim()).filter(Boolean) },true);
    });
  });
  BCAT.forEach(([k,label])=>add("대사 · 공통","barkany:"+k,"이름 없는 대상 ▸ "+label,
    ()=>(BARK_ANY[k]||[]).join("\n"),
    v=>{ BARK_ANY[k]=String(v).split("\n").map(x=>x.trim()).filter(Boolean) },true));
  Object.keys(HEROES).forEach(hn=>{
    const H=HEROES[hn];
    add("영웅 소개","hero:"+hn+":focus",hn+" — 한 줄 소개",()=>H.focus,v=>H.focus=v,true);
    add("영웅 소개","hero:"+hn+":pass",hn+" — 지속 능력",()=>H.passive.d,v=>H.passive.d=v,true);
    H.skills.forEach((sk,i)=>add("영웅 기술 요약","hsk:"+hn+":"+i,hn+" ▸ "+sk.n,
      ()=>sk.d,v=>sk.d=v,true));
  });
  return out;
}

  document.body.appendChild(box);
  if(st.hi){
    const t=document.querySelector(st.hi);
    if(t){ const r=t.getBoundingClientRect();
      const hi=el(`<div class="tuthi"></div>`);
      hi.style.left=(r.left-6)+"px"; hi.style.top=(r.top-6)+"px";
      hi.style.width=(r.width+12)+"px"; hi.style.height=(r.height+12)+"px";
      document.body.appendChild(hi); }
  }
}

function nightDepth(){ return run.night?Math.max(0,run.time-18):0 }
function ambushChance(cell){
  if(!run.night) return 0;
  const base=(cell.t==="empty")?0.45:0.12;
  return Math.min(0.85, base+nightDepth()*0.05);
}
function moveTo2(r,c){
  const cell=run.grid[r][c];
  const tired=run.act<=0;
  costPop(r,c,tired);
  run.pos={r:r,c:c};
  spend(1,1); addTaint(6);
  if(run.taint>=100) return;
  if(cell.t!=="camp"&&Math.random()<ambushChance(cell)){
    toast(cell.t==="empty"
      ? "인기척 하나 없는 자리입니다. 어둠 속에서 무언가 달려듭니다."
      : "발을 들이기도 전에 무언가 달려듭니다.");
    if(cell.t!=="empty") run.pendingEnter={r:r,c:c};   /* 이기면 원래 볼일을 본다 */
    startDungeon({t:"ambush",waves:1},null,null); return;
  }
  enterCell(r,c);
}
function enterCell(r,c){
  const cell=run.grid[r][c];
  if(cell.done||cell.t==="empty"){ view="map"; render(); return }
  if(cell.t==="camp"){ view="camp"; render(); return }
  if(cell.t==="shop"||cell.t==="rest"||cell.t==="event"){
    spend(0.5,0);
    run.here={r:r,c:c};
    run.grid[r][c]={t:"empty"};      /* 한 번 들르면 사라진다 */
    if(cell.t==="shop"){ makeShop(); view="shop" }
    else if(cell.t==="rest"){ view="rest" }
    else { run.ev=pickEvent(); run.evMsg=null; view="relic" }
    render(); return;
  }
  if(cell.t==="dungeon"||cell.t==="elite"||cell.t==="boss"){ startDungeon(cell,r,c); return }
  view="map"; render();
}

  const pool=run.heroes.filter(h=>!h.down);
  if(!pool.length) return 4;
  const lv=pool.reduce((a,h)=>a+h.lv,0)/pool.length;
  return Math.max(3,Math.round(3+(lv-1)*0.9));
}

           kind:cell.t==="boss"?"boss":cell.t==="elite"?"elite":cell.t==="ambush"?"ambush":"battle"};

function rollChest(kind){
  const T=[CHEST,CHEST2,CHEST3][Math.min(run.field,2)][kind]||CHEST.battle;
  const out=[];
  T.forEach(row=>{
    const type=row[0], lo=row[1], hi=row[2], p=row[3];
    let n=0;
    if(p>=1) n=Math.floor(p); else if(Math.random()<p) n=1;
    for(let i=0;i<n;i++){
      if(type==="금화") out.push({t:"금화",v:lo+Math.floor(Math.random()*(hi-lo+1))});
      else if(type==="경험치") out.push({t:"경험치",v:lo+Math.floor(Math.random()*(hi-lo+1))});
      else out.push({t:type});
    }
  });
  return out;
}

function takeChest(){
  const ch=run.chest, later=[];
  const isBoss=(ch.kind==="boss");
  let exp=0;
  ch.list.forEach(x=>{
    if(x.t==="금화"){
      const base=x.v, mul=run.goldMul||1;
      const got=Math.round(base*mul);
      run.gold+=got;
      SFX.play("coin");
      if(mul>1) toast(`죄악의 목걸이 — 금화 ${base} → ${got} (+${Math.round((mul-1)*100)}%)`);
    }
    else if(x.t==="경험치") exp+=x.v;
    else if(x.t==="파편"||x.t==="일반") later.push({item:rnd(ITEMS.filter(i=>i.g===x.t))});
    else if(x.t==="동료") later.push({recruit:1});
    else later.push({grade:x.t,noRun:isBoss?1:0});
  });
  run.chest=null;
  run.after=later;
  if(exp) giveExp(exp,run.heroes.filter(h=>!h.down&&h.joined!==0));
  if(isBoss&&run.pendingLv) run.pendingLv.forEach(x=>x.noRun=1);
  afterChest();
}
function afterChest(){
  const q=run.after||[];
  if(!q.length){ run.after=null; backToMap(); return }
  const nx=q.shift();
  if(nx.item){ pending={stage:"hero",list:[],item:nx.item,hero:null,back:"chain"}; view="item"; render(); return }
  if(nx.recruit){
    const owned=run.heroes.map(x=>x.name);
    const pool=HERO_POOL.filter(n=>!owned.includes(n));
    run.heroOffer=[];
    while(run.heroOffer.length<3&&pool.length)
      run.heroOffer.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
    view="recruit"; render(); return;
  }
  pending={hero:null,grade:nx.grade,free:1,back:"chain",noRun:nx.noRun||0}; view="reward"; render();
}
function backToMap(){
  if(run.pendingLv&&run.pendingLv.length){
    const q=run.pendingLv; run.pendingLv=null;
    pending={queue:q,idx:0}; view="reward"; render(); return;
  }
  if(run.bossDone){ run.bossDone=0; run.dun=null; nextField(); return }
  run.dun=null;
  if(run.pendingEnter){
    const e=run.pendingEnter; run.pendingEnter=null;

}

/* ═══════════ 경험치 ═══════════ */
function giveExp(exp,pool,each){
  pool=(pool&&pool.length)?pool:run.heroes.filter(h=>!h.down);
  if(!pool.length) pool=run.heroes.slice();
  if(each){
    const q0=run.pendingLv||[];
    pool.forEach(h=>{
      h.exp+=exp;
      while(h.lv<30&&h.exp>=needExp(h.lv)){
        h.exp-=needExp(h.lv); h.lv++;
        h.maxHp+=h.hpLv; h.hp+=h.hpLv;
        if(h.name==="트리스탄") h.atk++;
        q0.push({hero:h,lv:h.lv});
      }
    });
    run.pendingLv=q0;
    toast(`경험치 — ${pool.map(h=>h.name).join(" · ")} 각각 +${exp}`);
    return;
  }
  const w=pool.map(h=>1/Math.max(1,h.lv));
  const sum=w.reduce((a,b)=>a+b,0);
  const raw=w.map(x=>exp*x/sum);
  const got=raw.map(x=>Math.floor(x));
  let left=exp-got.reduce((a,b)=>a+b,0);
  raw.map((x,i)=>({i:i,f:x-Math.floor(x)})).sort((a,b)=>b.f-a.f)
     .forEach(o=>{ if(left>0){ got[o.i]++; left-- } });
  if(exp>0) got.forEach((g,i)=>{ if(g<1) got[i]=1 });
  const q=run.pendingLv||[];
  pool.forEach((h,i)=>{
    h.exp+=got[i];
    while(h.lv<30&&h.exp>=needExp(h.lv)){
      h.exp-=needExp(h.lv); h.lv++;
      h.maxHp+=h.hpLv; h.hp+=h.hpLv;
      if(h.name==="트리스탄") h.atk++;
      q.push({hero:h,lv:h.lv});
    }
  });
  run.pendingLv=q;
  toast(`경험치 — ${pool.map((h,i)=>h.name+" +"+got[i]).join(" · ")}`);
}

           shard:"#6aa8e0",normal:"#6aa8e0",named:"#6aa8e0"}[k]||"#e0a86a";
  const g={
   card :'<rect x="16" y="14" width="32" height="38" rx="4" fill="none" stroke="@" stroke-width="5"/><path d="M24 30h16M24 40h10" stroke="@" stroke-width="4"/>',
   stone:'<path d="M32 12 L52 26 L44 52 H20 L12 26 Z" fill="none" stroke="@" stroke-width="5"/>',
   act  :'<path d="M22 52 l6 -18 h-10 l18 -22 -6 18 h10 z" fill="@"/>',
   taint:'<path d="M32 10 C32 10 16 30 16 40 a16 16 0 0 0 32 0 C48 30 32 10 32 10 Z" fill="none" stroke="@" stroke-width="5"/>',
   shard:'<path d="M32 12 L50 24 v18 L32 54 L14 42 V24 Z" fill="none" stroke="@" stroke-width="5"/>',
   normal:'<path d="M32 12 L50 24 v18 L32 54 L14 42 V24 Z" fill="none" stroke="@" stroke-width="5"/><circle cx="32" cy="33" r="6" fill="@"/>',
   named:'<path d="M32 12 L50 24 v18 L32 54 L14 42 V24 Z" fill="none" stroke="@" stroke-width="5"/><circle cx="32" cy="33" r="6" fill="@"/>',
   named2:'<path d="M32 12 L50 24 v18 L32 54 L14 42 V24 Z" fill="none" stroke="@" stroke-width="5"/><circle cx="32" cy="33" r="6" fill="@"/><circle cx="32" cy="33" r="11" fill="none" stroke="@" stroke-width="3"/>'
  }[k]||'<path d="M32 10 L40 26 L58 28 L45 40 L48 56 L32 48 L16 56 L19 40 L6 28 L24 26 Z" fill="@"/>';
  return '<svg viewBox="0 0 64 64">'+g.split("@").join(c)+'</svg>';
}
function drawShop(app){
  const sh=run.shop;
  const box=el(`<div class="npcbox">
    <div class="npc"><div class="npcface">${figure("도미니코")}</div>
      <b>${esc(sh.npc)}</b>
      <p>"필요한 게 있으면 골라 보시오. 값은 그때그때 다르니."</p>
      <p style="color:var(--brass)">가진 금화 ${run.gold}</p></div>
    <div class="shelf"><div class="hint">진열대</div><div class="shelfrow" id="shelf"></div></div>
  </div>`);
  app.appendChild(box);
  const row=box.querySelector("#shelf");
  sh.goods.forEach(g=>{
    const off=g.left<=0||run.gold<g.cost;
    const c=el(`<div class="rw${gcls(g.k)} ${off?"no":""}">
      <div class="rwi">${shopIcon(g.k)}</div>
      <div class="g">${g.left<=0?"품절":g.cost+" 금화 · 남은 "+g.left}</div>
      <b>${esc(g.n)}</b><p>${rich(g.d)}</p>${g.item?recipeHtml(g.item):""}</div>`);
    if(!off) c.onclick=()=>buy(g);
    row.appendChild(c);
  });
  /* 팔기 */
  const own=ownedItems();
  const sellBox=el(`<div class="npcbox" style="margin-top:16px">
    <div class="npc"><div class="npcface">${shopIcon("stone")}</div>
      <b>물건 팔기</b>
      <p>쓰지 않는 물건은 값을 쳐 드립니다.</p>
      <p style="color:var(--faint)">파편 1~3 · 일반 8~12 · 희귀 30~50 금화</p></div>
    <div class="shelf"><div class="hint">가진 물건 ${own.length}개</div>
      <div class="shelfrow" id="sellrow"></div></div></div>`);
  const srow=sellBox.querySelector("#sellrow");
  if(!own.length) srow.appendChild(el(`<div class="hint">팔 물건이 없습니다.</div>`));
  own.filter(x=>!x.it.bind).forEach((x,i)=>{
    const pr=SELL_PRICE[x.it.g]||[1,3];
    const c=el(`<div class="rw"><div class="rwi">${shopIcon(x.it.g==="파편"?"shard":"normal")}</div>
      <div class="g">${pr[0]}~${pr[1]} 금화</div>
      <b>${esc(x.it.n)}</b><p>${rich(x.it.d||"")}</p>
      <p style="color:var(--faint)">${x.bag?"가방":x.h.name+" 착용"}</p></div>`);
    c.onclick=()=>sellItem(i);
    srow.appendChild(c);
  });
  app.appendChild(sellBox);
  const out=el(`<div style="text-align:center;margin-top:22px"><button class="go">상점을 떠난다</button></div>`);
  out.querySelector("button").onclick=leaveNode;
  app.appendChild(out);
}
function sellItem(i){
  const own=ownedItems(), x=own[i];
  if(!x) return;
  const pr=SELL_PRICE[x.it.g]||[1,3], g=rr(pr);
  if(x.bag) run.bag.splice(x.i,1); else x.h.items.splice(x.i,1);
  run.gold+=g;
  SFX.play("coin");
  toast(`${x.it.n}을 ${g} 금화에 팔았습니다.`);
  render();
}
function buy(g){
  if(run.gold<g.cost||g.left<=0) return;
  run.gold-=g.cost; g.left--;
  SFX.play("coin");
  if(g.k==="card"){ addCard(run,g.card,1); SFX.play("coin");
    toast(`${g.card} 카드를 얻었습니다.`); render(); return }
  if(g.k==="stone"){ run.stone=(run.stone||0)+1; render(); return }
  if(g.k==="act"){ run.act=Math.round(run.act)+3; toast("활동량을 3 얻었습니다."); render(); return }
  if(g.k==="taint"){ addTaint(-20); toast("오염도가 20 낮아졌습니다."); render(); return }
  if(g.k==="shard"||g.k==="normal"||g.k==="named"||g.k==="named2"){
    const it=g.item||rnd(ITEMS.filter(i=>i.g===(g.k==="normal"?"일반":"파편")));
    pending={stage:"hero",list:[],item:it,hero:null,back:"shop"};
    view="item"; render(); return;
  }
  pending={hero:null,grade:g.k,free:1,back:"shop"}; view="reward"; render();
}

/* ═══════════ 휴식소 ═══════════ */
function drawRest(app){
  app.appendChild(el(`<div class="center"><div class="title" style="font-size:20px">휴 식 소</div>
    <div class="sub">불씨가 아직 남아 있습니다. 잠깐 몸을 누일 수 있겠군요.</div></div>`));
  const wrap=app.querySelector(".center");
  const n=[1,1,2][Math.min(run.field,2)];
  const grade=run.field===0?"하급":"중급";
  const row=el(`<div class="rewards"></div>`);
  const a=el(`<div class="rw"><div class="rwi">${nodeArt("rest")}</div>
    <b>불을 쬔다</b><p>모든 영웅이 최대 체력의 30%를 회복합니다.</p></div>`);
  a.onclick=()=>{ run.heroes.forEach(h=>{ if(!h.down)
      healUp(h,Math.round(h.maxHp*0.3)) });
    SFX.play("heal"); toast("몸이 좀 풀립니다."); leaveNode() };
  const b=el(`<div class="rw"><div class="rwi">${nodeArt("elite")}</div>
    <b>몸을 단련한다</b><p>${esc(grade)} 보상을 ${n}개 고릅니다.</p></div>`);
  b.onclick=()=>{ run.after=[]; for(let i=0;i<n;i++) run.after.push({grade:grade});
    afterChest() };
  const c=el(`<div class="rw ${run.night?"":"no"}"><div class="rwi">${nodeArt("camp")}</div>
    <b>노숙한다</b><p>여기서 밤을 보내고 다음 날 아침을 맞습니다. 주둔지가 아니라 오염도가 10 더 오릅니다.</p>
    ${run.night?"":`<p style="color:var(--faint)">해가 진 뒤에만 할 수 있습니다.</p>`}</div>`);
  if(run.night) c.onclick=()=>{ addTaint(10); nextDay();
    if(view!=="over"){ run.here=null; toast("모닥불 곁에서 밤을 보냈습니다."); view="map"; render() } };
  row.appendChild(a); row.appendChild(b); row.appendChild(c);
  wrap.appendChild(row);
}

const ST=()=>1+run.field;
const someHero=()=>{ const p=run.heroes.filter(h=>!h.down); return p.length?rnd(p):null };
function ownedItems(){
  const out=[];
  run.heroes.forEach(h=>(h.items||[]).forEach((it,i)=>out.push({it:it,h:h,i:i})));
  (run.bag||[]).forEach((it,i)=>out.push({it:it,bag:1,i:i}));
  return out;
}
const hasGrade=g=>ownedItems().some(x=>x.it.g===g);
function takeGrade(g){
  const list=ownedItems().filter(x=>x.it.g===g);
  if(!list.length) return null;
  const pick=rnd(list);
  if(pick.bag) run.bag.splice(pick.i,1); else pick.h.items.splice(pick.i,1);
  return pick.it;
}
function pickEvent(){
  const ok=EVENTS.filter(e=>!e.when||e.when());
  return rnd(ok.length?ok:EVENTS.filter(e=>!e.when));
}
function spinRoulette(e,msg){
  run.evSpin=1; render();
  const n=e.wheel.length, target=run.evRoll;
  const laps=3, steps=n*laps+target;
  let i=0;
  const tick=()=>{
    const rows=document.querySelectorAll(".wheel .wr");
    if(!rows.length){ run.evSpin=0; run.evMsg=msg; render(); return }
    rows.forEach((r,k)=>{
      const on=(k===i%n);
      r.classList.toggle("hit",on);
      const q=r.querySelector("i"); if(q) q.textContent=on?"▶":"";
    });
    SFX.play("tick");
    i++;
    if(i<=steps){
      const t=i/steps;
      setTimeout(tick, 55+Math.pow(t,3)*300);
    }else{
      SFX.play("win");
      setTimeout(()=>{ run.evSpin=0; run.evMsg=msg; render() },420);
    }
  };
  setTimeout(tick,120);
}

/* ═══════════ 전투 ═══════════ */
const SLOTS=5;
const UNLOCK=[1,1,7,15];   // 3번 기술 7레벨, 궁극기 15레벨 (기획노트)
const dist=(a,e)=>(SLOTS-a)+e;   /* 아군 a번, 적 e번 · 아군 5번과 적 1번이 거리 1 */
function foeSet(kind){
  const f=Math.min(run.field,2), pool=FIELD_FOES[f], out=[];
  const n=run.heroes.length;
  if(kind==="boss"){
    out.push([BOSSES[f],1]);
    const extra=Math.min(2,Math.max(0,n-1));
    for(let i=0;i<extra;i++) out.push([rnd(pool),2+i]);
    return out;
  }
  if(kind==="elite"){
    /* 정예는 대원 수 제한을 덜 받고, 앞자리에 가장 단단한 놈이 선다 */
    const k=Math.max(2,Math.min(4,n+1));
    const lead=pool.slice().sort((a,b)=>FOE[b].hp-FOE[a].hp)[0];
    out.push([lead,1]);
    for(let i=2;i<=k;i++) out.push([rnd(pool),i]);
    return out;
  }
  const base=2+Math.floor(Math.random()*2);
  const k=Math.max(1,Math.min(base,n+1));
  for(let i=1;i<=k;i++) out.push([rnd(pool),i]);
  return out;
}
/* 대원이 강해진 만큼 적도 따라온다 */
function partyPower(){
  if(!run||!run.heroes.length) return 1;
  const n=run.heroes.length;
  const lv=run.heroes.reduce((a,h)=>a+h.lv,0)/n;
  const st=run.heroes.reduce((a,h)=>a+h.atk+h.mag+h.def,0)/n;
  const hp=run.heroes.reduce((a,h)=>a+h.maxHp,0)/n;
  return 1+(lv-1)*0.11+st*0.012+Math.max(0,hp-22)*0.006;
}
function foeScale(kind){
  const f=run.field, l=(run.day-1)+(run.dun?run.dun.wave-1:0), n=Math.min(run.heroes.length,5);
  let m=(1+f*0.85)*(1+l*0.05)*partyPower();
  if(kind==="elite")  m*=1.32;
  if(kind==="boss")   m*=1.45;
  if(kind==="ambush") m*=1.3+nightDepth()*0.08;
  /* 대원이 적을수록 적도 약해진다 */
  const hpP =[0,0.68,0.86,1,1.08,1.15][n];
  const atkP=[0,0.58,0.82,1,1.06,1.12][n];
  const defP=[0,0.7 ,0.88,1,1.05,1.1 ][n];
  return {m:m, hpP:hpP, atkP:atkP, defP:defP,
          hpAdd:Math.round((f*3+l)*hpP), atkAdd:Math.floor(f*1.2*atkP), defAdd:Math.round(f*2*defP)};
}
/* 전투를 시작한 그 순간의 판을 적어 둔다. 되감기의 원본이 된다 */
let BSNAP=null;
function startBattle(kind,pinned){
  const _k=kind;
  if(!pinned){
    BSNAP=null;
    try{ BSNAP={kind:kind,run:JSON.stringify(run)} }catch(e){ BSNAP=null }
  }
  B={kind,turn:1,over:0,log:[],hand:[],units:[],foes:[],drag:null};
  /* 전투(옛 던전) 하나는 여러 라운드로 이루어진다.
     "전투 시작" 효과는 첫 라운드에 딱 한 번만 걸리고, 그 결과는 라운드를 넘어 남는다. */
  const fresh=!run.dun||run.dun.wave<=1;
  if(fresh&&run.curseDown){ run.curseDown=0;
    run.heroes.forEach(h=>{ h.hp=0; h.down=1; h.slot=0 });
    toast("부서진 우상의 저주 — 대원들이 쓰러진 채로 눈을 뜹니다."); }
  if(fresh) run.heroes.forEach(clearTmp);
  run.heroes.forEach(h=>{
    /* 기절한 대원은 그대로 기절해 있는다 — 주둔지 치료소에서만 일어난다 */
    if(h.hp<=0){ h.hp=0; h.down=1; h.slot=0 }

  if(pinned&&pinned.length){

  say("손패의 영웅 카드를 원하는 칸으로 끌어다 놓으세요.","t2");
  if(down.length) say(`기절한 대원은 나서지 못합니다 — ${down.map(h=>h.name).join(", ")}`,"t3");
  if(pinned) sel=null; else rollIntents();

/* 적의 격 — 우두머리 / 정예 / 일반 */
function foeTier(f){
  if(!f) return "norm";
  if(f.boss) return "boss";
  if(B&&B.kind==="elite") return "elite";
  if(B&&B.kind==="ambush") return "ambush";
  return "norm";
}
const TIER_LABEL={boss:"우두머리",elite:"정예",ambush:"밤의 습격",norm:""};
function defVal(f){
  let v=Math.max(0,f.def-(f.weak||0));
  if(deb(f,"defDn")) v=Math.ceil(v*0.5);
  return v;
}
/* 적이 내놓는 피해 — 속성에 따라 공격약화/마법약화를 받는다 */
function foeDmg(f,v,el){
  let d=Math.max(0,v-(f.weakAtk||0));
  if(el==="마법"){ if(deb(f,"magDn")) d=Math.ceil(d*0.5) }
  else { if(deb(f,"atkDn")) d=Math.ceil(d*0.5) }
  return d;
}
/* 적의 도발 — 도발하는 적보다 뒤(번호가 큰 칸)에 있는 적은 겨눌 수 없다 */
function foeTauntWall(f){
  return B.foes.find(x=>x.alive&&x.taunt&&x!==f&&x.slot<f.slot&&!foeHidden(x))||null;
}
/* 숨을 곳이 있을 때만 은신이 성립한다.
   살아 있는 적이 전부 은신이면 아무도 겨눌 수 없게 되므로 은신은 무효가 된다. */
function foeHidden(f){
  if(!f||!f.hide) return false;
  return B.foes.some(x=>x.alive&&x!==f&&!x.hide);
}
/* 겨눌 수 없는 이유를 돌려준다. 없으면 null */
function foeBlockReason(f){
  if(!f||!f.alive) return null;
  if(foeHidden(f)) return `${f.name}${jo(f.name,"eun")} 은신 중이라 겨눌 수 없습니다.`;
  const w=foeTauntWall(f);
  if(w) return `${w.name}${jo(w.name,"ig")} 앞을 막아섭니다. 먼저 쓰러뜨려야 합니다.`;
  return null;
}
const openFoes=()=>B.foes.filter(f=>f.alive&&!foeBlockReason(f));
/* 도발 — 도발한 아군보다 뒤(번호가 작은 칸)에 있는 대상은 겨눌 수 없다 */
function tauntWall(a){
  return allUnits().find(x=>x.taunt&&x!==a&&x.slot>a.slot)||null;
}
function canAim(a){ return !tauntWall(a) }
/* ═══════════ 우두머리의 정화 ═══════════
   우두머리는 홀로 서는 일이 많아 상태 이상에 그대로 노출된다.
   그래서 몸에 걸린 것을 떨쳐내는 패턴을 여럿 가지고 있다. */
const BOSS_PURGE={
 "간수장":   {shake:"사슬 끊기",    roar:"간수의 호통", ward:"쇠창살 두르기"},
 "고철 거인":{shake:"부품 털어내기", roar:"과부하 포효", ward:"고철 갑주"},
 "서리 군주":{shake:"서릿결 정화",  roar:"혹한의 노호", ward:"서리 결계"}
};
const PURGE_DEF={shake:"떨쳐내기",roar:"포효",ward:"결계"};
function purgeName(f,k){ return (BOSS_PURGE[f.name]&&BOSS_PURGE[f.name][k])||PURGE_DEF[k] }
/* 지금 몸에 걸려 있는 나쁜 것의 중첩 수 */
function foeAil(f){
  if(!f) return 0;
  let n=0;
  if(f.deb) DEB_KEYS.forEach(k=>{ n+=f.deb[k]||0 });
  n+=(f.infect||0)+(f.burn||0)+(f.mark||0)+(f.weak||0)+(f.stun||0)+(f.weakAtk?1:0)+(f.air?1:0);
  return n;
}
/* 전부 걷어낸다. 걷어낸 중첩 수를 돌려준다 */
function foePurge(f){
  const n=foeAil(f);
  if(f.deb) DEB_KEYS.forEach(k=>{ delete f.deb[k] });
  f.fearSrc=null; f.fearName=null;
  f.infect=0; f.burn=0; f.mark=0; f.markBy=null;
  f.weak=0; f.weakAtk=0; f.air=0; f.stun=0;
  return n;
}
function intentKey(o){
  if(!o) return "";
  if(o.t==="atk") return "atk:"+(o.pat||"")+(o.hits||1);
  if(o.t==="deb") return "deb:"+o.k;
  if(o.t==="purge") return "purge:"+o.k;
  return o.t;
}
function rollIntents(){
  const USED={};
  /* 은신 — 전장에 혼자 남으면 숨을 곳이 없다 */
  if(allUnits().length<=1) allUnits().forEach(a=>{ if(a.hide){ a.hide=0;
    say(`${a.name}${jo(a.name,"eun")} 혼자 남아 은신이 풀립니다.`,"t2") } });
  let allies=allUnits();
  const seen=allies.filter(a=>!a.hide);
  if(seen.length) allies=seen;
  const open=allies.filter(canAim);
  if(open.length) allies=open;
  B.foes.forEach(f=>{
    if(!f.alive) return;
    if(run&&run.sandbox){ f.intent={t:"wait"}; return }
    if(f.isPhantom){ f.intent={t:"wait"}; return }
    if(!allies.length){ f.intent={t:"wait"}; return }
    if(f.forceDef){ f.forceDef=0; f.intent={t:"def",v:defVal(f)}; return }
    if(deb(f,"fear")&&f.fearSrc){
      const brave=allies.filter(a=>uid(a)!==f.fearSrc);
      if(brave.length) allies=brave;
    }
    const inR=allies.filter(a=>dist(a.slot,f.slot)<=f.rng);
    const far=!inR.length;
    if(far){
      /* 먼저 거리를 좁혀 본다 */
      if(f.slot>1&&!foeAt(f.slot-1)&&Math.random()<0.55){ f.intent={t:"move"}; return }
      if(f.slot>1&&foeAt(f.slot-1)&&Math.random()<0.4){ f.intent={t:"push"}; return }
      /* 다가갈 수 없어도 손 놓고 있지는 않는다 — 무리해서 노린다 */
    }else{
      /* 원거리형은 붙으면 물러선다 */
      const RET=((FOE[f.name]&&FOE[f.name].ai)||{}).ret||0;
      if(RET&&dist(inR[0].slot,f.slot)<=1&&f.slot<SLOTS&&!foeAt(f.slot+1)&&Math.random()<RET){
        f.intent={t:"back"}; return;
      }
    }
    const T=far?allies:inR;
    const pool=[], add=(o,w)=>{ for(let q=0;q<(w||0);q++) pool.push(o) };
    const near=T.reduce((a,b)=>dist(a.slot,f.slot)<=dist(b.slot,f.slot)?a:b);
    const weak=T.reduce((a,b)=>a.hp<=b.hp?a:b);
    const back=T.reduce((a,b)=>a.slot>=b.slot?a:b);
    const any =rnd(T);
    /* 사거리 밖이면 무리하게 뻗느라 위력이 준다 */
    const FM=far?0.7:1, FP=far?"무리한 ":"";
    const dv=x=>Math.max(1,Math.round(x*FM));
    const D=(FOE[f.name]&&FOE[f.name].ai)||{};
    const EL=(FOE[f.name]&&FOE[f.name].el)||"공격";
    const A=Object.assign({near:8,weak:4,back:2,any:2,def:1,volley:0,buff:0,heal:2,curse:1,debs:["burn"]},D);
    const hit=(FOE[f.name]&&FOE[f.name].hit)||"내려찍기";
    add({t:"atk",v:dv(f.atk),to:near.slot,pat:FP+hit,el:EL,far:far},A.near);
    add({t:"atk",v:dv(f.atk*1.35),to:weak.slot,pat:FP+"약점 노리기",el:EL,far:far},A.weak);
    add({t:"atk",v:dv(f.atk),to:back.slot,pat:FP+"후방 급습",el:EL,far:far},A.back);
    add({t:"atk",v:dv(f.atk),to:any.slot,pat:FP+"난타",el:EL,far:far},A.any);
    /* 연타 — 같은 총량을 여러 번에 나눠 때린다. 가시·갑피·공격 강화가 크게 작용한다 */
    { const n3=3, p3=Math.max(1,Math.round(f.atk*FM/n3));
      add({t:"atk",v:p3,hits:n3,to:near.slot,pat:FP+"연타",el:EL,far:far},Math.max(2,Math.round(A.near*0.4)));
      const n2=2, p2=Math.max(1,Math.round(f.atk*1.2*FM/n2));
      add({t:"atk",v:p2,hits:n2,to:weak.slot,pat:FP+"쌍격",el:EL,far:far},Math.max(1,Math.round(A.weak*0.4))); }
    add({t:"def",v:defVal(f)},far?A.def+1:A.def);
    if(!f.thorn) add({t:"thorn",v:Math.max(2,Math.round(2+run.field*1.5)),turns:3},A.thorn||0);
    add({t:"volley",v:dv(f.atk*0.6),el:EL},far?A.volley+2:A.volley);
    if((f.buffs||0)<3) add({t:"buff",v:Math.max(1,Math.round(f.atk*0.35))},A.buff);
    const mate=B.foes.filter(x=>x.alive&&x!==f&&x.hp<x.maxHp*0.6)[0];
    if(mate) add({t:"heal",v:Math.max(2,Math.round(f.def*0.8)),to:mate.id},A.heal);
    add({t:"curse"},A.curse);
    /* ── 우두머리는 몸에 걸린 것을 떨쳐낸다 ──
       걸린 게 많을수록 그쪽을 고를 확률이 크게 오르고,
       깨끗할 때는 미리 부정 보호막을 둘러 다음 것을 막는다. */
    if(f.boss){
      const ail=foeAil(f);
      if(ail>0){
        add({t:"purge",k:"shake"}, 4+Math.min(14,ail*3));
        add({t:"purge",k:"roar",v:Math.max(1,Math.round(f.atk*0.15))}, 3+Math.min(10,ail*2));
      }
      if((f.negShield||0)<4)
        add({t:"purge",k:"ward",v:2+Math.floor(run.field/2)}, ail>0?3:7);
    }
    /* 이 적만의 상태 이상 */
    (A.debs||[]).forEach(k=>{
      const to=(k==="shock"||k==="fear")?back.slot:(k==="stun"?weak.slot:near.slot);
      const v={burn:2,bind:2,stun:1,fear:1,shock:3,chill:3,atkDn:2,magDn:2}[k]||1;
      add({t:"deb",k:k,to:to,v:v,el:EL},far?1:2);
    });
    /* 이미 같은 행동을 고른 적이 있으면 다른 것을 우선한다 */
    let best=null;
    for(let t=0;t<4;t++){
      const c=rnd(pool), k=intentKey(c);
      const n=USED[k]||0;
      if(!n||Math.random()<1/(1+n*1.6)){ best=c; break }
      if(!best) best=c;
    }
    USED[intentKey(best)]=(USED[intentKey(best)]||0)+1;
    f.intent=best;
  });
}

const BARK_ANY={
 in:["…"], atk:["하압!"], hurt:["윽!"], kill:["끝."], down:["크윽…"]
};
let BARK_AT=0;
function bark(u,cat,force){
  if(!u||!B||B.over) return;
  const now=Date.now();
  if(!force&&now-BARK_AT<1800) return;          /* 너무 자주 떠들지 않게 */
  const P=(BARK[u.of||u.name]||{})[cat]||(u.isMin?null:BARK_ANY[cat]);
  if(!P||!P.length) return;
  const rate={in:0.42,atk:0.13,hurt:0.16,kill:0.3,down:0.85}[cat]||0.12;
  if(!force&&Math.random()>rate) return;
  BARK_AT=now;
  const foe=!!u.isFoe||B.foes.indexOf(u)>=0;
  const p=ctrOf(foe?"foe":"mine",u.slot);
  if(!p) return;
  const nd=spawn('<div class="bark'+(foe?" f":"")+'">'+esc(rnd(P))+'</div>');
  if(!nd) return;
  nd.style.left=p.x+"px";
  nd.style.top=(p.y-58)+"px";
}
function intentHtml(f){
  if(!f.alive||!f.intent) return "";
  const I=f.intent;
  if(I.t==="move")  return `<span class="intent">${ic("move")} 전진</span>`;
  if(I.t==="back")  return `<span class="intent">${ic("move")} 후퇴</span>`;
  if(I.t==="push")  return `<span class="intent">${ic("move")} 앞으로</span>`;
  if(I.t==="def")   return `<span class="intent">${ic("def")}<b>${I.v}</b></span>`;
  if(I.t==="thorn") return `<span class="intent" title="맞을 때마다 되받아칩니다">가시 <b>${I.v}</b></span>`;
  if(I.t==="buff")  return `<span class="intent" title="자기 강화">${ic("atk")}<b>+${I.v}</b> 강화</span>`;
  if(I.t==="heal")  return `<span class="intent" title="동료 치료">${ic("hp")}<b>+${I.v}</b> 치료</span>`;
  if(I.t==="curse") return `<span class="intent" title="다음 턴 마나 -1">${ic("mag")} 저주</span>`;
  if(I.t==="deb")   return `<span class="intent" title="${esc(DEBUFF[I.k].d)}" style="color:${DEBUFF[I.k].c}">${esc(DEBUFF[I.k].n)} ${I.v} → ${I.to}번</span>`;
  if(I.t==="purge") return `<span class="intent purge" title="${
      I.k==="ward"?"미리 부정 보호막을 둘러 다음 상태 이상을 막습니다"
      :I.k==="roar"?"몸에 걸린 상태 이상을 모두 걷어내고, 걷어낸 만큼 공격력을 얻습니다"
      :"몸에 걸린 상태 이상을 모두 걷어냅니다"}">✦ ${esc(purgeName(f,I.k))}</span>`;
  if(I.t==="volley")return `<span class="intent" title="아군 전체">${ic("atk")}<b>${I.v}</b> 전체</span>`;
  if(I.t==="atk")   return `<span class="intent" title="${esc((I.pat||"")+" · "+(I.el||"공격"))}">${
    ic(I.el==="마법"?"mag":"atk")}<b>${I.v}</b>${
    I.hits>1?`<span class="hits">×${I.hits}</span>`:""} → ${I.to}번</span>`;
  return `<span class="intent">대기</span>`;
}

function promptMsg(){
  if(B.over) return "전투 종료";

  if(sel.step===3) return `${s.n} — 횟수를 누르세요 (1~9)`;
  if(sel.step===5) return `${s.n} — 그림자를 남기고 옮겨갈 칸을 고르세요 (최대 2칸)`;
  if(s.tg==="self") return `${s.n} ×${sel.count} — 내 칸을 누르거나 아래 [시전] 버튼으로 발동`

  return s.tg==="ally"?`${s.n} ×${sel.count} — 이동할 칸을 고르세요`
       +(isMoveSkill(s)&&!moveStayOk(sel.hero,s)?" (지금 칸은 고를 수 없습니다)":"")
       : s.tg==="any" ?`${s.n} ×${sel.count} — 아군 칸 또는 적 칸(빈 칸 포함)을 클릭하세요`
       : s.tg==="foe" ?`${s.n} ×${sel.count} — 적의 칸을 고르세요`
          +(reachOf(sel.hero,s)!=null?` (사거리 ${reachOf(sel.hero,s)})`:"")
          +" · 같은 기술을 또 누르면 횟수 +1" : "";
}
function breakdown(h,sk,key){
  let total=sk[key]||0;
  const parts=[];
  modParts(sk,key).forEach(m=>{ total+=m.v; parts.push({n:m.n,v:m.v}) });
  if(key==="dmg"){
    if(sk.n==="진선풍도"&&h.windBuff){ total+=h.windBuff; parts.push({n:"산들바람",v:h.windBuff}) }
    const st=(sk.el==="마법")?{v:h.mag,n:"추가 마법력"}:{v:h.atk,n:"추가 공격력"};
    if(st.v){ total+=st.v; parts.push(st) }
  }
  if(key==="shield"&&h.def){ total+=h.def; parts.push({n:"추가 보호력",v:h.def}) }
  return {total:total,parts:parts};
}
function numHtml(h,sk,key){
  const b=breakdown(h,sk,key);
  const tail=b.parts.length
    ? `<span class="brk">(${b.parts.map(p=>icoify(esc(p.n))+" "+p.v).join(" / ")})</span>` : "";
  return `<b class="big">${b.total}</b>${tail}`;
}
function valueLines(h,sk){

  if(sk.shield) L.push(`보호막을 ${numHtml(h,sk,"shield")} 얻습니다.`);

  if(sk.justice) L.push(`지금 보호막 <b class="big">${h.shield}</b>만큼 피해를 줍니다.`);
  if(sk.armorUp) L.push(`갑피를 <b class="big">${1+(h.tag.armorPlus||0)}</b> 얻습니다.`);
  if(sk.farshot) L.push(`가장 멀리 있는 적만 겨눌 수 있습니다.`);

  if(sk.vanguard) L.push(`지나친 아군 하나당 보호막 <b class="big">${(h.tag.vanShield||5)+h.def}</b>`);
  if(sk.rearguard) L.push(`체력 <b class="big">${h.tag.rearHeal||5}</b> · 지나친 아군 보호막 <b class="big">${5+h.def}</b>`);

function bk(base,parts){
  const list=parts.filter(p=>p.v);
  const total=base+list.reduce((a,p)=>a+p.v,0);
  const tail=list.length?`<span class="brk">(기본 ${base} / ${list.map(p=>icoify(esc(p.n))+" "+p.v).join(" / ")})</span>`:"";
  return `<b>${total}</b>${tail}`;
}

    </div>`));
  const grid=el(`<div class="skills"></div>`);
  if(!h.sk.length) p.appendChild(el(`<div class="hint">이 소환물은 사용할 기술이 없습니다.</div>`));
  h.sk.forEach((s,i)=>{
    const locked = (i===2&&h.lv<UNLOCK[2])||(i===3&&h.lv<UNLOCK[3]);
    const lk=h.lock[i]||0;

    const cost = s.costType==="mom" ? ic("move")+" "+payCost(h,i)

      <span class="k">${i+1}</span><div class="t">
      <b>${esc(s.pick?s.pick:s.n)}</b>${(sel.skill===i&&sel.step===4&&sel.count>1)?`<span class="xn">×${sel.count}</span>`:""}
      ${s.opts?`<span class="chip pk">선택 · ${esc(s.n)}</span>`:""}
      <span style="color:var(--faint);font-size:10.5px">${cost} · ${esc(s.el)}</span>
      ${s.limit?`<span class="chip">사용한도 ${used}/${s.limit}</span>`:""}
      ${locked?`<span class="chip">${UNLOCK[i]}레벨 해제</span>`:""}
      ${lk?`<span class="chip on">잠금 ${lk}</span>`:""}
      ${valueLines(h,s).map(x=>`<span class="val">${x}</span>`).join("")}
      <small>${rich(SKILL_FULL[s.n]||SKILL_TEXT[s.n]||s.d||"")}</small>
      ${SKDETAIL&&SKILL_TEXT[s.n]?`<div class="fullx"><span>한 줄 요약</span>${rich(SKILL_TEXT[s.n])}</div>`:""}
      ${SKDETAIL&&s.alt?`<div class="fullx"><span>전환 · ${esc(s.alt.n)}</span>${rich(SKILL_FULL[s.alt.n]||s.alt.d||"")}</div>`:""}
      </div></div>`);
    if(ok&&s.opts){
      /* 머리 부분은 선택지 목록을 여닫기만 한다 — 고른 선택지와 횟수는 그대로 둔다 */
      e.onclick=ev=>{ ev.stopPropagation();
        if(sel.optOpen===i){ sel.optOpen=null; render(); return }
        if(sel.skill!==i){ sel.skill=i; sel.step=2; sel.count=1 }
        sel.optOpen=i; render();
      };
      if(sel.optOpen===i){
        const list=el(`<div class="opts"></div>`);
        const armed=(sel.skill===i&&sel.step===4);
        s.opts.forEach((o,oi)=>{
          const cur=(o.n===s.n);
          const on=cur&&armed;
          const oc=el(`<div class="opt ${cur?"on":""}">
            <b>${esc(o.n)}</b>${(on&&sel.count>1)?`<span class="xn">×${sel.count}</span>`:""}
            <span>${o.costType==="mom"?ic("move"):o.costType==="scale"?"비늘 ":ic("mana")}${o.cost} · ${esc(o.el)}</span>
            ${on?`<span class="chip pk">한 번 더 누르면 ×${(sel.count||1)+1}</span>`:""}
            <small>${rich(o.d||"")}</small>
            ${SKDETAIL&&SKILL_FULL[o.n]?`<div class="fullx"><span>기획 원문</span>${rich(SKILL_FULL[o.n])}</div>`:""}
            ${on&&o.tg==="self"?`<button class="go ogo">시전 ×${sel.count}</button>`
              :on?`<span class="hint">${o.tg==="foe"?"적의 칸":o.tg==="ally"?"아군 칸":"칸"}을 골라 발동하세요</span>`:""}
          </div>`);
          const gb=oc.querySelector(".ogo");
          if(gb) gb.onclick=ev3=>{ ev3.stopPropagation(); doSkill(null) };
          oc.onclick=ev2=>{
            ev2.stopPropagation();
            /* 같은 선택지를 또 누르면 시전 횟수가 늘어난다 */
            if(cur&&armed){ pickSkill(i,null); return }
            const keep=s.opts;
            h.sk[i]=Object.assign({},o,{opts:keep,pick:s.pick});
            sel.skill=i; sel.count=1; sel.step=2;
            pickSkill(i,1);
          };
          list.appendChild(oc);
        });
        e.querySelector(".t").appendChild(list);
      }
    }
    else if(ok) e.onclick=ev=>{ ev.stopPropagation(); pickSkill(i,1) };
    grid.appendChild(e);
  });
  p.appendChild(grid);
  const cs=el(`<div class="counts"><span class="hint">여러 번 시전</span></div>`);
  for(let n=2;n<=6;n++){ const b=el(`<button>${n}회</button>`);
    b.onclick=ev=>{ ev.stopPropagation(); if(sel.skill!=null) pickCount(n); };
    cs.appendChild(b) }
  if(sel.step===4&&sel.skill!=null){
    const cur=h.sk[sel.skill], pin=pinnedFoe(h,cur);
    if(cur.tg==="self"||pin){
      const go=el(`<button class="go" style="margin-left:10px">시전 ×${sel.count}</button>`);
      go.onclick=ev=>{ ev.stopPropagation(); doSkill(cur.tg==="self"?null:pin.slot) };
      cs.appendChild(go);
    }
  }
  cs.appendChild(el(`<span class="grow"></span>`));
  const esc2=el(`<button>취소 (Esc)</button>`);
  esc2.onclick=()=>{ sel=null; render() };
  cs.appendChild(esc2);
  p.appendChild(cs);
  return p;
}

/* ─ 비용 ─ */
function reachOf(h,sk){
  if(!sk) return null;
  if(h.name==="카제"&&sk.n==="진선풍도"){
    if(h.tag.noRange) return null;
    const every=(h.potential&&h.tag.potentialEvery)||h.tag.windEvery||3;
    const strong=h.tag.alwaysStrong||(((h.windUses||0)+1)%every===0);
    return (strong?3:sk.rng)+(h.windBuff||0);
  }
  return sk.rng||null;
}
function inReach(h,sk,slot){
  const r=reachOf(h,sk);
  return r==null || dist(h.slot,slot)<=r;
}
function farthestFoe(h){
  const p=openFoes(), q=p.length?p:B.foes.filter(f=>f.alive);
  return q.sort((a,b)=>dist(h.slot,b.slot)-dist(h.slot,a.slot))[0];
}
function nearestFoe(h){
  const p=openFoes(), q=p.length?p:B.foes.filter(f=>f.alive);
  return q.sort((a,b)=>dist(h.slot,a.slot)-dist(h.slot,b.slot))[0];
}
function pinnedFoe(h,sk){
  if(!sk) return null;
  if(sk.farshot) return farthestFoe(h);
  if(sk.nearest) return nearestFoe(h);
  return null;
}
function validTarget(h,sk,slot){
  if(!inReach(h,sk,slot)) return false;
  { const f2=foeAt(slot);
    if(f2&&foeBlockReason(f2)) return false; }
  if(deb(h,"fear")){ const f2=foeAt(slot); if(f2&&uid(f2)===h.fearSrc) return false }
  const p=pinnedFoe(h,sk);
  if(p) return p.slot===slot;
  return true;
}
function payCost(h,i){
  const s=h.sk[i];
  if(h===0) return s.cost;
  if(s.costType==="mom") return s.cost+(s.rise?h.airUp:0);
  if(s.costType==="scale") return s.cost;
  if(h.name==="카제"&&i===1&&h.free>0) return 0;
  if(h.tag.freeCut&&i===0&&h.guarded) return 0;
  return s.cost;
}
function canPay(h,i,n){
  const s=h.sk[i];
  if(s.limit&&(h.limitUsed[i]||0)+n>s.limit) return false;
  if(s.costType==="mom"){
    if(!s.rise) return h.mom>=s.cost*n;
    let need=0,up=h.airUp; for(let k=0;k<n;k++){need+=s.cost+up;up++} return h.mom>=need }
  if(s.costType==="scale") return (h.scale||0)>=s.cost*n;
  if(s.ammo) return (h.ammo||0)>=n;
  let need=0,free=h.free,guard=h.guarded;
  for(let k=0;k<n;k++){
    if(h.name==="카제"&&i===1&&free>0){ free--; continue }
    if(h.tag.freeCut&&i===0&&guard){ guard=0; continue }
    need+=s.cost;
  }
  return h.mana>=need;
}

/* ─ 입력 ─ */
function pickUnit(s){
  if(B.over) return; const h=unitAt(s); if(!h) return;
  sel={hero:h,slot:s,step:2,skill:null,count:1}; render();
}
function pickSkill(i,count){
  const h=sel.hero, s=h.sk[i];
  if((i===2&&h.lv<UNLOCK[2])||(i===3&&h.lv<UNLOCK[3])){ say("아직 해제되지 않은 기술입니다.","t2"); return }
  if(h.lock[i]){ say(`${s.n}${jo(s.n,"eun")} ${h.lock[i]}턴 동안 잠금 상태입니다.`,"t2"); return }
  /* 이미 고른 기술을 다시 누르면 시전 횟수가 하나씩 늘어난다 */
  if(sel.skill===i&&sel.step===4){
    if(s.lock){ say(`${s.n}${jo(s.n,"eun")} 잠금 기술이라 한 번만 쓸 수 있습니다.`,"t2"); return }
    const n=(sel.count||1)+1;
    if(s.limit&&(h.limitUsed[i]||0)+n>s.limit){
      say(`${s.n}의 사용한도를 넘습니다.`,"t2"); return }
    if(!canPay(h,i,n)){ say(`${s.n}${jo(s.n,"eul")} ${n}회 쓸 자원이 모자랍니다.`,"t2"); return }
    sel.count=n; SFX.play("click"); render(); return;
  }
  sel.skill=i;
  if(count!=null){ pickCount(count); return }
  sel.step=3; render();
}
function pickCount(n){
  const h=sel.hero, s=h.sk[sel.skill];
  if(s.lock&&n>1){ say(`${s.n}${jo(s.n,"eun")} 잠금 기술이라 한 번만 쓸 수 있습니다.`,"t2"); n=1 }
  if(!canPay(h,sel.skill,n)){ say(`${s.n} ${n}회를 쓸 자원이 부족합니다.`,"t2"); return }
  sel.count=n; sel.step=4; render();
}
(function(){
  let tip=null;
  const box=()=>tip||(tip=document.getElementById("kwtip"));
  function show(el2){
    const k=el2.dataset.kw, d=KW_DESC[k]; if(!d) return;
    const b=box(); if(!b) return;
    const c=KW_COLOR[KW[k]]||KW_COLOR.plain;
    b.innerHTML='<b style="color:'+c+'">'+esc(k)+'</b>'+esc(d);
    b.style.display="block";
    const r=el2.getBoundingClientRect(), w=b.offsetWidth, h=b.offsetHeight;
    let x=r.left+r.width/2-w/2, y=r.top-h-9;
    if(y<6) y=r.bottom+9;
    b.style.left=Math.max(6,Math.min(innerWidth-w-6,x))+"px";
    b.style.top=Math.max(6,Math.min(innerHeight-h-6,y))+"px";

  function hide(){ const b=box(); if(b) b.style.display="none" }
  document.addEventListener("mouseover",e=>{
    const t=e.target.closest&&e.target.closest(".kw[data-kw]");
    if(t) show(t);
  });
  document.addEventListener("mouseout",e=>{
    if(e.target.closest&&e.target.closest(".kw[data-kw]")) hide();
  });
  document.addEventListener("click",e=>{
    const t=e.target.closest&&e.target.closest(".kw[data-kw]");
    if(t) show(t); else hide();
  },true);
  window.addEventListener("scroll",hide,true);
