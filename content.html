<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font:14px system-ui}</style></head><body>
<title>균열 증축 대장</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap">
<style>
:root{
  --ink:#e9e0d2; --dim:#a89c8c; --faint:#736a5e;
  --ground:#0e0c0b; --panel:#171412; --panel2:#1f1a16; --rule:#312a23; --rule2:#443a30;
  --brass:#c9a227; --blood:#a8453a; --moon:#8f86c9; --leaf:#7fa86a; --sea:#5fa8b8;
  --g1:#9c8d77; --g2:#e0a86a; --g3:#e0705a; --g4:#a06ae0; --g5:#5fd8cf;
  --serif:'Nanum Myeongjo',Batang,serif;
  --sans:'IBM Plex Sans KR','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ink:#191310; --dim:#5a5045; --faint:#8a8074;
    --ground:#f2ece1; --panel:#fbf6ec; --panel2:#efe7d9; --rule:#d9cdb9; --rule2:#c2b39c;
  }
}
:root[data-theme="light"]{
  --ink:#191310; --dim:#5a5045; --faint:#8a8074;
  --ground:#f2ece1; --panel:#fbf6ec; --panel2:#efe7d9; --rule:#d9cdb9; --rule2:#c2b39c;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-weight:300;
  line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:0 22px 120px}

header.top{padding:52px 0 26px}
.eyebrow{font-size:11px;letter-spacing:.36em;color:var(--brass);font-weight:500;margin-bottom:15px}
h1{font-family:var(--serif);font-weight:800;font-size:clamp(30px,5vw,50px);margin:0 0 12px;
  letter-spacing:.16em;text-wrap:balance}
.lede{max-width:64ch;color:var(--dim);font-size:15px;margin:0 0 8px}
.lede b{color:var(--ink);font-weight:500}
.tally{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--rule)}
.tally div{font-variant-numeric:tabular-nums}
.tally b{display:block;font-family:var(--serif);font-size:26px;font-weight:800;color:var(--brass);line-height:1.1}
.tally span{font-size:11.5px;color:var(--faint);letter-spacing:.08em}

.bar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--ground) 93%,transparent);
  backdrop-filter:blur(10px);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:10px 0;margin-bottom:8px}
.bar .in{max-width:1240px;margin:0 auto;padding:0 22px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#q{font:inherit;font-size:13px;padding:7px 12px;background:var(--panel);border:1px solid var(--rule2);
  border-radius:3px;color:var(--ink);width:210px}
#q:focus{outline:2px solid var(--brass);outline-offset:1px}
.tabs{display:flex;gap:5px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:11.5px;padding:5px 10px;background:transparent;color:var(--dim);
  border:1px solid var(--rule);border-radius:3px;cursor:pointer;transition:.13s;white-space:nowrap}
.tabs button:hover{color:var(--ink);border-color:var(--rule2)}
.tabs button.on{background:var(--brass);color:#17120a;border-color:var(--brass);font-weight:600}
.tabs button i{font-style:normal;opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.hit{margin-left:auto;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}

section.cat{margin-top:38px;scroll-margin-top:64px}
section.cat > h2{font-family:var(--serif);font-size:22px;font-weight:800;letter-spacing:.1em;
  margin:0 0 4px;display:flex;align-items:baseline;gap:10px}
section.cat > h2 em{font-style:normal;font-size:12px;color:var(--brass);letter-spacing:.14em;font-family:var(--sans);font-weight:500}
section.cat > .sub{color:var(--dim);font-size:13px;margin:0 0 16px;max-width:76ch}

.rows{border-top:1px solid var(--rule)}
.row{display:grid;grid-template-columns:26px 220px 74px 1fr;gap:12px;align-items:start;
  padding:9px 8px 9px 4px;border-bottom:1px solid var(--rule);cursor:pointer;transition:background .12s}
.row:hover{background:var(--panel)}
.row.on{background:color-mix(in srgb,var(--brass) 11%,transparent)}
.row .star{color:var(--rule2);font-size:14px;line-height:1.5;text-align:center;user-select:none}
.row.on .star{color:var(--brass)}
.row .nm{font-weight:500;font-size:13.8px;letter-spacing:.01em;word-break:keep-all}
.row .nm small{display:block;font-weight:300;font-size:11px;color:var(--faint);letter-spacing:.02em;margin-top:1px}
.row .tag{font-size:10.5px;letter-spacing:.06em;padding:2px 0;color:var(--faint);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.row .tag b{display:inline-block;padding:1px 6px;border-radius:2px;font-weight:600;font-size:10px;
  border:1px solid currentColor}
.g-하급{color:var(--g1)} .g-중급{color:var(--g2)} .g-상급{color:var(--g3)}
.g-희귀{color:var(--g4)} .g-전설{color:var(--g5)} .g-파편{color:var(--faint)}
.g-1스테이지{color:var(--leaf)} .g-2스테이지{color:var(--sea)} .g-3스테이지{color:var(--blood)}
.g-일반{color:var(--g1)} .g-정예{color:var(--g2)} .g-우두머리{color:var(--g3)}
.row .ef{font-size:13px;color:var(--dim);line-height:1.55}
.row .ef u{text-decoration:none;color:var(--ink);font-weight:400}
.row .ef i{font-style:normal;display:block;color:var(--faint);font-size:11.8px;margin-top:3px}
@media (max-width:780px){
  .row{grid-template-columns:24px 1fr;gap:8px}
  .row .tag{grid-column:2}
}

.hero{border:1px solid var(--rule);background:var(--panel);border-radius:4px;padding:14px 16px;margin-bottom:10px}
.hero h3{font-family:var(--serif);font-size:17px;font-weight:800;margin:0 0 2px;letter-spacing:.05em}
.hero .role{font-size:11.5px;color:var(--brass);letter-spacing:.1em;margin-bottom:8px}
.hero .ps{font-size:12.8px;color:var(--dim);margin:0 0 9px}
.hero .ps b{color:var(--ink);font-weight:500}
.hero ol{margin:0;padding-left:19px;font-size:12.6px;color:var(--dim)}
.hero ol li{margin-bottom:3px}
.hero ol li b{color:var(--ink);font-weight:500}
.heroes{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}

.tray{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--panel);
  border-top:1px solid var(--brass);padding:11px 22px;display:none}
.tray.on{display:block}
.tray .in{max-width:1240px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tray b{font-family:var(--serif);font-size:14px;letter-spacing:.06em;white-space:nowrap}
.tray .l{flex:1;font-size:12.4px;color:var(--dim);min-width:180px;
  max-height:44px;overflow:auto}
.tray button{font:inherit;font-size:12px;padding:7px 14px;background:var(--brass);color:#17120a;
  border:0;border-radius:3px;cursor:pointer;font-weight:600}
.tray button.ghost{background:transparent;color:var(--dim);border:1px solid var(--rule2)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
<header class="top">
  <div class="eyebrow">균 열 · 증 축 대 장</div>
  <h1>증 축 대 장</h1>
  <p class="lede">지금 굴러가는 시스템 위에 <b>바로 얹을 수 있는</b> 것만 모았습니다. 이미 있는 자원(오염도·활동량·추진력·영혼)과 키워드(보호막·에너지 보호막·부정 보호막·갑피·가시·감염·표식·은신·도발·관통·흡수)를 재료로 쓰도록 썼으니, 대부분은 표 한 줄과 효과 함수 한 줄이면 붙습니다.</p>
  <p class="lede">쓸 만한 줄을 눌러 담고, 아래 <b>담은 것 복사</b>로 가져가세요. 그대로 기획 노트에 붙이거나 저에게 주시면 됩니다.</p>
  <div class="tally" id="tally"></div>
</header>
</div>

<div class="bar"><div class="in">
  <input id="q" type="search" placeholder="이름·효과 찾기">
  <div class="tabs" id="tabs"></div>
  <span class="hit" id="hit"></span>
</div></div>

<div class="wrap" id="body"></div>

<div class="tray" id="tray"><div class="in">
  <b>담은 것</b><span class="l" id="tl"></span>
  <button id="cp">담은 것 복사</button>
  <button class="ghost" id="cl">비우기</button>
</div></div>

<script>
/* [이름, 등급/단계, 효과, 덧말] */
const DATA=[
{k:'공용 보상 · 하급', desc:'레벨 1~12에서 가장 자주 뜨는 자리. 한 줄로 읽히고, 한 판 안에서 체감돼야 합니다.', items:[
['무딘 숫돌','하급','1번 기술의 피해가 영구히 1 증가합니다.','전 영웅 공통이라 어떤 조합에서도 버려지지 않습니다'],
['가죽 각반','하급','이동할 때마다 보호막을 1 얻습니다.','이동 기술을 쓰는 카제·오토·이테리오에게 값이 붙습니다'],
['응급 붕대','하급','전투 시작 시 체력을 3 회복합니다.','라운드가 아니라 전투 단위라 여러 라운드짜리 던전에서 약합니다'],
['굳은살','하급','최대 체력을 2, 보호력을 1 얻습니다.','가장 밋밋한 안전패. 후반 뽑기 물타기용'],
['잔불','하급','전투 시작 시 무작위 적 하나에게 화상을 2 부여합니다.',''],
['헐거운 자물쇠','하급','전투가 끝날 때 금화를 2 더 얻습니다.','상점 밀도가 높은 2스테이지에서 값이 오릅니다'],
['첫 수','하급','매 라운드 첫 기술의 마나 비용이 1 줄어듭니다.','고비용 궁극기를 앞당깁니다'],
['짧은 호흡','하급','턴이 끝날 때 추진력을 1 얻습니다.',''],
['낡은 부적','하급','전투 시작 시 부정 보호막을 1 얻습니다.','이미 있는 하급 보상과 겹치므로 둘 중 하나로 통합 검토'],
['곁눈질','하급','전투 시작 시 체력이 가장 낮은 적에게 표식을 남깁니다.','이테리오 밖에서도 표식이 의미를 갖게 하는 첫 걸음'],
['깨진 방패 조각','하급','전투 중 보호막을 처음 얻을 때 3 더 얻습니다.',''],
['걸음쇠','하급','하루에 한 번, 활동량을 쓰지 않고 한 칸 이동합니다.','필드 자원에 손대는 유일한 하급'],
['마른 장작','하급','화상이 걸린 적에게 주는 피해가 2 증가합니다.',''],
['헝겊 인형','하급','전투당 한 번, 쓰러질 피해를 받으면 체력 1로 버팁니다.','상급 불굴의 맹세의 축소판'],
['눈먼 손','하급','무작위 파편 아이템을 하나 얻습니다.',''],
['곰팡이 빵','하급','빵 카드를 2장 얻고, 오염도가 3 오릅니다.','대가가 붙은 하급 — 이 결이 더 많아도 좋습니다'],
['도살자의 눈','하급','체력이 30% 이하인 적에게 주는 피해가 3 증가합니다.',''],
['잰걸음','하급','전투 시작 시 추진력을 2 얻습니다.',''],
['종소리','하급','두 턴마다 턴 시작 시 마나를 1 얻습니다.',''],
['검댕','하급','은신 중에 주는 피해가 3 증가합니다.','그슨대 전용에 가깝지만 공용으로 두면 조합의 값이 생깁니다'],
['녹슨 못','하급','가시를 1 얻습니다. 가시 피해가 적을 처치하면 금화를 1 얻습니다.',''],
['얇은 실','하급','소환물의 최대 체력이 3 증가합니다.',''],
['빈 병','하급','휴식소에서 회복량이 10% 증가합니다.',''],
['젖은 심지','하급','전투 시작 시 마나를 1 더 얻지만, 그 전투 동안 최대 체력이 2 줄어듭니다.',''],
['모서리 돌','하급','앞자리(1~2번)에 서 있으면 보호력이 2 증가합니다.','자리 개념에 값을 붙이는 축'],
['뒷문','하급','뒷자리(4~5번)에 서 있으면 회피를 1 얻습니다.',''],
]},

{k:'공용 보상 · 중급', desc:'판을 굽히는 자리. 하나의 규칙을 바꾸거나, 자원을 다른 자원으로 환전합니다.', items:[
['피 묻은 저울','중급','잃은 체력 5마다 공격력이 1 증가합니다.','저체력 운용을 처음으로 보상하는 축'],
['두 번째 숨','중급','전투당 한 번, 체력이 절반 아래로 떨어지면 마나를 모두 회복합니다.',''],
['거울 조각','중급','전투 시작 시 얻는 보호막이 두 배가 됩니다.','전장의 방패·소형 방패 계열과 붙습니다'],
['빚문서','중급','금화를 20 얻습니다. 이후 전투 승리 금화가 30% 줄어듭니다.','앞을 당겨 쓰는 선택'],
['재의 서약','중급','오염도가 50 이상이면 공격력·마법력이 4 증가합니다.','오염도를 위험이 아니라 자원으로 바꾸는 축'],
['사슬 갈고리','중급','기술로 적을 처치하면 그 적의 자리로 이동합니다.','자리 이동을 공격에 얹습니다'],
['징 박힌 장갑','중급','가시 피해가 두 배가 됩니다.',''],
['해묵은 지도','중급','미지의 구역에서 선택지를 하나 더 볼 수 있습니다.','이벤트에 값을 붙이는 첫 보상'],
['숨은 칼','중급','매 전투의 첫 공격은 반드시 치명타가 됩니다.',''],
['전당포 계약','중급','상점에서 아이템을 되팔 수 있게 됩니다. (구매가의 60%)','상점 구조를 넓힙니다'],
['불면','중급','밤에 이동해도 습격당하지 않습니다. 대신 하루가 지날 때 오염도가 5 더 오릅니다.',''],
['영혼 저울','중급','적이 죽을 때마다 영혼을 1 얻습니다. 영혼 10마다 최대 체력이 1 증가합니다.','쿠렘타이 전용 자원을 공용으로 개방'],
['겹친 판금','중급','갑피를 2 얻습니다. 갑피가 피해를 잘라낼 때마다 보호막을 2 얻습니다.',''],
['메아리','중급','전투당 한 번, 마지막에 쓴 기술을 마나 없이 한 번 더 씁니다.',''],
['조율','중급','기술을 세 번 쓸 때마다 무작위 아군이 체력을 3 회복합니다.',''],
['늑대의 시간','중급','밤에는 공격력이 5 증가하고, 낮에는 보호력이 5 증가합니다.','시간대를 처음으로 전투에 끌어들입니다'],
['녹슨 톱니','중급','턴이 끝날 때 추진력 3을 소모해 모든 적에게 피해 4를 줍니다.',''],
['봉인된 상자','중급','다음 세 번의 보상 상자에서 아이템 확률이 두 배가 됩니다.',''],
['거머리 반지','중급','흡수 10%를 항상 유지합니다.',''],
['부러진 나침반','중급','전투가 끝날 때 오염도가 5 더 줄어듭니다.',''],
['헌 갑주','중급','최대 체력을 12 얻고, 회피를 얻을 수 없게 됩니다.',''],
['거래의 증표','중급','상점 물건값이 25% 싸집니다.',''],
['속삭임','중급','전투 시작 시 무작위 적 하나에게 공포를 2 부여합니다.',''],
['쌍둥이 심장','중급','소환물이 죽으면 절반 체력으로 한 번 되살아납니다. (전투당 1회)',''],
['먹구름','중급','전투 시작 시 모든 적에게 마법약화를 1 부여합니다.',''],
['각인','중급','같은 기술을 연달아 쓰면 두 번째부터 피해가 2씩 누적 증가합니다. (턴 종료 시 초기화)',''],
]},

{k:'공용 보상 · 상급', desc:'한 판의 방향을 정하는 자리. 다른 보상을 다시 읽게 만들어야 합니다.', items:[
['균열의 심장','상급','전투 시작 시 균열 차원문을 무작위 아군 칸과 적 칸에 하나씩 설치합니다.',''],
['불멸의 서약','상급','쓰러져도 다음 라운드에 최대 체력의 30%로 일어섭니다. (전투당 1회)',''],

{k:'새 영웅', desc:'현재 11명 위에 얹을 후보. 지속 기술 + 1~4번 기술로 요약했습니다.', hero:true, items:[

{n:'리안',r:'종군 기사 · 자리를 지킨다',p:'<b>진형</b> — 같은 칸에 두 턴 이상 서 있으면 보호력이 3 증가합니다.',

{n:'셀',r:'주술사 · 저주를 심는다',p:'<b>낙인</b> — 마법 피해를 준 적에게 낙인이 쌓입니다. 낙인 3에서 그 적은 받는 모든 피해가 30% 늘어납니다.',

{n:'노아',r:'사냥개지기 · 소환물로 싸운다',p:'<b>무리</b> — 소환물이 많을수록 노아의 공격력이 소환물 수만큼 증가합니다.',

{k:'새 적 — 일반', desc:'스테이지 분위기에 맞춰 나눴습니다. 각각 하나의 규칙을 플레이어에게 가르칩니다.', items:[
['들개 무리','1스테이지 · 일반','거리 1 안의 아군을 3회 연타. 다른 들개가 살아 있으면 피해 +2.','다중 타격을 가르칩니다'],
['부패한 나무','1스테이지 · 일반','움직이지 않음. 매 턴 모든 적에게 보호막 3.','뒤를 노리게 만듭니다'],
['늪지 손','1스테이지 · 일반','가장 앞 아군에게 속박 2.','이동 봉쇄를 가르칩니다'],
['까마귀 떼','1스테이지 · 일반','회피 2로 시작. 죽을 때 다른 적 하나에게 회피 2를 넘깁니다.',''],
['녹은 갑주','2스테이지 · 일반','가시 4. 받은 피해의 절반만큼 다음 턴 공격력이 오릅니다.',''],
['물귀신','2스테이지 · 일반','뒷자리 아군을 앞으로 끌어당기고 피해 6.','자리 배치를 흔듭니다'],
['부러진 종','2스테이지 · 일반','매 3턴마다 아군 전원 마나 -1.','자원 압박'],
['거울 벌레','2스테이지 · 일반','받은 마법 피해를 그대로 되돌립니다. 공격 피해는 그대로 받습니다.','속성 구분을 가르칩니다'],
['재의 사제','3스테이지 · 일반','매 턴 다른 적 하나의 상태 이상을 제거합니다.','우선 처치 대상을 만듭니다'],
['얼어붙은 시종','3스테이지 · 일반','죽을 때 인접한 아군에게 냉각 4.',''],
['눈먼 감시자','3스테이지 · 일반','은신한 아군만 노립니다. 은신이 없으면 방어만 합니다.',''],
['무거운 죄수','3스테이지 · 일반','도발. 최대 체력이 매우 높고 공격이 낮음. 죽을 때 아군 전원 오염도 +5.',''],
['균열 포자','전 구역 · 일반','죽을 때 같은 칸에 균열 포자를 하나 더 남깁니다. (최대 2회)',''],
['빚쟁이','전 구역 · 일반','공격할 때마다 금화를 1 훔칩니다. 처치하면 훔친 만큼 돌려받습니다.',''],
]},

{k:'새 적 — 정예 · 우두머리', desc:'정예는 규칙 하나를 비틀고, 우두머리는 판 전체를 재편합니다.', items:[

['숲의 어미','1스테이지 · 정예','매 턴 들개를 하나 소환합니다. 소환물 수만큼 보호막.',''],
['녹슨 심판관','2스테이지 · 정예','아군이 보호막을 얻으면 그만큼 피해를 줍니다.','보호막 중심 운용을 벌합니다'],
['물에 잠긴 성가대','2스테이지 · 정예','셋이 함께 나옵니다. 셋이 다 살아 있으면 매 턴 아군 전원에게 피해 4.',''],
['얼음 조각가','3스테이지 · 정예','아군 하나를 매 턴 얼립니다. (기술 하나 잠금)',''],
['균열을 먹은 자','3스테이지 · 정예','아군이 쓴 기술을 다음 턴에 그대로 되돌려줍니다.',''],
['숲의 왕','1스테이지 · 우두머리','2페이즈. 1페이즈는 나무 형태로 움직이지 않고 소환만, 체력 절반에서 뿌리를 뽑고 돌진합니다.','현 간수장 대체 또는 추가'],
['잠긴 문','2스테이지 · 우두머리','문 자체는 무적. 양옆의 자물쇠 둘을 부숴야 열립니다. 자물쇠는 매 3턴마다 되살아납니다.','구조 퍼즐형'],
['천 개의 얼굴','3스테이지 · 우두머리','매 턴 아군 하나의 모습과 기술을 복사합니다.','플레이어의 조합을 되돌려줍니다'],
['균열 그 자체','최종 · 우두머리','체력 대신 오염도를 씁니다. 오염도를 0으로 만들면 승리합니다.','승리 조건을 뒤집는 마지막'],
]},

{k:'미지의 구역 이벤트', desc:'지금 표에 없는 상황들. 대부분 선택지 2~3개, 하나는 반드시 대가가 있습니다.', items:[
['목매단 나무','이벤트','시체의 주머니를 뒤진다 (금화 8~14, 오염도 +12) / 묻어 준다 (오염도 -15) / 지나친다',''],
['우물 속 목소리','이벤트','금화를 던진다 (금화 -10, 무작위 중급 보상) / 귀를 기울인다 (오염도 +20, 상급 보상) / 덮는다',''],
['눈먼 대장장이','이벤트','제련석 3을 준다 (아이템 하나 등급 상승) / 손을 빌려준다 (활동량 -3, 아이템 무작위 조합)',''],

/* ── 화면 ── */
const body=document.getElementById('body');
const tabs=document.getElementById('tabs');
let PICK={}; try{ PICK=JSON.parse(localStorage.getItem('gyunyeol_content_pick')||'{}') }catch(e){ PICK={} }
let CAT='전체', Q='';

const total=DATA.reduce((a,c)=>a+c.items.length,0);
document.getElementById('tally').innerHTML=
  '<div><b>'+total+'</b><span>제안 항목</span></div>'+
  '<div><b>'+DATA.length+'</b><span>분류</span></div>'+
  '<div><b>'+DATA.find(d=>d.hero).items.length+'</b><span>새 영웅</span></div>'+
  '<div><b>'+DATA.filter(d=>/보상/.test(d.k)).reduce((a,c)=>a+c.items.length,0)+'</b><span>보상 안</span></div>'+
  '<div><b>'+DATA.find(d=>d.k==='미지의 구역 이벤트').items.length+'</b><span>이벤트</span></div>';

function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function key(cat,name){ return cat+'|'+name }

function tabsHtml(){
  tabs.innerHTML='';
  const mk=(label,n,v)=>{ const b=document.createElement('button');
    b.innerHTML=esc(label)+(n!=null?'<i>'+n+'</i>':'');
    if(CAT===v) b.classList.add('on');
    b.onclick=()=>{ CAT=v; render() }; tabs.appendChild(b) };
  mk('전체',total,'전체');
  DATA.forEach(d=>mk(d.k.replace(/^.*· /,''),d.items.length,d.k));
  mk('담은 것',Object.keys(PICK).length,'담은 것');
}

function match(cat,it){
  if(CAT==='담은 것') { if(!PICK[key(cat,it.hero?it.n:it[0])]) return false }
  else if(CAT!=='전체'&&CAT!==cat) return false;
  if(!Q) return true;
  const s=(it.hero?[it.n,it.r,it.p,(it.s||[]).join(' ')]:it).join(' ').toLowerCase();
  return s.indexOf(Q)>=0;
}

function render(){
  tabsHtml();
  body.innerHTML='';
  let shown=0;
  DATA.forEach(d=>{
    const list=d.items.filter(it=>match(d.k,d.hero?Object.assign(it,{hero:1}):it));
    if(!list.length) return;
    shown+=list.length;
    const sec=document.createElement('section'); sec.className='cat';
    sec.innerHTML='<h2>'+esc(d.k)+'<em>'+list.length+'항목</em></h2><p class="sub">'+esc(d.desc)+'</p>';
    if(d.hero){
      const wrap=document.createElement('div'); wrap.className='heroes';
      list.forEach(h=>{
        const c=document.createElement('div'); c.className='hero';
        const k=key(d.k,h.n);
        c.innerHTML='<h3>'+(PICK[k]?'★ ':'')+esc(h.n)+'</h3><div class="role">'+esc(h.r)+'</div>'+
          '<p class="ps">'+h.p+'</p><ol>'+h.s.map(x=>'<li>'+x+'</li>').join('')+'</ol>';
        c.style.cursor='pointer';
        if(PICK[k]) c.style.borderColor='var(--brass)';
        c.onclick=()=>{ if(PICK[k]) delete PICK[k]; else PICK[k]=d.k+' · '+h.n+' — '+h.r; save(); render() };
        wrap.appendChild(c);
      });
      sec.appendChild(wrap);
    }else{
      const rows=document.createElement('div'); rows.className='rows';
      list.forEach(it=>{
        const [nm,tag,ef,note]=it;
        const k=key(d.k,nm);
        const r=document.createElement('div');
        r.className='row'+(PICK[k]?' on':'');
        r.innerHTML='<div class="star">'+(PICK[k]?'★':'☆')+'</div>'+
          '<div class="nm">'+esc(nm)+'</div>'+
          '<div class="tag"><b class="g-'+esc(tag.split(' · ').pop())+'">'+esc(tag)+'</b></div>'+
          '<div class="ef"><u>'+esc(ef)+'</u>'+(note?'<i>'+esc(note)+'</i>':'')+'</div>';
        r.onclick=()=>{ if(PICK[k]) delete PICK[k]; else PICK[k]=d.k+' · '+nm+' — '+ef; save(); render() };
        rows.appendChild(r);
      });
      sec.appendChild(rows);
    }
    body.appendChild(sec);
  });
  document.getElementById('hit').textContent=shown+' / '+total+'항목';
  tray();
}
function save(){ try{ localStorage.setItem('gyunyeol_content_pick',JSON.stringify(PICK)) }catch(e){} }
function tray(){
  const n=Object.keys(PICK).length;
  document.getElementById('tray').classList.toggle('on',n>0);
  document.getElementById('tl').textContent=Object.values(PICK).map(v=>v.split(' — ')[0]).join(' · ');
}
document.getElementById('q').oninput=e=>{ Q=e.target.value.trim().toLowerCase(); render() };
document.getElementById('cp').onclick=()=>{
  const ta=document.createElement('textarea');
  ta.value='균열 — 채택 후보\n\n'+Object.values(PICK).map(v=>'• '+v).join('\n');
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy') }catch(e){}
  ta.remove();
  const b=document.getElementById('cp'), o=b.textContent;
  b.textContent='복사됨'; setTimeout(()=>b.textContent=o,1200);
};
document.getElementById('cl').onclick=()=>{ PICK={}; save(); render() };
render();
</script>

</body></html>
