<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>기획 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap">

<style id="appStyle">
/* 단일 테마: 어두운 다크판타지 세계관에 맞춰 의도적으로 하나의 룩만 유지.
   모든 색을 토큰으로 명시해 호스트 배경에 영향을 받지 않게 함. */
:root{
  --ink:#14110e; --panel:#1c1815; --raise:#252019; --rule:#3a3128; --rule2:#4a3e31;
  --fg:#e7dcc8; --dim:#9c8d77; --faint:#6d6252;
  --brass:#c9a227; --blood:#8e2b2b; --moss:#6f8f5e;
  --k-debuff:#b48ce0; --k-buff:#e0c060; --k-atk:#e0705a; --k-mag:#6aa8e0;
  --k-def:#e0c85a; --k-hp:#7fd39a; --k-move:#5fd8cf; --k-mana:#5f8fe0; --k-plain:#9c8d77; --k-skill:#e08a3c;
  --warn:#e0a86a;
  --s1:4px; --s2:8px; --s3:12px; --s4:18px; --s5:28px;
  --serif:"Noto Serif KR",serif;
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--sans);
  font-size:14px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:var(--fg)}
input,select,textarea{background:var(--raise);border:1px solid var(--rule);border-radius:3px;
  padding:8px 10px;width:100%;transition:border-color .12s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brass)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,
.item:focus-visible,.chip:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
textarea{resize:vertical;min-height:64px;line-height:1.7}
button{background:var(--raise);border:1px solid var(--rule);border-radius:3px;
  padding:7px 12px;cursor:pointer;transition:border-color .12s,color .12s}
button:hover{border-color:var(--brass);color:var(--brass)}
button:disabled{opacity:.4;cursor:default}
button:disabled:hover{border-color:var(--rule);color:var(--fg)}
button.mini{padding:3px 9px;font-size:12px}
button.danger:hover{border-color:var(--blood);color:#e08d8d}
button.go{background:var(--brass);color:#1a1510;border-color:var(--brass);font-weight:700}
button.go:hover{color:#1a1510;filter:brightness(1.1)}

/* ── 헤더 ── */
header{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;
  padding:10px var(--s4);background:var(--panel);border-bottom:1px solid var(--rule);
  position:sticky;top:0;z-index:30}
.mark{font-family:var(--serif);font-weight:700;font-size:17px;letter-spacing:.14em;
  color:var(--brass);white-space:nowrap;margin:0}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{border:none;background:none;border-radius:0;padding:6px 13px;
  border-bottom:2px solid transparent;color:var(--dim);letter-spacing:.04em}
nav button:hover{color:var(--fg)}
nav button.on{color:var(--brass);border-bottom-color:var(--brass)}
.grow{flex:1 1 auto}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 11px;
  border-radius:99px;border:1px solid var(--rule);color:var(--dim);white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.dirty{color:var(--brass);border-color:#5c4a1f}
.pill.ok{color:var(--moss);border-color:#3b4d33}
.pill.bad{color:#d98a8a;border-color:#5a3030}
.pill.busy{color:var(--dim)}
@media (prefers-reduced-motion:no-preference){
  .pill.busy .dot{animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
}

/* ── 레이아웃 ── */
.layout{display:flex;align-items:flex-start;min-height:calc(100vh - 54px)}
.rail{width:236px;flex:none;background:var(--panel);border-right:1px solid var(--rule);
  padding:var(--s3);position:sticky;top:54px;max-height:calc(100vh - 54px);overflow-y:auto;
  display:flex;flex-direction:column;gap:var(--s2)}
.railList{display:flex;flex-direction:column;gap:2px}
.item{padding:8px 10px;border-radius:3px;cursor:pointer;border:1px solid transparent;
  border-left:2px solid transparent;text-align:left;background:none;width:100%}
.item:hover{background:var(--raise)}
.item.on{background:var(--raise);border-left-color:var(--brass);color:var(--brass)}
.item b{font-weight:500;display:block}
.item small{display:block;color:var(--faint);font-size:11px;line-height:1.4}
.item.on small{color:var(--dim)}
main{flex:1 1 0;min-width:0;padding:var(--s5) var(--s5) 80px;max-width:940px}

/* ── 오른쪽 간략 보기 ── */
.peek{width:352px;flex:none;align-self:flex-start;position:sticky;top:54px;
  max-height:calc(100vh - 54px);overflow-y:auto;padding:var(--s5) var(--s4) 60px}
.pk{background:var(--panel);border:1px solid var(--rule);border-radius:5px;overflow:hidden}
.pk-hd{padding:13px 15px;background:var(--raise);border-bottom:1px solid var(--rule)}
.pk-nm{font-family:var(--serif);font-size:16px;font-weight:700;line-height:1.3}
.pk-ti{font-size:11.5px;color:var(--brass);letter-spacing:.06em;margin-top:1px}
.pk-row{display:flex;flex-wrap:wrap;gap:11px;align-items:center;margin-top:9px;font-size:12.5px}
.pk-row span{display:inline-flex;align-items:center;gap:4px}
.pk-focus{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.5}
.pk-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.pk-tag{font-size:10.5px;border:1px solid var(--rule2);border-radius:2px;padding:1px 6px;color:var(--dim)}
.pk-sec{font-size:10px;letter-spacing:.16em;color:var(--faint);padding:13px 15px 3px}
.pk-sk{padding:9px 15px;border-top:1px solid #2a241d}
.pk-h{display:flex;align-items:center;gap:6px;font-size:13px}
.pk-slot{font-size:10px;background:var(--rule2);color:#17130f;border-radius:2px;
  padding:1px 5px;flex:none;font-weight:700;letter-spacing:.04em}
.pk-n{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-cost{font-size:11.5px;color:var(--dim);display:inline-flex;align-items:center;gap:3px;flex:none}
.pk-d{font-size:12px;color:var(--dim);margin-top:5px;white-space:pre-wrap;line-height:1.65;
  word-break:break-word}
.pk-lock{font-size:10px;color:var(--faint);flex:none}
.pk-none{padding:9px 15px;font-size:12px;color:var(--faint)}
.modal{position:fixed;inset:0;background:rgba(11,9,8,.82);z-index:60;display:flex;
  align-items:center;justify-content:center;padding:18px}
.sheet{background:var(--panel);border:1px solid var(--rule2);border-radius:6px;
  width:min(760px,100%);max-height:92vh;overflow:auto;padding:var(--s4);
  display:flex;flex-direction:column;gap:var(--s3)}
.sheetHd{display:flex;align-items:center;gap:var(--s2);font-family:var(--serif);
  font-size:13px;letter-spacing:.14em;color:var(--brass)}
.sheet textarea{min-height:110px;font-family:ui-monospace,Consolas,monospace;
  font-size:11.5px;line-height:1.5}
.sheet .row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.localbar{background:#221a11;border-bottom:1px solid #5a4522;color:var(--warn);
  font-size:12.5px;padding:8px var(--s4);letter-spacing:.01em}
.localbar b{color:#f0c98a}
.sy-steps{display:flex;align-items:center;gap:5px;margin-top:10px}
.sy-step{font-size:12.5px;font-weight:700;color:var(--faint);border:1px solid var(--rule);
  border-radius:3px;padding:2px 11px;background:var(--ink);cursor:pointer}
.sy-step:hover{color:var(--fg);border-color:var(--rule2)}
.sy-step.on{color:#17130f;background:var(--brass);border-color:var(--brass)}
.sy-step.on:hover{color:#17130f}
.sy-arrow{color:var(--faint);font-size:10px}
.pk-sk.off{opacity:.5}
@media(max-width:1340px){ .peek{display:none} }

.panel{background:var(--panel);border:1px solid var(--rule);border-radius:4px;
  padding:var(--s4);margin-bottom:var(--s3)}
.panel > h2{font-family:var(--serif);margin:0 0 var(--s3);font-size:12px;font-weight:700;
  letter-spacing:.16em;color:var(--brass);display:flex;align-items:center;gap:var(--s2)}
.panel > h2 .grow{min-width:0}
.panel > h2 .acts{display:inline-flex;gap:var(--s2);align-items:center}
.grid{display:grid;gap:var(--s3)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
label{display:block;font-size:11px;color:var(--dim);margin-bottom:4px;letter-spacing:.06em}
.stack{display:flex;flex-direction:column;gap:var(--s3)}
.check{display:flex;align-items:center;gap:8px}
.check input{width:auto}

.entry{border:1px solid var(--rule);border-radius:3px;padding:var(--s3);background:var(--raise);
  display:flex;flex-direction:column;gap:var(--s3)}
.entry .top{display:flex;gap:var(--s2);align-items:center}
.tag{font-size:11px;color:var(--brass);border:1px solid var(--rule2);border-radius:2px;
  padding:1px 7px;white-space:nowrap;letter-spacing:.04em}

.preview{padding:9px 11px;background:var(--ink);border:1px solid var(--rule);
  border-left:2px solid var(--rule2);border-radius:2px;font-size:13px;white-space:pre-wrap;
  word-break:break-word}
.preview:empty{display:none}
.kw{font-weight:700}
.preview em,.pk-d em{font-style:italic}
.preview u,.pk-d u{text-decoration:underline;text-underline-offset:2px}
.preview strong,.pk-d strong{font-weight:700;color:var(--fg)}
.ref{font-weight:700;cursor:help;text-decoration:underline;text-decoration-style:dotted;
  text-decoration-color:var(--rule2);text-underline-offset:2px}
.ref.card{text-decoration-color:var(--brass)}   /* 카드 참조 */
/* (추가 † 2 ∴ 3) — 본문보다 한 단계 작게, 계수 표기임이 드러나게 */
.add{font-size:.82em;color:var(--dim);letter-spacing:.01em}
.ic{width:1.15em;height:1.15em;vertical-align:-.22em;flex:none}
.kw > .ic{margin-left:0}
.num{font-weight:700}                     /* 설명문 안의 숫자 */
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;padding:3px 9px;border:1px solid var(--rule);border-radius:99px;
  cursor:pointer;background:var(--raise);color:var(--dim);letter-spacing:.02em}
.chip:hover{border-color:currentColor}
.chipRow{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chipLbl{font-size:10.5px;color:var(--faint);letter-spacing:.1em;flex:none;min-width:54px}
.helper{display:flex;flex-direction:column;gap:6px}
.sub{border:1px solid var(--rule2);border-radius:3px;padding:var(--s3);
  display:flex;flex-direction:column;gap:var(--s3);background:#1a1613}
.sub > .subHd{font-size:11px;letter-spacing:.1em;color:var(--brass);display:flex;
  align-items:center;gap:var(--s2)}
.groupHd{font-size:10.5px;color:var(--faint);letter-spacing:.12em;
  padding:12px 4px 4px;flex:none;border-bottom:1px solid var(--rule);margin-bottom:2px}
.groupHd:first-child{padding-top:2px}
.slotRow{display:flex;align-items:center;gap:var(--s2)}
.slotNo{font-size:11px;color:var(--faint);flex:none;width:16px;text-align:right}
.warn{font-size:12.5px;color:var(--warn);border-left:2px solid #7a5a2a;
  padding:7px 11px;background:#211a11;border-radius:2px}
details.acc{border:1px solid var(--rule);border-radius:3px;background:var(--raise)}
details.acc > summary{padding:9px 12px;cursor:pointer;display:flex;align-items:center;
  gap:9px;list-style:none}
details.acc > summary::-webkit-details-marker{display:none}
details.acc > summary::before{content:"▸";color:var(--faint);flex:none;font-size:11px}
details.acc[open] > summary::before{content:"▾";color:var(--brass)}
details.acc > summary:hover{color:var(--brass)}
details.acc[open] > summary{border-bottom:1px solid var(--rule);color:var(--brass)}
details.acc .body{padding:var(--s3);display:flex;flex-direction:column;gap:var(--s3)}
summary .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
summary .sub2{font-size:11px;color:var(--faint);flex:none}
.tokens{display:flex;flex-wrap:wrap;gap:6px}
.token{font-size:12px;border:1px solid var(--rule);border-radius:99px;padding:3px 10px;color:var(--dim)}
.hint{color:var(--dim);font-size:12.5px;margin:0}
.empty{color:var(--dim);text-align:center;padding:80px 20px}
.empty b{display:block;font-family:var(--serif);color:var(--fg);font-size:15px;margin-bottom:8px}

@media(max-width:900px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media(max-width:760px){
  .layout{flex-direction:column}
  .rail{width:100%;position:static;max-height:none;border-right:none;
    border-bottom:1px solid var(--rule)}
  .railList{flex-direction:row;overflow-x:auto;padding-bottom:4px;gap:6px}
  .item{width:auto;flex:none;border-left:none;border-bottom:2px solid transparent;
    border-radius:3px;white-space:nowrap}
  .item.on{border-left-color:transparent;border-bottom-color:var(--brass)}
  .groupHd{border-bottom:none;padding:0 2px;align-self:center;
    border-left:1px solid var(--rule);padding-left:8px}
  .groupHd:first-child{border-left:none;padding-left:2px}
  .chipLbl{min-width:auto}
  main{padding:var(--s4) var(--s3) 80px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  input,select,textarea,button{font-size:16px}   /* iOS 확대 방지 */
  nav button{padding:8px 12px}
}
</style>

<header>
  <h1 class="mark">기획 노트</h1>
  <nav id="nav"></nav>
  <span class="grow"></span>
  <div class="tools" id="tools"></div>
</header>

<div class="layout">
  <aside class="rail" id="rail"></aside>
  <main id="main"></main>
  <aside class="peek" id="peek"></aside>
</div>
<input type="file" id="fileIn" accept=".json" hidden>

<script id="appScript">
/* ══════════════════════════ 상수 ══════════════════════════ */
const ELEMENTS=["공격","마법","보호","이동","집중","지속"];
const BRANCHES=["","선택","전환"];      // 속성과 별개인 시전 방식
const FACTIONS=["왕실","고철의 무덤","피의 투기장","정령숲","균열","사후","초월체","모래 바다"];
const JOBS=["검사","궁수","마법사","수호자","지원가","수확자","학살자","무기 전문가","모험가","영광 숭배자","약탈자","방랑자","음악가"];
const RACES=["악마","기계"];
/* 기본값 + 이미 쓰고 있는 값을 합쳐 추천 목록으로 — 직접 새로 써 넣을 수 있음 */
function usedIn(pick,base){
  const out=base.slice();
  DB.heroes.forEach(x=>pick(x).forEach(v=>{
    const s=String(v||"").trim();
    if(s&&!out.includes(s)) out.push(s);
  }));
  return out;
}
const factionList=()=>usedIn(x=>[x.faction],FACTIONS);
const jobList    =()=>usedIn(x=>[x.job,x.job2],JOBS);
const raceList   =()=>usedIn(x=>[x.race],RACES);
const SOURCES=["대원","장신구","상점","이벤트","기타"];   // 카드 수급처 — 기본값, 자유롭게 추가 가능
/* 기본 수급처 + 실제로 쓰이고 있는 수급처를 합쳐서 추천 목록으로 */
function sourceList(){
  const out=SOURCES.slice();
  DB.cards.forEach(c=>{
    const s=String(c.source||"").trim();
    if(s&&!out.includes(s)) out.push(s);
  });
  return out;
}
const KINDS=["전투","지원","소환물"];
const ENEMY_GRADES=["일반","정예","우두머리"];
/* 전장의 칸 — 적은 1번(가장 앞)부터 5번(가장 뒤)까지 선다 */
/* 전장의 칸은 왼쪽부터 한 줄로 1~10 — 아군이 1~5, 적이 6~10.
   거리는 두 번호를 빼면 된다. 게임 쪽 foeNo() 와 짝이다. */
const FOE_SLOTS=["6","7","8","9","10"];
/* 적이 한 마디에 할 수 있는 일 — 직접 적어도 되고 여기서 골라도 된다 */
const ACT_KINDS=["기술 사용","이동(앞)","이동(뒤)","대기","방어","소환","도발","강화","약화 부여","자폭"];
function enemyNameList(){
  return DB.enemies.map(e=>String(e.name||"").trim()).filter(Boolean);
}
/* 그 적이 쓸 수 있는 것들 — 패턴의 한 마디를 고를 때 보여 준다 */
function actList(o){
  return (o.skills||[]).map(k=>String(k.name||"").trim()).filter(Boolean).concat(ACT_KINDS);
}
const ITEM_SOURCES=["상점","던전 보상","유적","이벤트 상자","제작","우두머리 처치","퀘스트"];
function itemSourceList(){
  const out=ITEM_SOURCES.slice();
  DB.items.forEach(i=>(i.sources||[]).forEach(s=>{
    const t=String(s||"").trim(); if(t&&!out.includes(t)) out.push(t);
  }));
  return out;
}
const FIELDS=["최초의 숲","백색 궁정","정령샘","핏빛 감옥","얼어붙은 산맥","사해",
              "녹아내린 섬","마력의 탑","무한한 절벽","균열의 틈"];
function fieldNameList(){
  /* 지금 판에서 쓰는 차례가 맨 앞이다 — DB.fieldOrder 에 적혀 있다.
     (note-fill 이 게임의 FIELDS 차례 그대로 써 넣는다)
     목록에 나온 차례를 보고 정하면 **한 번 뒤집힌 것이 그대로 굳으므로** 안 된다.
     그 뒤에 아직 안 만든 필드, 마지막으로 표에만 있는 이름을 붙인다. */
  const out=[];
  const push=f=>{ f=String(f||"").trim(); if(f&&!out.includes(f)) out.push(f) };
  (DB.fieldOrder||[]).forEach(push);
  FIELDS.forEach(push);
  DB.battles.forEach(b=>push(b.field));
  DB.enemies.forEach(e=>push(e.field));
  return out;
}
const SYN_KINDS=["진영","직업","종족"];
const SQUAD_MAX=6;                       // 스쿼드 최대 인원 (확정되면 이 숫자만 고치면 됨)
const traitNameList=()=>[...new Set([].concat(factionList(),jobList(),raceList()))];
const heroesWithTrait=n=>n?DB.heroes.filter(x=>[x.faction,x.job,x.job2,x.race].includes(n)).map(x=>x.name):[];
/* 특성 위에 커서를 올렸을 때 보여줄 조합 안내 */
function synergyText(name){
  const s=DB.synergies.find(x=>x.name===name);
  if(!s||!(s.tiers||[]).length) return "";
  return s.tiers.slice().sort((a,b)=>(+a.count||0)-(+b.count||0)).map(t=>{
    const req=(t.required||[]).length?` [${t.required.join(", ")} 필수]`:"";
    return `${name}(${t.count})${req}: ${t.desc||"(설명 없음)"}`;
  }).join("\n");
}
const RW_GRADES=["하급","중급","상급"];
/* 기술 비용의 종류 — 직접 새로 써 넣을 수 있음 */
const COST_TYPES=["마나","추진력","체력","탄알","영혼"];
function costTypeList(){
  const out=COST_TYPES.slice();
  eachSkill(s=>{
    const t=String(s.costType||"").trim();
    if(t&&!out.includes(t)) out.push(t);
  });
  return out;
}
/* 노트 안의 모든 기술을 훑음 */
function eachSkill(fn){
  const visit=s=>{ fn(s); (s.options||[]).slice().forEach(visit) };
  DB.heroes.forEach(x=>{
    (x.passives||[]).forEach(visit);
    ["s1","s2","s3","ult"].forEach(k=>{ if(x[k]) visit(x[k]) });
    (x.supports||[]).forEach(visit);
    if(x.support) visit(x.support);
  });
  DB.cards.forEach(c=>{ if(c.summon) (c.summon.skills||[]).forEach(visit) });
  DB.enemies.forEach(e=>(e.skills||[]).forEach(visit));
}

function rewardSourceList(){
  const out=RW_SOURCES.slice();
  DB.rewards.forEach(r=>{
    const s=String(r.source||"").trim();
    if(s&&!out.includes(s)) out.push(s);
  });
  return out;
}

  {title:"대원 — 기술 구성",body:
"<공격 기술>\n1번 기술(기본 공격) / 2번,3번 기술(주요 기술) / 4번 기술(궁극기)\n\n<지원 기술>\n각 대원마다 지원 기술을 보유. 전투에선 사용 불가, 주로 주둔지에서 효과 발동\n\n- 용사마다 고유 사용 기술, 지속 기술 보유. 기술 점수를 얻어 각 기술이나 능력 강화 가능\n사용 기술 : 직접 눌러서 사용, 마나를 소비\n지속 기술 : 전투 동안 효과 발동\n\n전투 기술은 1번 기술과 2번 기술, 지속 효과를 보유한채로 시작\n3번 기술은 대원이 7레벨, 궁극기는 15레벨에 달성 시 선택 가능\n\n사용한도 : 사용 한도의 횟수만큼 사용시 그 턴에서 기술이 사용 불가 상태가 됨"},
  {title:"대원 — 레벨 보상 (최대 30)",body:

  {title:"카드 (전투/지원)",body:
"- 최대 10장의 서로 다른 카드 보유 가능\n- 한 카드에 최대 10장의 보유량 존재\n- 보유량이 있는 카드는 보유량을 모두 소모하면 소멸됨\n- 전투 카드는 전투 시에, 지원 카드는 주둔지에서 사용 가능\n- 소멸성이 있는 카드는 전투 종료시 사라짐"},
  {title:"장신구 (파편/완성/전설)",body:

  {title:"대원 구성",body:
"- 덱에는 최대 5명의 대원 구성 가능\n전투 덱과 지원 덱으로 구성되며 전투 덱에 최소 한명의 대원이 포함되어야 함\n전투 덱 : 전투 시에 필요한 대원으로 지원 기술은 발동되지 않음\n지원 덱 : 주둔지에서 전용 효과가 발동됨"},
  {title:"재화",body:"1. 금화 : 각종 재화, 장신구 등을 구매할 때 사용\n2. 제련석 : 주로 장신구을 제작할 때 사용\n3. 자수정 : 주둔지를 강화할때 사용"},
  {title:"경험치",body:
"1. 적을 직접 처치할 시 경험치 획득\n2. 전투에 참여한 적이 있다면 게임이 끝날 때 경험치 획득\n3. 치유량, 피해량, 방어량에 비례하여 경험치 획득"},
  {title:"주둔지",body:
"게임에는 낮과 밤이 존재. 낮 동안에는 필드를 탐험하며 던전 돌파나 유적을 찾을 수 있음\n관련 행동시 [활동량]이 증가하고 일정 활동량에 도달하면 밤이 됨\n밤에 필드를 돌아다니면 위험한 전투를 치를 수 있음 (활동량을 채우면 낮이 됨)\n\n1. 쉼터 — 대원 배치 가능. 밤을 보낼 수 있으며 일정 체력 회복.\n   기절한 대원은 일정 기간 휴식하여 절반의 체력으로 부활 가능\n2. 회관 — 주둔지 강화. 일정 이상 강화되면 다른 공간 건설 + 다른 지역 이동. 퀘스트와 보상.\n3. 훈련장 — 대원 배치시 일정 기간 후 능력 강화 (공격력/마법력/방어력/체력/마나/…)\n4. 일터 — 농장/광산/목장 등 개발. 대원이나 일꾼을 배치해 재화 수급"},
  {title:"전투",body:
"기본 20턴 제한 존재, 제한이 끝나면 모두 사망 (보스전은 제한 없음)\n전투 칸은 아군과 적군 진영이 각 4칸으로 구성"},
  {title:"필드 구성",body:

async function initFirebase(){
  try{
    const [app,auth,fs]=await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-auth.js`),
      import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-firestore.js`)
    ]);
    const a=app.initializeApp(FB_CONFIG);
    await auth.signInAnonymously(auth.getAuth(a));
    const db=fs.getFirestore(a);
    FB={fs,ref:fs.doc(db,...FB_DOC)};
    setSync("ok","Firebase에 연결되었습니다. 저장은 자동입니다.");
    let first=true;
    fs.onSnapshot(FB.ref,snap=>{
      if(snap.metadata.hasPendingWrites) return;
      if(!snap.exists()){ if(first){first=false;pushFirebase()} return; }
      const d=snap.data();
      if(d.by===CLIENT) return;                  // 내가 쓴 것이 돌아온 것
      if(first){
        first=false;
        // 처음 연결될 때 이 기기와 서버 내용이 다르면 함부로 덮어쓰지 않고 물어봄
        if(HADLOCAL && d.data!==JSON.stringify(DB)){ chooseSource(d); return; }
      }
      fbPending=d.data; applyRemote();
    },err=>{ WHY="onSnapshot: "+err.code; setSync("bad","동기화가 끊겼습니다.") });
    if(DIRTY) pushFirebase();
    renderTools();
    return true;
  }catch(e){
    WHY="Firebase 연결 실패: "+(e&&e.message||e);
    return false;
  }
}

/* 다른 기기의 변경을 반영 — 입력 중이면 잠시 미룸 */
function applyRemote(){
  if(fbPending==null) return;
  const el=document.activeElement;
  if(el&&/^(TEXTAREA|INPUT)$/.test(el.tagName)){ setTimeout(applyRemote,1500); return; }
  const txt=fbPending; fbPending=null;
  if(txt===JSON.stringify(DB)) return;
  try{ DB=JSON.parse(txt) }catch(e){ return }
  normalize();                             // 받은 내용에 형식 정리를 적용
  DIRTY=false; writeLocal(); render();
  if(JSON.stringify(DB)!==txt){            // 정리로 내용이 바뀌었으면 되올림
    DIRTY=true; pushFirebase();
    setSync("dirty","형식을 정리해서 다시 올리는 중입니다.");
  }else setSync("ok","다른 기기의 변경을 받았습니다.");
}
function pushFirebase(){
  if(!FB) return;
  clearTimeout(fbTimer);
  fbTimer=setTimeout(async()=>{
    setSync("saving");
    try{
      await FB.fs.setDoc(FB.ref,{data:JSON.stringify(DB),at:Date.now(),by:CLIENT});
      DIRTY=false; writeLocal(); setSync("ok","저장됨 "+when(new Date().toISOString()));
    }catch(e){
      WHY="setDoc: "+(e&&e.code||e.message);
      setSync("bad","저장하지 못했습니다. 연결을 확인해주세요.");
    }
  },900);
}

  clearTimeout(lsTimer); lsTimer=setTimeout(writeLocal,400);
}
function normalize(){
  for(const k of ["heroes","enemies","battles","cards","items","synergies","rewards","systems","keywords"])
    if(!Array.isArray(DB[k])) DB[k]=structuredClone(SEED[k]||[]);
  DB.heroes.forEach(x=>{ if(!Array.isArray(x.highRewards)) x.highRewards=[]; });
  migrate();
  resort();
}
/* 예전 형식으로 적어둔 내용을 새 항목으로 옮김. 여러 번 실행해도 안전 */
function migrate(){
  const card=c=>{
    if(!isSummon(c.kind)||c.summon) return;
    const p=parseSummon(c.desc); c.summon=p.summon; c.desc=p.rest;
  };
  DB.heroes.forEach(x=>(x.cards||[]).forEach(c=>{ if(c&&typeof c==="object") card(c); }));
  // 카드 탭에 한 번만 넣어줌 — 나중에 지우면 다시 살아나지 않음.
  // 대원이 들고 있던 같은 이름 카드와 합쳐지도록 mergeHeroCards 앞에서 실행
  if(!(DB.seed>=1)){
    if(!DB.cards.some(c=>c.name==="악마 하수인")) DB.cards.push(structuredClone(CARD_MINION));
    DB.seed=1;
  }
  mergeHeroCards();
  DB.cards.forEach(card);
  DB.items.forEach(it=>{
    if(it.grade==="완성") it.grade="일반";                  // 완성 → 일반/희귀 4단계로 개편
    if(!GRADES.includes(it.grade)) it.grade="파편";
    if(!Array.isArray(it.recipe)) it.recipe=[];
    while(it.recipe.length<SLOTS) it.recipe.push("");
    if(it.cost===undefined) it.cost="";
    if(it.code===undefined) it.code="";
  });
  if(DB.fmt!==3){ walkText(DB,toAddFormat); DB.fmt=3; }
  if(!DB.items.length) DB.items=structuredClone(SEED_ITEMS);
  if(!(DB.seed>=2)){ applyHeroPatch(); DB.seed=2; }
  if(!(DB.seed>=3)){                       // 마나 칸 → 비용 종류 + 비용
    eachSkill(s=>{
      if(s.costType!==undefined) return;
      const raw=String(s.mana??"").trim();
      const m=raw.match(/^([^\d\s]+)\s*(\d+)$/);   // "추진력 3" 같은 표기 분리
      if(m){ s.costType=m[1]; s.mana=m[2]; }
      else s.costType="마나";
    });
    DB.seed=3;
  }
  if(!(DB.seed>=4)){                       // 지원 기술 한 칸 → 여러 개
    DB.heroes.forEach(x=>{
      if(!Array.isArray(x.supports)) x.supports=[];
      const s=x.support;
      if(s&&(String(s.name||"").trim()||String(s.desc||"").trim()))
        x.supports.push(...splitSkillBlocks(s));
      delete x.support;
      if(x.memo==="지원 기술이 3-5, 3-6 두 개입니다. 칸이 하나뿐이라 3-6은 같은 칸 아래에 적어두었습니다.")
        x.memo="";
    });
    DB.seed=4;
  }
  DB.heroes.forEach(x=>{ if(!Array.isArray(x.supports)) x.supports=[] });
  DB.enemies.forEach(e=>{ if(!ENEMY_GRADES.includes(e.grade)) e.grade="일반";
    ["hpMax","expMax","mana"].forEach(k=>{ if(e[k]===undefined) e[k]="" });
    if(e.traits===undefined) e.traits="";
    if(!Array.isArray(e.patterns)) e.patterns=[];
    e.patterns.forEach(p=>{ if(!Array.isArray(p.steps)) p.steps=[];
      ["name","when","memo"].forEach(k=>{ if(p[k]===undefined) p[k]="" });
      p.steps.forEach(s=>{ ["act","note"].forEach(k=>{ if(s[k]===undefined) s[k]="" }) }) });
    (e.skills||[]).forEach(k=>{ if(k.branch===undefined) k.branch="" }); });
  DB.battles.forEach(b=>{
    ["name","field","note","memo"].forEach(k=>{ if(b[k]===undefined) b[k]="" });
    if(!ENEMY_GRADES.includes(b.kind)) b.kind="일반";
    if(!Array.isArray(b.rounds)) b.rounds=[];
    b.rounds.forEach(r=>{ if(!Array.isArray(r.foes)) r.foes=[];
      if(r.flow===undefined) r.flow="";
      r.foes.forEach(f=>{ ["name","slot","gimmick"].forEach(k=>{ if(f[k]===undefined) f[k]="" }) }) });
    if(!Array.isArray(b.special)) b.special=[];
    b.special.forEach(s=>{ ["name","desc"].forEach(k=>{ if(s[k]===undefined) s[k]="" }) }); });
  if(!(DB.seed>=5)){                       // 설명에 몰아 적은 선택지를 후속 기술로 분리
    eachSkill(s=>{
      if(Array.isArray(s.options)&&s.options.length) return;
      const got=splitOptions(s.desc);
      if(!got) return;
      s.desc=got.desc; s.options=got.options; s.el="선택"; s.mana="";
    });
    DB.seed=5;
  }
  if(!(DB.seed>=6)){                       // 거리·선택을 사전에 등록 (설명은 직접 작성)
    ["선택","거리"].forEach(n=>{
      if(!DB.keywords.some(k=>k.name===n)) DB.keywords.unshift({name:n,cat:"plain",desc:""});
    });
    DB.seed=6;
  }
  if(!(DB.seed>=7)){                       // 대원들이 쓰는 특성으로 조합 항목 만들어 둠
    const add=(names,kind)=>names.forEach(n=>{
      if(n&&!DB.synergies.some(x=>x.name===n)) DB.synergies.push({name:n,kind,tiers:[]});
    });
    add([...new Set(DB.heroes.map(x=>x.faction))],"진영");
    add([...new Set(DB.heroes.flatMap(x=>[x.job,x.job2]))],"직업");
    add([...new Set(DB.heroes.map(x=>x.race))],"종족");
    DB.seed=7;
  }
  if(!(DB.seed>=8)){                       // 대원 기술 전용 키워드 분류
    const lock=DB.keywords.find(k=>k.name==="잠금");
    if(lock) lock.cat="skill";
    if(!DB.keywords.some(k=>k.name==="사용한도")){
      const at=DB.keywords.findIndex(k=>k.name==="잠금");
      DB.keywords.splice(at<0?DB.keywords.length:at+1,0,
        {name:"사용한도",cat:"skill",
         desc:"사용 한도의 횟수만큼 사용시 그 턴에서 기술이 사용 불가 상태가 됨"});
    }
    DB.seed=8;
  }
  if(!(DB.seed>=9)){
    if(!DB.keywords.some(k=>k.name==="전환")){
      const at=DB.keywords.findIndex(k=>k.name==="선택");
      DB.keywords.splice(at<0?0:at+1,0,
        {name:"전환",cat:"plain",desc:"전환 기술을 사용한 후 특정 기술로 변경됨"});
    }
    DB.seed=9;
  }
  if(!(DB.seed>=10)){                      // 선택·전환을 속성에서 떼어내 별도 칸으로
    eachSkill(s=>{
      if(s.branch!==undefined) return;
      if(s.el==="선택"||s.el==="전환"){
        s.branch=s.el;
        const els=[...new Set((s.options||[]).map(o=>o.el).filter(Boolean))];
        s.el=els.length===1?els[0]:"";     // 딸린 기술 속성이 하나로 모이면 그것을 물려받음
      }else s.branch="";
    });
    DB.seed=10;
  }
  if(!(DB.seed>=11)){                      // 칩으로 띄울 키워드를 직접 고를 수 있게
    const shown=DB.keywords.filter(k=>k.name&&!STATS.some(x=>x.name===k.name)).slice(0,16);
    DB.keywords.forEach(k=>{ if(k.pin===undefined) k.pin=shown.includes(k) });
    DB.seed=11;
  }
  if(!(DB.seed>=12)){ walkText(DB,t=>t.replace(/차례/g,"턴")); DB.seed=12; }
  if(!(DB.seed>=13)){                      // 소환수 → 소환물 (받침이 생기므로 조사도 함께)
    walkText(DB,t=>t.replace(/소환수/g,"소환물")
      .replace(/소환물를/g,"소환물을").replace(/소환물가/g,"소환물이")
      .replace(/소환물는/g,"소환물은").replace(/소환물와/g,"소환물과"));
    DB.seed=13;
  }
  if(!(DB.seed>=14)){                      // 0831 패치
    DB.enemies.forEach(e=>{ if(e.grade==="보스") e.grade="우두머리" });
    DB.items.forEach(i=>{ if(!Array.isArray(i.sources)) i.sources=[] });
    eachSkill(sk0=>{ const r=lockToFront(sk0.desc); if(r!=null) sk0.desc=r; });
    DB.seed=14;
  }
  if(!(DB.seed>=15)){                      // 보상 설명 안의 잠금 표현
    const fix=list=>(list||[]).forEach(x=>{ const r=lockToFrontLine(x.desc); if(r!=null) x.desc=r });
    DB.heroes.forEach(hr=>{ fix(hr.lowRewards); fix(hr.midRewards); fix(hr.highRewards) });
    fix(DB.rewards);
    DB.seed=15;
  }
}
/* "[5-1-1. 수축 공격] (마나 1 / 속성 공격)" 형태의 덩어리를 후속 기술로 분해 */
function splitOptions(desc){
  const src=String(desc||"");
  const re=/\n*\[\s*([\d\-]+)\.\s*([^\]]+?)\]\s*\(\s*([^\d\s:：]+)\s*[:：]?\s*(\d+)\s*[\/／]\s*속성\s*[:：]?\s*([^)]+?)\s*\)\s*\n?/g;
  const hits=[]; let m;
  while((m=re.exec(src))) hits.push({at:m.index,end:re.lastIndex,
    code:m[1],name:m[2].trim(),costType:m[3].trim(),mana:m[4],el:m[5].trim()});
  if(hits.length<2) return null;
  return {
    desc:src.slice(0,hits[0].at).trim(),
    options:hits.map((p,i)=>{
      const stop=i+1<hits.length?hits[i+1].at:src.length;
      return Object.assign(sk(p.code,p.name,p.mana,p.el,src.slice(p.end,stop).trim()),
        {costType:p.costType});
    })
  };
}
/* 설명 안에 [코드. 이름] 으로 덧붙여 둔 기술을 별개 항목으로 분리 */
function splitSkillBlocks(s){
  const src=String(s.desc||"");
  const re=/\n*\[\s*([\d\-]+)\.\s*([^\]]+?)\]\s*\n/g;
  const hits=[]; let m;
  while((m=re.exec(src))) hits.push({at:m.index,end:re.lastIndex,code:m[1],name:m[2].trim()});
  if(!hits.length) return [s];
  const out=[Object.assign({},s,{desc:src.slice(0,hits[0].at).trim()})];
  hits.forEach((p,i)=>{
    const stop=i+1<hits.length?hits[i+1].at:src.length;
    out.push(sk(p.code,p.name,"","",src.slice(p.end,stop).trim()));
  });
  return out;
}
/* 노트에서 옮긴 대원 데이터를 한 번만 반영. 이미 적어둔 칸은 절대 덮어쓰지 않음 */
function applyHeroPatch(){
  PATCH_CARDS.forEach(c=>{
    if(!DB.cards.some(x=>x.name===c.name)) DB.cards.push(structuredClone(c));
  });
  HERO_PATCH.forEach(p=>{
    const hit=DB.heroes.find(x=>x.name===p.name);
    if(!hit){ DB.heroes.push(structuredClone(p)); return; }
    // 이름도 설명도 없는 기술 칸은 자리표시자이므로 통째로 비워서 새로 채워지게 함
    ["s1","s2","s3","ult"].forEach(slot=>{
      const d=hit[slot];
      if(d&&!String(d.name||"").trim()&&!String(d.desc||"").trim()) hit[slot]=sk("","","","","");
    });
    fillEmpty(hit,p);
  });
  const order=HERO_PATCH.map(p=>p.name);          // 노트의 1~10번 순서로 정렬
  const rank=x=>{const i=order.indexOf(x.name);return i<0?999:i};
  DB.heroes.sort((a,b)=>rank(a)-rank(b));
}
/* 비어 있는 칸만 채움. 배열은 항목 단위로 합침 — 이미 적어둔 내용은 그대로 둡니다 */
const patchKey=v=>typeof v==="string"?v:String((v&&(v.code||v.name))||"");
function fillEmpty(dst,src){
  Object.keys(src).forEach(k=>{
    const s=src[k], d=dst[k];
    if(Array.isArray(s)){
      if(!Array.isArray(d)){ dst[k]=structuredClone(s); return; }
      s.forEach(v=>{
        const key=patchKey(v);
        const ex=key ? d.find(x=>patchKey(x)===key) : null;
        if(ex&&typeof ex==="object"&&typeof v==="object") fillEmpty(ex,v);
        else if(!ex) d.push(structuredClone(v));
      });
    }else if(s&&typeof s==="object"){
      if(!d||typeof d!=="object") dst[k]=structuredClone(s);
      else fillEmpty(d,s);
    }else if(d===undefined||d===null||d==="") dst[k]=s;
  });
}
/* († 비례 증가) → (추가 † )  ·  († ≡ 비례 증가) → (추가 † ≡ )
   계수는 원래 적어둔 적이 없으므로 비워 둡니다. ⇑ 는 ⇧ 로 통일 */
function toAddFormat(s){
  return s.replace(/⇑/g,"⇧")
    .replace(/\(([^()]*?)\s*비례\s*증가\s*\)/g,(all,inner)=>{
      const marks=inner.match(/[†∴¤♡≡⇧]/g);
      return marks&&marks.length ? "(추가 "+marks.join(" ")+" )" : all;
    })
    .replace(/\(추가([^()]*)\)/g,(all,inner)=>
      "(추가"+inner.replace(/(\s*[†∴¤♡≡⇧])\s*1(?=\s|$)/g,"$1").replace(/\s+$/,"")+" )");
}
/* "1턴 동안 잠금됩니다" 를 맨 앞의 "잠금 (1)." 로 옮김 */
function lockToFront(t){
  let s=String(t||""), n=null;
  s=s.replace(/([^\n.]*?)하고\s*(\d+)턴\s*(?:동안|간)\s*잠금됩니다\.?/g,(a,b,num)=>{n=num;return b+"합니다."});
  s=s.replace(/\s*(\d+)턴\s*(?:동안|간)\s*잠금됩니다\.?/g,(a,num)=>{n=num;return ""});
  if(n==null) return null;
  const LF=String.fromCharCode(10);
  s=s.split(LF).map(l=>l.replace(/[ \t]+$/,"")).join(LF)
       .replace(new RegExp(LF+"{3,}","g"),LF+LF).trim();
  return "잠금 ("+n+"). "+s;
}
/* 보상 설명처럼 안에 기술이 들어 있는 글은 그 줄 앞에만 붙임 */
function lockToFrontLine(t){
  const LFC=String.fromCharCode(10);
  let hit=false;
  const out=String(t||"").split(LFC).map(line=>{
    let n=null;
    const c=line.replace(/\s*(\d+)턴\s*(?:동안|간)\s*잠금됩니다\.?/g,(a,num)=>{n=num;return ""});
    if(n==null) return line;
    hit=true; return "잠금 ("+n+"). "+c.trim();
  }).join(LFC);
  return hit?out:null;
}
function walkText(node,fn){
  if(Array.isArray(node)) node.forEach(v=>walkText(v,fn));
  else if(node&&typeof node==="object")
    for(const k of Object.keys(node)){
      if(typeof node[k]==="string") node[k]=fn(node[k]);
      else walkText(node[k],fn);
    }
}
/* 대원이 직접 들고 있던 카드를 카드 탭으로 옮기고, 대원에는 이름만 남김.
   이미 이름만 남은 상태면 아무 일도 하지 않음 */
function mergeHeroCards(){
  const normKind=k=>/소환/.test(String(k||""))?"소환물"
    :(KINDS.find(x=>String(k||"").includes(x))||"전투");
  DB.heroes.forEach(hero=>{
    if(!Array.isArray(hero.cards)) hero.cards=[];
    hero.cards=hero.cards.map(c=>{
      if(typeof c==="string") return c.trim()||null;
      const name=String(c&&c.name||"").trim();
      if(!name) return null;
      let hit=DB.cards.find(x=>x.name===name);
      if(!hit){
        const desc=String(c.desc||"");
        hit={name,source:"대원",owner:hero.name,kind:normKind(c.kind),stack:1,
             expire:/소멸성/.test(desc), desc:desc.replace(/^\s*소멸성\s*[.·]?\s*/,"")};
        if(c.summon) hit.summon=c.summon;
        DB.cards.push(hit);
      }else{
        if(!hit.owner) hit.owner=hero.name;
        if(!hit.summon&&c.summon) hit.summon=c.summon;
        if(!hit.desc&&c.desc) hit.desc=c.desc;
      }
      return name;
    }).filter(Boolean);
  });
  DB.cards.forEach(c=>{
    c.source=String(c.source||"").trim()||"대원";     // 직접 쓴 수급처는 그대로 둠
    if(!KINDS.includes(c.kind)) c.kind=normKind(c.kind);
    if(c.stack===undefined) c.stack=1;
    if(c.owner===undefined) c.owner="";
  });
}
/* 설명란에 줄글로 적힌 소환물 정보를 항목으로 분해 (실패하면 원문 유지) */
function parseSummon(desc){
  const src=String(desc||""); const s={hp:"",mana:"",skills:[]}; let rest=src;
  const take=re=>{ const m=rest.match(re); if(!m) return ""; rest=rest.replace(m[0],""); return m[1]; };
  s.hp=take(/체력\s*[:：]?\s*(\d+)/);
  s.mana=take(/최대\s*마나\s*[:：]?\s*(\d+)/);
  const re=/\[\s*([\d\-]+)\.\s*([^\]]+?)\]\s*\(\s*마나\s*[:：]?\s*(\d+)\s*[/／]\s*속성\s*[:：]?\s*([^)]+?)\s*\)\s*([^\n]*)/g;
  const hits=[]; let m;
  while((m=re.exec(src))) hits.push(m);
  hits.forEach(x=>{
    s.skills.push(sk(x[1].trim(),x[2].trim(),x[3],x[4].trim(),x[5].trim()));
    rest=rest.replace(x[0],"");
  });
  rest=rest.split("\n").map(l=>l.replace(/^[\s/·|]+|[\s/·|]+$/g,"")).filter(Boolean).join("\n");
  return {summon:s,rest};
}

async function pullCloud(){
  let cloud=null;

    const r=await fetch(DATA_FILE,{cache:"no-store"});
    if(r.ok) cloud=await r.json();
  }catch(e){}
  if(!cloud||!cloud.data) return;                  // 아직 클라우드 저장 이력 없음

  BASE=cloud.savedAt;

async function cloudSave(){
  if(!CLOUD||READONLY) return;
  setSync("saving"); renderTools();
  const payload={savedAt:new Date().toISOString(),data:DB};
  try{
    await CLOUD.publish({[DATA_FILE]:{content:JSON.stringify(payload),contentType:"application/json"}});
    BASE=payload.savedAt; DIRTY=false; writeLocal();
    setSync("ok","마지막 저장 "+when(payload.savedAt));
  }catch(err){
    const c=err&&err.code;
    WHY="publish 실패 코드: "+(c||"알 수 없음")+" / "+(err&&err.message||"");
    if(c==="conflict")
      setSync("bad","다른 기기에서 먼저 저장했습니다. 이 화면은 곧 그 내용으로 새로고침됩니다.");
    else if(c==="not_writer"||c==="not_granted"||c==="not_declared"||c==="consent_required"){
      READONLY=true; setSync("readonly","읽기 전용으로 열렸습니다. 변경은 이 기기에만 남습니다.");
    }else if(c==="capability_disabled"||c==="capability_removed"){
      CLOUD=null; setSync("local","이 화면에서는 클라우드 저장을 쓸 수 없습니다. 내보내기로 백업하세요.");
    }else if(c==="rate_limited")
      setSync("bad","저장이 너무 잦습니다. 잠시 후 다시 눌러주세요.");
    else if(c==="too_large")
      setSync("bad","내용이 너무 큽니다. 내보내기로 백업 후 정리해주세요.");
    else
      setSync("bad","저장하지 못했습니다. 잠시 후 다시 시도하세요.");
  }
  renderTools();
}

/* ══════════════════════════ 렌더 도구 ══════════════════════════ */
const h=s=>{const t=document.createElement("template");t.innerHTML=s.trim();return t.content.firstElementChild};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* 키워드 사전과 별개로 항상 회색 볼드로 칠하는 말 */
const PLAIN_TERMS=["거리\\s*\\d+(?:~\\d+)?"];
/* 사전에 없지만 색을 고정해 두는 말 */
const FIXED_TERMS={"공격피해":"--k-atk","마법피해":"--k-mag"};
const FIXED_PATTERNS=["공격\\s*피해","마법\\s*피해"];
/* 지금 보고 있는 대원의 기술 — 자기 기술을 언급하면 [베기] 처럼 참조로 표시 */
let SKILL_CTX=[];
function heroSkillRefs(x){
  const out=[];
  const push=s=>{ if(!s) return; if(String(s.name||"").trim()) out.push(s);
                  (s.options||[]).forEach(push); };
  (x.passives||[]).forEach(push);
  ["s1","s2","s3","ult"].forEach(k=>push(x[k]));
  (x.supports||[]).forEach(push);
  return out;
}
const refTitle=s=>[(s.code?s.code+". ":"")+s.name,s.desc].filter(Boolean).join("\n");
/* 카드는 대원 전용이 아니므로 어느 화면에서든 참조됨 */
const cardNameList=()=>DB.cards.map(c=>c.name).filter(Boolean).sort((a,b)=>b.length-a.length);
function cardTitle(c){
  const tag=[c.kind,c.expire?"소멸성":"",c.owner].filter(Boolean).join(" · ");
  const out=[c.name+(tag?` (${tag})`:""),c.desc];
  if(isSummon(c.kind)&&c.summon){
    const s=c.summon;
    const st=[s.hp&&`체력 ${s.hp}`,s.mana&&`최대 마나 ${s.mana}`].filter(Boolean).join(" · ");
    if(st) out.push(st);
    (s.skills||[]).forEach(k=>{ if(k.name||k.desc) out.push(`· ${k.name} — ${k.desc}`) });
  }
  return out.filter(Boolean).join("\n");
}
let kwCache={src:null,re:null};
function kwRegex(){
  const names=DB.keywords.map(k=>k.name).filter(Boolean);
  const refs=SKILL_CTX.map(s=>s.name).filter(Boolean)
    .sort((a,b)=>b.length-a.length);
  const cards=cardNameList();
  const src=names.join(" ")+" | "+refs.join(" ")+" | "+cards.join(" ");
  if(kwCache.src===src) return kwCache.re;
  const rxEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  // 순서 주의 — 앞의 패턴이 먼저 잡힘
  const parts=PLAIN_TERMS.concat(FIXED_PATTERNS)
    .concat(refs.map(n=>"\\["+rxEsc(n)+"\\]"))      // 이미 [] 로 적은 것
    .concat(refs.map(rxEsc))                        // 그냥 이름만 적은 것
    .concat(cards.map(n=>"\\["+rxEsc(n)+"\\]"))     // 카드 이름 (모든 화면 공통)
    .concat(cards.map(rxEsc))
    .concat(names.slice().sort((a,b)=>b.length-a.length).map(rxEsc))
    .concat(STATS.map(s=>rxEsc(s.mark)))
    .concat(["\\d+(?:\\.\\d+)?%?"]);
  kwCache={src,re:new RegExp("("+parts.join("|")+")","g")};
  return kwCache.re;
}
/* 키워드와 능력치 기호를 한 번의 치환으로 칠함 — 치환 결과는 다시 훑지 않으므로
   속성값(title="…") 안의 글자가 또 치환되는 사고가 없음 */
function paint(seg){
  const re=kwRegex(); if(!re) return esc(seg);
  return esc(seg).replace(re,m=>{
    if(m.startsWith("거리")){                     // "거리 1" 을 한 덩어리로
      const g=DB.keywords.find(x=>x.name==="거리");
      return `<span class="kw" style="color:var(${KW_COLOR[g&&g.cat]||"--k-plain"})" title="${esc(g&&g.desc)}">${m}</span>`;
    }
    const fixed=FIXED_TERMS[m.replace(/\s+/g,"")];
    if(fixed) return `<span class="kw" style="color:var(${fixed})">${m}</span>`;
    const bare=m.replace(/^\[|\]$/g,"");
    const ref=SKILL_CTX.find(s=>s.name===bare);
    if(ref) return `<span class="ref" title="${esc(refTitle(ref))}">[${esc(bare)}]</span>`;
    const cd=DB.cards.find(c=>c.name===bare);
    if(cd) return `<span class="ref card" title="${esc(cardTitle(cd))}">[${esc(bare)}]</span>`;
    const st=STATS.find(s=>s.mark===m);
    if(st) return statIcon(st);
    const k=DB.keywords.find(x=>x.name===m);
    if(k){
      const sm=STATS.find(x=>x.name===k.name);          // 능력치 이름이면 아이콘을 앞에
      return `<span class="kw" style="color:var(${KW_COLOR[k.cat]||"--brass"})"`
        +` title="${esc(k.desc)}">${m}${sm?statIcon(sm):""}</span>`;
    }
    return `<b class="num">${m}</b>`;
  });
}
/* (추가 † 2 ∴ 3) 묶음은 작은 글씨로 */
function plainRun(text){
  const src=String(text??""); const re=/\(추가[^()]*\)/g;
  let out="",last=0,m;
  while((m=re.exec(src))){
    out+=paint(src.slice(last,m.index))+`<span class="add">${paint(m[0])}</span>`;
    last=re.lastIndex;
  }
  return out+paint(src.slice(last));
}
/* **굵게** *기울임* _밑줄_ */
const EMPH=[{re:/\*\*(?!\s)([^*\n]+?)(?<!\s)\*\*/,tag:"strong"},
            {re:/\*(?!\s)([^*\n]+?)(?<!\s)\*/,tag:"em"},
            {re:/_(?!\s)([^_\n]+?)(?<!\s)_/,tag:"u"}];
function highlight(text){
  const src=String(text??"");
  let best=null;
  EMPH.forEach(e=>{
    const m=src.match(e.re);
    if(m&&(!best||m.index<best.m.index)) best={m,tag:e.tag};
  });
  if(!best) return plainRun(src);
  const {m,tag}=best;
  return highlight(src.slice(0,m.index))
    +`<${tag}>`+highlight(m[1])+`</${tag}>`
    +highlight(src.slice(m.index+m[0].length));
}
function field(label,value,set,type,opts){

  }else if(type==="area"){

    const pv=h(`<div class="preview"></div>`); pv.innerHTML=highlight(value);
    w.appendChild(pv);
    node.addEventListener("input",()=>{
      set(node.value);pv.innerHTML=highlight(node.value);touch();renderPeek();});

  }
  return w;
}

  wrap.addEventListener("click",e=>{ if(e.target===wrap) close() });
  document.addEventListener("keydown",function esc2(e){
    if(e.key==="Escape"){ close(); document.removeEventListener("keydown",esc2) }
  });
  document.body.appendChild(wrap);
  return box;
}

/* 여러 개를 고르는 칸 — 입력하거나 목록에서 고르면 칩으로 쌓임 */
function multiField(label,arr,opts,onChange){
  const id="ml"+Math.random().toString(36).slice(2);
  const w=h(`<div><label>${esc(label)}</label></div>`);
  const inp=h(`<input list="${id}" placeholder="입력하거나 목록에서 선택">`);
  const dl=h(`<datalist id="${id}">${
    opts.filter(o=>!arr.includes(o)).map(o=>`<option value="${esc(o)}"></option>`).join("")}</datalist>`);
  const add=()=>{
    const v=inp.value.trim();
    if(!v||arr.includes(v)){ inp.value=""; return }
    arr.push(v); inp.value=""; touch(); if(onChange) onChange();
  };
  inp.addEventListener("change",add);
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); add() } });
  w.append(inp,dl);
  if(arr.length){
    const box=h(`<div class="tokens" style="margin-top:6px"></div>`);
    arr.forEach((v,i)=>{
      const b=h(`<button class="token" style="cursor:pointer">${esc(v)} ×</button>`);
      b.addEventListener("click",()=>{arr.splice(i,1);touch();if(onChange)onChange()});
      box.appendChild(b);
    });
    w.appendChild(box);
  }
  return w;
}

function uiIcon(name){
  const i=UI_ICONS[name]||STATS.find(s=>s.name===name);
  if(!i) return "";
  return `<svg class="ic" viewBox="0 0 24 24" role="img" aria-label="${esc(name)}"`
    +` style="color:var(${i.color})"><title>${esc(name)}</title>`
    +(i.body||`<path fill="currentColor" d="${i.d}"/>`)+`</svg>`;
}
function statIcon(st){
  return `<svg class="ic" viewBox="0 0 24 24" role="img" aria-label="${esc(st.name)}"`
    +` style="color:var(${st.color})"><title>${esc(st.name)}</title>`
    +`<path fill="currentColor" d="${st.d}"/></svg>`;
}
const MARK_RE=/[†∴¤♡≡⇧⇑]/;
function insertInto(scope,text){
  const ta=scope.querySelector("textarea"); if(!ta) return;
  const p=ta.selectionStart;
  let ins=text;
  if(MARK_RE.test(text[0])){                        // 기호 단독 삽입은 앞 공백 보정
    const prev=ta.value[p-1];
    if(prev&&!/[\s(]/.test(prev)) ins=" "+ins;
  }
  ta.value=ta.value.slice(0,p)+ins+ta.value.slice(ta.selectionEnd);
  ta.dispatchEvent(new Event("input"));
  ta.focus();
  // 계수를 적을 자리에 커서를 둠 — 괄호로 닫히면 ')' 바로 앞, 아니면 끝
  const caret=p+ins.length-(ins.endsWith(")")?1:0);
  ta.selectionStart=ta.selectionEnd=caret;
}
function wrapSel(ta,mark){
  if(!ta) return;
  const a=ta.selectionStart,b=ta.selectionEnd;
  const had=b>a, sel=had?ta.value.slice(a,b):"텍스트";
  ta.value=ta.value.slice(0,a)+mark+sel+mark+ta.value.slice(b);
  ta.dispatchEvent(new Event("input"));
  ta.focus();
  ta.selectionStart=a+mark.length; ta.selectionEnd=a+mark.length+sel.length;
}
function chipRow(label,items,scope){
  const row=h(`<div class="chipRow"><span class="chipLbl">${esc(label)}</span></div>`);
  items.forEach(it=>{
    const c=h(`<button class="chip" type="button" style="color:var(${it.color||"--dim"})" title="${esc(it.title||"")}">${it.html}</button>`);
    c.addEventListener("click",()=>insertInto(scope,it.insert));
    row.appendChild(c);
  });
  return row;
}
/* 보상 설명 끝에 붙이는 상투 문구 */
function noteChips(scope){
  const row=h(`<div class="chipRow"><span class="chipLbl">보상 표기</span></div>`);
  const add=(label,note,intoBracket)=>{
    const b=h(`<button class="chip" type="button" title="${esc(note)}">${esc(label)}</button>`);
    b.addEventListener("click",()=>{
      const ta=scope.querySelector("textarea"); if(!ta) return;
      if(!intoBracket&&ta.value.includes(note)) return;      // 같은 문구 중복 방지
      const v=ta.value.replace(/\s+$/,"");
      const from=v.length;
      ta.value=v+(v?String.fromCharCode(10):"")+note;
      ta.dispatchEvent(new Event("input"));
      ta.focus();
      const at=intoBracket ? ta.value.indexOf("[]",from)+1 : ta.value.length;
      ta.selectionStart=ta.selectionEnd=at;
    });
    row.appendChild(b);
  };
  add("획득 후 제외","*획득시 보상에서 다시 등장하지 않음");
  add("기술 없으면 제외","*[] 기술이 없을 때 등장하지 않음",true);
  return row;
}

/* ── 대원 조합 간략 보기 ── */
let SYN_SEL={i:-1,t:0};
function synergyPeek(box){
  const idx=Math.min(SEL.synergy,DB.synergies.length-1);
  const o=DB.synergies[idx];
  const have=heroesWithTrait(o.name).length;
  const tiers=(o.tiers||[]).slice().sort((a,b)=>(+a.count||0)-(+b.count||0));
  if(SYN_SEL.i!==idx){ SYN_SEL={i:idx,t:0} }
  if(SYN_SEL.t>=tiers.length) SYN_SEL.t=0;

  const card=h(`<div class="pk"></div>`);
  const hd=h(`<div class="pk-hd">
    <div class="pk-nm">${esc(o.name||"이름 없음")}</div>
    <div class="pk-ti">${esc(o.kind||"")}</div>
  </div>`);
  if(tiers.length){
    const row=h(`<div class="sy-steps"></div>`);
    tiers.forEach((t,i)=>{
      if(i) row.appendChild(h(`<span class="sy-arrow">▸</span>`));
      const b=h(`<button class="sy-step${i===SYN_SEL.t?" on":""}" type="button">${esc(t.count)}</button>`);
      b.addEventListener("click",()=>{ SYN_SEL.t=i; renderPeek() });
      row.appendChild(b);
    });
    hd.appendChild(row);
  }
  hd.appendChild(h(`<div class="pk-focus">이 특성을 가진 대원 ${have}명</div>`));
  card.appendChild(hd);

  if(!tiers.length) card.appendChild(h(`<div class="pk-none">단계가 아직 없습니다.</div>`));
  tiers.forEach((t,i)=>{
    const req=(t.required||[]).length
      ? ` <span class="pk-lock">${esc(t.required.join(", "))} 필수</span>` : "";
    const el=h(`<div class="pk-sk${i===SYN_SEL.t?"":" off"}">
      <div class="pk-h"><span class="pk-slot">${esc(o.name||"")}(${esc(t.count)})</span>
        <span class="grow"></span>${req}</div></div>`);
    el.appendChild(h(`<div class="pk-d">${t.desc?highlight(t.desc):"(설명 없음)"}</div>`));
    card.appendChild(el);
  });
  box.innerHTML=""; box.appendChild(card);
}
/* ── 대원 간략 보기 — 편집 칸 없이 완성된 모습만 ── */
function renderPeek(){
  const box=document.getElementById("peek"); box.innerHTML="";
  if(TAB==="synergy"&&DB.synergies.length){ box.style.display=""; return synergyPeek(box); }
  if(TAB!=="hero"||!DB.heroes.length){ box.style.display="none"; return; }
  box.style.display="";
  const o=DB.heroes[Math.min(SEL.hero,DB.heroes.length-1)];
  const card=h(`<div class="pk"></div>`);

  const hd=h(`<div class="pk-hd">
    <div class="pk-nm">${esc(o.name||"이름 없음")}</div>
    ${o.title?`<div class="pk-ti">${esc(o.title)}</div>`:""}
    <div class="pk-row">
      <span title="시작 생명력">${uiIcon("체력")}<b>${esc(o.hp)}</b></span>
      <span title="최대 마나">${uiIcon("마나")}<b>${esc(o.mana)}</b></span>
      <span title="필요 경험치 증가폭">${uiIcon("경험치 증가폭")}<b>${esc(o.expStep)}</b></span>
      <span title="레벨 당 증가하는 최대 체력">${uiIcon("최대 체력 증가")}<b>${esc(o.hpPerLv)}</b></span>
    </div>
    ${o.focus?`<div class="pk-focus">${esc(o.focus)}</div>`:""}
  </div>`);
  const tags=[o.faction,o.job,o.job2,o.race].filter(Boolean);
  if(tags.length) hd.appendChild(h(`<div class="pk-tags">${
    tags.map(t=>`<span class="pk-tag" title="${esc(synergyText(t))}">${esc(t)}</span>`).join("")}</div>`));
  card.appendChild(hd);

  const line=(slot,s,lock)=>{
    if(!s||(!s.name&&!s.desc)) return null;
    const raw=String(s.mana??"").trim();
    const type=String(s.costType||"마나").trim();
    const ic=uiIcon(type);
    const cost=raw===""?"" : `<span class="pk-cost" title="${esc(type)}">`
      +(ic||esc(type)+" ")+`<b>${esc(raw)}</b></span>`;
    const el=h(`<div class="pk-sk">
      <div class="pk-h"><span class="pk-slot">${esc(slot)}</span>
        <span class="pk-n">${esc(s.name||"이름 없음")}</span>
        ${lock?`<span class="pk-lock">${esc(lock)}</span>`:""}${cost}</div>
    </div>`);
    if(s.desc) el.appendChild(h(`<div class="pk-d">${highlight(s.desc)}</div>`));
    return el;
  };
  const add=(title,nodes)=>{
    const list=nodes.filter(Boolean);
    if(!list.length) return;
    card.appendChild(h(`<div class="pk-sec">${esc(title)}</div>`));
    list.forEach(n=>card.appendChild(n));
  };

  const lines=(slot,s,lock)=>{
    const base=line(slot,s,lock);
    if(!base) return [];
    const out=[base];
    (s.options||[]).forEach(op=>{
      const n=line(s.branch==="전환"?"전환":"선택",op);
      if(n){ n.style.paddingLeft="30px"; out.push(n) }
    });
    return out;
  };
  add("지속 기술",(o.passives||[]).map(p=>line("지속",p)));
  add("전투 기술",[].concat(lines("1",o.s1),lines("2",o.s2),
                   lines("3",o.s3,"7레벨"),lines("궁",o.ult,"15레벨")));
  add("지원 기술",(o.supports||[]).map(p=>line("지원",p)));

  const cards=(o.cards||[]).map(n=>DB.cards.find(c=>c.name===n)).filter(Boolean);
  if(cards.length){
    card.appendChild(h(`<div class="pk-sec">관련 카드</div>`));
    cards.forEach(c=>{
      const el=h(`<div class="pk-sk">
        <div class="pk-h"><span class="pk-slot">${esc(c.kind||"카드")}</span>
          <span class="pk-n">${esc(c.name)}</span>
          ${c.expire?`<span class="pk-lock">소멸성</span>`:""}</div>
      </div>`);
      if(c.desc) el.appendChild(h(`<div class="pk-d">${highlight(c.desc)}</div>`));
      if(isSummon(c.kind)&&c.summon){
        const s=c.summon;
        const st=[s.hp&&`${uiIcon("체력")}<b>${esc(s.hp)}</b>`,
                  s.mana&&`${uiIcon("마나")}<b>${esc(s.mana)}</b>`].filter(Boolean).join(" ");
        if(st) el.appendChild(h(`<div class="pk-row" style="margin-top:6px"><span>${st}</span></div>`));
        (s.skills||[]).forEach(k=>{
          if(!k.name&&!k.desc) return;
          el.appendChild(h(`<div class="pk-d"><b>${esc(k.name||"이름 없음")}</b>${
            k.desc?"<br>"+highlight(k.desc):""}</div>`));
        });
      }
      card.appendChild(el);
    });
  }
  if(!card.querySelector(".pk-sk"))
    card.appendChild(h(`<div class="pk-none">아직 기술이 없습니다.</div>`));
  box.appendChild(card);
}

/* 항목을 추가하거나 분류를 바꿀 때마다 정해진 순서로 다시 정렬.
   보고 있던 항목은 그대로 따라갑니다 */
function resort(){
  const keys=[["hero",DB.heroes],["enemy",DB.enemies],["battle",DB.battles],["card",DB.cards],
              ["item",DB.items],["synergy",DB.synergies],["reward",DB.rewards]];
  const held={}; keys.forEach(([k,arr])=>held[k]=arr[SEL[k]]);

  const at=(list,v)=>{ const i=list.indexOf(v); return i<0?9999:i };
  const heroAt=n=>{ const i=DB.heroes.findIndex(x=>x.name===n); return i<0?9999:i };
  const by=(arr,rank)=>{
    arr.map((o,i)=>({o,i,r:[].concat(rank(o))}))
       .sort((a,b)=>{
         for(let d=0;d<a.r.length;d++) if(a.r[d]!==b.r[d]) return a.r[d]-b.r[d];
         return a.i-b.i;                       // 같은 등급이면 추가한 순서 유지
       })
       .map(x=>x.o).forEach((o,i)=>arr[i]=o);
  };
  by(DB.keywords, k=>at(KW_CATS,k.cat));
  by(DB.cards,    c=>[at(SOURCES,c.source),heroAt(c.owner)]);
  by(DB.rewards,  r=>at(RW_GRADES,r.grade));
  by(DB.enemies,  e=>[at(fieldNameList(),e.field),at(ENEMY_GRADES,e.grade)]);
  /* '규칙 · ' 로 시작하는 것은 지도 칸의 규칙을 적어 둔 설명이다.
     격과 상관없이 맨 위에 모은다 — 안 그러면 일반/정예/우두머리로 갈려
     조합들 사이에 끼어 읽기 어렵다. */
  by(DB.battles,  b=>[at(fieldNameList(),b.field),
                      /^규칙 ·/.test(String(b.name||""))?0:1,
                      at(ENEMY_GRADES,b.kind)]);
  by(DB.items,    i=>at(GRADES,i.grade));
  by(DB.synergies,s=>at(SYN_KINDS,s.kind));

  keys.forEach(([k,arr])=>{ const i=arr.indexOf(held[k]); if(i>=0) SEL[k]=i });
}

          .filter(Boolean).join(" · ")];
    },
    make:()=>({code:"",name:"새 장신구",grade:"파편",bind:false,desc:"",sources:[],
      recipe:["","","",""],cost:""})};
  if(TAB==="synergy") return {arr:DB.synergies,key:"synergy",name:"조합",
    group:o=>SYN_KINDS.includes(o.kind)?o.kind:"기타", groupOrder:SYN_KINDS.concat("기타"),
    label:o=>[o.name||"이름 없음",
      (o.tiers||[]).map(t=>+t.count||0).sort((a,b)=>a-b).join(" ▸ ")],
    make:()=>({name:"",kind:"진영",tiers:[]})};
  if(TAB==="reward") return {arr:DB.rewards,key:"reward",name:"보상",
    group:o=>RW_GRADES.includes(o.grade)?o.grade:"기타", groupOrder:RW_GRADES.concat("기타"),
    label:o=>[(o.rare?"◇ ":"")+(o.name||"이름 없음"),[o.source,o.type].filter(Boolean).join(" · ")],
    make:()=>({name:"새 보상",grade:"하급",source:"레벨업",type:"기술 강화 보상",desc:""})};
  return {arr:DB.systems,key:"system",name:"문서",

function renderRail(){
  const rail=document.getElementById("rail"); rail.innerHTML="";
  if(TAB==="keyword"){
    rail.appendChild(h(`<p class="hint">여기 등록된 단어는 모든 설명문에서 자동으로 색이 칠해지고, 마우스를 올리면 정의가 뜹니다.</p>`));
    return;
  }
  const S=spec();
  const q=h(`<input placeholder="${S.name} 검색" aria-label="${S.name} 검색">`);
  const list=h(`<div class="railList"></div>`);
  const draw=()=>{
    list.innerHTML="";
    const term=q.value.trim();
    const rows=[];
    S.arr.forEach((o,i)=>{
      const [a,b]=S.label(o);
      if(term&&!(a+" "+b).includes(term)) return;
      rows.push({o,i,a,b});
    });
    if(!rows.length){ list.appendChild(h(`<p class="hint">일치하는 항목이 없습니다.</p>`)); return; }
    const put=({i,a,b})=>{
      const d=h(`<button class="item ${SEL[S.key]===i?"on":""}"><b>${esc(a)}</b>${b?`<small>${esc(b)}</small>`:""}</button>`);
      d.addEventListener("click",()=>{SEL[S.key]=i;renderRail();renderMain()});
      list.appendChild(d);
    };
    if(!S.group){ rows.forEach(put); return; }
    const order=S.groupOrder.slice();          // 목록에 없는 분류도 빠짐없이 뒤에 붙임
    rows.forEach(r=>{ const g=S.group(r.o); if(!order.includes(g)) order.push(g); });
    order.forEach(gname=>{
      const inGroup=rows.filter(r=>S.group(r.o)===gname);
      if(!inGroup.length) return;
      list.appendChild(h(`<div class="groupHd">${esc(gname)} · ${inGroup.length}</div>`));
      inGroup.forEach(put);
    });
  };
  q.addEventListener("input",draw); draw();
  rail.append(q,list);
  rail.appendChild(btn("＋ "+S.name+" 추가",()=>{
    const o=S.make(); S.arr.push(o); SEL[S.key]=S.arr.length-1;
    resort(); SEL[S.key]=S.arr.indexOf(o);
    touch(); render(); window.scrollTo(0,0);
  }));
}

/* 대원의 연관 카드 — 카드 탭에 있는 카드를 참조만 함 */
function heroCardRefs(hero){
  if(!Array.isArray(hero.cards)) hero.cards=[];
  const p=panel("연관 카드");
  const head=p.querySelector("h2");

  const picker=h(`<select style="width:auto;max-width:230px"></select>`);
  const avail=DB.cards.filter(c=>c.name&&!hero.cards.includes(c.name));
  const mine=avail.filter(c=>c.source==="대원"), rest=avail.filter(c=>c.source!=="대원");
  const opt=c=>`<option value="${esc(c.name)}">${esc(c.name)}${c.owner&&c.owner!==hero.name?" ("+esc(c.owner)+")":""}</option>`;
  picker.innerHTML=`<option value="">＋ 카드 추가…</option>`
    +(mine.length?`<optgroup label="대원에게서 생성">${mine.map(opt).join("")}</optgroup>`:"")
    +(rest.length?`<optgroup label="그 외 수급처">${rest.map(opt).join("")}</optgroup>`:"");
  picker.addEventListener("change",()=>{
    if(!picker.value) return;
    hero.cards.push(picker.value); touch(); renderMain();
  });
  head.appendChild(picker);

    const c={name:"새 카드",source:"대원",owner:hero.name,kind:"전투",stack:1,expire:false,desc:""};

  const stack=h(`<div class="stack"></div>`); p.appendChild(stack);
  if(!hero.cards.length)

    const top=h(`<div class="top"><span class="tag">${esc(c?c.kind:"없음")}</span>

function foldList(title,arr,cols,make,pre){
  const key=i=>pre+"|"+i;
  const anyOpen=arr.some((_,i)=>OPEN.has(key(i)));
  const p=panel(`${title} · ${arr.length}`);
  const head=p.querySelector("h2");
  if(arr.length) head.appendChild(btn(anyOpen?"모두 접기":"모두 펼치기",()=>{
    arr.forEach((_,i)=>anyOpen?OPEN.delete(key(i)):OPEN.add(key(i)));
    renderMain();
  },"mini"));
  head.appendChild(btn("＋ 추가",()=>{
    arr.push(make()); OPEN.add(key(arr.length-1)); touch(); renderMain();
  },"mini"));

  const stack=h(`<div class="stack" style="gap:6px"></div>`); p.appendChild(stack);
  if(!arr.length){ stack.appendChild(h(`<p class="hint">아직 없습니다.</p>`)); return p; }

  arr.forEach((o,i)=>{
    const k=key(i);
    const d=h(`<details class="acc"${OPEN.has(k)?" open":""}></details>`);
    const sum=h(`<summary><span class="nm">${esc(o.name||"이름 없음")}</span>
      <span class="sub2">${esc([o.grade,o.type,o.rare?"낮은 확률":""].filter(Boolean).join(" · "))}</span></summary>`);

function optionBlock(s){

      ?"이 기술을 사용한 뒤 바뀌어 들어갈 기술을 넣으세요."
      :"기술을 누른 뒤 고를 수 있는 후속 기술을 넣으세요."}</p>`));

const GRADES=["파편","일반","희귀","특수","전설"];
const CRAFT_FROM={"일반":["파편"],"희귀":["일반","파편"],"특수":["희귀","일반","파편"]};
const MIN_PARTS={"일반":2,"희귀":2,"특수":0};                // 특수는 조합식이 없어도 됨
const SLOTS=4;                                              // 조합 칸 수
function itemView(m,o,del){
  const p=panel("장신구",del);
  const g=h(`<div class="grid g3"></div>`);

  const box=chk.querySelector("input"); box.checked=!!o.bind;
  box.addEventListener("change",()=>{o.bind=box.checked;touch()});
  if(!Array.isArray(o.sources)) o.sources=[];
  const st=h(`<div class="stack"></div>`);
  st.append(g,multiField("수급처 · 여러 개 선택 가능",o.sources,itemSourceList(),renderMain),
    chk,field("설명",o.desc,v=>o.desc=v,"area"));
  p.appendChild(st); p.appendChild(chips(p)); m.appendChild(p);

  if(CRAFT_FROM[o.grade]) m.appendChild(recipeView(o));
  else if(o.grade==="전설"){
    const lp=panel("제작");
    lp.appendChild(h(`<p class="hint">전설 장신구은 제작할 수 없습니다. 보상으로만 획득됩니다.</p>`));
    m.appendChild(lp);
  }
  if(o.grade!=="전설") m.appendChild(usageView(o));
}
/* 조합법 — 하위 등급 재료 2~4개 */
function recipeView(o){
  if(!Array.isArray(o.recipe)) o.recipe=[];
  while(o.recipe.length<SLOTS) o.recipe.push("");
  const p=panel("조합법");
  const from=CRAFT_FROM[o.grade];
  const frags=DB.items.filter(x=>from.includes(x.grade)&&x.name)
    .sort((a,b)=>from.indexOf(a.grade)-from.indexOf(b.grade)).map(x=>x.name);
  const min=MIN_PARTS[o.grade]??2;
  const st=h(`<div class="stack"></div>`);
  st.appendChild(h(`<p class="hint">${from.join(" · ")} 등급 재료 ${min}~${SLOTS}개로 제작합니다.
    ${min===0?"재료 없이 비워두면 제작할 수 없는 장신구이 됩니다." : "남는 칸은 비워두세요."}</p>`));
  for(let i=0;i<SLOTS;i++){
    const cur=o.recipe[i]||"";
    const opts=[""].concat(frags);
    if(cur&&!opts.includes(cur)) opts.push(cur);          // 삭제·개명된 파편도 보이게
    const row=h(`<div class="slotRow"><span class="slotNo">${i+1}</span></div>`);
    const sel=field("",cur,v=>{o.recipe[i]=v;later(renderMain)},"select",opts);
    sel.style.flex="1 1 auto"; sel.style.minWidth="0";
    row.appendChild(sel); st.appendChild(row);
  }
  st.appendChild(field("제련석 비용",o.cost||"",v=>o.cost=v));
  p.appendChild(st);

  const used=o.recipe.filter(Boolean);
  const missing=used.filter(n=>!frags.includes(n));
  const warns=[];
  if(!frags.length) warns.push(`${from.join(" 또는 ")} 등급 장신구이 아직 없습니다. 재료를 먼저 만들어야 여기서 고를 수 있습니다.`);
  else if(used.length<min) warns.push(`재료가 ${used.length}개만 지정되어 있습니다. ${min}개 이상 필요합니다.`);
  if(missing.length) warns.push("재료 목록에 없는 이름: "+missing.join(", ")+" — 삭제되었거나 이름이 다릅니다.");
  warns.forEach(w=>p.appendChild(h(`<div class="warn">${esc(w)}</div>`)));
  return p;
}
/* 이 장신구이 어느 상위 장신구의 재료로 쓰이는지 역참조 */
function usageView(o){
  const p=panel("사용처");

/* ── 대원 조합 — 진영·직업별 인원을 채우면 발동하는 능력 ── */
function synergyView(m,o,del){
  const members=heroesWithTrait(o.name);
  const p=panel("대원 조합",del);
  const g=h(`<div class="grid g2"></div>`);
  g.append(fieldList("이름",o.name,v=>{o.name=v},traitNameList(),renderMain),

  p.appendChild(g);
  p.appendChild(h(`<p class="hint" style="margin-top:12px">이 특성을 가진 대원 ${members.length}명 ${
    members.length?"— "+esc(members.join(" · ")):""}</p>`));
  m.appendChild(p);

  if(!Array.isArray(o.tiers)) o.tiers=[];
  const tp=panel("단계",btn("＋ 단계",
    ()=>{o.tiers.push({count:2,desc:"",required:[]});touch();renderMain()},"mini"));
  const stack=h(`<div class="stack"></div>`); tp.appendChild(stack);
  if(!o.tiers.length)
    stack.appendChild(h(`<p class="hint">인원 수를 채우면 발동하는 능력을 단계별로 적으세요.</p>`));
  o.tiers.forEach((t,i)=>{
    if(!Array.isArray(t.required)) t.required=[];
    const e=h(`<div class="entry"></div>`);
    const top=h(`<div class="top"><span class="tag">${esc(o.name||"조합")}(${esc(t.count)})</span>
      <span class="grow"></span></div>`);
    top.appendChild(btn("삭제",()=>{o.tiers.splice(i,1);touch();renderMain()},"mini danger"));
    const g2=h(`<div class="grid g2"></div>`);
    g2.appendChild(field("인원 수",String(t.count),v=>{t.count=+v||1;touch();renderMain()},
      "select",Array.from({length:SQUAD_MAX},(_,n)=>String(n+1))));

    const pick=h(`<div><label>필수 대원 · 비워두면 인원 수만 맞으면 발동</label></div>`);
    const sel=h(`<select></select>`);
    const pool=members.filter(n=>!t.required.includes(n));
    sel.innerHTML=`<option value="">＋ 대원 지정…</option>`
      +pool.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join("");
    sel.disabled=!pool.length;
    sel.addEventListener("change",()=>{
      if(!sel.value) return;
      t.required.push(sel.value); touch(); renderMain();
    });
    pick.appendChild(sel);
    if(t.required.length){
      const box=h(`<div class="tokens" style="margin-top:6px"></div>`);
      t.required.forEach((n,j)=>{
        const b=h(`<button class="token" style="cursor:pointer">${esc(n)} ×</button>`);
        b.addEventListener("click",()=>{t.required.splice(j,1);touch();renderMain()});
        box.appendChild(b);
      });
      pick.appendChild(box);
    }
    g2.appendChild(pick);
    e.append(top,g2,field("설명",t.desc,v=>t.desc=v,"area"));
    e.appendChild(chips(e));
    stack.appendChild(e);
  });
  m.appendChild(tp);
}

const SYS_KINDS=["문서","UI 화면","상점","미지의 구역","보상 상자"];
function arrOf(o,k){ if(!Array.isArray(o[k])) o[k]=[]; return o[k] }
function sysCount(o){
  const k=o.kind||"문서";
  if(k==="상점")      return arrOf(o,"stages").reduce((a,x)=>a+arrOf(x,"goods").length,0)+"개 품목";

  return "";
}
/* 반복 항목 한 덩이 — 위쪽에 번호와 삭제, 아래에 칸들 */
function rowBox(tag,onDel,extra){

}
function moveBtns(arr,i){
  const w=h(`<span></span>`);
  w.appendChild(btn("▲",()=>{ if(i>0){ const t=arr[i-1];arr[i-1]=arr[i];arr[i]=t;touch();renderMain() } },"mini"));
  w.appendChild(btn("▼",()=>{ if(i<arr.length-1){ const t=arr[i+1];arr[i+1]=arr[i];arr[i]=t;touch();renderMain() } },"mini"));
  return w;
}
function loadBtn(o,fn,what){
  return btn("본문에서 불러오기",()=>{

function shopBlock(m,o){

  if(!stages.length) p.appendChild(h(`<p class="hint">아직 없습니다. 아래 [본문에서 불러오기]를 누르면 원문 메모에 적어두신 목록을 그대로 가져옵니다.</p>`));

    goods.forEach((g,gi)=>{

      g4.append(field("품목",g.name,v=>g.name=v),
                field("금화",g.price,v=>g.price=v),
                field("수량",g.qty,v=>g.qty=v));
      row.appendChild(g4);
      row.appendChild(field("설명",g.desc,v=>g.desc=v,"area"));
      const del=h(`<div style="text-align:right"></div>`);
      del.appendChild(btn("품목 삭제",()=>{goods.splice(gi,1);touch();renderMain()},"mini danger"));
      row.appendChild(del);
      tb.appendChild(row);
    });
    e.appendChild(tb);
    e.appendChild(btn("＋ 품목",()=>{goods.push({name:"",price:"",qty:"",desc:""});touch();renderMain()},"mini"));
    p.appendChild(e);
  });
  p.appendChild(loadBtn(o,parseShop,"진열대"));
  m.appendChild(p);
}
function parseShop(body){
  const o=CURSYS; o.stages=[];
  let cur=null, n=0;
  String(body).split(/\r?\n/).forEach(line=>{
    const t=line.trim(); if(!t) return;
    const hd=t.match(/^\[(.+?)\]/);
    if(hd){ cur={name:hd[1].replace(/\s*판매\s*품목\s*$/,"").trim(),goods:[]}; o.stages.push(cur); return }
    const mm=t.match(/^(.*):\s*([0-9]+(?:\s*~\s*[0-9]+)?)\s*\(([^()]*)\)\s*$/);
    if(!mm||!cur) return;
    let name=mm[1].trim(), desc="";
    const dm=name.match(/^([^(]+)\((.+)\)$/);
    if(dm){ name=dm[1].trim(); desc=dm[2].trim() }
    cur.goods.push({name:name,price:mm[2].replace(/\s/g,""),qty:mm[3].trim(),desc:desc});
    n++;
  });
  return n;
}

      row.appendChild(del);
      e.appendChild(row);
    });
    e.appendChild(btn("＋ 선택지",()=>{picks.push({name:"",cond:"",result:""});touch();renderMain()},"mini"));
    p.appendChild(e);
  });
  p.appendChild(loadBtn(o,parseEvents,"이벤트"));
  m.appendChild(p);

function parseEvents(body){
  const o=CURSYS; o.events=[];
  let cur=null, n=0;
  String(body).split(/\r?\n/).forEach(line=>{
    const t=line.trim(); if(!t) return;
    if(/^-\s+/.test(t)){ cur={name:t.replace(/^-\s+/,"").trim(),flavor:"",picks:[]}; o.events.push(cur); n++; return }
    if(/^>\s*/.test(t)&&cur){
      const b=t.replace(/^>\s*/,"");
      const i=b.indexOf(":");
      cur.picks.push(i>0?{name:b.slice(0,i).trim(),cond:"",result:b.slice(i+1).trim()}
                        :{name:b.trim(),cond:"",result:""});
    }
  });
  return n;
}

/* ── UI 화면 ── */
function uiBlock(m,o){
  const scr=arrOf(o,"screens");
  const p=panel("화면",btn("＋ 화면",()=>{scr.push({name:"새 화면",desc:"",parts:[]});touch();renderMain()},"mini"));
  p.appendChild(h(`<p class="hint">화면 하나가 한 덩이입니다. <b>구성 요소</b>에는 그 화면에 놓일 것들을 하나씩 적어 두면 나중에 찾기 쉽습니다.</p>`));
  if(!scr.length) p.appendChild(h(`<p class="hint">아직 없습니다. 아래 [본문에서 불러오기]를 누르면 원문 메모의 <code>1. 제목</code> 형식을 화면 단위로 나눠 가져옵니다.</p>`));
  scr.forEach((sc,i)=>{
    const parts=arrOf(sc,"parts");
    const e=rowBox(i+1,()=>{scr.splice(i,1);touch();renderMain()},moveBtns(scr,i));
    e.appendChild(field("화면 이름",sc.name,v=>sc.name=v));
    const dd=field("설명",sc.desc,v=>sc.desc=v,"area");
    dd.querySelector("textarea").style.minHeight="150px";
    e.appendChild(dd);
    parts.forEach((pt,pi)=>{
      const row=h(`<div class="entry" style="padding:8px 10px"></div>`);
      row.appendChild(field("구성 요소",pt.name,v=>pt.name=v));
      row.appendChild(field("설명",pt.desc,v=>pt.desc=v,"area"));
      const del=h(`<div style="text-align:right"></div>`);
      del.appendChild(btn("요소 삭제",()=>{parts.splice(pi,1);touch();renderMain()},"mini danger"));
      row.appendChild(del);
      e.appendChild(row);
    });
    e.appendChild(btn("＋ 구성 요소",()=>{parts.push({name:"",desc:""});touch();renderMain()},"mini"));
    p.appendChild(e);
  });
  p.appendChild(loadBtn(o,parseScreens,"화면"));
  m.appendChild(p);
}
function parseScreens(body){
  const o=CURSYS; o.screens=[];
  let cur=null, n=0;
  String(body).split(/\r?\n/).forEach(line=>{
    const hd=line.trim().match(/^([0-9]+)\.\s*(.+)$/);
    if(hd){ cur={name:hd[2].trim(),desc:"",parts:[]}; o.screens.push(cur); n++; return }
    if(cur) cur.desc+=(cur.desc?"\n":"")+line;
  });
  o.screens.forEach(x=>x.desc=x.desc.replace(/\s+$/,""));
  return n;
}

/* ── 보상 상자 ── */
function chestBlock(m,o){
  const ch=arrOf(o,"chests");
  const p=panel("보상 상자",btn("＋ 상자",()=>{ch.push({stage:"",name:"",rows:[]});touch();renderMain()},"mini"));
  p.appendChild(h(`<p class="hint">한 줄이 항목 하나입니다. <b>확률</b>은 그 항목이 나올 확률이고, 100%는 반드시 나옵니다.</p>`));
  if(!ch.length) p.appendChild(h(`<p class="hint">아직 없습니다. 아래 [본문에서 불러오기]를 누르면 원문 메모의 <code>… 보상 상자: 100% 금화 1~3개 / …</code> 형식을 그대로 가져옵니다.</p>`));
  ch.forEach((c,i)=>{
    const rows=arrOf(c,"rows");
    const e=rowBox(i+1,()=>{ch.splice(i,1);touch();renderMain()},moveBtns(ch,i));
    const g2=h(`<div class="grid g2"></div>`);
    g2.append(field("스테이지",c.stage,v=>c.stage=v),field("상자",c.name,v=>c.name=v));
    e.appendChild(g2);
    rows.forEach((r,ri)=>{
      const row=h(`<div class="grid g3" style="align-items:end"></div>`);
      row.append(field("확률",r.p,v=>r.p=v),field("내용",r.what,v=>r.what=v));
      const d=h(`<div></div>`);
      d.appendChild(btn("삭제",()=>{rows.splice(ri,1);touch();renderMain()},"mini danger"));
      row.appendChild(d);
      e.appendChild(row);
    });
    e.appendChild(btn("＋ 항목",()=>{rows.push({p:"",what:""});touch();renderMain()},"mini"));
    p.appendChild(e);
  });
  p.appendChild(loadBtn(o,parseChests,"보상 상자"));
  m.appendChild(p);
}
function parseChests(body){
  const o=CURSYS; o.chests=[];
  let stage="", n=0;
  String(body).split(/\r?\n/).forEach(line=>{
    const t=line.trim(); if(!t) return;
    const hd=t.match(/^\[(.+?)\]/);
    if(hd){ stage=hd[1].trim(); return }
    const mm=t.match(/^(.+?상자)\s*:\s*(.+)$/);
    if(!mm) return;
    const rows=mm[2].split("/").map(x=>x.trim()).filter(Boolean).map(x=>{
      const pm=x.match(/^([0-9]+\s*%)\s*(.+)$/);
      return pm?{p:pm[1].replace(/\s/g,""),what:pm[2].trim()}:{p:"",what:x};
    });
    o.chests.push({stage:stage,name:mm[1].trim(),rows:rows}); n++;
  });
  return n;
}

/* ── 키워드 ── */
function keywordView(m){
  const p=panel("키워드 사전",btn("＋ 키워드",()=>{DB.keywords.push({name:"",cat:"buff",desc:""});touch();renderMain()},"mini"));
  p.appendChild(h(`<p class="hint" style="margin-bottom:14px"><b>칩에 표시</b>를 켠 키워드만 설명란 아래 버튼으로 나옵니다. 분류는 설명문에서 칠해질 색을 정합니다. debuff 보라 · buff 금 · atk 적 · mag 청 · def 황 · hp 녹 · move 청록 · plain 회색 · skill 주황</p>`));
  const stack=h(`<div class="stack"></div>`); p.appendChild(stack);
  DB.keywords.forEach((k,i)=>{
    const e=h(`<div class="entry"></div>`);
    const top=h(`<div class="top"><span class="tag" style="color:var(${KW_COLOR[k.cat]||"--brass"})">${esc(k.name)||"—"}</span><span class="grow"></span></div>`);
    const id="pin"+i;
    const chk=h(`<div class="check"><input type="checkbox" id="${id}"><label for="${id}" style="margin:0;font-size:12px">칩에 표시</label></div>`);
    const cb=chk.querySelector("input"); cb.checked=!!k.pin;
    cb.addEventListener("change",()=>{k.pin=cb.checked;touch()});
    top.appendChild(chk);
    top.appendChild(btn("삭제",()=>{DB.keywords.splice(i,1);touch();renderMain()},"mini danger"));
    const g=h(`<div class="grid g2"></div>`);
    g.append(field("이름",k.name,v=>{k.name=v}),field("분류",k.cat,v=>{k.cat=v;touch();resort();later(renderMain)},"select",KW_CATS));
    e.append(top,g,field("정의",k.desc,v=>k.desc=v,"area"));
    stack.appendChild(e);
  });
  m.appendChild(p);
}
