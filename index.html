/* ─ 비용 ─ */
function reachOf(h,sk){
  if(!sk) return null;
  if(h.name==="카제"&&sk.n==="진선풍도"){
    if(h.tag.noRange) return null;
    const every=(h.potential&&h.tag.potentialEvery)||h.tag.windEvery||3;
    const strong=h.tag.alwaysStrong||(((h.windUses||0)+1)%every===0);
    return (strong?3:sk.rng)+(h.windBuff||0);
  }
  return sk.rng||null;
}
function inReach(h,sk,slot){
  const r=reachOf(h,sk);
  return r==null || dist(h.slot,slot)<=r;
}
function farthestFoe(h){
  return B.foes.filter(f=>f.alive).sort((a,b)=>dist(h.slot,b.slot)-dist(h.slot,a.slot))[0];
}
function nearestFoe(h){
  return B.foes.filter(f=>f.alive).sort((a,b)=>dist(h.slot,a.slot)-dist(h.slot,b.slot))[0];
}
function pinnedFoe(h,sk){
  if(!sk) return null;
  if(sk.farshot) return farthestFoe(h);
  if(sk.nearest) return nearestFoe(h);
  return null;
}
function validTarget(h,sk,slot){
  if(!inReach(h,sk,slot)) return false;
  const p=pinnedFoe(h,sk);
  if(p) return p.slot===slot;
  return true;
}
function payCost(h,i){
  const s=h.sk[i];
  if(h===0) return s.cost;
  if(s.costType==="mom") return s.cost+h.airUp;
  if(s.costType==="scale") return s.cost;
  if(h.name==="카제"&&i===1&&h.free>0) return 0;
  if(h.tag.freeCut&&i===0&&h.guarded) return 0;
  return s.cost;
}
function canPay(h,i,n){
  const s=h.sk[i];
  if(s.limit&&(h.limitUsed[i]||0)+n>s.limit) return false;
  if(s.costType==="mom"){ let need=0,up=h.airUp; for(let k=0;k<n;k++){need+=s.cost+up;up++} return h.mom>=need }
  if(s.costType==="scale") return (h.scale||0)>=s.cost*n;
  if(s.ammo) return (h.ammo||0)>=n;
  let need=0,free=h.free,guard=h.guarded;
  for(let k=0;k<n;k++){
    if(h.name==="카제"&&i===1&&free>0){ free--; continue }
    if(h.tag.freeCut&&i===0&&guard){ guard=0; continue }
    need+=s.cost;
  }
  return h.mana>=need;
}

/* ─ 입력 ─ */
function pickUnit(s){
  if(B.over) return; const h=unitAt(s); if(!h) return;
  sel={hero:h,slot:s,step:2,skill:null,count:1}; render();
}
function pickSkill(i,count){
  const h=sel.hero, s=h.sk[i];
  if((i===2&&h.lv<UNLOCK[2])||(i===3&&h.lv<UNLOCK[3])){ say("아직 해제되지 않은 기술입니다.","t2"); return }
  if(h.lock[i]){ say(`${s.n}${jo(s.n,"eun")} ${h.lock[i]}턴 동안 잠금 상태입니다.`,"t2"); return }
  /* 이미 고른 기술을 다시 누르면 시전 횟수가 하나씩 늘어난다 */
  if(sel.skill===i&&sel.step===4){
    if(s.lock){ say(`${s.n}${jo(s.n,"eun")} 잠금 기술이라 한 번만 쓸 수 있습니다.`,"t2"); return }
    const n=(sel.count||1)+1;
    if(s.limit&&(h.limitUsed[i]||0)+n>s.limit){
      say(`${s.n}의 사용한도를 넘습니다.`,"t2"); return }
    if(!canPay(h,i,n)){ say(`${s.n}${jo(s.n,"eul")} ${n}회 쓸 자원이 모자랍니다.`,"t2"); return }
    sel.count=n; SFX.play("click"); render(); return;
  }
  sel.skill=i;
  if(count!=null){ pickCount(count); return }
  sel.step=3; render();
}
function pickCount(n){
  const h=sel.hero, s=h.sk[sel.skill];
  if(s.lock&&n>1){ say(`${s.n}${jo(s.n,"eun")} 잠금 기술이라 한 번만 쓸 수 있습니다.`,"t2"); n=1 }
  if(!canPay(h,sel.skill,n)){ say(`${s.n} ${n}회를 쓸 자원이 부족합니다.`,"t2"); return }
  sel.count=n; sel.step=4; render();
}
(function(){
  let tip=null;
  const box=()=>tip||(tip=document.getElementById("kwtip"));
  function show(el2){
    const k=el2.dataset.kw, d=KW_DESC[k]; if(!d) return;
    const b=box(); if(!b) return;
    const c=KW_COLOR[KW[k]]||KW_COLOR.plain;
    b.innerHTML='<b style="color:'+c+'">'+esc(k)+'</b>'+esc(d);
    b.style.display="block";
    const r=el2.getBoundingClientRect(), w=b.offsetWidth, h=b.offsetHeight;
    let x=r.left+r.width/2-w/2, y=r.top-h-9;
    if(y<6) y=r.bottom+9;
    b.style.left=Math.max(6,Math.min(innerWidth-w-6,x))+"px";
    b.style.top=Math.max(6,Math.min(innerHeight-h-6,y))+"px";
  }
  function hide(){ const b=box(); if(b) b.style.display="none" }
  document.addEventListener("mouseover",e=>{
    const t=e.target.closest&&e.target.closest(".kw[data-kw]");
    if(t) show(t);
  });
  document.addEventListener("mouseout",e=>{
    if(e.target.closest&&e.target.closest(".kw[data-kw]")) hide();
  });
  document.addEventListener("click",e=>{
    const t=e.target.closest&&e.target.closest(".kw[data-kw]");
    if(t) show(t); else hide();
  },true);
  window.addEventListener("scroll",hide,true);
})();
document.addEventListener("keydown",e=>{
  if(view!=="battle") return;
  if(e.key==="Escape"){ sel=null; render(); return }
  if(e.key==="Enter"){ endTurn(); return }
  const n=parseInt(e.key,10); if(isNaN(n)||n<1||n>9) return;
  e.preventDefault();
  if(!sel){ pickUnit(n); return }
  if(sel.step===2){ if(n<=4) pickSkill(n-1,null); return }
  if(sel.step===3){ pickCount(n); return }
  if(sel.step===4){ if(n<=SLOTS) doSkill(n); return }
  if(sel.step===5){ if(n<=SLOTS) shadowGoTo(n) }
});

/* ─ 드래그 소환 ─ */
function startDrag(card,i){
  card.addEventListener("pointerdown",e=>{
    if(B.over) return;
    e.preventDefault();
    const c=B.hand[i]; const g=el(`<div class="ghost">${card.outerHTML}</div>`);
    document.body.appendChild(g); card.style.opacity=".35";
    const move=ev=>{
      g.style.left=ev.clientX+"px"; g.style.top=ev.clientY+"px";
      document.querySelectorAll("#mySide .slot").forEach(s=>{
        const r=s.getBoundingClientRect();
        s.classList.toggle("drop", ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom);
      });
    };
    const up=ev=>{
      document.removeEventListener("pointermove",move);
      document.removeEventListener("pointerup",up);
      g.remove(); card.style.opacity="";
      let hit=null;
      document.querySelectorAll("#mySide .slot").forEach(s=>{
        const r=s.getBoundingClientRect();
        if(ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom) hit=+s.dataset.slot;
        s.classList.remove("drop");
      });
      if(hit) playCard(i,hit);
    };
    document.addEventListener("pointermove",move);
    document.addEventListener("pointerup",up);
    move(e);
  });
}
function onSummon(h){
  const t=h.tag;
  if(t.startMom){ h.mom+=t.startMom; say(`${h.name} 추진력 +${t.startMom} (눈보다 빠르게)`,"t2") }
  if(t.startEvade){ h.evade+=t.startEvade; say(`${h.name} 회피 +${t.startEvade} (자취 감추기)`,"t2") }
  if(t.startStorm){ say("폭풍 — 전장의 모든 적이 떠오릅니다.","t1");
    B.foes.filter(f=>f.alive).forEach(f=>airborne(h,f)) }
  const es=itemBt(h,"eshield")+(t.eshield||0);
  if(es){ h.eshield+=es; say(`${h.name} 에너지 보호막 +${es}`,"t2") }
  if(itemBt(h,"alwaysTaunt")){ h.taunt=99; h.permaTaunt=1 }
  const hm=itemBt(h,"hpMag"); if(hm) bumpTmp(h,"mag",Math.floor(h.hp*hm/100));
  const da=itemBt(h,"defAura"); if(da){ h.eshield+=h.def*da;
    say(`수호의 각인 — ${h.name} 에너지 보호막 +${h.def*da}`,"t2") }
  if(t.startBlade){ say("전장의 칼날 — 첫 일격이 전장을 훑습니다.","t1");
    B.foes.filter(f=>f.alive).forEach(f=>hurt(f,t.startBlade,"전장의 칼날","slash")) }
  if(t.startAura){ allUnits().forEach(a=>{ a.eshield=(a.eshield||0)+t.startAura });
    say(`전장의 방패 — 모든 아군 에너지 보호막 +${t.startAura}`,"t2") }
  const sm=itemBt(h,"startMom"), ss=itemBt(h,"startShield")+(t.startShield||0);
  if(sm){ h.mom+=sm; say(`${h.name} 추진력 +${sm} (장비)`,"t2") }
  if(ss){ h.shield+=ss; say(`${h.name} 보호막 +${ss}`,"t2") }
  if(h.name==="도미니코"){
    const dm=B.foes.filter(f=>f.alive&&f.demon).length;
    if(dm){ bumpTmp(h,"def",dm*2); say(`악마 혐오 — ${h.name} 이번 전투 동안 보호력 +${dm*2}`,"t2") }
  }
}
function bumpTmp(h,key,v){
  h.tmp=h.tmp||{};
  h.tmp[key]=(h.tmp[key]||0)+v;
  h[key]=(h[key]||0)+v;
  if(key==="maxHp") h.hp+=v;
}
function clearTmp(h){
  if(!h.tmp) return;
  for(const k in h.tmp) h[k]=(h[k]||0)-h.tmp[k];
  if(h.tmp.maxHp) h.hp=Math.min(h.hp,h.maxHp);
  if(h.hp<1&&h.maxHp>0) h.hp=Math.max(0,Math.min(h.hp,h.maxHp));
  h.tmp=null;
}
function gainScale(h,n){
  if(!n) return;
  h.scale=(h.scale||0)+n; h.scaleTurn=(h.scaleTurn||0)+n;
  fx({side:"mine",slot:h.slot,ring:"#9ad06a",txt:"비늘+"+n,cls:"shd",gap:60});
}
function singTune(h,t){
  if(t==="guard"){ const v=1+h.def;
    allUnits().forEach(a=>{ a.shield+=v; fx({side:"mine",slot:a.slot,ring:"#e0c85a",txt:"+"+v,cls:"shd",gap:60}) });
    say(`보호의 음율 — 모든 아군 보호막 +${v}`) }
  if(t==="life"){ const a=allUnits().sort((x,y)=>x.hp/x.maxHp-y.hp/y.maxHp)[0];
    if(a){ a.hp=Math.min(a.maxHp,a.hp+3);
      fx({side:"mine",slot:a.slot,s:"heal",txt:"+3",cls:"heal",gap:60});
      say(`생명의 음율 — ${a.name} 체력 +3`) } }
  if(t==="edge"){ const v=1+h.mag;
    B.foes.filter(f=>f.alive).forEach(f=>hurt(f,v,"날카로운 음율","mag")) }
  if(t==="shock"){ const f=nearestFoe(h);
    if(f){ addDeb(f,"stun",1); say(`충격의 음율 — ${f.name} 기절`) } }
}
function endShield(h,v){
  if(!v) return;
  h.shield+=v; h.keepShield=(h.keepShield||0)+v;
}
function veilCheck(h){
  if(h.name!=="카제") return;
  const need=Math.max(1,h.tag.veilNeed||12);
  const done=h.veilDone||0;
  if((h.acts||0)<need*(done+1)) return;
  h.veilDone=done+1;
  const v=(h.tag.veilAmt||4)+h.def;
  h.shield+=v;
  fx({side:"mine",slot:h.slot,s:"shield",ring:"#5fd8cf",txt:"+"+v,cls:"shd"});
  say(`회오리 장막 — ${h.name} 보호막 +${v}`,"t1");
  if(h.tag.veilAll) run.heroes.forEach(a=>{
    if(a!==h&&a.slot>0&&a.hp>0){ a.shield+=v;
      fx({side:"mine",slot:a.slot,ring:"#5fd8cf",txt:"+"+v,cls:"shd"}) } });
}
function playCard(i,slot){
  const c=B.hand[i]; if(!c) return;
  if(c.type==="summon"){
    if(unitAt(slot)){ say("그 칸에는 이미 누군가 있습니다.","t2"); return }
    const m=makeMin(c.name,slot);
    B.mins.push(m); B.hand.splice(i,1);
    fx({side:"mine",slot:slot,s:"summon",ring:"#a06ae0",glow:1,txt:"소환",cls:"shd",gap:60});
    say(`${c.name}${jo(c.name,"ig")} ${slot}번 칸에 소환됩니다.`,"t1");
    rollIntents(); render(); return;
  }
  if(c.type==="hero"){
    if(unitAt(slot)){ say("그 칸에는 이미 누군가 있습니다.","t2"); return }
    c.hero.slot=slot; B.hand.splice(i,1);
    fx({side:"mine",slot:slot,s:"summon",ring:"#7fd39a",glow:1,gap:60});
    onSummon(c.hero);
    rollIntents();
    say(`${c.hero.name}${jo(c.hero.name,"ig")} ${slot}번 칸에 자리를 잡습니다.`,"t1");
  }else{
    const h=unitAt(slot);
    if(!h){ say("카드를 쓸 아군이 없는 칸입니다.","t2"); return }
    c.use(h);
    if(c.stock){ useCard(c.stock);
      const e=(run.cards||[]).find(x=>x.n===c.stock);
      if(e){ c.d=CARD_LIB[c.stock].d+` (보유 ${e.c})` } else B.hand.splice(i,1);
    } else B.hand.splice(i,1);
  }
  render();
}

/* ─ 전투 처리 ─ */
function hurt(f,amt,tag,art,pierce,crit){
  let d=amt,s=0;
  if(!pierce){ s=Math.min(f.shield,d); f.shield-=s; d-=s }
  f.hp-=d;
  if(crit) FXQ.push({crit:1,side:"foe",slot:f.slot});
  fx({side:"foe",slot:f.slot,hit:1,art:art||"slash",txt:"-"+amt,
      cls:crit?"critbig":(art==="mag"?"mag":(amt>=15?"crit":"dmg")),
      gap:crit?170:undefined,
      s:crit?null:(art==="wind"?"wind":(art==="mag"?"mag":(art==="boom"?"boom":"slash")))});
  say(`${tag} → ${f.name}(${f.slot}번) ${crit?"치명타 ":""}피해 ${amt}${pierce?" (관통)":""}${s?` (보호막 ${s})`:""} · 남은 ${Math.max(0,f.hp)}`,crit?"t1":undefined);
  if(f.hp<=0&&f.alive){ f.alive=0;
    fx({side:"foe",slot:f.slot,s:"die",txt:"처치",cls:"crit",gap:170});
    say(`${f.name} 처치.`,"t1");
    if(f.isPhantom){
      const src=B.foes.find(x=>x.id===f.phantomOf&&x.alive);
      if(src) hurt(src,f.backlash||4,"환영의 반동","mag");
    }
    /* 원래 적이 죽으면 그 환영도 함께 사라진다 */
    B.foes.filter(x=>x.alive&&x.isPhantom&&x.phantomOf===f.id).forEach(x=>{
      x.alive=0; say(`${x.name}${jo(x.name,"ig")} 흩어집니다.`,"t2") });
    (B.mins||[]).filter(m=>m.alive&&m.phantomOf===f.id).forEach(m=>{
      m.alive=0; m.slot=0; say(`환영이 흩어집니다.`,"t2") });
    onDeath("foe",f) }
}
function onDeath(kind,who){
  /* 쿠렘타이 영혼 수확 */
  if(run.heroes.some(h=>h.name==="쿠렘타이")){
    let g=0;
    if(kind==="foe") g=(who&&who.isPhantom)?1:(who&&who.boss?10:(B&&B.kind==="elite"?5:1));
    else if(kind==="min") g=1;
    else if(kind==="ally") g=5;
    if(who&&who.name==="환영") g=1;
    if(g){ run.souls=(run.souls||0)+g;
      const k=run.heroes.find(h=>h.name==="쿠렘타이");
      const want=Math.floor(run.souls/40);
      if(k&&(k.soulMag||0)<want){ const add=want-(k.soulMag||0); k.soulMag=want; k.mag+=add;
        say(`영혼 수확 — ${k.name}의 마법력이 ${add} 올랐습니다. (영혼 ${run.souls})`,"t1") }
    }
  }
  if(kind==="foe"){
    run.heroes.forEach(h=>{
      if(h.name==="보아"&&h.slot>0&&h.venom) gainScale(h,10);
      if(h.name==="데린저"&&who&&h.aimAt!=null&&h.aimAt===who.id){ h.aimAt=null;
        if(h.deb) h.deb.bind=0; say(`${h.name} 조준이 풀립니다.`,"t2") }
    });
  }
  run.heroes.forEach(h=>{
    if(kind!=="min"&&h.name==="굴라"&&h.slot>0&&h.greed<(h.tag.greedCap||5)){ h.greed++; h.maxHp++; h.hp++ }
    if(kind==="foe"&&h.name==="인비디아"&&h.slot>0&&h.hp>0){
      const got=[];
      if(Math.random()<0.25){ bumpTmp(h,"atk",1); got.push("공격력") }
      if(Math.random()<0.25){ bumpTmp(h,"mag",1); got.push("마법력") }
      if(Math.random()<0.25){ bumpTmp(h,"def",1); got.push("보호력") }
      if(Math.random()<0.25){ bumpTmp(h,"maxHp",4); got.push("최대 체력") }
      if(got.length) say(`재능 시기 — ${h.name}${jo(h.name,"ig")} 이번 전투 동안 ${got.join("·")}${jo(got[got.length-1],"eul")} 흡수합니다.`,"t1");
    }
  });
}
function airborne(h,f){
  if(!f.alive) return; f.air=1;
  fx({side:"foe",slot:f.slot,art:"wind",s:"wind",txt:"공중",cls:"shd",gap:130});
  say(`${f.name}${jo(f.name,"ig")} 공중에 뜸.`,"t2");
  run.heroes.forEach(b=>{
    if(b.name==="보아"&&b.slot>0&&b.venom&&f.alive&&(b.scale||0)>0)
      hurt(f,b.scale,"독소 침","mag");
  });
  if(h.name==="카제"){
    hurt(f,4+h.atk+(h.tag.airBonus||0),"바람처럼 사라져라","wind");
    if(h.tag.burn&&f.alive){ f.burn=(f.burn||0)+h.tag.burn;
      say(`${f.name} 화상 ${f.burn}`,"t2") }
  }
}
function doSkill(target){
  const h=sel.hero,i=sel.skill,n=sel.count,s0=h.sk[i];
  if(s0.tg==="foe"){
    if(!foeAt(target)){ say("그 칸에는 적이 없습니다.","t2"); return }
    if(!inReach(h,s0,target)){
      const r=reachOf(h,s0);
      fx({side:"foe",slot:target,s:"miss",txt:"사거리 "+r,cls:"miss"});
      say(`사거리 ${r} 밖입니다. 다른 대상을 고르세요.`,"t2"); render(); return;
    }
    const pin=pinnedFoe(h,s0);
    if(pin&&pin.slot!==target){
      say(`${s0.n}${jo(s0.n,"eun")} 가장 ${s0.farshot?"멀리":"가까이"} 있는 적(${pin.slot}번)만 겨눌 수 있습니다.`,"t2");
      render(); return;
    }
  }
  if(s0.shadow&&!h.shadowAt&&sel.moveTo==null){
    sel.target=target; sel.step=5; SFX.play("click"); render(); return;
  }
  h.shadowGo=(sel.moveTo!=null?sel.moveTo:0);
  say(`▸ ${h.name} — ${s0.n} ×${n}`,"t1");
  for(let k=0;k<n;k++){
    if(B.over||h.hp<=0) break;
    const s=h.sk[i];
    if(deb(h,"fear")&&(s.tg==="foe"||s.tg==="any")){
      say(`${h.name}${jo(h.name,"eun")} 공포에 질려 대상을 노려보지 못합니다.`,"t3"); break }
    /* 전환(방패 막기 ↔ 방패 밀치기)처럼 도중에 대상 종류가 바뀌면 겨눌 적을 다시 고른다 */
    if(s.tg==="foe"&&(target==null||!foeAt(target)||!inReach(h,s,target))){
      const re=pinnedFoe(h,s)
        || B.foes.filter(f=>f.alive&&inReach(h,s,f.slot))
                 .sort((a,b)=>dist(h.slot,a.slot)-dist(h.slot,b.slot))[0];
      if(!re){ say(`${s.n} — 사거리 안에 적이 없어 중단합니다.`,"t2"); break }
      if(re.slot!==target){ target=re.slot;
        say(`${s.n}${jo(s.n,"eun")} ${re.name}(${re.slot}번)에게 나갑니다.`,"t2") }
    }
    { const pn=pinnedFoe(h,s); if(pn) target=pn.slot; else if(s.farshot||s.nearest) break }
    if(!canPay(h,i,1)){ say("자원이 부족해 중단합니다.","t2"); break }
    /* 비용 지불 */
    if(s.costType==="scale"){ h.scale-=s.cost }
    else if(s.costType==="mom"){ h.mom-=s.cost+h.airUp; h.airUp++ }
    else if(h.name==="카제"&&i===1&&h.free>0){ h.free-- }
    else if(h.tag.freeCut&&i===0&&h.guarded){ h.guarded=0 }
    else { h.mana-=s.cost; h.manaUsed=(h.manaUsed||0)+s.cost;
      if(h.name==="이테리오"&&s.cost){ bumpTmp(h,"mag",s.cost); h.manaMag=(h.manaMag||0)+s.cost } }
    if(s.ammo){ h.ammo=Math.max(0,(h.ammo||0)-1) }
    if(s.limit) h.limitUsed[i]=(h.limitUsed[i]||0)+1;
    if(s.lock) h.lock[i]=s.lock+1;
    if(deb(h,"chill")){ const v=h.deb.chill;
      h.hp-=v; fx({side:"mine",slot:h.slot,hit:1,txt:"-"+v,cls:"dmg",gap:70});
      say(`${h.name} 냉각 피해 ${v}`,"t3") }
    if(deb(h,"stun")){ h.deb.stun--;
      fx({side:"mine",slot:h.slot,txt:"기절",cls:"miss",gap:70});
      say(`${h.name}${jo(h.name,"eun")} 기절해 ${s.n}${jo(s.n,"ig")} 불발됩니다.`,"t3");
      continue }
    runEffect(h,i,s,target);
    if(s.read) addRead(h,s.read);
    if(h.mobile&&!s.jumpback){
      const back=h.slot-1;
      if(back>=1&&!unitAt(back)) moveTo(h,back);
      else { const v=1+h.mag; h.eshield=(h.eshield||0)+v;
        fx({side:"mine",slot:h.slot,ring:"#e07b28",txt:"◆+"+v,cls:"shd",gap:60}) }
    }
    if(s.alt){
      const back=Object.assign({},s); const nx=Object.assign({},s.alt);
      back.mods=s.mods; nx.mods=s.alt.mods;
      delete back.alt; nx.alt=back; h.sk[i]=nx;
      say(`${s.n} → ${nx.n}${jo(nx.n,"eu")}로 전환됩니다.`,"t2");
    }
    if(h.name==="카제"&&(s.el==="이동"||s.dmg!=null)){ h.acts=(h.acts||0)+1; veilCheck(h) }
    if(s.tg==="foe"&&!foeAt(target)&&k<n-1){
      const _s=h.sk[i];
      const alt=pinnedFoe(h,_s)
        || B.foes.filter(f=>f.alive&&inReach(h,_s,f.slot))
                 .sort((a,b)=>dist(h.slot,a.slot)-dist(h.slot,b.slot))[0];
      if(!alt) break;
      target=alt.slot; say(`대상이 쓰러져 ${alt.name}(${alt.slot}번)으로 옮깁니다.`,"t2");
    }
  }
  sel=null; checkEnd(); render();
}
function shadowGoTo(slot){
  if(!sel||sel.step!==5) return;
  const h=sel.hero;
  if(Math.abs(slot-h.slot)>2){ say("최대 2칸까지만 움직일 수 있습니다.","t2"); return }
  sel.moveTo=slot; sel.step=4; SFX.play("click");
  doSkill(sel.target);
}
function emptyOkAny(sk){ return !!(sk&&(sk.phantom||sk.minion)) }
function moveTo(h,to){
  if(deb(h,"bind")){ say(`${h.name}${jo(h.name,"eun")} 속박되어 움직일 수 없습니다.`,"t3"); return }
  const from=h.slot, occ=unitAt(to);
  if(occ&&occ!==h&&occ.noMove){ say(`${occ.name}${jo(occ.name,"eun")} 움직일 수 없습니다.`,"t2"); return }
  h.slot=to;
  if(occ&&occ!==h){ occ.slot=from;
    say(`${h.name}${jo(h.name,"gwa")} ${occ.name}${jo(occ.name,"ig")} 자리를 바꿉니다.`);
    fx({side:"mine",slot:from,s:"step",ring:"#5fd8cf",gap:60});
  } else say(`${h.name} ${from}번 → ${to}번`);
  fx({side:"mine",slot:to,s:"step",ring:"#5fd8cf",glow:1,gap:90});
  if(deb(h,"shock")){ const v=h.deb.shock;
    h.hp-=v; fx({side:"mine",slot:h.slot,hit:1,txt:"-"+v,cls:"dmg",gap:70});
    say(`${h.name} 감전 피해 ${v}`,"t3") }
}
function infectFoe(f,n){
  if(!f.alive) return;
  f.infect=(f.infect||0)+n;
  fx({side:"foe",slot:f.slot,ring:"#8f5fd0",txt:"감염"+f.infect,cls:"mag",gap:80});
}
function addRead(h,n){
  if(h.name!=="도미니코") return;
  h.read=(h.read||0)+n+(h.tag.readPlus||0);
  const need=h.tag.readNeed||10;
  if(h.read>=need&&!h.blessed){ h.read-=need; h.blessed=1;
    fx({side:"mine",slot:h.slot,s:"summon",ring:"#c9a227",txt:"축복",cls:"crit"});
    say(`${h.name} 축복 상태 — 다음 기술이 강화됩니다.`,"t1") }
}
function runEffect(h,i,s,target){
  const tgt=foeAt(target);
  /* ── 쿠렘타이 ── */
  if(s.drain){
    const t0=foeAt(target); if(!t0){ say("그 칸에는 적이 없습니다.","t2"); return }
    const so=run.souls||0;
    const list=[t0];
    if(so>=20){ const b=foeAt(target+1); if(b) list.push(b) }
    if(so>=60){ const f2=foeAt(target-1); if(f2) list.push(f2) }
    const times=so>=200?2:1;
    const dmg=s.dmg+mod(s,"dmg")+h.mag;
    for(let q=0;q<times;q++) list.forEach(f=>{ if(f.alive) hurt(f,dmg,"착취","mag",so>=140) });
    return;
  }
  if(s.phantom){
    if(B.mins.some(m=>m.alive&&m.name==="환영")||B.foes.some(f=>f.alive&&f.isPhantom)){
      say("환영은 전장에 하나만 세울 수 있습니다.","t2"); return }
    const src=B.foes.filter(f=>f.alive&&!f.isPhantom).sort((a,b)=>a.hp-b.hp)[0];
    if(!src){ say("적이 없습니다.","t2"); return }
    const slot=Math.abs(target), mine=(target<0);
    const back=4+h.mag+Math.round(src.maxHp*(0.10+(run.souls||0)/40*0.025));
    if(mine){
      if(unitAt(slot)){ say("그 칸에는 이미 누군가 있습니다.","t2"); return }
      const m=makeMin("환영",slot);
      m.maxHp=src.hp; m.hp=src.hp; m.owner=h.name; m.phantomOf=src.id; m.backlash=back;
      B.mins.push(m);
    }else{
      if(foeAt(slot)){ say("그 칸에는 이미 적이 있습니다.","t2"); return }
      B.foes.push({name:"환영",slot:slot,maxHp:src.hp,hp:src.hp,atk:0,def:0,rng:0,exp:1,
        demon:0,boss:0,shield:0,air:0,alive:1,id:B.foes.length+100,infect:0,stun:0,weak:0,
        isPhantom:1,phantomOf:src.id,backlash:back});
    }
    fx({side:mine?"mine":"foe",slot:slot,art:"mag",s:"summon",txt:"환영",cls:"mag"});
    say(`${src.name}의 환영이 ${mine?"아군":"적"} ${slot}번 칸에 나타납니다.`,"t1");
    return;
  }
  if(s.phantomPain){
    const v=h.mag;
    if(!v){ say("아직 추가 마법력이 없습니다.","t2"); return }
    B.foes.filter(f=>f.alive).forEach(f=>hurt(f,v,"환상통","mag"));
    return;
  }
  if(s.verdict){
    if(h.verdictUsed){ say("이번 전투에는 이미 썼습니다.","t2"); return }
    if(target<0){
      const a=allyAt(-target); if(!a){ say("그 칸에는 아군이 없습니다.","t2"); return }
      h.verdictUsed=1; a.hp=Math.max(1,Math.round(a.maxHp*0.5)); bumpTmp(a,"mag",2);
      fx({side:"mine",slot:a.slot,art:"mag",s:"summon",txt:"선고",cls:"crit"});
      say(`사형 선고 — ${a.name}${jo(a.name,"eul")} 한 번 죽였다가 되살립니다. 마법력 +2`,"t1");
      return;
    }
    const f=foeAt(target); if(!f){ say("그 칸에는 적이 없습니다.","t2"); return }
    if(f.boss){ say("우두머리에게는 통하지 않습니다.","t2"); return }
    h.verdictUsed=1;
    hurt(f,f.hp+f.shield,"사형 선고","mag",1);
    const nf=B.foes.find(x=>x.id===f.id);
    nf.alive=1; nf.hp=Math.max(1,Math.round(nf.maxHp*0.5)); nf.shield=0;
    addDeb(nf,"fear",2);
    say(`${nf.name}${jo(nf.name,"ig")} 죽었다가 다시 일어섭니다.`,"t1");
    return;
  }
  /* ── 이테리오 ── */
  if(s.allHit){
    const dmg=s.dmg+mod(s,"dmg")+h.atk;
    B.foes.filter(f=>f.alive).forEach(f=>hurt(f,dmg,"팽창 공격","slash"));
    return;
  }
  if(s.jumpback){
    const to=Math.max(1,Math.min(SLOTS,target||h.slot));
    if(to!==h.slot&&Math.abs(to-h.slot)<=2) moveTo(h,to);
    h.mobile=1;
    fx({side:"mine",slot:h.slot,ring:"#6aa8e0",txt:"기동",cls:"shd"});
    say(`${h.name} 기동 상태 — 기술을 쓸 때마다 한 칸 물러섭니다.`);
    return;
  }
  if(s.magnet){
    const f=foeAt(target); if(!f){ say("그 칸에는 적이 없습니다.","t2"); return }
    const marked=(f.mark||0)>0;
    hurt(f,s.dmg+mod(s,"dmg")+h.mag,"자기장 변환","mag");
    if(marked&&f.alive){
      f.mark--;
      if(f.slot>1&&!foeAt(f.slot-1)){ f.slot--; addDeb(f,"bind",1);
        say(`${f.name}${jo(f.name,"ig")} 끌려오며 속박됩니다.`) }
      else addDeb(f,"stun",1);
    }
    return;
  }
  if(s.warp){
    const alive=B.foes.filter(f=>f.alive);
    if(!alive.length) return;
    alive.forEach(f=>{ f.mark=(f.mark||0)+1 });
    const slots=alive.map(f=>f.slot);
    for(let q=slots.length-1;q>0;q--){ const r2=Math.floor(Math.random()*(q+1));
      const t2=slots[q]; slots[q]=slots[r2]; slots[r2]=t2 }
    alive.forEach((f,i)=>{ f.slot=slots[i] });
    fx({side:"foe",slot:alive[0].slot,art:"mag",s:"mag",txt:"뒤섞임",cls:"mag"});
    say("시공간 폭탄 — 적들이 표식과 함께 흩어집니다.","t1");
    return;
  }
  /* ── 데린저 ── */
  if(s.dump){
    const n2=h.ammo||0;
    if(!n2){ say("탄알이 없습니다.","t2"); h.ammo=5; return }
    const f=foeAt(target); if(!f){ say("그 칸에는 적이 없습니다.","t2"); return }
    hurt(f,n2,"탄알 장전","slash");
    h.ammo=5;
    say(`${h.name} 탄알을 모두 채웁니다. (5/5)`);
    return;
  }
  if(s.aim){
    const f=foeAt(target);
    if(h.aimAt!=null){ h.aimAt=null; say(`${h.name} 조준을 풉니다.`); return }
    if(!f){ say("그 칸에는 적이 없습니다.","t2"); return }
    h.aimAt=f.id; addDeb(h,"bind",99);
    fx({side:"foe",slot:f.slot,ring:"#e0705a",txt:"조준",cls:"dmg"});
    say(`${h.name}${jo(h.name,"ig")} ${f.name}${jo(f.name,"eul")} 조준합니다.`,"t1");
    return;
  }
  if(s.headshot){
    h.tag.headshot=1;
    say(`${h.name} 헤드샷 — 매 턴 첫 사격이 무거워집니다.`,"t1");
    return;
  }
  /* ── 리페 ── */
  if(s.tune){
    h.tunes=h.tunes||[];
    h.tunes.push(s.tune);
    fx({side:"mine",slot:h.slot,ring:"#e08ac0",txt:`음율 ${h.tunes.length}/3`,cls:"shd"});
    say(`${s.n}${jo(s.n,"eul")} 음율란에 담습니다. (${h.tunes.length}/3)`);
    if(h.tunes.length>=3){
      const order=h.tunes.slice();
      if(h.encore){ h.encore=0; order.push.apply(order,h.tunes.slice().reverse()) }
      say("음율란이 가득 찼습니다. 노래가 시작됩니다.","t1");
      order.forEach(t=>singTune(h,t));
      h.tunes=[];
    }
    return;
  }
  if(s.wrap){
    const a=allyAt(Math.abs(target))||h;
    a.negShield=(a.negShield||0)+1;
    fx({side:"mine",slot:a.slot,ring:"#7fd39a",txt:"부정막",cls:"shd"});
    say(`${a.name} 부정 보호막 +1`);
    return;
  }
  if(s.encore){
    h.encore=1;
    say("순환의 선율 — 이번 음율란은 역순으로 한 번 더 울립니다.","t1");
    return;
  }
  /* ── 그슨대 ── */
  if(s.shadow){
    const f=foeAt(target);
    if(f) hurt(f,s.dmg+mod(s,"dmg")+h.atk+(h.hide?(s.dmg+mod(s,"dmg")+h.atk):0),
      "그림자 기습","slash",0,h.hide?1:0);
    if(h.hide){ h.hide=0 }
    if(h.shadowAt){
      const to=h.shadowAt, dark=(h.darkAt===to);
      h.shadowAt=0; h.darkAt=0;
      if(to!==h.slot){ shadeDash(h.slot,to); moveTo(h,to) }
      if(dark){
        h.taunt=1; h.armor=(h.armor||0)+4;
        fx({side:"mine",slot:h.slot,ring:"#7a4ab0",txt:"도발·갑피4",cls:"mag",gap:120});
        say(`${h.name}${jo(h.name,"ig")} 어두운 그림자에서 솟아납니다 — 도발 · 갑피 4`,"t1");
      }else{
        h.hide=1; hideFX(h.slot);
        fx({side:"mine",slot:h.slot,ring:"#a06ae0",txt:"은신",cls:"shd",gap:160});
        say(`${h.name}${jo(h.name,"ig")} 그림자 속으로 사라집니다.`,"t1");
      }
    }else{
      const go=h.shadowGo||0; h.shadowGo=0;
      h.shadowAt=h.slot;
      fx({side:"mine",slot:h.slot,ring:"#7a4ab0",txt:"그림자",cls:"mag",gap:60});
      if(go&&go!==h.slot&&Math.abs(go-h.slot)<=2){ shadeDash(h.slot,go); moveTo(h,go) }
      say(`${h.name}${jo(h.name,"ig")} ${h.shadowAt}번 칸에 그림자를 남기고 빠져나갑니다.`);
    }
    return;
  }
  if(s.leech){
    h.leech=1;
    if(h.shadowAt){ const to=h.shadowAt; h.shadowAt=0; h.darkAt=0;
      if(to!==h.slot){ shadeDash(h.slot,to); moveTo(h,to) }
      h.pierceNext=1; say(`${h.name} 흡수 20% · 관통 50%`) }
    else say(`${h.name} 다음 기술이 흡수 20%를 얻습니다.`);
    return;
  }
  if(s.stance){
    h.stance=s.stance; h.stanceTurn=2;
    if(s.shield){ const v=s.shield+mod(s,"shield")+h.def;
      h.shield+=v; fx({side:"mine",slot:h.slot,s:"shield",ring:"#e0c85a",txt:"+"+v,cls:"shd",gap:70}) }
    fx({side:"mine",slot:h.slot,ring:"#a06ae0",txt:s.stance==="nightmare"?"악몽":"공포",cls:"shd"});
    say(`${h.name} ${s.n} — 다음 턴까지 맞을 때마다 되갚습니다.`);
    return;
  }
  if(s.darkShadow){
    const slot=Math.abs(target)||h.slot;
    h.darkAt=slot; h.shadowAt=slot;
    fx({side:"mine",slot:slot,ring:"#7a4ab0",txt:"어둠",cls:"mag"});
    say(`${slot}번 칸에 어두운 그림자가 깔립니다.`,"t1");
    return;
  }
  /* ── 오토 ── */
  if(s.soothe){
    const to=Math.max(1,Math.min(SLOTS,target||h.slot));
    if(to!==h.slot&&Math.abs(to-h.slot)<=2) moveTo(h,to);
    h.mom+=2;
    allUnits().forEach(a=>{ if(Math.abs(a.slot-h.slot)<=1){ a.eshield=(a.eshield||0)+4;
      fx({side:"mine",slot:a.slot,ring:"#e07b28",txt:"◆+4",cls:"shd",gap:70}) } });
    say(`${h.name} 주변 아군에게 에너지 보호막 +4 · 추진력 +2`);
    return;
  }
  if(s.grow){
    allUnits().forEach(a=>{ bumpTmp(a,"mag",1); bumpTmp(a,"def",1) });
    fx({side:"mine",slot:h.slot,art:"mag",s:"summon",txt:"성장",cls:"crit"});
    say("녹슨 성장 — 모든 아군이 이번 전투 동안 마법력·보호력 +1","t1");
    return;
  }
  if(s.seed){
    const f=B.foes.filter(x=>x.alive).sort((a,b)=>b.hp-a.hp)[0];
    if(!f){ say("적이 없습니다.","t2"); return }
    fx({side:"foe",slot:f.slot,quake:1,s:"quake",gap:240});
    hurt(f,s.dmg+mod(s,"dmg")+h.mag*2,"고대수목의 씨앗","mag");
    return;
  }
  /* ── 보아 ── */
  if(s.scaleGain){
    const f=foeAt(target); if(!f){ say("그 칸에는 적이 없습니다.","t2"); return }
    const d=dist(h.slot,f.slot);
    hurt(f,s.dmg+mod(s,"dmg")+h.mag,"가시 꼬리","mag");
    gainScale(h,d);
    return;
  }
  if(s.quakeUp){
    const f=foeAt(target); if(!f){ say("그 칸에는 적이 없습니다.","t2"); return }
    airborne(h,f);
    if(f.alive){
      if(f.slot<SLOTS&&!foeAt(f.slot+1)){ f.slot++; say(`${f.name}${jo(f.name,"ig")} 뒤로 밀려납니다.`) }
      else addDeb(f,"bind",2);
    }
    return;
  }
  if(s.venom){ h.venom=1; say(`${h.name} 독소 침 — 공중에 뜬 적이 비늘만큼 아파집니다.`,"t1"); return }
  if(s.scaleBoom){
    const v=h.scale||0;
    if(!v){ say("비늘 조각이 없습니다.","t2"); return }
    h.scale=0;
    B.foes.filter(f=>f.alive).forEach(f=>hurt(f,v,"비늘 폭발","boom"));
    fx({side:"mine",slot:h.slot,quake:1,s:"quake",gap:220});
    return;
  }
  /* ── 헥토 ── */
  if(s.justice){
    const alive=B.foes.filter(f=>f.alive);
    const list=h.tag.justiceAll?alive
      :alive.sort((a,b)=>dist(h.slot,a.slot)-dist(h.slot,b.slot)).slice(0,1);
    const times=h.tag.justiceTwice?2:1;
    for(let t=0;t<times;t++) list.forEach(f=>{ if(f.alive) hurt(f,h.shield,"정의의 기운","slash") });
    return;
  }
  if(s.vanguard||s.rearguard){
    const to=s.vanguard?SLOTS:1, step=s.vanguard?1:-1, passed=[];
    for(let q=h.slot+step; (s.vanguard?q<=SLOTS:q>=1); q+=step){ const a=allyAt(q); if(a&&a!==h) passed.push(a) }
    if(h.slot!==to) moveTo(h,to);
    fx({side:"mine",slot:h.slot,quake:1,leap:1,s:"quake",gap:280});
    if(s.vanguard){
      const v=((h.tag.vanShield||5)+h.def)*passed.length;
      h.shield+=v; h.taunt=2;
      fx({side:"mine",slot:h.slot,s:"shield",ring:"#8fa2c9",txt:"+"+v,cls:"shd"});
      say(`선두 방어 — ${h.name} 보호막 +${v}, 도발`);
    }else{
      const v=h.tag.rearHeal||5, sh=5+h.def;
      h.hp=Math.min(h.maxHp,h.hp+v);
      passed.forEach(a=>{ a.shield+=sh; fx({side:"mine",slot:a.slot,ring:"#8fa2c9",txt:"+"+sh,cls:"shd",gap:70}) });
      fx({side:"mine",slot:h.slot,s:"heal",txt:"+"+v,cls:"heal"});
      say(`후미 준비 — 체력 +${v}, 지나친 아군 보호막 +${sh}`);
    }
    if(h.tag.guardMom) h.mom+=h.tag.guardMom;
    return;
  }
  if(s.wall){
    const nm=h.tag.cursedWall?"저주받은 성벽":"성벽";
    B.hand.push({type:"summon",name:nm});
    fx({side:"mine",slot:h.slot,s:"summon",ring:"#8fa2c9",txt:nm,cls:"shd"});
    say(`${nm} 카드를 손에 넣었습니다. 빈 칸에 끌어다 소환하세요.`,"t1"); return;
  }
  /* ── 트리스탄 ── */
  if(s.farshot){
    const f=B.foes.filter(x=>x.alive).sort((a,b)=>dist(h.slot,b.slot)-dist(h.slot,a.slot))[0];
    if(!f){ say("적이 없습니다.","t2"); return }
    fx({side:"foe",slot:f.slot,streak:{side:"mine",slot:h.slot},s:"arrow",gap:120});
    hurt(f,s.dmg+mod(s,"dmg")+h.atk,"페일노트","slash"); return;
  }
  if(s.armorUp){
    h.armor=(h.armor||0)+1+(h.tag.armorPlus||0);
    fx({side:"mine",slot:h.slot,s:"shield",ring:"#e0c85a",txt:"갑피"+h.armor,cls:"shd"});
    say(`${h.name} 갑피 ${h.armor}`); return;
  }
  /* ── 인비디아 ── */
  if(s.nearest){
    const f=foeAt(target)||nearestFoe(h);
    if(!f){ say("적이 없습니다.","t2"); return }
    if((f.infect||0)>=3){ h.hp=Math.min(h.maxHp,h.hp+4);
      fx({side:"mine",slot:h.slot,s:"heal",txt:"+4",cls:"heal"}); say(`${h.name} 체력 +4`) }
    hurt(f,s.dmg+mod(s,"dmg")+h.mag,"죄악의 기침","mag");
    infectFoe(f,h.tag.infectPlus||1);
    return;
  }
  if(s.spread){
    const t2=foeAt(target); if(!t2){ say("그 칸에는 적이 없습니다.","t2"); return }
    const r=h.tag.spreadRange||1;
    B.foes.filter(f=>f.alive&&f.infect>0).forEach(f=>{ f.weak=(f.weak||0)+1 });
    infectFoe(t2,1);
    B.foes.filter(f=>f.alive&&f!==t2&&Math.abs(f.slot-t2.slot)<=r).forEach(f=>infectFoe(f,1));
    say("확산 — 감염이 번집니다.","t1"); return;
  }
  if(s.burst){
    const x=h.tag.burstX||2;
    fx({side:"mine",slot:h.slot,quake:1,s:"boom",gap:200});
    B.foes.filter(f=>f.alive).forEach(f=>{
      const d=3+h.mag+(f.infect||0)*x; f.infect=0; hurt(f,d,"숙주 폭발","mag") });
    return;
  }
  if(s.frontal){
    const list=B.foes.filter(f=>f.alive&&(f.infect||0)>=3);
    if(!list.length){ say("감염이 깊은 적이 없습니다.","t2"); return }
    list.forEach(f=>{ infectFoe(f,1); f.forceDef=1 });
    say("전두엽 감염 — 감염이 깊은 적들이 움츠러듭니다.","t1"); return;
  }
  /* ── 도미니코 ── */
  if(s.wand){
    const v=1+(h.tag.wandPlus||0);
    if(target<0){
      const a=allyAt(-target); if(!a){ say("그 칸에는 아군이 없습니다.","t2"); return }
      a.hp=Math.min(a.maxHp,a.hp+v);
      fx({side:"mine",slot:a.slot,s:"heal",txt:"+"+v,cls:"heal"}); say(`${a.name} 체력 +${v}`);
    }else{
      const f=foeAt(target); if(!f){ say("그 칸에는 적이 없습니다.","t2"); return }
      hurt(f,1+v+h.def,"라이티늄 지팡이","mag");
    }
    if(h.blessed){ h.blessed=0; h.evade++; say("축복 — 회피 +1","t1") }
    return;
  }
  if(s.weaken){
    const f=foeAt(target); if(!f){ say("그 칸에는 적이 없습니다.","t2"); return }
    f.weakAtk=(f.weakAtk||0)+3;
    if(h.blessed){ h.blessed=0; f.weak=(f.weak||0)+3; say("축복 — 보호력도 약화","t1") }
    fx({side:"foe",slot:f.slot,ring:"#8f5fd0",txt:"약화",cls:"miss"});
    say(`${f.name} 다음 턴 공격력 -3`); return;
  }
  if(s.shackle){
    const gain=h.atk+h.mag;
    bumpTmp(h,"def",gain); bumpTmp(h,"atk",-h.atk); bumpTmp(h,"mag",-h.mag);
    if(gain) say(`영광의 족쇄 — 공격력·마법력 ${gain}을 보호력으로 전환`);
    const alive=B.foes.filter(f=>f.alive);
    const list=h.blessed?alive:alive.sort((a,b)=>dist(h.slot,a.slot)-dist(h.slot,b.slot)).slice(0,1);
    if(h.blessed){ h.blessed=0; say("축복 — 모든 적을 기절","t1") }
    list.forEach(f=>{ f.stun=1; hurt(f,8+h.def+(h.tag.shacklePlus||0),"영광의 족쇄","mag") });
    return;
  }
  if(s.penance){
    const rounds=h.tag.penanceTwice?2:1;
    for(let r=0;r<rounds;r++){
      let v=1+h.def;
      for(let q=1;q<=SLOTS;q++){ const a=allyAt(q); if(a){ a.shield+=v;
        fx({side:"mine",slot:q,ring:"#c9a227",txt:"+"+v,cls:"shd",gap:70}); v++ } }
      for(let q=1;q<=SLOTS;q++){ const f=foeAt(q); if(f){ hurt(f,v,"참회의 기류","mag"); v++ } }
      for(let q=SLOTS;q>=1;q--){ const f=foeAt(q); if(f){ hurt(f,v,"참회의 기류","mag"); v++ } }
    }
    const fars=B.foes.filter(f=>f.alive);
    if(fars.length){ const far=fars.reduce((a,b)=>a.slot>=b.slot?a:b);
      fx({side:"foe",slot:far.slot,sweep:{side:"mine",slot:h.slot},s:"tornado",gap:240});
      fx({side:"mine",slot:h.slot,sweep:{side:"foe",slot:far.slot},gap:240}); }
    say("참회의 기류가 오갑니다.","t1"); return;
  }
  if(s.el==="이동"){
    const reach=h.tag.gustRange||1;
    if(target&&target!==h.slot&&!h.tag.gustStayOnly){
      const step=target>h.slot?1:-1;
      let to=h.slot;
      for(let q=0;q<reach;q++){
        const nx=to+step;
        if(nx<1||nx>SLOTS) break;
        to=nx;
        if(nx===target) break;
      }
      if(to!==h.slot) moveTo(h,to);
      else say("그쪽으로는 움직일 수 없습니다.","t2");
    } else if(h.tag.gustStay||h.name!=="카제"){
      fx({side:"mine",slot:h.slot,s:"step",ring:"#5fd8cf",gap:90});
      say(`${h.name} 제자리에서 바람을 모읍니다.`);
    } else { say("이동할 칸을 골라야 합니다.","t2"); return }
    h.mom+=itemBt(h,"moveMom");
    const m=1+(h.tag.momPlus||0);
    h.mom+=m; h.windBuff+=1+(h.tag.gustPlus||0);
    say(`${h.name} 추진력 +${m} · 다음 진선풍도의 거리와 피해량 +${1+(h.tag.gustPlus||0)}`);
    return;
  }
  /* 공통 : 보호막 · 회복 */
  if(s.shield){ let v=s.shield+mod(s,"shield")+h.def;
    if(deb(h,"defDn")) v=Math.ceil(v*0.5); if(i===1&&h.first.guard!==1&&h.tag.firstGuard){v+=h.tag.firstGuard;h.first.guard=1}
    h.shield+=v;
    fx({side:"mine",slot:h.slot,s:"shield",ring:"#e0c85a",glow:1,txt:"+"+v,cls:"shd"});
    say(`${h.name} 보호막 +${v}`) }
  if(s.taunt){ h.taunt=s.taunt }
  if(s.evade){ h.evade+=s.evade;
    if(h.tag.flowShield){ h.shield+=h.tag.flowShield; say(`${h.name} 보호막 +${h.tag.flowShield}`) }
    fx({side:"mine",slot:h.slot,s:"wind",ring:"#5fd8cf",txt:"회피",cls:"shd"});
    say(`${h.name} 회피 +${s.evade}`) }
  if(s.potential){ h.potential=1; h.free+=4+(h.tag.freePlus||0);
    fx({side:"mine",slot:h.slot,art:"wind",s:"wind",glow:1,txt:"각성",cls:"crit"}); say("잠재력 활성 — 이번 턴 진선풍도가 전체를 칩니다.","t1") }
  if(s.card){ const nm=rnd(h.tag.armors); const A=ARMOR_CARDS[nm];
    B.hand.push({type:"item",name:nm,d:A?A.d:"아군에게 보호막 10",
      use:a=>{ if(A) A.use(a,h); else { a.shield+=10; say(`${nm} — ${a.name} 보호막 +10`) } }});
    fx({side:"mine",slot:h.slot,s:"summon",ring:"#c9a227",glow:1,txt:nm,cls:"shd"});
    say(`${nm} 카드를 손에 넣었습니다.`,"t1") }
  if(s.bomb){ h.bomb=2 }
  if(s.fuse){
    const list=liveMins().filter(m=>m.owner===h.name);
    const g=list.length; if(!g){ say("전장에 삼킬 소환물이 없습니다.","t2"); return }
    const mul=h.tag.fuseX||1;
    list.forEach(m=>{
      h.hp=Math.min(h.maxHp,h.hp+m.hp);
      fx({side:"mine",slot:m.slot,art:"mag",s:"summon",txt:"흡수",cls:"heal",gap:90});
      m.alive=0; m.slot=0;
    });
    bumpTmp(h,"atk",3*g*mul); bumpTmp(h,"mag",3*g*mul); bumpTmp(h,"def",3*g*mul);
    fx({side:"mine",slot:h.slot,art:"mag",s:"summon",glow:1,txt:"융합",cls:"crit"});
    say(`융합 — 소환물 ${g}을 삼켜 이번 전투 동안 능력치가 크게 오릅니다.`,"t1");
  }
  if(s.minion){
    const side=target<0?"mine":"foe", slot=Math.abs(target);
    const ex=B.portals.find(p=>p.side===side&&p.slot===slot);
    if(ex){
      B.hand.push({type:"summon",name:"악마 하수인"});
      fx({side:side,slot:slot,art:"mag",s:"summon",txt:"하수인",cls:"crit"});
      say("차원문 재사용 — 악마 하수인 카드를 얻습니다. 빈 칸에 끌어다 소환하세요.","t1");
    }else{
      B.portals.push({side:side,slot:slot,dmg:s.dmg+mod(s,"dmg")+h.mag,shield:3+h.def});
      fx({side:side,slot:slot,art:"mag",s:"mag",ring:"#a06ae0",txt:"차원문",cls:"mag"});
      say(`${side==="mine"?"아군":"적"} ${slot}번 칸에 차원문이 열립니다.`,"t1");
    }
    return;
  }
  if(s.heal){ let v=s.heal+mod(s,"heal");
    if(deb(h,"defDn")) v=Math.ceil(v*0.5);
    h.hp=Math.min(h.maxHp,h.hp+v);
    fx({side:"mine",slot:h.slot,s:"heal",txt:"+"+v,cls:"heal",ring:"#7fd39a"});
    say(`${h.name} 체력 +${v}`) }
  /* 피해 */
  if(s.dmg!=null){
    if(h.name==="카제"&&i===0){
      h.windUses++;
      const every=(h.potential&&h.tag.potentialEvery)||h.tag.windEvery||3;
      const strong=h.tag.alwaysStrong||(h.windUses%every===0);
      const bonus=h.windBuff;
      const reach=h.tag.noRange?99:(strong?3:s.rng)+bonus;
      let dmg=s.dmg+mod(s,"dmg")+bonus+h.atk;
      if(h.tag.firstWind&&h.first.wind!==1){ dmg+=h.tag.firstWind; h.first.wind=1 }
      let list = strong||h.potential
        ? B.foes.filter(f=>f.alive&&dist(h.slot,f.slot)<=reach)
        : (tgt&&dist(h.slot,tgt.slot)<=reach?[tgt]:[]);
      if(!list.length) say(`사거리 ${reach} 안에 적이 없습니다.`,"t2");
      if(strong&&list.length){
        const far=list.reduce((a,b)=>dist(h.slot,a.slot)>=dist(h.slot,b.slot)?a:b);
        fx({side:"foe",slot:far.slot,sweep:{side:"mine",slot:h.slot},s:"tornado",gap:260});
        say("회오리가 전장을 훑고 지나갑니다.","t1");
      }
      list.forEach(f=>hurt(f,dmg,`진선풍도${strong?"(강화)":""}`,"wind"));
      if(strong&&list.length){
        const alive=list.filter(f=>f.alive);
        const last=alive.length
          ? alive.reduce((a,b)=>dist(h.slot,a.slot)>=dist(h.slot,b.slot)?a:b) : null;
        (h.potential?alive:(last?[last]:[])).forEach(f=>airborne(h,f));
      }
      h.windBuff=0; return;
    }
    if(!tgt) return;
    if(s.rng&&dist(h.slot,tgt.slot)>s.rng) return;
    let dmg=s.dmg+mod(s,"dmg")+(s.el==="마법"?h.mag:h.atk*(s.n==="방패 밀치기"?(h.tag.pushAtkX||1):1));
    if(s.el==="마법"&&deb(h,"magDn")) dmg=Math.ceil(dmg*0.5);
    else if(s.el!=="마법"&&deb(h,"atkDn")) dmg=Math.ceil(dmg*0.5);
    let CRIT=0;
    /* 이테리오 정밀 타격 : 표식이 있는 적에게 공격 피해는 치명타 */
    if(h.name==="이테리오"&&s.el!=="마법"&&(tgt.mark||0)>0){
      dmg*=2; tgt.mark--; CRIT=1; say(`정밀 표식 — 치명타!`,"t1");
    }
    /* 그슨대 급습 */
    if(h.name==="그슨대"&&h.hide&&s.el==="공격"){ dmg*=2; h.hide=0; CRIT=1; say("급습 — 치명타!","t1") }
    /* 데린저 조준 · 헤드샷 */
    if(h.name==="데린저"){
      if(h.aimAt!=null){ if(tgt.id===h.aimAt){ dmg*=2; CRIT=1 } else dmg=0 }
      if(s.ammo&&h.tag.headshot&&!h.headshotUsed){
        h.headshotUsed=1;
        const add=8+h.atk;
        dmg=(h.aimAt!=null&&tgt.id===h.aimAt) ? Math.round((dmg/2+add)*3) : dmg+add;
        say("헤드샷!","t1");
      }
    }
    if(!dmg){ say(`${tgt.name}${jo(tgt.name,"eun")} 조준 밖이라 상처 하나 없습니다.`,"t2"); return }
    if(s.n==="방패 밀치기"&&h.tag.pushAll){
      B.foes.filter(f=>f.alive).forEach(f=>hurt(f,dmg,s.n,"slash"));
      return;
    }
    if(h.name==="나이코스"&&i===0){
      if(h.tag.nearHit&&dist(h.slot,tgt.slot)===1) dmg+=h.tag.nearHit;
      if(h.tag.firstCut&&h.first.cut!==1){ dmg+=h.tag.firstCut; h.first.cut=1 }
      if(h.tag.guardThen&&h.guarded) dmg+=h.tag.guardThen;
      if(h.tag.cutHeal){ h.hp=Math.min(h.maxHp,h.hp+h.tag.cutHeal) }
    }
    const times=(h.name==="나이코스"&&i===0&&h.sk[0].twice)?2:1;
    for(let t=0;t<times;t++){
      if(s.markKill||s.pierce)
        fx({side:"foe",slot:tgt.slot,streak:{side:"mine",slot:h.slot},s:"arrow",gap:130});
      const was=tgt.alive;
      hurt(tgt,dmg,s.n,s.el==="마법"?"mag":(h.name==="굴라"?"claw":"slash"),s.pierce||h.pierceNext,CRIT);
      if(h.leech){ const heal=Math.round(dmg*0.2); h.hp=Math.min(h.maxHp,h.hp+heal);
        if(heal) fx({side:"mine",slot:h.slot,s:"heal",txt:"+"+heal,cls:"heal",gap:60});
        h.leech=0; h.pierceNext=0 }
      if(h.name==="이테리오"&&s.mark&&tgt.alive){ tgt.mark=(tgt.mark||0)+1;
        fx({side:"foe",slot:tgt.slot,ring:"#6aa8e0",txt:"표식",cls:"mag",gap:60}) }
      if(was&&!tgt.alive){
        if(s.markKill){ h.sk[1].limit++; say("명중 — 피부 강화의 사용한도가 늘어납니다.","t1") }
        if(s.exec){ addMod(h,"베기","dmg",1,"승리의 일격"); say("승리의 일격 — 베기가 영구히 강해집니다.","t1") }
        if(h.tag.killShield&&i===0){ h.shield+=h.tag.killShield }
        break;
      }
    }
  }
  if(h.name==="나이코스"&&i===1) h.guarded=1;
}

/* ─ 턴 ─ */
function battleLost(){
  run.heroes.forEach(clearTmp);
  run.heroes.forEach(h=>{ if(h.hp<=0){ h.hp=0; h.down=1; h.slot=0 } });
  fx({s:"down",gap:0});
  veil("radial-gradient(circle,rgba(142,43,43,.5),transparent 70%)");
  run.dun=null; run.pendingEnter=null;
  const standing=run.heroes.filter(h=>!h.down).length;
  if(!standing){
    say("모두 쓰러졌습니다. 일으켜 줄 사람이 남지 않았습니다.","t3");
    setTimeout(()=>lose("대원이 모두 쓰러졌습니다. 주둔지로 데려갈 사람이 남지 않았습니다."),1300);
    return;
  }
  addTaint(30);
  say("물러납니다. 오염도가 30 올랐습니다.","t3");
  setTimeout(()=>{ toast(`쓰러진 대원은 주둔지 치료소에서 일으킬 수 있습니다. (성한 대원 ${standing}명)`);
    if(view!=="over"){ view="map"; render() } },1200);
}
function critAlly(t){ FXQ.push({crit:1,side:"mine",slot:t.slot}); flushFX() }
function hurtAlly(f,t,raw,label){
  raw=Math.max(0,raw-(t.armor||0));
  if(t.evade>0){ t.evade--;
    fx({side:"mine",slot:t.slot,s:"miss",txt:"회피",cls:"miss"});
    say(`${label} — ${t.name} 회피!`,"t2"); return }
  let d=raw;
  const eh=Math.min(t.eshield||0,d); if(eh){ t.eshield-=eh; d-=eh }
  let sh=Math.min(t.shield,d); t.shield-=sh; d-=sh; t.hp-=d;
  sh+=eh;
  if(t.tag&&itemBt(t,"lastStand")&&!t.lastStandUsed&&t.hp<=t.maxHp*0.5){
    t.lastStandUsed=1; const v=itemBt(t,"lastStand");
    t.eshield=(t.eshield||0)+v*4; bumpTmp(t,"atk",v);
    say(`애곤의 발톱 — ${t.name}${jo(t.name,"ig")} 이를 악뭅니다.`,"t1");
  }
  fx({side:"mine",slot:t.slot,hit:1,art:"claw",s:"hit",txt:"-"+raw,cls:"dmg",gap:170});
  say(`${f.name} → ${t.name} ${label} 피해 ${raw}${sh?` (보호막 ${sh})`:""} · ${Math.max(0,t.hp)}/${t.maxHp}`);
  if(t.tag&&t.tag.thorn&&f.alive) hurt(f,t.tag.thorn,"가시","slash");
  if(t.name==="그슨대"&&raw>0){
    t.dark=(t.dark||0)+1;
    if(t.dark%3===0){ bumpTmp(t,"atk",1); say(`커져가는 악몽 — ${t.name} 공격력 +1`,"t1") }
    if(t.stance==="nightmare") B.foes.filter(x=>x.alive).forEach(x=>hurt(x,4+t.atk,"악몽 태세","slash"));
    if(t.stance==="terror") B.foes.filter(x=>x.alive).forEach(x=>{ addDeb(x,"fear",1); addDeb(x,"atkDn",1) });
  }
  if(t.hp<=0) unitDown(t);
}
function unitDown(t){
  fx({side:"mine",slot:t.slot,s:"down",txt:t.isMin?"파괴":"쓰러짐",cls:"miss",gap:180});
  if(t.isMin){
    say(`${t.name}${jo(t.name,"ig")} 부서졌습니다.`,"t3");
    if(t.phantomOf!=null){
      const src=B.foes.find(f=>f.id===t.phantomOf&&f.alive);
      if(src) hurt(src,t.backlash||4,"환영의 반동","mag");
    }
    if(t.curseOnDeath) B.foes.filter(x=>x.alive&&dist(t.slot,x.slot)<=1)
      .forEach(x=>{ x.weak=(x.weak||0)+t.curseOnDeath;
        fx({side:"foe",slot:x.slot,ring:"#8f5fd0",txt:"약화",cls:"miss",gap:80}) });
    t.alive=0; t.slot=0; onDeath("min",t); return;
  }
  say(`${t.name} 쓰러짐.`,"t3"); t.slot=0; t.down=1; onDeath("ally");
  if(t.name==="트리스탄"&&!B.corpseUsed){
    B.corpseUsed=1; B.hand.push({type:"summon",name:"망자의 육체"});
    say("저주받은 육체 — 망자의 육체 카드를 얻습니다.","t1");
  }
  /* 전장에 설 수 있는 아군이 하나도 남지 않으면 그 자리에서 끝난다 */
  if(!B.over&&!liveMins().length&&!run.heroes.some(h=>h.hp>0)){
    B.over=1; battleLost(); render();
  }
}
function endTurn(){
  if(B.over) return;
  if(!allUnits().length){ say("전장에 아군이 없습니다. 먼저 영웅을 소환하세요.","t3"); return }
  allUnits().forEach(tickDebEnd);
  liveMins().forEach(m=>{ if(m.perma) m.taunt=1 });
  onField().forEach(h=>{
    const es=itemBt(h,"endShield");
    if(es){ endShield(h,es); fx({side:"mine",slot:h.slot,ring:"#e0c85a",txt:"+"+es,cls:"shd",gap:70}) }
    const ms=itemBt(h,"manaShield");
    if(ms&&h.manaUsed){ endShield(h,h.manaUsed*ms); h.manaUsed=0 }
    const qs=itemBt(h,"momShield");
    if(qs&&h.mom>0){ const use=Math.min(6,h.mom); h.mom-=use; endShield(h,use*qs) }
    if(h.name==="오토"){ const conv=Math.min(5,h.shield);
      if(conv){ h.shield-=conv; h.eshield=(h.eshield||0)+conv;
        fx({side:"mine",slot:h.slot,ring:"#e07b28",txt:"◆"+conv,cls:"shd",gap:60});
        say(`돌봄 — ${h.name} 보호막 ${conv}을 에너지 보호막으로 바꿉니다.`) } }
    if(h.name==="보아"){ const sc=h.scaleTurn||0, v=1+h.def+sc;
      endShield(h,v); h.scaleTurn=0;
      fx({side:"mine",slot:h.slot,ring:"#9ad06a",txt:"+"+v,cls:"shd",gap:60});
      say(`적응성 비늘 — ${h.name} 보호막 +${v} (기본 1 + 보호력 ${h.def}${sc?` + 이번 턴 비늘 ${sc}`:""})`) }
    if(h.tag.dashMul&&h.mom>0){
      const use=Math.min(h.tag.dashMax||3,h.mom); h.mom-=use;
      const v=use*h.tag.dashMul; h.eshield=(h.eshield||0)+v;
      fx({side:"mine",slot:h.slot,ring:"#e07b28",txt:"◆+"+v,cls:"shd",gap:70});
      say(`달리기 — ${h.name} 에너지 보호막 +${v}`) }
    const eb=itemBt(h,"endBurnRange");
    if(eb) B.foes.filter(f=>f.alive&&dist(h.slot,f.slot)<=2).forEach(f=>hurt(f,eb,"불타는 호각","slash"));
    if(h.name==="헥토"){
      const v=(h.tag.allyShield||2)+h.def;
      allUnits().forEach(a=>{ if(a!==h){ endShield(a,v);
        fx({side:"mine",slot:a.slot,ring:"#8fa2c9",txt:"+"+v,cls:"shd",gap:70}) } });
      say(`든든한 아군 — 다른 아군 보호막 +${v}`,"t2");
    }
  });
  (B.portals||[]).forEach(p=>{
    if(p.side!=="foe") return;
    const f=foeAt(p.slot);
    if(f&&f.alive) hurt(f,p.dmg,"균열 차원문","mag");
  });
  say(`— ${B.turn}턴 적 행동 —`,"t1");
  fx({s:"turn",gap:220});
  B.foes.forEach(f=>{ f.shield=0 });   /* 지난 턴에 얻은 보호막은 여기서 사라진다 */
  B.foes.forEach(f=>{
    if(!f.alive||!f.intent) return;
    if(f.stun){ f.stun--;
      fx({side:"foe",slot:f.slot,txt:"기절",cls:"miss",gap:130});
      say(`${f.name} 기절 — 움직이지 못합니다.`,"t2"); return }
    if(f.intent.t==="move"){
      if(f.slot>1&&!foeAt(f.slot-1)){ f.slot--;
        fx({side:"foe",slot:f.slot,s:"step",ring:"#9c8d77",gap:130});
        say(`${f.name} 전진 → ${f.slot}번`) }
      else say(`${f.name} 전진 실패.`,"t2");
    }else if(f.intent.t==="def"){ f.shield+=f.intent.v;
      fx({side:"foe",slot:f.slot,s:"shield",ring:"#e0c85a",txt:"+"+f.intent.v,cls:"shd"});
      say(`${f.name} 방어 +${f.intent.v}`) }
    else if(f.intent.t==="atk"){
      const taunt=allUnits().find(h=>h.taunt);
      let t=taunt||unitAt(f.intent.to)||allUnits()[0];
      if(!t) return;
      if(!f.intent.far&&dist(t.slot,f.slot)>f.rng){ say(`${f.name} 공격 — 거리 밖.`,"t2"); return }
      if(t.evade>0){ t.evade--;
        fx({side:"mine",slot:t.slot,s:"miss",txt:"회피",cls:"miss"});
        say(`${f.name} 공격 — ${t.name} 회피!`,"t2"); return }
      hurtAlly(f,t,Math.max(0,f.intent.v-(f.weakAtk||0)),f.intent.pat||"공격");
    }
    else if(f.intent.t==="push"){
      const front=foeAt(f.slot-1);
      if(front){ const a=f.slot; f.slot=front.slot; front.slot=a;
        fx({side:"foe",slot:f.slot,s:"step",ring:"#9c8d77",gap:120});
        say(`${f.name}${jo(f.name,"ig")} ${front.name}${jo(front.name,"eul")} 밀치고 앞으로 나섭니다.`) }
      else say(`${f.name} 앞으로 나서지 못했습니다.`,"t2");
    }
    else if(f.intent.t==="back"){
      if(f.slot<SLOTS&&!foeAt(f.slot+1)){ f.slot++;
        fx({side:"foe",slot:f.slot,s:"step",ring:"#9c8d77",gap:130});
        say(`${f.name} 물러섭니다 → ${f.slot}번`) }
      else say(`${f.name} 물러서지 못했습니다.`,"t2");
    }
    else if(f.intent.t==="buff"){
      f.atk+=f.intent.v; f.buffs=(f.buffs||0)+1;
      fx({side:"foe",slot:f.slot,ring:"#e0705a",txt:"공격+"+f.intent.v,cls:"dmg"});
      say(`${f.name} 스스로를 벼립니다 — 공격력 +${f.intent.v}`,"t3");
    }
    else if(f.intent.t==="heal"){
      const m=B.foes.find(x=>x.id===f.intent.to&&x.alive);
      if(m){ m.hp=Math.min(m.maxHp,m.hp+f.intent.v);
        fx({side:"foe",slot:m.slot,s:"heal",txt:"+"+f.intent.v,cls:"heal"});
        say(`${f.name} → ${m.name} 체력 +${f.intent.v}`,"t3") }
      else say(`${f.name} 치료할 동료가 없습니다.`,"t2");
    }
    else if(f.intent.t==="curse"){
      const list=onField();
      if(list.length){ const a=rnd(list); a.curse=(a.curse||0)+1;
        fx({side:"mine",slot:a.slot,ring:"#8f5fd0",txt:"저주",cls:"miss"});
        say(`${f.name} → ${a.name} 저주 — 다음 턴 마나 -1`,"t3") }
    }
    else if(f.intent.t==="deb"){
      const t=unitAt(f.intent.to)||allUnits()[0];
      if(t) addDeb(t,f.intent.k,f.intent.v);
      else say(`${f.name}의 저주가 허공에 흩어집니다.`,"t2");
    }
    else if(f.intent.t==="volley"){
      say(`${f.name} 일제 사격!`,"t3");
      allUnits().slice().forEach(a=>{ if(a.hp>0) hurtAlly(f,a,f.intent.v,"일제 사격") });
    }
  });
  if(!run.heroes.some(h=>h.hp>0)&&!liveMins().length){ B.over=1; battleLost(); render(); return }
  if(!run.heroes.some(h=>!h.down)&&!liveMins().length){ B.over=1; battleLost(); render(); return }
  B.turn++;
  if(B.turn>20){ B.over=1; say("20턴이 지나 물러납니다.","t3"); battleLost(); render(); return }
  liveMins().forEach(m=>{ m.mana=m.maxMana; m.shield=m.keepShield||0; m.keepShield=0; m.armor=0;
    if(m.perma) m.taunt=1; else if(m.taunt) m.taunt--; });
  run.heroes.forEach(h=>{
    if(h.hp<=0) return;
    h.mana=Math.max(0,h.maxMana-(h.curse||0)); h.curse=0;
    if(h.manaMag){ bumpTmp(h,"mag",-h.manaMag); h.manaMag=0 }
    h.headshotUsed=0; h.mobile=0;
    if(h.stanceTurn&&--h.stanceTurn<=0) h.stance=0;
    h.shield=h.keepShield||0; h.keepShield=0;
    h.airUp=0; h.potential=0; h.guarded=0; h.armor=0;
    const es2=itemBt(h,'startTurnShield'); if(es2) h.shield+=es2;
    if(h.helm){ h.shield+=h.helm; say(`강철 투구 — ${h.name} 보호막 +${h.helm}`); h.helm=0 }
    if(h.taunt) h.taunt--;
    Object.keys(h.lock).forEach(k=>{ if(--h.lock[k]<=0) delete h.lock[k] });
    if(h.bomb&&--h.bomb===0){
      const v=Math.floor(h.hp*0.2);
      say("응축 폭발 — 압축된 힘이 터집니다.","t1");
      fx({side:"mine",slot:h.slot,quake:1,s:"quake",gap:260});
      B.foes.filter(f=>f.alive).forEach(f=>hurt(f,v,"응축 폭발","boom"));
    }
  });
  B.foes.forEach(f=>{ f.air=0; f.weakAtk=0;
    if(f.alive&&f.burn) hurt(f,f.burn,"화상","mag");
    if(f.alive&&f.infect){
      const inv=run.heroes.find(x=>x.name==="인비디아"&&x.slot>0);
      const v=1+(inv?inv.mag:0)+(inv?(inv.tag.plaguePlus||0):0);
      hurt(f,v,"감염","mag"); if(f.alive) f.infect--;
    } });
  (B.portals||[]).forEach(p=>{
    if(p.side!=="mine") return;
    const a=unitAt(p.slot);
    if(a){ a.shield+=p.shield;
      fx({side:"mine",slot:p.slot,ring:"#a06ae0",txt:"+"+p.shield,cls:"shd",gap:70}) }
  });
  run.heroes.forEach(h=>{ h.acts=0; h.veilDone=0;
    if(h.name==="헥토"&&h.tag.allyTwice&&h.slot>0){
      const v=(h.tag.allyShield||2)+h.def;
      onField().forEach(a=>{ if(a!==h) a.shield+=v });
    } });
  rollIntents(); sel=null;
  say(`— ${B.turn}턴 시작 —`,"t1");
  checkEnd(); render();
}
function checkEnd(){
  if(B.over) return;
  if(!B.foes.some(f=>f.alive)){
    B.over=1;
    const exp=B.foes.reduce((a,f)=>a+f.exp,0);
    fx({s:"win",gap:0});
    veil("radial-gradient(circle,rgba(201,162,39,.4),transparent 70%)");
    say(`승리! 경험치 ${exp}`,"t1");
    liveMins().filter(m=>m.revive).forEach(m=>{
      const t=run.heroes.find(x=>x.name===m.owner);
      if(t&&t.hp<=0){ t.hp=t.maxHp; t.down=0;
        say(`망자의 육체 — ${t.name}${jo(t.name,"ig")} 되살아납니다.`,"t1") }
    });
    B.mins=[];
    run.heroes.forEach(clearTmp);
    run.heroes.forEach(h=>{
      if(h.name!=="나이코스") return;
      const cap=h.tag.winCap||2;
      if(h.wins<cap){ h.wins++; h.atk++ }
      else { run.gold+=1; say("전장의 승자 — 넘친 몫이 금화 1로 바뀝니다.","t2") }
    });
    giveExp(exp,run.heroes.filter(h=>h.slot>0&&h.hp>0));
    setTimeout(afterWave,800);
  }
}

function toBag(it){ (run.bag=run.bag||[]).push(it) }
function pickWeighted(pool,n){
  const out=[], p=pool.slice();
  while(out.length<n&&p.length){
    const tot=p.reduce((a,r)=>a+(r.w==null?1:r.w),0);
    let x=Math.random()*tot, k=0;
    for(;k<p.length;k++){ x-=(p[k].w==null?1:p[k].w); if(x<=0) break }
    if(k>=p.length) k=p.length-1;
    out.push(p.splice(k,1)[0]);
  }
  return out;
}

   mana:'<path d="M32 8 C32 8 12 30 12 40 a20 20 0 0 0 40 0 C52 30 32 8 32 8 Z" fill="@"/>',

  box.appendChild(el(`<div class="hp-h">기술</div>`));
  h.sk.forEach((sk,i)=>{
    const locked=(i===2&&h.lv<UNLOCK[2])||(i===3&&h.lv<UNLOCK[3]);
    const cost=sk.costType==="mom"?ic("move")+sk.cost
      :sk.costType==="scale"?"비늘"+sk.cost:ic("mana")+sk.cost;
    box.appendChild(el(`<div class="hp-sk ${locked?"lk":""}">
      <b>${i+1}. ${esc(sk.n)}</b>
      <span class="c">${cost} · ${esc(sk.el)}${sk.limit?` · 한도 ${sk.limit}`:""}</span>
      ${locked?`<small style="color:var(--faint)">${UNLOCK[i]}레벨에 해제됩니다.</small>`
        :`<small>${rich(SKILL_TEXT[sk.n]||sk.d||"")}</small>
          ${valueLinesStatic(h,sk).map(x=>`<small class="v">${x}</small>`).join("")}
          ${SKILL_FULL[sk.n]?`<div class="fullx"><span>기획 원문</span>${rich(SKILL_FULL[sk.n])}</div>`:""}`}
      ${sk.alt?`<small style="color:var(--faint)">전환 : ${esc(sk.alt.n)}</small>`:""}
    </div>`));
  });
  const taken=(h.tag.taken||[]);
  box.appendChild(el(`<div class="hp-h">고른 특성 ${taken.length}개</div>`));
  if(!taken.length) box.appendChild(el(`<p class="hint" style="font-size:11px">아직 고른 특성이 없습니다.</p>`));
  else {
    const own=(HERO_REWARDS[h.name]||[]);
    const all=own.concat(COMMON);
    box.appendChild(el(`<div class="hp-tr">${taken.map(t=>{
      const r=all.find(x=>x.n===t);
      const mine=own.some(x=>x.n===t);
      return `<div class="tr1"><b>${esc(t)}</b>
        <span class="g2">${r?esc(r.g):""}${mine?" · 전용":""}</span>
        ${r?`<small>${rich(r.d)}</small>`:""}</div>`;
    }).join("")}</div>`));
  }
  if(h.items&&h.items.length){
    box.appendChild(el(`<div class="hp-h">장비</div>`));
    box.appendChild(el(`<div class="hp-tk">${h.items.map(t=>
      `<span title="${esc(itemTip(t))}">${esc(t.n)}</span>`).join("")}</div>`));
  }
  return box;
}
/* 전투 밖에서도 쓸 수 있는 수치 요약 */
function valueLinesStatic(h,sk){
  const L=[];
  if(sk.dmg!=null&&!sk.justice) L.push(`피해 ${numHtml(h,sk,"dmg")}`);
  if(sk.shield) L.push(`보호막 ${numHtml(h,sk,"shield")}`);
  if(sk.heal) L.push(`회복 ${numHtml(h,sk,"heal")}`);
  return L;
}
function offerCards(app,hero,grade,done){
  const own=(HERO_REWARDS[hero.name]||[]).filter(r=>r.g===grade&&!(hero.tag.taken||[]).includes(r.n));
  const com=COMMON.filter(r=>r.g===grade);
  const pool=own.concat(com);
  const picks=pickWeighted(pool,3);
  const row=el(`<div class="rewards"></div>`);
  picks.forEach(r=>{
    const c=el(`<div class="rw"><div class="rwi">${rewardIcon(r)}</div>
      <div class="g">${esc(r.g)} · ${own.includes(r)?"전용":"공용"}</div>
      <b>${esc(r.n)}</b><p>${rich(r.d)}</p></div>`);
    c.onclick=()=>{
      r.fx(hero,r.n); hero.tag.taken=(hero.tag.taken||[]).concat(r.n);
      const pts={"하급":1,"중급":3,"상급":5}[r.g]||0;
      if(pts&&run.heroes.some(x=>x.name==="데린저")){
        run.treasure=(run.treasure||0)+pts;
        const d=run.heroes.find(x=>x.name==="데린저");
        const want=Math.floor(run.treasure/5);
        if((d.treaAtk||0)<want){ const add=want-(d.treaAtk||0); d.treaAtk=want; d.atk+=add;
          toast(`보물 사냥꾼 — ${d.name}의 공격력이 ${add} 올랐습니다.`) }
      }
      done();
    };
    row.appendChild(c);
  });
  app.querySelector(".center").appendChild(row);
  const skip=el(`<div style="text-align:center;margin-top:18px"><button>건너뛰기</button></div>`);
  skip.querySelector("button").onclick=done;
  app.appendChild(skip);
}
render();
</script>
</body>
</html>
