function doSkill(target){
  if(B.busy) return;
  const h=sel.hero,i=sel.skill,n=sel.count,s0=h.sk[i];
  if(isMoveSkill(s0)){
    const why=moveBlock(h,s0,target);
    if(why){ say(why,"t2"); render(); return }
  }
  if(s0.tg==="foe"){
    if(!foeAt(target)){ say("그 칸에는 적이 없습니다.","t2"); return }
    { const why=foeBlockReason(foeAt(target));
      if(why){ say(why,"t2"); return } }
    if(!inReach(h,s0,target)){
      const r=reachOf(h,s0);
      fx({side:"foe",slot:target,s:"miss",txt:"사거리 "+r,cls:"miss"});
      say(`사거리 ${r} 밖입니다. 다른 대상을 고르세요.`,"t2"); render(); return;
    }
    const pin=pinnedFoe(h,s0);
    if(pin&&pin.slot!==target){
      const dirn=(s0.farshot&&!(h.tag&&h.tag.nearShot))?"멀리":"가까이";
      say(`${s0.n}${jo(s0.n,"eun")} 가장 ${dirn} 있는 적(${pin.slot}번)만 겨눌 수 있습니다.`,"t2");
      render(); return;
    }
  }
  if(s0.shadow&&!h.shadowAt&&sel.moveTo==null){
    sel.target=target; sel.step=5; SFX.play("click"); render(); return;
  }
  h.shadowGo=(sel.moveTo!=null?sel.moveTo:0);
  bark(h,"atk");
  say(`▸ ${h.name} — ${s0.n} ×${n}`,"t1");
  for(let k=0;k<n;k++){
    if(B.over||h.hp<=0) break;
    const s=h.sk[i];
    if(deb(h,"fear")&&(s.tg==="foe"||s.tg==="any")){
      const tg2=foeAt(Math.abs(target));
      if(tg2&&uid(tg2)===h.fearSrc){
        say(`${h.name}${jo(h.name,"eun")} ${tg2.name}${jo(tg2.name,"eul")} 마주 볼 수 없습니다. 다른 적을 노리세요.`,"t3");
        break }
    }
    /* 전환(방패 막기 ↔ 방패 밀치기)처럼 도중에 대상 종류가 바뀌면 겨눌 적을 다시 고른다 */
    if(s.tg==="foe"&&(target==null||!foeAt(target)||!inReach(h,s,target))){
      const re=pinnedFoe(h,s)
        || openFoes().filter(f=>inReach(h,s,f.slot))
                     .sort((a,b)=>dist(h.slot,a.slot)-dist(h.slot,b.slot))[0];
      if(!re){ say(`${s.n} — 사거리 안에 적이 없어 중단합니다.`,"t2"); break }
      if(re.slot!==target){ target=re.slot;
        say(`${s.n}${jo(s.n,"eun")} ${re.name}(${re.slot}번)에게 나갑니다.`,"t2") }
    }
    { const pn=pinnedFoe(h,s); if(pn) target=pn.slot; else if(s.farshot||s.nearest) break }
    if(!canPay(h,i,1)){ say("자원이 부족해 중단합니다.","t2"); break }
    /* 손아귀 강화 — 쟁여 둔 공짜 페일노트가 있으면 먼저 쓴다 */
    const freeArrow=(i===0&&h.name==="트리스탄"&&(h.shotFree||0)>0)?1:0;
    /* 비용 지불 */
    if(s.costType==="scale"){ h.scale-=s.cost }
    else if(s.costType==="mom"){
      if(s.rise){ h.mom-=s.cost+h.airUp; h.airUp++ } else h.mom-=s.cost; }
    else if(h.name==="카제"&&i===1&&h.free>0){ h.free-- }
    else if(h.tag.freeCut&&i===0&&h.guarded){ h.guarded=0 }
    else if(h.freeBlock&&s.n==="방패 막기"){ h.freeBlock=0;
      say("방어 후 막기 — 이번 방패 막기는 공짜입니다.","t2") }
    else if(h.freePush&&s.n==="방패 밀치기"){ h.freePush=0;
      say("준비 후 밀치기 — 이번 방패 밀치기는 공짜입니다.","t2") }
    else if(freeArrow){ h.shotFree--;
      say("손아귀 강화 — 이번 페일노트는 공짜입니다.","t2") }
    else { h.mana-=s.cost; h.manaUsed=(h.manaUsed||0)+s.cost;
      if(s.cost){
        const mm=itemBt(h,"manaMom"); if(mm) h.mom+=s.cost*mm;
        const ms2=itemBt(h,"manaShield"); if(ms2) h.shield+=s.cost*ms2;
        (h.items||[]).forEach(it=>{ const k=it.bt&&it.bt.manaBolt; if(!k) return;
          const list=B.foes.filter(f=>f.alive);
          if(!list.length) return;
          const t2=(k==="mag")?list.reduce((a,b)=>a.slot>=b.slot?a:b)
                              :list.reduce((a,b)=>a.slot<=b.slot?a:b);
          hurt(t2,s.cost+(k==="mag"?h.mag:h.atk),k==="mag"?"마나 첨탑":"마나 도검",k==="mag"?"mag":"slash") });
      }
      if(h.name==="이테리오"&&s.cost) bumpTurn(h,"mag",s.cost); }
    if(s.ammo){ h.ammo=Math.max(0,(h.ammo||0)-1) }
    if(s.limit) h.limitUsed[i]=(h.limitUsed[i]||0)+1;
    /* 수호 활동 — 후미 준비는 더 이상 잠기지 않는다 */
    if(s.lock&&!(h.tag.noRearLock&&s.rearguard)) h.lock[i]=s.lock+1;
    if(deb(h,"chill")){ const v=h.deb.chill;
      h.hp-=v; fx({side:"mine",slot:h.slot,hit:1,txt:"-"+v,cls:"dmg",gap:70});
      say(`${h.name} 냉각 피해 ${v}`,"t3") }
    if(deb(h,"stun")){ h.deb.stun--;
      fx({side:"mine",slot:h.slot,txt:"기절",cls:"miss",gap:70});
      say(`${h.name}${jo(h.name,"eun")} 기절해 ${s.n}${jo(s.n,"ig")} 불발됩니다.`,"t3");
      continue }
    /* 적을 때리는 기술이면 어느 갈래로 가든 여기서 공격 자세를 잡는다 */
    if(h.slot>0&&s.tg!=="self"&&s.tg!=="ally"&&hitsFoe(s,target))
      fx({side:"mine",slot:h.slot,pose:"atk",s:ATK_SFX[h.name],lunge:1,gap:0});
    runEffect(h,i,s,target);
    if(s.read) addRead(h,s.read);
    if(h.mobile&&!s.jumpback){
      const back=h.slot-1;
      if(back>=1&&!occAt(back)) moveTo(h,back);
      else { const v=1+h.mag; h.eshield=(h.eshield||0)+v }
    }
    if(s.alt){
      const back=Object.assign({},s); const nx=Object.assign({},s.alt);
      back.mods=s.mods; nx.mods=s.alt.mods;
      delete back.alt; nx.alt=back; h.sk[i]=nx;
      say(`${s.n} → ${nx.n}${jo(nx.n,"eu")}로 전환됩니다.`,"t2");
    }
    if(h.name==="카제"&&(s.el==="이동"||s.dmg!=null)){ h.acts=(h.acts||0)+1; veilCheck(h) }
    if(h.name==="나이코스"&&i===0&&h.tag.chargeCut){
      const fr=h.slot+1<=SLOTS?h.slot+1:h.slot-1;
      if(fr>=1&&fr<=SLOTS&&fr!==h.slot) moveTo(h,fr);
      h.mom=(h.mom||0)+1;
      if(h.mom>=6){ h.mom=0; h.sk[0].twice=1; h.chargeArmed=1;
        say("돌격 베기 — 다음 베기가 두 번 나갑니다.","t1") }
      else if(h.chargeArmed){ h.chargeArmed=0; if(!h.tag.twicePerm) h.sk[0].twice=0 }
    }
    if(s.tg==="foe"&&!foeAt(target)&&k<n-1){
      const _s=h.sk[i];
      const alt=pinnedFoe(h,_s)
        || openFoes().filter(f=>inReach(h,_s,f.slot))
                     .sort((a,b)=>dist(h.slot,a.slot)-dist(h.slot,b.slot))[0];
      if(!alt) break;
      target=alt.slot; say(`대상이 쓰러져 ${alt.name}(${alt.slot}번)으로 옮깁니다.`,"t2");
    }
  }
  checkEnd();
  keepSel();          /* 기술을 쓰고 나서도 그 대원의 기술 창은 열어 둔다 */
  render();
}
/* ═══ 이동 기술의 목적지 판정 ═══
   '이동' 속성으로 칸을 고르는 기술은, 특별한 예외가 없는 한
   지금 서 있는 칸을 고를 수 없다. */
function isMoveSkill(sk){ return !!(sk&&sk.el==="이동"&&sk.tg==="ally") }
/* 예외 — 카제의 '제자리바람' 특성은 움직이지 않고도 쓸 수 있게 해 준다 */
function moveStayOk(h,sk){ return !!(h&&h.tag&&h.tag.gustStay&&sk&&sk.el==="이동") }
/* 고를 수 있는 거리 — 산들바람은 방향만 고르면 알아서 한 칸 나아간다 */
function movePickRange(sk){ return (sk&&(sk.jumpback||sk.soothe))?2:SLOTS }
/* 못 고르는 칸이면 그 이유를 돌려준다 */
function moveBlock(h,sk,to){
  if(!isMoveSkill(sk)||to==null) return "";
  { const b=bodyAt(to);
    if(b) return `${b.name}${jo(b.name,"ig")} 쓰러진 채 ${to}번 칸을 막고 있습니다.` }
  if(to===h.slot&&!moveStayOk(h,sk))
    return `${sk.n}${jo(sk.n,"eun")} 지금 서 있는 칸으로는 갈 수 없습니다. 다른 칸을 고르세요.`;
  const r=movePickRange(sk);
  if(Math.abs(to-h.slot)>r)
    return `${sk.n}${jo(sk.n,"eun")} ${r}칸까지만 움직입니다.`;
  return "";
}
function shadowGoTo(slot){
  if(!sel||sel.step!==5) return;
  const h=sel.hero;
  { const b=bodyAt(slot);
    if(b){ say(`${b.name}${jo(b.name,"ig")} 쓰러진 채 ${slot}번 칸을 막고 있습니다.`,"t2"); return } }
  if(slot===h.slot){ say("그림자를 남기려면 자리를 떠야 합니다. 다른 칸을 고르세요.","t2"); return }
  if(Math.abs(slot-h.slot)>2){ say("최대 2칸까지만 움직일 수 있습니다.","t2"); return }
  sel.moveTo=slot; sel.step=4; SFX.play("click");
  doSkill(sel.target);
}
function emptyOkAny(sk){ return !!(sk&&(sk.phantom||sk.minion)) }
/* 흡수 — 피해를 줬다면 최소 1은 회복한다 */
function applyLeech(h,dmg){
  if(!h||!h.leech||!(dmg>0)) return;
  const heal=Math.max(1,Math.round(dmg*0.2));
  const got=healUp(h,heal);
  if(got) fx({side:"mine",slot:h.slot,s:"heal",txt:"+"+got,cls:"heal",gap:60});
  h.leech=0; h.pierceNext=0;
}
function giveArmor(h,nm){
  const A=ARMOR_CARDS[nm];
  pulseFX("mine",h.slot,"#e0c85a",2);
  B.hand.push({type:"item",name:nm,d:A?A.d:"아군에게 보호막 10",by:h.name,
    use:a=>{ if(A) A.use(a,h); else { a.shield+=10; say(`${nm} — ${a.name} 보호막 +10`) } }});
  fx({side:"mine",slot:h.slot,s:"summon",ring:"#c9a227",glow:1,txt:nm,cls:"shd",gap:70});
  say(`${nm} 카드를 손에 넣었습니다.`,"t1");
}
function moveTo(h,to){
  if(deb(h,"bind")){ say(`${h.name}${jo(h.name,"eun")} 속박되어 움직일 수 없습니다.`,"t3"); return }
  { const b=bodyAt(to);
    if(b){ say(`${b.name}${jo(b.name,"ig")} 쓰러진 채 ${to}번 칸을 막고 있습니다.`,"t2"); return } }
  const from=h.slot, occ=unitAt(to);
  if(occ&&occ!==h&&occ.noMove){ say(`${occ.name}${jo(occ.name,"eun")} 움직일 수 없습니다.`,"t2"); return }
  h.slot=to;
  if(occ&&occ!==h){ occ.slot=from;
    say(`${h.name}${jo(h.name,"gwa")} ${occ.name}${jo(occ.name,"ig")} 자리를 바꿉니다.`);
    fx({side:"mine",slot:from,s:"step",ring:"#5fd8cf",gap:60});
  } else say(`${h.name} ${from}번 → ${to}번`);
  fx({side:"mine",slot:to,s:"step",ring:"#5fd8cf",glow:1,gap:90});
  { const ms=itemBt(h,"moveShield")+((h.tag&&h.tag.moveShield)||0); if(ms) h.shield+=ms;
    const mb=itemBt(h,"moveBlast");
    if(mb) B.foes.filter(f=>f.alive).forEach(f=>hurt(f,mb,"질풍 각반","wind"));
    (h.items||[]).forEach(it=>{ const k=it.bt&&it.bt.moveStat;
      if(k){ bumpTurn(h,k,1) } }); }
  if(deb(h,"shock")){ const v=h.deb.shock;
    h.hp-=v; fx({side:"mine",slot:h.slot,hit:1,txt:"-"+v,cls:"dmg",gap:70});
    say(`${h.name} 감전 피해 ${v}`,"t3") }
}
function infectFoe(f,n){
  if(!f.alive) return;
  { const src=B.lastAttacker;
    if(src&&src.slot>0){ const a=ctrOf("mine",src.slot), b=ctrOf("foe",f.slot);
      if(a&&b) beamFX(a,b,"#8f5fd0",4) } }
  f.infect=(f.infect||0)+n;
  fx({side:"foe",slot:f.slot,ring:"#8f5fd0",txt:"감염"+f.infect,cls:"mag",gap:80});
}
function addRead(h,n){
  if(h.name!=="도미니코") return;
  h.read=(h.read||0)+n+(h.tag.readPlus||0);
  const need=h.tag.readNeed||10;
  if(h.read>=need&&!h.blessed){ h.read-=need; h.blessed=1;
    pulseFX("mine",h.slot,"#c9a227",3);
    veil("radial-gradient(circle,rgba(201,162,39,.22),transparent 70%)");
    fx({side:"mine",slot:h.slot,s:"summon",ring:"#c9a227",txt:"축복",cls:"crit"});
    say(`${h.name} 축복 상태 — 다음 기술이 강화됩니다.`,"t1") }
}
/* 이 기술이 적에게 피해를 주는가 — 자세와 사운드를 잡을 때 쓴다.
   기술마다 피해를 셈하는 자리가 달라서 표시로 가린다. */
const FOE_HIT=["dmg","justice","thrust","dump","scaleBoom","phantomPain","burst",
  "shackle","verdict","allHit","penance","seed","drain","magnet","scaleGain",
  "farshot","nearest","shadow"];
function hitsFoe(s,target){
  if(!s) return false;
  if(s.wand) return target>0;                 /* 지팡이는 아군에게도 쓴다 */
  return FOE_HIT.some(k=>!!s[k]);
}
function runEffect(h,i,s,target){
  B.lastAttacker=h;          /* 가시가 되받아칠 상대 */
  const tgt=foeAt(target);
  /* ── 쿠렘타이 ── */
  if(s.drain){
    const t0=foeAt(target); if(!t0){ say("그 칸에는 적이 없습니다.","t2"); return }
    const so=run.souls||0;
    const list=[t0];
    if(so>=20){ const b=foeAt(target+1); if(b) list.push(b) }
    if(so>=60){ const f2=foeAt(target-1); if(f2) list.push(f2) }
    const times=so>=200?2:1;
    const dmg=s.dmg+mod(s,"dmg")+h.mag;
    for(let q=0;q<times;q++) list.forEach(f=>{ if(f.alive) hurt(f,dmg,"착취","mag",so>=140?50:0) });
    setTimeout(()=>{ const me=ctrOf("mine",h.slot);
      list.forEach(f=>{ const p=ctrOf("foe",f.slot);
        if(p&&me){ beamFX(p,me,"#8f5fd0",5); soulFX({side:"foe",slot:f.slot},{side:"mine",slot:h.slot},"#b58fe0",3) } }) },40);
    return;
  }
  if(s.phantom){
    if(B.mins.some(m=>m.alive&&m.of)||B.foes.some(f=>f.alive&&f.isPhantom)){
      say("환영은 전장에 하나만 세울 수 있습니다.","t2"); return }
    const src=B.foes.filter(f=>f.alive&&!f.isPhantom).sort((a,b)=>a.hp-b.hp)[0];
    if(!src){ say("적이 없습니다.","t2"); return }
    const slot=Math.abs(target), mine=(target<0);
    const back=4+h.mag+Math.round(src.maxHp*(0.10+(run.souls||0)/40*0.025));
    if(mine){
      if(occAt(slot)){ say("그 칸에는 이미 누군가 있습니다.","t2"); return }
      const m=makeMin("환영",slot);
      m.maxHp=src.hp; m.hp=src.hp; m.owner=h.name; m.phantomOf=src.id; m.backlash=back;
      m.of=src.name; m.name=src.name+"의 환영";
      m.taunt=1; m.perma=1;                 /* 내 전장의 환영은 도발한다 */
      B.mins.push(m);
    }else{
      if(foeAt(slot)){ say("그 칸에는 이미 적이 있습니다.","t2"); return }
      B.foes.push({name:src.name+"의 환영",of:src.name,slot:slot,maxHp:src.hp,hp:src.hp,atk:0,def:0,rng:0,exp:1,
        demon:0,boss:0,shield:0,air:0,alive:1,id:B.foes.length+100,infect:0,stun:0,weak:0,
        isPhantom:1,phantomOf:src.id,backlash:back});
    }
    soulFX({side:"foe",slot:src.slot},{side:mine?"mine":"foe",slot:slot},"#9ecbf5",7);
    fx({side:mine?"mine":"foe",slot:slot,art:"mag",s:"summon",txt:"환영",cls:"mag",gap:420});
    say(`${src.name}의 환영이 ${mine?"아군":"적"} ${slot}번 칸에 나타납니다.${
      mine?" 도발합니다.":""}`,"t1");
    return;
  }
  if(s.phantomPain){
    const v=h.mag;
    if(!v){ say("아직 추가 마법력이 없습니다.","t2"); return }
    pulseFX("mine",h.slot,"#8f5fd0",3);
    B.foes.filter(f=>f.alive).forEach(f=>{ pulseFX("foe",f.slot,"#8f5fd0",2); hurt(f,v,"환상통","mag") });
    return;
  }
  if(s.verdict){
    if(h.verdictUsed){ say("이번 전투에는 이미 썼습니다.","t2"); return }
    if(target<0){
      const a=allyAt(-target); if(!a){ say("그 칸에는 아군이 없습니다.","t2"); return }
      h.verdictUsed=1; a.hp=Math.max(1,Math.round(a.maxHp*0.5)); bumpTmp(a,"mag",2);
      pillarFX("mine",a.slot,"rgba(201,162,39,.9)");
      fx({side:"mine",slot:a.slot,art:"mag",s:"summon",txt:"선고",cls:"crit",gap:260});
      say(`사형 선고 — ${a.name}${jo(a.name,"eul")} 한 번 죽였다가 되살립니다. 마법력 +2`,"t1");
      return;
    }
    const f=foeAt(target); if(!f){ say("그 칸에는 적이 없습니다.","t2"); return }
    if(f.boss){ say("우두머리에게는 통하지 않습니다.","t2"); return }
    h.verdictUsed=1;
    pillarFX("foe",f.slot,"rgba(160,106,224,.9)");
    veil("radial-gradient(circle,rgba(160,106,224,.3),transparent 70%)");
    hurt(f,f.hp+f.shield,"사형 선고","mag",100);
    const nf=B.foes.find(x=>x.id===f.id);
    nf.alive=1; nf.hp=Math.max(1,Math.round(nf.maxHp*0.5)); nf.shield=0;
    addDeb(nf,"fear",2);
    say(`${nf.name}${jo(nf.name,"ig")} 죽었다가 다시 일어섭니다.`,"t1");
    return;
  }
  /* ── 이테리오 ── */
  if(s.allHit){
    const base=s.dmg+mod(s,"dmg")+h.atk;
    /* 압축 공격 — 멀리까지 닿는 대신 가까이만 때리고 흡수를 얻는다 */
    const press=!!h.tag.pressAtk;
    let list=B.foes.filter(f=>f.alive);
    if(press){
      list=list.filter(f=>dist(h.slot,f.slot)<=2);
      h.leech=Math.max(h.leech||0,20);
      if(!list.length) say("압축 공격 — 거리 2 안에 적이 없습니다.","t2");
    }
    list.forEach(f=>{
      /* 정밀 표식 — 공격 계열이므로 표식이 있으면 치명타 */
      let d=base, crit=0;
      if(h.name==="이테리오"&&s.el!=="마법"&&(f.mark||0)>0){ d*=2; f.mark--; crit=1 }
      B.lastAttacker=h;
      hurt(f,d,press?"압축 공격":s.n,"slash",0,crit);
      if(press) applyLeech(h,d);
    });
    return;
  }
  if(s.jumpback){
    const to=Math.max(1,Math.min(SLOTS,target||h.slot));
    if(to!==h.slot&&Math.abs(to-h.slot)<=2) moveTo(h,to);
    h.mobile=1;
    fx({side:"mine",slot:h.slot,ring:"#6aa8e0",txt:"기동",cls:"shd"});
    say(`${h.name} 기동 상태 — 기술을 쓸 때마다 한 칸 물러섭니다.`);
    return;
  }
  if(s.magnet){
    { const t2=foeAt(target); if(t2) chainFX({side:"mine",slot:h.slot},{side:"foe",slot:t2.slot},"#6aa8e0") }
    const f=foeAt(target); if(!f){ say("그 칸에는 적이 없습니다.","t2"); return }
    const marked=(f.mark||0)>0;
    hurt(f,s.dmg+mod(s,"dmg")+h.mag,"자기장 변환","mag");
    if(marked&&f.alive){
      f.mark--;
      if(f.slot>1&&!foeAt(f.slot-1)){ f.slot--; addDeb(f,"bind",1);
        say(`${f.name}${jo(f.name,"ig")} 끌려오며 속박됩니다.`) }
      else addDeb(f,"stun",1);
    }
    return;
  }
  if(s.warp){
    B.foes.filter(f=>f.alive).forEach(f=>pulseFX("foe",f.slot,"#6aa8e0",2));
    veil("radial-gradient(circle,rgba(106,168,224,.26),transparent 70%)");
    const alive=B.foes.filter(f=>f.alive);
    if(!alive.length) return;
    alive.forEach(f=>{ f.mark=(f.mark||0)+1 });
    const slots=alive.map(f=>f.slot);
    for(let q=slots.length-1;q>0;q--){ const r2=Math.floor(Math.random()*(q+1));
      const t2=slots[q]; slots[q]=slots[r2]; slots[r2]=t2 }
    alive.forEach((f,i)=>{ f.slot=slots[i] });
    fx({side:"foe",slot:alive[0].slot,art:"mag",s:"mag",txt:"뒤섞임",cls:"mag"});
    say("시공간 폭탄 — 적들이 표식과 함께 흩어집니다.","t1");
    return;
  }
  /* ── 데린저 ── */
  if(s.dump){
    const n2=h.ammo||0;

    say("참회의 기류가 오갑니다.","t1"); return;
  }
  if(s.el==="이동"){
    const reach=h.tag.gustRange||1;
    if(target&&target!==h.slot&&!h.tag.gustStayOnly){
      const step=target>h.slot?1:-1;
      let to=h.slot;
      for(let q=0;q<reach;q++){
        const nx=to+step;
        if(nx<1||nx>SLOTS) break;
        to=nx;
        if(nx===target) break;
      }
      if(to!==h.slot) moveTo(h,to);
      else say("그쪽으로는 움직일 수 없습니다.","t2");
    } else if(h.tag.gustStay||h.name!=="카제"){
      fx({side:"mine",slot:h.slot,s:"step",ring:"#5fd8cf",gap:90});
      say(`${h.name} 제자리에서 바람을 모읍니다.`);
    } else { say("이동할 칸을 골라야 합니다.","t2"); return }
    h.mom+=itemBt(h,"moveMom");
    const m=1+(h.tag.momPlus||0);
    h.mom+=m; h.windBuff+=1+(h.tag.gustPlus||0);
    say(`${h.name} 추진력 +${m} · 다음 진선풍도의 거리와 피해량 +${1+(h.tag.gustPlus||0)}`);
    return;
  }
  /* 공통 : 보호막 · 회복 */
  if(s.shield){ let v=s.shield+mod(s,"shield")+h.def;
    if(h.name==="나이코스"&&i===1&&h.tag.firstGuard&&h.first.guard!==1){
      v+=h.tag.firstGuard+h.def; h.first.guard=1 }
    if(deb(h,"defDn")) v=Math.ceil(v*0.5);
    h.shield+=v;
    fx({side:"mine",slot:h.slot,s:"shield",glow:1});
    say(`${h.name} 보호막 +${v}`) }
  if(s.taunt){ h.taunt=s.taunt }
  if(s.evade){ h.evade+=s.evade;
    if(h.tag.flowShield){ h.eshield=(h.eshield||0)+h.tag.flowShield;
      say(`기류 흘리기 — ${h.name} 에너지 보호막 +${h.tag.flowShield}`) }
    fx({side:"mine",slot:h.slot,s:"wind",ring:"#5fd8cf",txt:"회피",cls:"shd"});
    say(`${h.name} 회피 +${s.evade}`) }
  if(s.potential){ h.potential=1; h.free+=4+(h.tag.freePlus||0);
    pulseFX("mine",h.slot,"#5fd8cf",4);
    rainFX("#a8f0ea",22);
    edgeGlow("rgba(95,216,207,.55)");
    punchIn("mine",h.slot);
    fx({side:"mine",slot:h.slot,art:"wind",s:"tornado",glow:1,txt:"각성",cls:"crit",gap:220});
    say("잠재력 활성 — 이번 턴 진선풍도가 전체를 칩니다.","t1") }
  if(s.card||s.allArmor){
    const times=(h.tag.armorTwice?2:1)*(s.allArmor?0:1);
    if(s.allArmor){ h.tag.armors.forEach(nm=>giveArmor(h,nm));
      say("중무장 — 모든 방어구 카드를 얻었습니다.","t1"); }
    else for(let q=0;q<times;q++){
      if(h.tag.armorPick){
        const pick=[]; const pool=h.tag.armors.slice();
        for(let z=0;z<3&&pool.length;z++) pick.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
        pick.forEach(nm=>giveArmor(h,nm));
        say(`갑옷 고르기 — ${pick.join(" / ")} 중 쓸 것을 고르세요.`,"t2");
      } else giveArmor(h,rnd(h.tag.armors));
    }
    if(h.tag.armorShield){ const v=h.tag.armorShield;
      h.shield+=v;
      say(`갑옷 장착 — 보호막 +${v}`) }
  }
  if(s.thrust){
    const v=(h.cutSum||0)*3;
    if(!v){ say("이번 턴에 벤 적이 없습니다.","t2"); return }
    const t2=foeAt(target); if(!t2){ say("그 칸에는 적이 없습니다.","t2"); return }
    hurt(t2,v,"찌르기","slash");
    return;
  }
  if(s.bomb){ h.bomb=2;
    pulseFX("mine",h.slot,"#e0705a",3);
    say("몸이 부풀어 오릅니다. 2턴 뒤 터집니다.","t3"); }
  if(s.fuse){
    liveMins().filter(m=>m.owner===h.name).forEach(m=>
      soulFX({side:"mine",slot:m.slot},{side:"mine",slot:h.slot},"#e0705a",5));
    const list=liveMins().filter(m=>m.owner===h.name);
    const g=list.length; if(!g){ say("전장에 삼킬 소환물이 없습니다.","t2"); return }
    const mul=h.tag.fuseX||1;
    list.forEach(m=>{
      healUp(h,m.hp);
      fx({side:"mine",slot:m.slot,art:"mag",s:"summon",txt:"흡수",cls:"heal",gap:90});
      m.alive=0; m.slot=0;
    });
    bumpTmp(h,"atk",3*g*mul); bumpTmp(h,"mag",3*g*mul); bumpTmp(h,"def",3*g*mul);
    fx({side:"mine",slot:h.slot,art:"mag",s:"summon",glow:1,txt:"융합",cls:"crit"});
    say(`융합 — 소환물 ${g}을 삼켜 이번 전투 동안 능력치가 크게 오릅니다.`,"t1");
  }
  if(s.minion){
    const side=target<0?"mine":"foe", slot=Math.abs(target);
    const ex=B.portals.find(p=>p.side===side&&p.slot===slot);
    if(ex){
      B.hand.push({type:"summon",name:"악마 하수인"});
      fx({side:side,slot:slot,art:"mag",s:"summon",txt:"하수인",cls:"crit"});
      say("차원문 재사용 — 악마 하수인 카드를 얻습니다. 빈 칸에 끌어다 소환하세요.","t1");
    }else{
      B.portals.push({side:side,slot:slot,dmg:s.dmg+mod(s,"dmg")+h.mag,shield:3+h.def});
      fx({side:side,slot:slot,art:"mag",s:"mag",ring:"#a06ae0",txt:"차원문",cls:"mag"});
      say(`${side==="mine"?"아군":"적"} ${slot}번 칸에 차원문이 열립니다.`,"t1");
    }
    return;
  }
  if(s.heal){ let v=s.heal+mod(s,"heal");
    if(deb(h,"defDn")) v=Math.ceil(v*0.5);
    healUp(h,v);
    fx({side:"mine",slot:h.slot,s:"heal",txt:"+"+v,cls:"heal",ring:"#7fd39a"});
    say(`${h.name} 체력 +${v}`) }
  /* 피해 */
  if(s.dmg!=null){
    if(h.name==="카제"&&i===0){
      h.windUses++;
      const every=(h.potential&&h.tag.potentialEvery)||h.tag.windEvery||3;
      const strong=h.tag.alwaysStrong||(h.windUses%every===0);
      const bonus=h.windBuff;
      const reach=h.tag.noRange?99:(strong?3:s.rng)+bonus;
      let dmg=s.dmg+mod(s,"dmg")+bonus+h.atk;
      if(h.tag.firstWind&&h.first.wind!==1){ dmg+=h.tag.firstWind; h.first.wind=1 }
      let list = strong||h.potential
        ? B.foes.filter(f=>f.alive&&dist(h.slot,f.slot)<=reach)
        : (tgt&&dist(h.slot,tgt.slot)<=reach?[tgt]:[]);
      if(!list.length) say(`사거리 ${reach} 안에 적이 없습니다.`,"t2");
      if(strong&&list.length){
        const far=list.reduce((a,b)=>dist(h.slot,a.slot)>=dist(h.slot,b.slot)?a:b);
        fx({side:"foe",slot:far.slot,sweep:{side:"mine",slot:h.slot},s:"tornado",gap:260});
        say("회오리가 전장을 훑고 지나갑니다.","t1");
      }
      list.forEach(f=>hurt(f,dmg,`진선풍도${strong?"(강화)":""}`,"wind"));
      if(strong&&list.length){
        const alive=list.filter(f=>f.alive);
        const last=alive.length
          ? alive.reduce((a,b)=>dist(h.slot,a.slot)>=dist(h.slot,b.slot)?a:b) : null;
        (h.potential?alive:(last?[last]:[])).forEach(f=>airborne(h,f));
      }
      h.windBuff=0; return;
    }
    if(!tgt) return;
    if(s.rng&&dist(h.slot,tgt.slot)>s.rng) return;
    let dmg=s.dmg+mod(s,"dmg")+(s.el==="마법"?h.mag:h.atk*(s.n==="방패 밀치기"?(h.tag.pushAtkX||1):1));
    if(s.el==="마법"&&deb(h,"magDn")) dmg=Math.ceil(dmg*0.5);
    else if(s.el!=="마법"&&deb(h,"atkDn")) dmg=Math.ceil(dmg*0.5);
    let CRIT=0;
    /* 이테리오 정밀 타격 : 표식이 있는 적에게 공격 피해는 치명타 */
    if(h.name==="이테리오"&&s.el!=="마법"&&(tgt.mark||0)>0){
      dmg*=2; tgt.mark--; CRIT=1; say(`정밀 표식 — 치명타!`,"t1");
    }
    /* 치명적인 공격 · 치명적인 마법 — 그 전투의 첫 한 방 */
    { const mag=(s.el==="마법");
      const key=mag?"critMag":"critAtk", done=mag?"critMagUsed":"critAtkUsed";
      if(h.tag[key]&&!h[done]){ h[done]=1; dmg*=2; CRIT=1;
        say(`${mag?"치명적인 마법":"치명적인 공격"} — 첫 일격이 치명타로 꽂힙니다!`,"t1") } }
    /* 그슨대 급습 */
    if(h.name==="그슨대"&&h.hide&&s.el==="공격"){ dmg*=2; h.hide=0; CRIT=1; say("급습 — 치명타!","t1") }
    /* 데린저 조준 · 헤드샷 */
    if(h.name==="데린저"){
      if(h.aimAt!=null){ if(tgt.id===h.aimAt){ dmg*=2; CRIT=1 } else dmg=0 }
      if(s.ammo&&h.tag.headshot&&!h.headshotUsed){
        h.headshotUsed=1;
        const add=8+h.atk;
        dmg=(h.aimAt!=null&&tgt.id===h.aimAt) ? Math.round((dmg/2+add)*3) : dmg+add;
        say("헤드샷!","t1");
      }
    }
    if(!dmg){ say(`${tgt.name}${jo(tgt.name,"eun")} 조준 밖이라 상처 하나 없습니다.`,"t2"); return }
    /* 육중한 밀치기 — 맞은 적을 한 칸 뒤로. 밀려날 데가 없으면 기절 */
    const heave=t=>{
      if(!h.tag.pushBack||!t||!t.alive) return;
      if(t.slot<SLOTS&&!foeAt(t.slot+1)){
        t.slot++;
        fx({side:"foe",slot:t.slot,s:"step",ring:"#9c8d77",txt:"밀림",cls:"miss",gap:80});
        say(`육중한 밀치기 — ${t.name}${jo(t.name,"ig")} ${t.slot}번으로 밀려납니다.`,"t2");
      }else{
        addDeb(t,"stun",1,h);
        fx({side:"foe",slot:t.slot,ring:"#a06ae0",txt:"기절",cls:"miss",gap:80});
        say(`육중한 밀치기 — 밀려날 데가 없어 ${t.name}${jo(t.name,"ig")} 기절합니다.`,"t2");
      }
    };
    if(s.n==="방패 밀치기"&&h.tag.pushAll){
      const hit=B.foes.filter(f=>f.alive);
      hit.forEach(f=>hurt(f,dmg,s.n,"slash"));
      hit.slice().sort((a,b)=>b.slot-a.slot).forEach(heave);
      return;
    }
    if(h.name==="트리스탄"){
      const T=h.tag||{};
      let cr=0;
      if(s.pierce&&T.pierceCrit) cr=1;                       /* 서릿빛 용의 비늘촉 */
      if(s.el!=="마법"&&T.genMark&&(tgt.gmark||0)>0) cr=1;   /* 대상 포착 */
      if(s.markKill&&T.hitCrit){                             /* 치명적 명중 */
        const pin=T.nearShot?nearestFoe(h):farthestFoe(h);
        if(pin&&pin===tgt) cr=1;
      }
      if(cr&&!CRIT){ dmg*=2; CRIT=1; say(`${s.n} — 치명타!`,"t1") }
      if(s.pierce&&T.pierceLeech) h.leech=Math.max(h.leech||0,T.pierceLeech);
    }
    if(h.name==="나이코스"&&i===0){
      /* 핏빛 칼날 — 세 번 벤 다음 한 번이 치명타로 들어간다 */
      h.cutUses=(h.cutUses||0)+1;
      const blood=!!(h.tag.bloodBlade&&h.cutUses%4===0);
      if(blood){ CRIT=1; say("핏빛 칼날 — 날이 붉게 달아오릅니다. 치명타!","t1") }
      if(h.tag.nearHit&&dist(h.slot,tgt.slot)===1) dmg+=h.tag.nearHit;
      if(h.tag.firstCut&&h.first.cut!==1){ dmg+=h.tag.firstCut+h.atk; h.first.cut=1 }
      if(h.tag.guardThen&&h.guardStack){
        dmg+=h.tag.guardThen*h.guardStack; h.guardStack=0 }
      dmg+=(h.cutGrow||0);
      if(h.tag.cutHeal){ healUp(h,h.tag.cutHeal) }
      /* 치명타는 자리마다 손으로 곱한다. 여기서도 마지막에 곱해 준다 */
      if(blood) dmg*=2;
      h.cutSum=(h.cutSum||0)+dmg;
    }
    const times=(h.name==="나이코스"&&i===0&&h.sk[0].twice)?2:1;
    for(let t=0;t<times;t++){
      if(s.markKill||s.pierce)
        fx({side:"foe",slot:tgt.slot,streak:{side:"mine",slot:h.slot},s:"arrow",gap:130});
      if(h.name==="나이코스"&&i===0) fx({side:"foe",slot:tgt.slot,slash:1,gap:0});
      const was=tgt.alive;
      let PR=0;
      if(s.pierce===true||h.pierceNext) PR=Math.max(PR,50);
      else if(s.pierce) PR=Math.max(PR,+s.pierce);
      if(s.el!=="마법"){
        PR+=itemBt(h,"pierce");
        if(tgt.taunt) PR+=itemBt(h,"tauntPierce");
      }
      hurt(tgt,dmg,s.n,s.el==="마법"?"mag":(h.name==="굴라"?"claw":"slash"),PR,CRIT);
      if(s.n==="방패 밀치기") heave(tgt);
      applyLeech(h,dmg);
      if(h.name==="이테리오"&&s.mark&&tgt.alive){ tgt.mark=(tgt.mark||0)+1;
        fx({side:"foe",slot:tgt.slot,ring:"#6aa8e0",txt:"표식",cls:"mag",gap:60}) }
      if(was&&!tgt.alive){
        bark(h,"kill");
        if(!tgt.isPhantom){
          const ke=itemBt(h,"killEsh");
          if(ke) h.eshield=(h.eshield||0)+ke;
          const ks=itemBt(h,"killStat");
          if(ks){ bumpTmp(h,"atk",ks); bumpTmp(h,"mag",ks) }
        }
        if(h.arenaHeal&&!tgt.isPhantom){ healUp(h,h.arenaHeal);
          fx({side:"mine",slot:h.slot,s:"heal",txt:"+"+h.arenaHeal,cls:"heal",gap:60});
          say(`피의 투기장 — ${h.name} 체력 +${h.arenaHeal}`,"t2") }
        if(h.name==="나이코스"&&i===0){
          if(h.tag.killGrow){ h.cutGrow=(h.cutGrow||0)+h.tag.killGrow;
            say(`늘어가는 실력 — 이번 전투 베기 피해 +${h.cutGrow}`,"t1") }
          if(h.tag.killShield){ h.shield+=h.tag.killShield;
            say(`아드레날린 분비 — 보호막 +${h.tag.killShield}`) }
        }
        if(s.markKill){ h.sk[1].limit++;
          pillarFX("foe",tgt.slot,"rgba(224,200,90,.9)");
          say("명중 — 피부 강화의 사용한도가 늘어납니다.","t1") }
        if(s.exec&&h.tag.execMana){ h.mana+=h.tag.execMana;
          say(`승리의 연격 — ${h.name} 이번 턴 추가 마나 +${h.tag.execMana}`,"t2") }
        if(s.exec){ const v=1+(h.tag.execPlus||0);
          pillarFX("foe",tgt.slot,"rgba(201,162,39,.9)");
          addMod(h,"베기","dmg",v,"승리의 일격");
          fx({side:"mine",slot:h.slot,pose:"bless",poseMs:1400,glow:1,
              ring:"#c9a227",txt:"베기 +"+v,cls:"shd",gap:220});
          say(`승리의 일격 — 베기가 영구히 ${v} 강해집니다.`,"t1") }
        break;
      }
    }
    /* ── 트리스탄 꿰뚫는 화살의 곁가지 ── */
    if(h.name==="트리스탄"&&s.pierce){
      const T=h.tag||{};
      const curse=f=>{ if(!T.pierceDeb||!f.alive) return;
        addDeb(f,"magDn",1,h); addDeb(f,"defDn",1,h);
        fx({side:"foe",slot:f.slot,ring:"#8f5fd0",txt:"약화",cls:"miss",gap:60}) };
      curse(tgt);
      if(T.pierceAll){                                   /* 척추뼈 화살촉 */
        B.foes.filter(f=>f.alive&&f!==tgt).forEach(f=>{
          hurt(f,dmg,s.n,"slash",pierceRate(s.pierce),CRIT);
          applyLeech(h,dmg); curse(f);
        });
      }
    }
  }
  if(h.name==="나이코스"&&i===1){
    h.guarded=1;                                  /* 처세술 — 다음 베기 공짜 */
    h.guardStack=(h.guardStack||0)+1;             /* 준비 태세 — 막기마다 쌓인다 */
  }
}

/* ─ 턴 ─ */
function battleLost(){
  run.heroes.forEach(clearTmp);
  run.heroes.forEach(h=>{ if(h.hp<=0){ h.hp=0; h.down=1; h.slot=0 } });
  fx({s:"down",gap:0});
  veil("radial-gradient(circle,rgba(142,43,43,.5),transparent 70%)");
  run.dun=null; run.pendingEnter=null;
  /* 전장의 승자 — 패배하면 그렇게 얻은 공격력을 모두 잃는다.
     '분노 전환'을 가졌으면 잃는 대신 그만큼 더 얻는다. */
  run.heroes.forEach(h=>{
    if(h.name!=="나이코스"||!h.wins) return;
    const n=h.wins; h.wins=0;
    if(h.tag.rageTurn){ h.atk+=n;
      say(`분노 전환 — 잃을 뻔한 공격력이 오히려 ${n} 더 붙습니다.`,"t1") }
    else { h.atk=Math.max(0,h.atk-n);
      say(`전장의 승자 — 패배로 얻었던 공격력 ${n}을 잃습니다.`,"t3") }
  });
  const standing=run.heroes.filter(h=>!h.down).length;
  if(!standing){
    say("모두 쓰러졌습니다. 일으켜 줄 사람이 남지 않았습니다.","t3");
    setTimeout(()=>lose("대원이 모두 쓰러졌습니다. 주둔지로 데려갈 사람이 남지 않았습니다."),1300);
    return;
  }
  addTaint(30);
  say("물러납니다. 오염도가 30 올랐습니다.","t3");
  setTimeout(()=>{ toast(`쓰러진 대원은 주둔지 치료소에서 일으킬 수 있습니다. (성한 대원 ${standing}명)`);
    if(view!=="over"){ view="map"; render() } },1200);
}
function critAlly(t){ FXQ.push({crit:1,side:"mine",slot:t.slot}); flushFX() }
function hurtAlly(f,t,raw,label){
  /* 갑피 : 한 번에 받는 피해를 그 수치까지로 잘라낸다 (보호막에 들어가는 몫까지 포함) */
  if(t.armor>0&&raw>t.armor){
    fx({side:"mine",slot:t.slot,ring:"#e0c85a",txt:"갑피"+t.armor,cls:"shd",gap:60});
    raw=t.armor;
  }
  if(t.evade>0){ t.evade--;
    fx({side:"mine",slot:t.slot,s:"miss",txt:"회피",cls:"miss"});
    say(`${label} — ${t.name} 회피!`,"t2"); return }
  let d=raw;
  const hadE=t.eshield||0, hadS=t.shield||0;
  const eh=Math.min(t.eshield||0,d); if(eh){ t.eshield-=eh; d-=eh }
  let sh=Math.min(t.shield,d); t.shield-=sh; d-=sh;
  /* 막이 다 깎여 나가는 순간에만 울린다 */
  if(hadE>0&&t.eshield<=0) breakFX(t,"e");
  if(hadS>0&&t.shield<=0)  breakFX(t,"s");
  if(!t.deathSaveUsed&&itemBt(t,"deathSave")&&d>=t.hp){
    t.deathSaveUsed=1; d=0; raw=0;
    healUp(t,Math.round(t.maxHp*itemBt(t,"deathSave")/100));
    fx({side:"mine",slot:t.slot,ring:"#7fd39a",txt:"버팀",cls:"crit",gap:80});
    say(`불굴의 맹세 — ${t.name}${jo(t.name,"ig")} 쓰러지지 않습니다.`,"t1");
  }
  else if(t.gloryGuard&&d>=t.hp){ t.gloryGuard=0; d=0; raw=0;
    fx({side:"mine",slot:t.slot,ring:"#c9a227",txt:"버팀",cls:"crit",gap:80});
    say(`영광 숭배자 — ${t.name}${jo(t.name,"ig")} 치명적인 일격을 한 번 흘려냅니다.`,"t1") }
  t.hp-=d;
  sh+=eh;
  if(t.tag&&itemBt(t,"lastStand")&&!t.lastStandUsed&&t.hp<=t.maxHp*0.5){
    t.lastStandUsed=1; const v=itemBt(t,"lastStand");
    t.eshield=(t.eshield||0)+v*4; bumpTmp(t,"atk",v);
    say(`애곤의 발톱 — ${t.name}${jo(t.name,"ig")} 이를 악뭅니다.`,"t1");
  }
  /* 체력이 닳았으면 피격, 보호막이 대신 다 받아 냈으면 막기 */
  fx({side:"mine",slot:t.slot,hit:1,art:"claw",s:"hit",txt:"-"+raw,cls:"dmg",gap:170,
      recoil:1, pose:(d>0?"hurt":(sh>0?"guard":null))});
  say(`${f.name} → ${t.name} ${label} 피해 ${raw}${sh?` (보호막 ${sh})`:""} · ${Math.max(0,t.hp)}/${t.maxHp}`);
  { const th=((t.tag&&t.tag.thorn)||0)+(t.thornTmp||0);
    if(th&&f.alive&&!t.thornBusy){
      t.thornBusy=1; hurt(f,th,`${t.name}의 가시`,"slash"); t.thornBusy=0; } }
  if(t.name==="그슨대"&&raw>0){
    t.dark=(t.dark||0)+1;
    if(t.dark%3===0){ bumpTmp(t,"atk",1); say(`커져가는 악몽 — ${t.name} 공격력 +1`,"t1") }
    if(t.stance==="nightmare") B.foes.filter(x=>x.alive).forEach(x=>hurt(x,4+t.atk,"악몽 태세","slash"));
    if(t.stance==="terror") B.foes.filter(x=>x.alive).forEach(x=>{ addDeb(x,"fear",1,t); addDeb(x,"atkDn",1) });
  }
  if(t.hp<=0) unitDown(t); else if(raw>0) bark(t,"hurt");
}
function unitDown(t){
  fx({side:"mine",slot:t.slot,s:"down",txt:t.isMin?"파괴":"쓰러짐",cls:"miss",gap:180});
  if(t.isMin){
    say(`${t.name}${jo(t.name,"ig")} 부서졌습니다.`,"t3");
    if(t.phantomOf!=null){
      const src=B.foes.find(f=>f.id===t.phantomOf&&f.alive);
      if(src) hurt(src,t.backlash||4,"환영의 반동","mag");
    }
    if(t.curseOnDeath) B.foes.filter(x=>x.alive&&dist(t.slot,x.slot)<=1)
      .forEach(x=>{ x.weak=(x.weak||0)+t.curseOnDeath;
        fx({side:"foe",slot:x.slot,ring:"#8f5fd0",txt:"약화",cls:"miss",gap:80}) });
    t.alive=0; t.slot=0; onDeath("min",t);
    /* 소환물이 마지막 목숨이었을 수도 있다 — 대원이 아니어도 여기서 판정한다 */
    if(!B.over&&!lifeLeft()&&!run.heroes.some(h=>h.hp>0)){ B.over=1; battleLost(); render() }
    return;
  }
  bark(t,"down",1);
  /* 쓰러진 대원은 전장에서 사라지지 않는다.
     전투가 끝날 때까지 그 자리에 남아 칸만 차지한다.
     회복도 버프도 저주도 닿지 않고, 적도 겨누지 않는다.
     ※ '기절'(deb.stun)과는 다른 것이다. 기절은 다음 기술이 불발되는 디버프고,
        쓰러짐은 체력이 다해 전투불능이 된 상태다. */
  say(`${t.name} 쓰러짐 — 그 자리에 그대로 남습니다.`,"t3");
  t.hp=0; t.down=1; t.downSlot=t.slot; t.slot=0; onDeath("ally");
  if(t.name==="트리스탄"&&!B.corpseUsed){
    B.corpseUsed=1; B.hand.push({type:"summon",name:"망자의 육체"});
    say("저주받은 육체 — 망자의 육체 카드를 얻습니다.","t1");
  }
  if(t.tag&&t.tag.downGold){ run.gold+=t.tag.downGold;
    say(`망자는 전리품을 남기고 — 금화 +${t.tag.downGold}`,"t2") }
  /* 전장에 설 수 있는 아군이 하나도 남지 않으면 그 자리에서 끝난다 */
  if(!B.over&&!lifeLeft()&&!run.heroes.some(h=>h.hp>0)){
    B.over=1; battleLost(); render();
  }
  else if(!B.over&&!liveMins().length&&!run.heroes.some(h=>h.hp>0)){
    say("전장에 설 대원이 없습니다 — 손에 든 소환 카드를 내려놓아야 버팁니다.","t3");
  }
}
function endTurn(){
  if(B.over||B.busy) return;
  if(run&&run.sandbox){
    B.turn++; sandboxTick(); keepSel();
    say(`— ${B.turn}턴 · 연습장 —`,"t2");
    render(); return;
  }
  if(!allUnits().length){ say("전장에 아군이 없습니다. 먼저 대원을 소환하세요.","t3"); return }
  /* 마당 ① 턴 종료 효과 → 눈과 귀로 확인 → 마당 ② 적 행동 → 마당 ③ 다음 턴 */
  const n=endPhase();
  if(n>0){
    B.busy=1; keepSel();
    const wait=Math.min(2200, Math.max(520, fxDuration()+320));
    render();
    setTimeout(()=>{ B.busy=0; if(B&&!B.over) foePhase(); }, wait);
  }else foePhase();
}
/* 마당 ① — 턴이 끝날 때 발동하는 것들. 적이 움직이기 전에 전부 여기서 끝난다 */
function endPhase(){
  let n=0; const bump=()=>{ n++ };
  const mark=B.log.length;              /* 머리말은 나중에 이 자리에 끼워 넣는다 */
  allUnits().forEach(tickDebEnd);
  liveMins().forEach(m=>{ if(m.perma) m.taunt=1 });
  onField().forEach(h=>{
   /* 첨탑관리자의 회중시계 — 이 대원의 턴 종료 효과만 한 번 더 돈다 */
   const rounds=1+((h.tag&&h.tag.endTwice)?1:0);
   for(let _e=0;_e<rounds;_e++){
    { const en=itemBt(h,"endNeg"); if(en){ h.negShield=(h.negShield||0)+en; bump();
        fx({side:"mine",slot:h.slot,s:"guard",ring:"#7fd39a",txt:"부정 보호막 "+h.negShield,cls:"shd",gap:150}) }
      const mn=itemBt(h,"momNeg");
      if(mn&&h.mom>0){ const use=Math.min(5,h.mom); h.mom-=use; h.negShield=(h.negShield||0)+use; bump();
        fx({side:"mine",slot:h.slot,s:"guard",ring:"#7fd39a",txt:"부정 보호막 "+h.negShield,cls:"shd",gap:150}) }
      const em=itemBt(h,"endMag");
      if(em){ h.endCount=(h.endCount||0)+1;
        if(h.endCount%2===0){ bumpTmp(h,"mag",1); bump();
          fx({side:"mine",slot:h.slot,s:"pick",ring:"#6aa8e0",txt:"마법력+1",cls:"mag",gap:150});
          say(`사색의 등 — ${h.name} 마법력 +1`,"t2") } } }
    const es=itemBt(h,"endShield");
    if(es){ const add=es+(itemBt(h,"endShieldDef")?h.def:0);
      endShield(h,add); bump();
      fx({side:"mine",slot:h.slot,s:"shield",glow:1,gap:190});
      say(`턴 종료 — ${h.name} 보호막 +${add}`,"t2") }
    const ms=itemBt(h,"manaShield");
    if(ms&&h.manaUsed){ const v=h.manaUsed*ms; endShield(h,v); h.manaUsed=0; bump();
      fx({side:"mine",slot:h.slot,s:"shield",gap:170});
      say(`마나 방벽 — ${h.name} 보호막 +${v}`,"t2") }
    const qs=itemBt(h,"momShield");
    if(qs&&h.mom>0){ const use=Math.min(6,h.mom); h.mom-=use; const v=use*qs; endShield(h,v); bump();
      fx({side:"mine",slot:h.slot,s:"shield",gap:170});
      say(`추진력 방벽 — ${h.name} 보호막 +${v}`,"t2") }
    if(h.name==="오토"){ const conv=Math.min(5,h.shield);
      if(conv){ h.shield-=conv; h.eshield=(h.eshield||0)+conv; bump();
        fx({side:"mine",slot:h.slot,s:"pulse",gap:170});
        say(`돌봄 — ${h.name} 보호막 ${conv}을 에너지 보호막으로 바꿉니다.`) } }
    /* 오토의 여분손 — 표에는 있었는데 아무 데서도 읽지 않아 아무 일도 안 하던 효과 */
    { const st=itemBt(h,"shieldToEsh");
      if(st){ const conv=Math.min(st,h.shield);
        if(conv){ h.shield-=conv; h.eshield=(h.eshield||0)+conv; bump();
          fx({side:"mine",slot:h.slot,s:"pulse",gap:170});
          say(`오토의 여분손 — ${h.name} 보호막 ${conv}을 에너지 보호막으로 바꿉니다.`,"t2") } } }
    if(h.name==="보아"){ const sc=h.scaleTurn||0, v=1+h.def+sc;
      endShield(h,v); h.scaleTurn=0; bump();
      fx({side:"mine",slot:h.slot,s:"shield",glow:1,gap:190});
      say(`적응성 비늘 — ${h.name} 보호막 +${v} (기본 1 + 보호력 ${h.def}${sc?` + 이번 턴 비늘 ${sc}`:""})`) }
    if(h.tag.dashMul&&h.mom>0){
      const use=Math.min(h.tag.dashMax||3,h.mom); h.mom-=use;
      const v=use*h.tag.dashMul; h.eshield=(h.eshield||0)+v; bump();
      fx({side:"mine",slot:h.slot,s:"pulse",gap:170});
      say(`달리기 — ${h.name} 에너지 보호막 +${v}`) }
    const eb=itemBt(h,"endBurnRange");
    if(eb){ const list=B.foes.filter(f=>f.alive&&dist(h.slot,f.slot)<=2);
      if(list.length) bump();
      list.forEach(f=>hurt(f,eb,"불타는 호각","slash")) }
    if(h.name==="헥토"){
      const v=(h.tag.allyShield||2)+h.def;
      const esh=!!h.tag.allyEsh;        /* 든든함 폭발 — 보호막 대신 에너지 보호막 */
      let first=1;
      allUnits().forEach(a=>{ if(a===h) return;
        if(esh) a.eshield=(a.eshield||0)+v; else endShield(a,v);
        bump();
        fx({side:"mine",slot:a.slot,s:first?(esh?"pulse":"shield"):null,gap:150});
        first=0 });
      say(`든든한 아군 — 다른 아군 ${esh?"에너지 보호막":"보호막"} +${v}`,"t2");
    }
   }
  });
  (B.portals||[]).forEach(p=>{
    if(p.side!=="foe") return;
    const f=foeAt(p.slot);
    if(f&&f.alive){ bump(); hurt(f,p.dmg,"균열 차원문","mag") }
  });
  if(n) B.log.splice(mark,0,{t:icoify("— 턴 종료 효과 —"),c:"t2"});
  return n;
}
/* 마당 ② — 적의 차례 */
function foePhase(){
  if(!B||B.over) return;
  say(`— ${B.turn}턴 적 행동 —`,"t1");
  B.lastAttacker=null;
  fx({s:"turn",gap:220});
  B.foes.forEach(f=>{ f.shield=0 });   /* 지난 턴에 얻은 보호막은 여기서 사라진다 */
  B.foes.forEach(f=>{
    if(!f.alive||!f.intent) return;
    const stunned=(f.stun||0)>0||deb(f,"stun")>0;
    const purging=f.boss&&f.intent&&f.intent.t==="purge"&&f.intent.k!=="ward";
    if(stunned&&!purging){
      if(f.stun>0) f.stun--; else f.deb.stun--;
      fx({side:"foe",slot:f.slot,txt:"기절",cls:"miss",gap:130});
      say(`${f.name} 기절 — 움직이지 못합니다.`,"t2"); return }
    if(f.intent.t==="move"){
      if(f.slot>1&&!foeAt(f.slot-1)){ f.slot--;
        fx({side:"foe",slot:f.slot,s:"step",ring:"#9c8d77",gap:130});
        say(`${f.name} 전진 → ${f.slot}번`) }
      else say(`${f.name} 전진 실패.`,"t2");
    }else if(f.intent.t==="thorn"){
      f.thorn=f.intent.v; f.thornTurn=f.intent.turns;
      fx({side:"foe",slot:f.slot,ring:"#b3453a",txt:"가시"+f.thorn,cls:"shd"});
      say(`${f.name}${jo(f.name,"ig")} 사슬을 휘감습니다 — 가시 ${f.thorn} (${f.thornTurn}턴)`,"t3");
    }
    else if(f.intent.t==="def"){ f.shield+=f.intent.v;
      fx({side:"foe",slot:f.slot,s:"shield"});
      say(`${f.name} 방어 +${f.intent.v}`) }
    else if(f.intent.t==="atk"){
      let t=unitAt(f.intent.to)||allUnits().filter(canAim)[0]||allUnits()[0];
      const wall=t&&tauntWall(t);
      if(wall){ say(`${wall.name}${jo(wall.name,"ig")} 앞을 막아섭니다.`,"t2"); t=wall }
      if(!t) return;
      if(!f.intent.far&&dist(t.slot,f.slot)>f.rng){ say(`${f.name} 공격 — 거리 밖.`,"t2"); return }
      bark(f,"atk");
      fx({side:"foe",slot:f.slot,lunge:1,gap:0});
      const hits=Math.max(1,f.intent.hits||1);
      const one=foeDmg(f,f.intent.v,f.intent.el);
      if(hits>1) say(`${f.name} ${f.intent.pat||"연타"} — ${hits}번 몰아칩니다.`,"t2");
      for(let q=0;q<hits;q++){
        if(!t.alive&&t.isMin) break;
        if(t.hp<=0) break;
        if(t.evade>0){ t.evade--;
          fx({side:"mine",slot:t.slot,s:"miss",txt:"회피",cls:"miss",gap:60});
          say(`${f.name} 공격 — ${t.name} 회피!`,"t2"); continue }
        hurtAlly(f,t,one,(f.intent.pat||"공격")+(hits>1?` ${q+1}/${hits}`:""));
      }
    }
    else if(f.intent.t==="push"){
      const front=foeAt(f.slot-1);
      if(front){ const a=f.slot; f.slot=front.slot; front.slot=a;
        fx({side:"foe",slot:f.slot,s:"step",ring:"#9c8d77",gap:120});
        say(`${f.name}${jo(f.name,"ig")} ${front.name}${jo(front.name,"eul")} 밀치고 앞으로 나섭니다.`) }
      else say(`${f.name} 앞으로 나서지 못했습니다.`,"t2");
    }
    else if(f.intent.t==="back"){
      if(f.slot<SLOTS&&!foeAt(f.slot+1)){ f.slot++;
        fx({side:"foe",slot:f.slot,s:"step",ring:"#9c8d77",gap:130});
        say(`${f.name} 물러섭니다 → ${f.slot}번`) }
      else say(`${f.name} 물러서지 못했습니다.`,"t2");
    }
    else if(f.intent.t==="purge"){
      const nm=purgeName(f,f.intent.k);
      if(f.intent.k==="ward"){
        f.negShield=(f.negShield||0)+f.intent.v;
        fx({side:"foe",slot:f.slot,s:"shield",ring:"#7fd39a",txt:"부정 보호막 "+f.negShield,cls:"shd",gap:140});
        pulseFX("foe",f.slot,"#7fd39a",2);
        say(`${f.name} — ${nm}. 부정 보호막 ${f.negShield}`,"t3");
      }else{
        const n=foePurge(f);
        pulseFX("foe",f.slot,"#e0c85a",3);
        fx({side:"foe",slot:f.slot,s:"quake",quake:1,ring:"#e0c85a",txt:n?"정화 "+n:"정화",cls:"crit",gap:200});
        if(n) say(`${f.name} — ${nm}. 몸에 걸린 것을 ${n} 모두 떨쳐냅니다.`,"t3");
        else  say(`${f.name} — ${nm}. 몸을 크게 떨칩니다.`,"t3");
        if(f.intent.k==="roar"&&n&&(f.buffs||0)<4){
          const up=f.intent.v*Math.min(3,n);
          f.atk+=up; f.buffs=(f.buffs||0)+1;
          fx({side:"foe",slot:f.slot,ring:"#e0705a",txt:"공격+"+up,cls:"dmg",gap:120});
          say(`${f.name}의 포효 — 떨쳐낸 만큼 공격력 +${up}`,"t3");
        }
      }
    }
    else if(f.intent.t==="buff"){
      f.atk+=f.intent.v; f.buffs=(f.buffs||0)+1;
      f.atkUp=(f.atkUp||0)+f.intent.v;          /* 화면에 남겨 둘 누적치 */
      pulseFX("foe",f.slot,"#e0705a",3);
      edgeGlow("rgba(224,112,90,.26)");
      fx({side:"foe",slot:f.slot,s:"buffup",ring:"#e0705a",glow:1,
          txt:"공격력 +"+f.intent.v,cls:"buf",gap:200});
      fx({side:"foe",slot:f.slot,txt:"누적 +"+f.atkUp,cls:"buf",gap:150});
      say(`${f.name}${jo(f.name,"ig")} 스스로를 벼립니다 — 공격력 +${f.intent.v} (누적 +${f.atkUp})`,"t3");
    }
    else if(f.intent.t==="heal"){
      const m=B.foes.find(x=>x.id===f.intent.to&&x.alive);
      if(m){ healUp(m,f.intent.v);
        fx({side:"foe",slot:m.slot,s:"heal",txt:"+"+f.intent.v,cls:"heal"});
        say(`${f.name} → ${m.name} 체력 +${f.intent.v}`,"t3") }
      else say(`${f.name} 치료할 동료가 없습니다.`,"t2");
    }
    else if(f.intent.t==="curse"){
      const list=onField();
      if(list.length){ const a=rnd(list); a.curse=(a.curse||0)+1;
        fx({side:"mine",slot:a.slot,ring:"#8f5fd0",txt:"저주",cls:"miss"});
        say(`${f.name} → ${a.name} 저주 — 다음 턴 마나 -1`,"t3") }
    }
    else if(f.intent.t==="deb"){
      const t=unitAt(f.intent.to)||allUnits()[0];
      if(t) addDeb(t,f.intent.k,f.intent.v,f);
      else say(`${f.name}의 저주가 허공에 흩어집니다.`,"t2");
    }
    else if(f.intent.t==="volley"){
      say(`${f.name} 일제 사격!`,"t3");
      { const v=foeDmg(f,f.intent.v,f.intent.el);
        allUnits().slice().forEach(a=>{ if(a.hp>0) hurtAlly(f,a,v,"일제 사격") }); }
    }
  });
  /* ── 적의 행동이 모두 끝났다. 남은 보호막은 여기서 걷힌다 ──
     턴 종료 효과 → 적 공격(보호막이 막아냄) → 보호막 소멸 → 내 턴 시작.
     그러니 다 막아낸 보호막이 다음 턴까지 따라오는 일은 없다. */
  run.heroes.forEach(h=>{ if(h.hp>0){ h.shield=0; h.keepShield=0 } });
  liveMins().forEach(m=>{ m.shield=0; m.keepShield=0 });
  if(!run.heroes.some(h=>h.hp>0)&&!lifeLeft()){ B.over=1; battleLost(); render(); return }
  if(!run.heroes.some(h=>!h.down)&&!lifeLeft()){ B.over=1; battleLost(); render(); return }
  B.turn++;
  if(B.turn>20){ B.over=1; say("20턴이 지나 물러납니다.","t3"); battleLost(); render(); return }
  liveMins().forEach(m=>{ m.mana=m.maxMana;
    m.armor=0;
    if(m.perma) m.taunt=1; else if(m.taunt) m.taunt--; });
  run.heroes.forEach(h=>{
    if(h.hp<=0) return;
    h.mana=Math.max(0,h.maxMana-(h.curse||0)); h.curse=0;

    h.headshotUsed=0; h.mobile=0;
    if(h.stanceTurn&&--h.stanceTurn<=0) h.stance=0;
    clearTurnTmp(h);
    h.cutSum=0;
    { const mt=itemBt(h,"manaTick");
      if(mt&&B.turn%mt===0){ h.mana++; say(`마나석 — ${h.name} 이번 턴 마나 +1`,"t2") } }
    if(h.tag.armorTurn&&h.slot>0) giveArmor(h,rnd(h.tag.armors||["강철 갑옷"]));
    /* 검투 대비 — 손에 쥔 방어구 장수만큼 이번 턴 보호력 */
    if(h.tag.handDef&&h.slot>0){
      const n2=(B.hand||[]).filter(c=>c.type==="item"&&ARMOR_CARDS[c.name]).length;
      if(n2){ bumpTurn(h,"def",n2*h.tag.handDef);
        say(`검투 대비 — ${h.name} 이번 턴 보호력 +${n2*h.tag.handDef}`,"t2") } }
    /* guardStack(준비 태세)은 여기서 걷지 않는다 — 베기를 쓸 때까지 남는다.
       라운드가 바뀌면 startBattle 이 걷는다. */
    h.airUp=0; h.potential=0; h.guarded=0; h.armor=0; h.thornTmp=0;
    const es2=itemBt(h,'startTurnShield'); if(es2) h.shield+=es2;
    /* 항상 대비하기 — 손에 방어구 카드를 쥐고 턴을 맞으면 보호막 */
    if(h.tag.readyShield&&(B.hand||[]).some(c=>c.type==="item"&&ARMOR_CARDS[c.name])){
      h.shield+=h.tag.readyShield;
      say(`항상 대비하기 — ${h.name} 보호막 +${h.tag.readyShield}`,"t2");
    }
    if(h.helm){ h.shield+=h.helm; say(`강철 투구 — ${h.name} 보호막 +${h.helm}`); h.helm=0 }
    if(h.taunt) h.taunt--;
    Object.keys(h.lock).forEach(k=>{ if(--h.lock[k]<=0) delete h.lock[k] });
    if(h.bomb&&--h.bomb===0){
      const v=Math.floor(h.hp*0.2);
      say("응축 폭발 — 압축된 힘이 터집니다.","t1");
      fx({side:"mine",slot:h.slot,quake:1,s:"quake",gap:260});
      B.foes.filter(f=>f.alive).forEach(f=>hurt(f,v,"응축 폭발","boom"));
    }
  });
  run.heroes.forEach(soloCheck);
  B.foes.forEach(f=>{ f.air=0; f.weakAtk=0;
    if(f.thornTurn>0&&--f.thornTurn<=0){ f.thorn=0;
      say(`${f.name}의 사슬이 늘어집니다 — 가시가 풀렸습니다.`,"t2") }
    if(f.deb){ ["atkDn","magDn","defDn"].forEach(k=>{ if(f.deb[k]>0) f.deb[k]-- });
      if(!f.deb.fear){ f.fearSrc=null; f.fearName=null } }
    if(f.burn){                       /* 노트 : 턴 종료시 중첩 1 감소 */
      if(f.alive) hurt(f,f.burn,"화상","mag");
      f.burn=Math.max(0,f.burn-1);
    }
    if(f.alive&&f.infect){
      const inv=run.heroes.find(x=>x.name==="인비디아"&&x.slot>0);
      const v=1+(inv?inv.mag:0)+(inv?(inv.tag.plaguePlus||0):0);
      hurt(f,v,"감염","mag"); if(f.alive) f.infect--;
    } });
  (B.portals||[]).forEach(p=>{
    if(p.side!=="mine") return;
    const a=unitAt(p.slot);
    if(a) a.shield+=p.shield;
  });
  /* 회오리 장막의 누적은 전투 내내 이어진다 — 턴마다 지우지 않는다 */
  run.heroes.forEach(h=>{
    if(h.name==="헥토"&&h.tag.allyTwice&&h.slot>0){
      const v=(h.tag.allyShield||2)+h.def;
      onField().forEach(a=>{ if(a===h) return;
        if(h.tag.allyEsh) a.eshield=(a.eshield||0)+v; else a.shield+=v });
    } });
  rollIntents(); keepSel();
  say(`— ${B.turn}턴 시작 —`,"t1");
  /* 적의 행동 연출이 다 흐른 뒤에 알린다 — 그래야 '내 차례'가 명확하다 */
  const banner=Math.min(2400,Math.max(240,fxDuration()+200));
  checkEnd(); render();
  if(!B.over) setTimeout(()=>{
    if(B&&!B.over&&!B.busy&&view==="battle") turnBanner();
  },banner);
}
function checkEnd(){
  if(run&&run.sandbox) return;
  if(B.over) return;
  if(!B.foes.some(f=>f.alive)){
    B.over=1;
    const exp=B.foes.reduce((a,f)=>a+f.exp,0);
    fx({s:"win",gap:0});
    veil("radial-gradient(circle,rgba(201,162,39,.4),transparent 70%)");
    say(`승리! 경험치 ${exp}`,"t1");
    liveMins().filter(m=>m.revive).forEach(m=>{
      const t=run.heroes.find(x=>x.name===m.owner);
      if(t&&t.hp<=0){
        if(t.tag&&t.tag.reviveGain){ t.maxHp+=20; t.atk+=4;
          say(`영광스러운 귀환 — ${t.name}의 최대 체력 +20, 공격력 +4`,"t1") }
        t.hp=t.maxHp; t.down=0;
        say(`망자의 육체 — ${t.name}${jo(t.name,"ig")} 되살아납니다.`,"t1") }
    });
    B.mins=[];
    /* 전투 단위 몫(clearTmp)과 전장의 승자는 여기서 손대지 않는다.
       여기는 '라운드' 가 끝난 자리다. 전투가 정말 끝났는지는 afterWave 가 안다. */
    giveExp(exp,run.heroes.filter(h=>h.slot>0&&h.hp>0));
    /* 우두머리는 격파 연출이 다 끝난 뒤에 보상으로 넘어간다 */
    setTimeout(afterWave, B.kind==="boss"?3300:800);
  }
}
/* 전투 하나가 정말 끝났을 때 — 라운드가 아니라 전투 단위로 셈하는 것들 */
function battleWon(){
  run.heroes.forEach(clearTmp);
  run.heroes.forEach(h=>{
    if(h.name!=="나이코스") return;
    const cap=h.tag.winCap||2;
    if(h.tag.winGold) run.gold+=h.tag.winGold;
    if(h.wins<cap){ h.wins++; h.atk++ }
    else {
      run.gold+=1; say("전장의 승자 — 넘친 몫이 금화 1로 바뀝니다.","t2");
      /* 공격력을 더 얻을 수 없을 때 대신 받는 것들 */
      if(h.tag.winHp&&(h.winHp||0)<10){
        h.winHp=(h.winHp||0)+1; h.maxHp++; h.hp++;
        say(`전장의 지배자 — 최대 체력 +1 (${h.winHp}/10)`,"t2");
      }
      if(h.tag.winExp){
        h.exp+=h.tag.winExp;
        say(`전투 경험 — ${h.name} 경험치 +${h.tag.winExp}`,"t2");
      }
    }
  });
}
function afterWave(){
  const d=run.dun;
  if(!d){ battleWon(); backToMap(); return }
  if(d.wave<d.waves){ view="wavegap"; render(); return }
  battleWon();
  dungeonCleared();
}

  });
  wrap.appendChild(r3);

  const out=el(`<div style="margin-top:26px"><button class="go">닫기</button></div>`);
  out.querySelector("button").onclick=()=>{ view=run.bagBack||"map"; render() };
  wrap.appendChild(out);
}
function pickWeighted(pool,n){
  const out=[], p=pool.slice();
  while(out.length<n&&p.length){
    const tot=p.reduce((a,r)=>a+(r.w==null?1:r.w),0);
    let x=Math.random()*tot, k=0;
    for(;k<p.length;k++){ x-=(p[k].w==null?1:p[k].w); if(x<=0) break }
    if(k>=p.length) k=p.length-1;
    out.push(p.splice(k,1)[0]);
  }
  return out;
}
/* 그림 하나 — 새로 받은 아이콘이 있으면 그것을 쓴다 */
function iconImg(id){
  const u=(typeof ICON_PNG!=="undefined")&&ICON_PNG[id];
  return u?'<img class="ricon" src="'+u+'" alt="" draggable="false">':"";
}
function rewardIcon(r){
  if(r&&r.g&&PX_ITEM&&(r.st||r.bt||r.rc||["파편","일반","희귀","특수","전설"].indexOf(r.g)>=0))
    return itemIcon(r);
  if(r&&r.n&&typeof REW_ICON!=="undefined"){
    const k=rwKey(r);
    const id=(r.own&&HERO_ICON[r.own+"|"+k])||REW_ICON[k];
    const im=id?iconImg(id):"";
    if(im) return im;
  }
  return rewardIcon0(r);
}
const GCLS={"하급":"g1","중급":"g2","상급":"g3","파편":"g4","일반":"g5","희귀":"g6","특수":"g7","전설":"g8"};
const gcls=g=>" "+(GCLS[g]||"g0");
function rewardIcon0(r){
  const t=(r.n||"")+" "+(r.d||"");
  const has=w=>t.indexOf(w)>=0;
  let k="star", c="#c9a227";
  if(has("최대 체력")||has("체력")){ k="hp"; c="#7fd39a" }
  if(has("보호막")||has("보호력")||has("갑피")){ k="def"; c="#e0c85a" }
  if(has("마법력")){ k="mag"; c="#6aa8e0" }
  if(has("공격력")||has("피해")){ k="atk"; c="#e0705a" }
  if(has("추진력")||has("이동")){ k="move"; c="#5fd8cf" }
  if(has("마나")){ k="mana"; c="#5f8fe0" }
  if(has("카드")){ k="card"; c="#a06ae0" }
  const g={
   hp  :'<path d="M32 54 C32 54 8 38 8 22 A12 12 0 0 1 32 18 A12 12 0 0 1 56 22 C56 38 32 54 32 54 Z" fill="@"/>',
   def :'<path d="M32 8 L54 16 v16 c0 13-9 22-22 26 C19 54 10 45 10 32 V16 Z" fill="none" stroke="@" stroke-width="5"/>',
   mag :'<path d="M32 6 C38 30 34 26 58 32 C34 38 38 34 32 58 C26 34 30 38 6 32 C30 26 26 30 32 6 Z" fill="@"/>',
   atk :'<path d="M42 12 l10 10 l-24 24 l-10 -10 z" fill="@"/><path d="M14 44 l6 6 l-9 3 z" fill="@"/>',
   move:'<path d="M12 12 L30 32 L12 52 L20 52 L38 32 L20 12 Z M32 12 L50 32 L32 52 L40 52 L58 32 L40 12 Z" fill="@"/>',
   mana:'<path d="M32 8 C32 8 12 30 12 40 a20 20 0 0 0 40 0 C52 30 32 8 32 8 Z" fill="@"/>',
   card:'<rect x="14" y="12" width="36" height="42" rx="5" fill="none" stroke="@" stroke-width="5"/><path d="M24 28h16M24 40h10" stroke="@" stroke-width="4"/>',
   star:'<path d="M32 8 L40 26 L60 28 L45 42 L49 60 L32 50 L15 60 L19 42 L4 28 L24 26 Z" fill="@"/>'
  }[k];
  return '<svg viewBox="0 0 64 64">'+g.split("@").join(c)+'</svg>';
}
/* 카드 그림 — 아이콘 표에 그림이 있으면 그것, 없으면 기본 도형 */
function cardArt(name){
  { const set=(typeof PNG_SPRITE!=="undefined")&&PNG_SPRITE[name];
    if(set&&set.idle) return '<img class="ricon" src="'+set.idle.u+'" alt="" draggable="false">'; }
  const id=(typeof CARD_ICON!=="undefined")&&CARD_ICON[name];
  const im=id?iconImg(id):"";
  if(im) return im;
  return rewardIcon0({n:name,d:(CARD_LIB[name]&&CARD_LIB[name].d)||""});
}
function unlockBanner(h,i){
  const sk=h.sk[i];
  const ubl=richLive(h,sk,SKILL_FULL[sk.n]||SKILL_TEXT[sk.n]||sk.d||"");
  SFX.play("unlock");
  setTimeout(()=>{
    const box=document.querySelector(".unlock");
    if(!box) return;
    const r=box.getBoundingClientRect();
    const p={x:r.left+r.width/2,y:r.top+r.height/2};
    sparks(p,"#ffe08a",18);
    at(spawn('<div class="ring" style="border-color:#ffd45e"></div>'),p);
    veil("radial-gradient(circle,rgba(201,162,39,.35),transparent 70%)");
  },120);
  return el(`<div class="unlock">
    <div class="ub-rays"></div>
    <div class="ub-tag">${i===3?"궁 극 기 해 제":"새 기 술 해 제"}</div>
    <div class="ub-i">${rewardIcon({n:sk.n,d:sk.d||""})}</div>
    <div class="ub-n">${esc(sk.n)}</div>
    <div class="ub-c">${sk.costType==="mom"?ic("move"):sk.costType==="scale"?"비늘 ":ic("mana")}${sk.cost} · ${esc(sk.el)}${sk.limit?` · 사용한도 ${sk.limit}`:""}</div>
    <div class="ub-v">${valueLinesStatic(h,sk,ubl.done).join(" · ")}</div>
    <div class="ub-d">${ubl.html}</div>
    ${sk.alt?`<div class="ub-d" style="color:var(--faint)">전환 : ${esc(sk.alt.n)} — ${rich(SKILL_FULL[sk.alt.n]||SKILL_TEXT[sk.alt.n]||sk.alt.d||"")}</div>`:""}
  </div>`);
}
function heroPanel(h){
  const box=el(`<div class="hpanel"></div>`);
  box.appendChild(el(`<div class="hp-top">
    <div class="art">${figure(h.name)}</div>
    <div><b>${esc(h.name)}</b><small>${esc(h.title||"")}</small>
      <small>Lv.${h.lv} · 경험치 ${h.exp}/${needExp(h.lv)}</small></div></div>`));
  const pct=Math.min(100,Math.round(h.exp/needExp(h.lv)*100));
  box.appendChild(el(`<div class="bar" style="margin-top:8px"><i style="width:${pct}%"></i></div>`));
  box.appendChild(el(`<div class="hp-stats">
    <span>${ic("hp")} ${h.hp}/${h.maxHp}</span>
    <span>${ic("mana")} ${h.maxMana}</span>
    <span>${ic("atk")} ${h.atk}</span>
    <span>${ic("mag")} ${h.mag}</span>
    <span>${ic("def")} ${h.def}</span>
  </div>`));
  const inf=PASSIVE_INFO[h.name]||[];
  if(inf.length){
    box.appendChild(el(`<div class="hp-h">지속</div>`));
    inf.forEach(p=>box.appendChild(el(`<div class="hp-sk">
      <b>${esc(p.n)}</b><small>${icoify(p.d(h))}</small></div>`)));
  }
  box.appendChild(el(`<div class="hp-h">기술</div>`));
  h.sk.forEach((sk,i)=>{
    const locked=(i===2&&h.lv<UNLOCK[2])||(i===3&&h.lv<UNLOCK[3]);
    const cost=sk.costType==="mom"?ic("move")+sk.cost
      :sk.costType==="scale"?"비늘"+sk.cost:ic("mana")+sk.cost;
    box.appendChild(el(`<div class="hp-sk ${locked?"lk":""}">
      <b>${i+1}. ${esc(sk.n)}</b>
      <span class="c">${cost} · ${esc(sk.el)}${sk.limit?` · 한도 ${sk.limit}`:""}</span>
      ${locked?`<small style="color:var(--faint)">${UNLOCK[i]}레벨에 해제됩니다.</small>`
        :`<small>${richLive(h,sk,SKILL_TEXT[sk.n]||sk.d||"").html}</small>
          ${valueLinesStatic(h,sk,richLive(h,sk,SKILL_TEXT[sk.n]||sk.d||"").done)
              .map(x=>`<small class="v">${x}</small>`).join("")}
          ${SKILL_FULL[sk.n]?`<div class="fullx"><span>기획 원문</span>${richLive(h,sk,SKILL_FULL[sk.n]).html}</div>`:""}`}
      ${sk.alt?`<small style="color:var(--faint)">전환 : ${esc(sk.alt.n)}</small>`:""}
    </div>`));
  });
  const list=takenList(h);
  const keep=list.filter(x=>REW_KEEP.indexOf(x.k)>=0);
  const show=REW_ALL?list:keep;
  const hd=el(`<div class="hp-h hp-hb">
    <span>전투 보상 ${keep.length}개</span>
    ${list.length>keep.length||REW_ALL
      ? `<button class="rwall">${REW_ALL?"전투 보상만 보기":`모두 보기 ${list.length}개`}</button>` : ""}
  </div>`);
  const rb=hd.querySelector(".rwall");
  if(rb) rb.onclick=ev=>{ ev.stopPropagation(); REW_ALL=REW_ALL?0:1; render() };
  box.appendChild(hd);
  if(!show.length) box.appendChild(el(`<p class="hint" style="font-size:11px">${
    list.length?"전투에 쓰이는 보상은 아직 없습니다. [모두 보기]로 나머지를 봅니다."
               :"아직 고른 보상이 없습니다."}</p>`));
  else box.appendChild(el(`<div class="hp-tr">${show.map(x=>
      `<div class="tr1"><b>${esc(x.n)}</b>
        <span class="g2">${x.r?esc(x.r.g):""}${x.mine?" · 전용":""}${
          REW_ALL?" · "+esc(x.k):""}</span>
        ${x.r?`<small>${rich(x.r.d)}</small>`:""}${x.r?rewCondHtml(x.r):""}</div>`).join("")}</div>`));
  if(h.items&&h.items.length){
    box.appendChild(el(`<div class="hp-h">장비</div>`));
    box.appendChild(el(`<div class="hp-tk">${h.items.map(t=>
      `<span title="${esc(itemTip(t))}">${esc(t.n)}</span>`).join("")}</div>`));
  }
  return box;
}
/* 전투 밖에서도 쓸 수 있는 수치 요약 */
function valueLinesStatic(h,sk,done){
  const L=[]; const had=done||{};
  if(sk.dmg!=null&&!sk.justice&&!had.dmg) L.push(`피해 ${numHtml(h,sk,"dmg")}`);
  if(sk.shield&&!had.shield) L.push(`보호막 ${numHtml(h,sk,"shield")}`);
  if(sk.heal&&!had.heal) L.push(`회복 ${numHtml(h,sk,"heal")}`);
  return L;
}
/* 지금 이 대원이 다음 레벨까지 얼마나 왔는지 */
function expBar(h){
  if(!h) return "";
  const need=needExp(h.lv), pct=Math.min(100,Math.round(h.exp/need*100));
  return `<div class="expwrap"><div class="expn">${esc(h.name)} — Lv.${h.lv}</div>
    <div class="expbar"><i style="width:${pct}%"></i></div>
    <div class="expv">${h.exp}/${need}</div></div>`;
}
/* 보상 카드를 고를 때 — 등급이 높을수록 요란하게 */
function pickBurst(card,grade){
  const lv={"하급":1,"중급":2,"상급":3}[grade]||1;
  SFX.play("pick"+lv);
  card.classList.add("taken","g"+lv);
  const r=card.getBoundingClientRect();
  const p={x:r.left+r.width/2, y:r.top+r.height/2};
  const col={1:"#9c8d77",2:"#e0a86a",3:"#e0705a"}[lv];
  at(spawn('<div class="ring" style="border-color:'+col+'"></div>'),p);
  sparks(p,col,6+lv*7);
  if(lv>=2) setTimeout(()=>{
    at(spawn('<div class="ring" style="border-color:#ffd45e"></div>'),p); sparks(p,"#ffe08a",8);
  },140);
  if(lv>=3){
    veil("radial-gradient(circle,rgba(224,112,90,.34),transparent 70%)");
    const f=document.querySelector(".rewards");
    if(f){ f.classList.remove("shakeall"); void f.offsetWidth; f.classList.add("shakeall") }
    for(let i=0;i<10;i++) setTimeout(()=>{
      const a2=Math.random()*Math.PI*2, d=60+Math.random()*70;
      const sp=spawn('<div class="spark" style="background:#ffd45e;width:5px;height:5px"></div>');
      if(sp){ at(sp,p); sp.style.setProperty("--dx",(Math.cos(a2)*d)+"px");
              sp.style.setProperty("--dy",(Math.sin(a2)*d)+"px") }
    },i*32);
  }
  const w=spawn('<div class="pickword" style="color:'+col+'">'+esc(grade)+' 획득</div>');
  if(w){ w.style.left=p.x+"px"; w.style.top=(p.y-14)+"px" }
}
/* 이 보상 자리가 '판 자원 보상을 빼야 하는' 자리인가 */
function noRunRes(){
  if(!pending) return false;
  if(pending.noRun) return true;
  const cur=pending.queue&&pending.queue[pending.idx];
  return !!(cur&&cur.noRun);
}
function offerCards(app,hero,grade,done,lvUp){
  const own=(HERO_REWARDS[hero.name]||[]).filter(r=>r.g===grade&&rewardOk(hero,r));
  let com=COMMON.filter(r=>r.g===grade&&rewardOk(hero,r));
  /* 맞춤 갑옷 — 다음 몇 번의 레벨업 보상은 전용만 나온다.
     전용이 하나도 없는 대원이면 몫을 축내지 않고 그냥 넘어간다. */
  const ownOnly=!!(lvUp&&run.ownOnly>0&&own.length);
  if(ownOnly) com=[];
  if(noRunRes()){
    const cut=com.filter(r=>!r.rr);
    /* 걸러내고도 고를 게 남아 있을 때만 걸러 준다 */
    if(own.length+cut.length>=3) com=cut;
  }
  const pool=own.concat(com);
  /* 지도를 보고 돌아오는 등으로 화면을 다시 그려도 고를 것이 바뀌면 안 된다.
     보상 객체에는 함수가 들어 있어 저장에 담을 수 없으므로 '등급|이름' 만 적어 둔다. */
  const pkey=hero.name+"|"+grade+"|"+((pending&&pending.idx!=null)?pending.idx:"f");
  let picks=null;
  if(pending&&pending.pickKey===pkey&&pending.picks){
    const got=pending.picks.map(k=>pool.find(r=>rwKey(r)===k)).filter(Boolean);
    if(got.length===pending.picks.length) picks=got;
  }
  if(!picks){
    picks=pickWeighted(pool,3);
    if(pending){ pending.pickKey=pkey; pending.picks=picks.map(rwKey) }
  }
  const row=el(`<div class="rewards"></div>`);
  picks.forEach(r=>{
    const mine=own.includes(r);
    const c=el(`<div class="rw rwpick${gcls(r.g)}${mine?" own":""}">${
      mine?`<span class="ownmark">전용</span>`:""}<div class="rwi">${rewardIcon(r)}</div>
      <b>${esc(r.n)}</b>
      <div class="rwd"><p>${rich(r.d)}</p></div>${rewCondHtml(r)}
      <div class="rwft"><span class="gd">${esc(r.g)}</span>
        <span class="ow${mine?" mine":""}">${mine?"전용":"공용"}</span></div>
    </div>`);
    c.onclick=()=>{
      if(c.classList.contains("taken")) return;
      pickBurst(c,r.g);
      if(ownOnly) run.ownOnly=Math.max(0,(run.ownOnly||0)-1);
      row.querySelectorAll(".rw").forEach(x=>{ if(x!==c) x.classList.add("faded") });
      r.fx(hero,r.n);
      hero.tag.taken=(hero.tag.taken||[]).concat(r.n);
      hero.tag.tk=(hero.tag.tk||[]).concat(rwKey(r));
      const pts={"하급":1,"중급":3,"상급":5}[r.g]||0;
      if(pts&&run.heroes.some(x=>x.name==="데린저")){
        run.treasure=(run.treasure||0)+pts;
        const d=run.heroes.find(x=>x.name==="데린저");
        const want=Math.floor(run.treasure/5);
        if((d.treaAtk||0)<want){ const add=want-(d.treaAtk||0); d.treaAtk=want; d.atk+=add;
          toast(`보물 사냥꾼 — ${d.name}의 공격력이 ${add} 올랐습니다.`) }
      }
      setTimeout(done,grade==="상급"?820:grade==="중급"?600:460);
    };
    row.appendChild(c);
  });
  app.querySelector(".center").appendChild(row);
  const skip=el(`<div style="text-align:center;margin-top:18px"><button>건너뛰기</button></div>`);
  skip.querySelector("button").onclick=done;
  app.appendChild(skip);
}
txtFixApply();
txtApply();
render();
</script>
