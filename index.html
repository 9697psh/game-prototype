<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>균열 — 시험판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&display=swap">
<style>
:root{
  --ink:#14110e; --panel:#1c1815; --raise:#252019; --rule:#3a3128; --rule2:#4a3e31;
  --fg:#e7dcc8; --dim:#9c8d77; --faint:#6d6252;
  --brass:#c9a227; --blood:#8e2b2b;
  --atk:#e0705a; --mag:#6aa8e0; --def:#e0c85a; --hp:#7fd39a; --move:#5fd8cf; --mana:#5f8fe0;
  --warn:#e0a86a; --serif:"Noto Serif KR",serif;
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--sans);font-size:14px;
  line-height:1.6;-webkit-user-select:none;user-select:none}
button{font-family:inherit;font-size:inherit;color:var(--fg);background:var(--raise);
  border:1px solid var(--rule);border-radius:3px;padding:7px 13px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--brass);color:var(--brass)}
button:disabled{opacity:.35;cursor:default}
button.go{background:var(--brass);color:#17130f;border-color:var(--brass);font-weight:700}
button.go:hover{color:#17130f;filter:brightness(1.1)}
.ic{width:1.05em;height:1.05em;vertical-align:-.18em;fill:currentColor}
.grow{flex:1}

header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:9px 16px;
  background:var(--panel);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:30}
h1{font-family:var(--serif);font-size:15px;letter-spacing:.16em;color:var(--brass);margin:0;white-space:nowrap}
.stat{display:inline-flex;align-items:center;gap:5px;font-size:13px}
.wrap{max-width:1240px;margin:0 auto;padding:16px}

/* ── 전장 ── */
.field{display:flex;justify-content:center;align-items:stretch;gap:10px;
  overflow-x:auto;padding-bottom:4px}
.side{display:flex;gap:6px;flex:0 0 auto}
/* 아군·적군 모두 왼쪽에서부터 1~5 */
.mid{width:2px;background:var(--rule);align-self:stretch;min-height:230px;flex:0 0 auto}
.slot{width:100px;flex:0 0 100px;min-width:0;overflow:hidden;border:1px solid var(--rule);border-radius:5px;background:var(--panel);
  padding:7px;display:flex;flex-direction:column;gap:5px;position:relative;min-height:176px}
.slot.empty{background:#181512;border-style:dashed;opacity:.55}
.slot.pick{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.slot.drop{border-color:var(--hp);box-shadow:0 0 0 1px var(--hp) inset;opacity:1}
.slot.far{opacity:.3;filter:grayscale(.7);cursor:default}
.slot.far .no{color:var(--faint)}
.reach{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:9.5px;
  color:var(--faint);pointer-events:none}
.slot.pick .reach{color:var(--brass)}
.slot .no{position:absolute;top:-9px;left:7px;background:var(--ink);border:1px solid var(--rule);
  border-radius:3px;font-size:10px;padding:0 6px;color:var(--faint)}
.slot.pick .no{color:var(--brass);border-color:var(--brass)}
.res{display:flex;gap:4px;align-items:center;justify-content:center;min-height:13px;flex-wrap:wrap}
.pips{display:inline-flex;gap:3px;align-items:center}
.pips i{width:7px;height:7px;border-radius:50%;border:1px solid var(--rule2);display:inline-block}
.pips i.on{background:var(--mana);border-color:#8fb4ef;box-shadow:0 0 5px rgba(95,143,224,.75)}
.res .rr{font-size:10px;color:var(--move);display:inline-flex;align-items:center;gap:2px}
.res .rr.es{color:var(--def)}
.res .rr.mn2{color:var(--mana)}
.res .rr.am{color:#e0a86a} .res .rr.sc{color:#9ad06a} .res .rr.dk{color:#a06ae0}
.res .rr.tn{color:#e08ac0} .res .rr.so{color:#8fb4ef}
.art{height:56px;display:flex;align-items:flex-end;justify-content:center}
.art svg{height:56px;width:auto}
.nm{font-size:12px;font-weight:700;line-height:1.25;word-break:keep-all;text-align:center}
.bar{height:5px;background:#0f0d0b;border-radius:3px;overflow:hidden}
.bar{position:relative}
.bar > i{display:block;height:100%;background:var(--hp);transition:width .18s}
.bar.mn > i{background:var(--mana)}
.bar > u{position:absolute;top:0;right:0;height:100%;background:var(--def);opacity:.9;
  border-left:1px solid var(--panel);transition:width .18s,right .18s}
.bar > u.es{background:#e07b28;opacity:.95;box-shadow:0 0 6px rgba(224,123,40,.6)}
.shd{color:var(--def);font-weight:700;white-space:nowrap}
.esh{color:#e07b28;font-weight:700;white-space:nowrap}
.mini{font-size:10.5px;color:var(--dim);display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center}
.chip{font-size:10px;border:1px solid var(--rule2);border-radius:2px;padding:0 4px;color:var(--dim)}
.chip.on{color:var(--brass);border-color:#5c4a1f}
.chip.deb{color:#e08a8a;border-color:#5a3030}
.chip.itm2{color:#9ecbf5;border-color:#33506b}
.intent{font-size:11px;display:inline-flex;align-items:center;gap:3px;border:1px solid var(--rule2);
  border-radius:3px;padding:0 5px;background:var(--raise)}

.skwrap{margin-top:12px;background:var(--panel);border:1px solid var(--brass);border-radius:6px;padding:10px}
.skhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.skhead b{font-family:var(--serif);font-size:14px;color:var(--brass)}
.skills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sk{display:flex;gap:7px;align-items:flex-start;min-width:0;padding:8px 9px;border-radius:4px;
  border:1px solid var(--rule);background:var(--raise);cursor:pointer}
.sk:hover{border-color:var(--brass)}
.sk.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.sk.off{opacity:.4;cursor:default}
.sk.off:hover{border-color:var(--rule)}
.sk .k{font-size:10px;color:#17130f;background:var(--rule2);border-radius:2px;padding:0 5px;
  font-weight:700;flex:none;margin-top:2px}
.sk.on .k{background:var(--brass)}
.sk .t{flex:1;min-width:0}
.sk .t b{font-size:12.5px}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.opt .ogo{margin-top:6px;align-self:flex-start}
.opt{background:#221d16;border:1px solid var(--rule2);border-radius:5px;padding:8px 10px;cursor:pointer}
.opt:hover{border-color:var(--brass);background:var(--raise)}
.opt.on{border-color:var(--brass)}
.opt b{font-size:12px}
.opt span{font-size:10px;color:var(--faint);margin-left:5px}
.opt small{display:block;font-size:10.5px;color:var(--dim);line-height:1.45;margin-top:3px;word-break:keep-all}
.chip.pk{color:#a8f0ea;border-color:#2f5c58}
.sk .xn{margin-left:5px;background:var(--brass);color:#17130f;border-radius:3px;padding:0 6px;font-size:11.5px;font-weight:700}
.sk .t .val{display:block;font-size:11.5px;color:var(--fg);margin-top:3px;line-height:1.5}
.sk .t .val .big{color:var(--brass);font-size:13px}
.sk .t .brk{color:var(--faint);font-size:10px}
.fullx{margin-top:6px;padding:6px 8px;background:#191612;border:1px solid var(--rule);
  border-left:2px solid var(--brass);border-radius:4px;font-size:10.5px;color:var(--dim);
  line-height:1.6;white-space:pre-wrap;word-break:keep-all}
.kw{font-weight:600}
.fullx u{text-decoration:underline;text-underline-offset:2px}
.fullx i{font-style:italic}
.fullx span.kw{display:inline;font-size:inherit;letter-spacing:0;margin:0}
.fullx span{display:block;font-size:9px;letter-spacing:.14em;color:var(--faint);margin-bottom:3px}
button.dtl{padding:3px 10px;font-size:11.5px}
.sk .t small{display:block;color:var(--dim);font-size:10.5px;line-height:1.45;margin-top:4px;word-break:keep-all;overflow-wrap:anywhere}
.counts{display:flex;gap:4px;flex-wrap:wrap;padding-top:9px;margin-top:9px;
  border-top:1px solid var(--rule);align-items:center}
.counts button{padding:2px 10px;font-size:12px}
.prog{margin-top:4px}
.prog .pl{font-size:9.5px;color:var(--faint);display:flex;justify-content:space-between;gap:4px;white-space:nowrap;overflow:hidden}
.prog .pl span:first-child{overflow:hidden;text-overflow:ellipsis;min-width:0}
.prog .pl span:last-child{flex:0 0 auto}
.prog .pb{height:4px;background:#0f0d0b;border-radius:2px;overflow:hidden;margin-top:1px}
.prog .pb>i{display:block;height:100%;background:var(--brass);transition:width .2s}
.prog.done .pl{color:var(--hp)}
.prog.done .pb>i{background:var(--hp)}
.passes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:9px}
.pass{background:#1a1713;border:1px solid var(--rule);border-radius:4px;padding:8px 10px}
.pass .pn{font-size:11.5px;font-weight:700;color:var(--brass)}
.pass .pd{font-size:10.5px;color:var(--dim);line-height:1.5;margin-top:3px;word-break:keep-all}
.pass .pd b{color:var(--fg);font-size:12px}
.pass .pd span.brk{color:var(--faint);font-size:10px}
@media(max-width:760px){ .passes{grid-template-columns:1fr} }
.stats{font-size:10.5px;color:var(--dim);display:flex;flex-wrap:wrap;gap:5px;justify-content:center}

/* ── 손패 ── */
.hand{margin-top:14px;display:flex;gap:9px;flex-wrap:wrap;align-items:flex-start;min-height:10px}
.card{width:118px;border:1px solid var(--rule2);border-radius:6px;background:var(--panel);
  padding:8px;cursor:grab;touch-action:none;position:relative}
.card:hover{border-color:var(--brass)}
.card.hero{border-color:#3d7a72}
.card .ct{font-size:11.5px;font-weight:700;text-align:center;margin-bottom:4px}
.card .cd{font-size:10.5px;color:var(--faint);line-height:1.4}
.card .art{height:44px}
.card .art svg{height:44px}
.ghost{position:fixed;z-index:999;pointer-events:none;opacity:.9;transform:translate(-50%,-50%)}

.prompt{margin-top:14px;background:var(--panel);border:1px solid var(--rule);border-radius:5px;
  padding:9px 13px;font-size:13px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.step{font-size:11px;border:1px solid var(--rule2);border-radius:99px;padding:1px 9px;color:var(--faint)}
.step.on{color:#17130f;background:var(--brass);border-color:var(--brass);font-weight:700}
.hint{color:var(--dim);font-size:12.5px}
.log{margin-top:12px;background:var(--panel);border:1px solid var(--rule);border-radius:5px;
  padding:9px 13px;height:168px;overflow:auto;font-size:12.5px;line-height:1.65}
.log div{border-bottom:1px solid #241f19;padding:1px 0}
.log .t1{color:var(--brass)} .log .t2{color:var(--dim)} .log .t3{color:var(--warn)}

/* ── 화면 ── */
.center{max-width:900px;margin:40px auto;text-align:center}
.title{font-family:var(--serif);font-size:30px;color:var(--brass);letter-spacing:.2em}
.sub{color:var(--dim);margin-top:6px}
.picks{display:flex;gap:14px;justify-content:center;margin-top:28px;flex-wrap:wrap}
.pick{width:230px;background:var(--panel);border:1px solid var(--rule);border-radius:7px;
  padding:14px;cursor:pointer;text-align:left}
.pick:hover{border-color:var(--brass)}
.pick .art{height:78px} .pick .art svg{height:78px}
.pick h3{margin:8px 0 2px;font-size:15px;font-family:var(--serif)}
.pick .role{color:var(--brass);font-size:11.5px;letter-spacing:.06em}
.pick p{color:var(--dim);font-size:12px;margin:8px 0 0;line-height:1.55}

.mapwrap{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.node{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--rule);
  border-radius:6px;padding:11px 14px}
.node.now{border-color:var(--brass)}
.node.done{opacity:.45}
.node .tag{font-size:11px;border:1px solid var(--rule2);border-radius:3px;padding:1px 7px;color:var(--dim);flex:none}
.node .tag.b{color:var(--atk);border-color:#5a3030}
.roster{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px}
.rost{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;
  display:flex;gap:9px;align-items:center;min-width:186px}
.rost .art{height:44px} .rost .art svg{height:44px}
.rost b{font-size:12.5px}
.rost small{display:block;color:var(--dim);font-size:11px}
.rewards{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.rw{width:196px;min-height:250px;background:linear-gradient(180deg,#221c2e,#191622);
  border:1px solid #4a3f63;border-radius:10px;padding:16px 14px;cursor:pointer;
  text-align:center;display:flex;flex-direction:column;align-items:center;
  box-shadow:0 6px 18px rgba(0,0,0,.4)}
.rw:hover{border-color:#a88fe0;box-shadow:0 6px 22px rgba(140,110,220,.28)}
.rw.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.rw .rwi{width:76px;height:76px;margin:2px auto 10px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,#332b47,transparent 70%);border-radius:50%}
.rw .rwi svg{width:56px;height:56px}
.rw b{font-size:14px;font-family:var(--serif);letter-spacing:.02em}
.rw p{color:var(--dim);font-size:11.5px;margin:8px 0 0;line-height:1.6;word-break:keep-all}
.rw .g{font-size:10.5px;color:#b9a2ea;letter-spacing:.06em;margin-bottom:2px}
.rw .rcp{font-size:10px;color:#8f86a8;margin:7px 0 0;line-height:1.5;
  border-top:1px solid #372f4d;padding-top:6px;width:100%;word-break:keep-all}
.rcp:nth-of-type(n+2){border-top:0;padding-top:2px}
.unlock{position:relative;overflow:hidden;margin:22px auto 4px;max-width:520px;
  background:linear-gradient(180deg,#2b2415,#1b1710);
  border:1px solid var(--brass);border-radius:12px;padding:22px 24px 20px;
  box-shadow:0 0 40px rgba(201,162,39,.28);animation:ubIn .55s cubic-bezier(.2,1.2,.4,1)}
@keyframes ubIn{0%{opacity:0;transform:scale(.82) translateY(14px)}100%{opacity:1;transform:none}}
.ub-rays{position:absolute;inset:-60%;pointer-events:none;opacity:.22;
  background:repeating-conic-gradient(from 0deg,rgba(255,214,110,.85) 0deg 5deg,transparent 5deg 16deg);
  animation:ubSpin 14s linear infinite;mask-image:radial-gradient(circle,#000 10%,transparent 62%);
  -webkit-mask-image:radial-gradient(circle,#000 10%,transparent 62%)}
@keyframes ubSpin{to{transform:rotate(360deg)}}
.ub-tag{position:relative;font-size:11px;letter-spacing:.34em;color:var(--brass);text-align:center}
.ub-i{position:relative;width:84px;height:84px;margin:10px auto 6px;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,rgba(201,162,39,.28),transparent 70%);border-radius:50%;
  animation:ubPulse 2.2s ease-in-out infinite}
.ub-i svg{width:60px;height:60px}
@keyframes ubPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.ub-n{position:relative;text-align:center;font-family:var(--serif);font-size:22px;color:#ffe08a;
  text-shadow:0 0 18px rgba(201,162,39,.55)}
.ub-c{position:relative;text-align:center;font-size:11.5px;color:var(--dim);margin-top:3px}
.ub-v{position:relative;text-align:center;font-size:13px;color:var(--fg);margin-top:8px}
.ub-d{position:relative;text-align:center;font-size:12px;color:var(--dim);
  line-height:1.6;margin-top:8px;word-break:keep-all}
.peek{position:fixed;inset:0;z-index:400;background:rgba(10,8,7,.82);
  display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;
  animation:pkIn .16s ease-out}
@keyframes pkIn{from{opacity:0}to{opacity:1}}
.peekbox{background:var(--panel);border:1px solid var(--rule2);border-radius:10px;
  padding:16px 18px;max-width:760px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.peekhead{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.peekgrid{max-width:100%;margin-top:10px}
.peekgrid .cell{cursor:default}
.peekgrid .cell:hover{border-color:var(--rule)}
.peekgrid .cell.here{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.hpanel{position:fixed;right:16px;top:64px;width:308px;max-height:calc(100vh - 84px);
  overflow-y:auto;background:var(--panel);border:1px solid var(--rule);border-radius:9px;
  padding:14px;z-index:20;text-align:left}
.hpanel .hp-top{display:flex;gap:10px;align-items:center}
.hpanel .hp-top .art{height:52px} .hpanel .hp-top .art svg{height:52px}
.hpanel .hp-top b{font-family:var(--serif);font-size:14px;color:var(--brass)}
.hpanel .hp-top small{display:block;color:var(--dim);font-size:11px}
.hp-stats{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px;font-size:12px;color:var(--fg)}
.hp-h{font-size:10.5px;color:var(--faint);letter-spacing:.1em;margin:12px 0 5px;
  border-bottom:1px solid var(--rule);padding-bottom:3px}
.hp-sk{background:var(--raise);border:1px solid var(--rule);border-radius:5px;
  padding:7px 9px;margin-bottom:5px}
.hp-sk b{font-size:11.5px}
.hp-sk .c{font-size:10px;color:var(--faint);margin-left:5px}
.hp-sk small{display:block;font-size:10.5px;color:var(--dim);line-height:1.45;margin-top:3px;word-break:keep-all}
.hp-sk small.v{color:var(--fg)}
.hp-sk.lk{opacity:.45}
.hp-tk{display:flex;flex-wrap:wrap;gap:4px}
.hp-tk span{font-size:10px;border:1px solid var(--rule2);border-radius:3px;padding:1px 6px;color:var(--dim)}
.hp-tr{display:flex;flex-direction:column;gap:5px}
.tr1{background:var(--raise);border:1px solid var(--rule);border-radius:5px;padding:6px 9px}
.tr1 b{font-size:11.5px}
.tr1 .g2{font-size:9.5px;color:#b9a2ea;margin-left:5px}
.tr1 small{display:block;font-size:10.5px;color:var(--dim);line-height:1.45;margin-top:2px;word-break:keep-all}
.rost.pick2{cursor:pointer;transition:border-color .12s}
.rost.pick2:hover{border-color:var(--brass)}
.rost.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.rost .more{color:var(--faint);font-size:10px;margin-top:3px}
@media(max-width:1180px){
  .hpanel{position:static;width:auto;max-width:640px;margin:22px auto 0;max-height:none}
}
.gearwrap{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.gearhero{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:12px;width:250px}
.gearhero .gh{display:flex;gap:10px;align-items:center;text-align:left}
.gearhero .gh .art{height:44px} .gearhero .gh .art svg{height:44px}
.gearhero .gh b{font-size:13px}
.gearhero .gh small{display:block;color:var(--dim);font-size:11px}
.gslots{display:flex;gap:6px;margin-top:10px}
.gslot{flex:1;min-width:0;background:var(--raise);border:1px solid var(--rule);border-radius:5px;
  padding:8px 4px;text-align:center;cursor:pointer;min-height:78px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.gslot:hover{border-color:var(--brass)}
.gslot.empty{border-style:dashed;color:var(--faint)}
.gslot.empty span{font-size:10.5px}
.gslot.drop{border-color:var(--hp)}
.gslot.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.gslot .gi{width:30px;height:30px} .gslot .gi svg{width:30px;height:30px}
.gslot b{font-size:10px;line-height:1.25;word-break:keep-all}
.gslot .gg{font-size:9.5px;color:var(--faint)}
.bagwrap{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.bagwrap .gslot{width:104px;flex:0 0 104px}
.rcbook{margin-top:26px;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:14px 16px}
.rcbook h4{margin:0 0 8px;font-family:var(--serif);font-size:13px;color:var(--brass);letter-spacing:.06em}
.rcrow{display:grid;grid-template-columns:150px 1fr 76px;gap:8px;font-size:11.5px;

.rcrow b{color:var(--fg)}

.rw.no{opacity:.4;cursor:default}

.rw.ro.new .g{color:var(--brass)}
.rw.ro:hover{border-color:#4a3f63;box-shadow:0 6px 18px rgba(0,0,0,.4)}
/* ── 이펙트 ── */
#fx{position:fixed;inset:0;pointer-events:none;z-index:900;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font-family:var(--serif);font-weight:700;
  font-size:21px;text-shadow:0 2px 4px #000,0 0 10px #000;animation:pop .95s ease-out forwards}
.pop.dmg{color:var(--atk)} .pop.mag{color:var(--mag)} .pop.heal{color:var(--hp)}
.pop.shd{color:var(--def)} .pop.miss{color:var(--dim);font-size:16px}
.pop.crit{color:#ffd45e;font-size:27px}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}
  18%{opacity:1;transform:translate(-50%,-70%) scale(1.12)}
  32%{transform:translate(-50%,-72%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-150%) scale(.95)}}
.slash{position:absolute;transform:translate(-50%,-50%);width:96px;height:96px;animation:slashA .38s ease-out forwards}
@keyframes slashA{0%{opacity:0;transform:translate(-50%,-50%) rotate(-38deg) scale(.55)}

.swirl{position:absolute;transform:translate(-50%,-50%);width:112px;height:112px;animation:swirlA .6s linear forwards}
@keyframes swirlA{0%{opacity:0;transform:translate(-50%,-50%) rotate(0) scale(.5)}

.ring{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:2px solid;

@keyframes ringA{0%{opacity:.95;width:22px;height:22px}100%{opacity:0;width:128px;height:128px}}
.spark{position:absolute;width:4px;height:4px;border-radius:50%;animation:sparkA .5s ease-out forwards}
@keyframes sparkA{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* ── 필드 격자 ── */
.gridmap{display:grid;gap:4px;margin-top:14px;max-width:640px}
.cell{position:relative;aspect-ratio:1;border:1px solid var(--rule);border-radius:4px;
  background:var(--panel);display:flex;align-items:center;justify-content:center;
  padding:12%;cursor:default;transition:border-color .12s,background .12s}
.cell svg{width:100%;height:100%}
.cell.emp{background:#181512;border-style:dashed;opacity:.45}
.cell.done{opacity:.28}
.cell.adj{cursor:pointer;border-color:var(--rule2);background:#211d17}
.cell.adj:hover{border-color:var(--brass);background:var(--raise)}
.cell.here{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset;opacity:1}
.cell.risk{border-color:#6b2b2b;background:#241416;opacity:.8}
.cell.risk:hover{border-color:var(--blood);background:#301a1c}
.cell.risk::after{content:"";position:absolute;inset:0;border-radius:4px;
  background:radial-gradient(circle at 50% 50%,rgba(142,43,43,.35),transparent 70%)}
.cell .you{position:absolute;bottom:-2px;right:2px;color:var(--brass);font-size:11px}
.cell .cl{position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  font-size:8.5px;background:var(--ink);border:1px solid var(--rule);border-radius:3px;
  padding:0 4px;color:var(--dim);white-space:nowrap;opacity:0;transition:opacity .12s}
.cell:hover .cl{opacity:1;z-index:5}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:16px;height:16px;display:inline-block}
.legend i svg{width:16px;height:16px}
.toast{background:var(--raise);border:1px solid var(--rule2);border-left:3px solid var(--brass);
  border-radius:4px;padding:9px 14px;margin:0 0 12px;font-size:13px}
.rost.down{opacity:.5}
/* ── NPC 화면 (상점 · 미지의 구역) ── */
.npcbox{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start;margin-top:12px}
.npc{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:16px;text-align:center}
.npcface{width:150px;height:150px;margin:0 auto 10px;border-radius:50%;

  border:1px solid var(--rule2);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.npcface svg{height:120px;width:auto;margin-bottom:6px}
.npc b{font-family:var(--serif);font-size:15px;color:var(--brass)}
.npc p{font-size:12px;color:var(--dim);line-height:1.6;margin:8px 0 0;word-break:keep-all}
.shelf .shelfrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:8px}
.choices{display:flex;flex-direction:column;gap:9px;margin-top:8px}
.choice{background:var(--panel);border:1px solid var(--rule);border-radius:6px;
  padding:13px 16px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.choice:hover{border-color:var(--brass)}
.choice b{font-size:13.5px}
.choice span{font-size:11.5px;color:var(--dim)}
.choice.go2{align-items:center;color:var(--brass);border-color:var(--brass);font-weight:700}
.evres{display:flex;gap:14px;align-items:center;background:linear-gradient(180deg,#221c2e,#191622);

.evres .evi{width:52px;height:52px;flex:none} .evres .evi svg{width:52px;height:52px}
.evres b{font-size:11px;color:#b9a2ea;letter-spacing:.08em}
.evres p{margin:4px 0 0;font-size:13.5px;line-height:1.6;word-break:keep-all}
.wheel{border:1px solid var(--rule);border-radius:7px;padding:8px 12px;background:var(--panel)}
.wr{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--faint);padding:3px 0}
.wr i{width:12px;font-style:normal;color:var(--brass)}
.wr.hit{color:var(--brass);font-weight:700}
.wheel.big{padding:14px 16px}
.wheel.big .wr{font-size:13px;padding:7px 0;transition:color .08s}
.wheel.big .wr.hit{color:var(--brass);text-shadow:0 0 10px rgba(201,162,39,.5)}
.wheel.big .wr i{width:16px}
@media(max-width:800px){ .npcbox{grid-template-columns:1fr} }
.trail{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:12px}
.dot{font-size:10.5px;border:1px solid var(--rule2);border-radius:99px;padding:1px 9px;color:var(--faint)}
.dot.b{color:var(--atk);border-color:#5a3030}
.dot.cur{color:var(--brass);border-color:var(--brass);font-weight:700}
.nart{height:52px;display:flex;align-items:center;justify-content:center}
.nart svg{height:52px;width:52px}
.portal{position:absolute;right:3px;top:3px;width:20px;height:20px;opacity:.95}
.slots{display:flex;gap:3px;margin-top:3px;justify-content:center}
.sq{width:12px;height:12px;border:1px solid var(--rule2);border-radius:2px}
.sq.on{background:#6aa8e0;border-color:#6aa8e0}
.itm{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--dim)}
.rw.no{opacity:.4;cursor:default}
.rw.no:hover{border-color:var(--rule)}
/* ── 시그니처 연출 ── */
.sweep{position:absolute;transform:translate(-50%,-50%);width:118px;height:118px;
  opacity:.95;transition:opacity .18s}
.sweep .spin{width:100%;height:100%;animation:spin .32s linear infinite}
.sweep .spin svg{width:100%;height:100%}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.wake{position:absolute;transform:translate(-50%,-50%);width:52px;height:52px;
  animation:wakeA .5s ease-out forwards;opacity:.7}
.wake svg{width:100%;height:100%}
@keyframes wakeA{0%{opacity:.75;transform:translate(-50%,-50%) scale(.6) rotate(0)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.5) rotate(200deg)}}
.shockw{position:absolute;transform:translate(-50%,-50%);border-radius:50%;
  border:3px solid #e0c85a;width:20px;height:20px;animation:shockA .55s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes shockA{0%{opacity:.95;width:20px;height:20px;border-width:5px}
  100%{opacity:0;width:260px;height:150px;border-width:1px}}
.dust{position:absolute;width:5px;height:5px;border-radius:50%;background:#9c8d77;
  animation:dustA .6s ease-out forwards}
@keyframes dustA{0%{opacity:.9;transform:translate(-50%,-50%)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% - var(--dy))) scale(.4)}}
.streak{position:absolute;height:3px;transform-origin:0 50%;border-radius:2px;
  background:linear-gradient(90deg,transparent,#fff6e0,#e0c85a);
  animation:strA .34s ease-out forwards}
@keyframes strA{0%{opacity:0;transform:scaleX(0)}
  25%{opacity:1}100%{opacity:0;transform:scaleX(1)}}
.hidev{position:absolute;transform:translate(-50%,-50%);width:96px;height:96px;border-radius:50%;
  background:radial-gradient(circle,rgba(122,74,176,.55),rgba(20,20,25,.85) 55%,transparent 72%);
  animation:hdv .6s ease-out forwards;pointer-events:none}
@keyframes hdv{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
  35%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.35)}}
.wisp{position:absolute;width:6px;height:10px;border-radius:50%;background:#7a4ab0;
  filter:blur(1px);animation:wsp .62s ease-out forwards;pointer-events:none}
@keyframes wsp{0%{opacity:.9;transform:translate(-50%,-50%)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3)}}
.slot.vanish{animation:vns .6s ease-out}
@keyframes vns{0%{opacity:1}40%{opacity:.15;filter:brightness(.3)}100%{opacity:1}}
.slot.emerge{animation:emg .45s ease-out}
@keyframes emg{0%{opacity:.1;transform:scale(.86)}60%{opacity:1;transform:scale(1.05)}100%{transform:scale(1)}}
.shade{position:absolute;transform:translate(-50%,-50%);width:56px;height:66px;border-radius:26px;
  background:linear-gradient(180deg,rgba(160,106,224,.75),rgba(20,20,26,.9));
  filter:blur(2px);pointer-events:none}
.smoke{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle,rgba(122,74,176,.5),transparent 70%);
  animation:smk .5s ease-out forwards;pointer-events:none}
@keyframes smk{0%{opacity:.85;transform:translate(-50%,-50%) scale(.6)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}
.shmark{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
  width:40px;height:40px;opacity:.7;pointer-events:none;animation:shp 2s ease-in-out infinite}
@keyframes shp{0%,100%{opacity:.45;transform:translate(-50%,-50%) scale(.94)}
  50%{opacity:.8;transform:translate(-50%,-50%) scale(1.06)}}
.critburst{position:absolute;transform:translate(-50%,-50%);width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,246,224,.95),rgba(255,190,60,.7) 34%,rgba(224,112,90,.35) 60%,transparent 74%);
  animation:cbst .42s ease-out forwards;pointer-events:none;mix-blend-mode:screen}
@keyframes cbst{0%{opacity:0;transform:translate(-50%,-50%) scale(.15)}
  22%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
.critring{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;
  border:3px solid #ffd45e;box-shadow:0 0 14px rgba(255,212,94,.9);
  animation:crng .55s cubic-bezier(.2,.8,.3,1) forwards;pointer-events:none}
.critring.r2{border-color:#fff6e0;border-width:2px;animation-delay:.1s}
@keyframes crng{0%{opacity:.95;transform:translate(-50%,-50%) scale(.3)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(2.6)}}
.critgash{position:absolute;transform:translate(-50%,-50%) rotate(var(--rot));
  width:132px;height:7px;border-radius:4px;
  background:linear-gradient(90deg,transparent,#fff6e0 28%,#ffd45e 52%,#e0705a 74%,transparent);
  animation:cgsh .34s ease-out forwards;pointer-events:none}
@keyframes cgsh{0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--rot)) scaleX(.1)}

.critshard{position:absolute;width:5px;height:11px;border-radius:2px;background:#ffd45e;

@keyframes cshd{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.25)}}
.critword{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:24px;

.slot.critflash{animation:cflsh .45s}
@keyframes cflsh{0%{filter:brightness(3.2) saturate(.4)}22%{filter:brightness(1.6)}

.shake{animation:shk .28s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}

.flashd{animation:fld .3s} @keyframes fld{0%,100%{filter:none}30%{filter:brightness(2.4) saturate(.4)}}
.flashg{animation:flg .5s} @keyframes flg{0%,100%{box-shadow:none}

.kw.kwq{border-bottom:1px dotted currentColor;cursor:help}
#kwtip{position:fixed;z-index:1200;max-width:280px;padding:8px 11px;border-radius:7px;
  background:#181410;border:1px solid var(--brass);box-shadow:0 6px 22px rgba(0,0,0,.6);

.veil{position:fixed;inset:0;pointer-events:none;animation:vl .5s ease-out forwards}
@keyframes vl{0%{opacity:.5}100%{opacity:0}}
@media(max-width:960px){
  .field{flex-direction:column;gap:8px} .mid{display:none} .side{flex-wrap:wrap}
  .skills{grid-template-columns:repeat(2,minmax(0,1fr))}
  .skills{position:static;width:auto;margin-top:6px}
}

let KW_RE=null;
function kwRegex(){
  if(KW_RE) return KW_RE;
  const esc2=x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const parts=["_[^_]+_","\\*[^*]+\\*","공격력","마법력","보호력"]
    .concat(KW_NAMES.map(esc2));
  KW_RE=new RegExp(parts.join("|"),"g");
  return KW_RE;
}
/* 한 번만 훑어서 강조·아이콘·키워드를 모두 처리한다 */
function icoify(html){
  return String(html).replace(kwRegex(),m=>{
    if(m.charAt(0)==="_"&&m.length>2) return '<u>'+m.slice(1,-1)+'</u>';
    if(m.charAt(0)==="*"&&m.length>2) return '<i>'+m.slice(1,-1)+'</i>';
    if(m==="공격력") return ic("atk");
    if(m==="마법력") return ic("mag");
    if(m==="보호력") return ic("def");
    const c=KW_COLOR[KW[m]]||KW_COLOR.plain;
    const d=KW_DESC[m];
    return '<b class="kw'+(d?' kwq':'')+'" style="color:'+c+'"'
      +(d?' data-kw="'+esc(m)+'"':'')+'>'+m+'</b>';
  });
}

    g.style.animationDelay=(i*55)+"ms";
  }
  for(let i=0;i<16;i++){
    const a=Math.random()*Math.PI*2, d=30+Math.random()*54;
    const sp=spawn('<div class="critshard"></div>');
    if(!sp) continue;
    at(sp,p);
    sp.style.setProperty("--dx",(Math.cos(a)*d)+"px");
    sp.style.setProperty("--dy",(Math.sin(a)*d)+"px");
    sp.style.animationDelay=(Math.random()*90)+"ms";
  }
  const w=spawn('<div class="critword">치명타</div>');
  if(w){ w.style.left=p.x+"px"; w.style.top=(p.y-40)+"px" }
}
function flushFX(){
  let t=0;
  while(FXQ.length){
    const o=FXQ.shift();
    setTimeout(()=>playFX(o),t);
    t+=(o.gap==null?110:o.gap);
  }
}
function veil(color){
  const v=el('<div class="veil" style="background:'+color+'"></div>');
  document.body.appendChild(v); setTimeout(()=>v.remove(),620);
}

  "균열 차원문":"대상 위치에 차원문을 생성합니다. 차원문 위의 대상에 따라 효과가 부여됩니다.\n- 대상이 적이면 턴 종료시 피해를 3(추가 ∴ ) 줍니다.\n- 대상이 아군이면 턴 시작시 보호막을 3(추가 ¤ ) 얻습니다.\n이미 차원문이 있는 자리에 재사용시 악마 하수인 카드를 가져옵니다.",
  "그림자 기습":"적에게 피해를 3(추가 † ) 줍니다.\n\n자리에 그림자를 남기고, 최대 2칸 이동합니다.\n\n그림자가 있는 상태라면 대신 그림자가 있는 위치로 이동하고, 은신 상태가 됩니다.",
  "급습":"은신 상태에서 다음 공격 피해는 치명타로 적용됩니다.",

  "꿰뚫는 화살":"잠금 (1). 관통 피해를 10 줍니다.",

  "달래주기":"최대 2칸 이동하고, 오토와 거리 1 내의 아군에게 에너지 보호막을 4 부여합니다.\n추진력을 2 얻습니다.",
  "독소 침":"적이 공중에 뜸 상태가 될 때마다 _비늘 조각_의 수*( )*만큼 피해를 줍니다.\n적을 처치한 후에 _비늘 조각_을 10개 얻습니다.",
  "돌봄":"내 턴이 끝날 때, 오토의 보호막 일정량을 에너지 보호막으로 강화합니다. *(최대 5)*",
  "든든한 아군":"내 턴이 끝날 때, 다른 모든 아군에게 보호막을 2(추가 ¤ ) 부여합니다.",
  "라이티늄 지팡이":"대상을 선택합니다.\n\n아군이면 체력을 1 회복시킵니다.\n적이면 피해를 2(추가 ¤ ) 줍니다.\n\n_독서 중첩_을 1 얻습니다.\n\n_축복 상태_라면 도미니코가 회피 1를 얻습니다.",
  "마나 중독자":"이테리오가 소비한 마나 1당 그 턴에만 마법력을 1 얻습니다.",
  "마법 부여 보호구":"아군 영웅에게 보호막을 12, 마법력을 2 부여합니다.",
  "막기":"보호막을 3(추가 ¤ ) 얻습니다.",
  "망자의 육체":"전투가 끝날 때 망자의 육체가 살아 있다면, 트리스탄을 부활시키고 최대 생명력으로 회복시킵니다.",
  "맥주":"아군 대상의 체력을 5 회복시키고 기절합니다.",
  "명중":"사용한도(1). 피해를 25(추가 † ) 줍니다. \n이 피해로 적을 처치했다면, 피부 강화의 사용한도를 +1 얻습니다.",
  "바람처럼 사라져라":"내 턴에 적이 공중에 뜸 상태가 된 후에, 피해를 4(추가 † ) 줍니다.",
  "방패 막기":"보호막을 4(추가 ¤ ) 얻습니다. 방패 밀치기로 전환합니다.",
  "방패 밀치기":"피해를 4(추가 † ) 줍니다. 방패 막기로 전환합니다.",
  "베기":"피해를 3(추가 † ) 줍니다.",
  "보물 사냥꾼":"데린저가 보상을 얻을 때마다 금화 _개와 보물 점수를 얻습니다.\n보물 점수는 보상에 따라 다릅니다.\n(하급 보상 1점, 중급 보상 3점, 상급 보상 5점)\n\n보물 점수 5점마다 영구적으로 공격력 1을 얻습니다. 얻은 공격력 *( ) *",
  "보호의 음율":"모든 아군에게 보호막을 1(추가 ¤ ) 부여하는 _음율_을 노래합니다.",
  "부정의 노래":"부정적인 효과를 부여하는 _음율_을 선택하여 시전합니다.",
  "비늘 폭발":"사용한도(1). _비늘 조각_을 모두 소모하여 그 수*( )*만큼 모든 적에게 피해를 줍니다.",
  "빵":"아군 대상의 체력을 1 회복시킵니다.",
  "사형 선고":"전투 시작시 2턴 잠금된 상태로 시작합니다.\n우두머리가 아닌 대상을 처치하고 50%의 체력을 가진 상태로 부활시킵니다. *(전투당 1회)*\n\n아군이면 마법력 2를 부여합니다.\n적군이면 2턴간 공포를 부여합니다.",
  "산들바람":"1칸 이동하고, 추진력을 1 얻습니다. 다음 진선풍도의 거리와 피해량이 1 증가합니다.",
  "생기 갈취":"다음 기술이 흡수 +20%를 얻습니다.\n\n그림자가 있는 상태라면 그림자가 있는 위치로 이동하고, 다음 기술이 관통 +50%도 얻습니다.",
  "생명의 음율":"체력이 가장 낮은 아군의 체력을 3 회복시키는 _음율_을 노래합니다.",
  "선두 방어":"가장 앞으로 이동하고 1턴 동안 도발을 얻습니다. \n지나간 아군 하나 당 보호막을 5(추가 ¤ ) 얻습니다.\n후미 준비로 전환합니다.",
  "성벽":"항상 도발 상태입니다. 이동할 수 없습니다.",
  "소형 방패":"아군 영웅에게 보호막을 5 부여합니다.",
  "속임수 태세":"악몽 태세와 공포 태세 중 선택하여 시전합니다.\n어떤 태세를 선택했는지 적에게 알려지지 않습니다.",
  "수축 공격":"피해를 2(추가 ∴ ) 줍니다. *(거리 2)*",
  "숙주 폭발":"잠금 (2). 적들에게 피해를 3(추가 ∴ + 감염 중첩의 2배 ) 주고, 감염 중첩을 모두 제거합니다.",
  "순환의 선율":"잠금 (2). 이번 음율란은 리페가 _음율_을 모두 노래한 후, 역방향으로 _음율_을 한 번 더 노래합니다.",
  "승리의 일격":"잠금 (1). 피해를 20(추가 † ≡ ) 줍니다.\n이 기술로 소환물이 아닌 적을 처치할때마다 베기의 피해량이 영구적으로 1 증가합니다.",
  "시공간 폭탄":"잠금 (1). 모든 적에게 _정밀 표식_을 남기고, 위치를 무작위로 이동시킵니다.",
  "쓰담쓰담":"피해를 2(추가 ∴ ) 줍니다. 보호막을 1(추가 ¤ ) 얻습니다.",
  "씹어먹기":"피해를 4(추가 † ) 주고, 체력을 2 회복합니다.",
  "악마 하수인":"굴라의 균열 차원문을 이미 차원문이 있는 자리에 재사용하면 가져옵니다.",
  "악마 혐오":"전투 시작시 악마 진영의 적 하나당 보호력을 +2 얻습니다.",
  "악몽 태세":"보호막을 10(추가 ¤ ) 얻고, 다음 턴까지 피해를 받을 때마다 모든 적에게 피해를 4(추가 † ) 줍니다.",
  "어둠 증식":"사용한도(2). 대상 위치에 어두운 그림자를 남깁니다. 그림자가 이미 있었다면 어두운 그림자로 교체합니다. \n어두운 그림자로 이동하면, 다음 상대 턴에 은신 대신 도발과 갑피 4를 얻습니다.",
  "에너지 융합봉":"수축 공격과 팽창 공격 중 선택하여 시전합니다.",
  "영광의 족쇄":"잠금 (1). 추가 공격력과 마법력을 보호력으로 전환합니다.\n가장 가까운 적을 기절시키고 피해를 8(추가 ¤ ) 줍니다.\n\n_독서 중첩_을 1 얻습니다.\n\n_축복 상태_라면 모든 적을 기절시킵니다.",
  "영광의 휘장":"아군 영웅에게 피해를 4주고 회피를 1 부여합니다.",
  "영혼 분리":"선택한 자리에 체력이 가장 낮은 적의 환영을 소환합니다.\n환영은 적과 같은 체력을 지니고, 아무 행동도 하지 않습니다.\n처치되면 원래 적에게 피해 4(추가 ∴ +대상 최대 체력의 10%)를 줍니다.\n\n환영으로 얻을 수 있는 영혼은 1개입니다.\n\n영혼 40개당 최대 체력 비례 피해량이 2.5% 증가합니다.\n\n환영은 전장에 최대 하나만 활성화할 수 있습니다.\n환영은 원래 적이 죽을 시 같이 죽습니다.",
  "영혼 수확":"대상이 죽을 때마다 영구히 영혼을 얻습니다.\n일반 적(1개), 정예 적(5개), 우두머리 적(10개)\n아군 소환물(1개), 아군 영웅(5개)\n\n얻은 영혼의 개수에 따라 추가 능력치를 얻습니다.\n영혼 40개당 마법력 1을 얻습니다. 얻은 마법력*( )*",
  "왕실 지혜 도서관":"도미니코는 기술을 사용할때마다 _독서_ 중첩을 얻습니다.\n_독서_ 중첩이 10이 되면 중첩을 모두 소모하고 _축복 상태_가 되어 다음 기술을 1회 강화합니다. 얻은 독서 중첩 *( )*",
  "융합":"아군 전장에 있는 모든 소환물을 처치합니다.\n처치한 소환물들의 체력만큼 굴라가 체력을 얻습니다. \n처치한 소환물 하나 당 굴라가 공격력, 마법력, 보호력을 3 얻습니다.",
  "응축 폭발":"잠금 (3). 2턴 동안 도발과 보호막을 14(추가 ¤ ) 얻습니다.\n2턴 후에 모든 적에게 굴라의 현재 체력의 20%만큼의 피해를 줍니다.",
  "의지 약화":"다음 턴 동안 선택한 적의 추가 공격력을 3 감소시킵니다.\n\n_독서 중첩_을 4 얻습니다.\n\n_축복 상태_라면 추가 마법력과 보호력도 동일하게 감소시킵니다.",
  "자기장 변환":"적에게 피해를 8(추가 ∴ ) 줍니다. _정밀 표식_이 남겨진 적이라면 1칸 앞으로 이동시키고 속박시킵니다. 이동하지 못하는 상태라면, 대신 기절시킵니다.",
  "자동변환단총":"_탄알_을 1 소모하여 적에게 피해를 2(추가 † ) 줍니다.(거리 2)\n\n남은 탄알 : 5/5\n어떤 개조를 하더라도 제대로 작동하는 죽이는 총!",
  "잠재력 활성":"잠금 (2). 이번 턴에 진선풍도가 거리 내의 모든 적에게 피해를 주고, 회오리는 모든 적을 공중으로 띄웁니다.\n다음 4번의 산들바람의 비용이 0이 됩니다.",
  "재능 시기":"적을 처치할 때마다 인비디아가 해당 전투에서 적들의 능력치를 얻습니다.\n\n적 처치시 얻을 수 있는 능력치(각 25% 확률로)\n공격력 1, 마법력 1, 보호력 1, 체력 4",
  "저주받은 성벽":"이 소환물이 죽은 후, 거리 1 내의 대상에게 보호약화를 2 부여합니다. 이동할 수 없습니다.",
  "저주받은 육체":"레벨 당 증가하는 최대 체력을 얻을 수 없습니다. 대신 영구히 공격력 +1을 얻습니다.\n\n전투 당 1회, 트리스탄이 죽은 후 망자의 육체 카드를 가져옵니다.",
  "적응성 비늘":"내 턴이 끝날 때, 보호막을 1(추가 ¤ + 이번 턴에 얻은 비늘 조각의 수) 얻습니다.",
  "전두엽 감염":"잠금 (1). 감염이 3회 이상 중첩된 적들이 감염 중첩을 1 얻고, 다음 턴에 시전하는 각 기술의 첫 시전시 필요 마나가 1 증가합니다.",
  "전장의 승자":"던전에서 승리할 때마다 영구적으로 공격력을 1 얻습니다. (최대 2)\n패배할 시 얻은 공격력을 모두 잃습니다.\n초과로 얻은 공격력은 금화 1으로 대체됩니다.",
  "점프백":"최대 2칸 이동하고 _기동 상태_에 돌입합니다.\n_기동 상태_에서는 다른 기술을 시전한 후 1칸 뒤로 이동합니다.\n이때 이동하지 못하는 상태라면, 에너지 보호막을 1(추가 ∴ ) 얻습니다.",
  "정밀 타격":"이테리오가 마법 피해를 주면 대상에게 _정밀 표식_을 남깁니다.\n_정밀 표식_이 있는 적에게는 이테리오의 공격 피해가 치명타로 적용되고 표식을 하나 제거합니다.",
  "정의의 기운":"잠금 (1). 헥토의 보호막*( )*만큼 가장 가까운 적에게 피해를 줍니다.",
  "정확한 조준":"적을 선택합니다. 데린저가 _조준 상태_가 되어 해당 적에게 입히는 피해가 치명타로 적용되고 다른 적은 100% 감소합니다.\n_조준 상태_에서는 속박되고, 재사용하거나 대상 적이 죽으면 해제됩니다.",
  "조각난 페일노트":"가장 멀리 있는 적에게 피해를 4(추가 † ) 줍니다.",
  "조화의 노래":"이로운 효과를 부여하는 _음율_을 선택하여 시전합니다.",
  "죄악의 기침":"가장 가까운 적에게 피해를 2(추가 ∴ ) 주고 감염시킵니다.\n감염이 3회 중첩된 적에게 사용시 체력을 4 회복합니다.",
  "지면 진동":"적을 공중에 뜸 상태로 만들고 1칸 뒤로 이동시킵니다. 이동하지 못하는 상태라면, 대신 속박시킵니다.",
  "진선풍도":"피해를 2(추가 † ) 줍니다. *(거리 2)*\n세 번째 사용 시에는 강화되어, 거리 3의 회오리를 날려 지나간 적들에게 피해를 주고, 마지막 적은 공중에 뜸 상태로 만듭니다.",

function addMod(h,skName,key,v,label){
  const put=t=>{
    if(!t||t.n!==skName) return;
    t.mods=t.mods||[];
    const e=t.mods.find(m=>m.k===key&&m.n===label);
    if(e) e.v+=v; else t.mods.push({k:key,v:v,n:label});
  };
  h.sk.forEach(k=>{ put(k); put(k.alt) });
}

function recipeLines(it){
  const L=[];
  if(it.rc) L.push("재료 : "+it.rc.join(" + ")+" · 제련석 "+it.cost);
  const into=ITEMS.filter(x=>x.rc&&x.rc.indexOf(it.n)>=0);
  if(into.length) L.push("쓰임 : "+into.map(x=>x.n).join(", "));
  if(!L.length) L.push("제련과는 관계없는 아이템입니다.");
  return L;
}
function recipeHtml(it){
  return recipeLines(it).map(t=>`<p class="rcp">${rich(t)}</p>`).join("");
}
function itemTip(it){ return it.n+" — "+it.d+"\n"+recipeLines(it).join("\n") }
function findRecipe(a,b){
  const key=[a,b].sort().join("|");
  return ITEMS.find(it=>it.rc&&it.rc.slice().sort().join("|")===key)||null;
}
const ITEM_MAX=3;
function equip(h,it){
  h.items.push(it);
  if(it.st) for(const k in it.st){ h[k]+=it.st[k]; if(k==="maxHp") h.hp+=it.st[k] }
}
function unequip(h,idx){
  const it=h.items.splice(idx,1)[0];
  if(it&&it.st) for(const k in it.st){ h[k]-=it.st[k]; if(k==="maxHp") h.hp=Math.min(h.hp,h.maxHp) }
  return it;
}

}

/* 내 턴이 끝날 때 정리 — 적이 걸어준 것은 다음 내 턴까지 남는다 */
function tickDebEnd(u){
  if(!u.deb) return;
  if(u.deb.burn>0){
    const v=u.deb.burn;
    let d=v; const sh=Math.min(u.shield||0,d); u.shield-=sh; d-=sh; u.hp-=d;
    fx({side:"mine",slot:u.slot,hit:1,txt:"-"+v,cls:"dmg",gap:80});
    say(`${u.name} 화상 피해 ${v}`,"t3");
    u.deb.burn--;
  }
  ["atkDn","magDn","defDn","bind"].forEach(k=>{ if(u.deb[k]>0) u.deb[k]-- });
  u.deb.shock=0; u.deb.chill=0; u.deb.stun=0; u.deb.fear=0;
}

function buildGrid(fi){
  const S=FIELDS[fi].size, g=[], mid=Math.floor(S/2);
  for(let r=0;r<S;r++){ const row=[]; for(let c=0;c<S;c++) row.push({t:"empty"}); g.push(row) }
  g[S-1][mid]={t:"camp"};
  g[0][mid]={t:"boss"};
  const free=[];
  for(let r=0;r<S;r++) for(let c=0;c<S;c++) if(g[r][c].t==="empty") free.push([r,c]);
  const put=(t,n,mk)=>{
    for(let i=0;i<n&&free.length;i++){
      const k=Math.floor(Math.random()*free.length), rc=free.splice(k,1)[0];
      g[rc[0]][rc[1]]=Object.assign({t:t},mk?mk():{});
    }
  };
  const sc=S/7;
  const dun=()=>({waves:1+Math.floor(Math.random()*3),style:rnd(DUN_STYLE),loot:rnd(DUN_LOOT)});
  put("dungeon",Math.round(10*sc),dun);
  put("elite",Math.round(3*sc),()=>({waves:1+Math.floor(Math.random()*2),style:rnd(DUN_STYLE),loot:rnd(DUN_LOOT)}));
  put("shop",2); put("rest",2); put("event",5);
  return g;
}
/* 이미 들른 상점·휴식소·미지의 구역은 다른 날 다른 자리에 다시 나타난다 */
function respawn(){
  const S=run.size, free=[];
  for(let r=0;r<S;r++) for(let c=0;c<S;c++) if(run.grid[r][c].t==="empty") free.push([r,c]);
  ["shop","rest","event"].forEach(t=>{
    const want={shop:2,rest:2,event:5}[t];
    let have=0;
    for(let r=0;r<S;r++) for(let c=0;c<S;c++) if(run.grid[r][c].t===t) have++;
    for(let i=have;i<want&&free.length;i++){
      if(Math.random()<0.45) continue;              /* 7일에 걸쳐 조금씩 */
      const k=Math.floor(Math.random()*free.length), rc=free.splice(k,1)[0];
      run.grid[rc[0]][rc[1]]={t:t};
    }
  });
  /* 던전을 모두 정복하면 새 던전이 생긴다 */
  let left=0;
  for(let r=0;r<S;r++) for(let c=0;c<S;c++){ const x=run.grid[r][c];
    if(x.t==="dungeon"||x.t==="elite") left++ }
  if(!left){
    const n=4+Math.floor(Math.random()*3);
    for(let i=0;i<n&&free.length;i++){
      const k=Math.floor(Math.random()*free.length), rc=free.splice(k,1)[0];
      run.grid[rc[0]][rc[1]]={t:i<2?"elite":"dungeon",waves:1+Math.floor(Math.random()*3),
        style:rnd(DUN_STYLE),loot:rnd(DUN_LOOT)};
    }
    if(n) toast("정복하지 않은 던전이 사라지고, 새 던전이 나타났습니다.");
  }
}

function clock(){
  const t=Math.max(0,run.time), h=Math.floor(t)%24, m=(t%1)?"30":"00";
  return (h<10?"0":"")+h+":"+m;
}
function spend(hours,act){
  const tired=run.act<=0;
  if(act){ run.act=Math.max(0,run.act-act) }
  run.time+=(tired&&act)?hours*2:hours;
  if(run.time>=18&&!run.night){ run.night=1;
    toast("해가 집니다. 밤길에는 무엇이 튀어나올지 모릅니다.") }
  if(run.time>=30){ toast("길에서 밤을 지새웠습니다."); nextDay() }
}
function addTaint(v){
  run.taint=Math.max(0,Math.min(100,run.taint+v));
  if(run.taint>=100) lose("균열의 오염이 100에 달했습니다. 세상이 갈라집니다.");
}
function nextDay(){
  run.day++;
  if(run.day>FIELDS[run.field].days){
    lose(`${FIELDS[run.field].days}일이 지나도록 우두머리를 넘지 못했습니다.`); return;
  }
  run.time=6; run.act=run.actMax; run.night=0; run.campDone=0;
  addTaint(10);
  respawn();
  toast(`${run.day}일차 아침이 밝았습니다.`);
}
function lose(msg){ run.lost=msg; view="over"; render() }

function nextField(){
  run.field++;
  if(run.field>=FIELDS.length){ view="clear"; render(); return }
  const f=FIELDS[run.field], S=f.size, mid=Math.floor(S/2);
  run.size=S; run.grid=buildGrid(run.field);
  run.pos={r:S-1,c:mid};
  run.day=1; run.time=6; run.actMax=f.act; run.act=f.act;
  run.night=0; run.taint=0; run.campDone=0; run.remapUsed=0;
  run.heroes.forEach(h=>{ h.hp=h.maxHp; h.down=0 });
  toast(`${f.n}에 들어섭니다. 대원 전원이 회복되었습니다.`);
  view="map"; render();
}

function nightDepth(){ return run.night?Math.max(0,run.time-18):0 }
function ambushChance(cell){
  if(!run.night) return 0;
  const base=(cell.t==="empty")?0.45:0.12;
  return Math.min(0.85, base+nightDepth()*0.05);
}
function moveTo2(r,c){
  const cell=run.grid[r][c];
  run.pos={r:r,c:c};
  spend(1,1); addTaint(6);
  if(run.taint>=100) return;
  if(cell.t!=="camp"&&Math.random()<ambushChance(cell)){
    toast(cell.t==="empty"
      ? "인기척 하나 없는 자리입니다. 어둠 속에서 무언가 달려듭니다."
      : "발을 들이기도 전에 무언가 달려듭니다.");
    if(cell.t!=="empty") run.pendingEnter={r:r,c:c};   /* 이기면 원래 볼일을 본다 */
    startDungeon({t:"ambush",waves:1},null,null); return;
  }
  enterCell(r,c);
}
function enterCell(r,c){
  const cell=run.grid[r][c];
  if(cell.done||cell.t==="empty"){ view="map"; render(); return }
  if(cell.t==="camp"){ view="camp"; render(); return }
  if(cell.t==="shop"||cell.t==="rest"||cell.t==="event"){
    spend(0.5,0);
    run.here={r:r,c:c};
    run.grid[r][c]={t:"empty"};      /* 한 번 들르면 사라진다 */
    if(cell.t==="shop"){ makeShop(); view="shop" }
    else if(cell.t==="rest"){ view="rest" }
    else { run.ev=rnd(EVENTS); run.evMsg=null; view="relic" }
    render(); return;
  }
  if(cell.t==="dungeon"||cell.t==="elite"||cell.t==="boss"){ startDungeon(cell,r,c); return }
  view="map"; render();
}

  if(!pool.length) return 4;

  (run.bag||[]).forEach((it,bi)=>{
    if(it.g!=="파편"&&it.g!=="일반") return;

    const key="B:"+bi, on=run.forgePick.indexOf(key)>=0;
    const c=el(`<div class="rw ${on?"on":""}"><div class="rwi">${rewardIcon(it)}</div>
      <div class="g">가방 · ${esc(it.g)}</div>

  run.dun={cell:cell,r:r,c:c,wave:0,waves:cell.waves||1,
           kind:cell.t==="boss"?"boss":cell.t==="elite"?"elite":cell.t==="ambush"?"ambush":"battle"};
  nextWave();
}
function nextWave(){
  run.dun.wave++;

}
function dungeonCleared(){
  const d=run.dun;

  const T=[CHEST,CHEST2,CHEST3][Math.min(run.field,2)][kind]||CHEST.battle;
  const out=[];

    const type=row[0], lo=row[1], hi=row[2], p=row[3];

    if(p>=1) n=Math.floor(p); else if(Math.random()<p) n=1;

      if(type==="금화") out.push({t:"금화",v:lo+Math.floor(Math.random()*(hi-lo+1))});

function takeChest(){
  const ch=run.chest, later=[];
  let exp=0;
  ch.list.forEach(x=>{
    if(x.t==="금화") run.gold+=x.v;
    else if(x.t==="경험치") exp+=x.v;
    else if(x.t==="파편"||x.t==="일반") later.push({item:rnd(ITEMS.filter(i=>i.g===x.t))});
    else if(x.t==="동료") later.push({recruit:1});
    else later.push({grade:x.t});
  });
  run.chest=null;
  run.after=later;
  if(exp) giveExp(exp,run.heroes.filter(h=>!h.down&&h.joined!==0));
  afterChest();
}
function afterChest(){
  const q=run.after||[];

  const nx=q.shift();
  if(nx.item){ pending={stage:"hero",list:[],item:nx.item,hero:null,back:"chain"}; view="item"; render(); return }
  if(nx.recruit){
    const owned=run.heroes.map(x=>x.name);
    const pool=HERO_POOL.filter(n=>!owned.includes(n));
    run.heroOffer=[];
    while(run.heroOffer.length<3&&pool.length)
      run.heroOffer.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
    view="recruit"; render(); return;
  }
  pending={hero:null,grade:nx.grade,free:1,back:"chain"}; view="reward"; render();
}
function backToMap(){
  if(run.pendingLv&&run.pendingLv.length){
    const q=run.pendingLv; run.pendingLv=null;
    pending={queue:q,idx:0}; view="reward"; render(); return;
  }
  if(run.bossDone){ run.bossDone=0; run.dun=null; nextField(); return }
  run.dun=null;
  if(run.pendingEnter){
    const e=run.pendingEnter; run.pendingEnter=null;
    toast("습격을 물리치고 다시 걸음을 옮깁니다.");
    enterCell(e.r,e.c); return;

}

              use:a=>{ a.hp=Math.min(a.maxHp,a.hp+5); a.stun=(a.stun||0)+1;
                       say(`맥주 — ${a.name} 체력 +5, 기절 1`) }},
 "소형 방패":{d:"아군 영웅에게 보호막을 5 부여합니다.", use:a=>{ a.shield+=5; say(`소형 방패 — ${a.name} 보호막 +5`) }}

function addCard(r,name,n){
  const e=(r.cards=r.cards||[]).find(x=>x.n===name);
  if(e) e.c=Math.min(10,e.c+n); else if(r.cards.length<10) r.cards.push({n:name,c:Math.min(10,n)});
}
function useCard(name){
  const e=(run.cards||[]).find(x=>x.n===name);
  if(!e) return;
  e.c--; if(e.c<=0) run.cards.splice(run.cards.indexOf(e),1);
}

/* ═══════════ 경험치 ═══════════ */
function giveExp(exp,pool,each){
  pool=(pool&&pool.length)?pool:run.heroes.filter(h=>!h.down);
  if(!pool.length) pool=run.heroes.slice();
  if(each){
    const q0=run.pendingLv||[];
    pool.forEach(h=>{
      h.exp+=exp;
      while(h.lv<30&&h.exp>=needExp(h.lv)){
        h.exp-=needExp(h.lv); h.lv++;
        h.maxHp+=h.hpLv; h.hp+=h.hpLv;
        if(h.name==="트리스탄") h.atk++;
        q0.push({hero:h,lv:h.lv});
      }
    });
    run.pendingLv=q0;
    toast(`경험치 — ${pool.map(h=>h.name).join(" · ")} 각각 +${exp}`);
    return;
  }
  const w=pool.map(h=>1/Math.max(1,h.lv));
  const sum=w.reduce((a,b)=>a+b,0);
  const raw=w.map(x=>exp*x/sum);
  const got=raw.map(x=>Math.floor(x));
  let left=exp-got.reduce((a,b)=>a+b,0);
  raw.map((x,i)=>({i:i,f:x-Math.floor(x)})).sort((a,b)=>b.f-a.f)
     .forEach(o=>{ if(left>0){ got[o.i]++; left-- } });
  if(exp>0) got.forEach((g,i)=>{ if(g<1) got[i]=1 });
  const q=run.pendingLv||[];
  pool.forEach((h,i)=>{
    h.exp+=got[i];
    while(h.lv<30&&h.exp>=needExp(h.lv)){
      h.exp-=needExp(h.lv); h.lv++;
      h.maxHp+=h.hpLv; h.hp+=h.hpLv;
      if(h.name==="트리스탄") h.atk++;
      q.push({hero:h,lv:h.lv});
    }
  });
  run.pendingLv=q;
  toast(`경험치 — ${pool.map((h,i)=>h.name+" +"+got[i]).join(" · ")}`);
}

function spinRoulette(e,msg){
  run.evSpin=1; render();
  const n=e.wheel.length, target=run.evRoll;
  const laps=3, steps=n*laps+target;
  let i=0;
  const tick=()=>{
    const rows=document.querySelectorAll(".wheel .wr");
    if(!rows.length){ run.evSpin=0; run.evMsg=msg; render(); return }
    rows.forEach((r,k)=>{
      const on=(k===i%n);
      r.classList.toggle("hit",on);
      const q=r.querySelector("i"); if(q) q.textContent=on?"▶":"";
    });
    SFX.play("tick");
    i++;
    if(i<=steps){
      const t=i/steps;
      setTimeout(tick, 55+Math.pow(t,3)*300);
    }else{
      SFX.play("win");
      setTimeout(()=>{ run.evSpin=0; run.evMsg=msg; render() },420);
    }
  };
  setTimeout(tick,120);
}

const SLOTS=5;

function foeSet(kind){
  const f=Math.min(run.field,2), pool=FIELD_FOES[f], out=[];
  const n=run.heroes.length;
  if(kind==="boss"){
    out.push([BOSSES[f],1]);
    const extra=Math.min(2,Math.max(0,n-1));
    for(let i=0;i<extra;i++) out.push([rnd(pool),2+i]);
    return out;
  }
  if(kind==="elite"){
    /* 정예는 대원 수 제한을 덜 받고, 앞자리에 가장 단단한 놈이 선다 */
    const k=Math.max(3,Math.min(5,n+2));
    const lead=pool.slice().sort((a,b)=>FOE[b].hp-FOE[a].hp)[0];
    out.push([lead,1]);
    for(let i=2;i<=k;i++) out.push([rnd(pool),i]);
    return out;
  }
  const base=2+Math.floor(Math.random()*2);
  const k=Math.max(1,Math.min(base,n+1));
  for(let i=1;i<=k;i++) out.push([rnd(pool),i]);
  return out;
}
/* 대원이 강해진 만큼 적도 따라온다 */
function partyPower(){
  if(!run||!run.heroes.length) return 1;
  const n=run.heroes.length;
  const lv=run.heroes.reduce((a,h)=>a+h.lv,0)/n;
  const st=run.heroes.reduce((a,h)=>a+h.atk+h.mag+h.def,0)/n;
  const hp=run.heroes.reduce((a,h)=>a+h.maxHp,0)/n;
  return 1+(lv-1)*0.11+st*0.012+Math.max(0,hp-22)*0.006;
}
function foeScale(kind){
  const f=run.field, l=(run.day-1)+(run.dun?run.dun.wave-1:0), n=Math.min(run.heroes.length,5);
  let m=(1+f*0.85)*(1+l*0.05)*partyPower();
  if(kind==="elite")  m*=1.5;
  if(kind==="boss")   m*=1.45;
  if(kind==="ambush") m*=1.3+nightDepth()*0.08;
  /* 대원이 적을수록 적도 약해진다 */
  const hpP =[0,0.68,0.86,1,1.08,1.15][n];
  const atkP=[0,0.58,0.82,1,1.06,1.12][n];
  const defP=[0,0.7 ,0.88,1,1.05,1.1 ][n];
  return {m:m, hpP:hpP, atkP:atkP, defP:defP,
          hpAdd:Math.round((f*3+l)*hpP), atkAdd:Math.floor(f*1.2*atkP), defAdd:Math.round(f*2*defP)};
}

      rng:d.rng,exp:d.exp+run.field*2+Math.floor(run.day/3),demon:d.demon||0,boss:d.boss||0,
      shield:0,air:0,alive:1,id:i,infect:0,stun:0,weak:0});
  });
  B.portals=[]; B.mins=[]; B.corpseUsed=0;
  (run.cards||[]).forEach(cd=>{

}

function makeMin(name,slot){
  const d=SUMMONS[name];
  return {name:name,slot:slot,isMin:1,alive:1,lv:99,

function defVal(f){ return Math.max(0,f.def-(f.weak||0)) }
function intentKey(o){
  if(!o) return "";
  if(o.t==="atk") return "atk:"+(o.pat||"");
  if(o.t==="deb") return "deb:"+o.k;
  return o.t;
}
function rollIntents(){
  const USED={};
  let allies=allUnits();
  const seen=allies.filter(a=>!a.hide);
  if(seen.length) allies=seen;
  B.foes.forEach(f=>{
    if(!f.alive) return;
    if(f.isPhantom){ f.intent={t:"wait"}; return }
    if(!allies.length){ f.intent={t:"wait"}; return }
    if(f.forceDef){ f.forceDef=0; f.intent={t:"def",v:defVal(f)}; return }
    const inR=allies.filter(a=>dist(a.slot,f.slot)<=f.rng);
    const far=!inR.length;
    if(far){
      /* 먼저 거리를 좁혀 본다 */
      if(f.slot>1&&!foeAt(f.slot-1)&&Math.random()<0.55){ f.intent={t:"move"}; return }
      if(f.slot>1&&foeAt(f.slot-1)&&Math.random()<0.4){ f.intent={t:"push"}; return }
      /* 다가갈 수 없어도 손 놓고 있지는 않는다 — 무리해서 노린다 */
    }else{
      /* 원거리형은 붙으면 물러선다 */
      const RET=((FOE[f.name]&&FOE[f.name].ai)||{}).ret||0;
      if(RET&&dist(inR[0].slot,f.slot)<=1&&f.slot<SLOTS&&!foeAt(f.slot+1)&&Math.random()<RET){
        f.intent={t:"back"}; return;
      }
    }
    const T=far?allies:inR;
    const pool=[], add=(o,w)=>{ for(let q=0;q<(w||0);q++) pool.push(o) };
    const near=T.reduce((a,b)=>dist(a.slot,f.slot)<=dist(b.slot,f.slot)?a:b);
    const weak=T.reduce((a,b)=>a.hp<=b.hp?a:b);
    const back=T.reduce((a,b)=>a.slot>=b.slot?a:b);
    const any =rnd(T);
    /* 사거리 밖이면 무리하게 뻗느라 위력이 준다 */
    const FM=far?0.7:1, FP=far?"무리한 ":"";
    const dv=x=>Math.max(1,Math.round(x*FM));
    const D=(FOE[f.name]&&FOE[f.name].ai)||{};
    const A=Object.assign({near:8,weak:4,back:2,any:2,def:1,volley:0,buff:0,heal:2,curse:1,debs:["burn"]},D);
    const hit=(FOE[f.name]&&FOE[f.name].hit)||"내려찍기";
    add({t:"atk",v:dv(f.atk),to:near.slot,pat:FP+hit,far:far},A.near);
    add({t:"atk",v:dv(f.atk*1.35),to:weak.slot,pat:FP+"약점 노리기",far:far},A.weak);
    add({t:"atk",v:dv(f.atk),to:back.slot,pat:FP+"후방 급습",far:far},A.back);
    add({t:"atk",v:dv(f.atk),to:any.slot,pat:FP+"난타",far:far},A.any);
    add({t:"def",v:defVal(f)},far?A.def+1:A.def);
    add({t:"volley",v:dv(f.atk*0.6)},far?A.volley+2:A.volley);
    if((f.buffs||0)<3) add({t:"buff",v:Math.max(1,Math.round(f.atk*0.35))},A.buff);
    const mate=B.foes.filter(x=>x.alive&&x!==f&&x.hp<x.maxHp*0.6)[0];
    if(mate) add({t:"heal",v:Math.max(2,Math.round(f.def*0.8)),to:mate.id},A.heal);
    add({t:"curse"},A.curse);
    /* 이 적만의 상태 이상 */
    (A.debs||[]).forEach(k=>{
      const to=(k==="shock"||k==="fear")?back.slot:(k==="stun"?weak.slot:near.slot);
      const v={burn:2,bind:2,stun:1,fear:1,shock:3,chill:3,atkDn:2,magDn:2}[k]||1;
      add({t:"deb",k:k,to:to,v:v},far?1:2);
    });
    /* 이미 같은 행동을 고른 적이 있으면 다른 것을 우선한다 */
    let best=null;
    for(let t=0;t<4;t++){
      const c=rnd(pool), k=intentKey(c);
      const n=USED[k]||0;
      if(!n||Math.random()<1/(1+n*1.6)){ best=c; break }
      if(!best) best=c;
    }
    USED[intentKey(best)]=(USED[intentKey(best)]||0)+1;
    f.intent=best;
  });
}
function intentHtml(f){
  if(!f.alive||!f.intent) return "";
  const I=f.intent;
  if(I.t==="move")  return `<span class="intent">${ic("move")} 전진</span>`;
  if(I.t==="back")  return `<span class="intent">${ic("move")} 후퇴</span>`;
  if(I.t==="push")  return `<span class="intent">${ic("move")} 앞으로</span>`;
  if(I.t==="def")   return `<span class="intent">${ic("def")}<b>${I.v}</b></span>`;
  if(I.t==="buff")  return `<span class="intent" title="자기 강화">${ic("atk")}<b>+${I.v}</b> 강화</span>`;
  if(I.t==="heal")  return `<span class="intent" title="동료 치료">${ic("hp")}<b>+${I.v}</b> 치료</span>`;
  if(I.t==="curse") return `<span class="intent" title="다음 턴 마나 -1">${ic("mag")} 저주</span>`;
  if(I.t==="deb")   return `<span class="intent" title="${esc(DEBUFF[I.k].d)}" style="color:${DEBUFF[I.k].c}">${esc(DEBUFF[I.k].n)} ${I.v} → ${I.to}번</span>`;
  if(I.t==="volley")return `<span class="intent" title="아군 전체">${ic("atk")}<b>${I.v}</b> 전체</span>`;
  if(I.t==="atk")   return `<span class="intent" title="${esc(I.pat||"")}">${ic("atk")}<b>${I.v}</b> → ${I.to}번</span>`;
  return `<span class="intent">대기</span>`;
}

       : s.tg==="foe" ?`${s.n} ×${sel.count} — 적의 칸을 고르세요`
          +(reachOf(sel.hero,s)!=null?` (사거리 ${reachOf(sel.hero,s)})`:"")
          +" · 같은 기술을 또 누르면 횟수 +1" : "";

function breakdown(h,sk,key){
  let total=sk[key]||0;
  const parts=[];
  modParts(sk,key).forEach(m=>{ total+=m.v; parts.push({n:m.n,v:m.v}) });
  if(key==="dmg"){
    if(sk.n==="진선풍도"&&h.windBuff){ total+=h.windBuff; parts.push({n:"산들바람",v:h.windBuff}) }
    const st=(sk.el==="마법")?{v:h.mag,n:"추가 마법력"}:{v:h.atk,n:"추가 공격력"};
    if(st.v){ total+=st.v; parts.push(st) }
  }
  if(key==="shield"&&h.def){ total+=h.def; parts.push({n:"추가 보호력",v:h.def}) }
  return {total:total,parts:parts};
}
function numHtml(h,sk,key){

  const tail=b.parts.length
    ? `<span class="brk">(${b.parts.map(p=>icoify(esc(p.n))+" "+p.v).join(" / ")})</span>` : "";
  return `<b class="big">${b.total}</b>${tail}`;
}

function bk(base,parts){
  const list=parts.filter(p=>p.v);
  const total=base+list.reduce((a,p)=>a+p.v,0);
  const tail=list.length?`<span class="brk">(기본 ${base} / ${list.map(p=>icoify(esc(p.n))+" "+p.v).join(" / ")})</span>`:"";
  return `<b>${total}</b>${tail}`;
}
