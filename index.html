/* ═══════════ 저장 ═══════════
   한 판(run)과 전투 도중(B)까지 통째로 이 브라우저에 적어 둔다.
   까다로운 곳은 두 가지다.
     ① 대원 객체는 여기저기서 같은 것을 가리킨다(손패·pending·적의 공포 대상…).
        그대로 JSON 으로 만들면 사본이 여러 벌 생겨 서로 딴 사람이 된다.
        그래서 대원은 한 번만 적고, 나머지 자리에는 {__h:번호} 표를 남긴다.
     ② 손패의 카드는 use 함수를 들고 있다. 함수는 적을 수 없으므로
        무엇으로 만든 카드인지만 적어 두고(handPack), 불러올 때 다시 만든다. */
const SAVE_KEY="kyunyeol.save.v1";
let SAVE_ON=true;                    /* 되감기·연습장에서는 잠시 끈다 */

function handPack(){
  return (B.hand||[]).map(c=>{
    if(c.type==="hero")   return {t:"hero",n:c.hero.name};
    if(c.type==="summon") return {t:"summon",n:c.name};
    if(c.stock)           return {t:"stock",n:c.stock,d:c.d};
    return {t:"armor",n:c.name,d:c.d,by:c.by||null};   /* giveArmor 로 들어온 방어구 */
  });
}
function handUnpack(list){
  const out=[];
  (list||[]).forEach(c=>{
    if(c.t==="hero"){
      const h=run.heroes.find(x=>x.name===c.n);
      if(h) out.push({type:"hero",hero:h});
    }
    else if(c.t==="summon") out.push({type:"summon",name:c.n});
    else if(c.t==="stock"){
      const L=CARD_LIB[c.n];
      if(L) out.push({type:"item",name:c.n,d:c.d||L.d,stock:c.n,use:L.use});
    }
    else if(c.t==="armor"){
      const A=ARMOR_CARDS[c.n], by=c.by&&run.heroes.find(x=>x.name===c.by);
      out.push({type:"item",name:c.n,d:c.d||(A?A.d:"아군에게 보호막 10"),by:c.by||null,
        use:a=>{ if(A) A.use(a,by||a); else { a.shield+=10; say(`${c.n} — ${a.name} 보호막 +10`) } }});
    }
  });
  return out;
}
/* 대원을 가리키는 자리를 {__h:번호} 로 바꿔 적는다 */
function encRef(o,heroes){
  const idx=new Map(); heroes.forEach((h,i)=>idx.set(h,i));
  return JSON.stringify(o,(k,v)=>{
    if(typeof v==="function") return undefined;
    if(v&&typeof v==="object"&&idx.has(v)) return {__h:idx.get(v)};
    return v;
  });
}
function decRef(s,heroes){
  if(s==null) return null;
  const walk=v=>{
    if(!v||typeof v!=="object") return v;
    if(Array.isArray(v)) return v.map(walk);
    if(typeof v.__h==="number") return heroes[v.__h]||null;
    for(const k in v) v[k]=walk(v[k]);
    return v;
  };
  return walk(JSON.parse(s));
}
/* 방금 저장했다는 것을 잠깐 보여 준다 — 자동 저장은 믿을 수 있어야 쓸모가 있다 */
function saveBlip(){
  const hr=document.getElementById("hRun"); if(!hr) return;
  let b=hr.querySelector(".savedot");
  if(!b){ b=el(`<span class="savedot" title="이 브라우저에 저절로 저장됩니다">저장됨</span>`);
    hr.appendChild(b) }
  b.classList.remove("on"); void b.offsetWidth; b.classList.add("on");
}
function saveGame(){
  if(!SAVE_ON||!run||run.sandbox) return;
  /* 끝난 판은 적어 두지 않는다 — 적어 두면 죽은 판을 '이어하기'로 되살리게 된다.
     lose()/clear 에서 지워도 곧바로 render() 가 다시 적어 버려서 여기서 막는다. */
  if(view==="title"||view==="over"||view==="clear"||run.lost) return;
  try{
    const hs=run.heroes;
    const heroes=JSON.stringify(hs,(k,v)=>typeof v==="function"?undefined:v);
    run.heroes=null;
    const runS=encRef(run,hs);
    run.heroes=hs;
    let bat=null;
    if(B&&view==="battle"&&!B.over){
      bat=encRef({kind:B.kind,turn:B.turn,log:B.log.slice(-60),
                  foes:B.foes,mins:B.mins||[],portals:B.portals||[],
                  corpseUsed:B.corpseUsed||0,hand:handPack()},hs);
    }
    localStorage.setItem(SAVE_KEY,JSON.stringify({
      v:1, at:Date.now(), view:view, heroes:heroes, run:runS,
      pending:encRef(pending,hs), B:bat, snap:BSNAP?JSON.stringify(BSNAP):null
    }));
    saveBlip();
  }catch(e){ /* 저장 실패는 놀이를 막지 않는다 */ }
}
function savePeek(){
  try{
    const raw=localStorage.getItem(SAVE_KEY); if(!raw) return null;
    const s=JSON.parse(raw); if(!s||s.v!==1) return null;
    const hs=JSON.parse(s.heroes||"[]");
    const r=JSON.parse(s.run||"{}");
    return {at:s.at, field:r.field||0, day:r.day||1, view:s.view,
            inBattle:!!s.B, heroes:hs.map(h=>({n:h.name,lv:h.lv,down:h.down}))};
  }catch(e){ return null }
}
function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY); if(!raw) return false;
    const s=JSON.parse(raw); if(!s||s.v!==1) return false;
    const heroes=JSON.parse(s.heroes);
    run=decRef(s.run,heroes) || {};
    run.heroes=heroes;
    pending=decRef(s.pending,heroes);
    sel=null; B=null; HPMEM={}; SHMEM={};
    BSNAP=s.snap?JSON.parse(s.snap):null;
    view=s.view||"map";
    if(s.B){
      const b=decRef(s.B,heroes);
      B={kind:b.kind,turn:b.turn,over:0,busy:0,log:b.log||[],hand:[],units:[],
         foes:b.foes||[],mins:b.mins||[],portals:b.portals||[],
         corpseUsed:b.corpseUsed||0,drag:null};
      B.hand=handUnpack(b.hand);
      /* fearSrc 는 uid() 로 만든 문자열이라 그대로 실려 온다.
         객체로 되살리면 uid(x)===f.fearSrc 비교가 깨지므로 손대지 않는다. */
      view="battle";
      say("저장해 둔 자리에서 이어갑니다.","t2");
    } else if(view==="battle") view="map";
    render();
    return true;
  }catch(e){ return false }
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY) }catch(e){} }
function saveStamp(t){
  const d=new Date(t), z=n=>(n<10?"0":"")+n;
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;
}

/* 고칠 수 있는 글 목록을 한 곳에서 만든다 */
function txtEntries(){

    });

  /* 대사 — 한 줄이 대사 하나 */
  const BCAT=[["in","전장에 설 때"],["atk","기술을 쓸 때"],["hurt","맞을 때"],
              ["kill","처치할 때"],["down","쓰러질 때"]];

  Object.keys(BARK).forEach(n=>{

      add(barkOwner(n),"bark:"+n+":"+k,n+" ▸ "+label,
        ()=>(BARK[n][k]||[]).join("\n"),

    });
  });
  BCAT.forEach(([k,label])=>add("대사 · 공통","barkany:"+k,"이름 없는 대상 ▸ "+label,
    ()=>(BARK_ANY[k]||[]).join("\n"),
    v=>{ BARK_ANY[k]=String(v).split("\n").map(x=>x.trim()).filter(Boolean) },true));
  Object.keys(HEROES).forEach(hn=>{
    const H=HEROES[hn];
    add("대원 소개","hero:"+hn+":focus",hn+" — 한 줄 소개",()=>H.focus,v=>H.focus=v,true);
    add("대원 소개","hero:"+hn+":pass",hn+" — 지속 능력",()=>H.passive.d,v=>H.passive.d=v,true);
    H.skills.forEach((sk,i)=>add("대원 기술 요약","hsk:"+hn+":"+i,hn+" ▸ "+sk.n,
      ()=>sk.d,v=>sk.d=v,true));
  });
  return out;
}

let TXT_CAT=null, TXT_Q="";
function drawText(app){
  const E=txtEntries();
  const cats=[...new Set(E.map(x=>x.cat))];
  if(!TXT_CAT||cats.indexOf(TXT_CAT)<0) TXT_CAT=cats[0];
  const changed=Object.keys(TXT).length;

  q.value=TXT_Q;
  q.addEventListener("input",()=>{ TXT_Q=q.value; render();
    setTimeout(()=>{ const n=document.querySelector(".txtq"); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length) } },0) });
  q.className="txtq";
  bar.appendChild(q);
  const ex=el(`<button>내보내기</button>`);
  ex.onclick=()=>{
    const blob=new Blob([JSON.stringify(TXT,null,1)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="균열-설명수정.json"; a.click();
    toast("내려받은 파일을 주시면 게임에 영구히 넣겠습니다."); render();
  };
  const im=el(`<button>불러오기</button>`);
  im.onclick=()=>{
    const f=document.createElement("input"); f.type="file"; f.accept=".json";
    f.onchange=()=>{ const r=new FileReader();
      r.onload=()=>{ try{ TXT=Object.assign(TXT,JSON.parse(r.result)); txtSave(); txtApply();
        toast("불러왔습니다."); render() }catch(e){ toast("파일을 읽지 못했습니다.") } };
      r.readAsText(f.files[0]) };
    f.click();
  };
  const rs=el(`<button class="mini danger">전부 되돌리기</button>`);
  rs.onclick=()=>askConfirm2("고친 글을 전부 버리고 원래대로 되돌릴까요?",()=>{
    TXT={}; txtSave(); location.reload() });
  bar.append(ex,im,rs);
  wrap.appendChild(bar);

  const tabs=el(`<div class="txttabs"></div>`);
  cats.forEach(c=>{
    const n=E.filter(x=>x.cat===c).length;
    const b=el(`<button class="${c===TXT_CAT?"go":""}">${esc(c)} <i>${n}</i></button>`);
    b.onclick=()=>{ TXT_CAT=c; render() };
    tabs.appendChild(b);
  });
  wrap.appendChild(tabs);

  const term=TXT_Q.trim();
  const list=E.filter(x=>term? (x.label+" "+(x.get()||"")).includes(term) : x.cat===TXT_CAT);
  wrap.appendChild(el(`<div class="hint" style="margin-top:10px">${
    term?`"${esc(term)}" 로 찾은 ${list.length}개`:`${esc(TXT_CAT)} — ${list.length}개`}</div>`));
  const box=el(`<div class="txtlist"></div>`);
  list.slice(0,120).forEach(e=>{
    const on=TXT[e.key]!=null;
    const row=el(`<div class="txtrow ${on?"on":""}">
      <div class="tl"><b>${esc(e.label)}</b>${on?`<span class="chip on">고침</span>`:""}
        <span class="grow"></span></div></div>`);
    const ta=el(e.area?`<textarea rows="3"></textarea>`:`<input>`);
    ta.value=e.get()||"";
    ta.addEventListener("input",()=>{ TXT[e.key]=ta.value; e.set(ta.value); txtSave() });
    row.appendChild(ta);
    const pv=el(`<div class="txtpv">${rich(e.get()||"")}</div>`);
    ta.addEventListener("input",()=>{ pv.innerHTML=rich(ta.value) });
    row.appendChild(pv);
    if(on){ const u=el(`<button class="mini">되돌리기</button>`);
      u.onclick=()=>{ delete TXT[e.key]; txtSave(); location.reload() };
      row.querySelector(".tl").appendChild(u) }
    box.appendChild(row);
  });
  if(list.length>120) box.appendChild(el(`<p class="hint">120개까지만 보입니다. 찾기를 쓰세요.</p>`));
  wrap.appendChild(box);

  const out=el(`<div style="margin-top:22px"><button class="go">돌아가기</button></div>`);
  out.querySelector("button").onclick=()=>{ view=run?(run.txtBack||"map"):"title"; render() };
  wrap.appendChild(out);
}

/* 연습장 — 죽지 않는 허수아비를 두고 기술만 시험한다 */
function startSandbox(name){
  const f=FIELDS[0], S=f.size, mid=Math.floor(S/2);
  run={heroes:[makeHero(name)], gold:99, stone:99, cards:[], bag:[],
       field:0, size:S, grid:buildGrid(0), pos:{r:S-1,c:mid},
       day:1, time:6, act:99, actMax:99, taint:0, night:0, campDone:0,
       remapUsed:0, bonusLv:null, sandbox:1, souls:200};
  const h=run.heroes[0];
  h.lv=20; h.maxHp=300; h.hp=300; h.maxMana=9;
  run.dun={cell:{},r:null,c:null,wave:1,waves:1,kind:"battle"};
  startBattle("battle");
  /* 허수아비 셋 */
  B.foes=[];
  ["작은 죄수","사슬 광인","부서진 파수병"].forEach((n,i)=>{
    B.foes.push({name:n,slot:i+1,maxHp:9999,hp:9999,atk:0,def:0,rng:0,exp:0,
      demon:0,boss:0,shield:0,air:0,alive:1,id:i,infect:0,stun:0,weak:0,
      taunt:0,thorn:0,evade:0,negShield:0,hide:0,deb:{}});
  });
  /* 바로 세워 준다 */
  h.slot=5; B.hand=B.hand.filter(x=>x.type!=="hero");
  onSummon(h); wanderCheck();
  h.mana=h.maxMana;
  say("연습장 — 허수아비는 반격하지 않습니다. 마나와 잠금은 턴마다 풀립니다.","t1");
  rollIntents(); sel=null; view="battle"; render();
}

const NL1=String.fromCharCode(10);

/* 가벼운 발걸음 — 대원이 가진 만큼 줄어든다 (최소 1) */
function moveTaint(){
  let cut=0;
  (run&&run.heroes||[]).forEach(h=>{ cut=Math.max(cut,(h.tag&&h.tag.stepCut)||0) });
  return Math.max(1,MOVE_TAINT-cut);
}
const near=(a,b)=>Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1;
function drawMap(app){
  const f=FIELDS[run.field], S=run.size;
  app.appendChild(el(`<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">

  { let br=null;
    for(let r=0;r<S;r++) for(let c=0;c<S;c++) if(run.grid[r][c].t==="boss") br={r:r,c:c};
    const dLeft=Math.max(0,(f.days||7)-run.day+1);
    const dir=br?((br.r<run.pos.r?"북":br.r>run.pos.r?"남":"")+(br.c<run.pos.c?"서":br.c>run.pos.c?"동":"")):"";

      <span class="hint">가까운 칸은 바로 이동 · 먼 칸을 누르면 갈 길을 먼저 보여 줍니다</span>
    </div>`)); }
  /* 고른 길 — 가기 전에 값을 먼저 알려 준다 */
  if(run.route){
    const rt=run.route, dst=run.grid[rt.to.r][rt.to.c];

      <span class="chip">활동량 ${rt.steps}</span>
      <span class="chip">${hrs}시간</span>

      <span class="grow"></span>
      <button class="go rgo">이 길로 간다</button>
      <button class="rno">취소</button>
    </div>`);

  if(run.route) run.route.path.forEach((p,i)=>{ rstep[p.r+"-"+p.c]=i+1 });

    const cell=run.grid[r][c], here=(run.pos.r===r&&run.pos.c===c);

${NODE[cell.t].label} · ${cell.waves}라운드\n${cell.style}\n${cell.loot}`;

    else if(here&&cell.t==="camp") d.onclick=()=>{ view="camp"; render() };
    else if(!here) d.onclick=()=>pickRoute(r,c);

/* 먼 칸까지 가는 가장 짧은 길.
   걸음 수가 먼저고, 걸음 수가 같다면 아직 볼일이 남은 구역을 밟지 않는 길을 고른다.
   (지나가다 상점이나 전장에 끌려 들어가지 않게 하려는 것) */
function routeTo(tr,tc){
  const S=run.size;
  if(tr<0||tc<0||tr>=S||tc>=S) return null;
  if(tr===run.pos.r&&tc===run.pos.c) return null;
  /* 그 칸을 밟는 게 성가신가 — 목적지는 밟는 게 목적이므로 세지 않는다 */
  const detour=(r,c)=>{
    if(r===tr&&c===tc) return 0;
    const t=run.grid[r][c];
    return (t.t!=="empty"&&!t.done)?1:0;
  };
  const INF=1e9, cost=[], prev=[];
  for(let r=0;r<S;r++){ cost.push(new Array(S).fill(INF)); prev.push(new Array(S).fill(null)) }
  cost[run.pos.r][run.pos.c]=0;
  const q=[{r:run.pos.r,c:run.pos.c}];
  const DIR=[[1,0],[-1,0],[0,1],[0,-1]];
  while(q.length){
    q.sort((a,b)=>cost[a.r][a.c]-cost[b.r][b.c]);
    const cur=q.shift();
    for(let i=0;i<4;i++){
      const r=cur.r+DIR[i][0], c=cur.c+DIR[i][1];
      if(r<0||c<0||r>=S||c>=S) continue;
      const nc=cost[cur.r][cur.c]+1000+detour(r,c);
      if(nc<cost[r][c]){ cost[r][c]=nc; prev[r][c]={r:cur.r,c:cur.c}; q.push({r:r,c:c}) }
    }
  }
  if(cost[tr][tc]>=INF) return null;
  const path=[]; let p={r:tr,c:tc}, guard=0;
  while(!(p.r===run.pos.r&&p.c===run.pos.c)){
    path.unshift(p); p=prev[p.r][p.c];
    if(!p||++guard>400) return null;
  }
  return {to:{r:tr,c:tc}, path:path, steps:path.length,
          pass:path.slice(0,-1).filter(x=>run.grid[x.r][x.c].t!=="empty"&&!run.grid[x.r][x.c].done).length};
}
/* 지도의 빈 칸에 새 구역을 놓는다 — 탐험가 · 무기 상인과 조우 */
function sprinkleCell(t,n,extra){
  const spots=[];
  for(let r=0;r<run.size;r++) for(let c=0;c<run.size;c++){
    if(run.grid[r][c].t!=="empty") continue;
    if(run.pos.r===r&&run.pos.c===c) continue;
    spots.push({r:r,c:c});
  }
  let put=0;
  for(let q=0;q<n&&spots.length;q++){
    const p=spots.splice(Math.floor(Math.random()*spots.length),1)[0];
    run.grid[p.r][p.c]=Object.assign({t:t},extra||{});
    put++;
  }
  return put;
}
function pickRoute(r,c){
  if(run.route&&run.route.to.r===r&&run.route.to.c===c){ run.route=null; render(); return }
  const rt=routeTo(r,c);
  if(!rt){ toast("그 칸으로 가는 길이 없습니다."); return }
  run.route=rt; SFX.play("tock"); render();
}
/* 고른 길을 한 칸씩 걸어간다. 습격·날이 바뀜·피할 수 없던 구역에서는 멈춘다. */
function walkRoute(){
  const rt=run.route; if(!rt) return;
  run.route=null;
  const path=rt.path.slice(), day0=run.day;
  view="map"; render();
  const step=()=>{
    if(!run||run.lost||view!=="map"||run.day!==day0) return;
    const p=path.shift(); if(!p) return;
    const cell=run.grid[p.r][p.c], last=!path.length, tired=run.act<=0;
    SFX.play("tock"); costPop(p.r,p.c,tired);
    run.pos={r:p.r,c:p.c};
    spend(1,1); addTaint(moveTaint());
    if(run.taint>=100||run.lost) return;
    if(run.day!==day0){ toast("길에서 날이 밝아 발길을 멈춥니다."); view="map"; render(); return }
    if(Math.random()<ambushChance(cell)){
      SFX.play("danger");
      startDungeon({t:"ambush",waves:1},null,null);
      ambushCard("인기척 하나 없는 자리입니다. 어둠 속에서 무언가 달려듭니다.");
      return;
    }
    if(last||(cell.t!=="empty"&&!cell.done)){
      if(!last) toast("가는 길에 있는 구역을 지나칠 수 없었습니다.");
      enterCell(p.r,p.c); return;
    }
    view="map"; render();
    setTimeout(step, Math.round(300*SPD));
  };
  step();
}
function nightDepth(){ return run.night?Math.max(0,run.time-18):0 }
/* 밤의 습격은 아무것도 없는 빈 칸에서만 일어난다.
   상점·쉼터·미지의 구역·전장에 도달했을 때는 볼일을 방해하지 않는다. */
function ambushChance(cell){
  if(!run.night||!cell||cell.t!=="empty") return 0;
  return Math.min(0.85, 0.45+nightDepth()*0.05);
}
function moveTo2(r,c){
  const cell=run.grid[r][c];
  const tired=run.act<=0;
  SFX.play("tock");                 /* 한 칸 = 한 시간. 초침이 넘어간다 */
  costPop(r,c,tired);
  run.route=null;
  run.pos={r:r,c:c};
  spend(1,1); addTaint(moveTaint());
  if(run.taint>=100) return;
  if(Math.random()<ambushChance(cell)){
    SFX.play("danger");
    startDungeon({t:"ambush",waves:1},null,null);
    /* 전장이 깔린 위에 얹는다 */
    ambushCard("인기척 하나 없는 자리입니다. 어둠 속에서 무언가 달려듭니다.");
    return;
  }
  enterCell(r,c);

/* 미지의 구역에 무엇이 있었나 — 이벤트가 대부분이지만 좌판이나
   버려진 제련소일 수도 있다. 제련소는 지금 쓸 수 있을 때만 나온다
   (재료 둘과 제련석이 없으면 헛걸음이니까). */
const UNKNOWN_ODDS={shop:0.18,forge:0.12};
function forgeReady(){
  const n=run.heroes.reduce((a,h)=>a+h.items.filter(i=>i.g==="파편"||i.g==="일반").length,0)
    +(run.bag||[]).filter(i=>i.g==="파편"||i.g==="일반").length;
  return n>=2&&(run.stone||0)>=5;
}
function unknownKind(){
  const x=Math.random();
  if(x<UNKNOWN_ODDS.shop) return "shop";
  if(x<UNKNOWN_ODDS.shop+UNKNOWN_ODDS.forge&&forgeReady()) return "forge";
  return "event";
}
function enterCell(r,c){
  const cell=run.grid[r][c];
  if(cell.done||cell.t==="empty"){ view="map"; render(); return }
  if(cell.t==="camp"){ view="camp"; render(); return }
  if(cell.t==="shop"||cell.t==="rest"||cell.t==="event"||cell.t==="forge"){
    spend(0.5,0);
    run.here={r:r,c:c};
    run.grid[r][c]={t:"empty"};      /* 한 번 들르면 사라진다 */
    const best=k=>Math.max(0,...run.heroes.map(h=>(h.tag&&h.tag[k])||0));
    if(cell.t==="shop"){
      run.shopKind=cell.weapon?"weapon":null;
      makeShop(); view="shop";
      setTimeout(()=>stepBanner(cell.weapon?"무 기 상 점":"상 점","진열대를 살펴봅니다"),40);
      const g=best("shopGold");
      if(g){ run.gold+=g; toast(`반가운 상인 — 금화 +${g}`) }
    }
    else if(cell.t==="rest"){ view="rest";
      setTimeout(()=>stepBanner("쉼 터","잠깐 몸을 누입니다"),40);
      const v=best("restHeal");
      if(v){ run.heroes.forEach(h=>{ if(!h.down) healUp(h,v) });
        toast(`반가운 휴식 — 대원들이 체력을 ${v} 회복했습니다.`) }
    }
    else if(cell.t==="forge"){ run.forgePick=[]; view="forge";
      setTimeout(()=>stepBanner("제 련 소","장신구 두 개를 합칩니다"),40);
    }
    else {
      const k=unknownKind();
      if(k==="shop"){ run.shopKind=null; makeShop(); view="shop";
        setTimeout(()=>stepBanner("뜻 밖 의 상 점","길가에 좌판이 펼쳐져 있습니다"),40) }
      else if(k==="forge"){ run.forgePick=[]; view="forge";
        setTimeout(()=>stepBanner("버 려 진 제 련 소","불씨가 아직 살아 있습니다"),40) }
      else { run.ev=pickEvent(); run.evMsg=null; view="relic";
        setTimeout(()=>stepBanner("미 지 의 구 역","무슨 일이 기다리고 있을까요"),40) }
      if(cell.boon){ addTaint(-cell.boon);
        toast(`탐험가 — 길이 트이며 오염도가 ${cell.boon} 낮아집니다.`) }
    }
    render(); return;
  }
  if(cell.t==="dungeon"||cell.t==="elite"||cell.t==="boss"){
    startDungeon(cell,r,c);
    if(cell.t==="boss") bossCard(BOSSES[run.field]||"");   /* 전장이 깔린 위에 얹는다 */
    return;
  }
  view="map"; render();
}

      const i=run.forgePick.indexOf(key);

function recipeBook(){
  const box=el(`<div class="rcbook"><h4>조 합 표</h4></div>`);

    box.appendChild(el(`<div class="hint" style="margin-top:10px">${g} 장신구</div>`));

      const ok=it.rc.every(n=>have(n));
      box.appendChild(el(`<div class="rcrow" style="${ok?"color:var(--fg)":""}">
        <b>${esc(it.n)}</b>

}

function startDungeon(cell,r,c){
  run.heroes.forEach(h=>{ h.greed=0 });   /* 탐욕의 악마는 전투 단위 */
  run.dun={cell:cell,r:r,c:c,wave:0,waves:cell.waves||1,
           kind:cell.t==="boss"?"boss":cell.t==="elite"?"elite":cell.t==="ambush"?"ambush":"battle"};
  nextWave();
}
function nextWave(){
  run.dun.wave++;
  spend(1,0);
  startBattle(run.dun.kind);
}
function dungeonCleared(){
  const d=run.dun;
  run.heroes.forEach(h=>{ const w=itemBt(h,"winHeal");
    if(w&&!h.down) healUp(h,Math.round(h.maxHp*w/100)) });
  if(run.synSupport){ const v=run.synSupport;
    run.heroes.forEach(h=>{ if(!h.down) healUp(h,v) });
    toast(`지원가 — 모든 대원이 체력을 ${v} 회복했습니다.`); }
  if(d.kind!=="ambush"&&d.r!=null&&run.grid[d.r]&&run.grid[d.r][d.c])
    run.grid[d.r][d.c]={t:"empty"};
  addTaint(d.kind==="ambush"?-10:-20);
  { /* 오염 구역 정화 */
    const c=Math.max(0,...run.heroes.map(h=>(h.tag&&h.tag.clearTaint)||0));
    const g=Math.max(0,...run.heroes.map(h=>(h.tag&&h.tag.clearGold)||0));
    if(c) addTaint(-c);
    if(g) run.gold+=g;
    if(c||g) toast(`오염 구역 정화 — 오염도 ${c} 감소 · 금화 +${g}`);
  }
  /* 파편 상자 — 다음 몇 번의 보상 상자에 파편을 확정으로 얹는다 */
  if(run.shardBox>0){
    run.shardBox--;
    (run.after=run.after||[]).push({item:rnd(ITEMS.filter(i=>i.g==="파편"))});
    toast(`파편 상자 — 파편 하나가 딸려 나옵니다. (남은 ${run.shardBox}번)`);
  }
  if(d.kind==="boss") run.bossDone=1;
  openChest(d.kind);
}

function rollChest(kind){
  const T=[CHEST,CHEST2,CHEST3][Math.min(run.field,2)][kind]||CHEST.battle;
  const out=[];
  T.forEach(row=>{
    const type=row[0], lo=row[1], hi=row[2], p=row[3];
    let n=0;
    if(p>=1) n=Math.floor(p); else if(Math.random()<p) n=1;
    for(let i=0;i<n;i++){
      if(type==="금화") out.push({t:"금화",v:lo+Math.floor(Math.random()*(hi-lo+1))});
      else if(type==="경험치") out.push({t:"경험치",v:lo+Math.floor(Math.random()*(hi-lo+1))});
      else out.push({t:type});
    }
  });
  return out;
}
function openChest(kind){
  run.chest={kind:kind,list:rollChest(kind),idx:0,opened:0};
  view="chest"; render();
}

function takeChest(){
  const ch=run.chest, later=[];
  const isBoss=(ch.kind==="boss");
  let exp=0;
  ch.list.forEach(x=>{
    if(x.t==="금화"){
      const base=x.v, mul=run.goldMul||1;
      const got=Math.round(base*mul);
      run.gold+=got;
      SFX.play("coin");
      if(mul>1) toast(`죄악의 목걸이 — 금화 ${base} → ${got} (+${Math.round((mul-1)*100)}%)`);
    }
    else if(x.t==="경험치") exp+=x.v;
    else if(x.t==="파편"||x.t==="일반") later.push({item:rnd(ITEMS.filter(i=>i.g===x.t))});
    else if(x.t==="동료") later.push({recruit:1});
    else later.push({grade:x.t,noRun:isBoss?1:0});
  });
  run.chest=null;
  run.after=(run.after||[]).concat(later);   /* 남아 있던 뒷일을 지우지 않는다 */
  if(exp) giveExp(exp,run.heroes.filter(h=>!h.down&&h.joined!==0));
  if(isBoss&&run.pendingLv) run.pendingLv.forEach(x=>x.noRun=1);
  afterChest();
}
function afterChest(){
  const q=run.after||[];
  if(!q.length){
    run.after=null;
    /* 상점에서 시작된 줄이었다면 상점으로 돌려보낸다 */
    const b=run.afterBack; run.afterBack=null;
    if(b==="shop"){ view="shop"; render(); return }
    backToMap(); return;
  }
  const nx=q.shift();
  if(nx.item){ pending={stage:"hero",list:[],item:nx.item,hero:null,back:"chain"}; view="item"; render(); return }
  if(nx.recruit){
    const owned=run.heroes.map(x=>x.name);
    const pool=playableHeroes().filter(n=>!owned.includes(n));
    run.heroOffer=[];
    while(run.heroOffer.length<3&&pool.length)
      run.heroOffer.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
    /* 합류할 사람이 아무도 없으면 빈 화면을 띄우지 않고 그냥 넘어간다 */
    if(!run.heroOffer.length){ afterChest(); return }
    view="recruit"; render(); return;
  }
  pending={hero:null,grade:nx.grade,free:1,back:"chain",noRun:nx.noRun||0}; view="reward"; render();
}
function backToMap(){
  /* 아직 처리하지 못한 뒷일이 남아 있으면 그것부터 */
  if((run.after||[]).length){ afterChest(); return }
  if(run.pendingLv&&run.pendingLv.length){
    const q=run.pendingLv; run.pendingLv=null;
    pending={queue:q,idx:0}; view="reward"; render(); return;
  }
  if(run.bossDone){ run.bossDone=0; run.dun=null; nextField(); return }
  run.dun=null;
  if(run.pendingEnter){
    const e=run.pendingEnter; run.pendingEnter=null;
    toast("습격을 물리치고 다시 걸음을 옮깁니다.");
    enterCell(e.r,e.c); return;
  }
  view="map"; render();
}

/* 대원들이 왼쪽으로 빠져나간다 — 도망 */
function fleeFX(word){
  const side=document.getElementById("mySide");
  if(side) side.querySelectorAll(".slot").forEach((d,i)=>{
    const art=d.querySelector(".art");
    if(!art) return;
    art.style.transition="transform .55s cubic-bezier(.4,0,.7,1),opacity .55s ease";
    setTimeout(()=>{ art.style.transform="translateX(-120px)"; art.style.opacity="0" },i*70);
  });
  const f=document.querySelector(".field");
  const r=f?f.getBoundingClientRect():{left:0,width:innerWidth,top:innerHeight/2};
  const nd=el(`<div class="fleeword">${esc(word||"도망쳤습니다")}</div>`);
  document.body.appendChild(nd);
  nd.style.left=(r.left+r.width/2)+"px";
  nd.style.top =(r.top+40)+"px";
  setTimeout(()=>nd.remove(),1200);
}
/* 전투를 접고 빠져나온다 — 이긴 것도 진 것도 아니어서 보상도 벌도 없다 */
function fleeBattle(toCamp,msg){
  if(B) B.over=1;
  B=null; BSNAP=null; sel=null;
  run.dun=null; run.pendingEnter=null; run.here=null; run.route=null;
  if(toCamp){
    let c=null;
    for(let r=0;r<run.size;r++) for(let q=0;q<run.size;q++)
      if(run.grid[r][q].t==="camp") c={r:r,c:q};
    if(c) run.pos=c;
    view=c?"camp":"map";
  } else view="map";
  toast(msg);
  render();
}

function addCard(r,name,n){
  const e=(r.cards=r.cards||[]).find(x=>x.n===name);
  if(e) e.c=Math.min(10,e.c+n); else if(r.cards.length<10) r.cards.push({n:name,c:Math.min(10,n)});
}
function useCard(name){
  const e=(run.cards||[]).find(x=>x.n===name);
  if(!e) return;
  e.c--; if(e.c<=0) run.cards.splice(run.cards.indexOf(e),1);
}

/* ═══════════ 경험치 ═══════════ */
/* 사명감 — 트리스탄이 레벨업 대신 모으는 것. 둘마다 공격력 하나가 된다. */
function dutyGain(h,n){
  if(!h||!n) return;
  h.duty=(h.duty||0)+n;
  const want=Math.floor(h.duty/2), had=h.dutyAtk||0;
  if(want>had){ h.atk+=want-had; h.dutyAtk=want;
    if(typeof toast==="function") toast(`사명감 — ${h.name}의 공격력이 ${want-had} 올랐습니다.`) }
}
/* 레벨이 하나 오를 때 몸에 붙는 몫 — 여러 곳에서 부르므로 한곳에 모은다 */
function levelUp(h){
  h.lv++;
  h.maxHp+=h.hpLv; h.hp+=h.hpLv;
  if(h.name==="트리스탄") dutyGain(h,1+((h.tag&&h.tag.dutyPlus)||0));
}
function giveExp(exp,pool,each){
  pool=(pool&&pool.length)?pool:run.heroes.filter(h=>!h.down);
  if(!pool.length) pool=run.heroes.slice();
  if(each){
    const q0=run.pendingLv||[];
    pool.forEach(h=>{
      h.exp+=exp;
      while(h.lv<30&&h.exp>=needExp(h.lv)){
        h.exp-=needExp(h.lv); levelUp(h);
        q0.push({hero:h,lv:h.lv});
      }
    });
    run.pendingLv=q0;
    toast(`경험치 — ${pool.map(h=>h.name).join(" · ")} 각각 +${exp}`);
    return;
  }
  const w=pool.map(h=>1/Math.max(1,h.lv));
  const sum=w.reduce((a,b)=>a+b,0);
  const raw=w.map(x=>exp*x/sum);
  const got=raw.map(x=>Math.floor(x));
  let left=exp-got.reduce((a,b)=>a+b,0);
  raw.map((x,i)=>({i:i,f:x-Math.floor(x)})).sort((a,b)=>b.f-a.f)
     .forEach(o=>{ if(left>0){ got[o.i]++; left-- } });
  if(exp>0) got.forEach((g,i)=>{ if(g<1) got[i]=1 });
  const q=run.pendingLv||[];
  pool.forEach((h,i)=>{
    h.exp+=got[i];
    while(h.lv<30&&h.exp>=needExp(h.lv)){
      h.exp-=needExp(h.lv); levelUp(h);
      q.push({hero:h,lv:h.lv});
    }
  });
  run.pendingLv=q;
  toast(`경험치 — ${pool.map((h,i)=>h.name+" +"+got[i]).join(" · ")}`);
}

function sellItem(i){

  run.sellPick=null;
  const g=rr(pr);
  if(x.bag) run.bag.splice(x.i,1);
  else { const back=unequip(x.h,x.i,1); if(!back){ toast("벗길 수 없는 물건입니다."); return } }
  run.gold+=g;
  SFX.play("coin");
  toast(`${x.it.n}을 ${g} 금화에 팔았습니다.`);
  render();
}
function buy(g){
  if(run.gold<g.cost||g.left<=0) return;
  run.gold-=g.cost; g.left--;
  SFX.play("coin");
  if(g.k==="card"){ addCard(run,g.card,1); SFX.play("coin");
    toast(`${g.card} 카드를 얻었습니다.`); render(); return }
  if(g.k==="stone"){ run.stone=(run.stone||0)+1; render(); return }
  if(g.k==="act"){ run.act=Math.round(run.act)+3; toast("활동량을 3 얻었습니다."); render(); return }
  if(g.k==="taint"){ addTaint(-20); toast("오염도가 20 낮아졌습니다."); render(); return }
  if(g.k==="shard"||g.k==="normal"||g.k==="named"||g.k==="named2"){
    const it=g.item||rnd(ITEMS.filter(i=>i.g===(g.k==="normal"?"일반":"파편")));
    pending={stage:"hero",list:[],item:it,hero:null,back:"shop"};
    view="item"; render(); return;
  }
  pending={hero:null,grade:g.k,free:1,back:"shop"}; view="reward"; render();
}

    if(view!=="over"){ run.here=null; toast("모닥불 곁에서 밤을 보냈습니다."); view="map"; render() } };
  row.appendChild(a); row.appendChild(b); row.appendChild(c);
  wrap.appendChild(row);
}

/* 팔 수 있는 물건 — 벗을 수 없는 것(죄악의 목걸이 등)은 뺀다.
   화면을 그릴 때와 실제로 팔 때가 같은 목록을 봐야 번호가 어긋나지 않는다. */
function sellList(){ return ownedItems().filter(x=>!x.it.bind) }
function ownedItems(){
  const out=[];
  run.heroes.forEach(h=>(h.items||[]).forEach((it,i)=>out.push({it:it,h:h,i:i})));
  (run.bag||[]).forEach((it,i)=>out.push({it:it,bag:1,i:i}));

}
const hasGrade=g=>ownedItems().some(x=>x.it.g===g);
function takeGrade(g){

function pickEvent(){

/* 룰렛 칸 — 예전에는 글자 줄이었다. {t:설명, s:짧은 이름, c:색} 을 쓰되
   옛 형태(문자열)도 그대로 받아 준다. */
const wheelSlot=w=>(typeof w==="string")
  ? {t:w, s:(w.split("—")[0]||w).replace(/칸\s*$/,"").trim(), c:"#9c8d77"}
  : w;
function wheelArc(i,n,r0,r1){
  const step=360/n;
  const a0=(i*step-90)*Math.PI/180, a1=((i+1)*step-90)*Math.PI/180;
  const X=(r,a)=>(r*Math.cos(a)).toFixed(2), Y=(r,a)=>(r*Math.sin(a)).toFixed(2);
  const big=step>180?1:0;
  return `M${X(r1,a0)} ${Y(r1,a0)} A${r1} ${r1} 0 ${big} 1 ${X(r1,a1)} ${Y(r1,a1)}`
       + ` L${X(r0,a1)} ${Y(r0,a1)} A${r0} ${r0} 0 ${big} 0 ${X(r0,a0)} ${Y(r0,a0)} Z`;
}
/* 바늘이 i번 칸을 가리키는 각도 (12시에서 시계 방향).
   판을 돌리면 글자가 같이 누워 읽히지 않으므로 바늘 쪽을 돌린다. */
function wheelTurn(i,n,laps){ return (laps||0)*360 + (i*(360/n) + 180/n) }
function rouletteHTML(e,hit){
  const W=e.wheel.map(wheelSlot), n=W.length, step=360/n;
  let sl="", tx="";
  W.forEach((w,i)=>{
    sl+=`<path class="sl${hit===i?" win":""}" d="${wheelArc(i,n,32,96)}" fill="${w.c}"/>`;
    const a=(i*step+step/2-90)*Math.PI/180, r=66;
    /* 글자는 눕히지 않는다 — 판이 돌 때는 같이 돌지만 멈추면 똑바로 읽힌다 */
    tx+=`<text class="sx${hit===i?" win":""}" x="${(r*Math.cos(a)).toFixed(1)}" y="${(r*Math.sin(a)).toFixed(1)}"`
      + `>${esc(w.s)}</text>`;
  });
  /* 이미 결과가 나온 뒤라면 바늘을 당첨 칸에 세워 둔 채로 그린다 */
  const seat=(hit!=null)?` style="transform:rotate(${wheelTurn(hit,n,0)}deg)"`:"";
  return `<div class="rltbox"><div class="rlt${hit!=null?" landed":""}">
    <svg class="rltdisc" viewBox="-104 -104 208 208">
      <circle class="rim" r="100"/>
      ${sl}${tx}
      <g class="turn"${seat}>
        <path class="ndl" d="M0 -92 L7 -22 L0 -12 L-7 -22 Z"/>
        <circle class="ndlp" cy="-92" r="4"/>
      </g>
      <circle class="hub" r="22"/><circle class="hub2" r="15"/>
    </svg>
  </div>
  <div class="wheel">${W.map((w,i)=>`<div class="wr ${hit===i?"hit":""}">
    <i style="color:${w.c}">${hit===i?"▶":"●"}</i><span>${esc(w.t)}</span></div>`).join("")}</div></div>`;
}
function spinRoulette(e,msg){
  run.evSpin=1; render();
  const n=e.wheel.length, target=run.evRoll;
  const g=document.querySelector(".rltdisc .turn");   /* 도는 바늘 */
  if(!g){ run.evSpin=0; run.evMsg=msg; render(); return }
  const SPIN=3000, laps=5;
  const end=wheelTurn(target,n,laps);
  /* 갓 붙인 요소라 브라우저가 아직 처음 상태를 굳히지 않았다.
     한 번 재어 굳혀 두고 나서 각도를 주어야 전환이 걸린다.
     (requestAnimationFrame 은 창이 뒤에 있을 때 아예 돌지 않는다) */
  void g.getBoundingClientRect();
  g.style.transition=`transform ${SPIN}ms cubic-bezier(.12,.62,.12,1)`;
  g.style.transform=`rotate(${end}deg)`;
  /* 바늘이 칸을 넘을 때마다 딸깍 — 끝으로 갈수록 뜸해진다 */
  const ease=t=>1-Math.pow(1-t,3.4);          /* 위 cubic-bezier 를 대충 흉내낸다 */
  const total=n*laps+target;
  for(let k=1;k<=total;k++){
    let lo=0, hi=1;
    for(let q=0;q<24;q++){ const m=(lo+hi)/2; if(ease(m)*total<k) lo=m; else hi=m }
    setTimeout(()=>SFX.play("tick"), Math.round(lo*SPIN));
  }
  setTimeout(()=>{
    const d=document.querySelector(".rlt"); if(d) d.classList.add("landed");
    SFX.play("unlock");
    pulseAll();
  }, SPIN+30);
  setTimeout(()=>{ run.evSpin=0; run.evMsg=msg; render() }, SPIN+900);
}

/* 상황 문구 — 따옴표로 묶인 곳은 대사다.
   줄을 따로 잡아 가운데에 크게 놓고 빛나게 해서 눈이 먼저 가게 한다. */
function evText(t){
  const QUOTE=/^['\u2018\u201c\u300c](.+)['\u2019\u201d\u300d]$/;
  return String(t||"").split("\n").map(line=>{
    const s=line.trim();
    if(!s) return "";
    const m=s.match(QUOTE);
    if(m) return `<div class="evsay">${rich(m[1])}</div>`;
    /* 줄 가운데 섞인 대사도 굵게 */
    return `<p class="evp">${rich(s).replace(/'([^']{1,80})'/g,
      '<em class="evq">\u2018$1\u2019</em>')}</p>`;
  }).join("");
}
/* 이 선택으로 들을 대사 — 선택지에 적힌 것이 먼저, 없으면 이벤트 것 */
const evSay=(e,o)=>(o&&o.say)||(e&&e.say)||"";
/* 결과 화면의 대사는 그 자체가 대사다. 따옴표가 없어도 대사 줄로 놓는다. */
function evSayHtml(t){
  return String(t||"").split("\n").map(s=>{
    s=s.trim(); if(!s) return "";
    const m=s.match(/^['\u2018\u201c\u300c](.+)['\u2019\u201d\u300d]$/);
    return `<div class="evsay">${rich(m?m[1]:s)}</div>`;
  }).join("");
}

const SLOTS=5;
const UNLOCK=[1,1,7,15];   // 3번 기술 7레벨, 궁극기 15레벨 (기획노트)
const dist=(a,e)=>(SLOTS-a)+e;   /* 아군 a번, 적 e번 · 아군 5번과 적 1번이 거리 1 */
function foeSet(kind){
  const f=Math.min(run.field,2), pool=FIELD_FOES[f], out=[];
  const n=run.heroes.length;
  if(kind==="boss"){
    out.push([BOSSES[f],1]);
    const extra=Math.min(2,Math.max(0,n-1));
    for(let i=0;i<extra;i++) out.push([rnd(pool),2+i]);
    return out;
  }
  if(kind==="elite"){
    /* 정예는 대원 수 제한을 덜 받고, 앞자리에 가장 단단한 놈이 선다 */
    const k=Math.max(2,Math.min(4,n+1));
    const lead=pool.slice().sort((a,b)=>FOE[b].hp-FOE[a].hp)[0];
    out.push([lead,1]);
    for(let i=2;i<=k;i++) out.push([rnd(pool),i]);
    return out;
  }
  const base=2+Math.floor(Math.random()*2);
  const k=Math.max(1,Math.min(base,n+1));
  for(let i=1;i<=k;i++) out.push([rnd(pool),i]);
  return out;
}
/* 대원이 강해진 만큼 적도 따라온다 */
function partyPower(){
  if(!run||!run.heroes.length) return 1;
  const n=run.heroes.length;
  const lv=run.heroes.reduce((a,h)=>a+h.lv,0)/n;
  const st=run.heroes.reduce((a,h)=>a+h.atk+h.mag+h.def,0)/n;
  const hp=run.heroes.reduce((a,h)=>a+h.maxHp,0)/n;
  return 1+(lv-1)*0.11+st*0.012+Math.max(0,hp-22)*0.006;
}
/* ── 난이도 배수 두 가지 ─────────────────────────────────────────────
   FIELD_MULT  구역이 바뀔 때 한 번 밟는 계단. 구역 안에서는 움직이지 않는다.
   FIELD_GROW  한 구역 안에서 하루·라운드마다 붙는 몫.
   구역 안 성장(l)은 구역마다 0에서 다시 시작한다 — nextField 가 run.day 를
   1로 되돌리기 때문이다. 그래서 '1구역 적끼리 같은 난이도, 2구역 적끼리 같은
   난이도' 는 이미 지켜지고 있고, 구역 사이를 잇는 것은 계단 하나뿐이다.
   구역마다 적을 따로 적어 넣어 세기를 손으로 잡게 되면
   FIELD_MULT 를 [1,1,1] 로 낮추면 계단이 사라진다. */
const FIELD_MULT=[1, 1.5, 2];
const FIELD_GROW=0.07;
function fieldMult(f){ return FIELD_MULT[Math.min(f, FIELD_MULT.length-1)] }
function foeScale(kind){
  /* 필드가 바뀌는 순간 적이 한꺼번에 세지지 않게 한다.
     예전에는 필드마다 +85% 라 2스테이지 첫날에 벽을 만났다.
     필드 몫을 +50% 로 낮추고, 그만큼을 하루하루(l)로 옮겨
     한 필드 안에서 천천히 오르게 했다.
       필드1 끝 1.42 → 필드2 첫날 1.50  (예전 1.30 → 1.85) */
  const f=run.field, l=(run.day-1)+(run.dun?run.dun.wave-1:0), n=Math.min(run.heroes.length,5);
  let m=fieldMult(f)*(1+l*FIELD_GROW)*partyPower();
  if(kind==="elite")  m*=1.32;
  if(kind==="boss")   m*=1.45;
  if(kind==="ambush") m*=1.3+nightDepth()*0.08;
  /* 대원이 적을수록 적도 약해진다 */
  const hpP =[0,0.68,0.86,1,1.08,1.15][n];
  const atkP=[0,0.58,0.82,1,1.06,1.12][n];

function intentKey(o){
  if(!o) return "";
  if(o.t==="atk") return "atk:"+(o.pat||"")+(o.hits||1);
  if(o.t==="deb") return "deb:"+o.k;
  if(o.t==="purge") return "purge:"+o.k;
  return o.t;
}
function rollIntents(){
  const USED={};
  /* 은신 — 전장에 혼자 남으면 숨을 곳이 없다 */
  if(allUnits().length<=1) allUnits().forEach(a=>{ if(a.hide){ a.hide=0;
    say(`${a.name}${jo(a.name,"eun")} 혼자 남아 은신이 풀립니다.`,"t2") } });
  let allies=allUnits();
  const seen=allies.filter(a=>!a.hide);
  if(seen.length) allies=seen;
  const open=allies.filter(canAim);
  if(open.length) allies=open;
  B.foes.forEach(f=>{
    if(!f.alive) return;
    if(run&&run.sandbox){ f.intent={t:"wait"}; return }
    if(f.isPhantom){ f.intent={t:"wait"}; return }
    if(!allies.length){ f.intent={t:"wait"}; return }
    if(f.forceDef){ f.forceDef=0; f.intent={t:"def",v:defVal(f)}; return }
    if(deb(f,"fear")&&f.fearSrc){
      const brave=allies.filter(a=>uid(a)!==f.fearSrc);
      if(brave.length) allies=brave;
    }
    const inR=allies.filter(a=>dist(a.slot,f.slot)<=f.rng);
    const far=!inR.length;
    if(far){
      /* 먼저 거리를 좁혀 본다 */
      if(f.slot>1&&!foeAt(f.slot-1)&&Math.random()<0.55){ f.intent={t:"move"}; return }
      if(f.slot>1&&foeAt(f.slot-1)&&Math.random()<0.4){ f.intent={t:"push"}; return }
      /* 다가갈 수 없어도 손 놓고 있지는 않는다 — 무리해서 노린다 */
    }else{
      /* 원거리형은 붙으면 물러선다 */
      const RET=((FOE[f.name]&&FOE[f.name].ai)||{}).ret||0;
      if(RET&&dist(inR[0].slot,f.slot)<=1&&f.slot<SLOTS&&!foeAt(f.slot+1)&&Math.random()<RET){
        f.intent={t:"back"}; return;
      }
    }
    const T=far?allies:inR;
    const pool=[], add=(o,w)=>{ for(let q=0;q<(w||0);q++) pool.push(o) };
    const near=T.reduce((a,b)=>dist(a.slot,f.slot)<=dist(b.slot,f.slot)?a:b);
    const weak=T.reduce((a,b)=>a.hp<=b.hp?a:b);
    const back=T.reduce((a,b)=>a.slot>=b.slot?a:b);
    const any =rnd(T);
    /* 사거리 밖이면 무리하게 뻗느라 위력이 준다 */
    const FM=far?0.7:1, FP=far?"무리한 ":"";
    const dv=x=>Math.max(1,Math.round(x*FM));
    const D=(FOE[f.name]&&FOE[f.name].ai)||{};
    const EL=(FOE[f.name]&&FOE[f.name].el)||"공격";
    const A=Object.assign({near:8,weak:4,back:2,any:2,def:1,volley:0,buff:0,heal:2,curse:1,debs:["burn"]},D);
    const hit=(FOE[f.name]&&FOE[f.name].hit)||"내려찍기";
    add({t:"atk",v:dv(f.atk),to:near.slot,pat:FP+hit,el:EL,far:far},A.near);
    add({t:"atk",v:dv(f.atk*1.35),to:weak.slot,pat:FP+"약점 노리기",el:EL,far:far},A.weak);
    add({t:"atk",v:dv(f.atk),to:back.slot,pat:FP+"후방 급습",el:EL,far:far},A.back);
    add({t:"atk",v:dv(f.atk),to:any.slot,pat:FP+"난타",el:EL,far:far},A.any);
    /* 연타 — 같은 총량을 여러 번에 나눠 때린다. 가시·갑피·공격 강화가 크게 작용한다 */
    { const n3=3, p3=Math.max(1,Math.round(f.atk*FM/n3));
      add({t:"atk",v:p3,hits:n3,to:near.slot,pat:FP+"연타",el:EL,far:far},Math.max(2,Math.round(A.near*0.4)));
      const n2=2, p2=Math.max(1,Math.round(f.atk*1.2*FM/n2));
      add({t:"atk",v:p2,hits:n2,to:weak.slot,pat:FP+"쌍격",el:EL,far:far},Math.max(1,Math.round(A.weak*0.4))); }
    add({t:"def",v:defVal(f)},far?A.def+1:A.def);
    if(!f.thorn) add({t:"thorn",v:Math.max(2,Math.round(2+run.field*1.5)),turns:3},A.thorn||0);
    add({t:"volley",v:dv(f.atk*0.6),el:EL},far?A.volley+2:A.volley);
    if((f.buffs||0)<3) add({t:"buff",v:Math.max(1,Math.round(f.atk*0.35))},A.buff);
    const mate=B.foes.filter(x=>x.alive&&x!==f&&x.hp<x.maxHp*0.6)[0];
    if(mate) add({t:"heal",v:Math.max(2,Math.round(f.def*0.8)),to:mate.id},A.heal);
    add({t:"curse"},A.curse);
    /* ── 우두머리는 몸에 걸린 것을 떨쳐낸다 ──
       걸린 게 많을수록 그쪽을 고를 확률이 크게 오르고,
       깨끗할 때는 미리 부정 보호막을 둘러 다음 것을 막는다. */
    if(f.boss){
      const ail=foeAil(f);
      if(ail>0){
        add({t:"purge",k:"shake"}, 4+Math.min(14,ail*3));
        add({t:"purge",k:"roar",v:Math.max(1,Math.round(f.atk*0.15))}, 3+Math.min(10,ail*2));
      }
      if((f.negShield||0)<4)
        add({t:"purge",k:"ward",v:2+Math.floor(run.field/2)}, ail>0?3:7);
    }
    /* 이 적만의 상태 이상 */
    (A.debs||[]).forEach(k=>{
      const to=(k==="shock"||k==="fear")?back.slot:(k==="stun"?weak.slot:near.slot);
      const v={burn:2,bind:2,stun:1,fear:1,shock:3,chill:3,atkDn:2,magDn:2}[k]||1;
      add({t:"deb",k:k,to:to,v:v,el:EL},far?1:2);
    });
    /* 이미 같은 행동을 고른 적이 있으면 다른 것을 우선한다 */
    let best=null;
    for(let t=0;t<4;t++){
      const c=rnd(pool), k=intentKey(c);
      const n=USED[k]||0;
      if(!n||Math.random()<1/(1+n*1.6)){ best=c; break }
      if(!best) best=c;
    }
    USED[intentKey(best)]=(USED[intentKey(best)]||0)+1;
    f.intent=best;
  });
}

  if(!force&&Math.random()>rate) return;

  const p=ctrOf(foe?"foe":"mine",u.slot);
  if(!p) return;
  const nd=spawn('<div class="bark'+(foe?" f":"")+'">'+esc(rnd(P))+'</div>');
  if(!nd) return;
  nd.style.left=p.x+"px";
  nd.style.top=(p.y-58)+"px";
}

  if(I.t==="volley"){
    const e=foeDmg(f,I.v,I.el);
    return `<span class="intent${e<I.v?" cut":""}" title="아군 전체${e<I.v?` · 약화로 ${I.v} → ${e}`:""}">${
      ic("atk")}<b>${e}</b>${e<I.v?`<s>${I.v}</s>`:""} 전체</span>`;
  }
  if(I.t==="atk"){
    const e=foeDmg(f,I.v,I.el);
    return `<span class="intent${e<I.v?" cut":""}" title="${
      esc((I.pat||"")+" · "+(I.el||"공격"))}${e<I.v?` · 약화로 ${I.v} → ${e}`:""}">${
      ic(I.el==="마법"?"mag":"atk")}<b>${e}</b>${e<I.v?`<s>${I.v}</s>`:""}${
      I.hits>1?`<span class="hits">×${I.hits}</span>`:""} <span class="tgt">→ ${I.to}번</span></span>`;
  }
  return `<span class="intent">대기</span>`;
}

function drawBattle(app){

  const canGo = n => !(sel && tgMode==="ally" && moveBlock(sel.hero,preSkill,n));
  const INC = incoming();
  const shOwner = allUnits().find(x=>x.shadowAt);
  const shMark = dk=>`<svg class="shmark" viewBox="0 0 24 24">`

      +`<path d="M12 3c3.2 3.4 4.4 6.4 4.4 8.6a4.4 4.4 0 0 1-8.8 0C7.6 9.4 8.8 6.4 12 3z" `
      +`fill="${dk?"#a06ae0":"#5f5070"}" opacity=".9"/></svg>`;
  for(let s=1;s<=SLOTS;s++){
    const h=unitAt(s);
    const body=h?null:bodyAt(s);
    const d=el(`<div class="slot ${h?"":(body?"body":"empty")}"><span class="no">${s}</span></div>`);
    d.dataset.slot=s;
    /* 카드를 들고 있는 동안에도 칸 안은 평소대로 그린다.
       놓을 자리 표시와 누름만 마지막에 덧씌운다 */
    const drop=(B.pick!=null&&!!B.hand[B.pick]);
    if(drop) d.classList.add("drop");
    if(body){
      d.innerHTML+=`<div class="art">${figure(body.name,"stun")}</div>
        <div class="nm">${esc(body.name)}</div>
        <div class="mini"><span class="chip on">쓰러짐</span></div>
        <div class="mini">${ic("hp")}0/${body.maxHp}</div>`;
      if(drop) d.onclick=()=>{ const k=B.pick; B.pick=null; playCard(k,s,"mine") };
      my.appendChild(d); continue;
    }
    if(shOwner&&shOwner.shadowAt===s) d.innerHTML+=shMark(shOwner.darkAt===s);
    if(moveStep&&s!==sel.hero.slot&&Math.abs(s-sel.hero.slot)<=2){
      d.classList.add("pick"); d.onclick=()=>shadowGoTo(s);
    }
    else if(h){
      if(sel&&sel.hero===h&&sel.step===2) d.classList.add("pick");
      if(tgMode==="self"&&sel.hero===h) d.classList.add("pick");
      if(tgMode==="ally"&&canGo(s)) d.classList.add("pick");
      /* 자기에게 거는 기술은 시전자 머리 위에 값을 띄운다 */
      if(tgMode&&sel.hero===h) d.innerHTML+=selfHitTag(h,preSkill,sel.count);
      d.innerHTML+=incHtml(h,INC[s]);
      const pm=B.portals&&B.portals.find(p=>p.side==="mine"&&p.slot===s);
      if(pm) d.innerHTML+=`<svg class="portal" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#a06ae0" stroke-width="2.5"/><circle cx="12" cy="12" r="3.5" fill="#a06ae0"/></svg>`;

      d.innerHTML+=`${h.isMin?"":gearRow(h)}<div class="res">${manaPips(h)}${heroRes(h)}${

        <div class="bar" data-hpk="${hpKey(h)}" data-hpv="${Math.max(0,h.hp/h.maxHp*100)}" data-hpn="${h.hp}"

          ${h.blessed?`<span class="chip on">축복</span>`:""}

          ${h.free?`<span class="chip on">무료${h.free}</span>`:""}
          ${h.isMin?`<span class="chip">소환물</span>`:""}
          ${h.negShield?`<span class="chip on">부정 보호막${h.negShield}</span>`:""}
          ${((h.tag&&h.tag.thorn)||0)+(h.thornTmp||0)?`<span class="chip on">가시${
            ((h.tag&&h.tag.thorn)||0)+(h.thornTmp||0)}</span>`:""}
          ${debChips(h)}

      d.onclick=()=>{
        if(tgMode==="ally"){ const why=moveBlock(sel.hero,preSkill,s);
          if(why){ say(why,"t2"); render(); return }

      };

    }else{
      if(selfPick&&tgMode!=="self"&&canGo(s)) d.classList.add("pick");
      d.onclick=()=>{
        if(tgMode==="ally"){ const why=moveBlock(sel.hero,preSkill,s);

    if(drop) d.onclick=()=>{ const k=B.pick; B.pick=null; playCard(k,s,"mine") };

  }
  for(let s=1;s<=SLOTS;s++){
    const f=foeAt(s);
    const d=el(`<div class="slot ${f?"":"empty"}"><span class="no">${s}</span>${
      preSkill&&f?`<span class="reach">거리 ${dist(sel.hero.slot,s)}</span>`:""}</div>`);

    const fdrop=(B.pick!=null&&!!B.hand[B.pick]);

    if(f){
      d.classList.add("foe");

  if(run.sandbox){

    const sb=el(`<div class="sandbar">

      <span class="grow"></span><button>도감으로</button></div>`);
    sb.querySelector("button").onclick=()=>{ B=null; run=null; view="codex"; render() };
    app.appendChild(sb);
    const KN=[["lv","레벨",1,30],["atk","추가 공격력",0,40],["mag","추가 마법력",0,40],

              ["mana","마나",0,20],["mom","추진력",0,30],["scale","성장력",0,60],
              ["ammo","탄알",0,20],["dark","어둠 조각",0,30],["negShield","부정 보호막",0,20]];
    const kb=el(`<div class="sandknobs"></div>`);
    KN.forEach(([k,label,lo,hi])=>{

        if(k==="lv"){ h0.lv=v } else h0[k]=v;
        if(k==="mana"&&v>h0.maxMana) h0.maxMana=v;

    sp.onclick=()=>setSpeed(SPD>=1); tr.appendChild(sp);

  if(sel&&sel.hero&&sel.step>=2&&sel.step<5){
    const sp=skillPanel(sel.hero);
    if(B.busy) sp.classList.add("waiting");   /* 연출이 흐르는 동안은 잠시 잠근다 */

  const hand=el(`<div class="hand" id="hand"></div>`);
  B.hand.forEach((c,i)=>{
    const kind=c.type==="hero"?"c-hero":c.type==="summon"?"c-min":"c-item";
    const card=el(`<div class="card ${kind} ${B.pick===i?"picked":""}" data-i="${i}">
      ${c.type==="hero"?`<div class="art">${figure(c.hero.name)}</div>

        <div class="cst">${ic("hp")}${c.hero.hp}/${c.hero.maxHp}${
          c.hero.atk?` ${ic("atk")}${c.hero.atk}`:""}${

          c.hero.def?` ${ic("def")}${c.hero.def}`:""}</div>`

    <span class="hint">${promptMsg()}</span>

      ?"다른 아군의 칸을 누르면 그 대원으로 바뀝니다 · Esc — 손패 보기"
      :"Esc — 선택 해제"}</span></div>`);
  app.appendChild(pr);
  const lg=el(`<div class="log" id="log"></div>`); app.appendChild(lg);
  B.log.forEach(x=>lg.insertAdjacentHTML("beforeend",`<div class="${x.c||""}">${x.t}</div>`));
  lg.scrollTop=lg.scrollHeight;
}
function promptMsg(){
  if(B.over) return "전투 종료";
  if(!sel) return "행동할 대원의 칸 번호를 누르세요.";
  const s=sel.hero.sk[sel.skill!=null?sel.skill:0];
  if(sel.step===2) return "기술 번호(1~4) · 클릭하면 1회 사용 · 같은 기술을 또 누르면 횟수가 늘어납니다";
  if(sel.step===3) return `${s.n} — 횟수를 누르세요 (1~9)`;

  return s.tg==="ally"?`${s.n} ×${sel.count} — 이동할 칸을 고르세요`
       +(isMoveSkill(s)&&!moveStayOk(sel.hero,s)?" (지금 칸은 고를 수 없습니다)":"")
       : s.tg==="any" ?`${s.n} ×${sel.count} — 아군 칸 또는 적 칸(빈 칸 포함)을 클릭하세요`
       : s.tg==="foe" ?`${s.n} ×${sel.count} — 적의 칸을 고르세요`
          +(reachOf(sel.hero,s)!=null?` (사거리 ${reachOf(sel.hero,s)})`:"")
          +" · 같은 기술을 또 누르면 횟수 +1" : "";
}
/* 보상으로 얻은 증가분 중 '그 순간의 상태'에 걸린 것들.
   딜 계산을 하려면 이것들이 기술 칸에 보여야 한다. */
function extraParts(h,sk,key){
  const out=[];
  if(!h||!sk) return out;
  const t=h.tag||{}, fst=h.first||{};
  if(key==="dmg"){
    if(h.name==="카제"&&sk.n==="진선풍도"&&h.windBuff)
      out.push({n:"산들바람",v:h.windBuff});
    if(h.name==="나이코스"&&sk.n==="베기"){
      if(h.cutGrow) out.push({n:"늘어가는 실력",v:h.cutGrow});
      if(t.firstCut&&fst.cut!==1) out.push({n:"처음은 날카롭게",v:t.firstCut+h.atk});
      if(t.guardThen&&h.guardStack) out.push({n:"준비 태세",v:t.guardThen*h.guardStack});
    }
  }
  if(key==="shield"){
    if(h.name==="나이코스"&&sk.n==="막기"&&t.firstGuard&&fst.guard!==1)
      out.push({n:"처음은 완벽하게",v:t.firstGuard+h.def});
  }
  return out;
}
/* 보호약화는 보호막과 회복을 절반으로 깎는다. 마지막에 걸린다. */
function weakCut(h,key,total){
  if(key!=="shield"&&key!=="heal") return 0;
  if(!deb(h,"defDn")) return 0;
  return total-Math.ceil(total*0.5);
}
function breakdown(h,sk,key){
  let total=sk[key]||0;
  const parts=[];
  modParts(sk,key).forEach(m=>{ total+=m.v; parts.push({n:m.n,v:m.v}) });
  if(key==="dmg"){
    const st=(sk.el==="마법")?{v:h.mag,n:"추가 마법력"}:{v:h.atk,n:"추가 공격력"};
    if(st.v){ total+=st.v; parts.push(st) }
  }
  if(key==="shield"&&h.def){ total+=h.def; parts.push({n:"추가 보호력",v:h.def}) }
  extraParts(h,sk,key).forEach(p=>{ total+=p.v; parts.push(p) });
  const cut=weakCut(h,key,total);
  if(cut){ total-=cut; parts.push({n:"보호약화",v:-cut}) }
  return {total:total,parts:parts};
}
/* ── 기획 노트 문장에 지금 값 넣기 ───────────────────────────────────────
   노트는 "피해를 3(추가 † ) 줍니다" 처럼 적혀 있다.
   † 공격력 · ¤ 보호력 · ∴ 마법력. 그 자리를 지금 나갈 값으로 바꾸고,
   무엇이 얼마나 얹혔는지 괄호로 풀어 준다. */
const NUM_SYM={"\u2020":["atk","추가 공격력"],"\u00a4":["def","추가 보호력"],
               "\u2234":["mag","추가 마법력"]};
const NUM_A="\u0001", NUM_B="\u0002", NUM_C="\u0003";
function liveVal(h,sk,key,base,syms){
  const parts=[]; let total=base;
  const own=!!(sk&&sk[key]===base);   /* 이 숫자가 그 기술의 본값인가 */
  if(own) modParts(sk,key).forEach(m=>{ total+=m.v; parts.push({n:m.n,v:m.v}) });
  const seen={};
  String(syms||"").split("").forEach(ch=>{
    const st=NUM_SYM[ch];
    if(!st||seen[ch]) return;
    seen[ch]=1;
    if(h[st[0]]){ total+=h[st[0]]; parts.push({n:st[1],v:h[st[0]]}) }
  });
  if(own) extraParts(h,sk,key).forEach(p=>{ total+=p.v; parts.push(p) });
  /* 보호약화는 기술 자신의 보호막·회복에만 걸린다 (코드가 그렇게 되어 있다) */
  const cut=own?weakCut(h,key,total):0;
  if(cut){ total-=cut; parts.push({n:"보호약화",v:-cut}) }
  return {total:total,parts:parts,own:own};
}
function keyBefore(pre){
  if(/에너지 보호막[을이]?\s*$/.test(pre)) return "eshield";
  if(/보호막[을이]?\s*$/.test(pre)) return "shield";
  if(/보호(량|력)[을이]?\s*$/.test(pre)) return "shield";
  if(/체력[을이]?\s*$/.test(pre)) return "heal";
  return "dmg";
}
/* 노트 문장 + 어떤 값을 이미 문장 안에서 보여 줬는지 */
function richLive(h,sk,txt){
  const done={};
  const marked=String(txt||"").replace(
    /(\d+)\(추가 ([\u2020\u00a4\u2234][\u2020\u00a4\u2234\u2261 ]*)([^)]*)\)/g,
    function(m,n,syms,rest,off,whole){
      const pre=whole.slice(Math.max(0,off-18),off);
      const key=keyBefore(pre);
      const r=liveVal(h,sk,key,+n,syms);
      if(r.own) done[key]=1;
      const bits=r.parts.map(p=>p.n+" "+(p.v>0?"+":"")+p.v);
      /* 기호로 못 적는 덧말은 그대로 남긴다 — 우리가 셈할 수 없는 몫이다 */
      const ex=String(rest||"").replace(/^[\s+]+/,"").trim();
      if(ex) bits.push(ex);
      return NUM_A+r.total+NUM_B+bits.join(" / ")+NUM_C;
    });
  const html=rich(marked).replace(/\u0001([^\u0002]*)\u0002([^\u0003]*)\u0003/g,
    (m,tot,brk)=>`<b class="big">${tot}</b>`+(brk?`<span class="brk">(${brk})</span>`:""));
  return {html:html, done:done};
}
function numHtml(h,sk,key){
  const b=breakdown(h,sk,key);
  const tail=b.parts.length
    ? `<span class="brk">(${b.parts.map(p=>icoify(esc(p.n))+" "+p.v).join(" / ")})</span>` : "";
  return `<b class="big">${b.total}</b>${tail}`;
}
function valueLines(h,sk,done){

  if(sk.justice) L.push(`지금 보호막 <b class="big">${h.shield}</b>만큼 피해를 줍니다.`);

  if(sk.rearguard) L.push(`체력 <b class="big">${h.tag.rearHeal||5}</b> · 지나친 아군 보호막 <b class="big">${5+h.def}</b>`);

function bk(base,parts){
  const list=parts.filter(p=>p.v);

    out.push({n:"어둠 조각",c:(h.dark||0)%3,m:3,done:false});
  if(h.name==="인비디아"&&B&&B.foes){
    const t=B.foes.filter(f=>f.alive).reduce((a,f)=>a+(f.infect||0),0);
    out.push({n:"감염 총합",c:t,m:Math.max(6,t),done:t>=6});

  if(h.bomb) out.push({n:"응축 폭발까지",c:3-h.bomb,m:2});

function progHtml(h){

/* 지금 이 기술이 평소보다 세게 나가는가 — 그 이유를 짧게 돌려준다 */
function skillHot(h,i,s){
  const out=[];
  if(!s||!B||B.over) return out;
  /* 카제 — 세 번째 진선풍도는 회오리가 된다 */
  if(h.name==="카제"&&s.n==="진선풍도"){
    const every=(h.potential&&h.tag.potentialEvery)||h.tag.windEvery||3;
    if(h.tag.alwaysStrong||(((h.windUses||0)+1)%every===0)) out.push("회오리");
    if(h.windBuff) out.push("바람 +"+h.windBuff);
    if(h.potential) out.push("잠재력");
  }
  if(h.name==="카제"&&s.el==="이동"&&h.free>0) out.push("무료 "+h.free);
  /* 도미니코 — 축복은 아래 세 기술을 실제로 바꾼다. 그 기술만 짚어 준다 */
  if(h.blessed){
    if(s.wand)    out.push("축복 · 회피 +1");
    else if(s.weaken)  out.push("축복 · 보호력도 약화");
    else if(s.shackle) out.push("축복 · 모든 적 기절");
    /* 참회의 기류처럼 축복이 실제로 바꾸지 않는 기술은 켜지 않는다 */
  }
  /* 이테리오 — 표식이 박힌 적에게 공격 계열은 치명타 */
  if(h.name==="이테리오"&&s.tg==="foe"&&s.el!=="마법"
     &&B.foes.some(f=>f.alive&&(f.mark||0)>0)) out.push("표식 치명타");
  /* 그슨대 */
  if(h.hide&&s.tg==="foe") out.push("은신");
  if(h.shadowAt&&(s.shadow||s.leech)) out.push("그림자");
  /* 공통으로 얹히는 것 */
  if(h.leech&&s.tg==="foe") out.push("흡수");
  if(h.pierceNext&&s.tg==="foe") out.push("관통");
  /* 트리스탄 — 매 턴 첫 단총 사격 */
  if(s.ammo&&h.tag.headshot&&!h.headshotUsed) out.push("헤드샷");
  /* 나이코스 — 그 전투 첫 막기 */
  if(h.tag.firstGuard&&s.shield&&h.first&&h.first.guard!==1)
    out.push("첫 막기 +"+h.tag.firstGuard);
  /* 처세술 — 막기 뒤의 베기는 공짜 */
  if(h.tag.freeCut&&i===0&&h.guarded) out.push("무료");
  if(i===0&&h.name==="트리스탄"&&(h.shotFree||0)>0) out.push("무료");
  if(h.tag.guardThen&&h.guardStack&&s.tg==="foe") out.push("연격 +"+h.tag.guardThen*h.guardStack);
  return out;
}

/* ─ 비용 ─ */
function reachOf(h,sk){
  if(!sk) return null;
  if(h.name==="카제"&&sk.n==="진선풍도"){
    if(h.tag.noRange) return null;
    const every=(h.potential&&h.tag.potentialEvery)||h.tag.windEvery||3;
    const strong=h.tag.alwaysStrong||(((h.windUses||0)+1)%every===0);
    return (strong?3:sk.rng)+(h.windBuff||0);
  }
  return sk.rng||null;
}
function inReach(h,sk,slot){
  const r=reachOf(h,sk);
  return r==null || dist(h.slot,slot)<=r;
}
function farthestFoe(h){
  const p=openFoes(), q=p.length?p:B.foes.filter(f=>f.alive);
  return q.sort((a,b)=>dist(h.slot,b.slot)-dist(h.slot,a.slot))[0];
}
function nearestFoe(h){
  const p=openFoes(), q=p.length?p:B.foes.filter(f=>f.alive);
  return q.sort((a,b)=>dist(h.slot,a.slot)-dist(h.slot,b.slot))[0];
}
function pinnedFoe(h,sk){
  if(!sk) return null;
  if(sk.farshot) return (h.tag&&h.tag.nearShot)?nearestFoe(h):farthestFoe(h);
  if(sk.nearest) return nearestFoe(h);
  return null;
}
function validTarget(h,sk,slot){
  if(!inReach(h,sk,slot)) return false;
  { const f2=foeAt(slot);
    if(f2&&foeBlockReason(f2)) return false; }
  if(deb(h,"fear")){ const f2=foeAt(slot); if(f2&&uid(f2)===h.fearSrc) return false }
  const p=pinnedFoe(h,sk);
  if(p) return p.slot===slot;
  return true;
}
function payCost(h,i){
  const s=h.sk[i];
  if(h===0) return s.cost;
  if(s.costType==="mom") return s.cost+(s.rise?h.airUp:0);
  if(s.costType==="scale") return s.cost;
  if(h.name==="카제"&&i===1&&h.free>0) return 0;
  if(h.tag.freeCut&&i===0&&h.guarded) return 0;
  if(i===0&&h.name==="트리스탄"&&(h.shotFree||0)>0) return 0;
  return s.cost;
}
function canPay(h,i,n){
  const s=h.sk[i];
  if(s.limit&&(h.limitUsed[i]||0)+n>s.limit) return false;
  if(s.costType==="mom"){
    if(!s.rise) return h.mom>=s.cost*n;
    let need=0,up=h.airUp; for(let k=0;k<n;k++){need+=s.cost+up;up++} return h.mom>=need }
  if(s.costType==="scale") return (h.scale||0)>=s.cost*n;
  if(s.ammo) return (h.ammo||0)>=n;
  let need=0,free=h.free,guard=h.guarded;
  /* 헥토 — 선두 방어 뒤의 방패 막기, 후미 준비 뒤의 방패 밀치기는 한 번 공짜 */
  let fb=(h.freeBlock&&s.n==="방패 막기")?1:0;
  let fp=(h.freePush&&s.n==="방패 밀치기")?1:0;
  /* 트리스탄 손아귀 강화 — 피부 강화 뒤의 페일노트는 공짜 */
  let sf=(i===0&&h.name==="트리스탄")?(h.shotFree||0):0;
  for(let k=0;k<n;k++){
    if(h.name==="카제"&&i===1&&free>0){ free--; continue }
    if(h.tag.freeCut&&i===0&&guard){ guard=0; continue }
    if(fb){ fb=0; continue }
    if(fp){ fp=0; continue }
    if(sf>0){ sf--; continue }
    need+=s.cost;
  }
  return h.mana>=need;
}

/* ─ 입력 ─ */
/* 고른 대원은 그대로 두고 기술 고르기 단계로만 되돌린다.
   기술을 쓴 뒤에도, 턴이 넘어가도 기술 창이 닫히지 않게 하는 것.
   쓰러졌거나 전장을 떠났거나 전투가 끝났으면 닫는다. */
function keepSel(){
  const h=sel&&sel.hero;
  sel=(h&&B&&!B.over&&h.slot>0&&h.hp>0)
      ? {hero:h,slot:h.slot,step:2,skill:null,count:1} : null;
}
function pickUnit(s){
  if(B.over) return; const h=unitAt(s); if(!h) return;
  sel={hero:h,slot:s,step:2,skill:null,count:1}; render();
}
function pickSkill(i,count){
  if(B.busy) return;          /* 턴 종료 효과가 흐르는 동안에는 손대지 못한다 */
  const h=sel.hero, s=h.sk[i];
  if((i===2&&h.lv<UNLOCK[2])||(i===3&&h.lv<UNLOCK[3])){ say("아직 해제되지 않은 기술입니다.","t2"); return }
  if(h.lock[i]){ say(`${s.n}${jo(s.n,"eun")} ${h.lock[i]}턴 동안 잠금 상태입니다.`,"t2"); return }
  /* 이미 고른 기술을 다시 누르면 시전 횟수가 하나씩 늘어난다 */
  if(sel.skill===i&&sel.step===4){
    if(s.lock){ say(`${s.n}${jo(s.n,"eun")} 잠금 기술이라 한 번만 쓸 수 있습니다.`,"t2"); return }
    const n=(sel.count||1)+1;
    if(s.limit&&(h.limitUsed[i]||0)+n>s.limit){
      say(`${s.n}의 사용한도를 넘습니다.`,"t2"); return }
    if(!canPay(h,i,n)){ say(`${s.n}${jo(s.n,"eul")} ${n}회 쓸 자원이 모자랍니다.`,"t2"); return }
    sel.count=n; SFX.play("click"); render(); return;
  }
  sel.skill=i;
  if(count!=null){ pickCount(count); return }
  sel.step=3; render();
}
function pickCount(n){
  if(B.busy) return;
  const h=sel.hero, s=h.sk[sel.skill];
  if(s.lock&&n>1){ say(`${s.n}${jo(s.n,"eun")} 잠금 기술이라 한 번만 쓸 수 있습니다.`,"t2"); n=1 }
  if(!canPay(h,sel.skill,n)){ say(`${s.n} ${n}회를 쓸 자원이 부족합니다.`,"t2"); return }
  sel.count=n; sel.step=4; render();
}

document.addEventListener("keydown",e=>{
  if(view!=="battle") return;
  if(e.key==="Escape"){ if(B) B.pick=null; sel=null; render(); return }
  if(e.key==="Enter"){ endTurn(); return }
  const n=parseInt(e.key,10); if(isNaN(n)||n<1||n>9) return;
  e.preventDefault();
  if(!sel){ pickUnit(n); return }
  if(sel.step===2){ if(n<=4) pickSkill(n-1,null); return }
  if(sel.step===3){ pickCount(n); return }
  if(sel.step===4){ if(n<=SLOTS) doSkill(n); return }
  if(sel.step===5){ if(n<=SLOTS) shadowGoTo(n) }
});

/* ─ 드래그 소환 ─ */
function startDrag(card,i){
  card.addEventListener("pointerdown",e=>{
    if(B.over) return;
    e.preventDefault();
    const x0=e.clientX, y0=e.clientY; let moved=0;
    const c=B.hand[i]; const g=el(`<div class="ghost">${card.outerHTML}</div>`);
    document.body.appendChild(g); card.style.opacity=".35";
    const move=ev=>{
      if(Math.abs(ev.clientX-x0)>5||Math.abs(ev.clientY-y0)>5) moved=1;
      g.style.left=ev.clientX+"px"; g.style.top=ev.clientY+"px";
      document.querySelectorAll("#mySide .slot").forEach(s=>{
        const r=s.getBoundingClientRect();
        s.classList.toggle("drop", ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom);
      });
    };
    const up=ev=>{
      document.removeEventListener("pointermove",move);
      document.removeEventListener("pointerup",up);
      g.remove(); card.style.opacity="";
      let hit=null, side="mine";
      document.querySelectorAll("#mySide .slot,#foeSide .slot").forEach(s=>{
        const r=s.getBoundingClientRect();
        if(ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom){
          hit=+s.dataset.slot; side=s.closest("#foeSide")?"foe":"mine";
        }
        s.classList.remove("drop");
      });
      /* 끌지 않고 그냥 눌렀으면 '이 카드를 골랐다'로 친다.
         고른 뒤 칸을 누르면 거기에 놓인다 — 드래그가 어려운 환경을 위해. */
      if(!moved&&!hit){
        B.pick=(B.pick===i)?null:i; sel=null; render(); return;
      }
      if(hit) playCard(i,hit,side);
    };
    document.addEventListener("pointermove",move);
    document.addEventListener("pointerup",up);
    move(e);
  });
}
/* 배치 여부와 무관한 아군 전원 (쓰러진 대원 제외) + 전장의 소환물 */

function soloCheck(h){

  } else if(!alone&&h.soloOn){

/* 그 턴에만 붙는 능력치 — 내 턴이 시작될 때 걷힌다 */
function bumpTurn(h,key,v){
  h.turnTmp=h.turnTmp||{};
  h.turnTmp[key]=(h.turnTmp[key]||0)+v;
  h[key]=(h[key]||0)+v;
}
function clearTurnTmp(h){
  if(!h.turnTmp) return;
  for(const k in h.turnTmp) h[k]=(h[k]||0)-h.turnTmp[k];

}
function bumpTmp(h,key,v){
  h.tmp=h.tmp||{};
  h.tmp[key]=(h.tmp[key]||0)+v;
  h[key]=(h[key]||0)+v;
  if(key==="maxHp") h.hp+=v;
}
function clearTmp(h){
  if(!h.tmp) return;
  for(const k in h.tmp) h[k]=(h[k]||0)-h.tmp[k];
  if(h.tmp.maxHp) h.hp=Math.min(h.hp,h.maxHp);
  if(h.hp<1&&h.maxHp>0) h.hp=Math.max(0,Math.min(h.hp,h.maxHp));
  h.tmp=null;
}

function playCard(i,slot,side){
  if(B.busy) return;
  const c=B.hand[i]; if(!c) return;
  const wantFoe=!!(c.stock&&CARD_LIB[c.stock]&&CARD_LIB[c.stock].foe)||!!c.foe;
  if(wantFoe){
    if(side!=="foe"){ say(`${c.name}${jo(c.name,"eun")} 적의 칸에 던져야 합니다.`,"t2"); return }
    const f=foeAt(slot);
    if(!f){ say("그 칸에는 적이 없습니다.","t2"); return }
    B.lastAttacker=null;     /* 카드는 되받아칠 사람이 없다 */
    c.use(f);
    if(c.stock){ useCard(c.stock);
      const e=(run.cards||[]).find(x=>x.n===c.stock);
      if(e){ c.d=CARD_LIB[c.stock].d+` (보유 ${e.c})` } else B.hand.splice(i,1);
    } else B.hand.splice(i,1);
    checkEnd(); render(); return;
  }
  if(side==="foe"){ say("아군 칸에 놓아야 합니다.","t2"); return }
  if(c.type==="summon"){
    if(occAt(slot)){ say("그 칸에는 이미 누군가 있습니다.","t2"); return }
    const m=makeMin(c.name,slot);
    B.mins.push(m);
    if(c.stock){ useCard(c.stock);
      if(!(run.cards||[]).find(x=>x.n===c.stock)) B.hand.splice(i,1);
    } else B.hand.splice(i,1);
    fx({side:"mine",slot:slot,s:"summon",ring:"#a06ae0",glow:1,txt:"소환",cls:"shd",gap:60});
    say(`${c.name}${jo(c.name,"ig")} ${slot}번 칸에 소환됩니다.`,"t1");
    rollIntents(); render(); return;
  }
  if(c.type==="hero"){
    if(occAt(slot)){ say("그 칸에는 이미 누군가 있습니다.","t2"); return }
    c.hero.slot=slot; B.hand.splice(i,1);
    fx({side:"mine",slot:slot,s:"summon",ring:"#7fd39a",glow:1,gap:60});
    onSummon(c.hero);
    bark(c.hero,"in");
    wanderCheck();
    rollIntents();
    say(`${c.hero.name}${jo(c.hero.name,"ig")} ${slot}번 칸에 자리를 잡습니다.`,"t1");
  }else{
    const h=unitAt(slot);
    if(!h){ say("카드를 쓸 아군이 없는 칸입니다.","t2"); return }
    /* use 가 "keep" 을 돌려주면 쓰지 못한 것이다 — 카드를 도로 넣어 둔다 */
    if(c.use(h)==="keep"){ render(); return }
    /* 낡은 투구끈 — 방어구 카드를 쓸 때마다 그 카드를 만든 대원이 회복한다 */
    if(ARMOR_CARDS[c.name]){
      const own=c.by&&run.heroes.find(x=>x.name===c.by);
      if(own&&own.tag.armorHeal&&own.hp>0){
        const got=healUp(own,own.tag.armorHeal);
        if(got){ fx({side:"mine",slot:own.slot,s:"heal",txt:"+"+got,cls:"heal",gap:60});
          say(`낡은 투구끈 — ${own.name} 체력 +${got}`,"t2") }
      }
    }
    /* 카드 마술 — 카드를 낸 대원이 보호막을 얻는다 */
    if(h.tag&&h.tag.cardShield){ h.shield+=h.tag.cardShield;
      fx({side:"mine",slot:h.slot,s:"shield",gap:60});
      say(`카드 마술 — ${h.name} 보호막 +${h.tag.cardShield}`,"t2") }
    if(!c.stock||!CARD_LIB[c.stock]) SFX.play("shield");
    if(c.stock){ useCard(c.stock);
      const e=(run.cards||[]).find(x=>x.n===c.stock);
      if(e){ c.d=CARD_LIB[c.stock].d+` (보유 ${e.c})` } else B.hand.splice(i,1);
    } else B.hand.splice(i,1);
  }
  render();
}

/* ─ 전투 처리 ─ */
/* 관통 — 값이 true 면 100%, 숫자면 그 비율(%)만큼 체력에 곧바로 들어간다 */
function pierceRate(p){ return p===true?100:Math.max(0,Math.min(100,+p||0)) }
/* ── 겨누기 전에 값을 알려 주기 ────────────────────────────────────────────
   doSkill 의 피해 갈래를 그대로 따라간다. 어떤 상태도 건드리지 않는다.
   따라가지 못하는 기술(무작위·합계 따위)은 null 을 돌려주고 아무것도 안 띄운다. */
/* 값을 따라갈 수 없는 기술 — 아무것도 띄우지 않는다 */
const PRED_OFF=["aim","armorUp","darkShadow","encore","frontal","fuse","grow","headshot",
  "jumpback","leech","minion","penance","phantom","quakeUp","soothe","spread","stance",
  "tune","venom","wall","warp","weaken","wrap"];
function predictDmg(h,s,tgt){
  if(!h||!s||!tgt||!B||!B.foes) return null;
  for(let q=0;q<PRED_OFF.length;q++) if(s[PRED_OFF[q]]) return null;
  /* 이테리오 — 마나를 내는 순간 마법력이 그만큼 오른다 */
  const magB=(h.name==="이테리오"&&s.cost&&s.costType!=="mom"&&s.costType!=="scale")?s.cost:0;
  const MAG=(h.mag||0)+magB, ATK=h.atk||0;
  const bs=k=>(s[k]||0)+mod(s,k);
  const alive=B.foes.filter(x=>x.alive);
  const far=alive.length?alive.reduce((a,b)=>dist(h.slot,a.slot)>=dist(h.slot,b.slot)?a:b):null;
  const near0=alive.length?alive.reduce((a,b)=>dist(h.slot,a.slot)<=dist(h.slot,b.slot)?a:b):null;
  const topHp=alive.length?alive.slice().sort((a,b)=>b.hp-a.hp)[0]:null;
  let dmg=null, crit=0, times=1, tail="";

  if(s.justice)          dmg=h.shield||0;
  else if(s.thrust)      dmg=(h.cutSum||0)*3;
  else if(s.dump)        dmg=h.ammo||0;
  else if(s.scaleBoom)   dmg=h.scale||0;
  else if(s.phantomPain) dmg=MAG;
  else if(s.verdict){ if(tgt.boss) return null; dmg=tgt.hp+(tgt.shield||0); tail="즉사" }
  else if(s.burst)       dmg=3+MAG+((tgt.infect||0)*(h.tag.burstX||2));
  else if(s.seed){ if(!topHp||tgt!==topHp) return null; dmg=bs("dmg")+MAG*2 }
  else if(s.farshot){
    const T=h.tag||{}, pin=T.nearShot?near0:far;
    if(!pin||tgt!==pin) return null;
    dmg=bs("dmg")+ATK;
    if(T.longShot&&dist(h.slot,tgt.slot)>=6) dmg+=T.longShot;
    if(T.armorShot&&h.armor>0) dmg+=T.armorShot;
    if(T.roundShot&&(h.first||{}).shot!==1) dmg+=T.roundShot+ATK;
    dmg+=(h.shotBonus||0);
    if((T.nearShot&&tgt.taunt)||(T.genMark&&(tgt.gmark||0)>0)){ dmg*=2; crit=1 }
  }
  else if(s.nearest)     dmg=bs("dmg")+MAG;
  else if(s.magnet)      dmg=bs("dmg")+MAG;
  else if(s.scaleGain)   dmg=bs("dmg")+MAG;
  else if(s.drain){ dmg=bs("dmg")+MAG; if((run.souls||0)>=200) times=2 }
  else if(s.wand)        dmg=1+(1+(h.tag.wandPlus||0))+h.def;
  else if(s.shadow){ dmg=bs("dmg")+ATK; if(h.hide){ dmg*=2; crit=1 } }
  else if(s.shackle){
    if(!h.blessed&&near0&&tgt!==near0) return null;
    dmg=8+(h.def+ATK+MAG)+(h.tag.shacklePlus||0);
  }
  else if(s.allHit){
    if(h.tag.pressAtk&&dist(h.slot,tgt.slot)>2) return null;
    dmg=bs("dmg")+ATK;
    if(h.name==="이테리오"&&s.el!=="마법"&&(tgt.mark||0)>0){ dmg*=2; crit=1 }
  }
  else if(s.dmg==null) return null;
  else if(h.name==="카제"&&s.n==="진선풍도"){
    const every=(h.potential&&h.tag.potentialEvery)||h.tag.windEvery||3;
    const strong=!!(h.tag.alwaysStrong||(((h.windUses||0)+1)%every===0));
    const bonus=h.windBuff||0;
    const reach=h.tag.noRange?99:(strong?3:s.rng)+bonus;
    if(dist(h.slot,tgt.slot)>reach) return null;
    dmg=bs("dmg")+bonus+ATK;
    if(h.tag.firstWind&&(h.first||{}).wind!==1) dmg+=h.tag.firstWind;
    /* 회오리에 뜬 적은 '바람처럼 사라져라'가 뒤이어 때린다 */
    if(strong){
      const lifted=h.potential?alive.filter(f=>dist(h.slot,f.slot)<=reach)
        :(far&&dist(h.slot,far.slot)<=reach?[far]:[]);
      if(lifted.indexOf(tgt)>=0) tail="공중 "+(4+ATK+(h.tag.airBonus||0));
    }
  }
  else {
    if(s.rng&&dist(h.slot,tgt.slot)>s.rng) return null;
    dmg=bs("dmg")+(s.el==="마법"?MAG:ATK*(s.n==="방패 밀치기"?(h.tag.pushAtkX||1):1));
    if(s.el==="마법"&&deb(h,"magDn")) dmg=Math.ceil(dmg*0.5);
    else if(s.el!=="마법"&&deb(h,"atkDn")) dmg=Math.ceil(dmg*0.5);
    if(h.name==="이테리오"&&s.el!=="마법"&&(tgt.mark||0)>0){ dmg*=2; crit=1 }
    if(h.name==="그슨대"&&h.hide&&s.el==="공격"){ dmg*=2; crit=1 }
    if(h.name==="데린저"){
      if(h.aimAt!=null){ if(tgt.id===h.aimAt){ dmg*=2; crit=1 } else dmg=0 }
      if(s.ammo&&h.tag.headshot&&!h.headshotUsed){
        const add=8+ATK;
        dmg=(h.aimAt!=null&&tgt.id===h.aimAt)?Math.round((dmg/2+add)*3):dmg+add;
      }
    }
    if(h.name==="나이코스"&&s.n==="베기"){
      if(h.tag.nearHit&&dist(h.slot,tgt.slot)===1) dmg+=h.tag.nearHit;
      if(h.tag.firstCut&&(h.first||{}).cut!==1) dmg+=h.tag.firstCut+ATK;
      if(h.tag.guardThen&&h.guardStack) dmg+=h.tag.guardThen*h.guardStack;
      dmg+=(h.cutGrow||0);
      if(h.tag.bloodBlade&&((h.cutUses||0)+1)%4===0){ dmg*=2; crit=1 }
      if(s.twice) times=2;
    }
  }
  if(dmg==null) return null;
  dmg=Math.max(0,Math.round(dmg));
  /* 보호막을 얼마나 뚫고 체력까지 닿는지 */
  let PR=0;
  if(s.pierce===true||h.pierceNext) PR=Math.max(PR,50);
  else if(s.pierce) PR=Math.max(PR,+s.pierce);
  if(s.el!=="마법"){ PR+=itemBt(h,"pierce"); if(tgt.taunt) PR+=itemBt(h,"tauntPierce") }
  PR=pierceRate(PR);
  const thru=Math.round(dmg*PR/100);
  const eat=Math.min(tgt.shield||0, dmg-thru);
  return {v:dmg, crit:crit, times:times, eat:eat, tail:tail,
          hp:Math.max(0,dmg-eat),          /* 보호막을 지나 체력에 닿는 몫 */
          evade:(tgt.evade||0)>0};
}
/* 나에게(또는 아군에게) 돌아오는 몫 */
function predictSelf(h,s){
  if(!h||!s) return null;
  const out={};
  if(s.shield) out.shield=breakdown(h,s,"shield").total;
  if(s.heal)   out.heal=breakdown(h,s,"heal").total;
  if(s.armorUp) out.armor=1+(h.tag.armorPlus||0);
  if(s.vanguard) out.shield=(h.tag.vanShield||5)+h.def;
  if(s.rearguard){ out.heal=h.tag.rearHeal||5; out.shield=5+h.def }
  return (out.shield||out.heal||out.armor)?out:null;
}
/* ── 다음 적 차례에 누가 얼마나 맞는가 ─────────────────────────────────────
   foePhase 의 공격 갈래를 그대로 따라간다. 아무것도 바꾸지 않는다.
   칸 번호로 모으는 이유 : 아군과 소환물이 한 칸에 하나씩만 서기 때문. */
function incoming(){
  const map={};
  if(!B||B.over||!B.foes||!B.foes.length) return map;
  const list=allUnits();
  const get=u=>map[u.slot]||(map[u.slot]={raw:0,hp:0,ev:0,
      _e:u.eshield||0,_s:u.shield||0,_v:u.evade||0});
  const hitOn=(u,v)=>{
    if(!u||u.hp<=0) return;
    const m=get(u);
    let raw=v;
    if(u.armor>0&&raw>u.armor) raw=u.armor;   /* 갑피는 한 방을 잘라낸다 */
    if(m._v>0){ m._v--; m.ev++; return }      /* 회피는 한 방을 통째로 흘린다 */
    m.raw+=raw;
    let d=raw;
    const eh=Math.min(m._e,d); m._e-=eh; d-=eh;
    const sh=Math.min(m._s,d); m._s-=sh; d-=sh;
    m.hp+=d;
  };
  B.foes.forEach(f=>{
    if(!f.alive||!f.intent) return;
    const stunned=(f.stun||0)>0||deb(f,"stun")>0;
    const purging=f.boss&&f.intent.t==="purge"&&f.intent.k!=="ward";
    if(stunned&&!purging) return;
    if(f.intent.t==="atk"){
      let t=unitAt(f.intent.to)||list.filter(canAim)[0]||list[0];
      const wall=t&&tauntWall(t);
      if(wall) t=wall;
      if(!t) return;
      if(!f.intent.far&&dist(t.slot,f.slot)>f.rng) return;   /* 거리 밖이면 헛손질 */
      const one=foeDmg(f,f.intent.v,f.intent.el);
      const hits=Math.max(1,f.intent.hits||1);
      for(let q=0;q<hits;q++) hitOn(t,one);
    }
    else if(f.intent.t==="volley"){
      const v=foeDmg(f,f.intent.v,f.intent.el);
      list.forEach(a=>hitOn(a,v));
    }
  });
  return map;
}
/* 그 칸에 서 있는 아군 머리 위에 붙일 쪽지 */
function incHtml(u,m){
  if(!m) return "";
  if(!m.raw) return m.ev?`<span class="incm safe">회피</span>`:"";
  const lethal=m.hp>0&&m.hp>=u.hp;
  const note=m.hp>0?(m.hp<m.raw?`체력 ${m.hp}`:""):"막힘";
  return `<span class="incm${lethal?" lethal":""}${m.hp?"":" safe"}">`
    +`<i class="ci${iconImg("combat_damage")?"":" noart"}">${iconImg("combat_damage")}</i>`
    +m.raw+(note?`<em>${note}</em>`:"")+`</span>`;
}
/* 머리 위 쪽지 */
function hitTag(kind,txt,crit,note){
  return `<span class="hitpv ${kind}${crit?" crit":""}">${txt}${
    note?`<em>${note}</em>`:""}</span>`;
}
/* 이 한 방으로 쓰러뜨릴 수 있는가 — 해골을 적 그림 위에 얹을지 정한다 */
function willKill(h,s,f,count){
  const p=predictDmg(h,s,f);
  if(!p||p.evade||s.verdict) return false;
  return (p.hp*((count||1)*p.times))>=f.hp;
}
/* 해골은 피해 값과 따로 논다. 적 그림 한가운데에 겹쳐 놓기 위해
   칸이 아니라 .art 안으로 들어간다. */
function killMark(h,s,f,count){
  if(!willKill(h,s,f,count)) return "";
  return `<span class="killmk" title="이 한 방으로 쓰러뜨릴 수 있습니다">${
    iconImg("combat_kill")||`<i class="txt">☠</i>`}</span>`;
}
function foeHitTag(h,s,f,count){
  const p=predictDmg(h,s,f);
  if(!p) return "";
  if(p.evade) return hitTag("dmg","회피",0,"");
  if(s.verdict) return hitTag("dmg","즉사",1,"절반으로 되살아남");
  const n=(count||1)*p.times;
  const note=[n>1?"×"+n:"", p.eat?"막"+p.eat:"", p.tail||""].filter(Boolean).join(" ");
  return `<span class="hitpv dmg${p.crit?" crit":""}">`+"−"+p.v
    +(note?`<em>${note}</em>`:"")+`</span>`;
}
function selfHitTag(h,s,count){
  const p=predictSelf(h,s);
  if(!p) return "";
  const n=count||1;
  const L=[];
  if(p.shield) L.push(hitTag("shd","+"+p.shield,0,n>1?"×"+n:""));
  if(p.heal)   L.push(hitTag("heal","+"+p.heal,0,n>1?"×"+n:""));
  if(p.armor&&!L.length) L.push(hitTag("shd","갑피"+p.armor,0,""));
  return L.slice(0,2).join("");
}
function hurt(f,amt,tag,art,pierce,crit){
  let d=amt,s=0;
  const pr=pierceRate(pierce);
  const thru=Math.round(amt*pr/100);       /* 보호막을 무시하고 체력으로 */
  let rest=amt-thru;
  const hadS=f.shield||0;
  if(rest>0){ s=Math.min(f.shield,rest); f.shield-=s; rest-=s }
  if(hadS>0&&f.shield<=0) breakFX(f,"s");
  d=thru+rest;
  /* 적의 회피 */
  if(f.evade>0){ f.evade--; d=0; s=0;
    fx({side:"foe",slot:f.slot,s:"miss",txt:"회피",cls:"miss",gap:60});
    say(`${f.name}${jo(f.name,"ig")} ${tag}${jo(tag,"eul")} 피했습니다.`,"t2"); return }
  f.hp-=d;
  if(crit){
    FXQ.push({crit:1,side:"foe",slot:f.slot});
    /* 치명적인 보호 — 아군 누구의 치명타든 이테리오가 받아 챙긴다 */
    const it=onField().find(x=>x.name==="이테리오"&&x.tag&&x.tag.critShield);
    if(it){ it.shield+=it.tag.critShield;
      fx({side:"mine",slot:it.slot,s:"shield",gap:60});
      say(`치명적인 보호 — ${it.name} 보호막 +${it.tag.critShield}`,"t2") }
  }
  fx({side:"foe",slot:f.slot,hit:1,art:art||"slash",txt:"-"+amt,
      cls:crit?"critbig":(art==="mag"?"mag":(amt>=15?"crit":"dmg")),
      gap:crit?170:undefined, recoil:1, pose:(d>0?"hurt":(s>0?"guard":null)),
      s:crit?null:(pr>=50?"pierce":art==="wind"?"gust":art==="mag"?"mag":
                   art==="boom"?"boom":art==="claw"?"slash2":amt>=12?"blunt":"slash")});
  say(`${tag} → ${f.name}(${f.slot}번) ${crit?"치명타 ":""}피해 ${amt}${
    pr?` (관통 ${pr}%${pr<100?` · 체력 ${thru}`:""})`:""}${s?` (보호막 ${s})`:""} · 남은 ${Math.max(0,f.hp)}`,crit?"t1":undefined);
  if(f.thorn&&f.alive&&d>0&&!f.thornBusy){
    const src=B.lastAttacker;
    if(src&&src.hp>0&&src.slot>0&&!src.isFoe){
      f.thornBusy=1;                 /* 가시끼리 무한히 주고받지 않게 */
      hurtAlly(f,src,f.thorn,`${f.name}의 가시`);
      f.thornBusy=0;
    } }
  if(f.hp>0&&d>0) bark(f,"hurt");
  if(f.hp<=0&&f.alive){ f.alive=0; bark(f,"down",1);
    fx({side:"foe",slot:f.slot,s:"die",txt:"처치",cls:"crit",gap:170});
    say(`${f.name} 처치.`,"t1");
    /* 우두머리는 무너지는 순간을 크게 보여 준다 */
    if(f.boss&&!f.isPhantom){
      const nm=f.name;
      fx({side:"foe",slot:f.slot,quake:1,s:"quake",ring:"#ffd45e",gap:0});
      pillarFX("foe",f.slot,"rgba(255,214,110,.95)");
      say(`${nm}${jo(nm,"ig")} 무너집니다.`,"t1");
      setTimeout(()=>bossFallCard(nm),240);
    }
    if(f.isPhantom){
      const src=B.foes.find(x=>x.id===f.phantomOf&&x.alive);
      if(src) hurt(src,f.backlash||4,"환영의 반동","mag");
    }
    /* 원래 적이 죽으면 그 환영도 함께 사라진다 */
    B.foes.filter(x=>x.alive&&x.isPhantom&&x.phantomOf===f.id).forEach(x=>{
      x.alive=0; say(`${x.name}${jo(x.name,"ig")} 흩어집니다.`,"t2") });
    (B.mins||[]).filter(m=>m.alive&&m.phantomOf===f.id).forEach(m=>{
      m.alive=0; m.slot=0; say(`환영이 흩어집니다.`,"t2") });
    onDeath("foe",f) }
}
function onDeath(kind,who){
  /* 쿠렘타이 영혼 수확 */
  if(run.heroes.some(h=>h.name==="쿠렘타이")){
    let g=0;
    if(kind==="foe") g=(who&&who.isPhantom)?1:(who&&who.boss?10:(B&&B.kind==="elite"?5:1));
    else if(kind==="min") g=1;
    else if(kind==="ally") g=5;
    if(who&&(who.isPhantom||who.of)) g=1;
    if(g){ run.souls=(run.souls||0)+g;
      const k=run.heroes.find(h=>h.name==="쿠렘타이");
      const want=Math.floor(run.souls/40);
      if(k&&(k.soulMag||0)<want){ const add=want-(k.soulMag||0); k.soulMag=want; k.mag+=add;
        say(`영혼 수확 — ${k.name}의 마법력이 ${add} 올랐습니다. (영혼 ${run.souls})`,"t1") }
    }
  }
  if(kind==="foe"){
    run.heroes.forEach(h=>{
      if(h.name==="보아"&&h.slot>0&&h.venom) gainScale(h,10);
      if(h.name==="데린저"&&who&&h.aimAt!=null&&h.aimAt===who.id){ h.aimAt=null;
        if(h.deb) h.deb.bind=0; say(`${h.name} 조준이 풀립니다.`,"t2") }
    });
  }
  run.heroes.forEach(h=>{
    if(kind!=="min"&&h.name==="굴라"&&h.slot>0&&h.greed<(h.tag.greedCap||3)){ h.greed++; h.maxHp++; h.hp++ }
    if(kind==="foe"&&h.name==="인비디아"&&h.slot>0&&h.hp>0){
      const got=[];
      if(Math.random()<0.25){ bumpTmp(h,"atk",1); got.push("공격력") }
      if(Math.random()<0.25){ bumpTmp(h,"mag",1); got.push("마법력") }
      if(Math.random()<0.25){ bumpTmp(h,"def",1); got.push("보호력") }
      if(Math.random()<0.25){ bumpTmp(h,"maxHp",4); got.push("최대 체력") }
      if(got.length) say(`재능 시기 — ${h.name}${jo(h.name,"ig")} 이번 전투 동안 ${got.join("·")}${jo(got[got.length-1],"eul")} 흡수합니다.`,"t1");
    }
  });
}
