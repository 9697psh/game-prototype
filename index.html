<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>균열 — 시험판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&display=swap">
<style>
:root{
  --ink:#14110e; --panel:#1c1815; --raise:#252019; --rule:#3a3128; --rule2:#4a3e31;
  --fg:#e7dcc8; --dim:#9c8d77; --faint:#6d6252;
  --brass:#c9a227; --blood:#8e2b2b;
  --atk:#e0705a; --mag:#6aa8e0; --def:#e0c85a; --hp:#7fd39a; --move:#5fd8cf; --mana:#5f8fe0;
  --mana2:#7fd8ff;                       /* 최대치를 넘어선 추가 마나 */
  --warn:#e0a86a;
  /* 자원 — 종류마다 다른 색 */
  --r-day:#c9a227; --r-time:#8fa2c9; --r-night:#6a5f9c;
  --r-act:#5fd8cf; --r-taint:#a06ae0; --r-gold:#e0c85a; --r-stone:#9c8d77;
  /* 등급 */
  --g-low:#b0793f; --g-mid:#c2c8d2; --g-high:#e8c65c; --g-rare:#a06ae0;
  /* 위험 단계 */
  --ok:#7fd39a; --caution:#e0a86a; --danger:#c9503f;
  /* 간격 · 굴림 */
  --sp1:4px; --sp2:8px; --sp3:14px; --sp4:22px;
  --rd:5px; --rd2:9px; --serif:"Noto Serif KR",serif;
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--sans);font-size:14px;
  line-height:1.6;-webkit-user-select:none;user-select:none}
button{font-family:inherit;font-size:inherit;color:var(--fg);background:var(--raise);
  border:1px solid var(--rule);border-radius:3px;padding:7px 13px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--brass);color:var(--brass)}
button:disabled{opacity:.35;cursor:default}
button.go{background:var(--brass);color:#17130f;border-color:var(--brass);font-weight:700}
button.go:hover{color:#17130f;filter:brightness(1.1)}
.ic{width:1.05em;height:1.05em;vertical-align:-.18em;fill:currentColor}
.grow{flex:1}

header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:9px 16px;
  background:var(--panel);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:30}
h1{font-family:var(--serif);font-size:15px;letter-spacing:.16em;color:var(--brass);margin:0;white-space:nowrap}
.stat{display:inline-flex;align-items:center;gap:5px;font-size:13px}
.wrap{max-width:1240px;margin:0 auto;padding:16px}

/* ── 전장 ── */
/* 칸 폭은 창에 맞춰 줄어든다 — 예전엔 104px 로 못 박혀 있어
   1200px 이 안 되는 창에서는 전장이 가로로 잘리고 스크롤이 생겼다 */
:root{--slotw:clamp(70px,8.4vw,104px)}
.field{display:flex;justify-content:center;align-items:stretch;gap:10px;
  overflow-x:auto;padding:38px 0 4px}
.side{display:flex;gap:6px;flex:0 0 auto}
/* 아군·적군 모두 왼쪽에서부터 1~5 */
.mid{width:2px;background:var(--rule);align-self:stretch;min-height:230px;flex:0 0 auto}
.slot{width:var(--slotw);flex:0 0 var(--slotw);min-width:0;overflow:visible;border:1px solid var(--rule);border-radius:var(--rd2);
  background:linear-gradient(180deg,var(--raise),var(--panel) 40%);
  padding:7px;display:flex;flex-direction:column;gap:5px;position:relative;min-height:176px}
.slot.empty{background:transparent;border-style:dashed;border-color:rgba(74,62,49,.5);opacity:.5;
  min-height:96px;align-self:center}
.slot.empty .no{opacity:.5}
.slot.empty.pick{opacity:1;border-color:var(--brass);background:rgba(201,162,39,.07)}
.slot.pick{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.slot.drop{border-color:var(--hp);box-shadow:0 0 0 1px var(--hp) inset;opacity:1}
.slot.far{opacity:.3;filter:grayscale(.7);cursor:default}
.slot.far .no{color:var(--faint)}
.reach{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:9.5px;
  color:var(--faint);pointer-events:none}
/* 겨누기 전에 보여 주는 값 */
.hitpv{position:absolute;top:-11px;right:5px;z-index:5;font-size:11.5px;font-weight:800;
  padding:1px 7px;border-radius:11px;line-height:1.55;pointer-events:none;
  border:1px solid rgba(0,0,0,.55);box-shadow:0 1px 5px rgba(0,0,0,.55);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.hitpv+.hitpv{top:11px}
.hitpv.dmg{background:#c9503f;color:#fff2ee}
.hitpv.shd{background:#e0c85a;color:#241d06}
.hitpv.heal{background:#7fd39a;color:#0e2416}
.hitpv.crit{border-color:#ffd45e;box-shadow:0 0 10px rgba(255,214,110,.85)}
/* 이 한 방으로 쓰러뜨릴 수 있는 적 — 적 그림 위에 겹쳐 놓는다.
   안쪽을 비치게 두어 어떤 적인지는 그대로 보이게 한다. */
.killmk{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:7;
  width:38px;height:38px;border-radius:50%;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 40%,rgba(60,12,8,.72),rgba(18,6,5,.34) 74%);
  border:2px solid #ff6a55;animation:killA 1.05s ease-in-out infinite}
.killmk img{width:30px;height:30px;display:block;image-rendering:auto;
  filter:drop-shadow(0 0 5px rgba(0,0,0,.95)) drop-shadow(0 0 4px rgba(255,120,100,.9))
         brightness(1.15)}
.killmk .txt{font-style:normal;font-size:22px;line-height:1;color:#ffd9d2;
  text-shadow:0 0 5px rgba(0,0,0,.95)}
/* 곧 쓰러질 적은 그림째 붉게 물든다 */
.slot.foe.willdie .art img,.slot.foe.willdie .art svg{
  filter:drop-shadow(0 0 7px rgba(255,80,60,.85)) saturate(1.25)}
@keyframes killA{
  0%,100%{border-color:#ff6a55;
    box-shadow:0 0 0 1px rgba(0,0,0,.65),0 0 12px 1px rgba(255,80,60,.7),
               inset 0 0 8px rgba(255,90,70,.45)}
  50%{border-color:#ffb3a2;
    box-shadow:0 0 0 1px rgba(0,0,0,.65),0 0 24px 6px rgba(255,90,70,1),
               inset 0 0 11px rgba(255,120,100,.75)}}
.hitpv em{font-style:normal;font-weight:600;font-size:9.5px;opacity:.85;margin-left:3px}
/* 다음 적 차례에 받을 피해 */
.incm{position:absolute;top:-31px;left:50%;transform:translateX(-50%);z-index:6;
  font-size:11.5px;font-weight:800;padding:1px 8px;border-radius:11px;line-height:1.55;
  pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums;
  background:#100b0a;color:#ffcfc6;border:1px solid rgba(201,80,63,.8);
  box-shadow:0 1px 6px rgba(0,0,0,.75)}
.incm>.noart::before{content:"\2620";margin-right:3px;opacity:.85;font-weight:400}
.incm em{font-style:normal;font-weight:600;font-size:9.5px;opacity:.9;margin-left:3px}
/* 발톱 자국 — 검은 바탕이라야 붉은 그림이 보인다 */
.incm .ci{font-style:normal;margin-right:4px;line-height:0}
.incm .ci img{width:16px;height:16px;display:inline-block;vertical-align:-3px;
  image-rendering:auto;filter:drop-shadow(0 0 3px rgba(255,90,70,.9)) brightness(1.3)}
.incm.safe{background:#0d1310;color:#cfe6d2;border-color:rgba(127,211,154,.55)}
.incm.lethal{background:#180706;color:#ff9d8d;border-color:#ff6a55;
  box-shadow:0 0 14px rgba(255,80,60,.8);
  animation:incA 1.1s ease-in-out infinite}
@keyframes incA{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.08)}}
.incm::after{content:"";position:absolute;left:50%;bottom:-7px;width:1px;height:7px;
  background:rgba(201,80,63,.65)}
.slot.pick .reach{color:var(--brass)}
.slot .no{position:absolute;top:-9px;left:7px;background:var(--ink);border:1px solid var(--rule);
  border-radius:3px;font-size:10px;padding:0 6px;color:var(--faint)}
.slot.pick .no{color:var(--brass);border-color:var(--brass)}
.res{display:flex;gap:4px;align-items:center;justify-content:center;min-height:13px;flex-wrap:wrap}
.pips{display:inline-flex;gap:3px;align-items:center}
.pips i{width:7px;height:7px;border-radius:50%;border:1px solid var(--rule2);display:inline-block}
.pips i.on{background:var(--mana);border-color:#8fb4ef;box-shadow:0 0 5px rgba(95,143,224,.75)}
/* 추가 마나 — 같은 파랑이되 더 밝고, 모서리를 세워 한눈에 갈린다 */
.pips i.ex{background:var(--mana2);border-color:#d2f2ff;border-radius:1px;
  transform:rotate(45deg);box-shadow:0 0 7px rgba(127,216,255,.95),0 0 14px rgba(127,216,255,.5);
  animation:exPip 1.9s ease-in-out infinite}
@keyframes exPip{0%,100%{filter:brightness(1)}50%{filter:brightness(1.45)}}
.exm{font-style:normal;color:var(--mana2);font-weight:700;margin-left:3px;
  text-shadow:0 0 6px rgba(127,216,255,.7)}
@media (prefers-reduced-motion: reduce){.pips i.ex{animation:none}}
.res .rr{font-size:10px;color:var(--move);display:inline-flex;align-items:center;gap:2px}
.res .rr.es{color:var(--def)}
.res .rr.mn2{color:var(--mana)}
.res .rr.am{color:#e0a86a} .res .rr.sc{color:#9ad06a} .res .rr.dk{color:#a06ae0}
.res .rr.tn{color:#e08ac0} .res .rr.so{color:#8fb4ef}
/* 약화 — 적이 내놓는 값이 깎였다 */
.chip.wk{color:#b58fe0;border-color:rgba(143,95,208,.55);background:rgba(143,95,208,.12);font-weight:700}
.intent.cut{color:#b58fe0;border-color:rgba(143,95,208,.5)}
.intent.cut s{margin-left:4px;opacity:.55;font-size:.86em;text-decoration-thickness:1px}
.intent .tgt{white-space:nowrap}
.pop.wkn{color:#c9a8ef;text-shadow:0 0 9px rgba(143,95,208,.9),0 1px 0 rgba(0,0,0,.8);font-weight:800}
.art{height:62px;display:flex;align-items:flex-end;justify-content:center;position:relative}
.art svg{filter:drop-shadow(0 2px 0 rgba(0,0,0,.55))}
.slot .art::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:52px;height:7px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(2px);z-index:-1}
.art svg{height:56px;width:auto}
.art img.pxs{height:calc(56px * var(--ph,1));width:auto;image-rendering:pixelated;display:block;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.55)) drop-shadow(0 0 7px rgba(201,162,39,.22))}
/* 쓰러진 대원 — 그 자리에 그대로 남는다. 아무것도 주고받지 못한다 */
.slot.body{opacity:.72;border-style:dashed;border-color:rgba(74,62,49,.6);
  background:linear-gradient(180deg,rgba(30,24,21,.7),rgba(18,15,13,.7) 46%)}
.slot.body .art img.pxs{filter:saturate(.45) brightness(.78) drop-shadow(0 2px 0 rgba(0,0,0,.6))}
.slot.body .art svg{filter:saturate(.45) brightness(.78) drop-shadow(0 2px 0 rgba(0,0,0,.6))}
.slot.body .nm{opacity:.7}
/* 체력이 닳을 때 — 체력바와 같은 박자로 캐릭터도 점멸한다 */
.art.hpblink > img.pxs,.art.hpblink > svg{animation:sprHurt .58s ease-out}
@keyframes sprHurt{
  0%  {filter:brightness(3.2) saturate(.3) drop-shadow(0 0 9px rgba(255,90,66,.95))}
  14% {filter:none}
  32% {filter:brightness(2.6) saturate(.4) drop-shadow(0 0 7px rgba(255,90,66,.85))}
  50% {filter:none}
  68% {filter:brightness(1.9) saturate(.6)}
  100%{filter:none}}
/* 보호막을 얻으면 머리 위로 방패가 하나 떠오른다 */
.art .shpop{position:absolute;left:50%;bottom:54px;z-index:6;pointer-events:none;
  display:flex;align-items:center;gap:1px;white-space:nowrap;
  color:var(--def);font-size:12.5px;font-weight:800;
  text-shadow:0 1px 0 rgba(0,0,0,.9),0 0 6px rgba(0,0,0,.7);
  animation:shpop .82s ease-out forwards}
.art .shpop .ic{width:19px;height:19px;filter:drop-shadow(0 0 5px rgba(110,170,225,.85))}
@keyframes shpop{
  0%  {opacity:0;transform:translate(-50%,10px) scale(.5)}
  20% {opacity:1;transform:translate(-50%,-3px) scale(1.2)}
  38% {opacity:1;transform:translate(-50%,0) scale(1)}
  70% {opacity:1;transform:translate(-50%,-4px) scale(1)}
  100%{opacity:0;transform:translate(-50%,-18px) scale(1)}}
@media (prefers-reduced-motion: reduce){
  .art.hpblink > img.pxs,.art.hpblink > svg{animation:none}
  .art .shpop{animation-duration:.4s}}
.slot.foe .art img.pxs{filter:saturate(.62) contrast(1.14) brightness(.92)
  drop-shadow(0 0 7px rgba(142,43,43,.4))}
.rost .art img.pxs,.card .art img.pxs{height:100%}
.pick .art img.pxs{height:calc(90px * var(--ph,1))}
.cxh .art img.pxs,.cxtop .art img.pxs{height:100%}
.nm{font-size:clamp(10.5px,1.05vw,12.5px);font-weight:700;line-height:1.25;word-break:keep-all;
  text-align:center;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.bar{height:9px;background:#0c0a09;border:1px solid rgba(0,0,0,.6);border-radius:4px;
  overflow:hidden;position:relative;box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.slot.foe .bar > i{background:linear-gradient(180deg,#d4685a,#a8402f)}
.slot.foe{background:linear-gradient(180deg,#2a1a19,#170f0e 46%);
  border-color:#4a2e2b}
.slot.foe::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(90% 50% at 50% 105%,rgba(142,43,43,.28),transparent 70%)}
/* 격 표시 띠 */
.intent.purge{color:#e0c85a;border-color:#7a6742;background:rgba(224,200,90,.1);font-weight:800}
.slot .tier{display:flex;align-items:center;justify-content:center;gap:3px;
  font-size:9.5px;font-weight:800;letter-spacing:.1em;margin:-2px 0 2px;
  text-transform:none;text-shadow:0 1px 0 rgba(0,0,0,.7)}
.slot .tier svg{width:11px;height:11px}
/* 일반 */
.slot.t-norm{border-color:#4a2e2b}
/* 정예 — 황금 테두리와 모서리 장식 */
.slot.t-elite{border-color:#c98a3a;box-shadow:0 0 0 1px rgba(201,138,58,.35),0 0 16px -6px #e0a86a}
.slot.t-elite .tier{color:#e0a86a}
.slot.t-elite .nm{color:#f0cf9a}
.slot.t-elite::after{content:"";position:absolute;inset:2px;border-radius:6px;pointer-events:none;
  border:1px solid rgba(224,168,106,.28)}
/* 우두머리 — 핏빛 테두리, 맥동, 뿔 장식 */
.slot.t-boss{border-color:#a83b32;
  box-shadow:0 0 0 1px rgba(168,59,50,.5),0 0 26px -6px #c9503f;
  animation:bossAura 2.6s ease-in-out infinite}
@keyframes bossAura{0%,100%{box-shadow:0 0 0 1px rgba(168,59,50,.5),0 0 22px -8px #c9503f}
  50%{box-shadow:0 0 0 1px rgba(200,80,66,.75),0 0 34px -4px #c9503f}}
.slot.t-boss .tier{color:#e0705a}
.slot.t-boss .nm{color:#f0b7a8;font-size:13.5px}
.slot.t-boss::after{content:"";position:absolute;inset:2px;border-radius:6px;pointer-events:none;
  border:1px solid rgba(224,112,90,.3)}
.slot.t-boss .bar{height:11px}
/* 밤의 습격 */
.slot.t-ambush{border-color:#6a5f9c;box-shadow:0 0 0 1px rgba(106,95,156,.35)}
.slot.t-ambush .tier{color:#9c8fd0}
.slot.foe .nm{color:#e8c8bd}
.synbar{margin-top:10px}
.turnrow{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 4px}
.turnrow #turnend{font-size:15px;padding:10px 30px;letter-spacing:.02em;
  box-shadow:0 4px 0 rgba(0,0,0,.45),0 0 18px -6px var(--brass)}
.turnrow #turnend i{font-style:normal;font-size:11.5px;opacity:.6;margin-left:5px}
.turnrow .hand-btn{display:inline-flex;align-items:center;gap:5px}
.turnrow .hand-btn .ic{width:15px;height:15px}
.turnrow .hand-btn b{color:var(--brass);font-weight:800}
.turnrow #turnend:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.45)}
.syn{font-size:11.5px;padding:3px 10px}
.bar::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 11px,rgba(0,0,0,.45) 11px 12px)}
.bar > i{display:block;height:100%;background:var(--hp);transition:width .18s;position:relative;z-index:2}
/* 잔상 — 줄어든 몫이 뒤늦게 따라 내려간다 */
.bar > em.gh{position:absolute;left:0;top:0;height:100%;display:block;z-index:1;
  background:linear-gradient(180deg,#ffe9bd,#ff7a52);
  box-shadow:0 0 8px rgba(255,140,90,.7);
  transition:width .72s cubic-bezier(.22,.72,.24,1) .16s;pointer-events:none}
.bar.healed > em.gh{background:linear-gradient(180deg,#dcffe8,#4fd08a);
  box-shadow:0 0 8px rgba(90,220,150,.7)}
/* 깜박임 */
.bar.hurt{animation:hpHurt .62s ease-out}
@keyframes hpHurt{
  0%  {filter:brightness(2.6) saturate(.5);box-shadow:0 0 0 2px rgba(255,130,95,.95),0 0 16px rgba(224,80,60,.9)}
  16% {filter:brightness(1);      box-shadow:0 0 0 1px rgba(255,130,95,.3)}
  34% {filter:brightness(2.3) saturate(.6);box-shadow:0 0 0 2px rgba(255,130,95,.8),0 0 13px rgba(224,80,60,.7)}
  52% {filter:brightness(1);      box-shadow:0 0 0 1px rgba(255,130,95,.2)}
  70% {filter:brightness(1.7);    box-shadow:0 0 0 1px rgba(255,130,95,.5)}
  100%{filter:brightness(1);      box-shadow:0 1px 0 rgba(255,255,255,.04) inset}}
.bar.healed{animation:hpHeal .62s ease-out}
@keyframes hpHeal{
  0%  {filter:brightness(2.3) saturate(.6);box-shadow:0 0 0 2px rgba(127,211,154,.95),0 0 16px rgba(80,200,140,.85)}
  20% {filter:brightness(1);      box-shadow:0 0 0 1px rgba(127,211,154,.3)}
  42% {filter:brightness(2);      box-shadow:0 0 0 2px rgba(127,211,154,.75),0 0 12px rgba(80,200,140,.6)}
  66% {filter:brightness(1);      box-shadow:0 0 0 1px rgba(127,211,154,.2)}
  100%{filter:brightness(1);      box-shadow:0 1px 0 rgba(255,255,255,.04) inset}}
@media (prefers-reduced-motion: reduce){
  .bar.hurt,.bar.healed{animation:none}
  .bar > em.gh{transition:none}}
.bar.mn > i{background:var(--mana)}
.bar > u{position:absolute;top:0;right:0;height:100%;background:var(--def);opacity:.9;z-index:3;
  border-left:1px solid var(--panel);transition:width .18s,right .18s}
.bar > u.es{background:#e07b28;opacity:.95;box-shadow:0 0 6px rgba(224,123,40,.6)}
.synbar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.syn{font-size:11px;padding:3px 9px;border-radius:11px;border:1px solid var(--line);
  color:var(--faint);cursor:help}
.syn.on{color:#0f0d0a;background:var(--brass);border-color:var(--brass);font-weight:700}
.syn b{font-weight:inherit}
.hits{color:#e0705a;font-weight:800;font-size:10.5px;margin-left:1px}
.shd{color:var(--def);font-weight:700;white-space:nowrap}
.esh{color:#e07b28;font-weight:700;white-space:nowrap}
.mini{font-size:11px;color:var(--dim);display:flex;flex-wrap:wrap;gap:4px;align-items:center;
  justify-content:center;font-variant-numeric:tabular-nums}
.chip{font-size:10px;border:1px solid var(--rule2);border-radius:2px;padding:0 4px;color:var(--dim)}
.chip.on{color:var(--brass);border-color:#5c4a1f}
.chip.deb{color:#e08a8a;border-color:#5a3030}
.chip.itm2{color:#9ecbf5;border-color:#33506b}
.ipx{width:100%;height:100%;image-rendering:pixelated;display:block}
.cimg{width:42px;height:42px;margin:0 auto 5px}
.cimg .ipx{width:42px;height:42px}
.gear{display:flex;gap:3px;justify-content:center;margin:0 0 4px}
.gs{--fr:#4a3e31;position:relative;width:26px;height:26px;flex:0 0 26px;
  border:2px solid var(--fr);border-radius:4px;background:#0f0d0b;
  box-shadow:0 0 0 1px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;
  overflow:hidden;opacity:.42}
.gs::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(150deg,rgba(255,255,255,.16),transparent 46%)}
.gs.on{opacity:1;cursor:help;
  background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--fr) 34%,#12100d),#0f0d0b 78%);
  box-shadow:0 0 0 1px rgba(0,0,0,.7),0 0 8px -2px var(--fr)}
.gs .ipx{width:20px;height:20px}
.intentbar{display:flex;justify-content:center;min-height:20px;margin:-3px 0 3px}
.intent{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;
  border:1px solid var(--rule2);
  border-radius:3px;padding:0 5px;background:var(--raise)}

.skwrap{margin-top:12px;background:var(--panel);border:1px solid var(--brass);border-radius:6px;padding:10px}
/* 턴 종료 효과가 흐르는 동안 — 창은 그대로 두되 손대지 못한다는 것을 보여 준다 */
.skwrap.waiting{opacity:.5;filter:saturate(.7);pointer-events:none;border-color:var(--rule2)}
.skhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.skhead b{font-family:var(--serif);font-size:14px;color:var(--brass)}
.skills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sk{position:relative;display:flex;gap:8px;align-items:flex-start;min-width:0;
  padding:9px 10px 9px 12px;border-radius:var(--rd);
  border:1px solid var(--rule);background:linear-gradient(180deg,var(--raise),var(--panel));
  cursor:pointer;transition:transform .11s,border-color .11s}
.sk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--rule2);border-radius:var(--rd) 0 0 var(--rd)}
.sk[data-el="공격"]::before{background:var(--atk)}
.sk[data-el="마법"]::before{background:var(--mag)}
.sk[data-el="보호"]::before{background:var(--def)}
.sk[data-el="이동"]::before{background:var(--move)}
.sk[data-el="집중"]::before{background:var(--brass)}
.sk[data-el="지속"]::before{background:var(--dim)}
.sk:hover{border-color:var(--brass);transform:translateY(-2px)}
.sk.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
/* 지금 강화되어 있는 기술 — 테두리가 살아 움직인다 */
.sk.hot{border-color:#5fd8cf;
  box-shadow:0 0 0 1px rgba(95,216,207,.5) inset,0 0 18px -5px rgba(95,216,207,.85);
  animation:skHot 2.2s ease-in-out infinite}
@keyframes skHot{0%,100%{box-shadow:0 0 0 1px rgba(95,216,207,.42) inset,0 0 14px -6px rgba(95,216,207,.7)}
  50%{box-shadow:0 0 0 1px rgba(140,240,232,.85) inset,0 0 26px -3px rgba(95,216,207,1)}}
.sk.hot::after{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,transparent 38%,rgba(150,245,238,.16) 50%,transparent 62%);
  background-size:250% 100%;animation:skSheen 2.6s linear infinite}
@keyframes skSheen{from{background-position:180% 0}to{background-position:-80% 0}}
.sk.hot.on{border-color:#8ff0e8}
.sk.hot > .k{background:#5fd8cf;color:#0d1614}
.chip.hotc{color:#0d1614;background:#5fd8cf;border-color:#5fd8cf;font-weight:800;
  text-shadow:none;letter-spacing:.02em}
/* 적의 자기 강화 */
.chip.up{color:#f0a08a;border-color:rgba(224,112,90,.6);background:rgba(224,112,90,.14);font-weight:700}
.intent.up{color:#f0a08a;border-color:rgba(224,112,90,.5)}
.pop.buf{color:#ffb59c;text-shadow:0 0 10px rgba(224,112,90,.95),0 1px 0 rgba(0,0,0,.8);font-weight:800}
@media (prefers-reduced-motion: reduce){.sk.hot,.sk.hot::after{animation:none}}
.sk.off{opacity:.4;cursor:default}
.sk.off:hover{border-color:var(--rule)}
.sk .k{font-size:11px;color:#17130f;background:var(--rule2);border-radius:3px;padding:1px 6px;
  font-weight:800;flex:none;margin-top:2px;font-variant-numeric:tabular-nums}
.sk.on .k{background:var(--brass)}
.sk .t{flex:1;min-width:0}
.sk .t b{font-size:12.5px}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.opt .ogo{margin-top:6px;align-self:flex-start}
.opt{background:#221d16;border:1px solid var(--rule2);border-radius:5px;padding:8px 10px;cursor:pointer}
.opt:hover{border-color:var(--brass);background:var(--raise)}
.opt.on{border-color:var(--brass)}
.opt b{font-size:12px}
.opt span{font-size:10px;color:var(--faint);margin-left:5px}
.opt small{display:block;font-size:10.5px;color:var(--dim);line-height:1.45;margin-top:3px;word-break:keep-all}
.chip.pk{color:#a8f0ea;border-color:#2f5c58}
.sk .xn{margin-left:5px;background:var(--brass);color:#17130f;border-radius:3px;padding:0 6px;font-size:11.5px;font-weight:700}
.sk .t .val{display:block;font-size:11.5px;color:var(--fg);margin-top:3px;line-height:1.5}
.sk .t .val .big{color:var(--brass);font-size:13px}
.sk .t .brk{color:var(--faint);font-size:10px}
.fullx{margin-top:6px;padding:6px 8px;background:#191612;border:1px solid var(--rule);
  border-left:2px solid var(--brass);border-radius:4px;font-size:10.5px;color:var(--dim);
  line-height:1.6;white-space:pre-wrap;word-break:keep-all}
.kw{font-weight:600}
.fullx u{text-decoration:underline;text-underline-offset:2px}
.fullx i{font-style:italic}
.fullx span.kw{display:inline;font-size:inherit;letter-spacing:0;margin:0}
.fullx span{display:block;font-size:9px;letter-spacing:.14em;color:var(--faint);margin-bottom:3px}
button.dtl{padding:3px 10px;font-size:11.5px}
.sk .t small{display:block;color:var(--dim);font-size:10.5px;line-height:1.45;margin-top:4px;word-break:keep-all;overflow-wrap:anywhere}
.counts{display:flex;gap:4px;flex-wrap:wrap;padding-top:9px;margin-top:9px;
  border-top:1px solid var(--rule);align-items:center}
.counts button{padding:2px 10px;font-size:12px}
.prog{margin-top:4px}
.prog .pl{font-size:9.5px;color:var(--faint);display:flex;justify-content:space-between;gap:4px;white-space:nowrap;overflow:hidden}
.prog .pl span:first-child{overflow:hidden;text-overflow:ellipsis;min-width:0}
.prog .pl span:last-child{flex:0 0 auto}
.prog .pb{height:4px;background:#0f0d0b;border-radius:2px;overflow:hidden;margin-top:1px}
.prog .pb>i{display:block;height:100%;background:var(--brass);transition:width .2s}
.prog.done .pl{color:var(--hp)}
.prog.done .pb>i{background:var(--hp)}
.passes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:9px}
.pass{background:#1a1713;border:1px solid var(--rule);border-radius:4px;padding:8px 10px}
.pass .pn{font-size:11.5px;font-weight:700;color:var(--brass)}
.pass .pd{font-size:10.5px;color:var(--dim);line-height:1.5;margin-top:3px;word-break:keep-all}
.pass .pd b{color:var(--fg);font-size:12px}
.pass .pd span.brk{color:var(--faint);font-size:10px}
@media(max-width:760px){ .passes{grid-template-columns:1fr} }
.stats{font-size:10.5px;color:var(--dim);display:flex;flex-wrap:wrap;gap:5px;justify-content:center}

/* ── 손패 ── */
.hand{margin-top:14px;display:flex;gap:9px;flex-wrap:wrap;align-items:flex-start;min-height:10px}
.card{width:120px;border:1px solid var(--rule2);border-radius:var(--rd2);
  background:linear-gradient(180deg,var(--raise),var(--panel) 60%);
  box-shadow:0 4px 12px rgba(0,0,0,.4);transition:transform .12s,border-color .12s;
  padding:8px;cursor:grab;touch-action:none;position:relative}
.card:hover{border-color:var(--brass)}
/* 손패 테두리 — 대원 red · 소환물 green · 그 밖 gray */
.card.c-hero{border-color:#b84a3e;box-shadow:0 4px 12px rgba(0,0,0,.4),0 0 0 1px rgba(184,74,62,.35)}
.card.c-min{border-color:#4f9c5e;box-shadow:0 4px 12px rgba(0,0,0,.4),0 0 0 1px rgba(79,156,94,.3)}
.card.c-item{border-color:#71675c}
.card .cst{margin-top:5px;padding-top:5px;border-top:1px solid var(--rule);
  font-size:10.5px;color:var(--dim);text-align:center;display:flex;gap:6px;
  justify-content:center;flex-wrap:wrap}
.card .cimg .ricon{width:44px;height:44px;image-rendering:pixelated;display:block;margin:0 auto}
.card .ct{font-size:11.5px;font-weight:700;text-align:center;margin-bottom:4px}
.card .cd{font-size:10.5px;color:var(--faint);line-height:1.4}
.card .art{height:44px}
.card .art svg{height:44px}
.ghost{position:fixed;z-index:999;pointer-events:none;opacity:.9;transform:translate(-50%,-50%)}

.prompt{margin-top:14px;background:var(--panel);border:1px solid var(--rule);border-radius:5px;
  padding:9px 13px;font-size:13px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.step{font-size:11px;border:1px solid var(--rule2);border-radius:99px;padding:1px 9px;color:var(--faint)}
.step.on{color:#17130f;background:var(--brass);border-color:var(--brass);font-weight:700}
.hint{color:var(--dim);font-size:12.5px}
.log{margin-top:12px;background:var(--panel);border:1px solid var(--rule);border-radius:5px;
  padding:9px 13px;min-height:74px;max-height:168px;overflow:auto;font-size:12.5px;line-height:1.65}
.log div{border-bottom:1px solid #241f19;padding:1px 0}
.log .t1{color:var(--brass)} .log .t2{color:var(--dim)} .log .t3{color:var(--warn)}

/* ── 화면 ── */
.center{max-width:900px;margin:40px auto;text-align:center}
.title{font-family:var(--serif);font-size:30px;color:var(--brass);letter-spacing:.2em}
.sub{color:var(--dim);margin-top:6px}
.picks{display:flex;gap:14px;justify-content:center;margin-top:28px;flex-wrap:wrap}
.pick{width:230px;background:var(--panel);border:1px solid var(--rule);border-radius:7px;
  padding:14px;cursor:pointer;text-align:left}
.pick:hover{border-color:var(--brass)}
.pick .art{height:96px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 60%,rgba(201,162,39,.1),transparent 68%);border-radius:var(--rd)}
.pick .art svg{width:92px;height:92px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.5))}
.pick.downp{opacity:.6;border-style:dashed}
.pick.downp .art{filter:saturate(.35) brightness(.7)}
.pick{transition:transform .13s,border-color .13s}
.pick:hover{transform:translateY(-3px)}
.pick.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset,0 8px 22px rgba(0,0,0,.45)}
.pick h3{margin:8px 0 2px;font-size:15px;font-family:var(--serif)}
.pick .role{color:var(--brass);font-size:11.5px;letter-spacing:.06em}
.pick p{color:var(--dim);font-size:12px;margin:8px 0 0;line-height:1.55}

.mapwrap{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.node{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--rule);
  border-radius:6px;padding:11px 14px}
.node.now{border-color:var(--brass)}
.node.done{opacity:.45}
.node .tag{font-size:11px;border:1px solid var(--rule2);border-radius:3px;padding:1px 7px;color:var(--dim);flex:none}
.node .tag.b{color:var(--atk);border-color:#5a3030}
.roster{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px}
.rost{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;
  display:flex;gap:9px;align-items:center;min-width:186px}
.rost{transition:border-color .12s}
.rost:hover{border-color:var(--rule2)}
.rost .art{width:46px;height:46px;flex:0 0 46px;display:flex;align-items:center;justify-content:center}
.rost .art svg{width:44px;height:44px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.5))}
.rost b{font-size:12.5px}
.rost small{display:block;color:var(--dim);font-size:11px}
/* ── 미지의 구역 ── 그림 → 제목 → 상황 문구 → 선택지 ── */
.evbox{max-width:780px;margin:18px auto 0;display:flex;flex-direction:column;align-items:center}
.evart{width:clamp(150px,26vw,240px);height:clamp(150px,26vw,240px);
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 40%,rgba(201,162,39,.13),transparent 68%);
  border:1px solid var(--rule);border-radius:8px;padding:12px;
  box-shadow:inset 0 0 40px rgba(0,0,0,.5)}
.evart svg,.evart img{width:100%;height:100%;object-fit:contain}
.evtitle{margin-top:14px;font-family:var(--serif);font-size:21px;color:var(--brass);
  letter-spacing:.06em;text-align:center}
.evdesc{margin-top:10px;max-width:660px;text-align:center}
.evdesc .evp{color:var(--dim);font-size:13.5px;line-height:1.75;margin:0 0 4px;word-break:keep-all}
/* 대사 — 다른 줄에 가운데로, 굵게, 은은하게 빛난다 */
.evsay{margin:12px auto;padding:9px 20px;max-width:600px;
  font-family:var(--serif);font-size:16.5px;font-weight:700;line-height:1.7;
  color:#f0e2c0;text-align:center;letter-spacing:.02em;word-break:keep-all;
  border-top:1px solid rgba(201,162,39,.28);border-bottom:1px solid rgba(201,162,39,.28);
  text-shadow:0 0 16px rgba(201,162,39,.5);
  animation:evSay .5s ease-out both, evGlow 3s ease-in-out 0.5s infinite}
.evsay::before{content:"\201C";margin-right:4px;color:var(--brass);opacity:.75}
.evsay::after{content:"\201D";margin-left:4px;color:var(--brass);opacity:.75}
@keyframes evSay{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes evGlow{0%,100%{text-shadow:0 0 12px rgba(201,162,39,.34)}
  50%{text-shadow:0 0 22px rgba(201,162,39,.75)}}
.evq{font-style:normal;font-weight:700;color:#f0e2c0;text-shadow:0 0 12px rgba(201,162,39,.45)}
.evopts{margin-top:18px;width:100%;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.evopts .choice{flex:1 1 210px;max-width:250px;margin:0;
  text-align:center;align-items:center;padding:14px 16px}
.evopts .choice b{font-size:13.5px}
.evopts .choice span{word-break:keep-all}
.evopts .evres{flex:1 1 100%;justify-content:center;text-align:center}
.evopts .evres>div{text-align:center}
.evopts .evres b{display:block;margin-bottom:3px}
.evopts .evres p{margin:0}
.evopts .go2{flex:1 1 100%;text-align:center}
.rewards{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.rw{--gc:var(--brass);position:relative;width:198px;min-height:244px;
  background:linear-gradient(180deg,var(--raise),var(--panel) 55%);
  border:1px solid var(--rule2);border-radius:var(--rd2);padding:16px 14px 14px;cursor:pointer;
  text-align:center;display:flex;flex-direction:column;align-items:center;overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,.45);transition:transform .13s,border-color .13s,box-shadow .13s}
.rw::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--gc)}
.rw::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:radial-gradient(120% 60% at 50% -10%,var(--gc),transparent 60%);opacity:.13}
.rw:hover{border-color:var(--gc);transform:translateY(-3px);
  box-shadow:0 12px 26px rgba(0,0,0,.55),0 0 22px -8px var(--gc)}
.rw.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.rw.g1{--gc:var(--g-low)} .rw.g2{--gc:var(--g-mid)} .rw.g3{--gc:var(--g-high)}
/* 등급이 높을수록 테두리가 더 두껍고 요란해진다 (브론즈 → 실버 → 골드) */
.rw.g1{border-color:color-mix(in srgb,var(--gc) 55%,var(--rule2))}
.rw.g2{border-color:color-mix(in srgb,var(--gc) 70%,var(--rule2));
  box-shadow:0 6px 18px rgba(0,0,0,.45),0 0 0 1px color-mix(in srgb,var(--gc) 35%,transparent)}
.rw.g2::before{height:4px}
.rw.g3{border-color:var(--gc);
  box-shadow:0 6px 18px rgba(0,0,0,.5),0 0 0 2px color-mix(in srgb,var(--gc) 45%,transparent),
             0 0 26px -6px var(--gc);
  animation:rwGold 2.4s ease-in-out infinite}
.rw.g3::before{height:5px}
.rw.g3 .rwi{box-shadow:0 0 22px -4px var(--gc)}
@keyframes rwGold{0%,100%{box-shadow:0 6px 18px rgba(0,0,0,.5),
    0 0 0 2px color-mix(in srgb,var(--gc) 40%,transparent),0 0 20px -8px var(--gc)}
  50%{box-shadow:0 6px 18px rgba(0,0,0,.5),
    0 0 0 2px color-mix(in srgb,var(--gc) 70%,transparent),0 0 34px -4px var(--gc)}}
/* 전용 보상 — 그 대원만 받을 수 있는 것. 한눈에 갈리도록 요란하게 */
.rw.own{border-color:var(--gc);
  background:linear-gradient(180deg,color-mix(in srgb,var(--gc) 9%,var(--raise)),var(--panel) 58%)}
/* 안쪽으로 한 겹 더 두른 테두리 */
.rw.own::after{content:"";position:absolute;inset:5px;border-radius:calc(var(--rd2) - 2px);
  border:1px solid color-mix(in srgb,var(--gc) 55%,transparent);
  background:radial-gradient(120% 60% at 50% -10%,var(--gc),transparent 62%);
  opacity:.5;pointer-events:none}
/* 네 귀퉁이 표 */
.rw.own .ownmark{position:absolute;left:0;right:0;top:0;height:0;z-index:2;pointer-events:none;
  font-size:0}
.rw.own .ownmark::before,.rw.own .ownmark::after{content:"";position:absolute;top:9px;
  width:13px;height:13px;border:2px solid var(--gc);opacity:.9}
.rw.own .ownmark::before{left:9px;border-right:0;border-bottom:0}
.rw.own .ownmark::after{right:9px;border-left:0;border-bottom:0}
.rw.own .rwft::before,.rw.own .rwft::after{content:"";position:absolute;bottom:9px;
  width:13px;height:13px;border:2px solid var(--gc);opacity:.9;pointer-events:none}
.rw.own .rwft::before{left:9px;border-right:0;border-top:0}
.rw.own .rwft::after{right:9px;border-left:0;border-top:0}
.rw.own{animation:ownGlow 2.6s ease-in-out infinite}
@keyframes ownGlow{
  0%,100%{box-shadow:0 6px 18px rgba(0,0,0,.5),0 0 0 1px color-mix(in srgb,var(--gc) 40%,transparent),
          0 0 16px -6px var(--gc)}
  50%    {box-shadow:0 6px 18px rgba(0,0,0,.5),0 0 0 2px color-mix(in srgb,var(--gc) 85%,transparent),
          0 0 30px -4px var(--gc)}}
.rw.own .rwi{box-shadow:0 0 26px -6px var(--gc)}
.rw.own b{color:color-mix(in srgb,var(--gc) 45%,var(--fg))}
.rw.own .rwd{border-color:color-mix(in srgb,var(--gc) 32%,var(--rule))}
.rw.own .rwft .ow.mine{background:var(--gc);color:#17130f;border-color:var(--gc);font-weight:700}
/* 그림 → 이름 → 설명 → [전용/공용] */
.rw .ricon{width:64px;height:64px;image-rendering:pixelated;display:block}
/* 보상을 고르는 칸 — 세로로 길게, 설명은 상자 안에 */
.rw.rwpick{width:188px;min-height:352px}
.rw.rwpick .rwi{width:86px;height:86px;margin:4px auto 12px}
.rw.rwpick .ricon{width:72px;height:72px}
.rw.rwpick b{font-size:14.5px;line-height:1.45;word-break:keep-all}
.rw .rwd{margin-top:10px;width:100%;padding:9px 10px;border-radius:5px;
  background:rgba(0,0,0,.32);border:1px solid var(--rule);
  position:relative;z-index:1;flex:1 1 auto;display:flex;align-items:center;
  justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}

/* ── 이펙트 ── */
#fx{position:fixed;inset:0;pointer-events:none;z-index:900;overflow:hidden}
/* 내 턴 알림 — 적의 행동이 다 끝난 뒤 전장 위를 작게 스쳐 지나간다 */
.turnban{position:fixed;z-index:940;pointer-events:none;
  display:flex;align-items:baseline;gap:9px;white-space:nowrap;
  padding:5px 17px;border-radius:999px;
  background:linear-gradient(180deg,rgba(48,40,29,.95),rgba(24,20,16,.95));
  border:1px solid rgba(201,162,39,.55);
  box-shadow:0 0 0 1px rgba(0,0,0,.55),0 7px 20px rgba(0,0,0,.5),
             0 0 24px rgba(201,162,39,.2);
  animation:turnban 1.25s cubic-bezier(.2,.8,.3,1) forwards}
.fleeword{position:fixed;z-index:940;pointer-events:none;transform:translateX(-50%);
  font-family:var(--serif);font-size:clamp(20px,3.2vw,34px);font-weight:700;
  letter-spacing:.24em;color:#cfd6e6;text-shadow:0 0 18px rgba(0,0,0,.9);
  animation:fleeW 1.2s ease-out forwards}
@keyframes fleeW{0%{opacity:0;transform:translateX(-50%) translateX(40px)}
  25%{opacity:1;transform:translateX(-50%)}
  75%{opacity:1;transform:translateX(-50%)}
  100%{opacity:0;transform:translateX(-50%) translateX(-50px)}}
/* 구역에 들어설 때 — 습격·우두머리보다 훨씬 작고 짧게 */
.stepban{position:fixed;left:50%;top:23%;transform:translateX(-50%);z-index:930;
  pointer-events:none;display:flex;align-items:baseline;gap:11px;white-space:nowrap;
  padding:8px 24px;border-radius:999px;
  background:linear-gradient(180deg,rgba(40,34,26,.96),rgba(20,17,14,.96));
  border:1px solid rgba(201,162,39,.45);
  box-shadow:0 8px 26px rgba(0,0,0,.55);
  animation:stepban 1.5s cubic-bezier(.2,.8,.3,1) forwards}
.stepban b{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.2em;color:var(--brass)}
.stepban span{font-size:11.5px;color:var(--dim);letter-spacing:.05em}
@keyframes stepban{0%{opacity:0;transform:translateX(-50%) translateY(-10px)}
  16%{opacity:1;transform:translateX(-50%) translateY(0)}
  74%{opacity:1}
  100%{opacity:0;transform:translateX(-50%) translateY(-8px)}}
.turnban b{font-size:15px;font-weight:800;letter-spacing:.14em;color:var(--brass);
  text-shadow:0 0 10px rgba(201,162,39,.55)}
.turnban span{font-size:11px;color:var(--dim);letter-spacing:.04em}
@keyframes turnban{
  0%  {opacity:0;transform:translate(-50%,-42%) scale(.9)}
  12% {opacity:1;transform:translate(-50%,-50%) scale(1.05)}
  22% {opacity:1;transform:translate(-50%,-50%) scale(1)}
  70% {opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}
@media (prefers-reduced-motion: reduce){ .turnban{animation-duration:.8s} }
.pop{position:absolute;transform:translate(-50%,-50%);font-family:var(--serif);font-weight:700;
  font-size:21px;text-shadow:0 2px 4px #000,0 0 10px #000;animation:pop .95s ease-out forwards}
.pop.dmg{color:var(--atk)} .pop.mag{color:var(--mag)} .pop.heal{color:var(--hp)}
.pop.shd{color:var(--def)} .pop.miss{color:var(--dim);font-size:16px}
.pop.crit{color:#ffd45e;font-size:27px}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}
  18%{opacity:1;transform:translate(-50%,-70%) scale(1.12)}
  32%{transform:translate(-50%,-72%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-150%) scale(.95)}}
.slash{position:absolute;transform:translate(-50%,-50%);width:96px;height:96px;animation:slashA .38s ease-out forwards}
@keyframes slashA{0%{opacity:0;transform:translate(-50%,-50%) rotate(-38deg) scale(.55)}
  25%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-50%) rotate(22deg) scale(1.25)}}
.swirl{position:absolute;transform:translate(-50%,-50%);width:112px;height:112px;animation:swirlA .6s linear forwards}
@keyframes swirlA{0%{opacity:0;transform:translate(-50%,-50%) rotate(0) scale(.5)}
  30%{opacity:.95}
  100%{opacity:0;transform:translate(-50%,-50%) rotate(340deg) scale(1.5)}}
.ring{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:2px solid;
  width:22px;height:22px;animation:ringA .55s ease-out forwards}
@keyframes ringA{0%{opacity:.95;width:22px;height:22px}100%{opacity:0;width:128px;height:128px}}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;
  box-shadow:0 0 7px currentColor;animation:sparkA .68s cubic-bezier(.15,.85,.35,1) forwards}
.spark.big{width:9px;height:9px;filter:blur(.4px)}
.grit{position:absolute;width:3px;height:3px;border-radius:1px;opacity:.85;
  animation:gritA .8s cubic-bezier(.3,.1,.7,1) forwards;pointer-events:none}
@keyframes gritA{0%{opacity:.9;transform:translate(-50%,-50%)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy)))}}
@keyframes sparkA{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3)}}
/* ── 필드 격자 ── */
/* ── 자원 머리줄 ── */
.clock{display:inline-flex;flex-direction:column;align-items:center;gap:1px;

  background:var(--panel);cursor:help;line-height:1;flex:none}
.clock .clkpx{width:38px;height:38px;image-rendering:pixelated;display:block;

.clock b{font-size:12.5px;color:var(--fg);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock i{font-style:normal;font-size:9.5px;color:var(--brass);letter-spacing:.14em}
.clock.night{border-color:#3a3459;background:#15121f}
.clock.night .clkpx{filter:drop-shadow(0 0 6px rgba(156,143,208,.35))}
.clock.night i{color:#9c8fd0}
header{align-items:center}
.fname{font-family:var(--serif);font-size:14px;color:var(--brass);letter-spacing:.05em;white-space:nowrap}
.res{position:relative;display:inline-flex;align-items:center;gap:4px;overflow:hidden;
  padding:3px 9px;border:1px solid var(--rule);border-radius:11px;background:var(--panel);
  font-size:12.5px;color:var(--dim);white-space:nowrap;cursor:help}
.res .ri{width:13px;height:13px;flex:0 0 13px}
.res b{font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
.res i{font-style:normal;font-size:10.5px;color:var(--faint)}
.res u{position:absolute;left:0;bottom:0;height:2px;background:currentColor;opacity:.5;
  text-decoration:none;transition:width .25s}
.res.act{color:var(--r-act)} .res.taint{color:var(--r-taint)}
.res.gold{color:var(--r-gold)} .res.stone{color:var(--r-stone)}
.res.night{color:var(--r-night);border-color:var(--r-night)}
.res.warn{color:var(--caution);border-color:rgba(224,168,106,.5)}
.res.bad{color:var(--danger);border-color:var(--danger);
  animation:resPulse 1.6s ease-in-out infinite}
@keyframes resPulse{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 2px rgba(201,80,63,.28)}}

/* ── 지도 ── */
.gridmap{display:grid;gap:3px;margin-top:14px;max-width:min(560px,calc(100vw - 40px));margin-inline:auto}
.npx{width:100%;height:100%;image-rendering:pixelated;display:block}
/* 나이코스 검격 — 여섯 칸짜리 띠를 마디로 넘긴다 (30·40·50·40·50·60ms) */
.slashfx{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;
  background-size:384px 64px;background-repeat:no-repeat;image-rendering:pixelated;
  pointer-events:none;z-index:7;transform-origin:50% 50%;
  animation:naiSlash .27s step-end forwards}
@keyframes naiSlash{
  0%     {background-position:0 0}
  11.11% {background-position:-64px 0}
  25.93% {background-position:-128px 0}
  44.44% {background-position:-192px 0}
  59.26% {background-position:-256px 0}
  77.78% {background-position:-320px 0}
  100%   {background-position:-320px 0;opacity:0}
}
/* 새 UI 그림은 32px 원본이다. 늘일 때는 정수 배율 + 또렷하게,
   줄일 때는 계단이 생기니 매끄럽게 그린다. */
img.ri{width:14px;height:14px;vertical-align:-2px;image-rendering:auto}
.cell .cbg{position:absolute;inset:0;border-radius:inherit;opacity:.14;pointer-events:none}

.cell.k-boss .cbg{background:radial-gradient(circle at 50% 40%,#8e2b2b,transparent 72%);opacity:.42}
.cell.k-dungeon .cbg{background:radial-gradient(circle,#e0705a,transparent 74%)}
.cell.k-elite .cbg{background:radial-gradient(circle,#e0a86a,transparent 74%);opacity:.22}
.cell.k-shop .cbg{background:radial-gradient(circle,#e0c85a,transparent 74%)}
.cell.k-rest .cbg{background:radial-gradient(circle,#7fd39a,transparent 74%)}
.cell.k-event .cbg{background:radial-gradient(circle,#6aa8e0,transparent 74%)}
.cell.k-forge .cbg{background:radial-gradient(circle,#9c8d77,transparent 74%)}
.cell .cico{position:absolute;inset:16%;display:block;pointer-events:none}

.cell{container-type:inline-size}
.cell .cico:has(img){inset:0;display:flex;align-items:center;justify-content:center}
.cell .cico img{width:32px;height:32px;flex:0 0 auto}

.cell .cw{position:absolute;right:3px;top:2px;font-size:9.5px;color:var(--fg);

  font-variant-numeric:tabular-nums}
.cell .you{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);

.cell .you svg{width:100%;height:100%}
.cell .crisk{position:absolute;left:3px;top:1px;color:var(--danger);font-weight:900;font-size:13px}
.cell.adj{cursor:pointer}
.cell.adj{filter:none}
.cell:not(.adj):not(.here){filter:brightness(.55) saturate(.6)}
/* 갈 수 있는 칸은 눌러 보기 전에도 알아볼 수 있어야 한다 */
.cell.adj{box-shadow:0 0 0 1px rgba(201,162,39,.5) inset,0 0 10px rgba(201,162,39,.14)}
.cell.adj .cbg{opacity:.34}
.cell.adj::before{content:"";position:absolute;left:50%;bottom:2px;transform:translateX(-50%);
  width:14px;height:2px;border-radius:2px;background:var(--brass);opacity:.55;pointer-events:none}
.cell.adj:hover::before{opacity:1;width:22px}
.cell.adj::after{content:"";position:absolute;inset:-1px;border-radius:inherit;
  border:1px solid var(--brass);opacity:.75;pointer-events:none;
  animation:adjA 2.2s ease-in-out infinite}
@keyframes adjA{0%,100%{opacity:.45}50%{opacity:.95}}
.cell.adj:hover{transform:translateY(-2px)}
.cell.adj:hover::after{opacity:1;box-shadow:0 0 12px rgba(201,162,39,.55)}
.cell{transition:transform .12s,filter .2s}
.cell.here{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.cell.done{opacity:.34;filter:grayscale(.7)}
.cell{position:relative;aspect-ratio:1;border:1px solid var(--rule);border-radius:4px;
  background:var(--panel);display:flex;align-items:center;justify-content:center;
  padding:12%;cursor:default;transition:border-color .12s,background .12s}
.cell svg{width:100%;height:100%}
.cell.emp{background:#181512;border-style:dashed;opacity:.45}
.cell.done{opacity:.28}
.cell.adj{cursor:pointer;border-color:var(--rule2);background:#211d17}
.cell.adj:hover{border-color:var(--brass);background:var(--raise)}
.cell.here{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset;opacity:1}
.cell.risk{border-color:#6b2b2b;background:#241416;opacity:.8}

.cell.risk::after{content:"";position:absolute;inset:0;border-radius:4px;

.cell .you{position:absolute;bottom:-2px;right:2px;color:var(--brass);font-size:11px}

/* 팔려고 고른 물건 */
.rw.sellon{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger) inset}
.sellq{margin-top:6px;color:var(--danger);font-size:11.5px}
/* 손패에서 고른 카드 */
.card.picked{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass),0 6px 18px rgba(0,0,0,.5);

.pickbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;

/* ── 상점 ── 가운데 주인 · 오른쪽 판매하기 · 아래 품목 판 ── */
.shophead{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;margin-top:14px}

  display:flex;align-items:center;gap:5px;justify-content:center}

.sellwrap{grid-column:3;justify-self:end}
.shopsub{text-align:center;margin-top:16px;font-size:13px;color:var(--dim)}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));

.good{--gc:var(--brass);position:relative;overflow:visible;cursor:pointer;

.good::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--gc);

.good:hover{border-color:var(--gc);transform:translateY(-3px);

.good.g1{--gc:var(--g-low)} .good.g2{--gc:var(--g-mid)} .good.g3{--gc:var(--g-high)}
.good.g4{--gc:#6aa8e0} .good.g5{--gc:#7fd39a} .good.g6{--gc:var(--g-rare)}
.good.no{opacity:.42;cursor:default;filter:grayscale(.5)}
.good.no:hover{transform:none;border-color:var(--rule2);box-shadow:0 5px 15px rgba(0,0,0,.42)}
.good .gi{width:64px;height:64px;margin:4px auto 9px;display:flex;

.good .gp .short{font-style:normal;font-size:10.5px;font-weight:600;color:var(--danger)}
.good .gq{margin-top:4px;font-size:10.5px;color:var(--faint);letter-spacing:.05em}
.good .gd{margin-top:9px;width:100%;padding:8px 9px;border-radius:5px;

.good .gd p{margin:0;font-size:11.5px;line-height:1.65;color:var(--fg);opacity:.9}
.good .gd .rcp{border-top:0;padding-top:5px;margin-top:5px}
.good.sellon{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger) inset}
.good .sellq{color:var(--danger);font-size:10.5px;margin-top:5px}
/* 상점의 카드 품목 — 커서를 올리면 어떤 카드인지 보여 준다.

.cardtip .ct-i{width:54px;height:54px;margin:0 auto 6px}
.cardtip .ct-i svg,.cardtip .ct-i img{width:100%;height:100%;display:block}
.cardtip b{display:block;text-align:center;color:var(--fg);font-size:12.5px;margin-bottom:4px}
.cardtip p{font-size:11px;color:var(--dim);line-height:1.5;text-align:center;margin:0}
.rwcond{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:7px}
.cxr1 .rwcond,.tr1 .rwcond{justify-content:flex-start;margin-top:5px}
.chip.cond{background:rgba(201,162,39,.12);border-color:rgba(201,162,39,.5);color:var(--brass)}
.hp-hb{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.routebar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 12px;

.cell{cursor:pointer}
.cell .rn{position:absolute;left:2px;bottom:0;font-size:9.5px;font-weight:800;

kbd{display:inline-block;min-width:20px;text-align:center;padding:1px 7px;font-size:11.5px;

/* ── NPC 화면 (상점 · 미지의 구역) ── */
.npcbox{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start;margin-top:12px}
.npc{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:16px;text-align:center}
.npcface{width:154px;height:154px;margin:0 auto 12px;border-radius:var(--rd2);

  transition:transform .12s,border-color .12s}

/* 룰렛 — 판은 가만히 있고 바늘이 돈다. 판을 돌리면 글자가 누워 안 읽힌다. */

.rltdisc{display:block;width:212px;height:212px;overflow:visible}

  stroke:rgba(255,255,255,.4);stroke-width:.7;transition:opacity .25s}
.rltdisc .hub{fill:#241d15;stroke:var(--brass);stroke-width:2.5}
.rltdisc .hub2{fill:none;stroke:rgba(201,162,39,.5);stroke-width:1.5}

.rltdisc .ndl{fill:#f2e6c8;stroke:#2a2118;stroke-width:2;stroke-linejoin:round;
  filter:drop-shadow(0 0 6px rgba(255,246,224,.55))}
.rltdisc .ndlp{fill:#c9503f;stroke:#2a2118;stroke-width:1.5}
.rlt.landed .sl{opacity:.28}
.rlt.landed .sx{opacity:.35}
.rlt.landed .sl.win{opacity:1;stroke:#fff6e0;stroke-width:3.5;
  filter:drop-shadow(0 0 10px rgba(255,246,224,.9))}

const KW={}, KW_DESC={};

/* 긴 이름부터 찾아야 "에너지 보호막"이 "보호막"에 먹히지 않는다 */
const KW_NAMES=KW_TAB.map(k=>k.n).sort((a,b)=>b.length-a.length);
const KW_COLOR={plain:"#c8bda8",skill:"#e0a86a",buff:"#7fd39a",debuff:"#c58fd0",
  atk:"#e0705a",mag:"#6aa8e0",def:"#e0c85a",hp:"#7fd39a",move:"#5fd8cf"};
let KW_RE=null;
function kwRegex(){
  if(KW_RE) return KW_RE;
  const esc2=x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const parts=["_[^_]+_","\\*[^*]+\\*"].concat(KW_NAMES.map(esc2));
  KW_RE=new RegExp(parts.join("|"),"g");
  return KW_RE;
}
/* 한 번만 훑어서 강조·아이콘·키워드를 모두 처리한다 */
function icoify(html){
  return String(html).replace(kwRegex(),m=>{
    if(m.charAt(0)==="_"&&m.length>2) return '<u>'+m.slice(1,-1)+'</u>';
    if(m.charAt(0)==="*"&&m.length>2) return '<i>'+m.slice(1,-1)+'</i>';
    const st={"공격력":"atk","마법력":"mag","보호력":"def"}[m];
    if(st) return '<span class="kw kwq ikw" data-kw="'+m+'">'+ic(st)+'</span>';
    const c=KW_COLOR[KW[m]]||KW_COLOR.plain;
    const d=KW_DESC[m];
    return '<b class="kw'+(d?' kwq':'')+'" style="color:'+c+'"'
      +(d?' data-kw="'+esc(m)+'"':'')+'>'+m+'</b>';
  });
}

/* ═══════════ 배경음악 ═══════════
   파일은 bgm/ 폴더에 따로 둔다. 한 파일 게임에 14MB 를 심을 수는 없다.
   곡을 더 넣을 때는 BGM_SRC 에 파일 이름을, sceneBgm() 에 어느 화면인지를
   적으면 된다. 그 둘 말고는 손댈 곳이 없다. */
const BGM_SRC={
  main  :"bgm/main.mp3",     /* 타이틀 · 지도(낮) · 주둔지 */
  night :"bgm/night.mp3",    /* 지도(밤) */
  battle:"bgm/battle.mp3",   /* 전투 · 정예 */
  boss1 :"bgm/boss1.mp3",    /* 우두머리 */
  shop  :"bgm/shop.mp3",     /* 상점 */
  forge :"bgm/forge.mp3",    /* 제련소 */
  reward:"bgm/reward.mp3"    /* 보상 · 레벨업 (한 번만 울리는 짧은 곡) */
};
/* 지금 화면에 맞는 곡. 없으면 null — 그러면 소리를 끈다 */
function sceneBgm(){
  if(view==="battle"||view==="wavegap")
    return (B&&B.kind==="boss")?"boss1":"battle";
  if(view==="shop") return "shop";
  if(view==="forge") return "forge";
  if(view==="title"||view==="over"||view==="clear") return "main";
  if(!run) return "main";
  return run.night?"night":"main";
}
const BGM=(()=>{
  const VOL=0.42, FADE=700;      /* 효과음이 묻히지 않을 만큼만 */
  let on=true, cur=null, want=null, unlocked=false;
  let a=null, b=null, live=null;   /* 두 개를 번갈아 쓴다 */
  let sting=null;
  function make(){
    const e=new Audio(); e.loop=true; e.preload="none"; e.volume=0;
    e.addEventListener("error",()=>{},false);
    return e;
  }
  function els(){ if(!a){ a=make(); b=make(); live=a } return true }
  function fade(el,to,ms,then){
    if(!el) return;
    if(el._ft) clearInterval(el._ft);
    const from=el.volume, t0=performance.now();
    el._ft=setInterval(()=>{
      const k=Math.min(1,(performance.now()-t0)/ms);
      try{ el.volume=Math.max(0,Math.min(1,from+(to-from)*k)) }catch(e){}
      if(k>=1){ clearInterval(el._ft); el._ft=0; if(then) then() }
    },40);
  }
  function swap(key){
    els();
    const nxt=(live===a)?b:a, old=live;
    nxt.src=BGM_SRC[key]; nxt.volume=0;
    const p=nxt.play();
    if(p&&p.catch) p.catch(()=>{ unlocked=false });
    fade(nxt,VOL*(sting?0.35:1),FADE);
    if(old&&!old.paused) fade(old,0,FADE,()=>{ try{ old.pause(); old.src="" }catch(e){} });
    live=nxt; cur=key;
  }
  return {
    /* 화면이 바뀔 때마다 부른다. 같은 곡이면 아무 일도 하지 않는다 */
    sync(){
      const key=on?sceneBgm():null;
      want=key;
      if(!unlocked) return;
      if(key===cur) return;
      if(!key){ if(live){ fade(live,0,FADE,()=>{try{live.pause()}catch(e){}}) } cur=null; return }
      swap(key);
    },
    /* 손을 댄 첫 순간 — 브라우저가 그제야 소리를 내 준다 */
    unlock(){
      if(unlocked||!on) return;
      unlocked=true;
      cur=null; this.sync();
    },
    /* 보상·레벨업처럼 한 번만 울리는 곡. 그동안 배경음은 낮춘다 */
    once(key){
      if(!on||!unlocked||!BGM_SRC[key]) return;
      try{ if(sting){ sting.pause() } }catch(e){}
      sting=new Audio(BGM_SRC[key]); sting.volume=VOL*1.25;
      if(live) fade(live,VOL*0.35,300);
      const back=()=>{ sting=null; if(live) fade(live,VOL,700) };
      sting.addEventListener("ended",back);
      sting.addEventListener("error",back);
      const p=sting.play(); if(p&&p.catch) p.catch(back);
    },
    stop(){ if(live){ fade(live,0,300,()=>{try{live.pause()}catch(e){}}) } cur=null;
            try{ if(sting) sting.pause() }catch(e){} sting=null },
    set on(v){ on=!!v; if(!on) this.stop(); else { cur=null; this.sync() } },
    get on(){ return on },
    get now(){ return cur }
  };
})();

function sparks(p,color,cnt){
  const n=Math.round(cnt*1.9);
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, d=26+Math.random()*66;
    const big=Math.random()<0.3;
    const sp=spawn('<div class="spark'+(big?" big":"")+'" style="background:'+color+'"></div>');
    if(!sp) continue;
    at(sp,p);
    sp.style.setProperty("--dx",(Math.cos(a)*d)+"px");
    sp.style.setProperty("--dy",(Math.sin(a)*d)+"px");
    sp.style.animationDelay=(Math.random()*90)+"ms";
  }
  /* 바닥으로 흩어지는 잔해 */
  for(let i=0;i<Math.round(cnt*0.6);i++){

function soulFX(from,to,color,cnt){
  SFX.play("soul");
  const a=ctrOf(from.side,from.slot), b=to?ctrOf(to.side,to.slot):null;
  if(!a) return;
  const col=color||"#9ecbf5";
  at(spawn('<div class="soulring" style="border-color:'+col+'"></div>'),a);
  const n=cnt||5;
  for(let i=0;i<n;i++) setTimeout(()=>{
    const w=spawn('<div class="soul" style="background:'+col+'"></div>');
    if(!w) return;
    const jx=(Math.random()*26-13), jy=(Math.random()*26-13);
    w.style.left=(a.x+jx)+"px"; w.style.top=(a.y+jy)+"px";
    void w.offsetWidth;
    w.style.transition="left .55s cubic-bezier(.4,0,.3,1),top .55s cubic-bezier(.4,0,.3,1),opacity .5s,transform .55s";
    if(b){ w.style.left=(b.x+jx*0.3)+"px"; w.style.top=(b.y+jy*0.3)+"px" }
    else { w.style.top=(a.y-70)+"px" }
    w.style.opacity="0"; w.style.transform="translate(-50%,-50%) scale(.3)";
  }, i*55);
  if(b) setTimeout(()=>{
    at(spawn('<div class="soulring" style="border-color:'+col+'"></div>'),b);
    sparks(b,col,9);
  }, 60+n*55);
}
/* 사슬로 끌어당긴다 */
function chainFX(from,to,color){
  SFX.play("chain");
  const a=ctrOf(from.side,from.slot), b=ctrOf(to.side,to.slot);
  if(!a||!b) return;
  const col=color||"#8fa2c9";
  for(let i=0;i<7;i++) setTimeout(()=>{
    const t=i/6;
    const lk=spawn('<div class="link" style="border-color:'+col+'"></div>');
    if(lk){ lk.style.left=(a.x+(b.x-a.x)*t)+"px"; lk.style.top=(a.y+(b.y-a.y)*t)+"px" }
  }, i*26);
  setTimeout(()=>sparks(b,col,8),200);
}

/* 나이코스 검격 — 받은 낱장 여섯 칸을 적 위에서 한 번 돌린다 */

  const u=(typeof ICON_PNG!=="undefined")&&ICON_PNG.fx_naikos_slash;
  if(!u) return;
  const p=ctrOf(side,slot); if(!p) return;

/* ═══════════ 체력바 연출 ═══════════
   체력이 달라졌으면 바가 깜박이면서 천천히 줄거나 찬다.
   잔상(em.gh)이 한 박자 늦게 따라와 얻어맞은 몫을 보여 준다. */
let HKSEQ=0, HPMEM={}, SHMEM={};
function hpKey(u){ if(!u) return ""; if(!u._hk) u._hk="U"+(++HKSEQ); return u._hk }
function hpAnim(){
  document.querySelectorAll(".bar[data-hpk]").forEach(bar=>{
    const k=bar.dataset.hpk, now=parseFloat(bar.dataset.hpv)||0;
    const nowN=parseFloat(bar.dataset.hpn);
    const fill=bar.querySelector("i"), gh=bar.querySelector("em.gh");
    const art=bar.closest(".slot") && bar.closest(".slot").querySelector(".art");
    const mem=HPMEM[k];
    const prev=mem?mem.p:null, prevN=mem?mem.n:null;
    HPMEM[k]={p:now,n:nowN};
    /* 보호막이 늘었으면 머리 위로 방패를 하나 띄운다 */
    { const sh=parseFloat(bar.dataset.shv)||0, psh=SHMEM[k];
      SHMEM[k]=sh;
      if(art&&psh!=null&&sh>psh+0.001){
        art.querySelectorAll(".shpop").forEach(x=>x.remove());
        const n=el('<span class="shpop">'+ic("def")+"+"+Math.round(sh-psh)+"</span>");
        art.appendChild(n); setTimeout(()=>n.remove(),860);
      } }
    if(!fill||!gh) return;
    /* 실제 체력이 그대로면 아무 일도 없었던 것이다 (최대 체력만 바뀐 경우) */
    const same=(prevN!=null&&!isNaN(nowN))?(prevN===nowN):(prev!=null&&Math.abs(prev-now)<0.05);
    if(prev==null||same){ gh.style.width=now+"%"; fill.style.width=now+"%"; return }
    const hurt=(prevN!=null&&!isNaN(nowN))?(nowN<prevN):(now<prev);
    /* 체력이 닳았으면 캐릭터도 같이 점멸한다 */
    if(hurt&&art){
      art.classList.remove("hpblink"); void art.offsetWidth; art.classList.add("hpblink");
      setTimeout(()=>art.classList.remove("hpblink"),620);
    }
    /* 시작점에 세워 둔다 */
    gh.style.transition="none";   gh.style.width=prev+"%";
    fill.style.transition="none"; fill.style.width=prev+"%";
    bar.classList.remove("hurt","healed");
    void bar.offsetWidth;                       /* 애니메이션을 다시 물린다 */
    bar.classList.add(hurt?"hurt":"healed");
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      fill.style.transition="width .46s cubic-bezier(.24,.74,.28,1)";
      fill.style.width=now+"%";
      gh.style.transition="";                   /* CSS 쪽 느린 전환으로 되돌린다 */
      gh.style.width=now+"%";
    }));
    setTimeout(()=>{ bar.classList.remove("hurt","healed") },660);
  });
}
/* 연출 속도 — 1 보통 / 0.5 빠르게. 되풀이해 놀 때 기다리는 시간을 줄인다 */

const POSE_MS={atk:520,hurt:620,bless:1200,stun:900,guard:520};
/* 캐릭터 전용 공격 효과음 — art/소리/ 의 파일 이름을 그대로 적는다.

const ATK_SFX={"나이코스":"나이코스 공격"};
function setPose(side,slot,pose,ms){
  const p=ctrOf(side,slot); if(!p) return;
  const img=p.e.querySelector("img.pxs[data-nm]"); if(!img) return;
  const now=poseOf(img.dataset.nm,pose);
  if(!now||now===poseOf(img.dataset.nm,img.dataset.pose)) return;
  if(img._pt) clearTimeout(img._pt);
  const back=poseOf(img.dataset.nm,img.dataset.pose||"idle");
  img.src=now.u; img.style.setProperty("--ph",now.ph);
  img._pt=setTimeout(()=>{ img._pt=0;
    if(back&&img.isConnected){ img.src=back.u; img.style.setProperty("--ph",back.ph) }
  }, Math.round((ms||POSE_MS[pose]||520)*SPD));
}
/* 앞으로 파고들었다(공격) 뒤로 물러났다(피격) 제자리로 — 즉각 반응.
   transform 이 아니라 translate 속성을 쓴다. 적 스프라이트에 걸린
   scale(1.12/1.26/1.45) 을 건드리지 않기 위해서다. */
function nudge(side,slot,dir){
  const p=ctrOf(side,slot); if(!p||!p.e) return;
  const art=p.e.querySelector(".art"); if(!art) return;
  const sp=art.querySelector("img.pxs,svg"); if(!sp) return;
  const away=(side==="foe"?-1:1)*(dir>0?11:-8);
  if(sp._nt) clearTimeout(sp._nt);
  sp.style.transition="translate .09s cubic-bezier(.2,.9,.3,1)";
  sp.style.translate=away+"px";
  sp._nt=setTimeout(()=>{ sp._nt=0;
    sp.style.transition="translate .3s cubic-bezier(.3,.55,.3,1)";
    sp.style.translate="0px";
  }, dir>0?150:130);
}

  const g=Math.max(0,Math.min(255,Math.round(((n>>8)&255)*f)));
  const b=Math.max(0,Math.min(255,Math.round((n&255)*f)));
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

const PXCACHE={};
/* 환영 — 원본의 색을 띤 반투명한 형체 */
function phantomFigure(of){
  const key="__ph_"+of;
  if(PXCACHE[key]) return PXCACHE[key];
  const L=LOOK[of]||LOOK["작은 죄수"];
  const grid=PX_BODY.wisp.map(r=>r.split(""));
  const P={".":null,"O":"#0a0809","S":shade(L.skin,0.72),"s":shade(L.skin,0.5),
           "C":shade(L.cloth,1.05),"c":shade(L.cloth,0.72),"d":shade(L.cloth,0.55),
           "L":shade(L.cloth,1.35),"D":L.dark,"N":"#c5bdb2",
           "M":"#a9a29a","m":"#6e6862","A":"#9ecbf5","E":"#12101a",
           "H":shade(L.dark,0.9),"h":shade(L.dark,0.62),"W":"#d6cec1","w":"#8a837a"};
  let out='<svg class="pxs ph" viewBox="0 0 32 32" shape-rendering="crispEdges">';
  for(let y=0;y<grid.length;y++){
    let x=0;
    while(x<PXW){
      const ch=grid[y][x];
      if(!ch||ch==="."||!P[ch]){ x++; continue }
      let w=1; while(x+w<PXW&&grid[y][x+w]===ch) w++;
      out+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="1" fill="'+P[ch]+'"/>';
      x+=w;
    }
  }
  out+="</svg>";
  PXCACHE[key]=out;
  return out;
}
const FOE_NAMES={"작은 죄수":1,"사슬 광인":1,"굶주린 그림자":1,"부서진 파수병":1,
 "균열 벌레":1,"얼음 정령":1,"간수장":1,"고철 거인":1,"서리 군주":1,"악마 하수인":1};

function poseNow(u){

}

function poseOf(name,pose){

function pxFigure(name,pose){
  const set=PNG_SPRITE[name];

    const p=(pose&&set[pose])?pose:"idle";
    const v=set[p];
    if(v){
      const ck="@"+name+"|"+p;
      if(PXCACHE[ck]) return PXCACHE[ck];
      const isFoe0=!!FOE_NAMES[name];
      return PXCACHE[ck]='<img class="pxs '+(isFoe0?"foe":"hero")+'" data-nm="'+name
        +'" data-pose="'+p+'" style="--ph:'+v.ph+'" src="'+v.u+'" alt="" draggable="false">';
    }
  }
  if(PXCACHE[name]) return PXCACHE[name];
  const L=LOOK[name]||LOOK["작은 죄수"];
  const K=PX_KIT[name]||{b:(L.build==="huge"?"hulk":L.build==="small"?"runt":L.build==="wide"?"armor":"cloak"),
                         h:L.horn?"horn":"none", a:PX_ARM[L.arm]?L.arm:"none"};
  const custom=PX_CUSTOM[name];
  const grid=(custom||PX_BODY[K.b]||PX_BODY.cloak).map(r=>r.split(""));
  const put=list=>(list||[]).forEach(([y,x,c])=>{ if(grid[y]&&x>=0&&x<PXW) grid[y][x]=c });
  /* 전용 격자는 이미 다 그려져 있으므로 투구·무기를 덧대지 않는다 */
  if(!custom){ put(PX_HEAD[K.h]); put(PX_ARM[K.a]) }
  const P={
    ".":null, "O":"#0a0809",

    "C":shade(L.cloth,0.78), "c":shade(L.cloth,0.52), "d":shade(L.cloth,0.34),
    "L":shade(L.cloth,1.02), "D":shade(L.dark,0.7),

    "A":shade(L.acc||"#c9a227",0.82), "E":"#e8dfa0",

    "R":"#b3453a", "G":"#84a468", "B":"#6aa8e0"
  };
  const isFoe=!!FOE_NAMES[name];

  if(isFoe){
    /* 적 — 핏기 없는 살갗, 검붉은 윤곽, 붉게 타는 눈, 옷은 더 탁하게 */
    P["S"]=shade(L.skin,0.58); P["s"]=shade(L.skin,0.38);
    P["O"]="#160709"; P["E"]="#ff6a4d";
    P["C"]=shade(L.cloth,0.6); P["c"]=shade(L.cloth,0.4); P["d"]=shade(L.cloth,0.26);
    P["L"]=shade(L.cloth,0.8);
    P["M"]="#5a544d"; P["N"]="#7b736a"; P["m"]="#302d2a";
    P["W"]="#8b8175"; P["w"]="#4e4841";
    P["A"]=shade(L.acc||"#8e2b2b",0.9);
    if(isBoss){ P["E"]="#ff3b26"; P["O"]="#1c0507"; P["A"]=shade(L.acc||"#c9a227",1.05) }
  }
  let out='<svg class="pxs'+(isFoe?" foe":" hero")+'" viewBox="0 0 32 32" shape-rendering="crispEdges">';
  for(let y=0;y<grid.length;y++){
    let x=0;
    while(x<PXW){
      const ch=grid[y][x];
      if(!ch||ch==="."||!P[ch]){ x++; continue }
      let w=1;
      while(x+w<PXW&&grid[y][x+w]===ch) w++;
      out+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="1" fill="'+P[ch]+'"/>';
      x+=w;
    }
  }
  out+="</svg>";
  PXCACHE[name]=out;
  return out;
}

  return `<svg viewBox="0 0 40 52" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="20" cy="50" rx="${W}" ry="2.6" fill="#000" opacity=".35"/>

 "미천한 이들에게 탐욕을":"이 대원이 주둔지에서 휴식하면 굴라는 3, 휴식하는 다른 아군들은 1의 최대 체력을 얻습니다.",

 "보물 사냥꾼":"데린저가 보상을 얻을 때마다 금화 _개와 보물 점수를 얻습니다.\n보물 점수는 보상에 따라 다릅니다.\n(하급 보상 1점, 중급 보상 3점, 상급 보상 5점)\n\n보물 점수 5점마다 영구적으로 공격력 1을 얻습니다. 얻은 공격력 *( ) *",

 "비늘 폭발":"사용한도(1). _비늘 조각_을 모두 소모하여 그 수*( )*만큼 모든 적에게 피해를 줍니다.",

 "사형 선고":"전투 시작시 2턴 잠금된 상태로 시작합니다.\n우두머리가 아닌 대상을 처치하고 50%의 체력을 가진 상태로 부활시킵니다. *(전투당 1회)*\n\n아군이면 마법력 2를 부여합니다.\n적군이면 2턴간 공포를 부여합니다.",

 "어둠 증식":"사용한도(2). 대상 위치에 어두운 그림자를 남깁니다. 그림자가 이미 있었다면 어두운 그림자로 교체합니다. \n어두운 그림자로 이동하면, 다음 상대 턴에 은신 대신 도발과 갑피 4를 얻습니다.",

 "영광의 휘장":"아군 대원에게 피해를 4주고 회피를 1 부여합니다.",
 "영혼 분리":"잠금(3). 선택한 자리에 체력이 가장 낮은 적의 환영을 소환합니다.\n환영은 적과 같은 체력을 지니고, 아무 행동도 하지 않습니다.\n처치되면 원래 적에게 피해 4(추가 ∴ +대상 최대 체력의 10%)를 줍니다.\n\n환영으로 얻을 수 있는 영혼은 1개입니다.\n\n영혼 40개당 최대 체력 비례 피해량이 2.5% 증가합니다.\n\n환영이 내 전장에 소환되면 도발을 얻습니다.\n환영은 전장에 최대 하나만 활성화할 수 있습니다.\n환영은 원래 적이 죽을 시 같이 죽습니다.",

 "왕실 지혜 도서관":"도미니코는 기술을 사용할때마다 _독서_ 중첩을 얻습니다.\n_독서_ 중첩이 10이 되면 중첩을 모두 소모하고 _축복 상태_가 되어 다음 기술을 1회 강화합니다. 얻은 독서 중첩 *( )*",
 "융합":"아군 전장에 있는 모든 소환물을 처치합니다.\n처치한 소환물들의 체력만큼 굴라가 체력을 얻습니다. \n처치한 소환물 하나 당 굴라가 공격력, 마법력, 보호력을 3 얻습니다.",

 "자동변환단총":"_탄알_을 1 소모하여 적에게 피해를 2(추가 † ) 줍니다.(거리 2)\n\n남은 탄알 : 5/5\n어떤 개조를 하더라도 제대로 작동하는 죽이는 총!",
 "잠재력 활성":"잠금 (2). 이번 턴에 진선풍도가 거리 내의 모든 적에게 피해를 주고, 회오리는 모든 적을 공중으로 띄웁니다.\n다음 4번의 산들바람의 비용이 0이 됩니다.",
 "재능 시기":"적을 처치할 때마다 인비디아가 해당 전투에서 적들의 능력치를 얻습니다.\n\n적 처치시 얻을 수 있는 능력치(각 25% 확률로)\n공격력 1, 마법력 1, 보호력 1, 체력 4",
 "저주받은 성벽":"이 소환물이 죽은 후, 거리 1 내의 대상에게 보호약화를 2 부여합니다. 이동할 수 없습니다.",

function synCount(t){ return run?run.heroes.filter(h=>!h.down&&hasTag(h,t)).length:0 }
/* 지금 켜져 있는 조합 — [{n,k,c,need,d}] */
function synActive(){
  const out=[];
  SYNERGY.forEach(sy=>{
    const c=synCount(sy.n); if(!c) return;
    let best=null;
    sy.t.forEach(x=>{ if(c>=x.c&&(!best||x.c>best.c)) best=x });
    out.push({n:sy.n,k:sy.k,c:c,on:best,next:sy.t.find(x=>x.c>c)||null});
  });
  return out;
}
/* 전투 시작에 능력치 조합을 걸어 준다 (전투 단위, clearTmp 로 함께 풀림) */
function applySynergy(){
  const A=synActive(); run.synOn=A;
  const has=(n,c)=>A.some(x=>x.n===n&&x.c>=c);
  const each=(t,fn)=>run.heroes.forEach(h=>{ if(!h.down&&hasTag(h,t)) fn(h) });
  if(has("전투가",2)) each("전투가",h=>bumpTmp(h,"atk",2));
  if(has("마법사",2)) each("마법사",h=>bumpTmp(h,"mag",2));
  if(has("수호자",3)) each("수호자",h=>bumpTmp(h,"def",5));
  else if(has("수호자",2)) each("수호자",h=>bumpTmp(h,"def",2));
  if(has("영광 숭배자",2)) each("영광 숭배자",h=>{ h.gloryGuard=1 });
  if(has("피의 투기장",2)) each("피의 투기장",h=>{ h.arenaHeal=3 });
  const sup=synCount("지원가");
  run.synSupport=sup>=3?8:sup>=2?4:sup>=1?2:0;
}
/* 방랑자는 전장 상황을 보므로 배치될 때마다 다시 잰다 */
function wanderCheck(){
  const on=onField();
  run.heroes.forEach(h=>{
    if(!hasTag(h,"방랑자")) return;
    const solo=(run.field>=1)?5:0;      /* 홀로 서는 보너스는 2구역부터 */
    const want=(on.length>=3&&on.every(a=>hasTag(a,"방랑자")))?10
              :(on.length===1&&on[0]===h)?solo:0;
    const cur=h.wanderBonus||0;
    if(want===cur) return;
    const d=want-cur;
    bumpTmp(h,"atk",d); bumpTmp(h,"mag",d); bumpTmp(h,"def",d);
    h.wanderBonus=want;
    if(want>cur) say(`방랑자 — ${h.name}의 능력치가 ${want} 올랐습니다.`,"t1");
  });
}

   전투에 계속 남는 것(기술 강화 · 대원 강화 · 추가 기술)과
   그 자리에서 쓰고 마는 것(재화 · 장신구 · 카드 · 주둔지)을 가르는 게 목적이다. */
const REW_KEEP=["기술 강화","대원 강화","추가 기술"];
function skillNamesOf(h){
  const out=[];
  const put=s=>{ if(!s||!s.n) return; if(out.indexOf(s.n)<0) out.push(s.n);
    if(s.alt) put(s.alt); (s.opts||[]).forEach(put) };
  if(h){
    (h.sk||[]).forEach(put);
    const d=HEROES[h.name];
    if(d){ (d.skills||[]).forEach(put);
      if(d.passive&&d.passive.n&&out.indexOf(d.passive.n)<0) out.push(d.passive.n) }
    (PASSIVE_INFO[h.name]||[]).forEach(p=>{ if(out.indexOf(p.n)<0) out.push(p.n) });
  }
  return out;
}

function recipeLines(it){
  const L=[];
  if(it.rc) L.push("재료 : "+it.rc.join(" + ")+" · 제련석 "+it.cost);
  const into=ITEMS.filter(x=>x.rc&&x.rc.indexOf(it.n)>=0);
  if(into.length) L.push("쓰임 : "+into.map(x=>x.n).join(", "));
  if(!L.length) L.push("제련과는 관계없는 장신구입니다.");
  return L;
}
function recipeHtml(it){
  /* 장신구 이름은 그냥 이름이다. 키워드 물들이기를 돌리면
     '마나흡수자'의 흡수, '동력 전환화'의 전환 같은 조각이 굵어져 지저분해진다. */
  return recipeLines(it).map(t=>`<p class="rcp">${esc(t)}</p>`).join("");
}
function itemTip(it){ return it.n+" — "+it.d+"\n"+recipeLines(it).join("\n") }
function findRecipe(a,b){
  const key=[a,b].sort().join("|");
  return ITEMS.find(it=>it.rc&&it.rc.slice().sort().join("|")===key)||null;
}
const ITEM_MAX=3;
function equip(h,it){
  SFX.play("equip");
  h.items.push(it);
  if(it.st) for(const k in it.st){ h[k]+=it.st[k]; if(k==="maxHp") h.hp+=it.st[k] }
}
function unequip(h,idx,force){
  if(!force&&h.items[idx]&&h.items[idx].bind){ return null }
  const it=h.items.splice(idx,1)[0];
  if(it&&it.st) for(const k in it.st){ h[k]-=it.st[k]; if(k==="maxHp") h.hp=Math.min(h.hp,h.maxHp) }
  return it;
}
function itemBt(h,key){ return (h.items||[]).reduce((a,i)=>a+((i.bt&&i.bt[key])||0),0) }
/* 회복 — 전투 중 회복이 막힌 대상은 여기서 걸러진다 */
function healUp(u,v,quiet){
  if(!u||v<=0) return 0;
  if(view==="battle"&&itemBt(u,"noHeal")){
    if(!quiet&&typeof say==="function"&&B&&!B.over){
      const it=(u.items||[]).find(x=>x.bt&&x.bt.noHeal);
      say(`${it?it.n:"저주"} — ${u.name}${jo(u.name,"eun")} 전투 중 회복할 수 없습니다.`,"t3");
    }
    return 0;
  }
  const got=Math.min(v,u.maxHp-u.hp);
  u.hp+=got;
  return got;
}
/* 강제 착용 — 칸이 없으면 가방으로 가지 않고 기존 것을 밀어낸다 */
function forceEquip(h,it){
  if(!h) return null;
  h.items=h.items||[];
  if(h.items.length>=ITEM_MAX){
    let idx=-1;
    for(let i=h.items.length-1;i>=0;i--) if(!h.items[i].bind){ idx=i; break }
    if(idx<0) return null;              /* 전부 저주받은 물건이면 채우지 않는다 */
    const out=unequip(h,idx);
    (run.bag=run.bag||[]).push(out);
    equip(h,it);
    return out;
  }
  equip(h,it);
  return null;
}

      +(px?' style="width:'+px+'px;height:'+px+'px"':'')+'>'; }
  { const id=(typeof CARD_ICON!=="undefined")&&CARD_ICON[name];
    const im=id?iconImg(id):"";
    if(im) return px?im.replace('class="ricon"','class="ricon" style="width:'+px+'px;height:'+px+'px"'):im; }
  const F=CARD_FACE[name]||["card","#c9a227"];
  const G=PX_CARD[F[0]]||PX_ITEM.card;
  const c=F[1];
  const P={"C":c,"c":shade(c,0.62),"L":shade(c,1.35),"O":shade(c,0.3),
           "A":"#f4ead2","M":"#a9a29a","m":"#6e6862"};
  let out='<svg class="ipx" viewBox="0 0 16 16" shape-rendering="crispEdges"'
    +(px?' style="width:'+px+'px;height:'+px+'px"':'')+'>';
  for(let y=0;y<G.length;y++){
    let x=0;
    while(x<16){
      const ch=G[y][x];
      if(!ch||ch==="."||!P[ch]){ x++; continue }
      let w=1; while(x+w<16&&G[y][x+w]===ch) w++;
      out+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="1" fill="'+P[ch]+'"/>';

    }
  }
  return out+"</svg>";
}

function itemFace(it){
  if(!it) return {g:"jade",c:"#9c8d77"};
  if(it.g==="특수"||it.g==="전설") return {g:"neck",c:"#c58fb0"};
  /* 희귀는 두 번째 재료를 얼굴로 — 무엇이 되었는지가 더 중요하다 */
  const src=(it.rc&&it.rc.length)?(it.rc[1]||it.rc[0]):it.n;
  for(const [key,g,c] of IT_ROOT) if(String(src).indexOf(key)>=0) return {g:g,c:c};
  for(const [key,g,c] of IT_ROOT) if(String(it.n).indexOf(key)>=0) return {g:g,c:c};
  return {g:"jade",c:"#9c8d77"};
}

  { const id=(typeof ITEM_ICON!=="undefined")&&it&&ITEM_ICON[it.n];
    const u=id&&(typeof ICON_PNG!=="undefined")&&ICON_PNG[id];
    if(u) return '<img class="ricon" src="'+u+'" alt="" draggable="false"'
      +(px?' style="width:'+px+'px;height:'+px+'px"':'')+'>'; }
  const F=itemFace(it), G=PX_ITEM[F.g]||PX_ITEM.jade;
  const P={"C":F.c,"c":shade(F.c,0.62),"L":shade(F.c,1.35),"O":shade(F.c,0.3),
           "A":"#f4ead2","M":"#a9a29a","m":"#6e6862"};
  let out='<svg class="ipx" viewBox="0 0 16 16" shape-rendering="crispEdges"'
    +(px?' style="width:'+px+'px;height:'+px+'px"':'')+'>';
  for(let y=0;y<G.length;y++){
    let x=0;
    while(x<16){
      const ch=G[y][x];
      if(!ch||ch==="."||!P[ch]){ x++; continue }
      let w=1; while(x+w<16&&G[y][x+w]===ch) w++;
      out+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="1" fill="'+P[ch]+'"/>';
      x+=w;
    }
  }
  return out+"</svg>";
}

function gearRow(h){

      out+='<span class="gs on" style="--fr:'+fr+'" title="'+esc(itemTip(it))+'">'
          +itemIcon(it)+'</span>';
    } else out+='<span class="gs"></span>';
  }
  return out+"</div>";
}

function addDeb(u,k,n,src){
  if(!u) return;
  u.deb=u.deb||{};
  if(k==="fear"&&src){ u.fearSrc=uid(src); u.fearName=src.name }
  /* 부정 보호막은 부정적인 효과를 1회(중첩 하나) 걷어낸다 */
  if(u.negShield>0&&n>0){
    const cut=Math.min(u.negShield,n);
    u.negShield-=cut; n-=cut;
    fx({side:u.isFoe?"foe":"mine",slot:u.slot,ring:"#7fd39a",txt:"−"+cut,cls:"shd",gap:70});
    say(`부정 보호막이 ${DEBUFF[k].n} ${cut}${jo(String(cut),"eul")} 걷어냅니다.${
      n>0?` (${DEBUFF[k].n} ${n} 남음)`:""}`,"t2");
    { const ne=itemBt(u,"negEsh");
      if(ne){ u.eshield=(u.eshield||0)+ne*cut }
      const nm=itemBt(u,"negMana"); if(nm) u.mana=(u.mana||0)+nm;
      const nh=itemBt(u,"negHeal");
      if(nh&&!itemBt(u,"noHeal")) healUp(u,nh);
      const ed=itemBt(u,"emptyDef");
      if(ed&&u.negShield<=0&&!u.emptyDefOn){ u.emptyDefOn=1; bumpTmp(u,"def",ed) } }
    if(u.tag&&u.tag.negHeal){ healUp(u,u.tag.negHeal) }
    if(n<=0) return;
  }
  u.deb[k]=(u.deb[k]||0)+n;
  fx({side:u.isFoe?"foe":"mine",slot:u.slot,ring:DEBUFF[k].c,txt:DEBUFF[k].n+u.deb[k],cls:"miss",gap:80,

    (k==="fear"&&u.fearName)?` (${u.fearName}${jo(u.fearName,"eul")} 겨눌 수 없음)`:""}`,"t3");
  if(u.tag&&u.tag.negHeal){ healUp(u,u.tag.negHeal) }
}

/* ═══════════ 픽셀 시계 ═══════════ */
function clockFace(px){
  const N=24, C=11.5;
  const g=[]; for(let y=0;y<N;y++) g.push(new Array(N).fill("."));
  const put=(x,y,ch)=>{ x=Math.round(x); y=Math.round(y);
    if(x>=0&&x<N&&y>=0&&y<N) g[y][x]=ch };
  /* 테두리 — 두 겹 원 */
  for(let a=0;a<360;a+=2){
    const r=a*Math.PI/180;
    put(C+Math.cos(r)*10.6, C+Math.sin(r)*10.6, "O");
    put(C+Math.cos(r)*9.4,  C+Math.sin(r)*9.4,  "F");
  }
  /* 눈금 — 12·3·6·9 는 길게, 나머지는 점 */
  for(let h=0;h<12;h++){
    const r=(h/12)*Math.PI*2-Math.PI/2;
    const long=(h%3===0);
    for(let k=0;k<(long?3:1);k++){
      const d=8.2-k*0.9;
      put(C+Math.cos(r)*d, C+Math.sin(r)*d, long?"T":"t");
    }
  }
  /* 바늘 — 브레젠험으로 픽셀을 찍는다 */
  /* 바늘 — 두 줄로 그어 굵게 */
  const line=(ang,len,ch,thick)=>{
    const nx=-Math.sin(ang), ny=Math.cos(ang);
    for(let d=1;d<=len;d+=0.4){
      const x=C+Math.cos(ang)*d, y=C+Math.sin(ang)*d;
      put(x,y,ch);
      if(thick){ put(x+nx*0.9,y+ny*0.9,ch); put(x-nx*0.9,y-ny*0.9,ch) }
    }
  };
  const t=((run?run.time:6)%24+24)%24;
  const hAng=((t%12)/12)*Math.PI*2-Math.PI/2;
  const mAng=((t%1))*Math.PI*2-Math.PI/2;
  line(mAng,8.0,"M",0);   /* 분침 — 가늘고 길게 */
  line(hAng,5.0,"H",1);   /* 시침 — 굵고 짧게 */
  put(C,C,"P"); put(C+1,C,"P"); put(C,C+1,"P"); put(C+1,C+1,"P");
  put(C-1,C,"P"); put(C,C-1,"P"); put(C+2,C+1,"P"); put(C+1,C+2,"P");
  const night=run&&run.night;
  const P={
    "O":"#0a0809",
    "F":night?"#5b52a0":"#7a6742",
    "T":night?"#c9c0f0":"#e8dfc8",
    "t":night?"#9a92d8":"#bda98a",
    "H":night?"#e0d8ff":"#f0e6cf",
    "M":night?"#c9bdf5":"#e8c24a",
    "P":night?"#e0d8ff":"#f0e6cf"
  };
  /* 배경 원 */
  let bg='<circle cx="12" cy="12" r="10.2" fill="'+(night?"#171430":"#241d14")+'"/>';
  let out='<svg class="clkpx" viewBox="0 0 24 24" shape-rendering="crispEdges"'
    +(px?' style="width:'+px+'px;height:'+px+'px"':'')+'>'+bg;
  for(let y=0;y<N;y++){
    let x=0;
    while(x<N){
      const ch=g[y][x];
      if(ch==="."||!P[ch]){ x++; continue }
      let w=1; while(x+w<N&&g[y][x+w]===ch) w++;
      out+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="1" fill="'+P[ch]+'"/>';
      x+=w;
    }
  }
  return out+"</svg>";
}

function uiPng(id){

function nodeArt(t){
  { const g=uiPng((typeof NODE_ICON!=="undefined")&&NODE_ICON[t]); if(g) return g }
  const c=(NODE[t]||NODE.empty).c;
  const G=PX_NODE[t];
  if(!G) return "";
  const P={"C":c,"c":shade(c,0.62),"A":"#f0e6cf","O":shade(c,0.34)};
  let out='<svg class="npx" viewBox="0 0 16 16" shape-rendering="crispEdges">';
  for(let y=0;y<G.length;y++){
    let x=0;
    while(x<16){
      const ch=G[y][x];
      if(!ch||ch==="."||!P[ch]){ x++; continue }
      let w=1; while(x+w<16&&G[y][x+w]===ch) w++;
      out+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="1" fill="'+P[ch]+'"/>';
      x+=w;
    }
  }
  return out+"</svg>";
}

const REMAP_COST=[5,10,20];
function remapCost(){

function buildGrid(fi){
  const S=FIELDS[fi].size, g=[], mid=Math.floor(S/2);
  for(let r=0;r<S;r++){ const row=[]; for(let c=0;c<S;c++) row.push({t:"empty"}); g.push(row) }
  g[S-1][mid]={t:"camp"};
  g[0][mid]={t:"boss"};
  const free=[];
  for(let r=0;r<S;r++) for(let c=0;c<S;c++) if(g[r][c].t==="empty") free.push([r,c]);
  const put=(t,n,mk)=>{
    for(let i=0;i<n&&free.length;i++){
      const k=Math.floor(Math.random()*free.length), rc=free.splice(k,1)[0];
      g[rc[0]][rc[1]]=Object.assign({t:t},mk?mk():{});
    }
  };
  const dun=()=>({waves:1+Math.floor(Math.random()*3),style:rnd(DUN_STYLE),loot:rnd(DUN_LOOT)});
  put("dungeon",nodeCount("dungeon",fi),dun);
  put("elite",nodeCount("elite",fi),()=>({waves:1,style:rnd(DUN_STYLE),loot:rnd(DUN_LOOT)}));
  put("shop",nodeCount("shop",fi));
  put("rest",nodeCount("rest",fi));
  put("event",nodeCount("event",fi));
  put("forge",1);                 /* 제련소는 어느 구역에나 한 곳 */
  return g;
}
/* 구역이 넓어질수록 칸도 함께 늘어난다 (7x7 / 8x8 / 9x9)
   빈 칸이 절반쯤은 남아야 한다 — 길을 고르는 맛도, 밤의 습격도 빈 칸에서 난다.
   지금 밀도(주둔지·우두머리·제련소까지 세어) 51% · 50% · 46% */
const NODE_N={dungeon:[10,12,14], elite:[3,4,5], shop:[2,3,3], rest:[2,3,4], event:[5,7,8]};
function nodeCount(t,fi){
  const a=NODE_N[t]; if(!a) return 0;
  return a[Math.min(fi==null?(run?run.field:0):fi, a.length-1)];
}
/* 이미 들른 상점·쉼터·미지의 구역은 다른 날 다른 자리에 다시 나타난다.
   제련소는 넣지 않는다 — 한 번 들르면 지도를 다시 그릴 때까지 없다. */
function respawn(){
  const S=run.size, free=[];
  for(let r=0;r<S;r++) for(let c=0;c<S;c++) if(run.grid[r][c].t==="empty") free.push([r,c]);
  ["shop","rest","event"].forEach(t=>{
    const want=nodeCount(t,run.field);
    let have=0;
    for(let r=0;r<S;r++) for(let c=0;c<S;c++) if(run.grid[r][c].t===t) have++;
    for(let i=have;i<want&&free.length;i++){
      if(Math.random()<0.45) continue;              /* 7일에 걸쳐 조금씩 */
      const k=Math.floor(Math.random()*free.length), rc=free.splice(k,1)[0];
      run.grid[rc[0]][rc[1]]={t:t};
    }
  });
  /* 전투 칸을 모두 정복하면 새 전투 칸이 생긴다 */
  let left=0;
  for(let r=0;r<S;r++) for(let c=0;c<S;c++){ const x=run.grid[r][c];
    if(x.t==="dungeon"||x.t==="elite") left++ }
  if(!left){
    const n=4+Math.floor(Math.random()*3)+run.field*2;
    for(let i=0;i<n&&free.length;i++){
      const k=Math.floor(Math.random()*free.length), rc=free.splice(k,1)[0];
      run.grid[rc[0]][rc[1]]={t:i<2?"elite":"dungeon",
        waves:i<2?1:1+Math.floor(Math.random()*3),
        style:rnd(DUN_STYLE),loot:rnd(DUN_LOOT)};
    }
    if(n) toast("정복하지 않은 전투 칸이 사라지고, 새 전투 칸이 나타났습니다.");
  }
}
